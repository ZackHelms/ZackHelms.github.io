<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ember Depths</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap');
:root {
  --bg:#06060e; --panel:#0b0b16; --border:#1a1a30;
  --green:#39ff14; --gold:#ffc300; --blue:#4488ff; --red:#ff2244;
  --white:#dde3ff; --dim:#8899bb; --purple:#b44fff;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--white);
  font-family:'Share Tech Mono', monospace;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  position:fixed; inset:0;
}
#cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
#back-btn {
  position:absolute; top:calc(var(--sat) + 8px); left:10px; z-index:45;
  background:var(--panel); border:1px solid var(--border); border-radius:6px;
  color:var(--white); font-size:16px; width:38px; height:34px; line-height:32px;
  text-align:center; text-decoration:none; touch-action:manipulation;
}
#mute {
  position:absolute; top:calc(var(--sat) + 8px); left:56px; z-index:45;
  background:var(--panel); border:1px solid var(--border); border-radius:6px;
  color:var(--white); font-size:16px; width:38px; height:34px; line-height:30px;
  text-align:center; padding:0; touch-action:manipulation;
}
/* The WHOLE chrome row sits above the settings scrim (z 45 vs 40), not just
   the cogwheel: the cog needs it to stay a toggle, and games/CLAUDE.md
   § Chrome above overlays requires ← and the mute button to outrank every
   full-screen overlay — a player must always be one tap from leaving or
   silencing the game, which an opened panel would otherwise cost them. */
#cog {
  position:absolute; top:calc(var(--sat) + 8px); left:102px; z-index:45;
  background:var(--panel); border:1px solid var(--border); border-radius:6px;
  color:var(--white); font-size:16px; width:38px; height:34px; line-height:30px;
  text-align:center; padding:0; touch-action:manipulation;
}
#cog.on { border-color:#ff9a3c; color:#ff9a3c; }
/* Settings layers over whatever is underneath (title, relic choice, live floor)
   rather than replacing it — closing restores the view with no state to keep.
   The full-bleed scrim also stops a stray tap reaching the board behind it. */
#settings {
  position:absolute; inset:0; z-index:40; display:flex;
  align-items:center; justify-content:center;
  background:rgba(4,3,6,0.88); padding:20px;
  padding-top:calc(var(--sat) + 20px); padding-bottom:calc(var(--sab) + 20px);
}
#settings.hidden { display:none; }
.set-panel {
  background:linear-gradient(160deg, #191412, #0b0a10);
  border:1px solid #6b4a2a; border-radius:12px;
  padding:18px 20px 14px; width:min(88vw, 330px);
}
.set-panel h2 {
  font-family:'Black Ops One', sans-serif; color:#ff9a3c;
  font-size:1.05rem; letter-spacing:3px; text-align:center; margin-bottom:14px;
}
.setrow { display:flex; align-items:center; gap:10px; margin:14px 0; }
.setrow .lbl {
  font-family:'Black Ops One', sans-serif; font-size:0.58rem; letter-spacing:2px;
  color:var(--dim); width:84px; flex:0 0 84px;
}
.setrow input[type=range] {
  flex:1 1 auto; min-width:0; height:26px;
  accent-color:#ff9a3c; touch-action:pan-y;
}
.setrow .val {
  font-family:'Share Tech Mono', monospace; font-size:0.68rem; color:var(--gold);
  width:38px; flex:0 0 38px; text-align:right;
}
.set-note {
  color:var(--dim); font-size:0.6rem; line-height:1.6; text-align:center;
  margin:10px 2px 4px;
}
.set-note em { color:#ff9a3c; font-style:normal; }
#settings .btn { min-width:0; width:100%; margin:8px 0 0; font-size:0.85rem; padding:11px 0; }
#overlay {
  position:absolute; inset:0; z-index:20; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  background:rgba(4,3,6,0.9); padding:20px; text-align:center;
  padding-top:calc(var(--sat) + 20px); padding-bottom:calc(var(--sab) + 20px);
  overflow-y:auto;
}
#overlay.hidden { display:none; }
/* A centred flex column that also scrolls CLIPS its own overflow at the top:
   with justify-content:center the first rows sit ABOVE the scroll origin and
   cannot be reached at any scroll position. This is not a camp-screen problem
   — it bit the TITLE screen in landscape, where the heading was 9-24px out of
   reach on every phone tested — so the fix is structural rather than a class
   somebody has to remember: flex-start plus auto margins on the end children.
   Short content still centres (the autos absorb the slack); tall content pins
   to the top with every row reachable, because auto margins collapse to zero
   once there is no slack left. */
#overlay { justify-content:flex-start; }
#overlay > :first-child { margin-top:auto; }
#overlay > :last-child { margin-bottom:auto; }
/* Camp screens are lists to read down, so they always start at the top — and
   clear the ← / 🔊 / ⚙ chrome row, which outranks every overlay. */
#overlay.top { padding-top:calc(var(--sat) + 54px); }
#overlay.top > :first-child { margin-top:0; }
#overlay h1 {
  font-family:'Black Ops One', sans-serif; color:#ff9a3c;
  font-size:clamp(1.7rem, 8vw, 2.5rem); letter-spacing:4px;
  text-shadow:0 0 30px #ff6a0088, 0 0 8px #ffc30055; margin-bottom:4px;
}
#overlay h2 {
  font-family:'Black Ops One', sans-serif; color:var(--gold);
  font-size:1.4rem; letter-spacing:3px; margin-bottom:8px;
}
.sub { color:var(--dim); font-size:0.68rem; letter-spacing:3px; margin-bottom:18px; }
.btn {
  font-family:'Black Ops One', sans-serif; letter-spacing:2px;
  background:var(--panel); color:#ff9a3c;
  border:1px solid #ff9a3c; border-radius:8px;
  font-size:1.0rem; padding:13px 30px; margin:7px; min-width:250px;
  touch-action:manipulation; cursor:pointer;
}
.btn.gold { color:var(--gold); border-color:var(--gold); }
.relic-card {
  font-family:'Share Tech Mono', monospace; text-align:left;
  background:linear-gradient(160deg, #191412, #0c0a09);
  color:var(--white); border:1px solid #6b4a2a; border-radius:10px;
  font-size:0.8rem; padding:14px 18px; margin:8px; min-width:270px; max-width:320px;
  touch-action:manipulation; cursor:pointer;
}

.stat { color:var(--white); font-size:0.85rem; margin:3px 0; letter-spacing:1px; }
.stat b { color:var(--gold); }
.howto { color:var(--dim); font-size:0.7rem; max-width:320px; line-height:1.7; margin-top:16px; }
.howto em { color:#ff9a3c; font-style:normal; }
/* ---- Camp (between-delve hub) + character slots -------------------------
   All left-aligned inside the centred #overlay column: these are lists to
   read down, not a title screen. Rows are plain buttons carrying data-act,
   bound in one sweep after every render (see bindCamp). */
.camp { width:100%; max-width:370px; text-align:left; }
.camp-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:2px; }
.camp-name { font-family:'Black Ops One', sans-serif; color:#ff9a3c; letter-spacing:2px; font-size:1.0rem; }
.camp-res { color:var(--gold); font-size:0.78rem; white-space:nowrap; }
.camp-res .sp { color:var(--purple); margin-left:8px; }
.camp-sub { color:var(--dim); font-size:0.62rem; letter-spacing:2px; margin-bottom:10px; }
.tabs { display:flex; gap:6px; margin:10px 0 4px; }
.tab {
  flex:1 1 0; min-width:0; padding:10px 2px; text-align:center; border-radius:7px;
  font-family:'Black Ops One', sans-serif; font-size:0.66rem; letter-spacing:1px;
  background:var(--panel); border:1px solid var(--border); color:var(--dim);

}
.tab.on { color:#ff9a3c; border-color:#ff9a3c; }
.row {
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:linear-gradient(160deg, #171219, #0b0a10);
  border:1px solid #2a2233; border-radius:9px; padding:10px 11px; margin:7px 0;
  font-family:'Share Tech Mono', monospace; color:var(--white);
  touch-action:manipulation; cursor:pointer;
}
.row.locked { opacity:0.45; }
.row.maxed { border-color:#2f5a33; }
.row-ico { font-size:1.15rem; color:var(--gold); width:20px; text-align:center; flex:0 0 auto; }
.row-txt { flex:1 1 auto; min-width:0; }
.row-txt b { display:block; font-family:'Black Ops One', sans-serif; font-size:0.72rem; letter-spacing:1px; color:var(--white); }
.row-txt span { display:block; color:var(--dim); font-size:0.66rem; line-height:1.5; margin-top:2px; }

.price {
  flex:0 0 auto; min-width:70px; text-align:center; padding:9px 8px; border-radius:7px;

  background:#0d0b12; border:1px solid var(--gold); color:var(--gold);
}
.price.no { border-color:var(--border); color:var(--dim); }

.tree { width:100%; height:auto; display:block; margin:6px 0 2px; touch-action:manipulation; }
.tree .sk { cursor:pointer; }
.sk-card {
  background:linear-gradient(160deg, #171219, #0b0a10); border:1px solid #ff9a3c;
  border-radius:9px; padding:11px 12px; margin-top:4px;
}
.sk-card b { display:block; font-family:'Black Ops One', sans-serif; font-size:0.76rem; letter-spacing:1px; color:var(--gold); }
.sk-card span { display:block; color:var(--dim); font-size:0.68rem; line-height:1.5; margin-top:3px; }
.sk-card .now { color:#6fd8a0; }
.sk-card .no { color:#ff7a88; }
.btn[disabled] { opacity:0.38; border-color:var(--border); color:var(--dim); }
.pips { color:#ff9a3c; letter-spacing:3px; font-size:0.72rem; }
.pips i { color:#3a3040; font-style:normal; }
.depth-pick { display:flex; gap:5px; align-items:stretch; margin-top:14px; }
.dbtn {
  flex:0 0 auto; width:40px; border-radius:7px; background:var(--panel);
  border:1px solid var(--border); color:#ff9a3c; font-size:0.75rem;
  touch-action:manipulation; cursor:pointer;
}
.dbtn[disabled] { opacity:0.3; color:var(--dim); }
.dnum {
  flex:1 1 auto; min-width:0; border-radius:7px; padding:8px 4px;
  background:var(--panel); border:1px solid #ff9a3c; color:var(--white);
  font-family:'Share Tech Mono', monospace; font-size:0.66rem; letter-spacing:1px;
  touch-action:manipulation; cursor:pointer;
}
.dnum b { color:var(--gold); font-size:0.9rem; }
.dnum i { display:block; color:var(--dim); font-size:0.58rem; font-style:normal; margin-top:2px; }
.camp-foot { display:flex; gap:8px; margin-top:14px; }
.camp-foot .btn { flex:1 1 0; min-width:0; margin:0; padding:13px 4px; font-size:0.82rem; }
.name-input {
  width:100%; background:#0d0b12; border:1px solid #ff9a3c; border-radius:7px; color:var(--white);
  font-family:'Black Ops One', sans-serif; letter-spacing:2px; font-size:0.9rem;
  padding:11px 12px; margin:8px 0; text-align:center; text-transform:uppercase;
}
.empty-note { color:var(--dim); font-size:0.66rem; line-height:1.6; margin:6px 0 2px; }
</style>

<body>
<div id="build-badge" style="position:fixed;top:2px;right:6px;z-index:2147483647;font-family:'Courier New',monospace;font-size:9px;color:#888;opacity:0.55;pointer-events:none;letter-spacing:0.5px;user-select:none;">build 2026-08-27 00:20 UTC</div>
<a id="back-btn" href="../index.html" aria-label="Back to games">←</a>
<button id="mute">🔊</button>
<button id="cog" aria-label="Settings">&#9881;</button>
<canvas id="cv"></canvas>
<div id="overlay"></div>
<div id="settings" class="hidden">
  <div class="set-panel">
    <h2>SETTINGS</h2>
    <div class="setrow">
      <span class="lbl">MUSIC</span>
      <input type="range" id="vol-music" min="0" max="100" step="5" value="100" aria-label="Music volume">
      <span class="val" id="vol-music-val">100%</span>
    </div>
    <div class="setrow">
      <span class="lbl">SFX</span>
      <input type="range" id="vol-sfx" min="0" max="100" step="5" value="100" aria-label="Sound effects volume">
      <span class="val" id="vol-sfx-val">100%</span>
    </div>
    <div class="set-note"><em>Pinch</em> the board to zoom; <em>drag</em> to look anywhere on the map, then <em>&#8982;</em> to snap back to your hero. <em>Tap the relic row</em> for what each one does, or a <em>supply</em> on the left to use it.</div>
    <button class="btn" id="set-close">CLOSE</button>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   EMBER DEPTHS — torchlit turn-based roguelike.
   Tap to move (BFS pathing), bump to attack; enemies act per player turn.
   Permadeath; relic builds; procedural floors; realistic torchlight
   rendering (light map + ember particles + textured stone).
   ===================================================================== */

/* ============ Board constants ============ */
const COLS = 11, ROWS = 16;
const IDX = (x, y) => y * COLS + x;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

/* ============ State (top-level: reachable from page.evaluate) ============ */
let state = 'menu';        // menu | play | relic | descend | dead
let grid = new Uint8Array(COLS * ROWS);   // 0 floor, 1 wall
let seen = new Uint8Array(COLS * ROWS);
let lit = new Uint8Array(COLS * ROWS);
let floorNum = 1;
let gold = 0, kills = 0, turnCount = 0;
let player = { x: 5, y: 8, vx: 5, vy: 8, hp: 12, maxHp: 12, atk: 3, face: 1 };
let enemies = [];          // {id,x,y,vx,vy,hp,maxHp,atk,type,aggro,seed}
let items = [];            // {x,y,type:'gold'|'heart', amt}
let torches = [];          // {x,y,seed}
let stairs = { x: 0, y: 0 };
let chest = { x: -1, y: -1, opened: true };
let traps = [];            // {x,y,type,sprung} — hazards, visible once lit
let statuses = { stun: 0, venom: 0, gloom: 0, frail: 0, slow: 0 };  // turns remaining
let killStreak = 0;        // BLOODLETTER's per-floor attack stack
let relics = [];           // relic keys owned
let wardTimer = 0;         // ember-ward recharge countdown (0 = ready)
// Stacked wards recharge faster rather than stacking shields, so a second
// copy is a real upgrade without letting a build eat three hits a turn.
function wardRecharge() { return Math.max(2, 8 - 2 * relicCount('ward')); }
let pathQueue = [];        // queued [x,y] steps from a tap
let attackTargetId = -1;
let pathT = 0;
let visibleEnemiesAtPathStart = new Set();
let descendT = -1;         // descend fade animation
let introT = 0;            // "DEPTH n" banner timer
let shakeT = 0;
let enemyIdSeq = 1;
let seedSalt = 0;          // test hook: non-zero makes floor generation reproducible
let buffPanel = false;     // relic detail panel open? (a pure overlay: no turn passes)
let buffRect = null;       // HUD hotspot for the relic row, in screen px (null = no relics)
let recenterBtn = null;    // ⌖ button circle, in screen px (null = not shown)
let useBtns = [];          // consumable buttons, in screen px (rebuilt each frame)

/* ============ Difficulty curve ============
   Every number the dungeon gets harder by lives here, unbounded on purpose:
   the CD's spec is "no ceiling", so HP and attack are MULTIPLIERS on depth
   rather than a table that runs out. A fresh delver averages ~depth 8; a
   fully geared and skilled one goes far deeper but still, eventually, dies.
   Tuned against .claude/tests/eval-ember-depths.cjs — change a number here
   and re-run it rather than guessing. */
const CURVE = {
  playerHp: 20, playerAtk: 3,     // what a delver starts with, before any kit
  base: {                          // enemy stats at depth 1
    slime: { hp: 4, atk: 2 }, bat: { hp: 2, atk: 1 }, archer: { hp: 4, atk: 2 },
    brute: { hp: 9, atk: 4 }, wraith: { hp: 6, atk: 3 },
  },
  hearts: 2, heartsVar: 1, heartAmt: 5,   // ri(hearts, hearts+heartsVar) hearts, worth heartAmt
  // Enemy stats bend upward: the linear term sets how fast the early floors
  // tighten, the quadratic one is what makes the deep dark eventually beat any
  // build. Keep the linear term gentle and let the square do the killing —
  // that is the difference between "hard at 3" and "hard at 30".
  hpMul: 0.11, hpQuad: 0.006,    // enemy HP  = base * (1 + (n-1)*hpMul + (n-1)^2*hpQuad)
  atkMul: 0.07, atkQuad: 0.004,  // enemy atk likewise
  countBase: 2,
  count: 0.4,         // enemies   = countBase + n*count
  countCap: 13,
  eliteFrom: 4,       // depth the first elites appear
  eliteMul: 0.055,    // elite chance per enemy = (n - eliteFrom) * eliteMul
  eliteCap: 0.4,
  trapFrom: 2,
  trapPer: 0.55,      // traps = (n - trapFrom + 1) * trapPer
  trapCap: 9,
  goldPer: 0.9,       // gold pile bonus per depth — deep farming has to pay
};
function depthHp(base, n) {
  const k = n - 1;
  return Math.max(1, Math.round(base * (1 + k * CURVE.hpMul + k * k * CURVE.hpQuad)));
}
function depthAtk(base, n) {
  const k = n - 1;
  return Math.max(1, Math.round(base * (1 + k * CURVE.atkMul + k * k * CURVE.atkQuad)));
}

/* ============ Traps ============
   A trap is a one-shot hazard: it springs when you step on it and then stays
   on the board, sprung and harmless, as a scar. Everything but SPIKE PIT
   works by putting turns on `statuses`, which is the only status system in
   the game — see tickStatuses(). */
const TRAPS = {
  spike: { name: 'SPIKE PIT',   icon: '▲', col: '#ff5566', from: 2, verb: 'SPIKES' },
  snare: { name: 'IRON SNARE',  icon: '✖', col: '#88ccff', from: 3, verb: 'SNARED' },
  venom: { name: 'VENOM VENT',  icon: '≈', col: '#6fd8a0', from: 4, verb: 'POISONED' },
  tar:   { name: 'TAR SEEP',    icon: '≋', col: '#c98a3c', from: 5, verb: 'MIRED' },
  gloom: { name: 'GLOOM GLYPH', icon: '◍', col: '#b44fff', from: 6, verb: 'BLINDED' },
  frail: { name: 'WITHER RUNE', icon: '⌇', col: '#ffc300', from: 7, verb: 'WITHERED' },
};
const STATUS_META = {
  stun:  { icon: '✖', col: '#88ccff', name: 'STUNNED' },
  venom: { icon: '≈', col: '#6fd8a0', name: 'POISONED' },
  tarry: { icon: '≋', col: '#c98a3c', name: 'MIRED' },
  gloom: { icon: '◍', col: '#b44fff', name: 'BLINDED' },
  frail: { icon: '⌇', col: '#ffc300', name: 'WITHERED' },
};
function trapAt(x, y) { return traps.find((t) => t.x === x && t.y === y) || null; }
function clearStatuses() { statuses = { stun: 0, venom: 0, gloom: 0, frail: 0, slow: 0 }; }
// TRAPWISE halves every duration and every spike, which is the one skill that
// answers a whole mechanic rather than a number.
function trapSoften(v) { return rank('trapwise') ? Math.max(1, Math.floor(v / 2)) : v; }
function springTrap(t) {
  if (t.sprung) return;
  t.sprung = true;
  const meta = TRAPS[t.type];
  addFloat(t.x, t.y, meta.verb, meta.col);
  shakeT = Math.max(shakeT, 0.25);
  if (t.type === 'spike') {
    hurtPlayer(trapSoften(Math.max(2, Math.round(2 + floorNum * 0.45))), t.x, t.y);
  } else if (t.type === 'snare') { statuses.stun += trapSoften(2); sfxBlock(); }
  else if (t.type === 'venom') { statuses.venom += trapSoften(6); sfxHurt(); }
  else if (t.type === 'tar')   { statuses.slow  += trapSoften(6); sfxChest(); }
  else if (t.type === 'gloom') { statuses.gloom += trapSoften(10); sfxArrow(); }
  else if (t.type === 'frail') { statuses.frail += trapSoften(8); sfxArrow(); }
}
// Ticked once per player turn, AFTER the turn is counted and BEFORE the
// enemies move — so a poisoned delver bleeds on their own clock, not theirs.
function tickStatuses() {
  if (statuses.venom > 0) {
    statuses.venom--;
    player.hp -= 1;
    addFloat(player.x, player.y, '-1', '#6fd8a0');
  }
  if (statuses.stun > 0) statuses.stun--;
  if (statuses.gloom > 0) statuses.gloom--;
  if (statuses.frail > 0) statuses.frail--;
  if (statuses.slow > 0) statuses.slow--;
}

const RELICS = {
  blade:   { name: 'SEARING BLADE',  icon: '⚔', desc: '+2 attack. The edge still remembers the forge.' },
  leech:   { name: 'LEECH FANG',     icon: '♦', desc: 'Heal 1 HP on every kill.' },
  skin:    { name: 'STONE SKIN',     icon: '◆', desc: 'Take 1 less damage from every hit (min 1).' },
  ward:    { name: 'EMBER WARD',     icon: '◉', desc: 'A shield blocks one hit, recharges every 6 turns.' },
  lantern: { name: "MINER'S LANTERN", icon: '☀', desc: 'Your light reaches half again as far.' },
  crown:   { name: 'VAMPIRIC CROWN', icon: '♛', desc: '+2 max HP and heal 2 each time you descend.' },
};

/* Relics are a list, not a set, so the same relic taken twice counts twice.
   Everything player-facing aggregates through here: one row per relic kind,
   with the number of copies. */
function relicCount(key) { let n = 0; for (const k of relics) if (k === key) n++; return n; }
function relicCounts() {
  const out = [];
  for (const k of relics) {
    const hit = out.find((o) => o.key === k);
    if (hit) hit.n++; else out.push({ key: k, n: 1 });
  }
  return out;
}

/* ============ RNG ============ */
let rngS = 1234567;
function rnd() { rngS = (rngS * 1103515245 + 12345) & 0x7fffffff; return rngS / 0x7fffffff; }
function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }

/* ============ Persistence ============ */
function bestDepth() { return parseInt(localStorage.getItem('emberDepths.bestDepth') || '0', 10) || 0; }
function bestGold() { return parseInt(localStorage.getItem('emberDepths.bestGold') || '0', 10) || 0; }
function persistBests() {
  try {
    if (floorNum > bestDepth()) localStorage.setItem('emberDepths.bestDepth', String(floorNum));
    if (gold > bestGold()) localStorage.setItem('emberDepths.bestGold', String(gold));
  } catch (err) {}
}

    desc: () => '+2 attack, +6 max HP, +1 light, and LAST STAND recharges on every descent.' },

const SKILL_ROWS = 6, SKILL_COLS = 5;

/* Consumables are the recurring sink: bought in camp, carried in, and lost
   with the body whether or not they were used. */
const CONSUMABLES = {
  draught: { name: 'HEALING DRAUGHT', icon: '✚', cost: 30, max: 3, desc: 'Restores 8 HP.' },
  bomb:    { name: 'FIREBOMB',        icon: '✷', cost: 45, max: 3, desc: 'Burns every enemy within 2 tiles for 5.' },
  dust:    { name: 'FARSIGHT DUST',   icon: '✧', cost: 35, max: 3, desc: 'Maps the whole floor, stairs and all.' },
};
const CONSUMABLE_KEYS = Object.keys(CONSUMABLES);

const NAME_A = ['ASH', 'EMBER', 'SOOT', 'CINDER', 'DUSK', 'GRIM', 'HOLLOW', 'IRON', 'PALE', 'RUST'];
const NAME_B = ['WARDEN', 'DELVER', 'VEIN', 'LANTERN', 'MARROW', 'THORN', 'CROW', 'KETTLE', 'FLINT', 'WICK'];
function rollName() {
  return NAME_A[Math.floor(Math.random() * NAME_A.length)] + ' ' +
         NAME_B[Math.floor(Math.random() * NAME_B.length)];
}

function newCharacter(name) {
  return {
    name: (name || rollName()).toUpperCase().slice(0, 14),
    gold: 0, sp: 0, startFloor: 1,
    gear: { weapon: 0, armor: 0, lantern: 0, charm: 0 },
    skills: {}, supplies: {},
    // `deepest` is the deepest floor ever FINISHED, which is what pays skill
    // points; `bestDepth` is the deepest ever stood on, which is what unlocks
    // the starting depth. They differ by one on the floor that kills you.
    stats: { bestDepth: 0, deepest: 0, spAwarded: 0, runs: 0, kills: 0, gold: 0 },
  };
}
// Never trust a stored blob field-by-field: rebuild a valid character and
// copy across only what is in range. A save edited by hand, or written by an
// older build, then costs a clamp rather than a crash mid-delve.
function migrate(raw) {
  const c = newCharacter(typeof raw.name === 'string' ? raw.name : '');
  c.gold = Math.max(0, Math.floor(+raw.gold || 0));
  c.sp = Math.max(0, Math.floor(+raw.sp || 0));
  const g = raw.gear || {};
  for (const k in c.gear) c.gear[k] = Math.max(0, Math.min(GEAR[k].tiers.length - 1, Math.floor(+g[k] || 0)));
  // Skills moved from three trees to one DAG on 2026-08-26; an old blob's
  // 'tree.node' keys simply do not match and are dropped, which is why the
  // character keeps its points as `sp` refunded below rather than losing them.
  const sk = raw.skills || {};
  let known = 0;
  for (const node of SKILLS) {
    const v = Math.max(0, Math.min(node.max, Math.floor(+sk[node.key] || 0)));
    if (v) { c.skills[node.key] = v; known += v * (v + 1) / 2; }
  }
  // Points from the pre-2026-08-26 three-tree schema come back as unspent SP.
  // CLAMPED, twice: a stored rank is capped before it is triangulated and the
  // whole refund is capped again, because this is the one path that turns an
  // untrusted number straight into currency — `{"might.edge": 99}` in a
  // hand-edited save would otherwise be 4950 skill points.
  const LEGACY_RANK_CAP = 3, LEGACY_REFUND_CAP = 40;
  let legacy = 0;
  for (const k in sk) {
    if (k.indexOf('.') <= 0) continue;
    const v = Math.max(0, Math.min(LEGACY_RANK_CAP, Math.floor(+sk[k] || 0)));
    legacy += v * (v + 1) / 2;
  }
  if (legacy) c.sp += Math.min(LEGACY_REFUND_CAP, legacy);
  const sup = raw.supplies || {};
  for (const k of CONSUMABLE_KEYS) {
    const v = Math.max(0, Math.min(CONSUMABLES[k].max, Math.floor(+sup[k] || 0)));
    if (v) c.supplies[k] = v;
  }
  const st = raw.stats || {};
  c.stats = {
    bestDepth: Math.max(0, Math.floor(+st.bestDepth || 0)),
    deepest: Math.max(0, Math.floor(+st.deepest || 0)),
    spAwarded: Math.max(0, Math.floor(+st.spAwarded || 0)),
    runs: Math.max(0, Math.floor(+st.runs || 0)),
    kills: Math.max(0, Math.floor(+st.kills || 0)),
    gold: Math.max(0, Math.floor(+st.gold || 0)),
  };
  c.startFloor = Math.max(1, Math.min(Math.max(1, c.stats.bestDepth), Math.floor(+raw.startFloor || 1)));
  return c;
}
function loadSlots() {
  slots = [null, null, null];
  try {
    const raw = JSON.parse(localStorage.getItem(SLOT_KEY) || 'null');
    if (Array.isArray(raw)) {
      for (let i = 0; i < SLOT_COUNT; i++) if (raw[i] && typeof raw[i] === 'object') slots[i] = migrate(raw[i]);
    }
  } catch (err) { /* a corrupt blob starts three empty slots, never a crash */ }
}
function saveSlots() { try { localStorage.setItem(SLOT_KEY, JSON.stringify(slots)); } catch (err) {} }

/* ---- the active character, and everything derived from it --------------
   Every one of these returns a harmless zero with no character selected, so
   the title screen's background dungeon runs on the base kit. */
function chr() { return activeSlot >= 0 ? slots[activeSlot] : null; }
function gearTier(k) { const c = chr(); return c ? c.gear[k] : 0; }
function gearStat(k, field) { const t = GEAR[k].tiers[gearTier(k)]; return (t && t[field]) || 0; }
function rank(key) { const c = chr(); return c ? (c.skills[key] || 0) : 0; }
function skillNode(key) { return SKILLS.find((n) => n.key === key); }
// THE prerequisite rule: every node with an arrow into this one needs at
// least one point. A root has no inputs, so it is open from the first point.
function skillOpen(key) { return skillNode(key).in.every((k) => rank(k) > 0); }
function skillCost(key) { return rank(key) + 1; }   // rank r costs r
function skillsSpent() {
  let n = 0;
  for (const node of SKILLS) { const r = rank(node.key); n += r * (r + 1) / 2; }
  return n;
}
// Forgetting is priced off what is invested, so an early rethink is cheap and
// unpicking a finished build is a real decision.
function respecCost() { return 40 + 30 * skillsSpent(); }

function metaAtk() { return gearStat('weapon', 'atk') + rank('edge') + rank('sovereign') * 2; }
function metaMaxHp() { return gearStat('armor', 'hp') + rank('hide') * 2 + rank('sovereign') * 6; }
function metaDR() { return gearStat('armor', 'dr') + rank('bones'); }
function metaLight() { return gearStat('lantern', 'light') + rank('lantern') * 0.7 + rank('sovereign'); }
function goldMult() { return 1 + gearStat('charm', 'gold') + rank('prospect') * 0.25; }
function descendHeal() { return gearStat('charm', 'heal') + rank('wind') * 3; }
function marksStairs() { return gearStat('charm', 'reveal') > 0 || rank('carto') > 0; }
function damageCap() { return rank('unbroken') ? 4 : Infinity; }

/* Skill points are the scarce currency: ONE for every fifth floor, the first
   time that floor is finished. Farming pays gold, never points — which is
   what lets the starting depth be generous without cheapening the tree.
   Idempotent by construction: the award is (deepest/5) minus what has already
   been paid, so re-finishing a floor pays nothing. */
const SP_EVERY = 5;
function awardMilestones() {
  const c = chr();
  if (!c) return 0;
  const owed = Math.floor(c.stats.deepest / SP_EVERY) - c.stats.spAwarded;
  if (owed <= 0) return 0;
  c.sp += owed;
  c.stats.spAwarded += owed;
  saveSlots();
  return owed;
}
// You may start at any depth you have ever stood on. Sticky per character.
function maxStartFloor() { const c = chr(); return c ? Math.max(1, c.stats.bestDepth) : 1; }
function startFloorOf() {
  const c = chr();
  if (!c) return 1;
  return Math.max(1, Math.min(maxStartFloor(), c.startFloor || 1));
}

/* What the delve pays out — gold only. The depth bonus counts floors below
   where you STARTED, so diving in at depth 30 and dying on arrival pays what
   it deserves: nothing. */
let runStartFloor = 1;
function bankRun() {
  const c = chr();
  if (!c) return null;
  const depthBonus = Math.max(0, floorNum - runStartFloor) * 10;
  const earned = gold + depthBonus;
  const newBest = floorNum > c.stats.bestDepth;
  c.gold += earned;
  c.stats.bestDepth = Math.max(c.stats.bestDepth, floorNum);
  c.stats.runs++;
  c.stats.kills += kills;
  c.stats.gold += earned;
  c.supplies = {};      // what you carried in went down with you
  saveSlots();
  return { earned, depthBonus, newBest };
}

/* ============ Floor generation (drunkard-walk carve: always connected) ============ */
function genFloor(n) {
  grid.fill(1); seen.fill(0); lit.fill(0);
  items = []; torches = []; enemies = []; traps = []; pathQueue = []; attackTargetId = -1;
  clearStatuses(); killStreak = 0;
  // `seedSalt` is a test hook: with it set, a floor is reproducible, which is
  // what lets the balance eval compare curves rather than luck. Zero (the
  // shipping value) falls back to the clock.
  rngS = (n * 7919 + (seedSalt || Date.now())) & 0x7fffffff;
  let cx = ri(3, COLS - 4), cy = ri(4, ROWS - 5);
  const target = Math.floor(COLS * ROWS * 0.42);
  let carved = 0;
  grid[IDX(cx, cy)] = 0; carved++;
  const startX = cx, startY = cy;
  let guard = 60000;
  while (carved < target && guard-- > 0) {
    const d = DIRS[ri(0, 3)];
    const nx = cx + d[0], ny = cy + d[1];
    if (nx < 1 || nx > COLS - 2 || ny < 1 || ny > ROWS - 2) continue;
    cx = nx; cy = ny;
    if (grid[IDX(cx, cy)] === 1) { grid[IDX(cx, cy)] = 0; carved++; }
  }
  player.x = startX; player.y = startY; player.vx = startX; player.vy = startY;
  // BFS distances from start over floor
  const dist = bfsMap(startX, startY, (x, y) => grid[IDX(x, y)] === 0);
  const floorCells = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
    if (grid[IDX(x, y)] === 0 && dist[IDX(x, y)] >= 0) floorCells.push({ x, y, d: dist[IDX(x, y)] });
  floorCells.sort((a, b) => b.d - a.d);
  stairs = { x: floorCells[0].x, y: floorCells[0].y };
  // chest on a mid-far cell
  const far = floorCells.filter(c => c.d >= 4 && !(c.x === stairs.x && c.y === stairs.y));
  const cc = far.length ? far[ri(0, Math.min(far.length - 1, 8))] : floorCells[1];
  chest = { x: cc.x, y: cc.y, opened: false };
  // torches on wall cells adjacent to floor
  const wallC = [];
  for (let y = 1; y < ROWS - 1; y++) for (let x = 1; x < COLS - 1; x++) {
    if (grid[IDX(x, y)] !== 1) continue;
    if (DIRS.some(d => grid[IDX(x + d[0], y + d[1])] === 0)) wallC.push({ x, y });
  }
  for (let i = 0; i < wallC.length; i++) {
    if (torches.length < 9 && rnd() < 0.12) torches.push({ x: wallC[i].x, y: wallC[i].y, seed: rnd() * 100 });
  }
  // items
  const free = () => {
    for (let t = 0; t < 200; t++) {
      const c = floorCells[ri(1, floorCells.length - 1)];
      if ((c.x === stairs.x && c.y === stairs.y) || (c.x === chest.x && c.y === chest.y)) continue;
      if (items.some(it => it.x === c.x && it.y === c.y)) continue;
      if (enemies.some(e => e.x === c.x && e.y === c.y)) continue;
      if (c.x === player.x && c.y === player.y) continue;
      return c;
    }
    return null;
  };
  const nGold = ri(4, 6);
  const goldBonus = Math.floor(n * CURVE.goldPer);
  for (let i = 0; i < nGold; i++) { const c = free(); if (c) items.push({ x: c.x, y: c.y, type: 'gold', amt: ri(3, 8) + goldBonus }); }
  const nHeart = ri(CURVE.hearts, CURVE.hearts + CURVE.heartsVar);
  for (let i = 0; i < nHeart; i++) { const c = free(); if (c) items.push({ x: c.x, y: c.y, type: 'heart', amt: CURVE.heartAmt }); }
  // enemies (spawn at distance >= 5 from player)
  const types = ['slime', 'slime', 'bat'];
  if (n >= 2) types.push('archer');
  if (n >= 3) types.push('archer', 'bat');
  if (n >= 4) types.push('brute');
  if (n >= 6) types.push('wraith');
  const count = Math.min(CURVE.countCap, CURVE.countBase + Math.floor(n * CURVE.count));
  let tries = 400;
  while (enemies.length < count && tries-- > 0) {
    const c = floorCells[ri(1, floorCells.length - 1)];
    if (c.d < 5) continue;
    if (enemies.some(e => e.x === c.x && e.y === c.y)) continue;
    if ((c.x === stairs.x && c.y === stairs.y) || (c.x === chest.x && c.y === chest.y)) continue;
    spawnEnemy(types[ri(0, types.length - 1)], c.x, c.y, n);
  }
  // traps — never under the player, the chest or the stairs, and never on the
  // player's own cell, so a floor can't open by killing you.
  const trapPool = Object.keys(TRAPS).filter((k) => n >= TRAPS[k].from);
  if (trapPool.length) {
    const nTrap = Math.min(CURVE.trapCap, Math.floor((n - CURVE.trapFrom + 1) * CURVE.trapPer));
    let tt = 300;
    while (traps.length < nTrap && tt-- > 0) {
      const c = floorCells[ri(1, floorCells.length - 1)];
      if (c.d < 3) continue;
      if ((c.x === stairs.x && c.y === stairs.y) || (c.x === chest.x && c.y === chest.y)) continue;
      if (traps.some((t) => t.x === c.x && t.y === c.y)) continue;
      if (items.some((it) => it.x === c.x && it.y === c.y)) continue;
      traps.push({ x: c.x, y: c.y, type: trapPool[ri(0, trapPool.length - 1)], sprung: false });
    }
  }
  recomputeVision();
  buffPanel = false;
  // CARTOGRAPHER / the Deepseeker Idol mark the stairs on arrival: `seen`
  // is the map layer, so one cell of it is the whole feature.
  if (marksStairs()) seen[IDX(stairs.x, stairs.y)] = 1;
  centerCam();   // a zoomed-in view should open on the player, not last floor's corner
  introT = 1.6;
}
function spawnEnemy(type, x, y, n) {
  const base = CURVE.base[type];
  let hp = depthHp(base.hp, n), atk = depthAtk(base.atk, n);
  // An elite is the same silhouette wearing more of the depth: it keeps the
  // type's behaviour, so it never surprises you with a rule you don't know.
  const eliteChance = Math.min(CURVE.eliteCap, Math.max(0, (n - CURVE.eliteFrom) * CURVE.eliteMul));
  const elite = rnd() < eliteChance;
  if (elite) { hp = Math.round(hp * 1.6); atk += 1; }
  enemies.push({
    id: enemyIdSeq++, x, y, vx: x, vy: y, type, aggro: false, seed: rnd() * 100,
    hp, maxHp: hp, atk, hurtT: 0, elite,
  });
}

/* ============ Grid helpers ============ */
function bfsMap(sx, sy, passFn) {
  const dist = new Int16Array(COLS * ROWS).fill(-1);
  const q = [[sx, sy]]; dist[IDX(sx, sy)] = 0;
  while (q.length) {
    const [x, y] = q.shift();
    for (const d of DIRS) {
      const nx = x + d[0], ny = y + d[1];
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      if (dist[IDX(nx, ny)] !== -1 || !passFn(nx, ny)) continue;
      dist[IDX(nx, ny)] = dist[IDX(x, y)] + 1;
      q.push([nx, ny]);
    }
  }
  return dist;
}
function losClear(x0, y0, x1, y1) {
  // Bresenham; blocked if an intermediate cell is wall
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy;
  let x = x0, y = y0;
  while (!(x === x1 && y === y1)) {
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
    if (x === x1 && y === y1) break;
    if (grid[IDX(x, y)] === 1) return false;
  }
  return true;
}
function enemyAt(x, y) { return enemies.find(e => e.x === x && e.y === y) || null; }
function lightRadius() {
  const r = Math.min(9, 3.6 + 1.6 * relicCount('lantern') + metaLight());
  return statuses.gloom > 0 ? Math.max(1.6, r * 0.5) : r;   // GLOOM GLYPH
}

/* ============ Vision ============ */
function recomputeVision() {
  lit.fill(0);
  const srcs = [{ x: player.x, y: player.y, r: lightRadius() }];
  for (const t of torches) srcs.push({ x: t.x, y: t.y, r: 2.4 });
  for (const s of srcs) {
    const R = Math.ceil(s.r);
    for (let y = Math.max(0, s.y - R); y <= Math.min(ROWS - 1, s.y + R); y++) {
      for (let x = Math.max(0, s.x - R); x <= Math.min(COLS - 1, s.x + R); x++) {
        const dx = x - s.x, dy = y - s.y;
        if (dx * dx + dy * dy > s.r * s.r) continue;
        if (losClear(s.x, s.y, x, y)) { lit[IDX(x, y)] = 1; seen[IDX(x, y)] = 1; }
      }
    }
  }
}

/* ============ Turn engine ============ */
function playerAct(action) {
  // action: {move:[dx,dy]} | {attack:enemy} | {wait:true}
  if (state !== 'play') return false;
  let tookTurn = false;
  if (action.attack) {
    const e = action.attack;
    const heavy = rank('heavy') && rnd() < 0.15;
    const dmg = playerDamage() + (heavy ? 3 : 0);
    e.hp -= dmg; e.hurtT = 0.25; e.aggro = true;
    addFloat(e.x, e.y, '-' + dmg, heavy ? '#ffee88' : '#ffcc88');
    sfxHit();
    player.face = e.x >= player.x ? 1 : -1;
    if (e.hp <= 0) killEnemy(e);
    tookTurn = true;
  } else if (action.move) {
    const nx = player.x + action.move[0], ny = player.y + action.move[1];
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS || grid[IDX(nx, ny)] === 1) return false;
    const e = enemyAt(nx, ny);
    if (e) return playerAct({ attack: e });
    player.x = nx; player.y = ny;
    if (action.move[0] !== 0) player.face = action.move[0] > 0 ? 1 : -1;
    sfxStep();
    // pickups
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.x !== nx || it.y !== ny) continue;
      if (it.type === 'gold') {
        const amt = Math.max(1, Math.round(it.amt * goldMult()));
        gold += amt; addFloat(nx, ny, '+' + amt + '◈', '#ffc300'); sfxCoin();
      }
      else { player.hp = Math.min(player.maxHp, player.hp + it.amt); addFloat(nx, ny, '+' + it.amt + '♥', '#ff5566'); sfxHeart(); }
      items.splice(i, 1);
    }
    const tr = trapAt(nx, ny);
    if (tr && !tr.sprung) springTrap(tr);
    if (!chest.opened && chest.x === nx && chest.y === ny) { openChest(); return true; }
    if (stairs.x === nx && stairs.y === ny) { beginDescend(); return true; }
    tookTurn = true;
  } else if (action.wait) tookTurn = true;
  if (!tookTurn) return false;
  turnCount++;
  if (wardTimer > 0) wardTimer--;
  tickStatuses();
  // TAR SEEP: while mired, the dark moves twice for every step you take.
  enemiesAct();
  if (statuses.slow > 0) enemiesAct();
  recomputeVision();
  checkDeath();

}
// Attack power with the situational skills folded in. HEAVY BLOWS is rolled
// at the call site instead, so the crit can colour its own damage float.
function playerDamage() {
  let d = player.atk + killStreak;
  if (rank('vengeance') && player.hp * 2 <= player.maxHp) d += 2;
  if (statuses.frail > 0) d = Math.max(1, Math.ceil(d * 0.5));   // WITHER RUNE
  return d;
}
function killEnemy(e) {
  enemies = enemies.filter(x => x !== e);
  kills++;
  if (rank('bloodletter')) killStreak = Math.min(5, killStreak + 1);
  const exec = rank('execution');
  if (exec && player.hp < player.maxHp) {
    player.hp = Math.min(player.maxHp, player.hp + exec);
    addFloat(player.x, player.y, '+' + exec + '♥', '#ff9a3c');
  }
  addPuff(e.x, e.y, e.type === 'wraith' ? '#b0c8ff' : '#ff8844');
  const leech = relicCount('leech');
  if (leech) { player.hp = Math.min(player.maxHp, player.hp + leech); addFloat(player.x, player.y, '+' + leech + '♥', '#ff5566'); }
  if (rnd() < 0.45) items.push({ x: e.x, y: e.y, type: 'gold', amt: ri(1, 3) });
  sfxKill();
}
function hurtPlayer(dmg, srcX, srcY) {
  if (state !== 'play') return;
  let d = dmg;
  d = Math.max(1, d - relicCount('skin') - metaDR());
  d = Math.min(d, damageCap());   // UNBROKEN
  if (relicCount('ward') && wardTimer === 0) {
    wardTimer = wardRecharge(); addFloat(player.x, player.y, 'BLOCK', '#88ccff'); sfxBlock(); return;
  }
  // LAST STAND is checked after the ward, so a shield is never wasted on a
  // hit the skill would have survived anyway.
  if (d >= player.hp && rank('stand') && !lastStandUsed) {
    lastStandUsed = true;
    player.hp = 1; shakeT = 0.5;
    addFloat(player.x, player.y, 'LAST STAND', '#ffee88');
    sfxBlock(); sfxHurt();
    pathQueue = []; attackTargetId = -1;
    return;
  }
  player.hp -= d; shakeT = 0.3;
  addFloat(player.x, player.y, '-' + d, '#ff4444');

function enemiesAct() {
  const distMap = bfsMap(player.x, player.y, (x, y) => grid[IDX(x, y)] === 0);
  const ghostMap = bfsMap(player.x, player.y, (x, y) => x > 0 && x < COLS - 1 && y > 0 && y < ROWS - 1);
  for (const e of enemies) {
    if (e.type === 'brute' && turnCount % 2 === 0) continue; // slow: acts on odd turns
    const dm = e.type === 'wraith' ? ghostMap : distMap;
    const d = dm[IDX(e.x, e.y)];
    if (!e.aggro) {
      if (lit[IDX(e.x, e.y)] && d >= 0 && d <= 8) e.aggro = true;
      else { if (rnd() < 0.2) stepEnemy(e, null); continue; }
    }
    const steps = e.type === 'bat' ? 2 : 1;
    for (let s = 0; s < steps; s++) {
      const dd = dm[IDX(e.x, e.y)];
      if (dd === 1 || (Math.abs(e.x - player.x) + Math.abs(e.y - player.y)) === 1) {
        hurtPlayer(e.atk, e.x, e.y);
        break;
      }
      if (e.type === 'archer') {
        if (archerShot(e)) break;
        stepEnemy(e, dm);
      } else if (e.type === 'bat' && rnd() < 0.3) stepEnemy(e, null);
      else stepEnemy(e, dm);

}
function archerShot(e) {

  const dist = Math.abs(e.x - player.x) + Math.abs(e.y - player.y);
  if (dist > 5) return false;
  const sx = Math.sign(player.x - e.x), sy = Math.sign(player.y - e.y);
  let x = e.x + sx, y = e.y + sy;

    if (grid[IDX(x, y)] === 1 || enemyAt(x, y)) return false;
    x += sx; y += sy;

    const passable = e.type === 'wraith'
      ? (nx > 0 && nx < COLS - 1 && ny > 0 && ny < ROWS - 1)
      : grid[IDX(nx, ny)] === 0;
    if (!passable) continue;
    if (enemyAt(nx, ny)) continue;
    if (nx === player.x && ny === player.y) continue;
    cands.push({ nx, ny, d: dm ? dm[IDX(nx, ny)] : 0 });

  if (!cands.length) return;

    cands.sort((a, b) => (a.d === -1 ? 999 : a.d) - (b.d === -1 ? 999 : b.d));
    if ((cands[0].d === -1 ? 999 : cands[0].d) >= (dm[IDX(e.x, e.y)] === -1 ? 999 : dm[IDX(e.x, e.y)])) return; // no closer cell

let lastBank = null;    // what the delve just paid, for the death screen
function checkDeath() {

  if (player.hp > 0) return;

}

/* ============ Chest / relics / descend ============ */
function openChest() {
  chest.opened = true;

  // Unseen relics first; once the set is exhausted a chest starts offering
  // second copies, which stack (see relicCount() at each effect site).
  let pool = Object.keys(RELICS).filter(k => !relics.includes(k));
  if (pool.length === 0) pool = Object.keys(RELICS);
  const a = pool[ri(0, pool.length - 1)];
  let rest = pool.filter(k => k !== a);
  const b = rest.length ? rest[ri(0, rest.length - 1)] : null;
  rest = rest.filter(k => k !== b);
  // FORTUNE widens the offer rather than improving it — a third door, not a
  // better one, so the skill never inflates the relics themselves.
  const c3 = (rank('fortune') && rest.length) ? rest[ri(0, rest.length - 1)] : null;
  state = 'relic';
  showRelicChoice(a, b, c3);
}
function takeRelic(key) {
  relics.push(key);
  if (key === 'blade') player.atk += 2;
  if (key === 'crown') { player.maxHp += 2; player.hp = Math.min(player.maxHp, player.hp + 2); }
  sfxRelic();

  state = 'play';
  recomputeVision();
}
function beginDescend() {
  state = 'descend'; descendT = 0;
  sfxStairs();
}

  floorNum++;

  const crowns = relicCount('crown') * 2;
  if (crowns) { player.maxHp += crowns; player.hp = Math.min(player.maxHp, player.hp + crowns); }
  const rest = descendHeal();
  if (rest && player.hp < player.maxHp) {
    player.hp = Math.min(player.maxHp, player.hp + rest);
    addFloat(player.x, player.y, '+' + rest + '♥', '#6fd8a0');
  }
  genFloor(floorNum);
  // SOVEREIGN's shield comes back with every stair you take.
  if (rank('sovereign')) lastStandUsed = false;
  const c = chr();
  if (c) {
    const finished = floorNum - 1;
    if (finished > c.stats.deepest) c.stats.deepest = finished;
    if (floorNum > c.stats.bestDepth) c.stats.bestDepth = floorNum;
    const got = awardMilestones();
    if (got) addFloat(player.x, player.y, '+' + got + ' SKILL POINT' + (got === 1 ? '' : 'S'), '#b44fff');
    saveSlots();
  }
  state = 'play';
}

/* ============ Tap handling → path ============ */
function visibleEnemySet() {
  const s = new Set();
  for (const e of enemies) if (lit[IDX(e.x, e.y)]) s.add(e.id);
  return s;
}
function tapTile(tx, ty) {
  if (state !== 'play') return;
  if (statuses.stun > 0) return;   // snared: the board does not answer
  if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return;
  if (!seen[IDX(tx, ty)]) return;
  const e = enemyAt(tx, ty);
  const adj = Math.abs(tx - player.x) + Math.abs(ty - player.y) === 1;
  if (e && lit[IDX(tx, ty)]) {
    if (adj) { playerAct({ attack: e }); return; }
    attackTargetId = e.id;
    buildPathTo(tx, ty, true);
    return;
  }
  if (tx === player.x && ty === player.y) { playerAct({ wait: true }); return; }
  if (grid[IDX(tx, ty)] === 1) return;
  attackTargetId = -1;
  buildPathTo(tx, ty, false);
}

// should never walk you through a hazard you can see. Tapping the trap
// itself still works — that is the deliberate way onto one.
function trapBlocked(x, y) {
  if (x === player.x && y === player.y) return false;
  const t = trapAt(x, y);
  return !!t && !t.sprung && seen[IDX(x, y)] === 1;
}
function buildPathTo(tx, ty, stopAdjacent) {
  const pass = (x, y) => grid[IDX(x, y)] === 0 && (!enemyAt(x, y) || (x === tx && y === ty)) &&

  let dist = bfsMap(tx, ty, pass);
  // If avoiding traps makes the target unreachable, take the honest route
  // rather than refusing to move at all.
  if (dist[IDX(player.x, player.y)] === -1) {
    dist = bfsMap(tx, ty, (x, y) => grid[IDX(x, y)] === 0 && (!enemyAt(x, y) || (x === tx && y === ty)));
  }
  if (dist[IDX(player.x, player.y)] === -1) return;
  const path = [];
  let cx = player.x, cy = player.y;
  let guard = 300;
  while (!(cx === tx && cy === ty) && guard-- > 0) {
    let best = null;
    for (const d of DIRS) {
      const nx = cx + d[0], ny = cy + d[1];
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      const dd = dist[IDX(nx, ny)];
      if (dd === -1) continue;
      if (!best || dd < best.d) best = { nx, ny, d: dd };
    }
    if (!best) break;
    cx = best.nx; cy = best.ny;
    path.push([cx, cy]);

}

}

  const nowVis = visibleEnemySet();
  for (const id of nowVis) if (!visibleEnemiesAtPathStart.has(id)) { pathQueue = []; attackTargetId = -1; return; }
  for (const e of enemies) if (Math.abs(e.x - player.x) + Math.abs(e.y - player.y) === 1 && e.aggro && attackTargetId !== e.id) { pathQueue = []; }

  const [nx, ny] = pathQueue[0];
  const blocker = enemyAt(nx, ny);
  if (blocker) { pathQueue = []; attackTargetId = -1; return; }

  if (attackTargetId !== -1 && !pathQueue.length && state === 'play') {
    const t = enemies.find(e => e.id === attackTargetId);
    attackTargetId = -1;

/* ============ Run lifecycle ============ */
function startRun() {
  gold = 0; kills = 0; turnCount = 0;
  relics = []; wardTimer = 0; buffPanel = false; lastStandUsed = false;
  clearStatuses(); killStreak = 0;

  // so everything downstream keeps reading plain `player.atk` / `player.maxHp`
  // and relics keep stacking on top exactly as they did.
  consumables = {};

  if (c) for (const k of CONSUMABLE_KEYS) if (c.supplies[k]) consumables[k] = c.supplies[k];
  player.maxHp = CURVE.playerHp + metaMaxHp();
  player.hp = player.maxHp;
  player.atk = CURVE.playerAtk + metaAtk();

  runStartFloor = floorNum;

let floats = [];   // {x,y,txt,col,t}

    embers.push({ x: x + 0.5, y: y + 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.5, life: 0, max: 0.5 + Math.random() * 0.4, col, r: 1.5 + Math.random() * 2 });

/* ============ Canvas / layout ============ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const overlayEl = document.getElementById('overlay');
let W = 390, H = 844, dpr = 1, tile = 34, ox = 0, oy = 0, hudTop = 60;
let darkCv = null, darkCtx = null;
/* ---- Camera -----------------------------------------------------------
   `tile`/`ox`/`oy` stay the only things the renderer and hit-testing read,
   so zoom is purely a matter of what applyView() writes into them:
     tile = baseTile * zoom, and the offsets fall out of the focus point.
   `baseTile` is the whole-board fit computed by resize(), which is also the
   minimum zoom — pinching out returns you to "everything visible" and no
   further. camX/camY are the world (tile-space) point held at the centre of
   the board viewport; applyView clamps them so the board can never be
   dragged off the play area, and centres an axis outright when the board is
   smaller than the viewport on it (which is exactly the zoom-1 case, so
   zoom 1 reproduces the original layout). */
let baseTile = 34, zoom = 1, camX = COLS / 2, camY = ROWS / 2;
let viewX = 0, viewY = 60, viewW = 390, viewH = 700;
/* Zoom 1 is the whole-board fit. Below it the board shrinks inside the
   viewport (a wider look at where you have been); above it you are reading
   a few tiles at a time. */
const MIN_ZOOM = 0.5, MAX_ZOOM = 6;
/* `camFree` latches the moment the player drags or pinches, and only
   centerCam() clears it. While it is set the camera is theirs: it does not
   ease back toward the player, so a drag can look anywhere on the map and
   stay there. The ⌖ button (drawn only while it is set) hands the camera
   back. */
let camFree = false;
// Panning is meaningful only while the board is bigger than its viewport.
function canPan() { return tile * COLS > viewW + 1 || tile * ROWS > viewH + 1; }
function applyView() {
  zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));
  tile = baseTile * zoom;
  const bw = tile * COLS, bh = tile * ROWS;
  if (bw <= viewW) camX = COLS / 2;
  else camX = Math.max(viewW / 2 / tile, Math.min(COLS - viewW / 2 / tile, camX));
  if (bh <= viewH) camY = ROWS / 2;
  else camY = Math.max(viewH / 2 / tile, Math.min(ROWS - viewH / 2 / tile, camY));
  ox = Math.round(viewX + viewW / 2 - camX * tile);
  oy = Math.round(viewY + viewH / 2 - camY * tile);
}
// Zoom by `factor`, keeping the world point under (sx,sy) pinned to (sx,sy).
function zoomAt(sx, sy, factor) {
  const nz = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
  if (nz === zoom) return;
  const wx = (sx - ox) / tile, wy = (sy - oy) / tile;
  camFree = true;
  zoom = nz;
  tile = baseTile * zoom;
  camX = wx + (viewX + viewW / 2 - sx) / tile;
  camY = wy + (viewY + viewH / 2 - sy) / tile;
  applyView();
}
function panBy(dx, dy) {
  if (!dx && !dy) return;
  camFree = true;
  camX -= dx / tile; camY -= dy / tile;
  applyView();
}
function centerCam() { camFree = false; camX = player.x + 0.5; camY = player.y + 0.5; applyView(); }
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sat = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
  hudTop = sat + 50;
  const availH = H - hudTop - 14;
  viewX = 0; viewY = hudTop; viewW = W; viewH = availH;
  baseTile = Math.floor(Math.min(W / COLS, availH / ROWS));
  applyView();
  darkCv = document.createElement('canvas');
  darkCv.width = Math.max(1, Math.round(W / 2)); darkCv.height = Math.max(1, Math.round(H / 2));
  darkCtx = darkCv.getContext('2d');
}
window.addEventListener('resize', resize);
resize();

/* ============ Pre-rendered textures (realistic stone) ============ */
const TS = 64;
function makeTileCanvas(fn) {
  const c = document.createElement('canvas'); c.width = TS; c.height = TS;
  const g = c.getContext('2d'); fn(g); return c;
}
function speckle(g, n, col, aMin, aMax, sMin, sMax) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = col;
    g.globalAlpha = aMin + Math.random() * (aMax - aMin);
    const s = sMin + Math.random() * (sMax - sMin);
    g.fillRect(Math.random() * TS, Math.random() * TS, s, s);
  }

}
const floorTiles = [];
for (let v = 0; v < 5; v++) {
  floorTiles.push(makeTileCanvas(g => {
    const base = 38 + Math.floor(Math.random() * 8);
    g.fillStyle = `rgb(${base + 10},${base + 2},${base - 4})`;
    g.fillRect(0, 0, TS, TS);
    speckle(g, 90, '#000', 0.04, 0.14, 1, 3);
    speckle(g, 60, '#c9b89a', 0.03, 0.08, 1, 2);
    // flagstone seams
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1.5;
    g.beginPath();
    const off = Math.random() * TS;
    g.moveTo((off + 20) % TS, 0); g.lineTo((off + 8) % TS, TS);
    g.moveTo(0, (off + 40) % TS); g.lineTo(TS, (off + 30) % TS);
    g.stroke();
    // cracks
    if (v % 2 === 0) {
      g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 1;
      g.beginPath();

  if (!buffPanel) return;
  const list = relicCounts();
  if (!list.length) { buffPanel = false; return; }
  const pw = Math.min(W - 32, 344), pad = 15, wrapW = pw - pad * 2 - 4;
  const bodyFont = `11px 'Share Tech Mono', monospace`;
  const blocks = [];
  let hh = pad + 24;
  for (const r of list) {
    ctx.font = bodyFont;
    const desc = wrapLines(RELICS[r.key].desc, wrapW);
    const stat = wrapLines(relicStatus(r.key, r.n), wrapW);
    blocks.push({ r, desc, stat });
    hh += 17 + desc.length * 14 + stat.length * 14 + 12;
  }
  hh += pad - 8;
  const px0 = Math.round((W - pw) / 2);
  const py0 = Math.round(Math.max(hudTop + 8, Math.min(H - hh - 20, (H - hh) / 2)));
  ctx.fillStyle = 'rgba(4,3,6,0.86)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(14,11,18,0.98)';
  ctx.fillRect(px0, py0, pw, hh);
  ctx.strokeStyle = '#ff9a3c'; ctx.lineWidth = 1.5;
  ctx.strokeRect(px0 + 0.5, py0 + 0.5, pw - 1, hh - 1);
  ctx.textAlign = 'left';
  ctx.font = `13px 'Black Ops One', sans-serif`;
  ctx.fillStyle = '#ff9a3c';
  ctx.fillText('RELICS', px0 + pad, py0 + pad + 12);
  ctx.textAlign = 'right';
  ctx.font = `9px 'Share Tech Mono', monospace`;
  ctx.fillStyle = '#7a7286';
  ctx.fillText('TAP ANYWHERE TO CLOSE', px0 + pw - pad, py0 + pad + 11);
  ctx.textAlign = 'left';
  let ty = py0 + pad + 30;
  for (const b of blocks) {
    ctx.font = `12px 'Share Tech Mono', monospace`;
    ctx.fillStyle = '#ffc300';
    const head = RELICS[b.r.key].icon + '  ' + RELICS[b.r.key].name + (b.r.n > 1 ? '  \u00d7' + b.r.n : '');
    ctx.fillText(head, px0 + pad, ty);
    ty += 17;
    ctx.font = bodyFont;
    ctx.fillStyle = '#a89fb4';
    for (const ln of b.desc) { ctx.fillText(ln, px0 + pad + 4, ty); ty += 14; }
    ctx.fillStyle = '#6fd8a0';
    for (const ln of b.stat) { ctx.fillText(ln, px0 + pad + 4, ty); ty += 14; }
    ty += 12;
  }
}

/* ============ Torch ember spawner ============ */
let emberAcc = 0;
function spawnAmbient(dt) {
  emberAcc += dt;
  if (emberAcc < 0.25) return;
  emberAcc = 0;
  for (const t of torches) {
    if (!seen[IDX(t.x, t.y)] || Math.random() < 0.5) continue;
    embers.push({
      x: t.x + 0.5 + (Math.random() - 0.5) * 0.2, y: t.y + 0.35,
      vx: (Math.random() - 0.5) * 0.4, vy: -0.8 - Math.random() * 0.6,
      life: 0, max: 0.7 + Math.random() * 0.7, col: Math.random() < 0.4 ? '#ffd070' : '#ff7a30', r: 1 + Math.random() * 1.6,
    });
  }
  if (Math.random() < 0.7) {
    embers.push({
      x: player.vx + 0.5 + player.face * 0.3, y: player.vy + 0.28,
      vx: (Math.random() - 0.5) * 0.3, vy: -0.7 - Math.random() * 0.5,
      life: 0, max: 0.5 + Math.random() * 0.5, col: '#ff9a40', r: 0.8 + Math.random() * 1.2,
    });
  }
}

/* ============ Camera follow ============
   Runs only while the camera is still the game's (see `camFree`): until the
   player drags or pinches, walking can never lose you off-screen, because
   the camera eases just enough to put the player back inside a dead zone.
   The first drag hands the camera over for good, and only the ⌖ button (or
   descending a floor) takes it back — that is what "look anywhere" means
   here, and why the button has to exist. */
function followCam(dt) {
  if (camFree || !canPan()) return;
  const [px, py] = cellPx(player.vx + 0.5, player.vy + 0.5);
  const mx = Math.min(viewW * 0.32, tile * 2.2), my = Math.min(viewH * 0.32, tile * 2.2);
  let dx = 0, dy = 0;
  if (px < viewX + mx) dx = px - (viewX + mx);
  else if (px > viewX + viewW - mx) dx = px - (viewX + viewW - mx);
  if (py < viewY + my) dy = py - (viewY + my);
  else if (py > viewY + viewH - my) dy = py - (viewY + viewH - my);
  if (!dx && !dy) return;
  const e = Math.min(1, dt * 7);
  camX += (dx / tile) * e; camY += (dy / tile) * e;
  applyView();
}

/* ============ Main loop ============ */
function frame(ts) {
  const dt = Math.min(0.1, (ts - lastT) / 1000 || 0.016);
  lastT = ts; timeNow = ts / 1000;
  // ease visual positions toward logical
  const ease = Math.min(1, dt * 13);
  player.vx += (player.x - player.vx) * ease;
  player.vy += (player.y - player.vy) * ease;
  for (const e of enemies) {
    e.vx += (e.x - e.vx) * ease;
    e.vy += (e.y - e.vy) * ease;
    if (e.hurtT > 0) e.hurtT -= dt;
  }
  if (state === 'play') { stunStep(dt); pathStep(dt); spawnAmbient(dt); }
  if (!pinch && !dragging) followCam(dt);
  drawScene(dt);
  requestAnimationFrame(frame);
}
loadSlots();   // characters exist before any meta helper is read
genFloor(1);   // background dungeon behind the menu
showMenu();
requestAnimationFrame(frame);
</script>
