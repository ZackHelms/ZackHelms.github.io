@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap');

<div id="build-badge" style="position:fixed;top:2px;right:6px;z-index:2147483647;font-family:'Courier New',monospace;font-size:9px;color:#888;opacity:0.55;pointer-events:none;letter-spacing:0.5px;user-select:none;">build 2026-08-26 03:40 UTC</div>
<a id="back-btn" href="../index.html" aria-label="Back to games">←</a>
<button id="mute">🔊</button>
<button id="cog" aria-label="Settings">&#9881;</button>
<canvas id="cv"></canvas>
<div id="overlay"></div>
<div id="settings" class="hidden">
  <div class="set-panel">
    <h2>SETTINGS</h2>
    <div class="setrow">
      <span class="lbl">MUSIC</span>
      <input type="range" id="vol-music" min="0" max="100" step="5" value="100" aria-label="Music volume">

    </div>
    <div class="set-note"><em>Pinch</em> the board to zoom; <em>drag</em> to look anywhere on the map, then <em>&#8982;</em> to snap back to your hero. <em>Tap the relic row</em> for what each one does.</div>
    <button class="btn" id="set-close">CLOSE</button>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   EMBER DEPTHS — torchlit turn-based roguelike.
   Tap to move (BFS pathing), bump to attack; enemies act per player turn.
   Permadeath; relic builds; procedural floors; realistic torchlight
   rendering (light map + ember particles + textured stone).
   ===================================================================== */

/* ============ Board constants ============ */
const COLS = 11, ROWS = 16;
const IDX = (x, y) => y * COLS + x;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

/* ============ State (top-level: reachable from page.evaluate) ============ */
let state = 'menu';        // menu | play | relic | descend | dead
let grid = new Uint8Array(COLS * ROWS);   // 0 floor, 1 wall
let seen = new Uint8Array(COLS * ROWS);
let lit = new Uint8Array(COLS * ROWS);
let floorNum = 1;
let gold = 0, kills = 0, turnCount = 0;
let player = { x: 5, y: 8, vx: 5, vy: 8, hp: 12, maxHp: 12, atk: 3, face: 1 };
let enemies = [];          // {id,x,y,vx,vy,hp,maxHp,atk,type,aggro,seed}
let items = [];            // {x,y,type:'gold'|'heart', amt}
let torches = [];          // {x,y,seed}
let stairs = { x: 0, y: 0 };
let chest = { x: -1, y: -1, opened: true };
let relics = [];           // relic keys owned
let wardTimer = 0;         // ember-ward recharge countdown (0 = ready)
// Stacked wards recharge faster rather than stacking shields, so a second
// copy is a real upgrade without letting a build eat three hits a turn.
function wardRecharge() { return Math.max(2, 8 - 2 * relicCount('ward')); }
let pathQueue = [];        // queued [x,y] steps from a tap
let attackTargetId = -1;
let pathT = 0;
let visibleEnemiesAtPathStart = new Set();
let descendT = -1;         // descend fade animation
let introT = 0;            // "DEPTH n" banner timer
let shakeT = 0;
let enemyIdSeq = 1;
let buffPanel = false;     // relic detail panel open? (a pure overlay: no turn passes)
let buffRect = null;       // HUD hotspot for the relic row, in screen px (null = no relics)
let recenterBtn = null;    // ⌖ button circle, in screen px (null = not shown)

const RELICS = {
  blade:   { name: 'SEARING BLADE',  icon: '⚔', desc: '+2 attack. The edge still remembers the forge.' },
  leech:   { name: 'LEECH FANG',     icon: '♦', desc: 'Heal 1 HP on every kill.' },
  skin:    { name: 'STONE SKIN',     icon: '◆', desc: 'Take 1 less damage from every hit (min 1).' },
  ward:    { name: 'EMBER WARD',     icon: '◉', desc: 'A shield blocks one hit, recharges every 6 turns.' },
  lantern: { name: "MINER'S LANTERN", icon: '☀', desc: 'Your light reaches half again as far.' },
  crown:   { name: 'VAMPIRIC CROWN', icon: '♛', desc: '+2 max HP and heal 2 each time you descend.' },
};

/* Relics are a list, not a set, so the same relic taken twice counts twice.
   Everything player-facing aggregates through here: one row per relic kind,
   with the number of copies. */
function relicCount(key) { let n = 0; for (const k of relics) if (k === key) n++; return n; }
function relicCounts() {
  const out = [];
  for (const k of relics) {
    const hit = out.find((o) => o.key === k);
    if (hit) hit.n++; else out.push({ key: k, n: 1 });
  }
  return out;
}

/* ============ RNG ============ */
let rngS = 1234567;
function rnd() { rngS = (rngS * 1103515245 + 12345) & 0x7fffffff; return rngS / 0x7fffffff; }
function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }

/* ============ Persistence ============ */
function bestDepth() { return parseInt(localStorage.getItem('emberDepths.bestDepth') || '0', 10) || 0; }
function bestGold() { return parseInt(localStorage.getItem('emberDepths.bestGold') || '0', 10) || 0; }
function persistBests() {
  try {
    if (floorNum > bestDepth()) localStorage.setItem('emberDepths.bestDepth', String(floorNum));
    if (gold > bestGold()) localStorage.setItem('emberDepths.bestGold', String(gold));
  } catch (err) {}
}

/* ============ Floor generation (drunkard-walk carve: always connected) ============ */
function genFloor(n) {
  grid.fill(1); seen.fill(0); lit.fill(0);
  items = []; torches = []; enemies = []; pathQueue = []; attackTargetId = -1;
  rngS = (n * 7919 + Date.now()) & 0x7fffffff;
  let cx = ri(3, COLS - 4), cy = ri(4, ROWS - 5);
  const target = Math.floor(COLS * ROWS * 0.42);
  let carved = 0;
  grid[IDX(cx, cy)] = 0; carved++;
  const startX = cx, startY = cy;
  let guard = 60000;
  while (carved < target && guard-- > 0) {
    const d = DIRS[ri(0, 3)];
    const nx = cx + d[0], ny = cy + d[1];
    if (nx < 1 || nx > COLS - 2 || ny < 1 || ny > ROWS - 2) continue;
    cx = nx; cy = ny;
    if (grid[IDX(cx, cy)] === 1) { grid[IDX(cx, cy)] = 0; carved++; }
  }
  player.x = startX; player.y = startY; player.vx = startX; player.vy = startY;
  // BFS distances from start over floor
  const dist = bfsMap(startX, startY, (x, y) => grid[IDX(x, y)] === 0);
  const floorCells = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
    if (grid[IDX(x, y)] === 0 && dist[IDX(x, y)] >= 0) floorCells.push({ x, y, d: dist[IDX(x, y)] });
  floorCells.sort((a, b) => b.d - a.d);
  stairs = { x: floorCells[0].x, y: floorCells[0].y };
  // chest on a mid-far cell
  const far = floorCells.filter(c => c.d >= 4 && !(c.x === stairs.x && c.y === stairs.y));
  const cc = far.length ? far[ri(0, Math.min(far.length - 1, 8))] : floorCells[1];
  chest = { x: cc.x, y: cc.y, opened: false };
  // torches on wall cells adjacent to floor
  const wallC = [];
  for (let y = 1; y < ROWS - 1; y++) for (let x = 1; x < COLS - 1; x++) {
    if (grid[IDX(x, y)] !== 1) continue;
    if (DIRS.some(d => grid[IDX(x + d[0], y + d[1])] === 0)) wallC.push({ x, y });
  }
  for (let i = 0; i < wallC.length; i++) {
    if (torches.length < 9 && rnd() < 0.12) torches.push({ x: wallC[i].x, y: wallC[i].y, seed: rnd() * 100 });
  }
  // items
  const free = () => {
    for (let t = 0; t < 200; t++) {
      const c = floorCells[ri(1, floorCells.length - 1)];
      if ((c.x === stairs.x && c.y === stairs.y) || (c.x === chest.x && c.y === chest.y)) continue;
      if (items.some(it => it.x === c.x && it.y === c.y)) continue;
      if (enemies.some(e => e.x === c.x && e.y === c.y)) continue;
      if (c.x === player.x && c.y === player.y) continue;
      return c;
    }
    return null;
  };
  const nGold = ri(4, 6);
  for (let i = 0; i < nGold; i++) { const c = free(); if (c) items.push({ x: c.x, y: c.y, type: 'gold', amt: ri(3, 8) }); }
  const nHeart = ri(1, 2);
  for (let i = 0; i < nHeart; i++) { const c = free(); if (c) items.push({ x: c.x, y: c.y, type: 'heart', amt: 4 }); }
  // enemies (spawn at distance >= 5 from player)
  const types = ['slime', 'slime', 'bat'];
  if (n >= 2) types.push('archer');
  if (n >= 3) types.push('archer', 'bat');
  if (n >= 4) types.push('brute');
  if (n >= 6) types.push('wraith');
  const count = Math.min(10, 3 + Math.floor(n * 0.9));
  let tries = 400;
  while (enemies.length < count && tries-- > 0) {
    const c = floorCells[ri(1, floorCells.length - 1)];
    if (c.d < 5) continue;
    if (enemies.some(e => e.x === c.x && e.y === c.y)) continue;
    if ((c.x === stairs.x && c.y === stairs.y) || (c.x === chest.x && c.y === chest.y)) continue;
    spawnEnemy(types[ri(0, types.length - 1)], c.x, c.y, n);
  }
  recomputeVision();
  buffPanel = false;
  centerCam();   // a zoomed-in view should open on the player, not last floor's corner
  introT = 1.6;
}
function spawnEnemy(type, x, y, n) {
  const hpB = Math.floor((n - 1) / 2), atkB = Math.floor((n - 1) / 3);
  const base = {
    slime:  { hp: 5, atk: 2 }, bat: { hp: 2, atk: 1 }, archer: { hp: 4, atk: 2 },
    brute:  { hp: 10, atk: 4 }, wraith: { hp: 6, atk: 3 },
  }[type];
  enemies.push({
    id: enemyIdSeq++, x, y, vx: x, vy: y, type, aggro: false, seed: rnd() * 100,
    hp: base.hp + hpB, maxHp: base.hp + hpB, atk: base.atk + atkB, hurtT: 0,
  });
}

/* ============ Grid helpers ============ */
function bfsMap(sx, sy, passFn) {
  const dist = new Int16Array(COLS * ROWS).fill(-1);
  const q = [[sx, sy]]; dist[IDX(sx, sy)] = 0;
  while (q.length) {
    const [x, y] = q.shift();
    for (const d of DIRS) {
      const nx = x + d[0], ny = y + d[1];
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      if (dist[IDX(nx, ny)] !== -1 || !passFn(nx, ny)) continue;
      dist[IDX(nx, ny)] = dist[IDX(x, y)] + 1;
      q.push([nx, ny]);
    }
  }
  return dist;
}
function losClear(x0, y0, x1, y1) {
  // Bresenham; blocked if an intermediate cell is wall
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy;
  let x = x0, y = y0;
  while (!(x === x1 && y === y1)) {
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
    if (x === x1 && y === y1) break;
    if (grid[IDX(x, y)] === 1) return false;
  }
  return true;
}
function enemyAt(x, y) { return enemies.find(e => e.x === x && e.y === y) || null; }
function lightRadius() { return Math.min(9, 3.6 + 1.6 * relicCount('lantern')); }

/* ============ Vision ============ */
function recomputeVision() {
  lit.fill(0);
  const srcs = [{ x: player.x, y: player.y, r: lightRadius() }];
  for (const t of torches) srcs.push({ x: t.x, y: t.y, r: 2.4 });
  for (const s of srcs) {
    const R = Math.ceil(s.r);
    for (let y = Math.max(0, s.y - R); y <= Math.min(ROWS - 1, s.y + R); y++) {
      for (let x = Math.max(0, s.x - R); x <= Math.min(COLS - 1, s.x + R); x++) {
        const dx = x - s.x, dy = y - s.y;
        if (dx * dx + dy * dy > s.r * s.r) continue;
        if (losClear(s.x, s.y, x, y)) { lit[IDX(x, y)] = 1; seen[IDX(x, y)] = 1; }
      }
    }
  }
}

/* ============ Turn engine ============ */
function playerAct(action) {
  // action: {move:[dx,dy]} | {attack:enemy} | {wait:true}
  if (state !== 'play') return false;
  let tookTurn = false;
  if (action.attack) {
    const e = action.attack;
    e.hp -= player.atk; e.hurtT = 0.25; e.aggro = true;
    addFloat(e.x, e.y, '-' + player.atk, '#ffcc88');
    sfxHit();
    player.face = e.x >= player.x ? 1 : -1;
    if (e.hp <= 0) killEnemy(e);
    tookTurn = true;
  } else if (action.move) {
    const nx = player.x + action.move[0], ny = player.y + action.move[1];
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS || grid[IDX(nx, ny)] === 1) return false;
    const e = enemyAt(nx, ny);
    if (e) return playerAct({ attack: e });
    player.x = nx; player.y = ny;
    if (action.move[0] !== 0) player.face = action.move[0] > 0 ? 1 : -1;
    sfxStep();
    // pickups
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.x !== nx || it.y !== ny) continue;
      if (it.type === 'gold') { gold += it.amt; addFloat(nx, ny, '+' + it.amt + '◈', '#ffc300'); sfxCoin(); }
      else { player.hp = Math.min(player.maxHp, player.hp + it.amt); addFloat(nx, ny, '+' + it.amt + '♥', '#ff5566'); sfxHeart(); }
      items.splice(i, 1);
    }
    if (!chest.opened && chest.x === nx && chest.y === ny) { openChest(); return true; }
    if (stairs.x === nx && stairs.y === ny) { beginDescend(); return true; }
    tookTurn = true;
  } else if (action.wait) tookTurn = true;
  if (!tookTurn) return false;
  turnCount++;
  if (wardTimer > 0) wardTimer--;
  enemiesAct();
  recomputeVision();
  checkDeath();
  return true;
}
function killEnemy(e) {
  enemies = enemies.filter(x => x !== e);
  kills++;
  addPuff(e.x, e.y, e.type === 'wraith' ? '#b0c8ff' : '#ff8844');
  const leech = relicCount('leech');
  if (leech) { player.hp = Math.min(player.maxHp, player.hp + leech); addFloat(player.x, player.y, '+' + leech + '♥', '#ff5566'); }
  if (rnd() < 0.45) items.push({ x: e.x, y: e.y, type: 'gold', amt: ri(1, 3) });
  sfxKill();
}
function hurtPlayer(dmg, srcX, srcY) {
  if (state !== 'play') return;
  let d = dmg;
  d = Math.max(1, d - relicCount('skin'));
  if (relicCount('ward') && wardTimer === 0) {
    wardTimer = wardRecharge(); addFloat(player.x, player.y, 'BLOCK', '#88ccff'); sfxBlock(); return;
  }
  player.hp -= d; shakeT = 0.3;
  addFloat(player.x, player.y, '-' + d, '#ff4444');
  sfxHurt();
  pathQueue = []; attackTargetId = -1; // interrupt travel when hit
}
function enemiesAct() {
  const distMap = bfsMap(player.x, player.y, (x, y) => grid[IDX(x, y)] === 0);
  const ghostMap = bfsMap(player.x, player.y, (x, y) => x > 0 && x < COLS - 1 && y > 0 && y < ROWS - 1);
  for (const e of enemies) {
    if (e.type === 'brute' && turnCount % 2 === 0) continue; // slow: acts on odd turns
    const dm = e.type === 'wraith' ? ghostMap : distMap;
    const d = dm[IDX(e.x, e.y)];
    if (!e.aggro) {
      if (lit[IDX(e.x, e.y)] && d >= 0 && d <= 8) e.aggro = true;
      else { if (rnd() < 0.2) stepEnemy(e, null); continue; }
    }
    const steps = e.type === 'bat' ? 2 : 1;
    for (let s = 0; s < steps; s++) {
      const dd = dm[IDX(e.x, e.y)];

  if (blocker) { pathQueue = []; attackTargetId = -1; return; }

    const t = enemies.find(e => e.id === attackTargetId);

  // cloak
  const cg = ctx.createLinearGradient(0, -tile * 0.32, 0, tile * 0.3);
  cg.addColorStop(0, '#5a5e72'); cg.addColorStop(1, '#23242e');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(0, -tile * 0.3);
  ctx.bezierCurveTo(tile * 0.26, -tile * 0.22, tile * 0.22, tile * 0.2, tile * 0.16, tile * 0.3);
  ctx.lineTo(-tile * 0.16, tile * 0.3);
  ctx.bezierCurveTo(-tile * 0.22, tile * 0.2, -tile * 0.26, -tile * 0.22, 0, -tile * 0.3);
  ctx.fill();
  // hood + face shadow
  ctx.fillStyle = '#43465a';
  ctx.beginPath(); ctx.arc(0, -tile * 0.26, tile * 0.15, 0, 7); ctx.fill();
  ctx.fillStyle = '#14090a';
  ctx.beginPath(); ctx.ellipse(tile * 0.04, -tile * 0.25, tile * 0.09, tile * 0.1, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffca7a';
  ctx.fillRect(tile * 0.02, -tile * 0.28, tile * 0.03, tile * 0.025);
  // torch arm
  ctx.strokeStyle = '#3a2c1a'; ctx.lineWidth = Math.max(2, tile * 0.055);
  ctx.beginPath(); ctx.moveTo(tile * 0.14, -tile * 0.02); ctx.lineTo(tile * 0.3, -tile * 0.22); ctx.stroke();
  ctx.restore();
  drawFlame(cx2 + player.face * tile * 0.3, cy2 - tile * 0.24, tile * 0.2, 3);
  // ward shield ring
  if (relics.includes('ward') && wardTimer === 0) {
    ctx.strokeStyle = 'rgba(120,190,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx2, cy2, tile * 0.42 + Math.sin(timeNow * 3) * 2, 0, 7); ctx.stroke();
  }
}
function drawEnemy(e) {
  if (!lit[IDX(e.x, e.y)] && !(seen[IDX(e.x, e.y)] && e.type === 'wraith')) return;
  const [px, py] = cellPx(e.vx, e.vy);
  const cx2 = px + tile / 2;
  const hurt = e.hurtT > 0;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(cx2, py + tile * 0.84, tile * 0.24, tile * 0.08, 0, 0, 7); ctx.fill();
  if (e.type === 'slime') {
    const sq = 1 + Math.sin(timeNow * 5 + e.seed) * 0.08;
    const gy = py + tile * 0.62;
    const gr = ctx.createRadialGradient(cx2 - tile * 0.08, gy - tile * 0.14, 0, cx2, gy, tile * 0.3);
    gr.addColorStop(0, hurt ? '#ffd0d0' : '#9fe870'); gr.addColorStop(0.55, hurt ? '#ff8080' : '#4a9c2e'); gr.addColorStop(1, hurt ? '#802020' : '#1d4a12');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.ellipse(cx2, gy, tile * 0.26 * sq, tile * 0.2 / sq, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.ellipse(cx2 - tile * 0.09, gy - tile * 0.1, tile * 0.06, tile * 0.035, -0.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#0c1e08';
    ctx.beginPath(); ctx.arc(cx2 - tile * 0.06, gy - tile * 0.02, tile * 0.03, 0, 7); ctx.arc(cx2 + tile * 0.07, gy - tile * 0.02, tile * 0.03, 0, 7); ctx.fill();
  } else if (e.type === 'bat') {
    const fl = Math.sin(timeNow * 14 + e.seed);
    const gy = py + tile * 0.42 + Math.sin(timeNow * 3.7 + e.seed) * tile * 0.05;
    ctx.fillStyle = hurt ? '#ff9090' : '#3a3244';
    ctx.beginPath();
    ctx.ellipse(cx2, gy, tile * 0.1, tile * 0.13, 0, 0, 7); ctx.fill();
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx2 + s * tile * 0.05, gy);
      ctx.quadraticCurveTo(cx2 + s * tile * 0.24, gy - tile * (0.12 + fl * 0.1), cx2 + s * tile * 0.32, gy + tile * 0.02);
      ctx.quadraticCurveTo(cx2 + s * tile * 0.2, gy + tile * 0.06, cx2 + s * tile * 0.05, gy + tile * 0.05);
      ctx.fill();
    }
    ctx.fillStyle = '#ffb020';
    ctx.fillRect(cx2 - tile * 0.045, gy - tile * 0.03, tile * 0.03, tile * 0.03);
    ctx.fillRect(cx2 + tile * 0.015, gy - tile * 0.03, tile * 0.03, tile * 0.03);
  } else if (e.type === 'archer') {
    const gy = py + tile * 0.55;
    ctx.fillStyle = hurt ? '#ffd0d0' : '#cfc8b4';
    ctx.beginPath(); ctx.arc(cx2, gy - tile * 0.2, tile * 0.11, 0, 7); ctx.fill();
    ctx.fillRect(cx2 - tile * 0.03, gy - tile * 0.1, tile * 0.06, tile * 0.24);
    ctx.strokeStyle = hurt ? '#ffd0d0' : '#cfc8b4'; ctx.lineWidth = Math.max(2, tile * 0.045);
    ctx.beginPath(); ctx.moveTo(cx2 - tile * 0.14, gy + 1); ctx.lineTo(cx2 + tile * 0.14, gy + 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx2 - tile * 0.1, gy + tile * 0.14); ctx.lineTo(cx2 - tile * 0.16, gy + tile * 0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx2 + tile * 0.1, gy + tile * 0.14); ctx.lineTo(cx2 + tile * 0.16, gy + tile * 0.3); ctx.stroke();
    ctx.fillStyle = '#10141c';
    ctx.beginPath(); ctx.arc(cx2 - tile * 0.04, gy - tile * 0.22, tile * 0.02, 0, 7); ctx.arc(cx2 + tile * 0.04, gy - tile * 0.22, tile * 0.02, 0, 7); ctx.fill();
    // bow
    ctx.strokeStyle = '#7a5228'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx2 + tile * 0.2, gy, tile * 0.16, -1.2, 1.2); ctx.stroke();
  } else if (e.type === 'brute') {
    const gy = py + tile * 0.5;
    const gr = ctx.createLinearGradient(cx2, gy - tile * 0.3, cx2, gy + tile * 0.34);
    gr.addColorStop(0, hurt ? '#ffb0a0' : '#8a4a3a'); gr.addColorStop(1, hurt ? '#903030' : '#3c1d16');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.moveTo(cx2 - tile * 0.26, gy + tile * 0.34);
    ctx.bezierCurveTo(cx2 - tile * 0.34, gy - tile * 0.2, cx2 - tile * 0.14, gy - tile * 0.34, cx2, gy - tile * 0.32);
    ctx.bezierCurveTo(cx2 + tile * 0.14, gy - tile * 0.34, cx2 + tile * 0.34, gy - tile * 0.2, cx2 + tile * 0.26, gy + tile * 0.34);
    ctx.fill();
    ctx.fillStyle = '#ffd020';
    ctx.beginPath(); ctx.arc(cx2 - tile * 0.08, gy - tile * 0.16, tile * 0.035, 0, 7); ctx.arc(cx2 + tile * 0.08, gy - tile * 0.16, tile * 0.035, 0, 7); ctx.fill();
    ctx.strokeStyle = '#d8cfc0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx2 - tile * 0.1, gy - tile * 0.05); ctx.lineTo(cx2 - tile * 0.04, gy - tile * 0.01); ctx.moveTo(cx2 + tile * 0.1, gy - tile * 0.05); ctx.lineTo(cx2 + tile * 0.04, gy - tile * 0.01); ctx.stroke();
  } else { // wraith
    const gy = py + tile * 0.5 + Math.sin(timeNow * 2.2 + e.seed) * tile * 0.04;
    ctx.globalAlpha = 0.55 + Math.sin(timeNow * 3 + e.seed) * 0.15;
    const gr = ctx.createLinearGradient(cx2, gy - tile * 0.3, cx2, gy + tile * 0.3);
    gr.addColorStop(0, hurt ? '#ffe0e0' : '#cfe0ff'); gr.addColorStop(1, 'rgba(120,150,220,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.moveTo(cx2, gy - tile * 0.3);
    ctx.bezierCurveTo(cx2 + tile * 0.22, gy - tile * 0.1, cx2 + tile * 0.18, gy + tile * 0.1, cx2 + tile * 0.24, gy + tile * 0.3);
    ctx.lineTo(cx2 - tile * 0.24, gy + tile * 0.3);
    ctx.bezierCurveTo(cx2 - tile * 0.18, gy + tile * 0.1, cx2 - tile * 0.22, gy - tile * 0.1, cx2, gy - tile * 0.3);
    ctx.fill();
    ctx.fillStyle = '#0a1030';
    ctx.beginPath(); ctx.arc(cx2 - tile * 0.06, gy - tile * 0.1, tile * 0.03, 0, 7); ctx.arc(cx2 + tile * 0.06, gy - tile * 0.1, tile * 0.03, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // hp pips (only when damaged)
  if (e.hp < e.maxHp) {
    const w = tile * 0.5, hw = w * (e.hp / e.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(cx2 - w / 2, py + tile * 0.06, w, 3);
    ctx.fillStyle = '#ff4455';
    ctx.fillRect(cx2 - w / 2, py + tile * 0.06, hw, 3);
  }
}
function drawHUD(dt) {
  const y = hudTop - 40;
  ctx.textAlign = 'left';
  ctx.font = `13px 'Black Ops One', sans-serif`;
  ctx.fillStyle = '#ff9a3c';
  ctx.fillText('DEPTH ' + floorNum, 148, y + 14);
  ctx.fillStyle = '#ffc300';
  ctx.fillText('◈ ' + gold, 148, y + 32);
  // HP bar
  const bw = Math.min(150, W - 250), bx = W - bw - 12;
  ctx.fillStyle = 'rgba(10,8,12,0.8)';
  ctx.fillRect(bx - 2, y + 4, bw + 4, 14);
  ctx.strokeStyle = '#3a3040'; ctx.strokeRect(bx - 2, y + 4, bw + 4, 14);
  const frac = Math.max(0, player.hp / player.maxHp);
  const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  hg.addColorStop(0, '#a01828'); hg.addColorStop(1, '#ff4455');
  ctx.fillStyle = hg;
  ctx.fillRect(bx, y + 6, bw * frac, 10);
  ctx.font = `10px 'Share Tech Mono', monospace`;
  ctx.fillStyle = '#dde3ff';
  ctx.textAlign = 'right';
  ctx.fillText(player.hp + '/' + player.maxHp + ' HP', bx + bw, y + 30);
  // Relic icons — one per kind, ×N when stacked. The whole row is a tap
  // target that opens the detail panel, so it gets a faint plate behind it:
  // an icon strip with no affordance reads as decoration.
  const list = relicCounts();
  const rowY = y + 48;
  ctx.textAlign = 'left';
  // Measure first, then place: six relics with ×N badges are wider than the
  // gap between the gold line and the right edge, so the row slides left to
  // fit rather than running off screen.
  let rowW = 0;
  for (const r of list) {
    rowW += 14 + 4;
    if (r.n > 1) { ctx.font = `9px 'Share Tech Mono', monospace`; rowW += ctx.measureText('\u00d7' + r.n).width + 1; }
  }
  let rx = Math.max(196, Math.min(bx, W - 12 - rowW));
  const rowLeft = rx;
  for (const r of list) {
    ctx.font = `12px 'Share Tech Mono', monospace`;
    ctx.fillStyle = (r.key === 'ward' && wardTimer > 0) ? '#555a70' : '#ffc300';
    ctx.fillText(RELICS[r.key].icon, rx, rowY);
    rx += 14;
    if (r.n > 1) {
      ctx.font = `9px 'Share Tech Mono', monospace`;
      ctx.fillStyle = '#ff9a3c';
      ctx.fillText('\u00d7' + r.n, rx, rowY);
      rx += ctx.measureText('\u00d7' + r.n).width + 1;
    }
    rx += 4;
  }
  if (list.length) {
    buffRect = { x: rowLeft - 8, y: rowY - 14, w: Math.min(W - rowLeft + 4, Math.max(54, rx - rowLeft + 14)), h: 28 };
    ctx.fillStyle = 'rgba(255,154,60,0.07)';
    ctx.fillRect(buffRect.x, buffRect.y, buffRect.w, buffRect.h);
    ctx.strokeStyle = 'rgba(255,154,60,0.28)';
    ctx.lineWidth = 1;
    ctx.strokeRect(buffRect.x + 0.5, buffRect.y + 0.5, buffRect.w - 1, buffRect.h - 1);
  } else {
    buffRect = null;
  }
  drawRecenter();
}

/* The ⌖ handle. Free-look means the camera stops chasing the player, so the
   route back cannot be another gesture (a drag is what got you here) and it
   cannot be a board tap (that walks). A button in the corner of the viewport
   is the only thing that is unambiguous — and it doubles as the signal that
   the camera is currently yours. */
function drawRecenter() {
  if (state !== 'play' || !camFree) { recenterBtn = null; return; }
  const r = 21, cx2 = viewX + viewW - r - 12, cy2 = viewY + viewH - r - 12;
  recenterBtn = { x: cx2, y: cy2, r: r + 8 };
  ctx.fillStyle = 'rgba(10,8,14,0.72)';
  ctx.beginPath(); ctx.arc(cx2, cy2, r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#ff9a3c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx2, cy2, r, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#ffc300'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx2, cy2, 6.5, 0, 7); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx2 - 12, cy2); ctx.lineTo(cx2 - 8, cy2);
  ctx.moveTo(cx2 + 8, cy2); ctx.lineTo(cx2 + 12, cy2);
  ctx.moveTo(cx2, cy2 - 12); ctx.lineTo(cx2, cy2 - 8);
  ctx.moveTo(cx2, cy2 + 8); ctx.lineTo(cx2, cy2 + 12);
  ctx.stroke();
}

/* ============ Relic detail panel ============
   Opened by tapping the HUD relic row, closed by tapping anywhere. It is a
   read of state, never a mutation of it: handleTap returns before tapTile,
   so no step is queued and no enemy turn is taken while it is up. */
function wrapLines(text, maxW) {
  const out = [];
  let cur = '';
  for (const word of text.split(' ')) {
    const next = cur ? cur + ' ' + word : word;
    if (cur && ctx.measureText(next).width > maxW) { out.push(cur); cur = word; }
    else cur = next;
  }
  if (cur) out.push(cur);
  return out;
}
function relicStatus(key, n) {
  if (key === 'ward') {
    const now = wardTimer > 0
      ? 'Recharging \u2014 ready in ' + wardTimer + ' turn' + (wardTimer === 1 ? '' : 's') + '.'
      : 'Shield ready.';
    // The card text quotes the single-copy recharge, so a stack has to say
    // what it actually is rather than leave the two numbers contradicting.
    return n > 1 ? now + ' Recharge now every ' + wardRecharge() + ' turns.' : now;
  }
  if (key === 'blade') return 'Attack now ' + player.atk + '.';
  if (key === 'crown') return 'Max HP now ' + player.maxHp + '.';
  if (key === 'lantern') return 'Light radius ' + lightRadius().toFixed(1) + ' tiles.';
  if (key === 'skin') return 'Incoming damage reduced by ' + n + ' (never below 1).';
  if (key === 'leech') return 'Heals ' + n + ' HP per kill.';
  return '';
}
function drawBuffPanel() {
  if (!buffPanel) return;
  const list = relicCounts();
  if (!list.length) { buffPanel = false; return; }
  const pw = Math.min(W - 32, 344), pad = 15, wrapW = pw - pad * 2 - 4;
  const bodyFont = `11px 'Share Tech Mono', monospace`;
  const blocks = [];
  let hh = pad + 24;
  for (const r of list) {
    ctx.font = bodyFont;
    const desc = wrapLines(RELICS[r.key].desc, wrapW);
    const stat = wrapLines(relicStatus(r.key, r.n), wrapW);
    blocks.push({ r, desc, stat });
    hh += 17 + desc.length * 14 + stat.length * 14 + 12;
  }
  hh += pad - 8;
  const px0 = Math.round((W - pw) / 2);
  const py0 = Math.round(Math.max(hudTop + 8, Math.min(H - hh - 20, (H - hh) / 2)));
  ctx.fillStyle = 'rgba(4,3,6,0.86)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(14,11,18,0.98)';
  ctx.fillRect(px0, py0, pw, hh);
  ctx.strokeStyle = '#ff9a3c'; ctx.lineWidth = 1.5;
  ctx.strokeRect(px0 + 0.5, py0 + 0.5, pw - 1, hh - 1);
  ctx.textAlign = 'left';
  ctx.font = `13px 'Black Ops One', sans-serif`;
  ctx.fillStyle = '#ff9a3c';
  ctx.fillText('RELICS', px0 + pad, py0 + pad + 12);
  ctx.textAlign = 'right';
  ctx.font = `9px 'Share Tech Mono', monospace`;
  ctx.fillStyle = '#7a7286';
  ctx.fillText('TAP ANYWHERE TO CLOSE', px0 + pw - pad, py0 + pad + 11);
  ctx.textAlign = 'left';
  let ty = py0 + pad + 30;
  for (const b of blocks) {
    ctx.font = `12px 'Share Tech Mono', monospace`;
    ctx.fillStyle = '#ffc300';
    const head = RELICS[b.r.key].icon + '  ' + RELICS[b.r.key].name + (b.r.n > 1 ? '  \u00d7' + b.r.n : '');
    ctx.fillText(head, px0 + pad, ty);
    ty += 17;
    ctx.font = bodyFont;
    ctx.fillStyle = '#a89fb4';
    for (const ln of b.desc) { ctx.fillText(ln, px0 + pad + 4, ty); ty += 14; }
    ctx.fillStyle = '#6fd8a0';
    for (const ln of b.stat) { ctx.fillText(ln, px0 + pad + 4, ty); ty += 14; }
    ty += 12;
  }
}

/* ============ Torch ember spawner ============ */
let emberAcc = 0;
function spawnAmbient(dt) {
  emberAcc += dt;
  if (emberAcc < 0.25) return;
  emberAcc = 0;
  for (const t of torches) {
    if (!seen[IDX(t.x, t.y)] || Math.random() < 0.5) continue;
    embers.push({
      x: t.x + 0.5 + (Math.random() - 0.5) * 0.2, y: t.y + 0.35,
      vx: (Math.random() - 0.5) * 0.4, vy: -0.8 - Math.random() * 0.6,
      life: 0, max: 0.7 + Math.random() * 0.7, col: Math.random() < 0.4 ? '#ffd070' : '#ff7a30', r: 1 + Math.random() * 1.6,
    });
  }
  if (Math.random() < 0.7) {
    embers.push({
      x: player.vx + 0.5 + player.face * 0.3, y: player.vy + 0.28,
      vx: (Math.random() - 0.5) * 0.3, vy: -0.7 - Math.random() * 0.5,
      life: 0, max: 0.5 + Math.random() * 0.5, col: '#ff9a40', r: 0.8 + Math.random() * 1.2,
    });
  }
}

/* ============ Camera follow ============
   Runs only while the camera is still the game's (see `camFree`): until the
   player drags or pinches, walking can never lose you off-screen, because
   the camera eases just enough to put the player back inside a dead zone.
   The first drag hands the camera over for good, and only the ⌖ button (or
   descending a floor) takes it back — that is what "look anywhere" means
   here, and why the button has to exist. */
function followCam(dt) {
  if (camFree || !canPan()) return;
  const [px, py] = cellPx(player.vx + 0.5, player.vy + 0.5);
  const mx = Math.min(viewW * 0.32, tile * 2.2), my = Math.min(viewH * 0.32, tile * 2.2);
  let dx = 0, dy = 0;
  if (px < viewX + mx) dx = px - (viewX + mx);
  else if (px > viewX + viewW - mx) dx = px - (viewX + viewW - mx);
  if (py < viewY + my) dy = py - (viewY + my);
  else if (py > viewY + viewH - my) dy = py - (viewY + viewH - my);
  if (!dx && !dy) return;
  const e = Math.min(1, dt * 7);
  camX += (dx / tile) * e; camY += (dy / tile) * e;
  applyView();
}

/* ============ Main loop ============ */
function frame(ts) {
  const dt = Math.min(0.1, (ts - lastT) / 1000 || 0.016);
  lastT = ts; timeNow = ts / 1000;
  // ease visual positions toward logical
  const ease = Math.min(1, dt * 13);
  player.vx += (player.x - player.vx) * ease;
  player.vy += (player.y - player.vy) * ease;
  for (const e of enemies) {
    e.vx += (e.x - e.vx) * ease;
    e.vy += (e.y - e.vy) * ease;
    if (e.hurtT > 0) e.hurtT -= dt;
  }
  if (state === 'play') { pathStep(dt); spawnAmbient(dt); }
  if (!pinch && !dragging) followCam(dt);
  drawScene(dt);
  requestAnimationFrame(frame);
}
genFloor(1);   // background dungeon behind the menu
showMenu();
requestAnimationFrame(frame);
</script>
