<script>
'use strict';
/* ======================================================================
   TURRET BUILDER — a tower defense where the TURRET is the smallest part.
   A turret is a plain gray triangle: 10 kinetic damage, once a second,
   never misses. Everything else you build is a MODULE tile, and a module
   powers EVERY turret and wall it orthogonally touches. That sharing is
   the game: a module wedged between two turrets pays both of them, so the
   board stops being a scatter of towers and becomes a circuit.
   Full design notes: .claude/turret-builder.md
   ====================================================================== */

/* ============================== CONSTANTS ============================= */
const COLS = 9, ROWS = 14;
const WAVES_PER_LEVEL = 8;
const CAMPAIGN_LEVELS = 8;
const TOTAL_WAVES = WAVES_PER_LEVEL * CAMPAIGN_LEVELS;
const LIVES_BASE = 20;

/* Continuous flow — nothing waits on a tap (the grid-defense lesson). */
let GRACE_T = 25, GAP_T = 9, LEVEL_T = 4, FAIL_T = 3;

const VER = 'turretBuilder.v1';
const SET_KEY = VER + '.settings', SCORE_KEY = VER + '.scores';
const AUTO_KEY = VER + '.auto', SLOT_KEY = i => VER + '.slot' + i;
const CODEX_KEY = VER + '.codex';   // combos discovered, ACROSS runs

/* --------------------------- THE BASE TURRET -------------------------
   Spec, verbatim, and the drive suite asserts every number here:
   gray triangle · single target · kinetic · 10 damage · 100% hit · 1/s. */
const TURRET = { dmg: 10, rate: 1.0, range: 2.6, cost: 45, hit: 1.0, maxLvl: 4 };
const TURRET_LVL_DMG = 1.28;      // per cash level
const TURRET_LVL_RATE = 1.04;
function turretUpCost(lvl) { return Math.round(34 * lvl); }

/* ============================ THE PAYLOAD =============================
   A shot builds ONE payload and then propagates it. Every module either
   shapes the payload or copies it somewhere else, which is what makes the
   combinations compose instead of just adding up:

     AMP    multiplies the payload's kinetic damage
     FIRE   adds a burn — elemental damage over FIRE_T seconds
     ICE    adds chill — slows movement AND attack speed, no damage at all
     ELEC   copies the payload onto the next enemy at ELEC_XFER
     BLAST  copies the payload onto everything in a radius at BLAST_XFER

   DAMAGE decays as it is copied; EFFECTS (chill) transfer at FULL potency.
   That split is the one judgement call in the spec: the CD's note says ELEC
   transfers "50% of any dmg or effects like chill", but also that ICE+BLAST
   should chill *all* enemies in the blast radius — at a 25% transfer a chill
   would be quarter-strength and that second sentence could not be true.
   Full-potency effects satisfy both, and they are what makes ICE worth a
   slot now that it deals no damage: its whole product is an effect, and
   effects propagate for free while damage falls off.

   Worked example from the spec — ELEC + BLAST + FIRE + ICE, one per side,
   base 10 — reproduced exactly by drive-turret-builder.cjs:
     main target   10 kinetic + 7.5 burn over 5 s + full chill
     blast at 25%  +2.5 kinetic + 1.875 burn to it and everything near it
     arc at 50%    5 kinetic + 3.75 burn + full chill on the next enemy
     that arc's own blast, 50% x 25%   1.25 kinetic + 0.9375 burn

   STACK CURVES ARE SUPER-LINEAR, and that is where "all-in on one type
   gives increasing returns" lives. There is deliberately NO variety
   penalty: one would contradict the spec's own worked example, which shows
   an unpenalised 10 kinetic and an unpenalised 25% blast on a turret
   carrying four different types. Diminishing returns for variety is
   emergent instead — spreading across four types leaves every one of them
   on its weakest tier, so variety buys COVERAGE (chill + multi-target +
   splash) rather than throughput. Index these by module count, 0..4.     */
const AMP_DMG    = [0, 0.50, 1.10, 1.80, 2.60];   // + fraction of base kinetic
const FIRE_DOT   = [0, 0.75, 2.00, 4.00, 7.00];   // x base kinetic, total over FIRE_T
const FIRE_T     = 5.0;
const ICE_CHILL  = [0, 0.25, 0.42, 0.58, 0.75];   // slows movement AND attack speed
const ICE_T      = [0, 2.0, 2.5, 3.0, 3.5];       // seconds
const ELEC_HOPS  = [0, 1, 2, 3, 4];
const ELEC_XFER  = [0, 0.50, 0.58, 0.66, 0.75];
const ELEC_R     = 2.3;                            // cells a hop can reach
const BLAST_XFER = [0, 0.25, 0.50, 0.78, 1.10];
const BLAST_R    = [0, 0.85, 1.05, 1.25, 1.45];   // cells
const CHILL_CAP  = 0.80;
const XFER_CAP   = 1.60;    // after boosters and combos
const GROUND_T   = 5.0;     // burning ground left by the grenade-launcher combo

const MODULES = {
  amp:   { name:'AMP',   glyph:'◆', col:'#dde3ff', cost:28, tag:'DAMAGE',
           desc:'+50% kinetic damage, and everything downstream scales with it. Four sides → +260%.' },
  fire:  { name:'FIRE',  glyph:'▲', col:'#ff7a1e', cost:22, tag:'BURN',
           desc:'adds a burn worth 75% of the hit over 5 s, as elemental. Four sides → 700%.' },
  ice:   { name:'ICE',   glyph:'❄', col:'#4fd8ff', cost:18, tag:'CHILL',
           desc:'no damage — chills, slowing movement and attack speed by 25% for 2 s. Four sides → 75%.' },
  elec:  { name:'ELEC',  glyph:'⚡', col:'#ffe23f', cost:22, tag:'ARC',
           desc:'arcs to 1 more enemy carrying 50% of the damage and the full chill. Four sides → 4 hops at 75%.' },
  blast: { name:'BLAST', glyph:'✸', col:'#ff4a5e', cost:24, tag:'SPLASH',
           desc:'splashes 25% of the damage and the full chill over everything in the blast. Four sides → 110%.' },
  armor: { name:'ARMOR', glyph:'▣', col:'#9fb3d9', cost:18, tag:'WALL',
           desc:'WALLS ONLY — +35% wall HP and 2 flat damage reduction.' },
  regen: { name:'REGEN', glyph:'✚', col:'#2ee6a8', cost:18, tag:'WALL',
           desc:'WALLS ONLY — the wall repairs 4% of its maximum HP every second.' },
};
const MOD_KEYS = ['amp', 'fire', 'ice', 'elec', 'blast', 'armor', 'regen'];
const COMBAT_MODS = ['amp', 'fire', 'ice', 'elec', 'blast'];
const WALL_ONLY_MODS = ['armor', 'regen'];

/* ===================== DIAGONAL SYNERGY BOOSTERS ======================
   Boosters go on a turret's DIAGONALS, which were deliberately inert until
   now — that is what keeps them a separate decision from the four sides
   rather than just four more module slots. A booster lifts every turret it
   touches diagonally, so the sharing rule holds here too.               */
const BOOST_CAP = 3.5;      // ceiling on the module-output multiplier
const BOOSTERS = {
  twin:  { name:'TWIN',  glyph:'⊕', col:'#39ff14', cost:40,
           desc:'x2 module output — but only while every module on the turret is the SAME type.' },
  prism: { name:'PRISM', glyph:'◈', col:'#b44fff', cost:40,
           desc:'+30% module output for every distinct module type beyond the first.' },
  relay: { name:'RELAY', glyph:'⇄', col:'#4488ff', cost:40,
           desc:'+22% module output for every turret orthogonally touching this one.' },
  clock: { name:'CLOCK', glyph:'»', col:'#ffc300', cost:40,
           desc:'+40% fire rate. Does nothing for the modules, everything for the tempo.' },
};
const BOOST_KEYS = ['twin', 'prism', 'relay', 'clock'];

/* ============================ NAMED COMBOS ============================
   Specific side patterns that do something no amount of stacking will.
   Signatures are ROTATION-INVARIANT so a player who builds the mirror of a
   combo still finds it: four of a kind is 'quad:<type>', and two opposite
   pairs is 'pair:<a>+<b>' with the pair names sorted. Anything else has no
   combo. Each entry sets flags that combat reads directly.              */
const COMBOS = {
  'pair:blast+fire': { id:'grenade', name:'INCENDIARY GRENADE LAUNCHER', col:'#ff3a1e',
    blurb:'blast radius +60%, and every impact leaves the ground burning for 5 s',
    eff:{ blastRMul:1.6, groundFire:true } },
  'pair:blast+ice': { id:'cryoshell', name:'CRYO SHELL', col:'#4fd8ff',
    blurb:'chill in the blast hits the cap and lasts twice as long',
    eff:{ chillCapped:true, chillTMul:2.0 } },
  'pair:blast+elec': { id:'chainreaction', name:'CHAIN REACTION', col:'#ff4a5e',
    blurb:'every arc hop detonates a full-strength explosion of its own',
    eff:{ hopDetonate:true } },
  'pair:amp+blast': { id:'demolition', name:'DEMOLITION CHARGE', col:'#ff8a1e',
    blurb:'blast radius +40%, and the splash ignores half of armour',
    eff:{ blastRMul:1.4, pierce:0.5 } },
  'pair:amp+fire': { id:'lance', name:'THERMAL LANCE', col:'#ff7a1e',
    blurb:'the burn ignores resistance entirely',
    eff:{ dotIgnoreResist:true } },
  'pair:amp+ice': { id:'frostbite', name:'FROSTBITE', col:'#a8e6ff',
    blurb:'chilled enemies take 30% more damage from everything',
    eff:{ chillAmp:0.30 } },
  'pair:amp+elec': { id:'railgun', name:'RAILGUN', col:'#dde3ff',
    blurb:'one hop only, but it carries the payload at full strength',
    eff:{ hopsOverride:1, xferOverride:1.0 } },
  'pair:elec+fire': { id:'wildfire', name:'WILDFIRE', col:'#ffb03f',
    blurb:'arcs carry the burn at full strength, however far they travel',
    eff:{ dotNoDecay:true } },
  'pair:elec+ice': { id:'blizzard', name:'BLIZZARD', col:'#7fe6ff',
    blurb:'+2 hops, and a hop can reach half again as far',
    eff:{ hopBonus:2, hopRMul:1.5 } },
  'pair:fire+ice': { id:'thermalshock', name:'THERMAL SHOCK', col:'#ff5cf0',
    blurb:'a chilled enemy takes double burn damage',
    eff:{ dotChillDouble:true } },
  'quad:amp': { id:'siege', name:'SIEGE BATTERY', col:'#dde3ff',
    blurb:'+30% range, and shots ignore half of armour',
    eff:{ rangeMul:1.3, pierce:0.5 } },
  'quad:fire': { id:'firestorm', name:'FIRESTORM', col:'#ff7a1e',
    blurb:'the burn spreads on its own to anything within 1.2 cells',
    eff:{ dotSpread:1.2 } },
  'quad:ice': { id:'hailstorm', name:'HAILSTORM', col:'#a8e6ff',
    blurb:'chilled enemies lose 40% of their armour',
    eff:{ chillShred:0.4 } },
  'quad:elec': { id:'tesla', name:'TESLA COIL', col:'#ffe23f',
    blurb:'+2 hops, and no hop ever transfers below 60%',
    eff:{ hopBonus:2, xferFloor:0.6 } },
  'quad:blast': { id:'mortar', name:'MORTAR BATTERY', col:'#ff4a5e',
    blurb:'blast radius +50%',
    eff:{ blastRMul:1.5 } },
};
/* The side map a turret's modules form, reduced to a rotation-invariant key.
   ORTHO order is [up, down, left, right], so up/down and left/right are the
   two opposite pairs. */
const COMBOS_BY_ID = {};
for (const k of Object.keys(COMBOS)) COMBOS_BY_ID[COMBOS[k].id] = COMBOS[k];
const COMBO_TOTAL = Object.keys(COMBOS).length;
function comboKeyOf(sides) {
  const [U, D, L, R] = sides;
  if (!U || !D || !L || !R) return null;
  if (U === D && D === L && L === R) return 'quad:' + U;
  const a = (U === D) ? U : null, b = (L === R) ? L : null;
  if (a && b && a !== b) return 'pair:' + [a, b].sort().join('+');
  return null;
}

/* -------------------------------- WALLS -------------------------------
   Walls sit ON the road. A creep that reaches one stops and hits it; the
   wall is buying you seconds, and the pile-up it creates is what BLAST and
   ARC want. A road cell has two road neighbours and two free sides, so a
   wall takes exactly two modules — which is the spec, and also just the
   geometry.  Wall module output is a FRACTION OF THE WALL'S MAX HP, so
   BULWARK tiers and ARMOR modules scale the wall's teeth along with its
   body instead of leaving it a wet paper bag by level 6.               */
const WALL = { hp: 100, cost: 45 };
const WALL_FIRE  = 0.035;  // of maxHP, as a 4 s burn on the attacker
const WALL_FIRE_T = 4.0;
const WALL_ICE   = 0.25;   // attack speed AND move speed slow, per module
const WALL_ICE_T = 1.5;
const WALL_ARC   = 0.06;   // of maxHP, elemental, to the attacker + 2 jumps
const WALL_ARC_JUMPS = 2;
const WALL_THORN = 0.07;   // of maxHP, kinetic, splashed round the attacker
const WALL_THORN_R = 0.85;
const WALL_ARMOR_HP = 0.35, WALL_ARMOR_DR = 2;
const WALL_REGEN = 0.04;   // of maxHP per second
const WALL_REPAIR_COST = 0.35;  // of build cost, to repair to full

/* ------------------------------ THE LAB -------------------------------
   Cores are persistent for a run. GRID buys turret slots, which is the
   real currency of this game: cash is never the binding constraint for
   long, board space and slots are.                                     */
const LAB = [
  { id:'grid',    name:'GRID',    tiers:5, c0:5, step:3, icon:'grid',
    desc:'+1 turret slot per tier.' },
  { id:'chassis', name:'CHASSIS', tiers:5, c0:5, step:3, icon:'turret',
    desc:'+20% turret damage per tier — and every module is a % of that.' },
  { id:'amp',     name:'AMP',     tiers:4, c0:4, step:2, icon:'amp',
    desc:'+14% AMP output per tier.' },
  { id:'servo',   name:'SERVO',   tiers:4, c0:5, step:3, icon:'servo',
    desc:'+9% turret fire rate per tier.' },
  { id:'optics',  name:'OPTICS',  tiers:4, c0:4, step:2, icon:'optics',
    desc:'+8% turret range per tier.' },
  { id:'fire',    name:'FIRE',    tiers:4, c0:4, step:2, icon:'fire',
    desc:'+26% FIRE burn per tier — the single-target modules climb fastest.' },
  { id:'ice',     name:'ICE',     tiers:4, c0:4, step:2, icon:'ice',
    desc:'+26% ICE chill per tier.' },
  { id:'elec',    name:'ELEC',    tiers:4, c0:4, step:2, icon:'elec',
    desc:'+14% ELEC transfer per tier.' },
  { id:'blast',   name:'BLAST',   tiers:4, c0:4, step:2, icon:'blast',
    desc:'+14% BLAST splash and radius per tier.' },
  { id:'bulwark', name:'BULWARK', tiers:4, c0:5, step:3, icon:'wall',
    desc:'+30% wall HP and +1 wall slot per tier.' },
];
const LAB_BY_ID = {};
for (const t of LAB) LAB_BY_ID[t.id] = t;
function labCost(id, tier) { const t = LAB_BY_ID[id]; return t.c0 + t.step * tier; }
/* Per-tier lab growth, and it is DELIBERATELY UNEVEN. The four module
   percentages are the CD's spec and are not negotiable — but they hand ARC
   and BLAST a structural advantage that no tuning of the curve can undo:
   four ARC modules put 20% of the hit on FIVE targets (up to a full extra
   turret's worth of damage against a pack) while four FIRE modules put 40%
   on ONE. Measured, mono-ARC and mono-BLAST clear the campaign and outscore
   an evenly-mixed grid; mono-FIRE and mono-ICE stall at 5 and 3.
   The lab is the one lever that is mine rather than the spec's, so the
   single-target modules climb roughly two and a half times faster per tier

  g.gain.setValueAtTime(vol || 0.2, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);

/* ============================ PATH BUILDING =========================== */
function buildPath(idx) {
  const m = MAPS[idx];
  pathCells = new Set(); rockCells = new Set(); segs = []; totalLen = 0; distMemo = new Map();
  terrain = { key:'', tufts:[], blobs:[], tone:[] };
  const pts = m.pts.map(p => ({ x: cellCx(p[0]), y: cellCy(p[1]) }));
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    segs.push({ a, b, len, at: totalLen });
    totalLen += len;
  }
  // mark every cell the polyline passes through
  for (let i = 0; i < m.pts.length - 1; i++) {
    const [c0, r0] = m.pts[i], [c1, r1] = m.pts[i + 1];
    const steps = Math.max(Math.abs(c1 - c0), Math.abs(r1 - r0));
    for (let s = 0; s <= steps; s++) {
      const c = Math.round(c0 + (c1 - c0) * s / steps);
      const r = Math.round(r0 + (r1 - r0) * s / steps);
      if (inBoard(r, c)) pathCells.add(key(r, c));
    }
  }
  for (const [c, r] of (m.rocks || [])) if (inBoard(r, c) && !pathCells.has(key(r, c))) rockCells.add(key(r, c));
  mapIdx = idx;
}
function posAt(d) {
  d = clamp(d, 0, totalLen);
  for (const s of segs) {
    if (d <= s.at + s.len) {
      const t = s.len > 0 ? (d - s.at) / s.len : 0;
      return { x: s.a.x + (s.b.x - s.a.x) * t, y: s.a.y + (s.b.y - s.a.y) * t };
    }
  }
  const l = segs[segs.length - 1];
  return { x: l.b.x, y: l.b.y };
}
/* Distance along the path at which a given road cell's centre sits. Memoised
   per map+cell-size: canPlace('wall', ...) sweeps the whole board on every
   armed drop, and an un-memoised 400-sample scan per road cell showed up. */
let distMemo = new Map();
function pathDistOfCell(r, c) {
  const k = key(r, c);
  const hitv = distMemo.get(k);
  if (hitv !== undefined) return hitv;
  const x = cellCx(c), y = cellCy(r);
  let best = 0, bd = Infinity;
  const N = 400;
  for (let i = 0; i <= N; i++) {
    const d = totalLen * i / N, p = posAt(d);
    const dd = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
    if (dd < bd) { bd = dd; best = d; }
  }
  distMemo.set(k, best);
  return best;
}
/* Keep anything drawn AT an off-grid path point inside the board, so exit

function boardPoint(p) {

  return o;
}
function announceCombos(before) {

    const was = before[key(t.r, t.c)];
    if (was === t.combo.id) continue;

    const isNew = !codex[t.combo.id];

  }

function recomputeGrid() {
  cellIndex = new Map();
  for (const t of tiles) cellIndex.set(key(t.r, t.c), t);
  for (const t of tiles) {
    t.mods = emptyMods(); t.boost = emptyBoost();
    t.links = []; t.fed = 0; t.sides = [null, null, null, null];
  }
  /* modules feed the four orthogonal sides */
  for (const m of tiles) {
    if (m.kind !== 'module') continue;
    for (let d = 0; d < 4; d++) {
      const [dr, dc] = ORTHO[d];
      const n = tileAt(m.r + dr, m.c + dc);
      if (!n || n.kind === 'module' || n.kind === 'booster') continue;
      if (WALL_ONLY_MODS.includes(m.mod) && n.kind !== 'wall') continue;
      n.mods[m.mod]++;
      // record which SIDE of n this module sits on, from n's point of view:
      // n is at m+(dr,dc), so the module is at n-(dr,dc) — the opposite side
      const side = d ^ 1;                    // 0<->1 (up/down), 2<->3 (left/right)
      n.sides[side] = m.mod;
      n.links.push({ from:m, dr:-dr, dc:-dc });
      m.fed++;
      m.links.push({ to:n, dr, dc });
    }
  }
  /* boosters lift the four diagonals — inert for everything except turrets */
  for (const b of tiles) {
    if (b.kind !== 'booster') continue;
    for (const [dr, dc] of DIAG) {
      const n = tileAt(b.r + dr, b.c + dc);
      if (!n || n.kind !== 'turret') continue;
      n.boost[b.boostKind]++;
      n.links.push({ from:b, dr:-dr, dc:-dc, diag:true });
      b.fed++;
      b.links.push({ to:n, dr, dc, diag:true });
    }
  }
  for (const t of tiles) {
    if (t.kind === 'turret') recomputeTurret(t);
    else if (t.kind === 'wall') recomputeWall(t);
  }
}
function labTier(id) { return (run && run.lab[id]) || 0; }
function modScale(id) { return 1 + (MOD_LAB_STEP[id] || 0) * labTier(id); }

function turretDamage(t) {
  const amp = AMP_DMG[Math.min(4, t.mods.amp)] * modScale('amp');
  return TURRET.dmg
    * Math.pow(TURRET_LVL_DMG, t.lvl - 1)
    * (1 + 0.20 * labTier('chassis'))
    * (1 + amp);
}
/* How many orthogonal turrets touch this one — RELAY's payoff. */
function turretNeighbours(t) {
  let n = 0;
  for (const [dr, dc] of ORTHO) { const o = tileAt(t.r + dr, t.c + dc); if (o && o.kind === 'turret') n++; }
  return n;
}
function recomputeTurret(t) {
  const m = t.mods, b = t.boost;
  const nAmp = Math.min(4, m.amp), nFire = Math.min(4, m.fire);
  const nIce = Math.min(4, m.ice), nElec = Math.min(4, m.elec), nBlast = Math.min(4, m.blast);
  const distinct = COMBAT_MODS.filter(k => m[k] > 0);
  t.combo = COMBOS[comboKeyOf(t.sides)] || null;
  const E = (t.combo && t.combo.eff) || {};
  t.eff = E;

  /* the booster multiplier on module output */
  let mul = 1;
  if (b.twin > 0 && distinct.length === 1 && m[distinct[0]] >= 2) mul *= Math.pow(2, Math.min(2, b.twin));
  if (b.prism > 0 && distinct.length >= 2) mul *= 1 + 0.30 * (distinct.length - 1) * Math.min(2, b.prism);
  if (b.relay > 0) mul *= 1 + 0.22 * turretNeighbours(t) * Math.min(2, b.relay);
  t.boostMul = Math.min(BOOST_CAP, mul);

  t.D = turretDamage(t);
  t.rate = TURRET.rate * Math.pow(TURRET_LVL_RATE, t.lvl - 1)
         * (1 + 0.09 * labTier('servo'))
         * (1 + 0.40 * Math.min(2, b.clock));
  t.rangePx = TURRET.range * (1 + 0.08 * labTier('optics')) * (E.rangeMul || 1) * cell;

  /* the payload this turret produces */
  t.dot     = nFire ? t.D * FIRE_DOT[nFire] * modScale('fire') * t.boostMul : 0;
  t.chill   = nIce ? Math.min(CHILL_CAP, ICE_CHILL[nIce] * modScale('ice') * t.boostMul) : 0;
  t.chillT  = nIce ? ICE_T[nIce] * (E.chillTMul || 1) : 0;
  t.hops    = nElec ? (E.hopsOverride !== undefined ? E.hopsOverride
                       : ELEC_HOPS[nElec] + (E.hopBonus || 0)) : 0;
  t.xfer    = nElec ? (E.xferOverride !== undefined ? E.xferOverride
                       : Math.min(XFER_CAP, Math.max(E.xferFloor || 0,
                           ELEC_XFER[nElec] * modScale('elec') * t.boostMul))) : 0;
  t.hopR    = ELEC_R * (E.hopRMul || 1) * cell;
  t.blast   = nBlast ? Math.min(XFER_CAP, BLAST_XFER[nBlast] * modScale('blast') * t.boostMul) : 0;
  t.blastR  = nBlast ? BLAST_R[nBlast] * (1 + 0.12 * labTier('blast')) * (E.blastRMul || 1) * cell : 0;

  /* headline numbers for the selection panel only — the real damage is
     whatever propagate() actually delivers */
  const spread = 1 + t.blast * 2.5;                     // ~2.5 bodies in a blast
  let chainMul = 1, s = 1;
  for (let i = 0; i < t.hops; i++) { s *= t.xfer; chainMul += s; }
  // burn refreshes rather than stacks, so its sustained rate is total/duration
  t.dps = (t.D + t.dot / FIRE_T) * t.rate * spread * chainMul;
  t.targets = Math.round(chainMul * spread * 10) / 10;
}
function wallMaxHp(t) {
  return Math.round(WALL.hp
    * (1 + 0.30 * labTier('bulwark'))
    * (1 + WALL_ARMOR_HP * t.mods.armor));
}
function recomputeWall(t) {
  const was = t.maxHp || 0;
  t.maxHp = wallMaxHp(t);
  t.hp = was > 0 ? Math.min(t.maxHp, t.hp * (t.maxHp / was)) : t.maxHp;
  t.dr = WALL_ARMOR_DR * t.mods.armor;
  const m = t.mods, M = t.maxHp;
  t.wFire  = m.fire  ? M * WALL_FIRE  * m.fire  * modScale('fire') : 0;
  t.wChill = m.ice   ? Math.min(CHILL_CAP, WALL_ICE * m.ice * modScale('ice')) : 0;
  t.wArc   = m.elec  ? M * WALL_ARC   * m.elec  * modScale('elec') : 0;
  t.wThorn = m.blast ? M * WALL_THORN * m.blast * modScale('blast') : 0;
  t.wAmp   = m.amp   ? M * WALL_THORN * m.amp   * modScale('amp') : 0;   // straight kinetic back
  t.wRegen = m.regen ? M * WALL_REGEN * m.regen : 0;
  t.eff = {};
}

/* ---------------------------- CAPS AND COSTS -------------------------- */
function turretCap() { return TURRET_CAP_BASE + labTier('grid'); }
function wallCap() { return WALL_CAP_BASE + labTier('bulwark'); }
function countKind(k) { let n = 0; for (const t of tiles) if (t.kind === k) n++; return n; }
function costOf(kind) {
  if (kind === 'turret') return TURRET.cost;
  if (kind === 'wall') return WALL.cost;
  if (BOOSTERS[kind]) return BOOSTERS[kind].cost;
  return MODULES[kind].cost;
}
function kindOf(k) {
  if (k === 'turret' || k === 'wall') return k;
  return BOOSTERS[k] ? 'booster' : 'module';
}
function unlocked(kind) { return run ? globalWave() >= UNLOCK[kind] || run.unlocked[kind] : false; }
function labOpen() { return run ? globalWave() >= LAB_WAVE || run.labSeen : false; }

function canPlace(kind, r, c) {
  if (!inBoard(r, c) || tileAt(r, c)) return false;
  if (rockCells.has(key(r, c))) return false;
  if (!unlocked(kind)) return false;
  if (kind === 'wall') {
    if (!pathCells.has(key(r, c))) return false;
    // never right at the mouth or the exit, or creeps would stall off-board
    const d = pathDistOfCell(r, c);
    if (d < cell * 1.2 || d > totalLen - cell * 1.2) return false;
    return countKind('wall') < wallCap();
  }
  if (pathCells.has(key(r, c))) return false;
  if (kind === 'turret') return countKind('turret') < turretCap();
  return true;   // modules and boosters are limited by cash and by geometry
}
function anyPlacement(kind) {
  if (cash < costOf(kind)) return false;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (canPlace(kind, r, c)) return true;
  return false;
}
function place(kind, r, c, free) {
  if (!canPlace(kind, r, c)) return false;
  const cost = costOf(kind);
  if (!free && cash < cost) return false;
  if (!free) cash -= cost;
  let t;
  const base = { r, c, spent:cost, mods:emptyMods(), boost:emptyBoost(), links:[], sides:[null,null,null,null] };
  if (kind === 'turret') t = Object.assign(base, { kind:'turret', lvl:1, cd:0, tid:0 });
  else if (kind === 'wall') t = Object.assign(base, { kind:'wall', lvl:1, hp:0, maxHp:0, d:pathDistOfCell(r, c) });
  else if (BOOSTERS[kind]) t = Object.assign(base, { kind:'booster', boostKind:kind });
  else t = Object.assign(base, { kind:'module', mod:kind });
  tiles.push(t);
  const before = comboSnapshot();
  recomputeGrid();
  announceCombos(before);
  if (kind === 'wall') { t.hp = t.maxHp; }
  if (t.kind === 'module' && t.fed > 0) sfxLink(); else sfxBuild();
  return true;
}
function sellAt(r, c) {
  const i = tiles.findIndex(t => t.r === r && t.c === c);
  if (i < 0) return false;
  const t = tiles[i];
  cash += Math.floor(t.spent * 0.5);
  tiles.splice(i, 1);
  if (sel === t) sel = null;
  recomputeGrid();
  sfxSell();
  return true;
}
function upgradeAt(r, c) {
  const t = tileAt(r, c);
  if (!t) return false;
  if (t.kind === 'turret') {
    if (t.lvl >= TURRET.maxLvl) return false;
    const cost = turretUpCost(t.lvl);
    if (cash < cost) return false;
    cash -= cost; t.spent += cost; t.lvl++;
    recomputeGrid(); sfxBuild(); return true;
  }
  if (t.kind === 'wall') {          // walls "upgrade" by being repaired
    if (t.hp >= t.maxHp - 0.01) return false;
    const cost = Math.max(4, Math.round(WALL.cost * WALL_REPAIR_COST * (1 - t.hp / t.maxHp)));
    if (cash < cost) return false;
    cash -= cost; t.hp = t.maxHp; sfxBuild(); return true;
  }
  return false;
}
function buyLab(id) {
  const tr = LAB_BY_ID[id];
  if (!tr || !run || !labOpen()) return false;
  const cur = run.lab[id] || 0;
  if (cur >= tr.tiers) return false;
  const c = labCost(id, cur);
  if (run.cores < c) return false;
  run.cores -= c; run.lab[id] = cur + 1;
  recomputeGrid();
  sfxUnlock();
  return true;

/* =============================== THE RUN ============================== */
function globalWave() { return run ? (run.level - 1) * WAVES_PER_LEVEL + run.wave : 0; }
function newRunObj() {
  const lab = {};
  for (const t of LAB) lab[t.id] = 0;
  return {
    level:1, wave:1, lives:LIVES_BASE, cores:0, score:0, levelScore:0,
    retries:0, lab, unlocked:{}, labSeen:false, recorded:false, combosFound:{},
    elapsed:0, levelElapsed:0, levelTimes:[], won:false,
  };
}
function applyUnlocks() {
  const gw = globalWave();
  for (const k of BUILD_ORDER) if (gw >= UNLOCK[k] && !run.unlocked[k]) run.unlocked[k] = true;
  if (gw >= LAB_WAVE) run.labSeen = true;
}
function startRun() {
  run = newRunObj();
  state = 'play';
  if (overTimer) { clearTimeout(overTimer); overTimer = null; }
  startLevel(1);
}
function startLevel(L) {
  run.level = L; run.wave = 1; run.lives = LIVES_BASE; run.levelScore = 0; run.levelElapsed = 0;
  // Roll the whole attempt back if it is a retry: everything a level earned
  // reverts, so a level can never be farmed for cores by dying on purpose.
  run.snapshot = { cores:run.cores, score:run.score, lab:Object.assign({}, run.lab) };
  buildPath(mapIndexFor(L));
  tiles = []; cellIndex = new Map(); creeps = []; spawnList = []; beams = []; floats = []; sparks = []; grounds = [];
  sel = null; armedKind = null; dragCard = null;
  cash = startCashFor(L);
  levelLeaks = 0; levelKills = 0;
  applyUnlocks();
  recomputeGrid();
  phase = 'grace'; phaseT = GRACE_T; waveT = 0;
  pendingStart = false;
  autoSave();
  toast('LEVEL ' + L + ' · ' + MAPS[mapIdx].name, '#ffc300');
  sfxHorn();
}
/* Endless has no retries — a breach there ends the run and records it, which
   is what gives the scoreboard its teeth. Inside the campaign the attempt is
   rolled back WHOLE: score, cores and every lab tier revert to how they stood
   when the level opened. Without that rollback a patient player farms a level
   for cores, dies on purpose, and keeps them. */
function failLevel() {
  if (run.level > CAMPAIGN_LEVELS) { sfxLose(); endRun(false); return; }
  const s = run.snapshot;
  run.cores = s.cores; run.score = s.score; run.lab = Object.assign({}, s.lab);
  run.retries++;
  phase = 'failed'; phaseT = FAIL_T;
  toast('BREACHED · REBUILDING LEVEL ' + run.level, '#ff2244');
  sfxLose();
}
function completeLevel() {
  // latch the phase FIRST: without it the "board is clear" check re-fires
  // every frame and farms the level bonus forever
  phase = 'levelclear'; phaseT = LEVEL_T;
  const bonus = 120 * run.level + run.lives * 12;
  run.levelScore += bonus;
  run.score += run.levelScore;
  run.levelTimes.push(run.levelElapsed);
  applyUnlocks();
  toast('LEVEL ' + run.level + ' CLEAR · +' + fmtNum(bonus), '#39ff14');
  sfxWin();
  if (run.level >= CAMPAIGN_LEVELS && !run.won) {
    run.won = true;
    toast('CAMPAIGN COMPLETE · ENDLESS BEGINS', '#ffc300');
  }
}
/* The between-levels auto-save must name the level to OPEN, not the one just
   finished, and must carry no board — otherwise CONTINUE reopens the next
   level number holding the previous level's tiles and cash. */
function advanceLevel() {
  const next = run.level + 1;
  run.level = next; run.wave = 1;
  pendingStart = true;
  autoSave();
  startLevel(next);
}
function endRun(won) {
  if (!run.recorded) {
    run.recorded = true;
    addScore({ ts:Date.now(), level:run.level, wave:run.wave, score:Math.round(run.score),
               retries:run.retries, won:!!won, mins:Math.round(run.elapsed / 60) });
  }
  state = 'dead';
  if (overTimer) clearTimeout(overTimer);
  overTimer = setTimeout(() => { overTimer = null; showGameOver(); }, 700);

/* ============================ WAVE BUILDING ===========================
   Deterministic composition AND deterministic elites. grid-defense found
   that rolling elites at random let one wave land a heavy the next one
   missed — an invisible wobble on a curve that was supposed to be
   monotonic. Here every count and every elite stamp is a function of the
   global wave index alone. */
function buildWave(gw) {
  const L = levelOfWave(gw), w = waveInLevel(gw);
  const mix = WAVE_MIX[w - 1];
  const grow = 1 + MIX_GROWTH * (L - 1);
  const groups = [];
  for (const type of Object.keys(mix)) {
    let n = mix[type];
    n = type === 'boss' ? n + Math.floor((L - 1) / 4) : Math.max(1, Math.round(n * grow));
    groups.push({ type, n });
  }
  // from level 2, every previously-seen type shows up even off its own wave
  if (L >= 2 && w < WAVES_PER_LEVEL) {
    /* WARD leans heavier than the rest on purpose. It is the ONLY answer to
       an all-elemental grid, and at parity with hulk/sapper a mono-ARC build
       cleared the whole campaign — arc spreads 20% of the hit across five
       targets, so against an unresistant crowd it simply out-throughputs a
       mixed grid. Resist is the tax that makes mixing worth it. */
    const FILL = { hulk: 0.5, ward: 1.0, sapper: 0.5 };
    for (const type of ['hulk', 'ward', 'sapper']) {
      if (!mix[type] && UNLOCK_SEEN[type] <= w + 2) groups.push({ type, n: Math.max(1, Math.round((L - 1) * FILL[type])) });
    }
  }
  // round-robin interleave so a wave arrives mixed, not in blocks
  const out = [];
  let more = true, i = 0;
  while (more) {
    more = false;
    for (const g of groups) { if (i < g.n) { out.push(g.type); more = true; } }
    i++;
  }
  const hp = hpMulFor(gw), spd = spdMulFor(gw);
  const win = spawnWindowFor(w);
  const list = [];
  for (let k = 0; k < out.length; k++) {
    const elite = L >= ELITE_LEVEL && out[k] !== 'boss' && (k % ELITE_EVERY === ELITE_EVERY - 1);
    list.push({
      type: out[k], elite,
      at: out.length > 1 ? win * k / (out.length - 1) : 0,
      hp: CREEPS[out[k]].hp * hp * (elite ? ELITE_HP : 1),
      arm: CREEPS[out[k]].arm * armMulFor(gw),
      spd: CREEPS[out[k]].spd * spd,
      bounty: Math.round(CREEPS[out[k]].bounty * (elite ? ELITE_BOUNTY : 1)),
    });
  }
  return list;
}
// which wave each type is first met on, so the "always present" filler above
// never introduces something early
const UNLOCK_SEEN = { grub:1, dash:2, mite:3, hulk:4, ward:5, sapper:6, mender:7, boss:8 };

function startWave() {
  phase = 'wave'; waveT = 0;
  spawnList = buildWave(globalWave());
  toast('WAVE ' + run.wave + '/' + WAVES_PER_LEVEL, '#4488ff');
  sfxHorn();
}
function spawnCreep(e) {
  const def = CREEPS[e.type];
  creeps.push({
    id: ++creepSeq, type:e.type, def, elite:e.elite,
    hp:e.hp, maxHp:e.hp, spd:e.spd, bounty:e.bounty, arm:e.arm,
    d:0, x:0, y:0, burn:null, chill:0, chillT:0, chillAmp:0, chillShred:0,
    atkCd:0, dead:false, hitFlash:0,
  });
}

/* =============================== COMBAT ===============================
   Two damage channels and one rule each:
     KINETIC   is reduced FLAT by armour (never below 15% of the hit)
     ELEMENTAL is reduced by a PERCENTAGE resist
   That is the whole reason a one-note grid loses. HULK's armour eats a
   bare turret; WARD's resist eats a wall of fire; the BREAKER has both. */
function dealDamage(c, amount, type, tag, opts) {
  if (!c || c.dead || amount <= 0) return 0;
  const o = opts || {};
  const chilled = c.chillT > 0;
  let dmg;
  if (type === 'kin') {
    let arm = (c.arm !== undefined ? c.arm : c.def.arm);
    if (chilled && c.chillShred) arm *= 1 - c.chillShred;    // HAILSTORM cracks it
    if (o.pierce) arm *= 1 - o.pierce;                        // SIEGE / DEMOLITION
    dmg = Math.max(amount * KIN_FLOOR, amount - arm);
  } else {
    dmg = o.ignoreResist ? amount : amount * (1 - c.def.res); // THERMAL LANCE
  }
  if (chilled && c.chillAmp) dmg *= 1 + c.chillAmp;           // FROSTBITE
  c.hp -= dmg; c.hitFlash = 0.12;
  if (dmgLog) dmgLog.push({ id:c.id, amt:dmg, raw:amount, type, tag:tag || '', parts:o.parts ? Object.assign({}, o.parts) : null });
  if (c.hp <= 0 && !c.dead) killCreep(c);
  return dmg;
}
function killCreep(c) {
  c.dead = true;
  cash += c.bounty;
  levelKills++;
  run.levelScore += c.bounty * 2;
  for (let i = 0; i < 5; i++)
    sparks.push({ x:c.x, y:c.y, vx:(RNG() - 0.5) * 130, vy:(RNG() - 0.5) * 130, t:0.35, col:c.def.col });
}
/* The burn REFRESHES rather than stacks: one burn per creep, and a stronger
   application replaces a weaker one. Stacking made a 1/s turret with a 5 s
   burn reach five concurrent copies, which turned FIRE's headline number
   into five times itself and made it impossible to reason about. */
function applyDot(c, total, dur, opts) {
  if (!c || c.dead || total <= 0) return;
  const o = opts || {};
  const dps = total / dur;
  if (!c.burn || dps >= c.burn.dps) {
    c.burn = { dps, t: dur, ignoreResist: !!o.ignoreResist,
               chillDouble: !!o.chillDouble, spread: o.spread || 0 };
  } else {
    c.burn.t = Math.max(c.burn.t, dur);
  }
}
function applyChill(c, potency, dur, opts) {
  if (!c || c.dead || potency <= 0) return;
  const o = opts || {};
  const p = Math.min(CHILL_CAP, o.capped ? CHILL_CAP : potency);
  if (p >= c.chill || c.chillT <= 0) { c.chill = p; c.chillAmp = o.amp || 0; c.chillShred = o.shred || 0; }

  let best = null, bd = radiusPx * radiusPx;
  for (const c of creeps) {
    if (c.dead || exclude.has(c.id)) continue;
    const dx = c.x - from.x, dy = c.y - from.y, dd = dx * dx + dy * dy;
    if (dd <= bd) { bd = dd; best = c; }
  }
  return best;
}

/* ======================== PAYLOAD PROPAGATION =========================
   One payload, copied outwards. DAMAGE is multiplied by `scale` at every
   copy; EFFECTS land at full potency wherever the payload reaches. This
   single recursion is what reproduces the spec's worked example to the
   decimal, and what makes every module combination compose.            */
/* One shot ACCUMULATES per enemy and commits once. That matters because the
   burn refreshes rather than stacks: applied piecemeal, an enemy standing in
   its own blast would keep only the larger of the direct burn and the splash
   burn (7.5, discarding 1.875) instead of the spec's 9.375. Accumulating
   inside the shot and refreshing only BETWEEN shots gives both — the spec's
   arithmetic exactly, and a burn that cannot be stacked into absurdity by a
   fast turret. It also means one damage application per enemy per shot. */
function addTo(acc, c, P, scale, E) {
  let a = acc.get(c.id);
  if (!a) { a = { c, kin:0, dot:0, chill:0, chillT:0, parts:{ hit:0, blast:0, arc:0 } }; acc.set(c.id, a); }
  a.kin += P.kin * scale;
  a.dot += P.dot * (E.dotNoDecay ? 1 : scale);

    if (a.dot > 0) applyDot(a.c, a.dot, FIRE_T, {

/* ------------------------- CONTINUOUS TRACKING ------------------------
   A turret HOLDS its target frame to frame and only lets go when the
   target dies or leaves range — then it snaps to the next one in the same

   to follow whether or not it is ready to fire, which is what makes the
   board read as a set of machines watching the road. */

/* ------------------------------- WALLS -------------------------------- */
function wallAhead(d) {
  let best = null;
  for (const t of tiles) {
    if (t.kind !== 'wall' || t.hp <= 0) continue;
    if (t.d <= d - 0.5) continue;
    if (!best || t.d < best.d) best = t;
  }
  return best;
}
function creepHitsWall(c, wall, dt) {
  const rate = 1 * (1 - (c.chillT > 0 ? c.chill : 0));   // chill slows attack speed too
  c.atkCd -= dt * rate;
  if (c.atkCd > 0) return;
  c.atkCd = 1;
  const raw = c.def.wall * (c.elite ? 1.3 : 1);
  wall.hp -= Math.max(raw * 0.2, raw - wall.dr);
  sfxWallHit();
  /* The wall answers with whatever is bolted to its two free sides. It uses
     the same primitives as a turret, so ICE on a wall chills exactly as ICE
     on a turret does — the module means one thing everywhere. */
  if (wall.wFire > 0) applyDot(c, wall.wFire, WALL_FIRE_T, {});
  if (wall.wChill > 0) applyChill(c, wall.wChill, WALL_ICE_T, {});
  if (wall.wThorn > 0) {
    for (const o of creeps) {
      if (o.dead || Math.hypot(o.x - c.x, o.y - c.y) > WALL_THORN_R * cell) continue;
      dealDamage(o, wall.wThorn, 'kin', 'thorn');

    sparks.push({ x:c.x, y:c.y, vx:0, vy:0, t:0.2, col:MODULES.blast.col, ring:WALL_THORN_R * cell });
  }
  if (wall.wAmp > 0) dealDamage(c, wall.wAmp, 'kin', 'thorn');
  if (wall.wArc > 0) {
    const hit = new Set([c.id]);
    dealDamage(c, wall.wArc, 'ele', 'arc');
    let prev = c;
    for (let k = 0; k < WALL_ARC_JUMPS; k++) {
      const nx = nearestCreep(prev, ELEC_R * cell, hit);
      if (!nx) break;
      beams.push({ x1:prev.x, y1:prev.y, x2:nx.x, y2:nx.y, t:0.12, col:MODULES.elec.col, w:2 });
      dealDamage(nx, wall.wArc * 0.6, 'ele', 'arc');
      hit.add(nx.id); prev = nx;
    }
    sfxArc();
  }
  if (wall.hp <= 0) {
    wall.hp = 0;
    sfxWallDie();
    toast('WALL DOWN', '#ff8a1e');
    for (let i = 0; i < 8; i++)
      sparks.push({ x:cellCx(wall.c), y:cellCy(wall.r), vx:(RNG() - 0.5) * 220, vy:(RNG() - 0.5) * 220, t:0.4, col:'#9fb3d9' });
  }
}

/* ================================ UPDATE ==============================
   A timer state machine, exactly like grid-defense: grace -> wave -> gap
   -> ... -> levelclear -> next level, with failed looping back to a
   retry. Nothing in this game waits on a tap. */
function update(dt) {
  if (state !== 'play' || paused) return;
  dt = Math.min(dt, 0.1);
  run.elapsed += dt;
  run.levelElapsed += dt;
  shake = Math.max(0, shake - dt);

  if (phase === 'grace' || phase === 'gap') {
    phaseT -= dt;
    if (phaseT <= 0) startWave();
  } else if (phase === 'levelclear') {
    phaseT -= dt;
    if (phaseT <= 0) advanceLevel();
    return;
  } else if (phase === 'failed') {
    phaseT -= dt;
    if (phaseT <= 0) startLevel(run.level);
    return;
  }

  if (phase === 'wave') {
    waveT += dt;
    while (spawnList.length && spawnList[0].at <= waveT) spawnCreep(spawnList.shift());
  }

  /* ---- creeps ---- */
  for (const c of creeps) {
    if (c.dead) continue;
    c.hitFlash = Math.max(0, c.hitFlash - dt);
    if (c.chillT > 0) { c.chillT -= dt; if (c.chillT <= 0) { c.chill = 0; c.chillAmp = 0; c.chillShred = 0; } }
    if (c.burn) {
      const b = c.burn, step = Math.min(dt, b.t);
      let amt = b.dps * step;
      if (b.chillDouble && c.chillT > 0) amt *= 2;            // THERMAL SHOCK
      dealDamage(c, amt, 'ele', 'dot', { ignoreResist: b.ignoreResist });
      b.t -= dt;
      // FIRESTORM: a burn that finds its own neighbours
      if (b.spread > 0) {
        for (const o of creeps) {
          if (o.dead || o === c || o.burn) continue;
          if (Math.hypot(o.x - c.x, o.y - c.y) <= b.spread * cell)
            o.burn = { dps:b.dps * 0.6, t:b.t, ignoreResist:b.ignoreResist,
                       chillDouble:b.chillDouble, spread:0 };
        }
      }
      if (b.t <= 0) c.burn = null;
    }
    if (c.dead) continue;
    if (c.def.heal) {
      for (const o of creeps) {
        if (o.dead || o === c) continue;
        if (Math.hypot(o.x - c.x, o.y - c.y) < cell * 2.2)
          o.hp = Math.min(o.maxHp, o.hp + o.maxHp * c.def.heal * dt);
      }
    }
    if (c.pinned) continue;      // test dummies hold their exact position
    const v = c.spd * cell * (1 - (c.chillT > 0 ? c.chill : 0));
    const wall = wallAhead(c.d);
    const stop = wall ? wall.d - cell * 0.55 : Infinity;
    const nd = Math.min(c.d + v * dt, stop);
    c.d = nd;
    const p = posAt(c.d);
    c.x = p.x; c.y = p.y;
    if (wall && c.d >= stop - 0.6) creepHitsWall(c, wall, dt);
    if (c.d >= totalLen - 0.5) {
      c.dead = true;
      const cost = c.def.leak || 1;
      run.lives -= cost;
      levelLeaks += cost;
      const bp = boardPoint({ x:c.x, y:c.y });
      floats.push({ x:bp.x, y:bp.y, text:'-' + cost, col:'#ff2244', t:1 });
      sfxLeak();
    }
  }
  for (const t of tiles) {
    if (t.kind === 'wall' && t.wRegen > 0 && t.hp > 0) t.hp = Math.min(t.maxHp, t.hp + t.wRegen * dt);
  }

  /* ---- turrets ---- */
  /* Turrets track every frame — the barrel follows its target whether or not
     it is ready to fire, and the instant that target dies or leaves range it
     snaps to the next one without paying a cooldown for the switch. */
  for (const t of tiles) {
    if (t.kind !== 'turret') continue;
    const target = trackTarget(t);
    t.cd -= dt;
    if (t.cd > 0 || !target) continue;
    t.cd = 1 / t.rate;
    turretFire(t, target);
  }
  /* burning ground left by the grenade launcher */
  for (let i = grounds.length - 1; i >= 0; i--) {
    const g = grounds[i];
    g.t -= dt; g.tick += dt;
    if (g.tick >= 0.25) {
      const step = g.tick; g.tick = 0;
      for (const c of creeps) {
        if (c.dead) continue;
        if (Math.hypot(c.x - g.x, c.y - g.y) <= g.r) dealDamage(c, g.dps * step, 'ele', 'ground');
      }
    }
    if (g.t <= 0) grounds.splice(i, 1);
  }

  creeps = creeps.filter(c => !c.dead);
  for (let i = beams.length - 1; i >= 0; i--) { beams[i].t -= dt; if (beams[i].t <= 0) beams.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.t -= dt; f.y -= 26 * dt; if (f.t <= 0) floats.splice(i, 1); }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.t -= dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.t <= 0) sparks.splice(i, 1);
  }
  for (const t of tiles) if (t.kind === 'turret' && t.combo) t.pulse = (t.pulse || 0) + dt;
  for (let i = toasts.length - 1; i >= 0; i--) { toasts[i].t -= dt; if (toasts[i].t <= 0) toasts.splice(i, 1); }

  /* ---- lifecycle ---- */
  if (run.lives <= 0 && phase !== 'failed' && phase !== 'levelclear') { failLevel(); return; }
  if (phase === 'wave' && !spawnList.length && !creeps.length) {
    const gw = globalWave();
    run.cores += coresForWave(gw);
    run.levelScore += 40 * run.level;
    if (run.wave >= WAVES_PER_LEVEL) { completeLevel(); return; }
    run.wave++;
    applyUnlocks();
    phase = 'gap'; phaseT = GAP_T;
    const nk = BUILD_ORDER.find(k => UNLOCK[k] === globalWave());
    if (nk) { toast('UNLOCKED · ' + (nk === 'turret' ? 'TURRET' : nk === 'wall' ? 'WALL' : BOOSTERS[nk] ? BOOSTERS[nk].name + ' BOOSTER' : MODULES[nk].name), '#39ff14'); sfxUnlock(); }
    if (globalWave() === LAB_WAVE) { toast('THE LAB IS OPEN · SPEND CORES', '#ffc300'); sfxUnlock(); }
    autoSave();
  }
}

/* =============================== DRAWING ============================== */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  safeTop = parseFloat(cs.getPropertyValue('--sat')) || 0;
  safeBot = parseFloat(cs.getPropertyValue('--sab')) || 0;
  hudY = safeTop + 44;
  barH = 108;
  barY = H - safeBot - barH;
  const availW = W - 12, availH = barY - (hudY + hudH) - 12;
  const old = cell;
  cell = Math.max(1, Math.floor(Math.min(availW / COLS, availH / ROWS)));
  boardW = cell * COLS; boardH = cell * ROWS;
  boardX = Math.round((W - boardW) / 2);
  boardY = Math.round(hudY + hudH + 6 + Math.max(0, (availH - boardH) / 2));
  if (run && segs.length && cell !== old) {
    buildPath(mapIdx);
    for (const t of tiles) if (t.kind === 'wall') t.d = pathDistOfCell(t.r, t.c);
    recomputeGrid();
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => setTimeout(resize, 60));

/* The colour a link is drawn in, whichever kind of tile is lending it. */
function linkColour(from) {
  if (!from) return null;
  if (from.kind === 'module') return MODULES[from.mod] ? MODULES[from.mod].col : null;
  if (from.kind === 'booster') return BOOSTERS[from.boostKind] ? BOOSTERS[from.boostKind].col : null;
  return null;
}
/* --------------------------- the toon palette -------------------------- */
const TOON = {
  grass:['#5b9b46','#559241','#63a44c','#4f8b3d'],
  dirt:['#8a6a44','#7d5f3c','#94734b'],
  grassInk:'#33632a', dirtInk:'#5d4529',
  pave:'#9aa0a8', paveLo:'#7d848d', paveInk:'#4a5058', paveSlab:'#8a9199',
  kerb:'#6d747d', kerbInk:'#464c54',
  rock:'#8d9299', rockLo:'#6d7278', rockHi:'#b3b8be', rockInk:'#3d4147',
  steel:'#9aa4bb', steelLo:'#6f7a90', steelHi:'#c6cddd', ink:'#191c24',
  wall:'#a99880', wallLo:'#8a7a64', wallHi:'#c8b89e', wallInk:'#3a3128',
  shadow:'rgba(15,20,14,0.30)',

/* The cel recipe, in one place: flat fill, one hard ink outline, one

function celShape(path, fill, ink, hi, s) {

function drawTurretShape(x, y, s, lvl, aim) {
  if (toon()) return drawTurretToon(x, y, s, lvl, aim);
  ctx.save();
  ctx.translate(x, y);
  if (aim !== undefined) ctx.rotate(aim + Math.PI / 2);
  const g = s * (0.52 + 0.05 * (lvl - 1));
  ctx.beginPath();

  ctx.lineTo(-g * 0.86, g * 0.66);
  ctx.closePath();

  ctx.strokeStyle = '#c9d2e6';

  ctx.restore();

  const g = s * (0.34 + 0.035 * (lvl - 1));
  contactShadow(x, y + s * 0.30, s * 0.40, s * 0.16);
  ctx.save();
  ctx.translate(x, y);

  const pad = () => { roundRect(-s * 0.38, -s * 0.30, s * 0.76, s * 0.62, s * 0.12); };
  celShape(pad, TOON.steelLo, TOON.ink, TOON.steelHi, s * 0.4);
  ctx.save();

  /* barrel first, so the hull overlaps its root */
  const bl = s * (0.40 + 0.03 * lvl);
  const barrel = () => { roundRect(-s * 0.075, -bl, s * 0.15, bl * 0.86, s * 0.04); };
  celShape(barrel, TOON.steelLo, TOON.ink, TOON.steelHi, s * 0.2);
  /* the hull: the triangle, chamfered */
  const hull = () => {
    ctx.beginPath();
    ctx.moveTo(0, -g * 1.05);
    ctx.lineTo(g * 0.62, -g * 0.05);
    ctx.lineTo(g * 0.9, g * 0.72);
    ctx.lineTo(-g * 0.9, g * 0.72);
    ctx.lineTo(-g * 0.62, -g * 0.05);
    ctx.closePath();
  };
  celShape(hull, TOON.steel, TOON.ink, TOON.steelHi, g);
  /* a level pip row, so LEVEL still reads without text */
  ctx.fillStyle = TOON.ink;
  for (let i = 0; i < lvl; i++) {
    ctx.beginPath();
    ctx.arc(-g * 0.42 + i * g * 0.28, g * 0.44, Math.max(1, g * 0.09), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.restore();
}
function drawModuleShape(x, y, s, mod) {
  const M = MODULES[mod];

  if (toon()) return drawModuleToon(x, y, s, mod, M);
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = M.col + '33'; ctx.fill();
  ctx.strokeStyle = M.col; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = M.col;

function drawModuleToon(x, y, s, mod, M) {

  ctx.fillStyle = '#ffffff';

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

}
function drawBoosterShape(x, y, s, kindKey) {

/* A booster is a pylon standing on the diagonal — deliberately a different

function drawBoosterToon(x, y, s, kindKey, B) {
  contactShadow(x, y + s * 0.30, s * 0.30, s * 0.12);

  if (!segs.length) return;

       of brown on grass reads as a stamp rather than as bare ground */
    const r = cell * (0.62 + 1.0 * h2(n * 7, mapIdx));
    const lobes = [{ dx: 0, dy: 0, r }];

        roundRect(x - cell * 0.42, y - cell * 0.42, cell * 0.84, cell * 0.84, 9);
        ctx.fill();
        ctx.strokeStyle = t.fed ? BOOSTERS[t.boostKind].col + '99' : '#22223c';
        ctx.lineWidth = 1; ctx.stroke();
      }
      drawBoosterShape(x, y, cell, t.boostKind);
      ctx.globalAlpha = 1;
    } else if (t.kind === 'turret') {
      if (!toon()) {
        ctx.fillStyle = '#0d0d1c';
        roundRect(x - cell * 0.44, y - cell * 0.44, cell * 0.88, cell * 0.88, 5);
        ctx.fill();
      }
      // each feeding module blooms on the edge it comes from, in its colour
      ctx.save();
      roundRect(x - cell * 0.44, y - cell * 0.44, cell * 0.88, cell * 0.88, 5);
      ctx.clip();
      for (const l of t.links) {
        // links come from modules (sides) AND boosters (diagonals) now
        const col = linkColour(l.from);
        if (!col) continue;
        const gx = x + l.dc * cell * 0.44, gy = y + l.dr * cell * 0.44;
        const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, cell * 0.55);
        g.addColorStop(0, col + 'aa'); g.addColorStop(1, col + '00');
        ctx.fillStyle = g;
        ctx.fillRect(x - cell * 0.44, y - cell * 0.44, cell * 0.88, cell * 0.88);
      }
      ctx.restore();
      if (!toon()) {
        ctx.strokeStyle = '#66708c'; ctx.lineWidth = 1;
        roundRect(x - cell * 0.44, y - cell * 0.44, cell * 0.88, cell * 0.88, 5); ctx.stroke();
      }
      /* A named combo gets a pulsing outline in its own colour — the one
         piece of state on this board that says "you made something". */
      if (t.combo) {
        const pu = 0.55 + 0.45 * Math.sin((t.pulse || 0) * 3.4);
        ctx.strokeStyle = t.combo.col;
        ctx.globalAlpha = pu; ctx.lineWidth = 2.4;
        roundRect(x - cell * 0.47, y - cell * 0.47, cell * 0.94, cell * 0.94, 6); ctx.stroke();
        ctx.globalAlpha = pu * 0.35; ctx.lineWidth = 6;
        roundRect(x - cell * 0.47, y - cell * 0.47, cell * 0.94, cell * 0.94, 6); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      drawTurretShape(x, y, cell, t.lvl, t.aim);
    } else if (t.kind === 'wall') {
      ctx.save();
      roundRect(x - cell * 0.46, y - cell * 0.46, cell * 0.92, cell * 0.92, 4);
      ctx.clip();
      for (const l of t.links) {
        const col = linkColour(l.from);
        if (!col) continue;
        const gx = x + l.dc * cell * 0.46, gy = y + l.dr * cell * 0.46;
        const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, cell * 0.6);
        g.addColorStop(0, col + 'aa'); g.addColorStop(1, col + '00');
        ctx.fillStyle = g;
        ctx.fillRect(x - cell * 0.46, y - cell * 0.46, cell * 0.92, cell * 0.92);
      }
      ctx.restore();
      drawWallShape(x, y, cell, t.maxHp ? t.hp / t.maxHp : 0);
    }
  }
  if (sel) {
    const x = cellCx(sel.c), y = cellCy(sel.r);
    ctx.strokeStyle = '#ffc300'; ctx.lineWidth = 2;
    roundRect(x - cell * 0.48, y - cell * 0.48, cell * 0.96, cell * 0.96, 6); ctx.stroke();
    if (sel.kind === 'turret') {
      ctx.strokeStyle = 'rgba(255,195,0,0.35)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(x, y, sel.rangePx, 0, Math.PI * 2); ctx.stroke();
    }
  }

  /* creeps, beams, sparks — clipped to the board so nothing walks into the HUD */
  ctx.save();
  ctx.beginPath(); ctx.rect(boardX, boardY, boardW, boardH); ctx.clip();
  for (const g of grounds) {
    const a = clamp(g.t / GROUND_T, 0, 1);
    const gr = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r);
    gr.addColorStop(0, 'rgba(255,120,30,' + (0.34 * a).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(255,60,10,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.fill();
  }
  /* Projectiles. Neon draws a hairline; TOON draws a tracer with an ink
     casing and a bright core, plus a muzzle flash at the firing end, so a
     shot reads as a solid object travelling rather than a glow. */
  for (const b of beams) {
    const a = clamp(b.t * 9, 0, 1);
    if (toon()) {
      ctx.globalAlpha = a;
      ctx.lineCap = 'round';
      ctx.strokeStyle = TOON.ink; ctx.lineWidth = b.w * 3.1;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      ctx.strokeStyle = b.col; ctx.lineWidth = b.w * 1.9;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1, b.w * 0.7);
      ctx.globalAlpha = a * 0.85;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath(); ctx.arc(b.x1, b.y1, b.w * 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = TOON.ink; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x1, b.y1, b.w * 1.5, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.strokeStyle = b.col; ctx.globalAlpha = a; ctx.lineWidth = b.w;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  for (const c of creeps) drawCreepShape(c, c.x, c.y, c.def.r * cell * (c.elite ? 1.18 : 1));
  for (const s of sparks) {
    ctx.globalAlpha = clamp(s.t * 3, 0, 1);
    if (s.ring) {
      ctx.strokeStyle = s.col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.ring * (1.2 - s.t * 2), 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = s.col; ctx.fillRect(s.x - 1.5, s.y - 1.5, 3, 3);
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  for (const f of floats) {
    ctx.globalAlpha = clamp(f.t, 0, 1);
    ctx.fillStyle = f.col;
    ctx.font = 'bold 13px "Share Tech Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  /* drag ghost */
  if (dragCard && dragPos) {
    const cc = cellAtPx(dragPos.x, dragPos.y);
    const ok = cc && canPlace(dragCard, cc.r, cc.c) && cash >= costOf(dragCard);
    const gx = cc ? cellCx(cc.c) : dragPos.x, gy = cc ? cellCy(cc.r) : dragPos.y;
    ctx.globalAlpha = 0.85;
    if (cc) {
      ctx.fillStyle = ok ? 'rgba(57,255,20,0.12)' : 'rgba(255,34,68,0.14)';
      ctx.fillRect(boardX + cc.c * cell, boardY + cc.r * cell, cell, cell);
    }
    drawKindShape(dragCard, gx, gy, cell);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  drawHud();
  drawBar();
  drawToasts();
}

function drawHud() {
  ctx.fillStyle = '#0b0b16';
  ctx.fillRect(0, 0, W, hudY + hudH);
  ctx.strokeStyle = '#1a1a30'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, hudY + hudH); ctx.lineTo(W, hudY + hudH); ctx.stroke();
  if (!run) return;
  const y0 = hudY + 4;
  ctx.textBaseline = 'middle';

  ctx.textAlign = 'left';
  ctx.font = '10px "Share Tech Mono", monospace'; ctx.fillStyle = '#8899bb';
  ctx.fillText('LIVES', 10, y0 + 8);
  ctx.fillText('CASH', 74, y0 + 8);
  ctx.fillText('CORES', 146, y0 + 8);
  ctx.font = '15px "Black Ops One", sans-serif';
  ctx.fillStyle = run.lives > 6 ? '#dde3ff' : '#ff2244';
  ctx.fillText(String(run.lives), 10, y0 + 24);
  ctx.fillStyle = '#39ff14'; ctx.fillText(fmtNum(cash), 74, y0 + 24);
  ctx.fillStyle = '#ffc300'; ctx.fillText(String(run.cores), 146, y0 + 24);

  ctx.textAlign = 'right';
  ctx.font = '10px "Share Tech Mono", monospace'; ctx.fillStyle = '#8899bb';
  const lbl = run.level > CAMPAIGN_LEVELS ? 'ENDLESS ' + (run.level - CAMPAIGN_LEVELS) : 'LEVEL ' + run.level + '/' + CAMPAIGN_LEVELS;
  ctx.fillText(lbl + '  ·  ' + MAPS[mapIdx].name, W - 10, y0 + 8);
  ctx.font = '15px "Black Ops One", sans-serif'; ctx.fillStyle = '#dde3ff';
  ctx.fillText('WAVE ' + run.wave + '/' + WAVES_PER_LEVEL, W - 10, y0 + 24);

  /* phase readout + the two HUD buttons */
  const by = y0 + 38, bh = 20;
  hudBtns = {};
  let txt = '', col = '#8899bb';
  if (phase === 'grace') { txt = 'BUILD · ' + Math.ceil(phaseT) + 's'; col = '#39ff14'; }
  else if (phase === 'gap') { txt = 'NEXT WAVE · ' + Math.ceil(phaseT) + 's'; col = '#4488ff'; }
  else if (phase === 'wave') { txt = 'INCOMING · ' + (creeps.length + spawnList.length); col = '#ff8a1e'; }
  else if (phase === 'levelclear') { txt = 'LEVEL CLEAR'; col = '#39ff14'; }
  else if (phase === 'failed') { txt = 'REBUILDING'; col = '#ff2244'; }
  ctx.textAlign = 'left';
  ctx.font = '11px "Share Tech Mono", monospace'; ctx.fillStyle = col;
  ctx.fillText(txt, 10, by + bh / 2);

  const links = tiles.reduce((n, t) => n + (t.kind === 'module' ? t.fed : 0), 0);
  ctx.font = '10px "Share Tech Mono", monospace'; ctx.fillStyle = '#8899bb';
  ctx.fillText('GRID ' + countKind('turret') + '/' + turretCap() + ' · ' + links + ' LINKS', 128, by + bh / 2);

  // speed + lab
  const bw = 44;
  const sx = W - 10 - bw, lx = sx - bw - 6;
  hudBtns.speed = { x:sx, y:by, w:bw, h:bh };
  hudBtns.lab = { x:lx, y:by, w:bw, h:bh };
  for (const [k, b] of Object.entries(hudBtns)) {
    const on = k === 'lab' ? labOpen() : true;
    ctx.strokeStyle = on ? (k === 'lab' ? '#ffc300' : '#4488ff') : '#23233d';
    ctx.fillStyle = '#0d0d1c';
    roundRect(b.x, b.y, b.w, b.h, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = on ? (k === 'lab' ? '#ffc300' : '#4488ff') : '#4b5470';
    ctx.font = '10px "Black Ops One", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(k === 'lab' ? 'LAB' : (speed === 1 ? '▶ 1x' : '▶▶ 2x'), b.x + b.w / 2, b.y + b.h / 2 + 1);
  }
  if (!labOpen()) hudBtns.lab = null;
}

function drawBar() {
  ctx.fillStyle = '#0b0b16';
  ctx.fillRect(0, barY, W, H - barY);
  ctx.strokeStyle = '#1a1a30'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, barY); ctx.lineTo(W, barY); ctx.stroke();
  cardRects = []; tabRects = [];
  panelBtns = {};
  if (!run) return;
  if (sel) { drawPanel(); return; }

  /* tab row */
  const tw = (W - 8 * (BAR_TABS.length + 1)) / BAR_TABS.length, th = 20;
  BAR_TABS.forEach((tb, i) => {
    const x = 8 + i * (tw + 8), y = barY + 5;
    const on = barTab === tb.id;
    const any = tb.keys.some(unlocked);
    ctx.fillStyle = on ? '#1a1a34' : '#0d0d1c';
    roundRect(x, y, tw, th, 5); ctx.fill();
    ctx.strokeStyle = on ? '#ffc300' : '#23233d'; ctx.lineWidth = on ? 1.6 : 1; ctx.stroke();
    ctx.fillStyle = on ? '#ffc300' : (any ? '#8899bb' : '#4b5470');
    ctx.font = '9px "Black Ops One", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(tb.label, x + tw / 2, y + th / 2 + 1);
    tabRects.push({ id:tb.id, x, y, w:tw, h:th });
  });

  const keys = (BAR_TABS.find(t => t.id === barTab) || BAR_TABS[0]).keys;
  const pad = 6, cols = 4;
  const cw = (W - pad * (cols + 1)) / cols, ch = 42;
  keys.forEach((k, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const x = pad + col * (cw + pad), y = barY + 30 + row * (ch + 5);
    const un = unlocked(k);
    const cost = costOf(k);
    const afford = cash >= cost;
    const capped = k === 'turret' ? countKind('turret') >= turretCap()
                 : k === 'wall' ? countKind('wall') >= wallCap() : false;
    const col2 = k === 'turret' ? '#c9d2e6' : k === 'wall' ? '#98a4bf'
               : BOOSTERS[k] ? BOOSTERS[k].col : MODULES[k].col;
    const live = un && afford && !capped;
    ctx.fillStyle = armedKind === k ? '#1a1a34' : '#0d0d1c';
    roundRect(x, y, cw, ch, 7); ctx.fill();
    ctx.strokeStyle = armedKind === k ? '#ffc300' : (live ? col2 + '88' : '#23233d');
    ctx.lineWidth = armedKind === k ? 2 : 1; ctx.stroke();
    ctx.save();
    ctx.globalAlpha = un ? (live ? 1 : 0.42) : 0.22;
    drawKindShape(k, x + 16, y + ch / 2 - 2, cell * (k === 'turret' ? 0.74 : k === 'wall' ? 0.64 : 0.82));
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = '8.5px "Black Ops One", sans-serif';
    ctx.fillStyle = un ? col2 : '#4b5470';
    const nm = k === 'turret' ? 'TURRET' : k === 'wall' ? 'WALL'
             : BOOSTERS[k] ? BOOSTERS[k].name : MODULES[k].name;
    ctx.fillText(nm, x + 30, y + 13);
    ctx.font = '10px "Share Tech Mono", monospace';
    if (!un) {
      ctx.fillStyle = '#4b5470';
      ctx.fillText('W' + UNLOCK[k], x + 30, y + 29);
    } else {
      ctx.fillStyle = afford ? '#39ff14' : '#ff2244';
      ctx.fillText('$' + cost, x + 30, y + 29);
      if (k === 'turret' || k === 'wall') {
        ctx.fillStyle = capped ? '#ff2244' : '#8899bb';
        ctx.textAlign = 'right';
        const have = countKind(k), cap = k === 'turret' ? turretCap() : wallCap();
        ctx.fillText(have + '/' + cap, x + cw - 7, y + 29);
      }
    }
    ctx.restore();
    cardRects.push({ kind:k, x, y, w:cw, h:ch, un, afford, capped });
  });
}
function drawPanel() {
  const t = sel;
  const pad = 8;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  const nm = t.kind === 'turret' ? (t.combo ? '★ ' + t.combo.name : 'TURRET · LVL ' + t.lvl)
           : t.kind === 'wall' ? 'WALL'
           : t.kind === 'booster' ? BOOSTERS[t.boostKind].name + ' BOOSTER'
           : MODULES[t.mod].name + ' MODULE';
  ctx.font = (nm.length > 22 ? '9.5px' : '12px') + ' "Black Ops One", sans-serif';
  ctx.fillStyle = t.kind === 'turret' && t.combo ? t.combo.col : '#ffc300';
  ctx.fillText(nm, pad + 2, barY + 16);

  ctx.font = '10px "Share Tech Mono", monospace';
  ctx.fillStyle = '#8899bb';
  let line2 = '', line3 = '';
  if (t.kind === 'turret') {
    const m = t.mods, b = t.boost;
    const parts = COMBAT_MODS.filter(k => m[k] > 0).map(k => MODULES[k].name[0] + m[k]);
    const bs = BOOST_KEYS.filter(k => b[k] > 0).map(k => BOOSTERS[k].glyph + b[k]);
    line2 = 'KIN ' + t.D.toFixed(1) + '  ' + t.rate.toFixed(2) + '/s'
          + (t.dot ? '  BURN ' + t.dot.toFixed(1) + '/5s' : '')
          + (t.chill ? '  CHILL ' + Math.round(t.chill * 100) + '%' : '');
    line3 = (t.hops ? 'ARC x' + t.hops + '@' + Math.round(t.xfer * 100) + '%  ' : '')
          + (t.blast ? 'SPLASH ' + Math.round(t.blast * 100) + '% r' + (t.blastR / cell).toFixed(1) + '  ' : '')
          + (parts.length ? parts.join(' ') : 'NO MODULES')
          + (bs.length ? '  ' + bs.join(' ') : '')
          + (t.boostMul > 1.001 ? '  x' + t.boostMul.toFixed(2) : '');
  } else if (t.kind === 'wall') {
    line2 = 'HP ' + Math.round(t.hp) + '/' + t.maxHp + '  ·  DR ' + t.dr;
    const bits = [];
    if (t.wFire) bits.push('BURN ' + t.wFire.toFixed(0));
    if (t.wChill) bits.push('CHILL ' + Math.round(t.wChill * 100) + '%');
    if (t.wArc) bits.push('ARC ' + t.wArc.toFixed(0));
    if (t.wThorn) bits.push('THORN ' + t.wThorn.toFixed(0));
    if (t.wAmp) bits.push('SLAM ' + t.wAmp.toFixed(0));
    if (t.wRegen) bits.push('REGEN ' + t.wRegen.toFixed(1) + '/s');
    line3 = bits.length ? bits.join('  ') : 'NO MODULES';
  } else if (t.kind === 'booster') {
    line2 = 'BOOSTING ' + t.fed + (t.fed === 1 ? ' TURRET' : ' TURRETS') + ' DIAGONALLY';
    line3 = BOOSTERS[t.boostKind].desc;
  } else {
    line2 = MODULES[t.mod].tag + '  ·  POWERING ' + t.fed + (t.fed === 1 ? ' STRUCTURE' : ' STRUCTURES');
    line3 = t.fed ? 'shared by every neighbour it touches' : 'not touching anything — dead weight';
  }
  ctx.fillText(line2, pad + 2, barY + 34);
  ctx.fillStyle = '#667799';
  ctx.fillText(line3, pad + 2, barY + 50);

  const bw = (W - pad * 3) / 2, by = barY + 62, bh = 34;
  const canUp = (t.kind === 'turret' && t.lvl < TURRET.maxLvl) || (t.kind === 'wall' && t.hp < t.maxHp - 0.01);
  const upCost = t.kind === 'turret' ? turretUpCost(t.lvl)
    : t.kind === 'wall' ? Math.max(4, Math.round(WALL.cost * WALL_REPAIR_COST * (1 - t.hp / Math.max(1, t.maxHp)))) : 0;
  const upLbl = t.kind === 'wall' ? 'REPAIR $' + upCost : canUp ? 'UPGRADE $' + upCost : 'MAX LEVEL';
  const upOk = canUp && cash >= upCost;
  ctx.fillStyle = '#0d0d1c'; roundRect(pad, by, bw, bh, 7); ctx.fill();
  ctx.strokeStyle = upOk ? '#39ff14' : '#23233d'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = upOk ? '#39ff14' : '#4b5470';
  ctx.font = '10px "Black Ops One", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(t.kind === 'module' ? '—' : upLbl, pad + bw / 2, by + bh / 2);
  panelBtns.up = canUp && t.kind !== 'module' ? { x:pad, y:by, w:bw, h:bh } : null;

  const sx = pad * 2 + bw;
  ctx.fillStyle = '#0d0d1c'; roundRect(sx, by, bw, bh, 7); ctx.fill();
  ctx.strokeStyle = '#ff2244'; ctx.stroke();
  ctx.fillStyle = '#ff2244';
  ctx.fillText('SELL +$' + Math.floor(t.spent * 0.5), sx + bw / 2, by + bh / 2);
  panelBtns.sell = { x:sx, y:by, w:bw, h:bh };
  panelBtns.close = { x:W - 30, y:barY + 4, w:26, h:22 };
  ctx.fillStyle = '#8899bb'; ctx.font = '13px "Share Tech Mono", monospace';
  ctx.fillText('✕', W - 17, barY + 15);
}

function drawToasts() {
  let y = boardY + 26;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of toasts) {
    ctx.globalAlpha = clamp(t.t * 1.4, 0, 1);
    ctx.font = '13px "Black Ops One", sans-serif';
    ctx.fillStyle = '#06060ecc';
    const w = ctx.measureText(t.text).width + 22;
    roundRect(W / 2 - w / 2, y - 13, w, 24, 6); ctx.fill();
    ctx.fillStyle = t.col;
    ctx.fillText(t.text, W / 2, y);
    y += 28;
  }
  ctx.globalAlpha = 1;
}

/* ================================ INPUT =============================== */
function hit(b, x, y) { return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
function evtPos(e) {
  const r = cv.getBoundingClientRect();
  const p = e.touches && e.touches[0] ? e.touches[0] : (e.changedTouches && e.changedTouches[0]) || e;
  return { x: p.clientX - r.left, y: p.clientY - r.top };
}
function onDown(e) {
  if (state !== 'play' || paused) return;
  initAudio();
  const p = evtPos(e);
  downCard = null;
  for (const tb of tabRects) {
    if (hit(tb, p.x, p.y)) { barTab = tb.id; armedKind = null; return; }
  }
  for (const c of cardRects) {
    if (hit(c, p.x, p.y)) {
      downCard = c;
      if (c.un && c.afford && !c.capped) { dragCard = c.kind; dragPos = p; }
      else sfxDeny();
      return;
    }
  }
  if (sel) {
    if (hit(panelBtns.close, p.x, p.y)) { sel = null; return; }
    if (hit(panelBtns.sell, p.x, p.y)) { sellAt(sel.r, sel.c); sel = null; return; }
    if (hit(panelBtns.up, p.x, p.y)) { if (!upgradeAt(sel.r, sel.c)) sfxDeny(); return; }
  }
  if (hit(hudBtns.speed, p.x, p.y)) { speed = speed === 1 ? 2 : 1; settings.speed = speed; saveSettings(); return; }
  if (hit(hudBtns.lab, p.x, p.y)) { showLab(); return; }
}
function onMove(e) {
  if (!dragCard) return;
  e.preventDefault();
  dragPos = evtPos(e);
}
/* onDown records which card the press started on; onUp decides what it was.
   Released over the board -> build (a drag). Released still inside the card
   -> that was a TAP, so arm it. Both grammars are first-class: a drag is
   awkward one-handed on a phone. */
function onUp(e) {
  if (state !== 'play' || paused) { dragCard = null; downCard = null; return; }
  const p = evtPos(e);
  if (dragCard) {
    const startedIn = downCard && hit(downCard, p.x, p.y) && downCard.kind === dragCard;
    const kind = dragCard;
    dragCard = null; dragPos = null;
    if (startedIn) {
      armedKind = armedKind === kind ? null : kind;
      sel = null;
      downCard = null;
      return;
    }
    const cc = cellAtPx(p.x, p.y);
    if (cc) { if (!place(kind, cc.r, cc.c)) sfxDeny(); }
    downCard = null;
    return;
  }
  downCard = null;
  const cc = cellAtPx(p.x, p.y);
  if (!cc) { if (armedKind && p.y < barY) armedKind = null; return; }
  const existing = tileAt(cc.r, cc.c);
  if (armedKind) {
    if (existing) { sel = existing; armedKind = null; return; }   // inspect rather than deny
    const kind = armedKind;
    if (!place(kind, cc.r, cc.c)) { sfxDeny(); return; }          // denied, but STAY armed
    /* Stay armed after a successful drop. Grid Defense disarms because a
       turret is a once-per-minute decision; here you ring one turret with
       four modules in four taps, and re-arming between each was the single
       most annoying thing about the first build. Arming ends only when the
       kind has nowhere left to go or nothing left to pay with. */
    if (!anyPlacement(kind)) armedKind = null;
    return;
  }
  sel = existing || null;
}

function snapshotSave() {
  if (!run) return null;
  return {
    v:1, pending:pendingStart, run:JSON.parse(JSON.stringify(Object.assign({}, run, { snapshot:null }))),
    cash, phase, phaseT, waveT,
    tiles: tiles.map(t => ({ kind:t.kind, mod:t.mod, boostKind:t.boostKind, r:t.r, c:t.c, lvl:t.lvl, spent:t.spent, hp:t.hp })),
  };
}
function autoSave() { const s = snapshotSave(); if (s) writeJSON(AUTO_KEY, s); }
function saveTo(k) { const s = snapshotSave(); return s ? writeJSON(k, s) : false; }
function restoreFrom(k) {
  const s = readJSON(k, null);
  if (!s || !s.run) return false;
  run = Object.assign(newRunObj(), s.run);
  run.snapshot = { cores:run.cores, score:run.score, lab:Object.assign({}, run.lab) };
  state = 'play';
  /* A between-levels save holds no board. Restoring one must OPEN the level
     fresh, or CONTINUE reopens the next level number holding the previous
     level's towers and cash. */
  if (s.pending) { startLevel(run.level); return true; }
  buildPath(mapIndexFor(run.level));
  cash = s.cash;
  tiles = (s.tiles || []).map(t => Object.assign({}, t, {
    cd:0, tid:0, mods:emptyMods(), boost:emptyBoost(), links:[], sides:[null,null,null,null],
    d: t.kind === 'wall' ? pathDistOfCell(t.r, t.c) : 0,
    maxHp: t.kind === 'wall' ? 0 : undefined,
  }));
  creeps = []; spawnList = []; beams = []; floats = []; sparks = []; grounds = []; sel = null; armedKind = null;
  recomputeGrid();
  for (const t of tiles) {
    if (t.kind !== 'wall') continue;
    const saved = (s.tiles || []).find(x => x.r === t.r && x.c === t.c);
    t.hp = clamp(saved && saved.hp > 0 ? saved.hp : t.maxHp, 1, t.maxHp);
  }
  phase = 'grace'; phaseT = Math.max(4, s.phaseT || GRACE_T); waveT = 0;
  pendingStart = false;
  if (overTimer) { clearTimeout(overTimer); overTimer = null; }
  return true;
}

/* ================================= LOOP =============================== */
let last = performance.now();
/* A throw anywhere in update() or draw() used to end the requestAnimationFrame
   chain outright — the board froze mid-frame, the HUD and build bar vanished,
   and only a reload brought it back. One rendering mistake should degrade a
   frame, not brick the session, so the loop always re-arms. The error is still
   reported to the console (once per distinct message), which is what the drive
   suite watches, so this cannot quietly hide a regression. */
const loopErrs = {};
function loop(now) {
  try {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    for (let i = 0; i < speed; i++) update(dt);
    draw();
  } catch (e) {
    const msg = (e && e.message) || String(e);
    if (!loopErrs[msg]) { loopErrs[msg] = 1; console.error('loop error: ' + msg, e); }
  }
  requestAnimationFrame(loop);
}
speed = settings.speed || 1;
resize();
applyVolumes();
showMenu();
requestAnimationFrame(loop);

   The drive suite asserts the SPEC numbers against these; the eval plays
   whole campaigns through them. cardRects/panelRects publish the live
   canvas hitboxes so a test can press the drawn UI the way a thumb does —
   this repo's documented failure mode is a hidden widget leaving stale
   hitboxes behind. */
function buildableCells(kind) {
  const out = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (canPlace(kind || 'turret', r, c)) out.push({ r, c });
  return out;
}
