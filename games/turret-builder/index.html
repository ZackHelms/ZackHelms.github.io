    lives: run ? run.lives : 0, cores: run ? run.cores : 0, cash,
    score: run ? Math.round(run.score) : 0, levelScore: run ? Math.round(run.levelScore) : 0,
    retries: run ? run.retries : 0, elapsed: run ? run.elapsed : 0,
    levelElapsed: run ? run.levelElapsed : 0, levelTimes: run ? run.levelTimes.slice() : [],
    turrets: countKind('turret'), walls: countKind('wall'), modules: countKind('module'),
    turretCap: turretCap(), wallCap: wallCap(),
    links: tiles.reduce((n, t) => n + (t.kind === 'module' ? t.fed : 0), 0),
    creeps: creeps.length, queued: spawnList.length,
    map: MAPS[mapIdx].name, mapIdx, armed: armedKind,
    lab: run ? Object.assign({}, run.lab) : null, labOpen: labOpen(),
    unlocked: BUILD_ORDER.filter(unlocked), won: run ? run.won : false,
    gfx: GFX,
    boosters: countKind('booster'), barTab,
    combos: tiles.filter(t => t.kind === 'turret' && t.combo).map(t => t.combo.id),
    combosFound: run ? Object.keys(run.combosFound) : [],
    grounds: grounds.length,
  }),
  run: () => run, tilesRaw: () => tiles, creepsRaw: () => creeps,
  MODULES, BOOSTERS, COMBOS, TURRET, WALL, CREEPS, LAB, MAPS, BUILD_ORDER, BAR_TABS, UNLOCK,
  MOD_KEYS, COMBAT_MODS, BOOST_KEYS, comboKeyOf,
  WAVES_PER_LEVEL, CAMPAIGN_LEVELS, TOTAL_WAVES, LAB_WAVE,
  consts: () => ({ AMP_DMG, FIRE_DOT, FIRE_T, ICE_CHILL, ICE_T, ELEC_HOPS, ELEC_XFER, ELEC_R,
                   BLAST_XFER, BLAST_R, CHILL_CAP, XFER_CAP, GROUND_T, BOOST_CAP,
                   MOD_LAB_STEP, KIN_FLOOR, GRACE_T, GAP_T,
                   WALL_FIRE, WALL_ARC, WALL_THORN, WALL_ICE, WALL_REGEN,
                   TURRET_CAP_BASE, WALL_CAP_BASE }),
  /* drive */
  newRun: () => { closeScreen(); startRun(); },
  startLevel: L => { closeScreen(); startLevel(L); },
  ready: () => { closeScreen(); if (phase === 'grace' || phase === 'gap') { phaseT = 0; startWave(); } },
  skipGap: () => { if (phase !== 'wave') phaseT = 0; },
  advance: () => { if (phase === 'levelclear') { advanceLevel(); return true; }
                   if (phase === 'failed') { startLevel(run.level); return true; } return false; },
  step: (dt, n) => { const k = n || 1; for (let i = 0; i < k; i++) update(dt); },
  place: (kind, r, c, free) => place(kind, r, c, free),
  sell: (r, c) => sellAt(r, c),
  upgrade: (r, c) => upgradeAt(r, c),
  buyLab,
  unlockAll: () => { for (const k of BUILD_ORDER) run.unlocked[k] = true; run.labSeen = true; },
  addCash: n => { cash += n; }, setCash: n => { cash = n; },
  addCores: n => { run.cores += n; },
  setLives: n => { run.lives = n; },
  /* read the grid the way the game does */
  tileAt: (r, c) => { const t = tileAt(r, c); return t ? JSON.parse(JSON.stringify(Object.assign({}, t,
      { links: t.links.map(l => ({ dr:l.dr, dc:l.dc, mod: l.from ? l.from.mod : undefined })) }))) : null; },
  modsAt: (r, c) => { const t = tileAt(r, c); return t ? Object.assign({}, t.mods) : null; },
  turretStats: (r, c) => {
    const t = tileAt(r, c);
    if (!t || t.kind !== 'turret') return null;
    return { D:t.D, rate:t.rate, rangeCells:t.rangePx / cell, dps:t.dps, lvl:t.lvl,
             dot:t.dot, dotDur:FIRE_T, chill:t.chill, chillT:t.chillT,
             hops:t.hops, xfer:t.xfer, hopR:t.hopR / cell,
             blast:t.blast, blastR:t.blastR / cell,
             boostMul:t.boostMul, targets:t.targets, tid:t.tid || 0,
             combo: t.combo ? t.combo.id : null,
             comboName: t.combo ? t.combo.name : null,
             eff: Object.assign({}, t.eff || {}),
             sides: t.sides.slice(),
             mods:Object.assign({}, t.mods), boost:Object.assign({}, t.boost) };
  },
  wallStats: (r, c) => {
    const t = tileAt(r, c);
    if (!t || t.kind !== 'wall') return null;
    return { hp:t.hp, maxHp:t.maxHp, dr:t.dr, d:t.d, wFire:t.wFire, wIce:t.wIce,
             wArc:t.wArc, wThorn:t.wThorn, wRegen:t.wRegen, mods:Object.assign({}, t.mods) };
  },
  canPlace, buildableCells, cellCx, cellCy, cellSize: () => cell,
  totalLen: () => totalLen, pathSamples: n => { const o = []; for (let i = 0; i <= n; i++) o.push(posAt(totalLen * i / n)); return o; },
  pathCellList: () => [...pathCells].map(k => ({ r:Math.floor(k / COLS), c:k % COLS })),
  pathDistOfCell,
  /* a bare target with exactly the stats you ask for — this is what makes
     the module maths testable to the decimal instead of inferred from a
     live wave */
  spawnDummy: (opts) => {
    const o = opts || {};
    const def = Object.assign({}, CREEPS.grub, { arm:o.arm || 0, res:o.res || 0, spd:0, heal:0 });
    const c = { id:++creepSeq, type:'dummy', def, elite:false, hp:o.hp || 1e9, maxHp:o.hp || 1e9,
                spd:o.spd || 0, bounty:0, d:o.d || 0, x:0, y:0, burn:null, chill:0, chillT:0,
                chillAmp:0, chillShred:0, atkCd:0,
                dead:false, hitFlash:0, arm:o.arm || 0, pinned: o.pinned !== false };
    const p = posAt(c.d); c.x = o.x !== undefined ? o.x : p.x; c.y = o.y !== undefined ? o.y : p.y;
    creeps.push(c);
    return c.id;
  },
  /* park the flow state machine so a damage measurement is never gatecrashed
     by the next wave spawning halfway through it */
  setPhase: (p, t) => { phase = p; phaseT = t === undefined ? 9999 : t; },
  creepById: id => { const c = creeps.find(z => z.id === id); return c ? { id:c.id, hp:c.hp, maxHp:c.maxHp,
      chill:c.chill, chillT:c.chillT, chillAmp:c.chillAmp, chillShred:c.chillShred,
      burn: c.burn ? { dps:c.burn.dps, t:c.burn.t, ignoreResist:!!c.burn.ignoreResist,
                       chillDouble:!!c.burn.chillDouble, spread:c.burn.spread || 0 } : null,
      dead:c.dead, d:c.d, x:c.x, y:c.y, arm:c.arm } : null; },
  clearCreeps: () => { creeps = []; },
  /* teleport a pinned dummy — the only honest way to test "walked out of
     range" without also testing the pathing */
  moveCreep: (id, x, y) => { const c = creeps.find(z => z.id === id); if (c) { c.x = x; c.y = y; } return !!c; },
  /* damage ledger */
  setLog: on => { dmgLog = on ? [] : null; },
  log: () => (dmgLog || []).slice(),
  clearLog: () => { if (dmgLog) dmgLog.length = 0; },
  /* balance knobs */
  seedRandom: s => { RNG = mulberry32(s >>> 0); },
  setCurve: (lvl, wav) => { HP_LEVEL = lvl; HP_WAVE = wav; },
  curve: () => ({ HP_LEVEL, HP_WAVE, HP_BOSS }),
  setPacing: (w0, step, boss, grace, gap) => {
    if (w0) SPAWN_W0 = w0; if (step !== undefined) SPAWN_WSTEP = step; if (boss) SPAWN_WBOSS = boss;
    if (grace) GRACE_T = grace; if (gap) GAP_T = gap;
  },
  pacing: () => ({ SPAWN_W0, SPAWN_WSTEP, SPAWN_WBOSS, GRACE_T, GAP_T, LEVEL_T, FAIL_T }),
  wave: gw => buildWave(gw), hpMulFor, spdMulFor, armMulFor, startCashFor, coresForWave,
  globalWave, isBossWave, levelOfWave, waveInLevel, spawnWindowFor, labCost, turretUpCost,
  /* canvas hitboxes */
  cardRects: () => cardRects.map(r => ({ kind:r.kind, x:r.x, y:r.y, w:r.w, h:r.h, un:r.un, afford:r.afford, capped:r.capped })),
  tabRects: () => tabRects.map(r => ({ id:r.id, x:r.x, y:r.y, w:r.w, h:r.h })),
  setTab: id => { barTab = id; },
  comboAt: (r, c) => { const t = tileAt(r, c); return t && t.combo ? t.combo.id : null; },
  groundsRaw: () => grounds.map(g => ({ x:g.x, y:g.y, r:g.r, t:g.t, dps:g.dps })),
  panelRects: () => panelBtns,
  hudRects: () => hudBtns,
  selected: () => (sel ? { kind:sel.kind, mod:sel.mod, r:sel.r, c:sel.c } : null),
  /* persistence + screens */
  save: i => saveTo(SLOT_KEY(i)), load: i => restoreFrom(SLOT_KEY(i)),
  autoSave, hasAuto: () => hasSave(AUTO_KEY),
  scores: getScores,
  /* clearStorage has to drop the IN-MEMORY codex too, or it diverges from
     disk: a wipe left the discoveries still listed but no longer stored, and
     recordCombo then declined to re-write them because it thought they were
     already known. */
  clearStorage: () => { try { localStorage.clear(); } catch (e) {} codex = {}; },
  showMenu, showLab, showPause, showCodex, closeScreen,
  gfx: () => GFX, setGfx, GFX_STYLES,
  gfxMenuOpen: () => gfxMenuOpen(), openGfxMenu, closeGfxMenu,
  codex: () => Object.keys(codex), COMBO_TOTAL, COMBOS_BY_ID,
  endRun,
};
</script>
