<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#06060e; --panel:#0b0b16; --border:#1a1a30;
  --green:#39ff14; --gold:#ffc300; --blue:#4488ff; --red:#ff2244;
  --white:#dde3ff; --dim:#8899bb; --purple:#b44fff;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height:100%; background:var(--bg); overflow:hidden;
  font-family:'Share Tech Mono', monospace; color:var(--white);
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overscroll-behavior:none;
}
#game {
  position:fixed; inset:0; display:block; width:100%; height:100dvh;
  touch-action:none; -webkit-user-select:none; user-select:none;
}
#hud {
  position:fixed; top:0; left:0; right:0; z-index:10; text-align:center;
  pointer-events:none;
  padding-top:calc(env(safe-area-inset-top, 0px) + 22px);
}
#hud .hud-label { font-size:0.5rem; letter-spacing:3px; color:var(--dim); }
#v-height {
  font-family:'Black Ops One', sans-serif; font-size:2.1rem; line-height:1.05;
  color:var(--green); text-shadow:0 0 18px rgba(57,255,20,0.6);
}
#hud-sub { font-size:0.6rem; letter-spacing:2px; color:var(--dim); margin-top:2px; }
#v-score { color:var(--gold); }
#v-best { color:var(--purple); }
#mute-btn {
  position:fixed; z-index:60;
  top:calc(env(safe-area-inset-top, 0px) + 6px);
  left:calc(env(safe-area-inset-left, 0px) + 8px);
  width:38px; height:30px; font-size:15px; line-height:1;
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  color:var(--white); padding:0;
  touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.overlay {
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(6,6,14,0.88); text-align:center; padding:24px;
  touch-action:none;
}
.overlay.hidden { display:none; }
.ov-title {
  font-family:'Black Ops One', sans-serif; font-size:2.0rem; letter-spacing:4px;
  color:var(--green); text-shadow:0 0 24px rgba(57,255,20,0.7); margin-bottom:14px;
}
.ov-sub { font-size:0.75rem; color:var(--dim); letter-spacing:1px; line-height:2; margin-bottom:26px; }
.ov-score {
  font-family:'Black Ops One', sans-serif; font-size:1.5rem; letter-spacing:3px;
  color:var(--gold); text-shadow:0 0 18px rgba(255,195,0,0.6); margin-bottom:8px;
}
.ov-tap {
  font-size:0.85rem; color:var(--white); letter-spacing:3px;
  border:1px solid var(--border); background:var(--panel);
  padding:12px 26px; border-radius:8px;
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.45;} }
#banner {
  position:fixed; left:0; right:0; top:26%; z-index:40; text-align:center;
  pointer-events:none; opacity:0; transition:opacity 0.25s;
}
#banner.show { opacity:1; }
#banner .b-big {
  font-family:'Black Ops One', sans-serif; font-size:1.4rem; letter-spacing:4px;
  color:var(--gold); text-shadow:0 0 22px rgba(255,195,0,0.8);
}
</style>
</head>
<body>
<div id="build-badge" style="position:fixed;top:2px;right:6px;z-index:2147483647;font-family:'Courier New',monospace;font-size:9px;color:#888;opacity:0.55;pointer-events:none;letter-spacing:0.5px;user-select:none;">build 2026-07-24 00:00 UTC</div>
<canvas id="game"></canvas>
<div id="hud">
  <div class="hud-label">HEIGHT</div>
  <div id="v-height">0</div>
  <div id="hud-sub"><span id="v-score">SCORE 0</span> &nbsp;&bull;&nbsp; <span id="v-best">BEST 0</span></div>
</div>
<button id="mute-btn">🔊</button>

<div id="banner"><div class="b-big" id="b-big"></div></div>

<div class="overlay" id="ov-start">
  <div class="ov-title">NEON STACK</div>
  <div class="ov-sub">
    TAP TO DROP THE SLIDING BLOCK<br>
    OVERHANG GETS SLICED OFF<br>
    PERFECT DROPS &times;3 REGROW WIDTH<br>
    MISS COMPLETELY = TOPPLE
  </div>
  <div class="ov-tap">TAP TO STACK</div>
</div>

<div class="overlay hidden" id="ov-over">
  <div class="ov-title" style="color:var(--red); text-shadow:0 0 24px rgba(255,34,68,0.7);">TOPPLED</div>
  <div class="ov-score" id="o-height">0 HIGH</div>
  <div class="ov-sub" id="o-sub"></div>
  <div class="ov-tap">TAP TO RETRY</div>
</div>

<script>
'use strict';
// ------------------------------------------------------------- constants
// unit space: fixed 100 units wide; VH (unit height) derives from aspect.
// world y grows UPWARD; block i occupies y in [i*BLOCK_H, (i+1)*BLOCK_H].
const UW = 100;
const BLOCK_H = 7;                    // slab thickness (units)
const BASE_W = 56;                    // starting / max block width
const PERFECT_TOL = 2.5;              // |offset| <= this => perfect snap (fixed, never scales)
const SPEED0 = 38;                    // slide speed at height 0 (u/s)
const SPEED_INC = 1.2;                // +u/s per placed block
const SPEED_CAP = 95;                 // hard cap (fairness rule)
const REGROW = 4;                     // width regained per 3-perfect streak
const MISS_PAD = 4;                   // travel extends past full-miss offset by this
const CAM_ANCHOR_F = 0.45;            // tower top rides ~45% up the screen (55% down)
const CAM0 = -10;                     // start camera: ground 10u above screen bottom
const SETTLE = 0.07;                  // s: drop settle animation
const PLACE_SQUASH = 0.14;            // s: landing squash
const MILESTONE = 10;                 // flash + sfx every N blocks

// ------------------------------------------------------------- state
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let dpr = 1, cw = 0, ch = 0, scale = 1;
let VH = 200;                         // unit-space height (from aspect)

let state = 'title';                  // title | play | over (tests may use 'paused')
let simTime = 0, overT = 0;
let tower = [];                       // [{x,w,hue,placeT,settleT}] index = height slot
let slider = null;                    // {x,y,w,dir,min,max,speed,hue}
let debrisArr = [];                   // {x,y,w,vx,vy,vr,rot,hue,life}
let particles = [], texts = [], rings = [];
let placedN = 0, score = 0, combo = 0;
let spawnSide = 1;                    // flipped each spawn; -1 => enter from left
let camBot = CAM0, shake = 0, flashT = 0;
let best = 0, muted = false, newBestRun = false;
try { best = +(localStorage.getItem('neon-stack-best') || 0); } catch (e) {}
try { muted = localStorage.getItem('neon-stack-mute') === '1'; } catch (e) {}

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mod = (v, m) => ((v % m) + m) % m;
const hueFor = i => (150 + i * 13) % 360;       // neon HSL walk up the tower
const towerTopY = () => tower.length * BLOCK_H;

// ------------------------------------------------------------- audio core
let ac = null, sfxGain = null, musicGain = null;
let musicVol = 0.5;                   // softened to 0.16 on game over
let noiseBuf = null;
function audio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      sfxGain = ac.createGain();   sfxGain.connect(ac.destination);
      musicGain = ac.createGain(); musicGain.connect(ac.destination);
      applyGains();
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended' && !muted) ac.resume();
  return ac;
}
function applyGains() {
  if (!ac) return;
  sfxGain.gain.value = muted ? 0 : 0.9;
  musicGain.gain.value = muted ? 0 : musicVol;
}
function getNoise() {
  if (!noiseBuf && ac) {
    const len = Math.floor(ac.sampleRate * 0.2);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function beep(freq, dur, type, gain, slideTo) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(gain || 0.12, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g).connect(sfxGain);
  o.start(); o.stop(a.currentTime + dur);
}
function noiseHit(vol, dur, hp) {
  if (!ac || !getNoise()) return;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 3000;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  s.connect(f).connect(g).connect(sfxGain);
  s.start(); s.stop(ac.currentTime + dur + 0.02);
}

// ------------------------------------------------------------- sfx
const PENT = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5, 1568, 1760];
const sndPlace  = () => { beep(170, 0.08, 'square', 0.07, 110); beep(90, 0.11, 'sine', 0.18, 58); };
const sndTrim   = () => { beep(1050, 0.05, 'square', 0.06, 320); noiseHit(0.09, 0.07, 2600); };
const sndPerfect = c => {
  const f = PENT[Math.min(Math.max(c - 1, 0), PENT.length - 1)];
  beep(f, 0.12, 'sine', 0.13);
  setTimeout(() => beep(f * 1.5, 0.16, 'sine', 0.11), 62);
};
const sndRegrow = () => { beep(880, 0.06, 'sine', 0.09); setTimeout(() => beep(1320, 0.08, 'sine', 0.09), 50); setTimeout(() => beep(1760, 0.12, 'sine', 0.08), 100); };
const sndMile   = () => { beep(523, 0.09, 'sine', 0.12); setTimeout(() => beep(659, 0.09, 'sine', 0.12), 70); setTimeout(() => beep(880, 0.16, 'sine', 0.12), 140); };
const sndOver   = () => { beep(500, 0.7, 'sawtooth', 0.12, 55); setTimeout(() => beep(70, 0.6, 'sine', 0.22, 38), 150); };

// ------------------------------------------------------------- music
// chill synthwave ~100 BPM: 16th-note step sequencer, 32-step (2-bar) loop.
// A-minor-pentatonic arpeggio lead over Am -> F bass, soft offbeat hats.
const STEP_DUR = 60 / 100 / 4;        // 0.15 s per 16th at 100 BPM
const NF = { F2:87.31, A2:110, G4:392, A4:440, C5:523.25, D5:587.33, E5:659.25, G5:783.99, A5:880 };
const LEAD_PAT = [
  'A4',0,'C5',0,'E5',0,'G5',0, 'E5',0,'C5',0,'D5',0,'E5',0,   // bar 1 (Am)
  'C5',0,'A4',0,'E5',0,'G5',0, 'A5',0,'G5',0,'E5',0,'D5',0 ]; // bar 2 (F)
const BASS_PAT = [];                  // [note, lenSteps] hits at 0/8 per bar
BASS_PAT[0] = ['A2', 8]; BASS_PAT[8] = ['A2', 7];
BASS_PAT[16] = ['F2', 8]; BASS_PAT[24] = ['F2', 7];
let musicTimer = null, musicStep = 0, nextNoteTime = 0;
function mLead(f, t) {
  const o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'sawtooth'; o.frequency.value = f;
  fl.type = 'lowpass'; fl.frequency.value = 1400; fl.Q.value = 1;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.05, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  o.connect(fl); fl.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + 0.4);
}
function mBass(f, t, lenSteps) {
  const d = lenSteps * STEP_DUR;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.08, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.055, t + d * 0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + d + 0.05);
}
function mHat(t, vol) {
  if (!getNoise()) return;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6500;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  s.connect(f); f.connect(g); g.connect(musicGain);
  s.start(t); s.stop(t + 0.07);
}
function musicPlayStep(stp, t) {
  const ln = LEAD_PAT[stp]; if (ln) mLead(NF[ln], t);
  const bn = BASS_PAT[stp]; if (bn) mBass(NF[bn[0]], t, bn[1]);
  if (stp % 4 === 2) mHat(t, 0.03);
  if (stp === 15 || stp === 31) mHat(t, 0.016);
}
function musicSchedule() {
  if (!ac) return;
  while (nextNoteTime < ac.currentTime + 0.3) {   // ~0.3 s lookahead
    musicPlayStep(musicStep, nextNoteTime);
    musicStep = (musicStep + 1) % 32;
    nextNoteTime += STEP_DUR;
  }
}
function startMusic() {
  const a = audio(); if (!a) return;
  musicVol = 0.5; applyGains();
  if (musicTimer) return;                          // already looping
  musicStep = 0; nextNoteTime = a.currentTime + 0.08;
  musicTimer = setInterval(musicSchedule, 100);
}
function softenMusic() { musicVol = 0.16; applyGains(); }
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend();
  else if (!muted) ac.resume();
});

// ------------------------------------------------------------- layout
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = canvas.clientWidth; ch = canvas.clientHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = cw / UW;
  VH = ch / scale;
}
const sx = x => x * scale;
const sy = y => (camBot + VH - y) * scale;

// ------------------------------------------------------------- stars
let stars = [];
function initStars() {
  stars = [];
  for (let i = 0; i < 54; i++)
    stars.push({ x: Math.random() * UW, y: Math.random() * 400,
                 tw: 2 + Math.random() * 4, ph: Math.random() * Math.PI * 2,
                 r: 0.8 + Math.random() * 1.3 });
}

// ------------------------------------------------------------- flow
function reset() {
  tower = [{ x: UW / 2, w: BASE_W, hue: hueFor(0), placeT: 0, settleT: 0 }];
  placedN = 0; score = 0; combo = 0; spawnSide = 1; newBestRun = false;
  debrisArr = []; particles = []; texts = []; rings = [];
  camBot = CAM0; shake = 0; flashT = 0; overT = 0;
  spawnSlider();
  updateHud();
}
function startGame() {
  reset();
  state = 'play';
  startMusic();
}
function updateHud() {
  $('v-height').textContent = placedN;
  $('v-score').textContent = 'SCORE ' + score;
  $('v-best').textContent = 'BEST ' + best;
}
function showBanner(t, ms) {
  $('b-big').textContent = t;
  $('banner').classList.add('show');
  clearTimeout(showBanner.t);
  showBanner.t = setTimeout(() => $('banner').classList.remove('show'), ms || 900);
}
function addText(x, y, str, c) { texts.push({ x, y, str, c, life: 0.9 }); }
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 10 + Math.random() * 40;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.35 + Math.random() * 0.35, c: color, s: 3 });
  }
}
function gameOver() {
  state = 'over'; overT = 0; shake = 0.5;
  sndOver();
  softenMusic();
  try { localStorage.setItem('neon-stack-best', best); } catch (e) {}
  const h = placedN, s = score, isBest = newBestRun;
  setTimeout(() => {
    if (state !== 'over') return;
    $('o-height').textContent = h + ' HIGH' + (isBest ? ' ★' : '');
    $('o-sub').innerHTML = 'SCORE ' + s + ' &bull; BEST ' + best +
      (isBest ? '<br>NEW BEST HEIGHT' : '');
    $('ov-over').classList.remove('hidden');
    updateHud();
  }, 900);
}

// ------------------------------------------------------------- core mechanics
// Fairness invariants (asserted by the headless drive):
//  - slider.speed = min(SPEED_CAP, SPEED0 + SPEED_INC * placedN)  (hard cap 95)
//  - travel half-range = max(w + MISS_PAD, 8) each side of the top block's
//    center, so the swept span covers the top block plus >= 8u beyond each
//    edge (perfect always reachable) AND reaches |offset| >= w (full miss
//    always possible)
//  - PERFECT_TOL is a const; width regrow is capped at BASE_W
function spawnSlider() {
  const top = tower[tower.length - 1];
  const w = top.w;
  const half = Math.max(w + MISS_PAD, 8);
  const speed = Math.min(SPEED_CAP, SPEED0 + SPEED_INC * placedN);
  spawnSide = -spawnSide;
  slider = {
    x: spawnSide < 0 ? top.x - half : top.x + half,
    y: towerTopY() + BLOCK_H,                     // bottom edge, one slab above top
    w, dir: spawnSide < 0 ? 1 : -1,
    min: top.x - half, max: top.x + half,
    speed, hue: hueFor(tower.length),
  };
}
function dropBlock() {
  if (state !== 'play' || !slider) return;
  const top = tower[tower.length - 1];
  const dx = slider.x - top.x, adx = Math.abs(dx);
  const y = towerTopY();                          // final resting bottom edge

  if (adx >= slider.w) {                          // overlap <= 0: total miss
    debrisArr.push({ x: slider.x, y: slider.y, w: slider.w,
      vx: (dx > 0 ? 1 : -1) * (12 + Math.random() * 8), vy: 8,
      vr: (dx > 0 ? 1 : -1) * (2.4 + Math.random() * 2), rot: 0,
      hue: slider.hue, life: 1.8 });
    slider = null;
    gameOver();
    return;
  }

  let newX, newW;
  if (adx <= PERFECT_TOL) {                       // PERFECT: snap, no trim
    newX = top.x; newW = top.w;
    combo++;
    score += 1 + 3 * combo;
    sndPerfect(combo);
    rings.push({ x: newX, y: y + BLOCK_H / 2, r: newW * 0.55, life: 0.35 });
    addText(newX, y + BLOCK_H + 4, 'PERFECT ×' + combo, '#ffc300');
    if (combo % 3 === 0) {                        // streak of 3: regrow width
      const grown = Math.min(BASE_W, newW + REGROW);
      if (grown > newW) {
        newW = grown;
        sndRegrow();
        burst(newX, y + BLOCK_H / 2, '#39ff14', 14);
        addText(newX, y + BLOCK_H + 11, 'WIDTH +' + REGROW, '#39ff14');
      }
    }
  } else {                                        // trim to the overlap
    newW = slider.w - adx;
    newX = (slider.x + top.x) / 2;
    const cutX = dx > 0 ? top.x + top.w / 2 + adx / 2 : top.x - top.w / 2 - adx / 2;
    debrisArr.push({ x: cutX, y, w: adx,
      vx: (dx > 0 ? 1 : -1) * (10 + Math.random() * 10), vy: 6,
      vr: (dx > 0 ? 1 : -1) * (2 + Math.random() * 2.5), rot: 0,
      hue: slider.hue, life: 1.4 });
    combo = 0;
    score += 1;
    shake = Math.max(shake, Math.min(0.32, 0.1 + adx * 0.015));
    sndTrim();
    sndPlace();
  }
  if (adx <= PERFECT_TOL) sndPlace();

  tower.push({ x: newX, w: newW, hue: slider.hue, placeT: PLACE_SQUASH, settleT: SETTLE });
  placedN++;
  if (placedN > best) {
    best = placedN; newBestRun = true;
    try { localStorage.setItem('neon-stack-best', best); } catch (e) {}
  }
  if (placedN % MILESTONE === 0) {
    flashT = 0.28;
    showBanner(placedN + ' HIGH  ▲', 1000);
    sndMile();
  }
  spawnSlider();
  updateHud();
}

// ------------------------------------------------------------- sim
function step(dt) {
  if (slider) {
    slider.x += slider.dir * slider.speed * dt;
    if (slider.x > slider.max) { slider.x = slider.max; slider.dir = -1; }
    else if (slider.x < slider.min) { slider.x = slider.min; slider.dir = 1; }
    slider.y = towerTopY() + BLOCK_H;
  }
  const camTarget = Math.max(CAM0, towerTopY() - VH * CAM_ANCHOR_F);
  camBot += (camTarget - camBot) * Math.min(1, dt * 6);
}

// ------------------------------------------------------------- input
let lastTap = 0, lastTouchT = 0, lastMuteTap = 0;
function onDown(e) {
  e.preventDefault();
  if (e.type === 'touchstart') lastTouchT = performance.now();
  else if (performance.now() - lastTouchT < 700) return;  // ghost mouse after touch
  audio();
  if (state === 'play') dropBlock();
}
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('mousedown', onDown);
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (state === 'play') { audio(); dropBlock(); }
    else uiTapLogic();
  }
});

function uiTapLogic() {
  const now = performance.now();
  if (now - lastTap < 400) return;      // iOS fires touchend AND click per tap
  lastTap = now;
  audio();
  if (state === 'title') { $('ov-start').classList.add('hidden'); startGame(); }
  else if (state === 'over' && overT > 0.7) { $('ov-over').classList.add('hidden'); startGame(); }
}
function uiTap(e) { e.preventDefault(); uiTapLogic(); }
$('ov-start').addEventListener('touchend', uiTap, { passive: false });
$('ov-start').addEventListener('click', uiTap);
$('ov-over').addEventListener('touchend', uiTap, { passive: false });
$('ov-over').addEventListener('click', uiTap);

function muteTap(e) {
  e.preventDefault(); e.stopPropagation();
  const now = performance.now();
  if (now - lastMuteTap < 400) return;
  lastMuteTap = now;
  muted = !muted;
  try { localStorage.setItem('neon-stack-mute', muted ? '1' : '0'); } catch (err) {}
  audio();
  applyGains();
  $('mute-btn').textContent = muted ? '🔇' : '🔊';
}
$('mute-btn').addEventListener('touchend', muteTap, { passive: false });
$('mute-btn').addEventListener('click', muteTap);

// ------------------------------------------------------------- render
function rr(x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
function drawSlab(cx, yB, w, hue, alpha, glow, squashK, settleK) {
  const yDraw = yB + (settleK || 0) * BLOCK_H;    // settle: eases down from spawn lane
  const k = squashK || 0;
  const W = w * scale * (1 + 0.22 * k), H = BLOCK_H * scale * (1 - 0.30 * k);
  const X = sx(cx) - W / 2, Y = sy(yDraw) - H;
  const edge = 'hsl(' + hue + ',100%,66%)';
  ctx.globalAlpha = alpha;
  ctx.shadowColor = edge; ctx.shadowBlur = glow;
  ctx.fillStyle = 'hsla(' + hue + ',90%,55%,0.20)';
  rr(X, Y, W, H, 2.5); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = edge; ctx.lineWidth = 1.6;
  rr(X, Y, W, H, 2.5); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X + 3, Y + 2.5); ctx.lineTo(X + W - 3, Y + 2.5); ctx.stroke();
  ctx.globalAlpha = 1;
}
function render() {
  // sky: hue drifts slowly with tower height
  const bgHue = 240 + (placedN * 1.5) % 80;
  const g = ctx.createLinearGradient(0, 0, 0, ch);
  g.addColorStop(0, 'hsl(' + Math.round(bgHue) + ',45%,7%)');
  g.addColorStop(1, 'hsl(' + Math.round(bgHue + 16) + ',50%,4%)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);

  // stars (parallax at 0.25x camera)
  ctx.fillStyle = '#dde3ff';
  for (const st of stars) {
    const yU = mod(st.y + camBot * 0.25, VH);
    ctx.globalAlpha = 0.5 * (0.55 + 0.45 * Math.sin(simTime * st.tw + st.ph));
    ctx.fillRect(sx(st.x) - st.r / 2, yU * scale - st.r / 2, st.r, st.r);
  }
  ctx.globalAlpha = 1;

  // subtle world grid
  ctx.strokeStyle = 'rgba(68,136,255,0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let gx = 0; gx <= UW; gx += 20) { ctx.moveTo(sx(gx), 0); ctx.lineTo(sx(gx), ch); }
  for (let wy = Math.ceil(camBot / 20) * 20; wy < camBot + VH + 20; wy += 20) {
    ctx.moveTo(0, sy(wy)); ctx.lineTo(cw, sy(wy));
  }
  ctx.stroke();

  // ground glow (visible early)
  const gy = sy(0);
  if (gy < ch + 60) {
    const gr = ctx.createLinearGradient(0, gy, 0, ch);
    gr.addColorStop(0, 'rgba(180,79,255,0.12)');
    gr.addColorStop(1, 'rgba(180,79,255,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(0, gy, cw, Math.max(0, ch - gy));
    ctx.strokeStyle = 'rgba(180,79,255,0.4)';
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(cw, gy); ctx.stroke();
  }

  // alignment guides: dashed verticals at the top block's edges
  if (slider && state === 'play') {
    const top = tower[tower.length - 1];
    ctx.setLineDash([3, 6]);
    ctx.strokeStyle = 'hsla(' + slider.hue + ',100%,70%,0.22)';
    ctx.lineWidth = 1;
    for (const e of [-1, 1]) {
      const gxp = sx(top.x + e * top.w / 2);
      ctx.beginPath();
      ctx.moveTo(gxp, sy(towerTopY()));
      ctx.lineTo(gxp, sy(slider.y + BLOCK_H) - 6);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // tower (deep blocks fade into glow)
  const topI = tower.length - 1;
  for (let i = 0; i < tower.length; i++) {
    const yB = i * BLOCK_H;
    if (yB > camBot + VH) break;
    if (yB + BLOCK_H < camBot) continue;
    const b = tower[i];
    const depth = topI - i;
    const alpha = Math.max(0.3, 1 - depth * 0.05);
    drawSlab(b.x, yB, b.w, b.hue, alpha, 8 + 6 * alpha,
             b.placeT > 0 ? b.placeT / PLACE_SQUASH : 0,
             b.settleT > 0 ? b.settleT / SETTLE : 0);
  }

  // sliding block
  if (slider && state === 'play') {
    const pulse = 10 + 4 * Math.sin(simTime * 6);
    drawSlab(slider.x, slider.y, slider.w, slider.hue, 1, pulse, 0, 0);
  }

  // debris (cut pieces / missed block)
  for (const d of debrisArr) {
    ctx.save();
    ctx.translate(sx(d.x), sy(d.y + BLOCK_H / 2));
    ctx.rotate(d.rot);
    ctx.globalAlpha = clamp(d.life, 0, 1);
    const W = d.w * scale, H = BLOCK_H * scale;
    const edge = 'hsl(' + d.hue + ',100%,60%)';
    ctx.shadowColor = edge; ctx.shadowBlur = 8;
    ctx.fillStyle = 'hsla(' + d.hue + ',90%,50%,0.18)';
    rr(-W / 2, -H / 2, W, H, 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = edge; ctx.lineWidth = 1.4;
    rr(-W / 2, -H / 2, W, H, 2); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // perfect rings
  for (const r of rings) {
    ctx.globalAlpha = clamp(r.life * 2.8, 0, 1);
    ctx.strokeStyle = '#ffc300';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(sx(r.x), sy(r.y), r.r * scale, r.r * scale * 0.4, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2.2);
    ctx.fillStyle = p.c;
    ctx.fillRect(sx(p.x) - p.s / 2, sy(p.y) - p.s / 2, p.s, p.s);
  }
  ctx.globalAlpha = 1;

  // floating texts
  ctx.font = '700 13px "Share Tech Mono", monospace';
  ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.globalAlpha = clamp(t.life * 1.6, 0, 1);
    ctx.fillStyle = t.c;
    ctx.fillText(t.str, sx(t.x), sy(t.y));
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // milestone flash
  if (flashT > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (flashT * 0.45).toFixed(3) + ')';
    ctx.fillRect(0, 0, cw, ch);
  }
}

// ------------------------------------------------------------- main loop
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  simTime += dt;
  if (state === 'play') step(dt);
  if (state === 'over') overT += dt;
  shake = Math.max(0, shake - dt);
  flashT = Math.max(0, flashT - dt);
  for (const b of tower) {
    if (b.settleT > 0) b.settleT = Math.max(0, b.settleT - dt);
    if (b.placeT > 0 && b.settleT <= 0) b.placeT = Math.max(0, b.placeT - dt);
  }
  for (const d of debrisArr) {
    d.vy -= 170 * dt; d.y += d.vy * dt; d.x += d.vx * dt;
    d.rot += d.vr * dt; d.life -= dt * 0.7;
  }
  debrisArr = debrisArr.filter(d => d.life > 0 && d.y > camBot - 60);
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  particles = particles.filter(p => p.life > 0);
  for (const r of rings) { r.life -= dt; r.r += 30 * dt; }
  rings = rings.filter(r => r.life > 0);
  for (const t of texts) { t.life -= dt; t.y += 12 * dt; }
  texts = texts.filter(t => t.life > 0);
  render();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 60));
resize();
initStars();
reset();                 // build the base tower behind the title overlay
$('mute-btn').textContent = muted ? '🔇' : '🔊';
updateHud();
requestAnimationFrame(frame);
</script>
</body>
</html>
