<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="rubyDiag" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ff8899"/>
    <stop offset="42%" stop-color="#ff2244"/>
    <stop offset="100%" stop-color="#8d0f22"/>
  </linearGradient>
  <radialGradient id="gasPuff" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff2244" stop-opacity="0.38"/>
    <stop offset="60%" stop-color="#ff2244" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#ff2244" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="clipGem">
    <rect x="82" y="100" width="170" height="170" rx="27" ry="27"/>
    <rect x="260" y="100" width="170" height="170" rx="27" ry="27"/>
    <rect x="82" y="278" width="170" height="170" rx="27" ry="27"/>
    <rect x="260" y="278" width="170" height="170" rx="27" ry="27"/>
  </clipPath>
  <clipPath id="clipSolidBand">
    <rect x="0" y="332" width="512" height="180"/>
  </clipPath>
</defs>

<!-- leafy bush, behind the gem -->
<g id="bush">
  <!-- top-back clump, crowns behind the gem's top edge -->
  <circle cx="256" cy="115" r="90" fill="#123c1a"/>
  <circle cx="188" cy="145" r="62" fill="#123c1a"/>
  <circle cx="324" cy="145" r="62" fill="#123c1a"/>
  <circle cx="210" cy="100" r="13" fill="#2e7d32"/>
  <circle cx="256" cy="75" r="11" fill="#2e7d32"/>
  <circle cx="302" cy="105" r="12" fill="#2e7d32"/>
  <circle cx="175" cy="155" r="10" fill="#2e7d32"/>
  <circle cx="337" cy="155" r="10" fill="#2e7d32"/>
  <circle cx="240" cy="85" r="7" fill="#66bb6a"/>
  <circle cx="272" cy="90" r="6" fill="#66bb6a"/>

  <!-- left-mid clump -->
  <circle cx="55" cy="290" r="50" fill="#123c1a"/>
  <circle cx="85" cy="318" r="38" fill="#123c1a"/>
  <circle cx="58" cy="278" r="9" fill="#2e7d32"/>
  <circle cx="80" cy="308" r="8" fill="#2e7d32"/>
  <circle cx="62" cy="268" r="6" fill="#66bb6a"/>

  <!-- right-mid clump -->
  <circle cx="457" cy="290" r="50" fill="#123c1a"/>
  <circle cx="427" cy="318" r="38" fill="#123c1a"/>
  <circle cx="454" cy="278" r="9" fill="#2e7d32"/>
  <circle cx="432" cy="308" r="8" fill="#2e7d32"/>
  <circle cx="450" cy="268" r="6" fill="#66bb6a"/>

  <!-- bottom-left clump -->
  <circle cx="95" cy="415" r="70" fill="#123c1a"/>
  <circle cx="145" cy="438" r="52" fill="#123c1a"/>
  <circle cx="62" cy="445" r="48" fill="#123c1a"/>
  <circle cx="100" cy="405" r="12" fill="#2e7d32"/>
  <circle cx="128" cy="435" r="10" fill="#2e7d32"/>
  <circle cx="72" cy="438" r="9" fill="#2e7d32"/>
  <circle cx="108" cy="392" r="7" fill="#66bb6a"/>

  <!-- bottom-right clump -->
  <circle cx="417" cy="415" r="70" fill="#123c1a"/>
  <circle cx="367" cy="438" r="52" fill="#123c1a"/>
  <circle cx="450" cy="445" r="48" fill="#123c1a"/>
  <circle cx="412" cy="405" r="12" fill="#2e7d32"/>
  <circle cx="384" cy="435" r="10" fill="#2e7d32"/>
  <circle cx="440" cy="438" r="9" fill="#2e7d32"/>
  <circle cx="404" cy="392" r="7" fill="#66bb6a"/>
</g>

<!-- 2x2 ruby gem, banded solid / liquid / gas -->
<g id="gem">

  <!-- bottom third: fully opaque faceted solid -->
  <g clip-path="url(#clipSolidBand)">
    <rect x="82" y="278" width="170" height="170" rx="27" ry="27" fill="url(#rubyDiag)"/>
    <rect x="260" y="278" width="170" height="170" rx="27" ry="27" fill="url(#rubyDiag)"/>
    <path d="M92,288 L242,288 L167,363 Z" fill="#ff8899" opacity="0.5"/>
    <path d="M270,288 L420,288 L345,363 Z" fill="#ff8899" opacity="0.5"/>
    <path d="M92,438 L242,438 L167,363 Z" fill="#8d0f22" opacity="0.4"/>
    <path d="M270,438 L420,438 L345,363 Z" fill="#8d0f22" opacity="0.4"/>
    <circle cx="110" cy="350" r="10" fill="#ffffff" opacity="0.85"/>
    <circle cx="288" cy="350" r="10" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- middle third: liquid, wavy top edge, ~55% opacity -->
  <g clip-path="url(#clipGem)">
    <path d="M60,225 C110,205 150,235 195,215 C240,195 275,225 315,205 C355,185 395,215 452,200 L452,332 L60,332 Z"
          fill="#ff2244" fill-opacity="0.55"/>
    <ellipse cx="150" cy="245" rx="16" ry="10" fill="#ff8899" fill-opacity="0.6" transform="rotate(-12 150 245)"/>
    <ellipse cx="335" cy="240" rx="13" ry="8" fill="#ff8899" fill-opacity="0.55" transform="rotate(8 335 240)"/>
  </g>

  <!-- top third: gas, ~25% opacity soft radial puffs, within the gem outline -->
  <g clip-path="url(#clipGem)">
    <circle cx="140" cy="150" r="58" fill="url(#gasPuff)"/>
    <circle cx="210" cy="190" r="44" fill="url(#gasPuff)"/>
    <circle cx="300" cy="150" r="58" fill="url(#gasPuff)"/>
    <circle cx="370" cy="190" r="44" fill="url(#gasPuff)"/>
    <circle cx="256" cy="120" r="52" fill="url(#gasPuff)"/>
  </g>

  <!-- gas drifting up, above the gem's top edge -->
  <g opacity="0.85">
    <circle cx="180" cy="80" r="30" fill="url(#gasPuff)"/>
    <circle cx="256" cy="50" r="26" fill="url(#gasPuff)"/>
    <circle cx="330" cy="78" r="28" fill="url(#gasPuff)"/>
    <circle cx="215" cy="35" r="17" fill="url(#gasPuff)"/>
    <circle cx="300" cy="38" r="16" fill="url(#gasPuff)"/>
  </g>
</g>
</svg>
