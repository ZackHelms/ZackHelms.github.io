<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Air Hockey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#06060e; --panel:#0b0b16; --border:#1a1a30;
  --green:#39ff14; --gold:#ffc300; --blue:#4488ff; --red:#ff2244;
  --white:#dde3ff; --dim:#8899bb; --purple:#b44fff;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height:100%; background:var(--bg); overflow:hidden;
  font-family:'Share Tech Mono', monospace; color:var(--white);
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overscroll-behavior:none;
}
#app { display:flex; flex-direction:column; height:100dvh;
  padding-bottom:env(safe-area-inset-bottom, 0px); }
#hud {
  display:grid; grid-template-columns:120px 1fr 120px; align-items:center;
  padding:calc(env(safe-area-inset-top, 0px) + 6px)
          calc(env(safe-area-inset-right, 0px) + 10px)
          4px
          calc(env(safe-area-inset-left, 0px) + 10px);
}
#hud-left { display:flex; gap:6px;
  position:relative; z-index:60; }      /* stays tappable above the overlays (z 50) */
#mute-btn {
  width:42px; height:30px; font-size:15px; line-height:28px; text-align:center;
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  color:var(--white); touch-action:manipulation; cursor:pointer;
}
#mode-btn {
  height:30px; padding:0 9px; font-size:0.6rem; letter-spacing:1px;
  line-height:28px; text-align:center; white-space:nowrap;
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  color:var(--white); touch-action:manipulation; cursor:pointer;
}
.hidden { display:none !important; }
#hud-mid { text-align:center; }
#v-score { font-family:'Black Ops One', sans-serif; font-size:1.02rem; letter-spacing:2px; line-height:1.2; }
#v-diff { font-size:0.55rem; letter-spacing:2px; color:var(--dim); }
#game { flex:1; min-height:0; min-width:0; display:block; width:100%; touch-action:none;
  -webkit-user-select:none; user-select:none; }
.overlay {
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(6,6,14,0.9); text-align:center; padding:24px;
  touch-action:none;
}
.overlay.hidden { display:none; }
.ov-title {
  font-family:'Black Ops One', sans-serif; font-size:1.7rem; letter-spacing:4px;
  color:var(--green); text-shadow:0 0 24px rgba(57,255,20,0.7);
  margin-bottom:12px; line-height:1.3;
}
.ov-sub { font-size:0.72rem; color:var(--dim); letter-spacing:1px; line-height:2; margin-bottom:20px; }
.ov-score {
  font-family:'Black Ops One', sans-serif; font-size:1.4rem; letter-spacing:3px;
  color:var(--gold); text-shadow:0 0 18px rgba(255,195,0,0.6); margin-bottom:8px;
}
.diff-row { display:flex; flex-direction:column; gap:12px; width:min(72vw, 250px); }
.diff-btn {
  font-family:'Black Ops One', sans-serif; font-size:1rem; letter-spacing:3px;
  color:var(--c); border:1px solid var(--c); background:var(--panel);
  padding:11px 0 9px; border-radius:10px; width:100%;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  touch-action:manipulation; cursor:pointer;
}
.diff-btn .rec {
  font-family:'Share Tech Mono', monospace; font-size:0.58rem;
  letter-spacing:2px; color:var(--dim);
}
.ov-btn {
  font-family:'Share Tech Mono', monospace; font-size:0.85rem; color:var(--white);
  letter-spacing:3px; border:1px solid var(--border); background:var(--panel);
  padding:12px 26px; border-radius:8px; width:min(72vw, 250px);
  margin-top:12px; touch-action:manipulation; cursor:pointer;
}
.ov-btn.primary { border-color:var(--green); color:var(--green); animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
</style>
</head>
<body>
<div id="build-badge" style="position:fixed;top:2px;right:6px;z-index:2147483647;font-family:'Courier New',monospace;font-size:9px;color:#888;opacity:0.55;pointer-events:none;letter-spacing:0.5px;user-select:none;">build 2026-07-24 13:55 UTC</div>
<div id="app">
  <div id="hud">
    <div id="hud-left">
      <div id="mute-btn">🔊</div>
      <div id="mode-btn">🤖 AI</div>
    </div>
    <div id="hud-mid">
      <div id="v-score">YOU 0 — 0 AI</div>
      <div id="v-diff">FIRST TO 7</div>
    </div>
    <div></div>
  </div>
  <canvas id="game"></canvas>
</div>

<div class="overlay" id="ov-start">
  <div class="ov-title">NEON<br>AIR HOCKEY</div>
  <div class="ov-sub">
    DRAG TO MOVE YOUR MALLET<br>
    SMACK THE PUCK INTO THE TOP GOAL<br>
    DEFEND YOUR OWN &bull; FIRST TO 7 WINS
  </div>
  <div class="diff-row" id="diff-row">
    <button class="diff-btn" id="db-ROOKIE" style="--c:var(--green)">ROOKIE<span class="rec" id="rec-ROOKIE">0W – 0L</span></button>
    <button class="diff-btn" id="db-PRO" style="--c:var(--gold)">PRO<span class="rec" id="rec-PRO">0W – 0L</span></button>
    <button class="diff-btn" id="db-LEGEND" style="--c:var(--red)">LEGEND<span class="rec" id="rec-LEGEND">0W – 0L</span></button>
  </div>
  <button class="ov-btn primary hidden" id="btn-2p">START 2-PLAYER</button>
</div>

<div class="overlay hidden" id="ov-over">
  <div class="ov-title" id="o-title">YOU WIN</div>
  <div class="ov-score" id="o-score">7 — 0</div>
  <div class="ov-sub" id="o-sub"></div>
  <button class="ov-btn primary" id="btn-rematch">REMATCH</button>
  <button class="ov-btn" id="btn-diff">CHANGE DIFFICULTY</button>
</div>

<script>
'use strict';
// ------------------------------------------------------------- constants
// table unit space: 100 wide x 160 tall, y grows downward. Player owns the
// bottom half (y > CENTER), the AI owns the top half.
const UW = 100, UH = 160, CENTER = 80;
const MAL_R = 7, PUCK_R = 4.5, POST_R = 1.2;
const GOAL_W = 34;
const GOAL_L = (UW - GOAL_W) / 2, GOAL_R = (UW + GOAL_W) / 2;
const CORNER_R = 13;
const CORNERS = [[CORNER_R, CORNER_R], [UW - CORNER_R, CORNER_R],
                 [CORNER_R, UH - CORNER_R], [UW - CORNER_R, UH - CORNER_R]];
const POSTS = [[GOAL_L, 0], [GOAL_R, 0], [GOAL_L, UH], [GOAL_R, UH]];
const PHYS_HZ = 240;                    // fixed-substep rate
const PUCK_DAMP = 0.18;                 // fractional damping per second
const WALL_E = 0.92;                    // wall restitution
const MAL_E = 0.88;                     // mallet-puck restitution
const PUCK_VMAX = 220;                  // hard speed cap (tunneling guard w/ substeps)
const PMAL_K = 26, PMAL_VMAX = 460;     // player mallet chase gain / speed cap
const STRIKE_BACK = MAL_R + PUCK_R + 1.5; // AI strike point sits this far behind the puck
const AI_HOME_Y = 20;                   // AI defend spot in front of its goal
const WIN_SCORE = 7;
const FINGER_OFF = 6;                   // mallet rides this far above the finger
const COUNT_T = 0.8;                    // post-goal serve countdown

// AI difficulty table: max speed u/s, reaction delay ms, aim error +/- units
const AI = {
  ROOKIE: { spd: 55,  react: 220, err: 14 },
  PRO:    { spd: 85,  react: 120, err: 7  },
  LEGEND: { spd: 120, react: 60,  err: 3  },
};

// ------------------------------------------------------------- state
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let dpr = 1, cw = 0, ch = 0, scale = 1, ox = 0, oy = 0;

let state = 'title';                    // title | count | play | over (tests use 'paused')
let diff = 'PRO', aiP = AI.PRO;
let mode = 'ai';                        // 'ai' (vs AI) | '2p' (second player owns the top mallet)
let scoreP = 0, scoreA = 0;
let puck = { x: 50, y: 120, vx: 0, vy: 0, trail: [] };
let pMal = { x: 50, y: 138, vx: 0, vy: 0 };
let aMal = { x: 50, y: AI_HOME_Y, vx: 0, vy: 0, tx: 50, ty: AI_HOME_Y, spd: 85 };
let dragTarget = null;                  // {x,y} world-space P1 mallet target (input or test script)
let dragTarget2 = null;                 // {x,y} P2 (top) mallet target, 2P mode only
let ptP1 = null, ptP2 = null;           // active pointer ids ('mouse' or touch identifier)
let countT = 0, blips = [];
let simT = 0, renderT = 0;
let puckHist = [];                      // delayed puck snapshots for AI reaction lag
let aiErr = 0, aiErrT = 0;
let shake = 0, goalFlash = 0, flashCol = '#39ff14';
let goalMsg = '', goalMsgT = 0;
let particles = [];
let rec = { ROOKIE: { w: 0, l: 0 }, PRO: { w: 0, l: 0 }, LEGEND: { w: 0, l: 0 } };
try {
  const r = JSON.parse(localStorage.getItem('air-hockey-record') || 'null');
  if (r) for (const k of ['ROOKIE', 'PRO', 'LEGEND'])
    if (r[k] && isFinite(r[k].w) && isFinite(r[k].l)) rec[k] = { w: +r[k].w, l: +r[k].l };
} catch (e) {}
let muted = false;
try { muted = localStorage.getItem('air-hockey-mute') === '1'; } catch (e) {}
try { if (localStorage.getItem('air-hockey-mode') === '2p') mode = '2p'; } catch (e) {}

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ------------------------------------------------------------- audio core
let AC = null, masterGain = null, sfxGain = null, musicGain = null;
const MUSIC_VOL = 0.5;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = AC.createGain();
      masterGain.gain.value = muted ? 0 : 1;
      masterGain.connect(AC.destination);
      sfxGain = AC.createGain();
      sfxGain.gain.value = 0.9;
      sfxGain.connect(masterGain);
      musicGain = AC.createGain();
      musicGain.gain.value = MUSIC_VOL;
      musicGain.connect(masterGain);
    } catch (e) {}
  }
  if (AC && AC.state === 'suspended' && !document.hidden) AC.resume();
  return AC;
}
function applyMute() {
  if (AC && masterGain) masterGain.gain.setValueAtTime(muted ? 0 : 1, AC.currentTime);
  $('mute-btn').textContent = muted ? '🔇' : '🔊';
}
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend();
  else if (!muted) AC.resume();
});

// ------------------------------------------------------------- sfx
function beep(freq, dur, type, gain, slideTo, delay) {
  if (muted) return;
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(gain || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(sfxGain);
  o.start(t); o.stop(t + dur + 0.02);
}
const sndWall  = imp => beep(160 + Math.min(220, imp), 0.03, 'square', Math.min(0.07, 0.02 + imp * 0.00025));
const sndThunk = k => beep(110 + 190 * k, 0.07, 'triangle', 0.05 + 0.13 * k, 70 + 90 * k);
const sndBlip  = go => go ? beep(990, 0.1, 'square', 0.09) : beep(660, 0.05, 'square', 0.06);
function sndHorn() { beep(150, 0.6, 'sawtooth', 0.14, 105); beep(151.5, 0.6, 'square', 0.06, 106); }
function sndJingle(up) {
  const seq = up ? [523, 659, 784, 1047] : [784, 622, 466, 349];
  seq.forEach((f, i) => beep(f, 0.11, 'triangle', 0.1, null, 0.18 + i * 0.09));
}
function sndFanfare() {
  [[523, 0], [659, 0.12], [784, 0.24], [1047, 0.36], [784, 0.52], [1047, 0.62]]
    .forEach(([f, d], i) => beep(f, i === 5 ? 0.42 : 0.12, 'triangle', 0.12, null, d));
}
function sndSting() {
  beep(330, 0.25, 'sawtooth', 0.12, 220);
  beep(233, 0.3, 'sawtooth', 0.11, 150, 0.22);
  beep(147, 0.6, 'sawtooth', 0.12, 80, 0.45);
}

// ------------------------------------------------------------- music (lookahead step sequencer)
// driving arena synth ~110 BPM: saw bass 8ths, sparse square lead, kick 4s, noise hats.
const STEP_D = 60 / 110 / 4;            // one 16th note
const BASS = [55, 0, 55, 0, 55, 0, 55, 0, 55, 0, 55, 0, 65.41, 0, 73.42, 0,
              49, 0, 49, 0, 49, 0, 49, 0, 82.41, 0, 82.41, 0, 73.42, 0, 65.41, 0];
const LEAD = [0, 0, 220, 0, 0, 0, 261.63, 0, 0, 0, 329.63, 0, 0, 261.63, 0, 0,
              0, 0, 196, 0, 0, 0, 246.94, 0, 0, 0, 293.66, 0, 329.63, 0, 0, 392];
let musicTimer = null, musicStep = 0, nextNoteT = 0, noiseBuf = null;
function noise() {
  if (!noiseBuf && AC) {
    noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.5), AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function mnote(t, freq, dur, type, gain) {
  if (muted || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(musicGain);
  o.start(t); o.stop(t + dur + 0.02);
}
function mhat(t, dur, gain) {
  if (muted || !AC) return;
  const src = AC.createBufferSource(); src.buffer = noise();
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6500;
  const g = AC.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(musicGain);
  src.start(t); src.stop(t + dur + 0.02);
}
function mkick(t) {
  if (muted || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
  g.gain.setValueAtTime(0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  o.connect(g).connect(musicGain);
  o.start(t); o.stop(t + 0.15);
}
function playMusicStep(s, t) {
  const b = BASS[s]; if (b) mnote(t, b, 0.12, 'sawtooth', 0.055);
  const l = LEAD[s]; if (l) mnote(t, l, 0.18, 'square', 0.032);
  if (s % 8 === 0) mkick(t);
  if (s % 2 === 0) mhat(t, 0.03, 0.03);
  if (s % 8 === 4) mhat(t, 0.1, 0.05);
}
function musicSchedule() {
  if (!AC) return;
  while (nextNoteT < AC.currentTime + 0.3) {
    playMusicStep(musicStep, nextNoteT);
    musicStep = (musicStep + 1) % 32;
    nextNoteT += STEP_D;
  }
}
function startMusic() {
  const ac = audio(); if (!ac || musicTimer) return;
  musicStep = 0;
  nextNoteT = ac.currentTime + 0.12;
  musicTimer = setInterval(musicSchedule, 100);
}
function stopMusic() {
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}
function duckMusic() {                  // brief duck under the goal horn
  if (!AC || !musicGain) return;
  const t = AC.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setValueAtTime(0.12, t);
  musicGain.gain.linearRampToValueAtTime(MUSIC_VOL, t + 1.1);
}

// ------------------------------------------------------------- layout
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = canvas.clientWidth; ch = canvas.clientHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pad = 6;
  scale = Math.min((cw - pad * 2) / UW, (ch - pad * 2) / UH);
  ox = (cw - UW * scale) / 2;
  oy = (ch - UH * scale) / 2;
}
const px = x => ox + x * scale;
const py = y => oy + y * scale;

// ------------------------------------------------------------- flow
function updateHud() {
  $('v-score').textContent = mode === '2p'
    ? 'P1 ' + scoreP + ' — ' + scoreA + ' P2'
    : 'YOU ' + scoreP + ' — ' + scoreA + ' AI';
}
function applyMode() {                  // reflect the mode everywhere it shows
  $('mode-btn').textContent = mode === '2p' ? '👥 2P' : '🤖 AI';
  $('diff-row').classList.toggle('hidden', mode === '2p');
  $('btn-2p').classList.toggle('hidden', mode !== '2p');
  $('btn-diff').textContent = mode === '2p' ? 'MENU' : 'CHANGE DIFFICULTY';
  if (state === 'play' || state === 'count')
    $('v-diff').textContent = (mode === '2p' ? '2 PLAYER' : diff) + ' · FIRST TO ' + WIN_SCORE;
  updateHud();
}
function updateRecUI() {
  for (const k of ['ROOKIE', 'PRO', 'LEGEND'])
    $('rec-' + k).textContent = rec[k].w + 'W – ' + rec[k].l + 'L';
}
function saveRec() {
  try { localStorage.setItem('air-hockey-record', JSON.stringify(rec)); } catch (e) {}
}
function serve(conceder) {              // puck to the conceding side's half center
  puck.x = 50;
  puck.y = conceder === 'P' ? 120 : 40;
  puck.vx = 0; puck.vy = 0;
  puck.trail = [];
  countT = COUNT_T;
  blips = [0.5, 0.25];
  state = 'count';
}
function startMatch(d) {
  diff = d; aiP = AI[d];
  scoreP = 0; scoreA = 0;
  pMal = { x: 50, y: 138, vx: 0, vy: 0 };
  aMal = { x: 50, y: AI_HOME_Y, vx: 0, vy: 0, tx: 50, ty: AI_HOME_Y, spd: aiP.spd };
  puck = { x: 50, y: 120, vx: 0, vy: 0, trail: [] };
  puckHist = []; simT = 0;
  aiErr = 0; aiErrT = 0;
  dragTarget = null; dragTarget2 = null; ptP1 = null; ptP2 = null;
  particles = [];
  goalMsgT = 0; goalFlash = 0; shake = 0;
  $('ov-start').classList.add('hidden');
  $('ov-over').classList.add('hidden');
  $('v-diff').textContent = (mode === '2p' ? '2 PLAYER' : d) + ' · FIRST TO ' + WIN_SCORE;
  updateHud();
  audio();
  startMusic();
  serve('P');
}
function showStart() {
  state = 'title';
  stopMusic();
  $('ov-over').classList.add('hidden');
  $('ov-start').classList.remove('hidden');
  updateRecUI();
}
function matchOver(win) {                // win = the bottom player took the match
  state = 'over';
  stopMusic();
  puck.vx = 0; puck.vy = 0;
  if (mode !== '2p') {                   // 2P matches never touch the vs-AI record
    rec[diff][win ? 'w' : 'l']++;
    saveRec(); updateRecUI();
  }
  if (win || mode === '2p') sndFanfare(); else sndSting();
  const t = $('o-title');
  t.textContent = mode === '2p' ? (win ? 'P1 WINS' : 'P2 WINS') : (win ? 'YOU WIN' : 'YOU LOSE');
  t.style.color = win ? 'var(--green)' : 'var(--red)';
  t.style.textShadow = win ? '0 0 24px rgba(57,255,20,0.7)' : '0 0 24px rgba(255,34,68,0.7)';
  $('o-score').textContent = mode === '2p'
    ? 'P1 ' + scoreP + ' — ' + scoreA + ' P2'
    : 'YOU ' + scoreP + ' — ' + scoreA + ' AI';
  $('o-sub').textContent = mode === '2p'
    ? '2 PLAYER MATCH'
    : diff + ' · RECORD ' + rec[diff].w + 'W – ' + rec[diff].l + 'L';
  clearTimeout(matchOver.t);
  matchOver.t = setTimeout(() => { if (state === 'over') $('ov-over').classList.remove('hidden'); }, 900);
}
function goalFor(who) {
  if (who === 'P') scoreP++; else scoreA++;
  updateHud();
  shake = 0.5; goalFlash = 0.4;
  flashCol = who === 'P' ? '#39ff14' : '#ff2244';
  goalMsg = who === 'P'
    ? (mode === '2p' ? 'P1 SCORES!' : 'GOAL!')
    : (mode === '2p' ? 'P2 SCORES!' : 'AI SCORES');
  goalMsgT = 1.1;
  burst(clamp(puck.x, 10, UW - 10), who === 'P' ? 3 : UH - 3, flashCol, 20);
  sndHorn();
  duckMusic();
  sndJingle(who === 'P');
  if (scoreP >= WIN_SCORE || scoreA >= WIN_SCORE) { matchOver(scoreP > scoreA); return; }
  serve(who === 'P' ? 'A' : 'P');
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 15 + Math.random() * 55;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                     life: 0.3 + Math.random() * 0.35, c: color });
  }
}

// ------------------------------------------------------------- AI
function puckDelayed(ms) {
  const cutoff = simT - ms / 1000;
  for (let i = puckHist.length - 1; i >= 0; i--)
    if (puckHist[i].t <= cutoff) return puckHist[i];
  return puckHist[0] || { x: puck.x, y: puck.y };
}
function aiThink(dt) {
  aiErrT -= dt;
  const dp = puckDelayed(aiP.react);    // reaction lag: AI sees a stale puck
  let tx, ty, spd = aiP.spd;
  const attackable = dp.y < CENTER - PUCK_R && state !== 'count';
  if (attackable) {
    if (aiErrT <= 0) { aiErr = (Math.random() * 2 - 1) * aiP.err; aiErrT = 0.7; }
    const gx = 50 + aiErr;              // shot target: player's goal center + aim error
    let dx = gx - dp.x, dy = UH - dp.y;
    const dl = Math.hypot(dx, dy) || 1;
    dx /= dl; dy /= dl;
    if (dp.y < aMal.y - 1) {
      // puck between the mallet and the AI goal: circle around it, never
      // push it toward our own net
      const side = aMal.x >= dp.x ? 1 : -1;
      tx = dp.x + side * (MAL_R + PUCK_R + 5);
      ty = clamp(dp.y, MAL_R + 1, CENTER - MAL_R);
    } else {
      // strike point behind the puck, lined up toward the player's goal
      const sx = dp.x - dx * STRIKE_BACK, sy = dp.y - dy * STRIKE_BACK;
      if (Math.hypot(aMal.x - sx, aMal.y - sy) < 5) { tx = dp.x + dx * 3; ty = dp.y + dy * 3; } // lunge through
      else { tx = sx; ty = sy; }
    }
  } else {
    // defend the home spot in front of the goal, tracking puck x
    tx = 50 + clamp((dp.x - 50) * 0.7, -20, 20);
    ty = AI_HOME_Y;
    spd = aiP.spd * 0.8;
  }
  aMal.tx = clamp(tx, MAL_R + 0.5, UW - MAL_R - 0.5);
  aMal.ty = clamp(ty, MAL_R + 0.5, CENTER - MAL_R);
  aMal.spd = spd;
}

// ------------------------------------------------------------- physics
function capPuck() {
  const s2 = puck.vx * puck.vx + puck.vy * puck.vy;
  if (s2 > PUCK_VMAX * PUCK_VMAX) {
    const s = Math.sqrt(s2);
    puck.vx *= PUCK_VMAX / s; puck.vy *= PUCK_VMAX / s;
  }
}
function malletCorners(m) {             // keep mallets inside the rounded corners
  for (const c of CORNERS) {
    const inX = c[0] < 50 ? m.x < c[0] : m.x > c[0];
    const inY = c[1] < CENTER ? m.y < c[1] : m.y > c[1];
    if (!inX || !inY) continue;
    const dx = m.x - c[0], dy = m.y - c[1];
    const lim = CORNER_R - MAL_R;
    if (dx * dx + dy * dy > lim * lim) {
      const d = Math.sqrt(dx * dx + dy * dy) || 0.001;
      m.x = c[0] + dx / d * lim; m.y = c[1] + dy / d * lim;
    }
  }
}
function collideWalls() {
  let imp = 0;
  if (puck.x < PUCK_R) { puck.x = PUCK_R; if (puck.vx < 0) { imp = -puck.vx; puck.vx = -puck.vx * WALL_E; } }
  else if (puck.x > UW - PUCK_R) { puck.x = UW - PUCK_R; if (puck.vx > 0) { imp = puck.vx; puck.vx = -puck.vx * WALL_E; } }
  const inMouth = puck.x > GOAL_L && puck.x < GOAL_R;
  if (inMouth) {
    // no end wall across the mouth — but the goal posts are solid
    for (const p of POSTS) {
      const dx = puck.x - p[0], dy = puck.y - p[1];
      const rr = PUCK_R + POST_R;
      if (dx * dx + dy * dy < rr * rr) {
        const d = Math.hypot(dx, dy) || 0.001;
        const nx = dx / d, ny = dy / d;
        puck.x = p[0] + nx * rr; puck.y = p[1] + ny * rr;
        const vn = puck.vx * nx + puck.vy * ny;
        if (vn < 0) { imp = Math.max(imp, -vn); puck.vx -= (1 + WALL_E) * vn * nx; puck.vy -= (1 + WALL_E) * vn * ny; }
      }
    }
  } else {
    if (puck.y < PUCK_R) { puck.y = PUCK_R; if (puck.vy < 0) { imp = Math.max(imp, -puck.vy); puck.vy = -puck.vy * WALL_E; } }
    else if (puck.y > UH - PUCK_R) { puck.y = UH - PUCK_R; if (puck.vy > 0) { imp = Math.max(imp, puck.vy); puck.vy = -puck.vy * WALL_E; } }
  }
  // rounded-corner arcs
  for (const c of CORNERS) {
    const inX = c[0] < 50 ? puck.x < c[0] : puck.x > c[0];
    const inY = c[1] < CENTER ? puck.y < c[1] : puck.y > c[1];
    if (!inX || !inY) continue;
    const dx = puck.x - c[0], dy = puck.y - c[1];
    const lim = CORNER_R - PUCK_R;
    if (dx * dx + dy * dy > lim * lim) {
      const d = Math.sqrt(dx * dx + dy * dy) || 0.001;
      const nx = dx / d, ny = dy / d;
      puck.x = c[0] + nx * lim; puck.y = c[1] + ny * lim;
      const vn = puck.vx * nx + puck.vy * ny;
      if (vn > 0) { imp = Math.max(imp, vn); puck.vx -= (1 + WALL_E) * vn * nx; puck.vy -= (1 + WALL_E) * vn * ny; }
    }
  }
  if (imp > 8) sndWall(imp);
}
function malletHit(m) {
  const dx = puck.x - m.x, dy = puck.y - m.y;
  const rr = MAL_R + PUCK_R;
  const d2 = dx * dx + dy * dy;
  if (d2 >= rr * rr) return;
  let d = Math.sqrt(d2), nx, ny;
  if (d < 0.001) { nx = 0; ny = m.y > CENTER ? -1 : 1; }
  else { nx = dx / d; ny = dy / d; }
  puck.x = m.x + nx * rr; puck.y = m.y + ny * rr;
  const rvx = puck.vx - m.vx, rvy = puck.vy - m.vy;
  const vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    puck.vx -= (1 + MAL_E) * vn * nx;
    puck.vy -= (1 + MAL_E) * vn * ny;
    capPuck();
    if (-vn > 25) sndThunk(Math.min(1, -vn / 260));
    if (-vn > 60) burst(puck.x, puck.y, m === pMal ? '#39ff14' : '#ff2244', 6);
  }
}
function chaseMallet(m, tgt, yMin, yMax, h) {
  // finger-chase used by every human-driven mallet: proportional pursuit of
  // the drag target, clamped to its half, velocity from actual displacement
  const mx = m.x, my = m.y;
  if (tgt) {
    const tx = clamp(tgt.x, MAL_R, UW - MAL_R);
    const ty = clamp(tgt.y, yMin, yMax);
    m.x += clamp((tx - m.x) * PMAL_K, -PMAL_VMAX, PMAL_VMAX) * h;
    m.y += clamp((ty - m.y) * PMAL_K, -PMAL_VMAX, PMAL_VMAX) * h;
  }
  m.x = clamp(m.x, MAL_R, UW - MAL_R);
  m.y = clamp(m.y, yMin, yMax);
  malletCorners(m);
  m.vx = (m.x - mx) / h; m.vy = (m.y - my) / h;
}
function physSub(h) {
  // --- P1 mallet: strictly bottom half
  chaseMallet(pMal, dragTarget, CENTER + MAL_R, UH - MAL_R, h);

  // --- top mallet: player 2's finger in 2P mode, else the AI seek
  if (mode === '2p') {
    chaseMallet(aMal, dragTarget2, MAL_R, CENTER - MAL_R, h);
  } else {
    const aox = aMal.x, aoy = aMal.y;
    {
      const dx = aMal.tx - aMal.x, dy = aMal.ty - aMal.y;
      const d = Math.hypot(dx, dy);
      if (d > 0.001) {
        const s = Math.min(d, aMal.spd * h);
        aMal.x += dx / d * s; aMal.y += dy / d * s;
      }
    }
    aMal.x = clamp(aMal.x, MAL_R, UW - MAL_R);
    aMal.y = clamp(aMal.y, MAL_R, CENTER - MAL_R);      // strictly top half
    malletCorners(aMal);
    aMal.vx = (aMal.x - aox) / h; aMal.vy = (aMal.y - aoy) / h;
  }

  // --- puck (frozen during countdown / match over / title)
  if (state === 'count' || state === 'over' || state === 'title') return;
  const damp = Math.max(0, 1 - PUCK_DAMP * h);
  puck.vx *= damp; puck.vy *= damp;
  capPuck();
  puck.x += puck.vx * h;
  puck.y += puck.vy * h;
  collideWalls();
  malletHit(pMal);
  malletHit(aMal);
  collideWalls();                        // re-resolve after mallet pushes
  capPuck();
  if (puck.y < -PUCK_R) { goalFor('P'); return; }        // fully across top line
  if (puck.y > UH + PUCK_R) { goalFor('A'); return; }    // fully across bottom line
}
function step(dt) {
  simT += dt;
  if (mode !== '2p') aiThink(dt);
  if (state === 'count') {
    countT -= dt;
    if (blips.length && countT <= blips[0]) { blips.shift(); sndBlip(false); }
    if (countT <= 0) { countT = 0; state = 'play'; sndBlip(true); }
  }
  const n = Math.max(1, Math.round(dt * PHYS_HZ));
  const h = dt / n;
  for (let i = 0; i < n; i++) physSub(h);
  puckHist.push({ t: simT, x: puck.x, y: puck.y });
  while (puckHist.length && puckHist[0].t < simT - 0.6) puckHist.shift();
  puck.trail.push({ x: puck.x, y: puck.y });
  if (puck.trail.length > 14) puck.trail.shift();
}

// ------------------------------------------------------------- input
function ptWorld(t) {                    // one touch point / mouse event -> world coords
  const r = canvas.getBoundingClientRect();
  return [(t.clientX - r.left - ox) / scale, (t.clientY - r.top - oy) / scale];
}
// pointer assignment: each pointer belongs to the mallet of the half it
// STARTED in. In AI mode every pointer drives P1 (as before); in 2P mode a
// top-half start claims the top mallet. FINGER_OFF pushes each mallet from
// the finger toward that player's own view (up for P1, down for P2).
function pointDown(id, x, y) {
  if (state !== 'play' && state !== 'count') return;
  if (mode === '2p' && y <= CENTER) {
    if (ptP2 === null) { ptP2 = id; dragTarget2 = { x, y: y + FINGER_OFF }; }
  } else if (ptP1 === null) {
    ptP1 = id; dragTarget = { x, y: y - FINGER_OFF };
  }
}
function pointMove(id, x, y) {
  if (id === ptP1 && dragTarget) { dragTarget.x = x; dragTarget.y = y - FINGER_OFF; }
  else if (id === ptP2 && dragTarget2) { dragTarget2.x = x; dragTarget2.y = y + FINGER_OFF; }
}
function pointUp(id) {
  if (id === ptP1) { ptP1 = null; dragTarget = null; }
  if (id === ptP2) { ptP2 = null; dragTarget2 = null; }
}
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); audio();
  for (const t of e.changedTouches) { const [x, y] = ptWorld(t); pointDown(t.identifier, x, y); }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) { const [x, y] = ptWorld(t); pointMove(t.identifier, x, y); }
}, { passive: false });
const touchUp = e => {
  e.preventDefault();
  for (const t of e.changedTouches) pointUp(t.identifier);
};
canvas.addEventListener('touchend', touchUp, { passive: false });
canvas.addEventListener('touchcancel', touchUp, { passive: false });
canvas.addEventListener('mousedown', e => {
  audio();
  const [x, y] = ptWorld(e); pointDown('mouse', x, y);
});
window.addEventListener('mousemove', e => {
  if (ptP1 !== 'mouse' && ptP2 !== 'mouse') return;
  const [x, y] = ptWorld(e); pointMove('mouse', x, y);
});
window.addEventListener('mouseup', () => pointUp('mouse'));

let lastTap = 0;
function bindTap(el, fn) {              // iOS fires touchend AND click per tap
  const h = e => {
    e.preventDefault(); e.stopPropagation();
    const now = performance.now();
    if (now - lastTap < 400) return;
    lastTap = now;
    fn();
  };
  el.addEventListener('touchend', h, { passive: false });
  el.addEventListener('click', h);
}
bindTap($('db-ROOKIE'), () => startMatch('ROOKIE'));
bindTap($('db-PRO'), () => startMatch('PRO'));
bindTap($('db-LEGEND'), () => startMatch('LEGEND'));
bindTap($('btn-2p'), () => startMatch(diff));
bindTap($('btn-rematch'), () => startMatch(diff));
bindTap($('btn-diff'), showStart);
bindTap($('mode-btn'), () => {          // live toggle — works even mid-match
  mode = mode === 'ai' ? '2p' : 'ai';
  try { localStorage.setItem('air-hockey-mode', mode); } catch (e) {}
  dragTarget2 = null; ptP2 = null;      // top mallet waits for its new owner
  applyMode();
});
bindTap($('mute-btn'), () => {
  muted = !muted;
  try { localStorage.setItem('air-hockey-mute', muted ? '1' : '0'); } catch (e) {}
  audio();
  applyMute();
});

// ------------------------------------------------------------- render
function panelPath() {                  // full rounded rect (fill / clip)
  const R = CORNER_R * scale;
  ctx.beginPath();
  ctx.moveTo(px(CORNER_R), py(0));
  ctx.lineTo(px(UW - CORNER_R), py(0));
  ctx.arcTo(px(UW), py(0), px(UW), py(CORNER_R), R);
  ctx.lineTo(px(UW), py(UH - CORNER_R));
  ctx.arcTo(px(UW), py(UH), px(UW - CORNER_R), py(UH), R);
  ctx.lineTo(px(CORNER_R), py(UH));
  ctx.arcTo(px(0), py(UH), px(0), py(UH - CORNER_R), R);
  ctx.lineTo(px(0), py(CORNER_R));
  ctx.arcTo(px(0), py(0), px(CORNER_R), py(0), R);
  ctx.closePath();
}
function borderPath() {                 // two C-shapes leaving the goal mouths open
  const R = CORNER_R * scale;
  ctx.beginPath();
  ctx.moveTo(px(GOAL_R), py(0));
  ctx.lineTo(px(UW - CORNER_R), py(0));
  ctx.arcTo(px(UW), py(0), px(UW), py(CORNER_R), R);
  ctx.lineTo(px(UW), py(UH - CORNER_R));
  ctx.arcTo(px(UW), py(UH), px(UW - CORNER_R), py(UH), R);
  ctx.lineTo(px(GOAL_R), py(UH));
  ctx.moveTo(px(GOAL_L), py(UH));
  ctx.lineTo(px(CORNER_R), py(UH));
  ctx.arcTo(px(0), py(UH), px(0), py(UH - CORNER_R), R);
  ctx.lineTo(px(0), py(CORNER_R));
  ctx.arcTo(px(0), py(0), px(CORNER_R), py(0), R);
  ctx.lineTo(px(GOAL_L), py(0));
}
function drawSlot(yv, col) {            // glowing goal mouth just outside the line
  const out = yv === 0 ? -2.4 : 0.4;
  ctx.shadowColor = col; ctx.shadowBlur = 14;
  ctx.fillStyle = col;
  ctx.globalAlpha = 0.85;
  ctx.fillRect(px(GOAL_L), py(yv + out), GOAL_W * scale, 2 * scale);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  for (const gx of [GOAL_L, GOAL_R]) {  // posts
    ctx.fillStyle = '#dde3ff';
    ctx.beginPath(); ctx.arc(px(gx), py(yv), POST_R * scale, 0, Math.PI * 2); ctx.fill();
  }
}
function drawMallet(m, col, fillCol) {
  const X = px(m.x), Y = py(m.y), R = MAL_R * scale;
  ctx.shadowColor = col; ctx.shadowBlur = 14;
  ctx.fillStyle = fillCol;
  ctx.beginPath(); ctx.arc(X, Y, R, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(X, Y, R, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(221,227,255,0.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(X, Y, R * 0.68, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(X, Y, R * 0.4, 0, Math.PI * 2); ctx.fill();
}
function render() {
  ctx.clearRect(0, 0, cw, ch);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 12, (Math.random() - 0.5) * shake * 12);

  // felt + markings (clipped to the table)
  panelPath();
  ctx.fillStyle = '#0b0b16';
  ctx.fill();
  ctx.save();
  panelPath(); ctx.clip();
  ctx.strokeStyle = 'rgba(68,136,255,0.05)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let gx = 10; gx < UW; gx += 10) { ctx.moveTo(px(gx), py(0)); ctx.lineTo(px(gx), py(UH)); }
  for (let gy = 10; gy < UH; gy += 10) { ctx.moveTo(px(0), py(gy)); ctx.lineTo(px(UW), py(gy)); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(68,136,255,0.4)'; ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 7]);
  ctx.beginPath(); ctx.moveTo(px(0), py(CENTER)); ctx.lineTo(px(UW), py(CENTER)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(px(50), py(CENTER), 15 * scale, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(68,136,255,0.4)';
  ctx.beginPath(); ctx.arc(px(50), py(CENTER), 1.6 * scale, 0, Math.PI * 2); ctx.fill();
  // goal creases
  ctx.strokeStyle = 'rgba(255,34,68,0.25)';
  ctx.beginPath(); ctx.arc(px(50), py(0), 22 * scale, 0, Math.PI); ctx.stroke();
  ctx.strokeStyle = 'rgba(57,255,20,0.25)';
  ctx.beginPath(); ctx.arc(px(50), py(UH), 22 * scale, Math.PI, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // goal slots (defender-colored) + neon border
  drawSlot(0, '#ff2244');
  drawSlot(UH, '#39ff14');
  ctx.lineCap = 'round';
  ctx.shadowColor = '#4488ff'; ctx.shadowBlur = 10;
  ctx.strokeStyle = 'rgba(68,136,255,0.85)'; ctx.lineWidth = 2;
  borderPath(); ctx.stroke();
  ctx.shadowBlur = 0;

  // puck trail
  const tr = puck.trail;
  for (let i = 0; i < tr.length; i++) {
    ctx.globalAlpha = (i / tr.length) * 0.35;
    ctx.fillStyle = '#8ecbff';
    ctx.beginPath();
    ctx.arc(px(tr[i].x), py(tr[i].y), PUCK_R * scale * (0.35 + 0.6 * i / tr.length), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // puck
  ctx.shadowColor = '#dde3ff'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(px(puck.x), py(puck.y), PUCK_R * scale, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(68,136,255,0.7)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(px(puck.x), py(puck.y), PUCK_R * scale * 0.55, 0, Math.PI * 2); ctx.stroke();

  // mallets
  drawMallet(aMal, '#ff2244', 'rgba(255,34,68,0.18)');
  drawMallet(pMal, '#39ff14', 'rgba(57,255,20,0.18)');

  // countdown ring + text
  if (state === 'count') {
    const k = countT / COUNT_T;
    ctx.strokeStyle = '#ffc300'; ctx.lineWidth = 2;
    ctx.shadowColor = '#ffc300'; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(px(puck.x), py(puck.y), (PUCK_R + 2 + k * 16) * scale, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,195,0,0.9)';
    ctx.font = (5 * scale) + "px 'Black Ops One', sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText(countT > 0.18 ? 'READY' : 'GO!', px(50), py(CENTER - 22));
  }

  // goal message
  if (goalMsgT > 0) {
    ctx.globalAlpha = clamp(goalMsgT, 0, 1);
    ctx.fillStyle = flashCol;
    ctx.shadowColor = flashCol; ctx.shadowBlur = 18;
    ctx.font = (9 * scale) + "px 'Black Ops One', sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText(goalMsg, px(50), py(CENTER + 3));
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2.5);
    ctx.fillStyle = p.c;
    ctx.fillRect(px(p.x) - 1.5, py(p.y) - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  // goal flash
  if (goalFlash > 0) {
    ctx.globalAlpha = (goalFlash / 0.4) * 0.22;
    ctx.fillStyle = flashCol;
    ctx.fillRect(0, 0, cw, ch);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ------------------------------------------------------------- main loop
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  renderT += dt;
  if (dt > 0 && (state === 'play' || state === 'count')) step(dt);
  shake = Math.max(0, shake - dt);
  goalFlash = Math.max(0, goalFlash - dt);
  goalMsgT = Math.max(0, goalMsgT - dt);
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  particles = particles.filter(p => p.life > 0);
  render();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 60));
resize();
updateHud();
updateRecUI();
applyMute();
applyMode();
requestAnimationFrame(frame);
</script>
</body>
