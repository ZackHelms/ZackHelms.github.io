<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  height:100%; background:var(--bg); overflow:hidden;

  overscroll-behavior:none;
}

  position:fixed; inset:0; display:block; width:100%; height:100dvh;

}
#title {
  position:fixed; z-index:20; left:0; right:0;

}

#back-btn {

  background:var(--panel); border:1px solid var(--border); border-radius:8px;

}

  position:fixed; z-index:80;
  top:calc(env(safe-area-inset-top, 0px) + 6px);
  left:calc(env(safe-area-inset-left, 0px) + 52px);
  width:38px; height:30px; font-size:15px; line-height:1;
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  color:var(--white); padding:0;
  touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
#panel {
  position:fixed; z-index:30;
  left:calc(env(safe-area-inset-left, 0px) + 10px);
  right:calc(env(safe-area-inset-right, 0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
  max-width:420px; margin:0 auto;
  padding:10px 12px;
  background:rgba(11,11,22,0.82);
  border:1px solid var(--border); border-radius:10px;
  display:flex; align-items:center; gap:10px;
}

  flex:1; font-size:0.62rem; line-height:1.5; letter-spacing:0.5px; color:var(--dim);
}

  flex:0 0 auto;
  font-family:'Share Tech Mono', monospace;
  font-size:0.62rem; letter-spacing:2px; color:var(--white);
  background:var(--panel); border:1px solid var(--border); border-radius:8px;

  touch-action:manipulation; -webkit-user-select:none; user-select:none;
}

</style>

<body>
<div id="build-badge" style="position:fixed;top:2px;right:6px;z-index:2147483647;font-family:'Courier New',monospace;font-size:9px;color:#888;opacity:0.55;pointer-events:none;letter-spacing:0.5px;user-select:none;">build 2026-08-30 22:34 UTC</div>

<canvas id="game"></canvas>

<div id="title">
  <div class="t-name">VERLET RAGDOLL</div>
  <div class="t-sub">T-REX SKELETON SANDBOX</div>
</div>

<a id="back-btn" href="../index.html" aria-label="Back to games">←</a>
<button id="mute-btn">🔊</button>

<div id="panel">
  <div class="hint">
    <b>DRAG A BONE</b> to pull the skeleton around.<br>
    <b>DRAG EMPTY SPACE</b> to spin the whole rig.
  </div>
  <div id="btn-col">
    <button class="btn" id="btn-reset">RESET</button>
    <button class="btn" id="btn-grav">GRAVITY</button>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('game');
const ctx = canvas.getContext('2d');

let dpr = 1, W = 0, H = 0, pivotX = 0, pivotY = 0, scale = 1;

// ------------------------------------------------------------- audio core
let muted = false;
try { muted = localStorage.getItem('verlet-ragdoll-mute') === '1'; } catch (e) {}
let ac = null, sfxGain = null, musicGain = null, noiseBuf = null;
let musicVol = 0.38;

function audio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      sfxGain = ac.createGain();   sfxGain.connect(ac.destination);
      musicGain = ac.createGain(); musicGain.connect(ac.destination);
      const len = Math.floor(ac.sampleRate * 0.2);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      applyGains();
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended' && !muted) ac.resume();
  return ac;
}
function applyGains() {
  if (!ac) return;
  sfxGain.gain.value = muted ? 0 : 0.85;
  musicGain.gain.value = muted ? 0 : musicVol;
}
function beep(freq, dur, type, gain, slideTo) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(gain || 0.1, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g).connect(sfxGain);
  o.start(); o.stop(a.currentTime + dur);
}
function noiseHit(vol, dur, hp) {
  const a = audio(); if (!a || !noiseBuf) return;
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 2400;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  s.connect(f).connect(g).connect(sfxGain);
  s.start(); s.stop(a.currentTime + dur + 0.02);
}
// ------------------------------------------------------------- sfx
const sndGrab    = () => { beep(210, 0.06, 'square', 0.05, 320); noiseHit(0.05, 0.05, 3200); };
const sndRelease = () => { beep(150, 0.10, 'sine', 0.10, 78); };
const sndReset   = () => { beep(392, 0.09, 'sine', 0.10); setTimeout(() => beep(523, 0.09, 'sine', 0.10), 70); setTimeout(() => beep(784, 0.16, 'sine', 0.09), 140); };
const sndToggle  = () => { beep(660, 0.07, 'triangle', 0.08); };
const sndRattle  = () => { noiseHit(0.045, 0.06, 4200); };

// ------------------------------------------------------------- music
// Slow tar-pit ambience, ~64 BPM: a 32-step (2-bar) 16th-note sequencer over
// Dm -> Bb, a breathing pad and a sparse marimba-ish bone-tap.
const STEP_DUR = 60 / 64 / 4;
const NF = { D2:73.42, Bb1:58.27, D4:293.66, F4:349.23, A4:440, C5:523.25, D5:587.33, F5:698.46 };
const LEAD_PAT = [];
LEAD_PAT[0] = 'D4'; LEAD_PAT[6] = 'A4'; LEAD_PAT[10] = 'F4'; LEAD_PAT[14] = 'C5';
LEAD_PAT[16] = 'F4'; LEAD_PAT[22] = 'D5'; LEAD_PAT[26] = 'A4'; LEAD_PAT[30] = 'F5';
const BASS_PAT = [];
BASS_PAT[0] = ['D2', 16]; BASS_PAT[16] = ['Bb1', 15];
let musicTimer = null, musicStep = 0, nextNoteTime = 0;

function mPad(f, t, lenSteps) {
  const d = lenSteps * STEP_DUR;
  const o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'sawtooth'; o.frequency.value = f;
  fl.type = 'lowpass'; fl.frequency.value = 620; fl.Q.value = 0.8;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.075, t + d * 0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(fl); fl.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + d + 0.05);
}
function mPluck(f, t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.055, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + 0.55);
}
function mTick(t, vol) {
  if (!noiseBuf) return;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 5200;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  s.connect(f); f.connect(g); g.connect(musicGain);
  s.start(t); s.stop(t + 0.07);
}
function musicSchedule() {
  if (!ac) return;
  while (nextNoteTime < ac.currentTime + 0.3) {
    const ln = LEAD_PAT[musicStep]; if (ln) mPluck(NF[ln], nextNoteTime);
    const bn = BASS_PAT[musicStep]; if (bn) mPad(NF[bn[0]], nextNoteTime, bn[1]);
    if (musicStep % 8 === 4) mTick(nextNoteTime, 0.022);
    musicStep = (musicStep + 1) % 32;
    nextNoteTime += STEP_DUR;
  }
}
function startMusic() {
  const a = audio(); if (!a) return;
  applyGains();
  if (musicTimer) return;
  musicStep = 0; nextNoteTime = a.currentTime + 0.08;
  musicTimer = setInterval(musicSchedule, 100);
}
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend();
  else if (!muted) ac.resume();
});

// ------------------------------------------------------------- skeleton data
// Local coordinates, head at -x, tail at +x, authored at a nominal 1x scale
// and recentred on the centroid so a spin reads as a spin about the body.
const BASE = {
  hip:      [0, 0],
  spineL:   [-45, -20],
  spineM:   [-95, -45],
  spineU:   [-135, -75],
  neck1:    [-165, -115],
  neck2:    [-185, -160],
  neck3:    [-195, -205],
  skullBase:[-200, -250],
  skullTop: [-220, -300],
  skullTip: [-275, -262],
  jawTip:   [-260, -225],

  tailA: [55, 15],
  tailB: [115, 35],
  tailC: [175, 60],
  tailD: [230, 90],
  tailE: [280, 125],
  tailF: [320, 165],

  rib1: [-30, 25],
  rib2: [-72, 8],
  rib3: [-112, -22],

  elbow: [-118, -38],
  hand:  [-108, -12],

  kneeN:  [18, 72],
  ankleN: [8, 138],
  footN:  [38, 158],
  toeN1:  [62, 168],
  toeN2:  [42, 175],
  toeN3:  [22, 170],
  heelN:  [-12, 152],

  kneeF:  [-22, 66],
  ankleF: [-28, 132],
  footF:  [-4, 150],
  toeF1:  [20, 160],
  toeF2:  [0, 166],
  toeF3:  [-18, 160]
};
(function centre() {
  let sx = 0, sy = 0, n = 0;
  for (const k in BASE) { sx += BASE[k][0]; sy += BASE[k][1]; n++; }
  sx /= n; sy /= n;
  for (const k in BASE) { BASE[k][0] -= sx; BASE[k][1] -= sy; }
})();

// [a, b, category, width]
const bones = [
  ['skullBase', 'skullTop', 'skull', 7],
  ['skullBase', 'skullTip', 'skull', 9],
  ['skullTip', 'jawTip', 'jaw', 6],
  ['skullBase', 'jawTip', 'jaw', 5],

  ['skullBase', 'neck3', 'neck', 6],
  ['neck3', 'neck2', 'neck', 6],
  ['neck2', 'neck1', 'neck', 7],
  ['neck1', 'spineU', 'neck', 8],

  ['spineU', 'spineM', 'spine', 10],
  ['spineM', 'spineL', 'spine', 10],
  ['spineL', 'hip', 'spine', 11],

  ['spineL', 'rib1', 'rib', 4],
  ['spineM', 'rib2', 'rib', 4],
  ['spineU', 'rib3', 'rib', 4],

  ['spineU', 'elbow', 'arm', 5],
  ['elbow', 'hand', 'arm', 4],

  ['hip', 'tailA', 'tail', 9],
  ['tailA', 'tailB', 'tail', 8],
  ['tailB', 'tailC', 'tail', 7],
  ['tailC', 'tailD', 'tail', 6],
  ['tailD', 'tailE', 'tail', 4],
  ['tailE', 'tailF', 'tail', 3],

  ['hip', 'kneeN', 'leg', 9],
  ['kneeN', 'ankleN', 'leg', 8],
  ['ankleN', 'footN', 'leg', 6],
  ['footN', 'toeN1', 'toe', 3],
  ['footN', 'toeN2', 'toe', 3],
  ['footN', 'toeN3', 'toe', 3],
  ['ankleN', 'heelN', 'toe', 3],

  ['hip', 'kneeF', 'legFar', 7],
  ['kneeF', 'ankleF', 'legFar', 6],
  ['ankleF', 'footF', 'legFar', 5],
  ['footF', 'toeF1', 'toeFar', 2.5],
  ['footF', 'toeF2', 'toeFar', 2.5],
  ['footF', 'toeF3', 'toeFar', 2.5]
];
const boneLen = bones.map(() => 0);

const JOINT_R = {
  hip: 8, spineL: 6, spineM: 6, spineU: 6,
  skullBase: 7, skullTop: 5, skullTip: 6, jawTip: 4
};
const radiusFor = k => (JOINT_R[k] || 3.5) * scale;

// ------------------------------------------------------------- physics state
const points = {};
for (const k in BASE) points[k] = { x: 0, y: 0, oldx: 0, oldy: 0, lx: 0, ly: 0 };

let theta = 0;
let dragKey = null, hoverKey = null;
let rotating = false, rotStartAngle = 0, rotStartTheta = 0;
const mouse = { x: 0, y: 0 };
let gravityOn = true;

const GRAVITY = 0.55;     // px/frame^2 at 1x scale
const DAMPING = 0.965;
const SPRING = 0.045;     // pull back toward the posed rest position
const ITER = 5;           // constraint relaxation passes per frame

function layout() {
  // Local coordinates are re-derived from BASE on every resize so the rig fits
  // the viewport; the springs then walk the live points to the new rest pose,
  // which is why a resize never needs to snap the ragdoll back.
  scale = Math.max(0.34, Math.min(1.1, Math.min(W / 760, H / 780)));
  for (const k in BASE) {
    points[k].lx = BASE[k][0] * scale;
    points[k].ly = BASE[k][1] * scale;
  }
  for (let i = 0; i < bones.length; i++) {
    const A = points[bones[i][0]], B = points[bones[i][1]];
    boneLen[i] = Math.hypot(A.lx - B.lx, A.ly - B.ly);
  }
}
function resetPose() {
  theta = 0;
  for (const k in points) {
    const p = points[k];
    p.x = p.oldx = pivotX + p.lx;
    p.y = p.oldy = pivotY + p.ly;
  }
}
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pivotX = W / 2; pivotY = H * 0.44;
  layout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

// ------------------------------------------------------------- input
function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const lenSq = dx * dx + dy * dy;
  let t = lenSq ? ((px - ax) * dx + (py - ay) * dy) / lenSq : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}
function findBoneHit(x, y) {
  let best = null, bestDist = 26 * Math.max(scale, 0.6);
  for (let i = 0; i < bones.length; i++) {
    const A = points[bones[i][0]], B = points[bones[i][1]];
    const d = distToSegment(x, y, A.x, A.y, B.x, B.y);
    if (d < bestDist) {
      bestDist = d;
      best = Math.hypot(x - A.x, y - A.y) < Math.hypot(x - B.x, y - B.y) ? bones[i][0] : bones[i][1];
    }
  }
  return best;
}
function pointerDown(x, y) {
  audio(); startMusic();
  mouse.x = x; mouse.y = y;
  const hit = findBoneHit(x, y);
  if (hit) {
    dragKey = hit;
    sndGrab();
  } else {
    rotating = true;
    rotStartAngle = Math.atan2(y - pivotY, x - pivotX);
    rotStartTheta = theta;
    sndToggle();
  }
}
function pointerMove(x, y) {
  mouse.x = x; mouse.y = y;
  if (rotating) {
    theta = rotStartTheta + (Math.atan2(y - pivotY, x - pivotX) - rotStartAngle);
  } else if (!dragKey) {
    hoverKey = findBoneHit(x, y);
    canvas.style.cursor = hoverKey ? 'grab' : 'default';
  }
}
function pointerUp() {
  if (dragKey) sndRelease();
  dragKey = null; rotating = false;
  canvas.style.cursor = 'default';
}
canvas.addEventListener('mousedown', e => {
  pointerDown(e.clientX, e.clientY);
  canvas.style.cursor = dragKey ? 'grabbing' : 'move';
});
window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
window.addEventListener('mouseup', pointerUp);
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  pointerDown(t.clientX, t.clientY);
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  const t = e.touches[0];
  pointerMove(t.clientX, t.clientY);
  e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', pointerUp);
window.addEventListener('touchcancel', pointerUp);

function bindTap(el, fn) {
  let last = 0;
  const h = e => {
    e.preventDefault(); e.stopPropagation();
    const now = performance.now();
    if (now - last < 400) return;
    last = now;
    fn();
  };
  el.addEventListener('touchend', h, { passive: false });
  el.addEventListener('click', h);
}
bindTap($('btn-reset'), () => { audio(); startMusic(); resetPose(); sndReset(); });
bindTap($('btn-grav'), () => {
  audio(); startMusic();
  gravityOn = !gravityOn;
  $('btn-grav').classList.toggle('on', !gravityOn);
  $('btn-grav').textContent = gravityOn ? 'GRAVITY' : 'FLOATING';
  sndToggle();
});
bindTap($('mute-btn'), () => {
  muted = !muted;
  try { localStorage.setItem('verlet-ragdoll-mute', muted ? '1' : '0'); } catch (e) {}
  audio(); applyGains();
  $('mute-btn').textContent = muted ? '🔇' : '🔊';
});
$('mute-btn').textContent = muted ? '🔇' : '🔊';

// ------------------------------------------------------------- simulation
// Verlet integration: a point carries no velocity of its own, only the gap
// between where it is and where it was. Bone lengths are then restored by a
// handful of relaxation passes, which is what makes the rig read as a skeleton
// rather than a loose spring mesh.
let rattleCooldown = 0;

function simulate(t, dt) {
  const wobble = (rotating || dragKey) ? 0 : Math.sin(t * 0.5) * 0.05;
  const ct = Math.cos(theta + wobble), st = Math.sin(theta + wobble);
  const g = (gravityOn ? GRAVITY : 0) * scale;
  let moved = 0;

  for (const k in points) {
    const p = points[k];
    const restX = pivotX + p.lx * ct - p.ly * st;
    const restY = pivotY + p.lx * st + p.ly * ct;
    if (k === dragKey) {
      p.oldx = p.x; p.oldy = p.y;
      p.x = mouse.x; p.y = mouse.y;
    } else {
      const vx = (p.x - p.oldx) * DAMPING;
      const vy = (p.y - p.oldy) * DAMPING;
      p.oldx = p.x; p.oldy = p.y;
      p.x += vx + (restX - p.x) * SPRING;
      p.y += vy + (restY - p.y) * SPRING + g;
      moved += Math.abs(vx) + Math.abs(vy);
    }
  }

  for (let it = 0; it < ITER; it++) {
    for (let i = 0; i < bones.length; i++) {
      const A = points[bones[i][0]], B = points[bones[i][1]];
      const dx = B.x - A.x, dy = B.y - A.y;
      const dist = Math.hypot(dx, dy) || 0.0001;
      const diff = (dist - boneLen[i]) / dist;
      const aDrag = bones[i][0] === dragKey, bDrag = bones[i][1] === dragKey;
      if (aDrag && !bDrag) {
        B.x -= dx * diff; B.y -= dy * diff;
      } else if (bDrag && !aDrag) {
        A.x += dx * diff; A.y += dy * diff;
      } else if (!aDrag && !bDrag) {
        A.x += dx * diff * 0.5; A.y += dy * diff * 0.5;
        B.x -= dx * diff * 0.5; B.y -= dy * diff * 0.5;
      }
    }
  }

  // a dry bone rattle while the rig is genuinely thrashing, rate-limited so a
  // long drag does not turn into a buzz
  rattleCooldown -= dt;
  if (moved > 26 * scale && rattleCooldown <= 0) { sndRattle(); rattleCooldown = 0.14; }
}

// ------------------------------------------------------------- rendering
function drawBackground() {
  const g = ctx.createRadialGradient(pivotX, pivotY * 0.9, 40, pivotX, H * 0.6, Math.max(W, H) * 0.75);
  g.addColorStop(0, '#171a35');
  g.addColorStop(0.55, '#0d0e1e');
  g.addColorStop(1, '#06060e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const groundY = H * 0.86;
  const gg = ctx.createLinearGradient(0, groundY - 60, 0, H);
  gg.addColorStop(0, 'rgba(0,0,0,0)');
  gg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = gg;
  ctx.fillRect(0, groundY - 60, W, H - (groundY - 60));

  ctx.save();
  ctx.beginPath();
  ctx.ellipse(pivotX, groundY, W * 0.34, 22, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.filter = 'blur(6px)';
  ctx.fill();
  ctx.restore();
}
const boneColor = (i, total, t) => 'hsl(' + ((i / total * 300 + t * 22) % 360) + ', 82%, 62%)';

function drawBone(a, b, width, color, glow) {
  const A = points[a], B = points[b];
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = glow ? 20 : 10;
  ctx.strokeStyle = color;
  ctx.lineWidth = width * scale;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.stroke();
  ctx.restore();
}
function drawJoint(k) {
  const p = points[k];
  const held = k === dragKey;
  ctx.save();
  ctx.beginPath();
  ctx.arc(p.x, p.y, radiusFor(k) * (held ? 1.6 : 1), 0, Math.PI * 2);
  ctx.fillStyle = held ? '#39ff14' : '#f4f1e8';
  ctx.shadowColor = held ? 'rgba(57,255,20,0.8)' : 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = held ? 16 : 4;
  ctx.fill();
  ctx.restore();
}
function drawTeeth(a, b, count) {
  const A = points[a], B = points[b];
  const dx = B.x - A.x, dy = B.y - A.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const s = 9 * scale, w = 1.5 * scale, l = 3 * scale;
  ctx.save();
  ctx.fillStyle = '#fbfaf3';
  for (let i = 1; i < count; i++) {
    const f = i / count;
    const bx = A.x + dx * f, by = A.y + dy * f;
    ctx.beginPath();
    ctx.moveTo(bx - nx * w - (dx / len) * l, by - ny * w - (dy / len) * l);
    ctx.lineTo(bx - nx * w + (dx / len) * l, by - ny * w + (dy / len) * l);
    ctx.lineTo(bx + nx * s, by + ny * s);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}
// back-to-front so the far leg reads as far and the skull sits on top
const DRAW_ORDER = [
  ['legFar', 'toeFar'],
  ['rib', 'arm'],
  ['tail'],
  ['spine'],
  ['neck'],
  ['leg', 'toe'],
  ['skull', 'jaw']
];
function render(t) {
  drawBackground();

  for (const cats of DRAW_ORDER) {
    for (let i = 0; i < bones.length; i++) {
      const cat = bones[i][2];
      if (cats.indexOf(cat) === -1) continue;
      const far = cat === 'legFar' || cat === 'toeFar';
      const lit = dragKey && (bones[i][0] === dragKey || bones[i][1] === dragKey);
      ctx.globalAlpha = far ? 0.55 : 1;
      drawBone(bones[i][0], bones[i][1], bones[i][3], boneColor(i, bones.length, t), lit);
      ctx.globalAlpha = 1;
    }
  }

  // skull silhouette fill, so the head reads as a head at phone size
  const st1 = points.skullTip, sb = points.skullBase, sp = points.skullTop, jt = points.jawTip;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(st1.x, st1.y);
  ctx.lineTo(sp.x, sp.y);
  ctx.lineTo(sb.x, sb.y);
  ctx.lineTo(jt.x, jt.y);
  ctx.closePath();
  ctx.fillStyle = 'rgba(244,241,232,0.10)';
  ctx.fill();
  ctx.restore();

  drawTeeth('skullTip', 'skullBase', 5);
  drawTeeth('skullTip', 'jawTip', 4);

  const ex = sb.x + (st1.x - sb.x) * 0.4;
  const ey = sb.y + (st1.y - sb.y) * 0.35 - 6 * scale;
  ctx.save();
  ctx.beginPath();
  ctx.arc(ex, ey, 5 * scale, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(20,20,30,0.85)';
  ctx.fill();
  ctx.restore();

  for (const k in points) drawJoint(k);
}

// ------------------------------------------------------------- loop
const t0 = performance.now();
let last = t0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  simulate((now - t0) / 1000, dt);
  render((now - t0) / 1000);
  requestAnimationFrame(loop);
}

resize();
resetPose();
requestAnimationFrame(loop);
</script>
</body>
</html>
