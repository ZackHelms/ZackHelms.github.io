<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap');
:root {
  --bg:#06060e; --panel:#0b0b16; --border:#1a1a30;
  --green:#39ff14; --gold:#ffc300; --blue:#4488ff; --red:#ff2244;
  --white:#dde3ff; --dim:#8899bb; --purple:#b44fff;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--white);
  font-family:'Share Tech Mono', monospace;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  position:fixed; inset:0;
}
#cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
#back-btn {
  position:absolute; top:calc(var(--sat) + 8px); left:10px; z-index:30;
  background:var(--panel); border:1px solid var(--border); border-radius:6px;
  color:var(--white); font-size:16px; width:38px; height:34px; line-height:32px;
  text-align:center; text-decoration:none; touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
}
#mute {
  position:absolute; top:calc(var(--sat) + 8px); left:56px; z-index:30;
  background:var(--panel); border:1px solid var(--border); border-radius:6px;
  color:var(--white); font-size:16px; width:38px; height:34px; line-height:30px;
  text-align:center; padding:0; touch-action:manipulation;
}
#overlay {
  position:absolute; inset:0; z-index:20; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  background:rgba(6,6,14,0.90); padding:20px; text-align:center;
  padding-top:calc(var(--sat) + 20px); padding-bottom:calc(var(--sab) + 20px);
  overflow-y:auto;
}
#overlay.hidden { display:none; }
#overlay h1 {
  font-family:'Black Ops One', sans-serif; color:var(--green);
  font-size:clamp(1.7rem, 8vw, 2.6rem); letter-spacing:4px;
  text-shadow:0 0 24px #39ff1466; margin-bottom:4px;
}
#overlay h2 {
  font-family:'Black Ops One', sans-serif; color:var(--gold);
  font-size:1.5rem; letter-spacing:3px; margin-bottom:8px;
}
.sub { color:var(--dim); font-size:0.68rem; letter-spacing:3px; margin-bottom:18px; }
.btn {
  font-family:'Black Ops One', sans-serif; letter-spacing:2px;
  background:var(--panel); color:var(--green);
  border:1px solid var(--green); border-radius:8px;
  font-size:1.0rem; padding:13px 30px; margin:7px; min-width:230px;
  box-shadow:0 0 18px #39ff1422; touch-action:manipulation;
}
.btn.alt { color:var(--blue); border-color:var(--blue); box-shadow:0 0 18px #4488ff22; }
.btn.small { font-size:0.8rem; padding:10px 20px; min-width:180px; }
.btn:active { transform:scale(0.96); }
.rules { color:var(--dim); font-size:0.68rem; line-height:1.9; margin-top:14px; max-width:340px; }
.rules b { color:var(--white); }
.score-big {
  font-family:'Black Ops One', sans-serif; color:var(--white);
  font-size:2.6rem; text-shadow:0 0 24px #dde3ff44; margin:4px 0;
}
.stat { color:var(--dim); font-size:0.78rem; letter-spacing:1px; margin:3px 0; }
.stat b { color:var(--gold); }
.newbest { color:var(--gold); font-family:'Black Ops One',sans-serif; letter-spacing:2px; font-size:0.95rem; text-shadow:0 0 16px #ffc30066; margin:6px 0; }
#track-label {
  position:absolute; left:0; right:0; bottom:calc(var(--sab) + 4px); z-index:75;
  text-align:center; font-family:'Share Tech Mono', monospace; font-size:9px;
  color:var(--dim); opacity:0.6; letter-spacing:1px; pointer-events:none; user-select:none;
}
.shop-header { width:100%; max-width:340px; text-align:left; color:var(--dim); font-size:0.68rem; letter-spacing:1px; margin:10px 0 4px; }
.shop-row { width:100%; max-width:340px; text-align:left; border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin:5px 0; background:var(--panel); }
.shop-name { font-family:'Black Ops One',sans-serif; font-size:0.8rem; letter-spacing:1px; }
.shop-sub { color:var(--dim); font-size:0.62rem; line-height:1.5; margin:3px 0 6px; }
.shop-actions { display:flex; gap:6px; flex-wrap:wrap; }
.shop-actions .btn { margin:0; min-width:0; padding:7px 12px; font-size:0.7rem; }
</style>

function tone(freq, dur, type, vol, when, dest) {
  if (!AC || !isFinite(freq)) return;

  o.type = type || 'triangle'; o.frequency.value = freq;

  o.connect(g); g.connect(dest || sfxGain);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, when) {
  if (!AC) return;

  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);

  const g = AC.createGain(); g.gain.value = vol;
  s.connect(g); g.connect(sfxGain);

/* =========================== MUSIC ENGINE ================================
   webaudio-score/v1 compiler + instrument synthesis + look-ahead scheduler
   (headless-compile / host-schedule split; see zmhstudio's zmh-synth
   score-authoring skill for the format and instrument recipes).
=========================================================================== */
const PERC_IDS = new Set(['kick', 'snare', 'clap', 'hat-closed', 'hat-open', 'tom', 'crash', 'glitch-tick', 'breath-noise-wash']);
const NOTE_BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteToFreq(name) {
  const m = /^([A-Ga-g])([#b]?)(-?\d+)$/.exec(name);
  let semi = NOTE_BASE[m[1].toUpperCase()];
  if (m[2] === '#') semi += 1; else if (m[2] === 'b') semi -= 1;
  const midi = (parseInt(m[3], 10) + 1) * 12 + semi;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function compileScore(score) {
  const { bars, beatsPerBar, stepsPerBeat: defaultSpb, swing = 0, tracks } = score;
  const events = [];
  for (const tr of tracks) {
    const isDrum = PERC_IDS.has(tr.inst);
    const spb = tr.stepsPerBeat || defaultSpb;
    const stepsPerBar = beatsPerBar * spb;
    const totalSteps = stepsPerBar * bars;
    const stepDurBeats = 1 / spb;
    const flat = [];
    for (const name of tr.sequence) {
      if (name === '.') { for (let i = 0; i < stepsPerBar; i++) flat.push('.'); continue; }
      const toks = isDrum ? tr.patterns[name].replace(/\s+/g, '').split('') : tr.patterns[name].trim().split(/\s+/);
      flat.push(...toks);
    }
    if (isDrum) {
      for (let i = 0; i < totalSteps; i++) {
        const tok = flat[i];
        if (tok === '.') continue;
        let timeBeats = i * stepDurBeats;
        if (swing && (i % spb) % 2 === 1) timeBeats += swing * stepDurBeats;
        events.push({ timeBeats, durationBeats: stepDurBeats, frequencyHz: 0, velocity: tok === 'X' ? 1.0 : 0.72, instrument: tr.inst, gain: tr.gain });
      }
    } else {
      let cur = null;
      const closeCur = (endIdx) => {
        if (!cur) return;
        const durSteps = endIdx - cur.startIdx;
        if (durSteps > 0) {
          let timeBeats = cur.startIdx * stepDurBeats;
          if (swing && (cur.startIdx % spb) % 2 === 1) timeBeats += swing * stepDurBeats;
          const durationBeats = durSteps * stepDurBeats;
          for (const f of cur.freqs) events.push({ timeBeats, durationBeats, frequencyHz: f, velocity: 0.85, instrument: tr.inst, gain: tr.gain });
        }
        cur = null;
      };
      for (let i = 0; i < totalSteps; i++) {
        const tok = flat[i];
        if (tok === '.') { closeCur(i); continue; }
        if (tok === '-') continue;
        closeCur(i);
        cur = { startIdx: i, freqs: tok.split('+').map(noteToFreq) };
      }
      closeCur(totalSteps);
    }
  }
  events.sort((a, b) => a.timeBeats - b.timeBeats);
  const loopBeats = beatsPerBar * bars;
  const secondsPerBeat = 60 / score.bpm;
  return { events, loopBeats, secondsPerBeat, loopSeconds: loopBeats * secondsPerBeat };
}
const MUSIC_BY_ID = {};
MUSIC_TRACKS.forEach(t => { MUSIC_BY_ID[t.id] = t; });
const compiledCache = new Map();
function getCompiled(track) {
  if (!compiledCache.has(track.id)) compiledCache.set(track.id, compileScore(track));
  return compiledCache.get(track.id);
}

/* ---- instrument synthesis: percussion = shared seeded-noise buffer sliced
   through per-voice filter chains; melodic = live oscillator+filter+ADSR ---- */
let noiseBuf = null;
function makeFilter(type, freq, Q) { const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (Q) f.Q.value = Q; return f; }
function initMusicEngine() {
  if (noiseBuf) return;
  const sr = AC.sampleRate, dur = 4.0, n = Math.floor(sr * dur);
  noiseBuf = AC.createBuffer(1, n, sr);
  const d = noiseBuf.getChannelData(0);
  let seed = 0x9e3779b9;
  const rng = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let i = 0; i < n; i++) d[i] = rng() * 2 - 1;
  musicSlots[0].gain = AC.createGain(); musicSlots[0].gain.gain.value = 0; musicSlots[0].gain.connect(musicGain);
  musicSlots[1].gain = AC.createGain(); musicSlots[1].gain.gain.value = 0; musicSlots[1].gain.connect(musicGain);
}
function playNoise(offset, dur, time, dest, vel, tau, filters) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const g = AC.createGain(); g.gain.setValueAtTime(vel, time); g.gain.setTargetAtTime(0.0001, time, tau);
  let last = s;
  for (const mk of filters || []) { const f = mk(); last.connect(f); last = f; }
  last.connect(g); g.connect(dest);
  s.start(time, offset, dur); s.stop(time + dur + tau * 4 + 0.05);
}
function playKick(time, vel, dest) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(160, time); o.frequency.setTargetAtTime(45, time, 0.045);
  g.gain.setValueAtTime(vel, time); g.gain.setTargetAtTime(0.0001, time, 0.11);
  o.connect(g); g.connect(dest); o.start(time); o.stop(time + 0.4);
  playNoise(0.0, 0.02, time, dest, vel * 0.5, 0.008, []);
}
function playSnare(time, vel, dest) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = 190;
  g.gain.setValueAtTime(vel * 0.7, time); g.gain.setTargetAtTime(0.0001, time, 0.045);
  o.connect(g); g.connect(dest); o.start(time); o.stop(time + 0.25);

}

}
function playTom(time, vel, dest) {
  const o = AC.createOscillator(), g = AC.createGain();

function playCrash(time, vel, dest) { playNoise(2.2, 0.75, time, dest, vel * 0.8, 0.35, [() => makeFilter('highpass', 3000)]); }

function playBreathWash(time, vel, dest) {

/* ---- selection director: pure function of game state -> track id ----
   One dedicated bgm plays for an entire stage (every wave AND that stage's
   own mini-boss) so a track gets real listening time; it only changes at a
   stage boundary. The sector boss — the one extra, harder, longer fight
   after stage MAX_STAGE's mini-boss — gets its own more-intense pool.
   Both pools round-robin continuously across sectors (not reset per
   sector), so a longer campaign keeps surfacing different tracks. */
const MENU_TRACK_ID = 'menu-signal-drift';
const STAGE_BGM_IDS = [
  'calm-quiet-vector', 'calm-low-orbit', 'calm-dead-reckoning', 'calm-static-horizon',
  'combat-s1a-ignition-line', 'combat-s1b-first-contact', 'combat-s2a-chrome-salvo', 'combat-s2b-vector-storm',
  'combat-s3a-red-shift', 'combat-s3b-fracture-field', 'combat-s4a-siege-pattern', 'combat-s4b-null-gravity',
  'combat-s5a-terminal-velocity', 'combat-s5b-last-bastion',
];
const SECTOR_BOSS_TRACK_IDS = ['boss-1-iron-sentinel', 'boss-2-hollow-warden', 'boss-3-crimson-bulwark', 'boss-4-the-unmaking', 'boss-5-apex-annihilator'];
function selectTrackId() {
  if (state !== 'play') return MENU_TRACK_ID;
  if (boss && boss.sector) return SECTOR_BOSS_TRACK_IDS[(sector - 1) % SECTOR_BOSS_TRACK_IDS.length];
  const campaignStageIdx = (sector - 1) * MAX_STAGE + (stage - 1);
  return STAGE_BGM_IDS[campaignStageIdx % STAGE_BGM_IDS.length];
}

/* ---- look-ahead scheduler: two crossfading gain "slots", each with its
   own loop anchor + event cursor (drops, never replays, stale events) ---- */
const trackLabel = document.getElementById('track-label');
const musicSlots = [
  { gain: null, id: null, track: null, compiled: null, loopStart: 0, loopIndex: 0, nextEventIdx: 0, fadeUntil: 0 },
  { gain: null, id: null, track: null, compiled: null, loopStart: 0, loopIndex: 0, nextEventIdx: 0, fadeUntil: 0 },
];
let curMusicSlot = 0;
function scheduleSlot(slot) {
  const c = slot.compiled;
  const horizon = AC.currentTime + 0.35;
  let guard = 0;
  while (guard++ < 200) {
    if (slot.nextEventIdx >= c.events.length) { slot.nextEventIdx = 0; slot.loopIndex++; }
    const ev = c.events[slot.nextEventIdx];
    const t = slot.loopStart + slot.loopIndex * c.loopSeconds + ev.timeBeats * c.secondsPerBeat;
    if (t > horizon) break;
    if (t >= AC.currentTime - 0.1) playNote(ev, t, slot.gain, c.secondsPerBeat);
    slot.nextEventIdx++;
  }
}
function scheduleMusic() {
  if (!AC || !noiseBuf) return;
  const wantId = selectTrackId();
  if (musicSlots[curMusicSlot].id !== wantId) {
    const other = 1 - curMusicSlot;
    if (musicSlots[other].id !== wantId) {
      const track = MUSIC_BY_ID[wantId];
      const slot = musicSlots[other];
      slot.id = wantId; slot.track = track; slot.compiled = getCompiled(track);
      slot.loopStart = AC.currentTime + 0.05; slot.loopIndex = 0; slot.nextEventIdx = 0; slot.fadeUntil = 0;
      slot.gain.gain.cancelScheduledValues(AC.currentTime);
      slot.gain.gain.setValueAtTime(slot.gain.gain.value, AC.currentTime);
      slot.gain.gain.linearRampToValueAtTime(1, AC.currentTime + 1.0);
      trackLabel.textContent = '♪ ' + String(MUSIC_TRACKS.indexOf(track) + 1).padStart(2, '0') + ' · ' + track.name;
    }
    const old = musicSlots[curMusicSlot];
    old.gain.gain.cancelScheduledValues(AC.currentTime);
    old.gain.gain.setValueAtTime(old.gain.gain.value, AC.currentTime);
    old.gain.gain.linearRampToValueAtTime(0, AC.currentTime + 1.0);
    old.fadeUntil = AC.currentTime + 1.0;
    curMusicSlot = other;
  }
  for (const slot of musicSlots) {
    if (!slot.id) continue;
    if (slot.fadeUntil && AC.currentTime > slot.fadeUntil) { slot.id = null; continue; }
    scheduleSlot(slot);
  }
}

/* =============================== HELPERS ================================ */
function bindTap(el, fn) {
  let last = 0;

    e.preventDefault();
    const now = Date.now();
    if (now - last < 400) return;
    last = now;
    initAudio();
    fn();

  el.addEventListener('touchend', h, { passive: false });
  el.addEventListener('click', h);
}
bindTap(muteBtn, () => { muted = !muted; applyMute(); });
applyMute();
function hue(sat, l, a) { return 'hsla(' + STAGE_HUES[stage - 1] + ',' + sat + '%,' + l + '%,' + (a === undefined ? 1 : a) + ')'; }
function campaignDifficulty() { return (sector - 1) + (stage - 1) / MAX_STAGE; }   // 0 at sector1 stage1, ~+1 per sector cleared

function incomingRamDmg() { return 26 * (1 + campaignDifficulty() * 0.12); }

/* =============================== WAVES ================================== */
function buildWave(st, wv) {
  // deterministic spawn scripts; counts scale with stage, then with campaign difficulty across sectors
  const q = [];
  const n = 4 + st + Math.floor(campaignDifficulty() * 0.8);   // base count
  if (wv === 1) {
    for (let i = 0; i < n + 2; i++) q.push({ t: i * 0.55, type: 'drone', xf: 0.15 + 0.7 * ((i * 37) % 100) / 100 });
    for (let i = 0; i < Math.floor(st / 2); i++) q.push({ t: 2 + i * 1.2, type: 'shooter', xf: 0.3 + 0.4 * i });
  } else if (wv === 2) {
    for (let i = 0; i < Math.ceil(n / 2); i++) q.push({ t: i * 1.1, type: 'shooter', xf: 0.2 + 0.6 * ((i * 53) % 100) / 100 });
    for (let i = 0; i < n; i++) q.push({ t: 0.5 + i * 0.6, type: 'drone', xf: 0.1 + 0.8 * ((i * 71) % 100) / 100 });
  } else {
    for (let i = 0; i < Math.ceil(n / 2); i++) q.push({ t: i * 1.3, type: 'spinner', xf: i % 2 ? 0.05 : 0.95 });
    q.push({ t: 1.5, type: 'tanker', xf: 0.5 });
    if (st >= 3) q.push({ t: 3.5, type: 'tanker', xf: 0.25 });
    for (let i = 0; i < st; i++) q.push({ t: 2 + i * 0.8, type: 'drone', xf: 0.2 + 0.6 * ((i * 29) % 100) / 100 });
  }
  return q.sort((a, b) => a.t - b.t);
}
function enemyHp(type) {
  return Math.max(1, Math.round(ENEMY_DEFS[type].hp * (1 + campaignDifficulty() * 0.35)));
}
function spawnEnemy(type, x, y) {
  const d = ENEMY_DEFS[type];
  const e = { type, x, y: y === undefined ? -24 : y, hp: enemyHp(type), r: d.r, pts: d.pts, xp: d.xp, t: 0, fireT: 1 + Math.random(), slowT: 0 };
  if (type === 'drone') { e.vy = 95 + Math.random() * 30; e.amp = 30 + Math.random() * 30; e.x0 = x; }
  else if (type === 'shooter') { e.vy = 75; e.holdY = 90 + Math.random() * 130; }
  else if (type === 'spinner') { e.vx = x < W / 2 ? 65 : -65; e.y = 100 + Math.random() * 110; e.ang = 0; }
  else if (type === 'tanker') { e.vy = 38; }

}

/* =============================== COMBAT ================================= */
function awardXp(n) { save.xp += n; runXpEarned += n; }
// in-run P-powerup (1..4): purely a QUANTITY/AREA axis — more barrels/beams/lobes/
// jumps, or (EMP only) a bigger blast radius — layered on top of the permanent
// XP-purchased tier's QUALITY (dmg/dps/radius/agility). Fire rate is NOT touched by
// the pip — it stays constant so the player's own tap-fast-vs-hold-steady cadence
// is what controls attack speed, not a pickup. Keeping quantity and quality as two
// separate axes is what makes picking up a P feel like a real spike without it also
// compounding permanent-tier scaling.
function spreadOffsets(n, gap) {
  const arr = [];
  for (let i = 0; i < n; i++) arr.push((i - (n - 1) / 2) * gap);
  return arr;
}
function weaponCooldown() {
  const base = { blaster: 0.16, bombs: 0.55, missiles: 0.42, bolas: 0.22, chain: 0.4, emp: 1.3 }[save.equippedWeapon];
  return base;
}
// bombs alternate the pip bonus between "more turrets" and a bigger blast radius
const BOMB_UPGRADES = { 1: { count: 1, radiusMul: 1 }, 2: { count: 2, radiusMul: 1 }, 3: { count: 2, radiusMul: 1.35 }, 4: { count: 3, radiusMul: 1.35 } };
const MISSILE_MIN_TURN_RADIUS = { 1: 240, 2: 220, 3: 200, 4: 180, 5: 160 };   // px — a floor on turn radius so missiles can't just loop onto anything on screen
function fireWeapon() {
  const x = ship.x, y = ship.y - 16, v = -540, wt = save.equippedWeapon;
  if (wt === 'blaster') {
    const dmg = save.weapons.blaster;
    for (const off of spreadOffsets(weapon, 15)) bullets.push({ x: x + off * 0.4, y: y + Math.abs(off) * 0.12, vx: off * 2.4, vy: v, wtype: 'blaster', dmg });
  } else if (wt === 'bombs') {
    const tier = save.weapons.bombs, up = BOMB_UPGRADES[weapon];
    for (const off of spreadOffsets(up.count, 20)) bullets.push({ x: x + off, y, vx: off * 0.6, vy: v * 0.75, wtype: 'bombs', dmg: 3 + tier * 2, radius: (55 + tier * 10) * up.radiusMul, splash: 2 + tier });
  } else if (wt === 'missiles') {
    const tier = save.weapons.missiles;
    for (const off of spreadOffsets(weapon, 16)) {
      const vx = off * 0.5, vy = v * 0.8, spd = Math.hypot(vx, vy);
      const minRadius = MISSILE_MIN_TURN_RADIUS[tier] || 200;
      bullets.push({ x: x + off, y, vx, vy, wtype: 'missiles', dmg: 2 + tier, turnRate: Math.min(3 + tier * 0.6, spd / minRadius) });
    }
  } else if (wt === 'bolas') {
    const tier = save.weapons.bolas;
    for (const off of spreadOffsets(weapon, 18)) bullets.push({ x: x + off, y, vx: off * 0.4, vy: v, wtype: 'bolas', dmg: 1, slowDur: 1.5 + tier * 0.3 });
  }
}
function beamOffsets() { return spreadOffsets(weapon, 20); }   // one parallel beam per pip — literally "more turrets"
function damageInBeam(x, dps, dt, width) {
  for (const e of enemies.slice()) {
    if (Math.abs(e.x - x) < width && e.y < ship.y) { e.hp -= dps * dt; if (e.hp <= 0) killEnemy(e); }
  }
  if (boss && Math.abs(boss.x - x) < width + boss.r && boss.y < ship.y) { boss.hp -= dps * dt; if (boss.hp <= 0) bossDown(); }
}
function tickBeam(dt) {
  const tier = save.weapons.beam;
  const dps = 8 + tier * 6, width = 10 + tier * 3;
  for (const off of beamOffsets()) damageInBeam(ship.x + off, dps, dt, width);
}
const FLAME_LOBES = { 1: [0], 2: [-0.22, 0.22], 3: [-0.4, 0, 0.4], 4: [-0.55, -0.18, 0.18, 0.55] };
function tickFlame(dt) {
  const tier = save.weapons.flame;
  const dps = 14 + tier * 8, range = 100 + tier * 15, halfAngle = 0.32;
  const lobes = FLAME_LOBES[weapon];
  const targets = boss ? enemies.concat([boss]) : enemies.slice();
  for (const e of targets) {
    const dx = e.x - ship.x, dy = e.y - ship.y, dist = Math.hypot(dx, dy), rad = e === boss ? boss.r : e.r;
    if (dist > range + rad) continue;
    const ang = Math.atan2(dx, -dy);
    if (!lobes.some(off => Math.abs(ang - off) <= halfAngle)) continue;
    e.hp -= dps * dt;
    if (e === boss) { if (boss.hp <= 0) bossDown(); } else if (e.hp <= 0) killEnemy(e);
  }
}
function fireChain() {
  const tier = save.weapons.chain;
  let dmg = 3 + tier * 1.5;
  const count = (weapon - 1) * 2, radius = 140;   // pip 1 = 0 jumps (single hit); each pip adds 2 more jumps/enemies
  const hitSet = new Set();
  const allTargets = boss ? enemies.concat([boss]) : enemies.slice();
  const points = [{ x: ship.x, y: ship.y - 16 }];
  let curX = ship.x, curY = ship.y - 16;
  for (let i = 0; i <= count; i++) {
    let best = null, bestD = i === 0 ? 520 * 520 : radius * radius;
    for (const t of allTargets) {
      if (hitSet.has(t)) continue;
      const d = (t.x - curX) * (t.x - curX) + (t.y - curY) * (t.y - curY);
      if (d < bestD) { bestD = d; best = t; }
    }
    if (!best) break;
    hitSet.add(best); best.hp -= dmg; points.push({ x: best.x, y: best.y });
    curX = best.x; curY = best.y; dmg *= 0.75;
  }
  if (points.length > 1) { lightningBolts.push({ points, t: 0 }); sfxKill(); }
  for (const t of hitSet) { if (t === boss) { if (boss.hp <= 0) bossDown(); } else if (t.hp <= 0) killEnemy(t); }
}
function fireEmp() {
  const tier = save.weapons.emp;
  // no discrete "count" for a burst pulse — pip instead grows the blast radius directly (dmg stays a quality-tier stat)
  const dmg = 4 + tier * 2, radius = 100 + tier * 20 + (weapon - 1) * 18;
  empPulses.push({ x: ship.x, y: ship.y, r: 0, maxR: radius, t: 0 });
  for (const e of enemies.slice()) { if (Math.hypot(e.x - ship.x, e.y - ship.y) < radius) { e.hp -= dmg; if (e.hp <= 0) killEnemy(e); } }
  if (boss && Math.hypot(boss.x - ship.x, boss.y - ship.y) < radius + boss.r) { boss.hp -= dmg; if (boss.hp <= 0) bossDown(); }
  ebullets = ebullets.filter(b => Math.hypot(b.x - ship.x, b.y - ship.y) >= radius);
  sfxSurge();
}
function eShoot(x, y, tx, ty, speed) {
  if (ebullets.length >= EBULLET_CAP) return;
  const d = Math.hypot(tx - x, ty - y) || 1;
  ebullets.push({ x, y, vx: (tx - x) / d * speed, vy: (ty - y) / d * speed });
}
function boomAt(x, y, col, n) {
  for (let i = 0; i < (n || 10); i++) {
    const a = Math.random() * 6.283, sp = 40 + Math.random() * 130;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, dur: 0.35 + Math.random() * 0.3, col });
  }
}
function applyBulletHit(b, target) {
  const isBoss = target === boss;
  target.hp -= b.dmg;
  if (b.wtype === 'bolas' && !isBoss) target.slowT = Math.max(target.slowT || 0, b.slowDur);
  if (b.wtype === 'bombs') {
    const scale = b.radius / 65;
    boomAt(b.x, b.y, '#ffc300', Math.round(14 * scale));
    boomAt(b.x, b.y, '#ff5500', Math.round(8 * scale));   // molten debris layer — grows with blast radius
    boomAt(b.x, b.y, '#ff2200', Math.round(5 * scale));
    for (const e2 of enemies.slice()) {
      if (e2 !== target && Math.hypot(e2.x - b.x, e2.y - b.y) < b.radius) { e2.hp -= b.splash; if (e2.hp <= 0) killEnemy(e2); }
    }
    if (boss && !isBoss && Math.hypot(boss.x - b.x, boss.y - b.y) < b.radius) boss.hp -= b.splash;
  } else {
    boomAt(b.x, b.y, '#8899bb', isBoss ? 2 : 3);
  }
  if (isBoss) { if (target.hp <= 0) bossDown(); }
  else if (target.hp <= 0) killEnemy(target);
  if (boss && boss.hp <= 0) bossDown();   // covers bomb splash killing the boss when target wasn't the boss
}
function killEnemy(e) {
  score += e.pts;
  awardXp(e.xp);
  floats.push({ x: e.x, y: e.y, txt: '+' + e.pts, color: '#dde3ff', t: 0 });
  boomAt(e.x, e.y, hue(100, 60), 12);
  sfxKill();
  if (e.type === 'tanker' || Math.random() < 0.11) {
    const roll = Math.random();
    const kind = roll < 0.5 ? 'P' : roll < 0.8 ? 'S' : 'G';
    powerups.push({ x: e.x, y: e.y, kind });
  }
  const idx = enemies.indexOf(e);
  if (idx >= 0) enemies.splice(idx, 1);
}
function hitShip(dmg) {
  if (ship.invuln > 0) return;
  if (ship.shieldCharges > 0) {
    ship.shieldCharges--;
    boomAt(ship.x, ship.y, '#4488ff', 10);
    ship.invuln = 1.0;
    sfxBoom();
    return;
  }
  const plateTier = save.equippedArmor === 'plating' ? (save.armors.plating || 0) : 0;
  ship.hp -= dmg * (1 - plateTier * 0.08);
  ship.lastHitT = 0;
  sfxBigBoom();
  boomAt(ship.x, ship.y, '#39ff14', 24);
  weapon = Math.max(1, weapon - 1);
  if (ship.hp <= 0) { ship.hp = 0; endRun(false); return; }
  ship.x = W / 2; ship.y = H - safeBot - 130;
  ship.invuln = INVULN_TIME;
}
function surgeBlast() {
  sfxSurge(); shake = 0.4;
  for (const b of ebullets) boomAt(b.x, b.y, '#ffc300', 2);
  ebullets = [];
  for (const e of enemies.slice()) {
    e.hp -= 3;
    if (e.hp <= 0) killEnemy(e);
  }
  if (boss) { boss.hp -= 4; if (boss.hp <= 0) bossDown(); }
}
function bossDown() {
  if (!boss) return;
  const wasSectorBoss = boss.sector;
  if (wasSectorBoss) {
    const pts = 4000 + sector * 1000;
    score += pts;
    awardXp(150 + sector * 25);
    floats.push({ x: boss.x, y: boss.y, txt: '+' + pts, color: '#ffc300', t: 0 });
    boomAt(boss.x, boss.y, hue(100, 60), 64);
    sfxBigBoom();
    boss = null;
    ebullets = [];
    if (sector >= MAX_SECTOR) { save.sector = sector; persistSave(); endRun(true); return; }
    sector++; stage = 1;
    save.sector = sector; persistSave();
    sfxClear();
    bannerText = 'SECTOR ' + (sector - 1) + ' CLEAR';
    stageBanner = 2.0;
    spawnQueue = [];
    pendingStage = true;   // wave director starts wave 1 of the new sector once the banner fades
    return;
  }
  const pts = 1500 + stage * 500;
  score += pts;
  awardXp(50);
  floats.push({ x: boss.x, y: boss.y, txt: '+' + pts, color: '#ffc300', t: 0 });
  boomAt(boss.x, boss.y, hue(100, 60), 40);
  sfxBigBoom();
  boss = null;
  ebullets = [];
  if (stage >= MAX_STAGE) {
    sfxClear();
    bannerText = 'STAGE ' + stage + ' CLEAR';
    stageBanner = 1.8;
    spawnQueue = [];
    pendingSectorBoss = true;   // wave director starts the sector boss once the banner fades
    return;
  }
  stage++;
  sfxClear();
  bannerText = 'STAGE ' + (stage - 1) + ' CLEAR';
  stageBanner = 1.8;
  spawnQueue = [];
  pendingStage = true;   // wave director starts wave 1 of the new stage once the banner fades
}
function endRun(won) {
  state = won ? 'victory' : 'over';
  let isNewBest = false;
  if (score > save.best) { save.best = score; isNewBest = true; }
  persistSave();
  setTimeout(() => showEndScreen(won, isNewBest), 800);
}

/* =============================== UPDATE ================================= */
function update(dt) {
  if (state !== 'play') return;
  // stars
  for (const s of stars) { s.y += s.v * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
  // spawn queue
  waveT += dt;
  while (spawnQueue.length && spawnQueue[0].t <= waveT) {
    const s = spawnQueue.shift();
    spawnEnemy(s.type, s.xf * W);
  }
  if (!boss && spawnQueue.length === 0 && enemies.length === 0 && stageBanner <= 0) {
    if (pendingSectorBoss) { pendingSectorBoss = false; spawnSectorBoss(); }
    else {
      if (pendingStage) { pendingStage = false; wave = 1; }
      else wave++;
      startWave();
    }
  }
  // player fire — only while the finger/mouse is down; dispatch by equipped weapon
  if (drag) {
    const wt = save.equippedWeapon;
    if (wt === 'beam') tickBeam(dt);
    else if (wt === 'flame') tickFlame(dt);
    else {
      fireT -= dt;
      if (fireT <= 0) {
        if (wt === 'chain') fireChain(); else if (wt === 'emp') fireEmp(); else fireWeapon();
        fireT = weaponCooldown();
      }
    }
  }
  ship.invuln = Math.max(0, ship.invuln - dt);
  ship.lastHitT += dt;
  if (save.equippedArmor === 'regen' && ship.hp > 0 && ship.hp < ship.maxHp && ship.lastHitT > 3) {
    ship.hp = Math.min(ship.maxHp, ship.hp + (1 + (save.armors.regen || 0) * 1.5) * dt);
  }
  if (save.equippedArmor === 'shield') {
    const tier = save.armors.shield || 0;
    ship.shieldRegenT -= dt;
    if (ship.shieldCharges < tier && ship.shieldRegenT <= 0) { ship.shieldCharges++; ship.shieldRegenT = Math.max(3, 10 - tier); }
  }
  // player bullets (missiles home in on the nearest live target)
  for (const b of bullets) {
    if (b.wtype === 'missiles') {
      let target = null, bestD = Infinity;
      for (const e of enemies) { const d = (e.x - b.x) * (e.x - b.x) + (e.y - b.y) * (e.y - b.y); if (d < bestD) { bestD = d; target = e; } }
      if (boss) { const d = (boss.x - b.x) * (boss.x - b.x) + (boss.y - b.y) * (boss.y - b.y); if (d < bestD) { bestD = d; target = boss; } }
      if (target) {
        const desired = Math.atan2(target.y - b.y, target.x - b.x), cur = Math.atan2(b.vy, b.vx);
        let diff = desired - cur; while (diff > Math.PI) diff -= 6.283; while (diff < -Math.PI) diff += 6.283;
        const maxTurn = b.turnRate * dt, newAng = cur + Math.max(-maxTurn, Math.min(maxTurn, diff)), spd = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(newAng) * spd; b.vy = Math.sin(newAng) * spd;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
  }
  bullets = bullets.filter(b => b.y > -30 && b.x > -30 && b.x < W + 30);
  // transient weapon visuals
  for (const lb of lightningBolts) lb.t += dt;
  lightningBolts = lightningBolts.filter(lb => lb.t < 0.25);
  for (const ep of empPulses) { ep.t += dt; ep.r = ep.maxR * Math.min(1, ep.t / 0.4); }
  empPulses = empPulses.filter(ep => ep.t < 0.5);
  // enemies
  for (const e of enemies.slice()) {
    const slowMul = e.slowT > 0 ? 0.4 : 1;
    e.t += dt * slowMul; e.fireT -= dt * slowMul;
    if (e.slowT > 0) e.slowT = Math.max(0, e.slowT - dt);
    if (e.type === 'drone') { e.y += e.vy * dt * slowMul; e.x = e.x0 + Math.sin(e.t * 2.2) * e.amp; }
    else if (e.type === 'shooter') {
      if (e.y < e.holdY) e.y += e.vy * dt * slowMul;
      if (e.fireT <= 0 && e.y >= e.holdY - 40) { eShoot(e.x, e.y + 10, ship.x, ship.y, 150 + stage * 12 + campaignDifficulty() * 8); e.fireT = Math.max(0.5, 1.7 - stage * 0.1 - campaignDifficulty() * 0.05); }
    } else if (e.type === 'spinner') {
      e.x += e.vx * dt * slowMul; e.y += Math.sin(e.t * 3) * 18 * dt * slowMul; e.ang += dt * 2.4 * slowMul;
      if (e.fireT <= 0) {
        for (let k = 0; k < 4; k++) {
          const a = e.ang + k * Math.PI / 2;
          if (ebullets.length < EBULLET_CAP) ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120 });
        }
        e.fireT = 1.5;
      }
    } else if (e.type === 'tanker') { e.y += e.vy * dt * slowMul; }
    if (e.y > H + 40 || e.x < -60 || e.x > W + 60) enemies.splice(enemies.indexOf(e), 1);
  }
  // boss
  if (boss) {
    boss.t += dt;
    if (boss.y < boss.targetY) boss.y += 60 * dt;
    else {
      boss.x += boss.dir * (34 + stage * 6 + (boss.sector ? 12 : 0)) * dt;
      if (boss.x < 70) boss.dir = 1;
      if (boss.x > W - 70) boss.dir = -1;
    }
    boss.fireT -= dt; boss.ringT -= dt;
    const frac = boss.hp / boss.maxHp;
    const arms = boss.sector ? 2 : 1;   // sector boss fires a wider aimed spread
    if (boss.fireT <= 0) {
      for (let k = -arms; k <= arms; k++) eShoot(boss.x + k * 18, boss.y + 24, ship.x + k * 40, ship.y, 170 + stage * 10 + campaignDifficulty() * 10 + (boss.sector ? 30 : 0));
      boss.fireT = (boss.sector ? 0.8 : 1) * (frac > 0.5 ? 1.3 : 0.95);
    }
    if (frac <= 0.65 && boss.ringT <= 0) {
      const nB = (boss.sector && frac < 0.15) ? 20 : frac < 0.3 ? 14 : 10;
      for (let k = 0; k < nB; k++) {
        const a = boss.t + k * Math.PI * 2 / nB;
        if (ebullets.length < EBULLET_CAP) ebullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 110, vy: Math.sin(a) * 110 + 30 });
      }
      boss.ringT = (boss.sector ? 0.85 : 1) * (frac < 0.3 ? 1.6 : 2.2);
    }
  }
  // enemy bullets
  for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  ebullets = ebullets.filter(b => b.y > -40 && b.y < H + 40 && b.x > -40 && b.x < W + 40);
  // powerups
  for (const p of powerups) p.y += 65 * dt;
  powerups = powerups.filter(p => p.y < H + 20);
  // collisions: player bullets -> enemies/boss
  for (const b of bullets.slice()) {
    let hit = false;
    for (const e of enemies.slice()) {
      const rr = e.r + 4;
      if ((b.x - e.x) * (b.x - e.x) + (b.y - e.y) * (b.y - e.y) < rr * rr) {
        applyBulletHit(b, e); hit = true;
        break;
      }
    }
    if (!hit && boss) {
      const rr = boss.r + 5;
      if ((b.x - boss.x) * (b.x - boss.x) + (b.y - boss.y) * (b.y - boss.y) < rr * rr) {
        applyBulletHit(b, boss); hit = true;
      }
    }
    if (hit) bullets.splice(bullets.indexOf(b), 1);
  }
  // collisions vs ship
  const sr = ship.r;
  for (const b of ebullets.slice()) {
    if ((b.x - ship.x) * (b.x - ship.x) + (b.y - ship.y) * (b.y - ship.y) < (sr + 4) * (sr + 4)) {
      ebullets.splice(ebullets.indexOf(b), 1);
      hitShip(incomingBulletDmg());
      if (state !== 'play') return;
    }
  }
  for (const e of enemies.slice()) {
    if ((e.x - ship.x) * (e.x - ship.x) + (e.y - ship.y) * (e.y - ship.y) < (sr + e.r) * (sr + e.r)) {
      killEnemy(e);
      hitShip(incomingRamDmg());
      if (state !== 'play') return;
    }
  }
  for (const p of powerups.slice()) {
    if ((p.x - ship.x) * (p.x - ship.x) + (p.y - ship.y) * (p.y - ship.y) < (sr + 14) * (sr + 14)) {
      powerups.splice(powerups.indexOf(p), 1);
      if (p.kind === 'P') { weapon = Math.min(4, weapon + 1); sfxPower(); floats.push({ x: p.x, y: p.y, txt: 'POWER', color: '#39ff14', t: 0 }); }
      else if (p.kind === 'S') { ship.shieldCharges++; sfxPower(); floats.push({ x: p.x, y: p.y, txt: 'SHIELD', color: '#4488ff', t: 0 }); }
      else { floats.push({ x: p.x, y: p.y, txt: 'SURGE!', color: '#ffc300', t: 0 }); surgeBlast(); }
    }
  }
  // particles/floats
  for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  particles = particles.filter(p => p.t < p.dur);
  for (const f of floats) f.t += dt;
  floats = floats.filter(f => f.t < 0.9);
  stageBanner = Math.max(0, stageBanner - dt);
  shake = Math.max(0, shake - dt * 2);
}

/* =============================== INPUT ================================== */
let drag = null;
function pt(e) { const t = e.changedTouches ? e.changedTouches[0] : e; return { x: t.clientX, y: t.clientY }; }
function onDown(e) {
  e.preventDefault(); initAudio();
  if (state !== 'play') return;
  const p = pt(e);
  drag = { fx: p.x, fy: p.y, sx: ship.x, sy: ship.y };
  fireT = 0;
}
function onMove(e) {
  e.preventDefault();
  if (!drag || state !== 'play') return;
  const p = pt(e);
  ship.x = Math.max(14, Math.min(W - 14, drag.sx + (p.x - drag.fx) * 1.2));
  ship.y = Math.max(safeTop + 55, Math.min(H - safeBot - 30, drag.sy + (p.y - drag.fy) * 1.2));
}
function onUp(e) { e.preventDefault(); drag = null; }
cv.addEventListener('touchstart', onDown, { passive: false });
cv.addEventListener('touchmove', onMove, { passive: false });
cv.addEventListener('touchend', onUp, { passive: false });
cv.addEventListener('touchcancel', onUp, { passive: false });
cv.addEventListener('mousedown', onDown);
cv.addEventListener('mousemove', e => { if (drag) onMove(e); });
cv.addEventListener('mouseup', onUp);

  let action = '';
  if (!owned) action = '<button class="btn small" id="arm-' + id + '"' + (save.xp < def.unlockCost ? ' disabled' : '') + '>UNLOCK ' + def.unlockCost + 'xp</button>';
  else if (tier < MAX_TIER) action = '<button class="btn small" id="arm-' + id + '"' + (save.xp < def.tierCost[tier] ? ' disabled' : '') + '>+TIER ' + def.tierCost[tier] + 'xp</button>';
  const eqBtn = owned ? '<button class="btn small alt" id="eqa-' + id + '">' + (equipped ? 'UNEQUIP' : 'EQUIP') + '</button>' : '';
  return '<div class="shop-row"><div class="shop-name">' + def.name + (equipped ? ' ★' : '') + '</div>' +
    '<div class="shop-sub">' + (owned ? 'tier ' + tier + '/' + MAX_TIER : 'locked') + ' — ' + def.desc + '</div>' +
    '<div class="shop-actions">' + action + eqBtn + '</div></div>';
}
function hullRowHtml() {
  const tier = save.hpTier;
  const action = tier < MAX_TIER ? '<button class="btn small" id="hp-tier"' + (save.xp < HP_TIER_COST[tier + 1] ? ' disabled' : '') + '>+TIER ' + HP_TIER_COST[tier + 1] + 'xp</button>' : '';
  return '<div class="shop-row"><div class="shop-name">HULL PLATING</div>' +
    '<div class="shop-sub">tier ' + tier + '/' + MAX_TIER + ' — max hp ' + shipMaxHp(tier) + '</div>' +
    '<div class="shop-actions">' + action + '</div></div>';
}
function showShipyard() {
  state = 'shipyard';
  const weaponIds = Object.keys(WEAPON_DEFS), armorIds = Object.keys(ARMOR_DEFS);
  overlay.innerHTML =
    '<h1 style="font-size:1.6rem">SHIPYARD</h1>' +
    '<div class="sub">XP <b style="color:var(--gold)">' + save.xp + '</b></div>' +
    '<div class="shop-header">WEAPON — pick one build</div>' + weaponIds.map(weaponRowHtml).join('') +
    '<div class="shop-header">ARMOR — pick one</div>' + armorIds.map(armorRowHtml).join('') +
    '<div class="shop-header">HULL</div>' + hullRowHtml() +
    '<button class="btn small alt" id="b-back" style="margin-top:14px">BACK</button>';
  overlay.classList.remove('hidden');
  weaponIds.forEach(id => {
    const def = WEAPON_DEFS[id];
    const btn = document.getElementById('wpn-' + id);
    if (btn) bindTap(btn, () => {
      const owned = save.weapons[id] != null;
      if (!owned) { if (save.xp < def.unlockCost) return; save.xp -= def.unlockCost; save.weapons[id] = 1; }
      else { const tier = save.weapons[id]; if (tier >= MAX_TIER || save.xp < def.tierCost[tier]) return; save.xp -= def.tierCost[tier]; save.weapons[id] = tier + 1; }
      persistSave(); showShipyard();
    });
    const eqBtn = document.getElementById('eq-' + id);
    if (eqBtn) bindTap(eqBtn, () => { save.equippedWeapon = id; persistSave(); showShipyard(); });
  });
  armorIds.forEach(id => {
    const def = ARMOR_DEFS[id];
    const btn = document.getElementById('arm-' + id);
    if (btn) bindTap(btn, () => {
      const owned = save.armors[id] != null;
      if (!owned) { if (save.xp < def.unlockCost) return; save.xp -= def.unlockCost; save.armors[id] = 1; }
      else { const tier = save.armors[id]; if (tier >= MAX_TIER || save.xp < def.tierCost[tier]) return; save.xp -= def.tierCost[tier]; save.armors[id] = tier + 1; }
      persistSave(); showShipyard();
    });
    const eqBtn = document.getElementById('eqa-' + id);
    if (eqBtn) bindTap(eqBtn, () => { save.equippedArmor = (save.equippedArmor === id ? null : id); persistSave(); showShipyard(); });
  });
  const hpBtn = document.getElementById('hp-tier');
  if (hpBtn) bindTap(hpBtn, () => {
    if (save.hpTier >= MAX_TIER || save.xp < HP_TIER_COST[save.hpTier + 1]) return;
    save.xp -= HP_TIER_COST[save.hpTier + 1]; save.hpTier++;
    persistSave(); showShipyard();
  });
  bindTap(document.getElementById('b-back'), showMenu);
}
function showEndScreen(won, isNewBest) {
  const atSectorBoss = boss && boss.sector;
  overlay.innerHTML =
    '<h2 style="color:' + (won ? 'var(--gold)' : 'var(--red)') + '">' + (won ? 'SECTOR CLEARED' : 'SHIP DOWN') + '</h2>' +
    '<div class="sub">' + (won ? 'sector ' + sector + ' + boss complete' : (atSectorBoss ? 'sector boss' : 'stage ' + stage + ' · wave ' + Math.min(wave, WAVES_PER_STAGE + 1))) + '</div>' +
    '<div class="score-big">' + score + '</div>' +
    (isNewBest && score > 0 ? '<div class="newbest">★ NEW BEST ★</div>' : '<div class="stat">BEST <b>' + save.best + '</b></div>') +
    '<div class="stat">+' + runXpEarned + ' XP banked</div>' +
    (!won ? '<div class="stat">checkpoint: sector <b>' + save.sector + '</b> (restart)</div>' : '') +
    '<div style="margin-top:16px">' +
    (!won ? '<button class="btn small" id="b-retry">RETRY · SECTOR ' + save.sector + '</button><br>' : '') +
    '<button class="btn small' + (won ? '' : ' alt') + '" id="b-menu">MENU</button></div>';
  overlay.classList.remove('hidden');
  if (!won) bindTap(document.getElementById('b-retry'), () => startGame(save.sector));
  bindTap(document.getElementById('b-menu'), showMenu);
}

/* =============================== LAYOUT ================================= */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  safeTop = parseFloat(cs.getPropertyValue('--sat')) || 0;
  safeBot = parseFloat(cs.getPropertyValue('--sab')) || 0;
  if (stars.length === 0) {
    for (let i = 0; i < 60; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, v: 26 + Math.random() * 70, s: Math.random() < 0.3 ? 2 : 1 });
  }
}
window.addEventListener('resize', resize);
resize();

/* =============================== RENDER ================================= */
function drawShip(x, y) {
  ctx.save();
  ctx.translate(x, y);
  if (ship.invuln > 0 && Math.floor(ship.invuln * 10) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.strokeStyle = '#39ff14'; ctx.fillStyle = '#39ff1433'; ctx.lineWidth = 2;
  ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(0, -16); ctx.lineTo(11, 12); ctx.lineTo(0, 6); ctx.lineTo(-11, 12);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  // thruster
  ctx.fillStyle = '#ffc300';
  ctx.globalAlpha *= 0.5 + Math.random() * 0.5;
  ctx.beginPath(); ctx.moveTo(-4, 12); ctx.lineTo(0, 20 + Math.random() * 6); ctx.lineTo(4, 12); ctx.closePath(); ctx.fill();
  if (ship.shieldCharges > 0) {
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = '#4488ff'; ctx.lineWidth = 2;
    ctx.shadowColor = '#4488ff'; ctx.shadowBlur = 10;
    for (let i = 0; i < ship.shieldCharges; i++) { ctx.beginPath(); ctx.arc(0, 0, 22 + i * 4, 0, 7); ctx.stroke(); }
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}
function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const col = hue(100, 62);
  ctx.strokeStyle = col; ctx.fillStyle = hue(100, 62, 0.2); ctx.lineWidth = 2;
  ctx.shadowColor = col; ctx.shadowBlur = 8;
  ctx.beginPath();
  if (e.type === 'drone') { ctx.arc(0, 0, e.r * 0.8, 0, 7); }
  else if (e.type === 'shooter') { ctx.moveTo(0, e.r); ctx.lineTo(e.r, -e.r * 0.7); ctx.lineTo(-e.r, -e.r * 0.7); ctx.closePath(); }
  else if (e.type === 'spinner') { ctx.rotate(e.ang); ctx.rect(-e.r * 0.75, -e.r * 0.75, e.r * 1.5, e.r * 1.5); }
  else { ctx.arc(0, 0, e.r, 0, 7); }
  ctx.fill(); ctx.stroke();
  if (e.type === 'tanker') {
    ctx.beginPath(); ctx.arc(0, 0, e.r * 0.55, 0, 7); ctx.stroke();
  }
  if (e.slowT > 0) {
    ctx.strokeStyle = WEAPON_DEFS.bolas.color; ctx.lineWidth = 1.5; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(0, 0, e.r * 1.35, 0, 7); ctx.stroke();
  }
  ctx.restore();
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#06060e'; ctx.fillRect(0, 0, W, H);
  let ox = 0, oy = 0;
  if (shake > 0) { ox = (Math.random() - 0.5) * 12 * shake; oy = (Math.random() - 0.5) * 12 * shake; }
  ctx.save(); ctx.translate(ox, oy);
  // stars
  for (const s of stars) {
    ctx.fillStyle = s.s === 2 ? '#8899bb' : '#353555';
    ctx.fillRect(s.x, s.y, s.s, s.s + 2);
  }
  if (state === 'menu' || state === 'pilots' || state === 'shipyard') { ctx.restore(); return; }
  // powerups
  for (const p of powerups) {
    const col = p.kind === 'P' ? '#39ff14' : p.kind === 'S' ? '#4488ff' : '#ffc300';
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.shadowColor = col; ctx.shadowBlur = 10;
    ctx.strokeRect(p.x - 11, p.y - 11, 22, 22);
    ctx.shadowBlur = 0;
    ctx.fillStyle = col; ctx.font = "13px 'Black Ops One'";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.kind, p.x, p.y + 1);
  }
  // bullets
  for (const b of bullets) {
    ctx.fillStyle = WEAPON_DEFS[b.wtype] ? WEAPON_DEFS[b.wtype].color : '#dde3ff';
    if (b.wtype === 'bombs') { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 7); ctx.fill(); }
    else if (b.wtype === 'missiles') { ctx.fillRect(b.x - 2, b.y - 8, 4, 13); }
    else { ctx.fillRect(b.x - 2, b.y - 7, 4, 11); }
  }
  for (const e of enemies) drawEnemy(e);
  if (boss) {
    ctx.save(); ctx.translate(boss.x, boss.y);
    const col = hue(100, 65);
    const spikes = boss.sector ? 14 : 8;
    ctx.strokeStyle = col; ctx.fillStyle = hue(100, 62, 0.18); ctx.lineWidth = boss.sector ? 4 : 3;
    ctx.shadowColor = col; ctx.shadowBlur = boss.sector ? 26 : 18;
    ctx.beginPath();
    for (let i = 0; i < spikes; i++) {
      const a = Math.PI * 2 / spikes * i + boss.t * (boss.sector ? 0.55 : 0.4);
      const rr = boss.r * (i % 2 ? 0.72 : 1);
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    if (boss.sector) {
      ctx.beginPath(); ctx.arc(0, 0, boss.r * 0.45, 0, 7);
      ctx.strokeStyle = '#ffc300'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
    // boss hp bar
    const bw = W - 80, frac = boss.hp / boss.maxHp;
    ctx.fillStyle = '#1a1a30'; ctx.fillRect(40, safeTop + 44, bw, 7);
    ctx.fillStyle = frac > 0.3 ? hue(100, 60) : '#ff2244';
    ctx.fillRect(40, safeTop + 44, bw * Math.max(0, frac), 7);
  }
  // enemy bullets
  for (const b of ebullets) {
    ctx.fillStyle = '#ff2244';
    ctx.shadowColor = '#ff2244'; ctx.shadowBlur = 7;
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
  }
  // continuous weapon visuals (beam / flamethrower) while held
  if (drag && save.equippedWeapon === 'beam') {
    const width = 10 + save.weapons.beam * 3;
    ctx.globalAlpha = 0.5 + Math.random() * 0.2;
    ctx.fillStyle = WEAPON_DEFS.beam.color;
    for (const off of beamOffsets()) ctx.fillRect(ship.x + off - width, 0, width * 2, ship.y - 10);
    ctx.globalAlpha = 1;
  }
  if (drag && save.equippedWeapon === 'flame') {
    const range = 100 + save.weapons.flame * 15, halfAngle = 0.32;
    ctx.save(); ctx.translate(ship.x, ship.y - 10);
    ctx.globalAlpha = 0.45 + Math.random() * 0.2;
    ctx.fillStyle = WEAPON_DEFS.flame.color;
    for (const off of FLAME_LOBES[weapon]) {
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, range, -Math.PI / 2 + off - halfAngle, -Math.PI / 2 + off + halfAngle);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.restore();
  }
  // chain-lightning bolts / EMP pulses
  for (const lb of lightningBolts) {
    ctx.globalAlpha = Math.max(0, 1 - lb.t / 0.25);
    ctx.strokeStyle = WEAPON_DEFS.chain.color; ctx.lineWidth = 2;
    ctx.shadowColor = WEAPON_DEFS.chain.color; ctx.shadowBlur = 10;
    ctx.beginPath();
    lb.points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke(); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
  for (const ep of empPulses) {
    ctx.globalAlpha = Math.max(0, 1 - ep.t / 0.5);
    ctx.strokeStyle = WEAPON_DEFS.emp.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ep.x, ep.y, ep.r, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  drawShip(ship.x, ship.y);
  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.dur);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  // floats
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / 0.9);
    ctx.fillStyle = f.color; ctx.font = "14px 'Black Ops One'";
    ctx.fillText(f.txt, f.x, f.y - f.t * 44);
    ctx.globalAlpha = 1;
  }
  // HUD
  ctx.textAlign = 'left';
  ctx.font = "11px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText('SECTOR ' + sector + ' · STAGE ' + stage + (boss ? (boss.sector ? ' · SECTOR BOSS' : ' · BOSS') : ' · W' + Math.min(wave, WAVES_PER_STAGE)), 56, safeTop + 14);
  const hpw = 90, hpFrac = ship.hp / ship.maxHp;
  ctx.fillStyle = '#1a1a30'; ctx.fillRect(56, safeTop + 26, hpw, 6);
  ctx.fillStyle = hpFrac > 0.3 ? '#39ff14' : '#ff2244';
  ctx.fillRect(56, safeTop + 26, hpw * Math.max(0, hpFrac), 6);
  ctx.font = "8px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText('HP ' + Math.ceil(ship.hp) + '/' + ship.maxHp, 56, safeTop + 38);
  ctx.textAlign = 'right';
  ctx.font = "20px 'Black Ops One'"; ctx.fillStyle = '#dde3ff';
  ctx.fillText(String(score), W - 12, safeTop + 24);
  ctx.font = "10px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText('SCORE', W - 12, safeTop + 12);
  // weapon pips (in-run P-powerup tier), tinted by the equipped weapon
  const pipCol = WEAPON_DEFS[save.equippedWeapon].color;
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i < weapon ? pipCol : '#1a1a30';
    ctx.fillRect(W - 12 - (3 - i) * 14, safeTop + 50, 10, 4);
  }
  // banner
  if (stageBanner > 0) {
    ctx.globalAlpha = Math.min(1, stageBanner * 2);
    ctx.textAlign = 'center';
    ctx.font = "26px 'Black Ops One'"; ctx.fillStyle = '#ffc300';
    ctx.shadowColor = '#ffc300'; ctx.shadowBlur = 18;
    ctx.fillText(bannerText, W / 2, H * 0.38);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* =============================== LOOP =================================== */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
showPilotSelect();
requestAnimationFrame(loop);
</script>
</body>
