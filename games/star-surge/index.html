:root {

* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }

#back-btn {

   Overlay chrome is style-agnostic on purpose: the graphics-style switch
   repaints the CANVAS world, not the HTML furniture, so this keeps the
   same neon-console look the menus have always had in both styles. */
.tally { width:100%; max-width:290px; margin-top:2px; }

@keyframes dockpulse {

#track-label {

.shop-header { width:100%; max-width:340px; text-align:left; color:var(--dim); font-size:0.68rem; letter-spacing:1px; margin:10px 0 4px; }

/* =========================== SAVE / PILOTS =============================== */
const SAVE_SLOTS = 3;
function loadSaves() {
  try {
    const raw = JSON.parse(localStorage.getItem('starSurge.saves') || 'null');
    if (Array.isArray(raw) && raw.length === SAVE_SLOTS) {
      // pilots saved before credits existed get a zero balance, not undefined
      // (which would turn every repair quote into NaN CR)
      for (const s of raw) if (s && typeof s.credits !== 'number') s.credits = 0;
      return raw;
    }
  } catch (e) { /* corrupt/missing save data falls through to a fresh set */ }
  return [null, null, null];
}
function writeSaves() { localStorage.setItem('starSurge.saves', JSON.stringify(saves)); }
function newCharacter(name) {
  return {
    name, xp: 0, credits: 0, sector: 1, best: 0, campaignDone: false, run: null,

    hpTier: 0,

}
let saves = loadSaves();
let activeSlot = -1;
let save = null;   // active character; alias into saves[activeSlot]

let AC = null, sfxGain = null, musicGain = null, musicTimer = null;
let muted = localStorage.getItem('starSurge-mute') === '1';
const muteBtn = document.getElementById('mute');
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = AC.createGain(); sfxGain.gain.value = muted ? 0 : 0.4; sfxGain.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = muted ? 0 : 0.18; musicGain.connect(AC.destination);
    initMusicEngine();
    musicTimer = setInterval(scheduleMusic, 25);
  } catch (e) { AC = null; }
}
function applyMute() {
  muteBtn.textContent = muted ? '🔇' : '🔊';
  localStorage.setItem('starSurge-mute', muted ? '1' : '0');
  if (sfxGain) sfxGain.gain.value = muted ? 0 : 0.4;
  if (musicGain) musicGain.gain.value = muted ? 0 : 0.18;
}
function tone(freq, dur, type, vol, when, dest) {
  if (!AC || !isFinite(freq)) return;
  const t = when || AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest || sfxGain);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, when) {
  if (!AC) return;
  const t = when || AC.currentTime;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(); s.buffer = buf;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(g); g.connect(sfxGain);
  s.start(t);
}
function sfxKill() { noise(0.036, 0.075); tone(140, 0.03, 'sawtooth', 0.06); }
function sfxBoom() { noise(0.18, 0.25); tone(140, 0.15, 'sawtooth', 0.2); }
function sfxBigBoom() { noise(0.5, 0.4); tone(70, 0.5, 'sawtooth', 0.35); shake = 0.5; }
function sfxPower() { if (!AC) return; [523, 784, 1047].forEach((f, i) => tone(f, 0.1, 'triangle', 0.2, AC.currentTime + i * 0.05)); }
function sfxSurge() { if (!AC) return; noise(0.4, 0.3); [220, 330, 440, 660].forEach((f, i) => tone(f, 0.2, 'sawtooth', 0.15, AC.currentTime + i * 0.04)); }
function sfxAlarm() { if (!AC) return; [660, 660, 660].forEach((f, i) => tone(f, 0.18, 'square', 0.2, AC.currentTime + i * 0.25)); }
function sfxClear() { if (!AC) return; [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'square', 0.16, AC.currentTime + i * 0.1)); }
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});

/* =========================== MUSIC ENGINE ================================
   webaudio-score/v1 compiler + instrument synthesis + look-ahead scheduler
   (headless-compile / host-schedule split; see zmhstudio's zmh-synth
   score-authoring skill for the format and instrument recipes).
=========================================================================== */
const PERC_IDS = new Set(['kick', 'snare', 'clap', 'hat-closed', 'hat-open', 'tom', 'crash', 'glitch-tick', 'breath-noise-wash']);
const NOTE_BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteToFreq(name) {
  const m = /^([A-Ga-g])([#b]?)(-?\d+)$/.exec(name);
  let semi = NOTE_BASE[m[1].toUpperCase()];
  if (m[2] === '#') semi += 1; else if (m[2] === 'b') semi -= 1;
  const midi = (parseInt(m[3], 10) + 1) * 12 + semi;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function compileScore(score) {
  const { bars, beatsPerBar, stepsPerBeat: defaultSpb, swing = 0, tracks } = score;
  const events = [];
  for (const tr of tracks) {
    const isDrum = PERC_IDS.has(tr.inst);
    const spb = tr.stepsPerBeat || defaultSpb;
    const stepsPerBar = beatsPerBar * spb;
    const totalSteps = stepsPerBar * bars;
    const stepDurBeats = 1 / spb;
    const flat = [];
    for (const name of tr.sequence) {
      if (name === '.') { for (let i = 0; i < stepsPerBar; i++) flat.push('.'); continue; }
      const toks = isDrum ? tr.patterns[name].replace(/\s+/g, '').split('') : tr.patterns[name].trim().split(/\s+/);
      flat.push(...toks);
    }
    if (isDrum) {
      for (let i = 0; i < totalSteps; i++) {
        const tok = flat[i];
        if (tok === '.') continue;
        let timeBeats = i * stepDurBeats;
        if (swing && (i % spb) % 2 === 1) timeBeats += swing * stepDurBeats;
        events.push({ timeBeats, durationBeats: stepDurBeats, frequencyHz: 0, velocity: tok === 'X' ? 1.0 : 0.72, instrument: tr.inst, gain: tr.gain });
      }
    } else {
      let cur = null;
      const closeCur = (endIdx) => {
        if (!cur) return;
        const durSteps = endIdx - cur.startIdx;
        if (durSteps > 0) {
          let timeBeats = cur.startIdx * stepDurBeats;
          if (swing && (cur.startIdx % spb) % 2 === 1) timeBeats += swing * stepDurBeats;
          const durationBeats = durSteps * stepDurBeats;
          for (const f of cur.freqs) events.push({ timeBeats, durationBeats, frequencyHz: f, velocity: 0.85, instrument: tr.inst, gain: tr.gain });
        }
        cur = null;
      };
      for (let i = 0; i < totalSteps; i++) {
        const tok = flat[i];
        if (tok === '.') { closeCur(i); continue; }
        if (tok === '-') continue;
        closeCur(i);
        cur = { startIdx: i, freqs: tok.split('+').map(noteToFreq) };
      }
      closeCur(totalSteps);

/* ---- selection director: pure function of game state -> track id ----
   One dedicated bgm plays for an entire stage (every wave AND that stage's
   own mini-boss) so a track gets real listening time; it only changes at a
   stage boundary. The sector boss — the one extra, harder, longer fight
   after stage MAX_STAGE's mini-boss — gets its own more-intense pool.
   Both pools round-robin continuously across sectors (not reset per
   sector), so a longer campaign keeps surfacing different tracks. */
const MENU_TRACK_ID = 'menu-signal-drift';
const STAGE_BGM_IDS = [
  'calm-quiet-vector', 'calm-low-orbit', 'calm-dead-reckoning', 'calm-static-horizon',
  'combat-s1a-ignition-line', 'combat-s1b-first-contact', 'combat-s2a-chrome-salvo', 'combat-s2b-vector-storm',
  'combat-s3a-red-shift', 'combat-s3b-fracture-field', 'combat-s4a-siege-pattern', 'combat-s4b-null-gravity',
  'combat-s5a-terminal-velocity', 'combat-s5b-last-bastion',
];
const SECTOR_BOSS_TRACK_IDS = ['boss-1-iron-sentinel', 'boss-2-hollow-warden', 'boss-3-crimson-bulwark', 'boss-4-the-unmaking', 'boss-5-apex-annihilator'];
function selectTrackId() {
  if (state !== 'play') return MENU_TRACK_ID;
  if (boss && boss.sector) return SECTOR_BOSS_TRACK_IDS[(sector - 1) % SECTOR_BOSS_TRACK_IDS.length];
  const campaignStageIdx = (sector - 1) * MAX_STAGE + (stage - 1);
  return STAGE_BGM_IDS[campaignStageIdx % STAGE_BGM_IDS.length];
}

/* ---- look-ahead scheduler: two crossfading gain "slots", each with its
   own loop anchor + event cursor (drops, never replays, stale events) ---- */
const trackLabel = document.getElementById('track-label');
const musicSlots = [
  { gain: null, id: null, track: null, compiled: null, loopStart: 0, loopIndex: 0, nextEventIdx: 0, fadeUntil: 0 },
  { gain: null, id: null, track: null, compiled: null, loopStart: 0, loopIndex: 0, nextEventIdx: 0, fadeUntil: 0 },
];

  const c = slot.compiled;
  const horizon = AC.currentTime + 0.35;
  let guard = 0;
  while (guard++ < 200) {
    if (slot.nextEventIdx >= c.events.length) { slot.nextEventIdx = 0; slot.loopIndex++; }
    const ev = c.events[slot.nextEventIdx];
    const t = slot.loopStart + slot.loopIndex * c.loopSeconds + ev.timeBeats * c.secondsPerBeat;
    if (t > horizon) break;
    if (t >= AC.currentTime - 0.1) playNote(ev, t, slot.gain, c.secondsPerBeat);
    slot.nextEventIdx++;

  if (!AC || !noiseBuf) return;
  const wantId = selectTrackId();
  if (musicSlots[curMusicSlot].id !== wantId) {
    const other = 1 - curMusicSlot;
    if (musicSlots[other].id !== wantId) {
      const track = MUSIC_BY_ID[wantId];
      const slot = musicSlots[other];
      slot.id = wantId; slot.track = track; slot.compiled = getCompiled(track);
      slot.loopStart = AC.currentTime + 0.05; slot.loopIndex = 0; slot.nextEventIdx = 0; slot.fadeUntil = 0;
      slot.gain.gain.cancelScheduledValues(AC.currentTime);
      slot.gain.gain.setValueAtTime(slot.gain.gain.value, AC.currentTime);
      slot.gain.gain.linearRampToValueAtTime(1, AC.currentTime + 1.0);
      trackLabel.textContent = '♪ ' + String(MUSIC_TRACKS.indexOf(track) + 1).padStart(2, '0') + ' · ' + track.name;
    }
    const old = musicSlots[curMusicSlot];
    old.gain.gain.cancelScheduledValues(AC.currentTime);
    old.gain.gain.setValueAtTime(old.gain.gain.value, AC.currentTime);
    old.gain.gain.linearRampToValueAtTime(0, AC.currentTime + 1.0);
    old.fadeUntil = AC.currentTime + 1.0;
    curMusicSlot = other;
  }
  for (const slot of musicSlots) {
    if (!slot.id) continue;
    if (slot.fadeUntil && AC.currentTime > slot.fadeUntil) { slot.id = null; continue; }
    scheduleSlot(slot);
  }
}

/* =============================== HELPERS ================================ */
function bindTap(el, fn) {
  let last = 0;
  const h = e => {
    e.preventDefault();
    const now = Date.now();
    if (now - last < 400) return;
    last = now;
    initAudio();
    fn();
  };
  el.addEventListener('touchend', h, { passive: false });
  el.addEventListener('click', h);
}
bindTap(muteBtn, () => { muted = !muted; applyMute(); });
applyMute();

/* The combat report is dismissed by tapping anywhere on it. Bound ONCE here
   rather than inside the report builder: #overlay is a persistent element, so
   re-binding per sector would stack a handler per clear. The state check is
   what scopes it, and it doubles as the debounce -- beginLaunch() moves the
   state on, so the trailing click after a touchend is a no-op. */
let overlayTouchY = null;
overlay.addEventListener('touchstart', e => {
  overlayTouchY = e.changedTouches[0].clientY;
}, { passive: true });
overlay.addEventListener('touchend', e => {
  if (state !== 'report') return;
  const y = e.changedTouches[0].clientY;
  if (overlayTouchY !== null && Math.abs(y - overlayTouchY) > 14) return;   // a scroll, not a tap
  e.preventDefault(); initAudio(); beginLaunch();
}, { passive: false });
overlay.addEventListener('click', () => { if (state === 'report') { initAudio(); beginLaunch(); } });

function hue(sat, l, a) { return 'hsla(' + STAGE_HUES[stage - 1] + ',' + sat + '%,' + l + '%,' + (a === undefined ? 1 : a) + ')'; }
function campaignDifficulty() { return (sector - 1) + (stage - 1) / MAX_STAGE; }   // 0 at sector1 stage1, ~+1 per sector cleared

/* =============================== WAVES ================================== */
function buildWave(st, wv) {
  // deterministic spawn scripts; counts scale with stage, then with campaign difficulty across sectors
  const q = [];
  const n = 4 + st + Math.floor(campaignDifficulty() * 0.8);   // base count
  if (wv === 1) {
    for (let i = 0; i < n + 2; i++) q.push({ t: i * 0.55, type: 'drone', xf: 0.15 + 0.7 * ((i * 37) % 100) / 100 });
    for (let i = 0; i < Math.floor(st / 2); i++) q.push({ t: 2 + i * 1.2, type: 'shooter', xf: 0.3 + 0.4 * i });
  } else if (wv === 2) {
    for (let i = 0; i < Math.ceil(n / 2); i++) q.push({ t: i * 1.1, type: 'shooter', xf: 0.2 + 0.6 * ((i * 53) % 100) / 100 });
    for (let i = 0; i < n; i++) q.push({ t: 0.5 + i * 0.6, type: 'drone', xf: 0.1 + 0.8 * ((i * 71) % 100) / 100 });
  } else {
    for (let i = 0; i < Math.ceil(n / 2); i++) q.push({ t: i * 1.3, type: 'spinner', xf: i % 2 ? 0.05 : 0.95 });
    q.push({ t: 1.5, type: 'tanker', xf: 0.5 });
    if (st >= 3) q.push({ t: 3.5, type: 'tanker', xf: 0.25 });
    for (let i = 0; i < st; i++) q.push({ t: 2 + i * 0.8, type: 'drone', xf: 0.2 + 0.6 * ((i * 29) % 100) / 100 });
  }
  return q.sort((a, b) => a.t - b.t);
}
function enemyHp(type) {
  return Math.max(1, Math.round(ENEMY_DEFS[type].hp * (1 + campaignDifficulty() * 0.35)));
}
function spawnEnemy(type, x, y) {
  const d = ENEMY_DEFS[type];
  const e = { type, x, y: y === undefined ? -24 : y, hp: enemyHp(type), r: d.r, pts: d.pts, xp: d.xp, t: 0, fireT: 1 + Math.random(), slowT: 0 };
  if (type === 'drone') { e.vy = 95 + Math.random() * 30; e.amp = 30 + Math.random() * 30; e.x0 = x; }

/* =============================== COMBAT ================================= */

function tickBeam(dt) {

const FLAME_LOBES = { 1: [0], 2: [-0.22, 0.22], 3: [-0.4, 0, 0.4], 4: [-0.55, -0.18, 0.18, 0.55] };

/* =============================== UPDATE ================================= */

      boss.fireT = (boss.sector ? 0.8 : 1) * (frac > 0.5 ? 1.3 : 0.95);
    }
    if (frac <= 0.65 && boss.ringT <= 0) {
      const nB = (boss.sector && frac < 0.15) ? 20 : frac < 0.3 ? 14 : 10;
      for (let k = 0; k < nB; k++) {
        const a = boss.t + k * Math.PI * 2 / nB;
        if (ebullets.length < EBULLET_CAP) ebullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 110, vy: Math.sin(a) * 110 + 30 });
      }
      boss.ringT = (boss.sector ? 0.85 : 1) * (frac < 0.3 ? 1.6 : 2.2);
    }
  }
  // enemy bullets
  for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  ebullets = ebullets.filter(b => b.y > -40 && b.y < H + 40 && b.x > -40 && b.x < W + 40);
  // powerups
  for (const p of powerups) p.y += 65 * dt;
  powerups = powerups.filter(p => p.y < H + 20);
  // collisions: player bullets -> enemies/boss
  for (const b of bullets.slice()) {
    let hit = false;
    for (const e of enemies.slice()) {
      const rr = e.r + 4;
      if ((b.x - e.x) * (b.x - e.x) + (b.y - e.y) * (b.y - e.y) < rr * rr) {
        applyBulletHit(b, e); hit = true;
        break;
      }
    }
    if (!hit && boss) {
      const rr = boss.r + 5;
      if ((b.x - boss.x) * (b.x - boss.x) + (b.y - boss.y) * (b.y - boss.y) < rr * rr) {
        applyBulletHit(b, boss); hit = true;
      }
    }
    if (hit) bullets.splice(bullets.indexOf(b), 1);
  }
  // collisions vs ship
  const sr = ship.r;
  for (const b of ebullets.slice()) {
    if ((b.x - ship.x) * (b.x - ship.x) + (b.y - ship.y) * (b.y - ship.y) < (sr + 4) * (sr + 4)) {
      ebullets.splice(ebullets.indexOf(b), 1);
      hitShip(incomingBulletDmg());
      if (state !== 'play') return;
    }
  }
  for (const e of enemies.slice()) {
    if ((e.x - ship.x) * (e.x - ship.x) + (e.y - ship.y) * (e.y - ship.y) < (sr + e.r) * (sr + e.r)) {
      killEnemy(e);
      hitShip(incomingRamDmg());
      if (state !== 'play') return;
    }
  }
  for (const p of powerups.slice()) {
    if ((p.x - ship.x) * (p.x - ship.x) + (p.y - ship.y) * (p.y - ship.y) < (sr + 14) * (sr + 14)) {
      powerups.splice(powerups.indexOf(p), 1);
      if (p.kind === 'P') { weapon = Math.min(4, weapon + 1); sfxPower(); floats.push({ x: p.x, y: p.y, txt: 'POWER', color: '#39ff14', t: 0 }); }
      else if (p.kind === 'S') { ship.shieldCharges++; sfxPower(); floats.push({ x: p.x, y: p.y, txt: 'SHIELD', color: '#4488ff', t: 0 }); }
      else { floats.push({ x: p.x, y: p.y, txt: 'SURGE!', color: '#ffc300', t: 0 }); surgeBlast(); }
    }
  }
  // particles/floats
  tickFx(dt);
  stageBanner = Math.max(0, stageBanner - dt);
}

/* =============================== INPUT ================================== */
let drag = null;
function pt(e) { const t = e.changedTouches ? e.changedTouches[0] : e; return { x: t.clientX, y: t.clientY }; }
function onDown(e) {
  e.preventDefault(); initAudio(); closeSettings();
  if (state === 'station') { const sp = pt(e); stationTap(sp.x, sp.y); return; }
  if (state !== 'play') return;
  const p = pt(e);
  drag = { fx: p.x, fy: p.y, sx: ship.x, sy: ship.y };
  fireT = 0;
}
function onMove(e) {
  e.preventDefault();
  if (!drag || state !== 'play') return;
  const p = pt(e);
  ship.x = Math.max(14, Math.min(W - 14, drag.sx + (p.x - drag.fx) * 1.2));
  ship.y = Math.max(safeTop + 55, Math.min(H - safeBot - 30, drag.sy + (p.y - drag.fy) * 1.2));
}
function onUp(e) { e.preventDefault(); drag = null; }
cv.addEventListener('touchstart', onDown, { passive: false });
cv.addEventListener('touchmove', onMove, { passive: false });
cv.addEventListener('touchend', onUp, { passive: false });
cv.addEventListener('touchcancel', onUp, { passive: false });
cv.addEventListener('mousedown', onDown);
cv.addEventListener('mousemove', e => { if (drag) onMove(e); });
cv.addEventListener('mouseup', onUp);

/* Picking a pilot goes straight to its station -- there is no menu screen.
   The station is the hub: UPGRADES, COMBAT and REST all leave from it and
   all come back to it, so the shipyard is in front of a new player before
   their first fight instead of behind a "NEW RUN" button. */
function enterPilot(i) {
  if (!saves[i]) { saves[i] = newCharacter('PILOT ' + (i + 1)); writeSaves(); }
  activeSlot = i; save = saves[i];
  restoreRun();
  enterStation(true);
}
// REST is a real save point, so a run survives being put down: score, hull,
// pip, shields and the banked totals all come back exactly as they were.
// `run` is null only when the last one ENDED (a death), which is what makes
// the next pick start fresh at the checkpoint sector.
function restoreRun() {
  const r = save.run, maxHp = shipMaxHp(save.hpTier);
  sector = Math.max(1, Math.min(MAX_SECTOR, save.sector || 1));
  campaignDone = !!save.campaignDone;
  stage = 1; wave = 1;
  bullets = []; ebullets = []; enemies = []; powerups = []; particles = []; floats = [];
  lightningBolts = []; empPulses = []; spawnQueue = [];
  boss = null; pendingStage = false; pendingSectorBoss = false;
  sec = newSectorStats();
  score = r ? (r.score || 0) : 0;
  runXpEarned = r ? (r.xp || 0) : 0;
  runCredits = r ? (r.cr || 0) : 0;
  weapon = r ? Math.max(1, Math.min(4, r.weapon || 1)) : 1;
  const hp = r ? Math.max(1, Math.min(r.hp || maxHp, maxHp)) : maxHp;
  ship = { x: W / 2, y: H - safeBot - 130, r: 13, invuln: 0, hp, maxHp,
           shieldCharges: r ? (r.shields || 0) : 0, shieldRegenT: 0, lastHitT: 999 };
  fireT = 0; drag = null;
}
function snapshotRun() {
  if (activeSlot < 0) return;
  save.run = { score, xp: runXpEarned, cr: runCredits, weapon,
               hp: ship.hp, shields: ship.shieldCharges };
  persistSave();
}

function hullRowHtml() {

function showEndScreen(isNewBest) {

    '<div class="score-big">' + score.toLocaleString() + '</div>' +
    (isNewBest && score > 0 ? '<div class="newbest">★ NEW BEST ★</div>' : '<div class="stat">BEST <b>' + save.best.toLocaleString() + '</b></div>') +
    '<div class="stat">+' + runXpEarned + ' XP &middot; +' + runCredits + ' CR banked</div>' +

    '<div style="margin-top:16px">' +

/* ================= SECTOR REPORT | LAUNCH | ALLIED STATION ==============
   The loop between sectors: report -> tap -> ship flies off -> crossfade ->
   station. The station is the only place the player is ever idle AND safe,
   which is what makes it the right place to put the shipyard in front of a
   new player -- the UPGRADES button is wired to a garage they can see.

   Everything here is painted, never simulated: no rule below reads `gfx`
   to decide an outcome, only to decide a treatment. */

function repairQuote() {
  const missing = Math.max(0, Math.ceil(ship.maxHp - ship.hp));
  if (missing <= 0) return { hp: 0, cost: 0, full: true };
  // Buys as much hull as the balance covers, so a thin wallet still gets a
  // patch rather than an unaffordable all-or-nothing price.
  const hp = Math.min(missing, Math.floor(save.credits / CREDITS_PER_HP));
  return { hp, cost: hp * CREDITS_PER_HP, full: false, missing };
}

/* Grade weights the three things a pilot actually controls. Builds that fire
   no projectiles (beam/flame/chain/emp) drop the accuracy term and the rest
   is re-normalised, so they are graded on what they can be graded on rather
   than capped at B forever. */
function gradeFor(s) {
  const terms = [{ w: 45, v: s.hits === 0 ? 1 : Math.max(0, 1 - s.hits / 8) }];
  if (s.shotsFired > 0) terms.push({ w: 35, v: Math.min(1, (s.shotsHit / s.shotsFired) / 0.7) });
  terms.push({ w: 20, v: Math.min(1, s.bestStreak / 40) });
  let sw = 0, sv = 0;
  for (const t of terms) { sw += t.w; sv += t.w * t.v; }
  const p = sw ? sv / sw * 100 : 0;
  return p >= 85 ? 'S' : p >= 70 ? 'A' : p >= 55 ? 'B' : p >= 38 ? 'C' : 'D';
}

function beginSectorReport(cleared) {
  clearedSector = cleared;
  campaignDone = cleared >= MAX_SECTOR;
  if (campaignDone) save.campaignDone = true;
  state = 'report';
  stageBanner = 0; veil = 0;
  bullets = []; ebullets = []; enemies = []; powerups = []; spawnQueue = [];
  lightningBolts = []; empPulses = [];
  pendingStage = false; pendingSectorBoss = false;
  drag = null;
  let isNewBest = false;
  if (score > save.best) { save.best = score; isNewBest = true; }
  persistSave();
  sfxClear();
  // let the boss explosion finish before the report covers it
  setTimeout(() => { if (state === 'report') showSectorReport(isNewBest); }, 750);
}

function showSectorReport(isNewBest) {
  const acc = sec.shotsFired > 0 ? Math.round(sec.shotsHit / sec.shotsFired * 100) : null;
  const g = gradeFor(sec);
  const mm = Math.floor(sec.t / 60), ss = Math.floor(sec.t % 60);
  const row = (k, v) => '<div class="tally-row"><span>' + k + '</span><b>' + v + '</b></div>';
  overlay.innerHTML =
    '<h2>' + (campaignDone ? 'CAMPAIGN COMPLETE' : 'SECTOR ' + clearedSector + ' CLEARED') + '</h2>' +
    '<div class="sub">-- COMBAT REPORT --</div>' +
    '<div class="grade" style="color:' + GRADE_COL[g] + '">' + g + '</div>' +
    '<div class="grade-cap">SECTOR RATING</div>' +
    '<div class="tally">' +
      row('KILLS', sec.kills) +
      (acc !== null ? row('ACCURACY', acc + '%')
                    : row('WEAPON', WEAPON_DEFS[save.equippedWeapon].name)) +
      row('TIMES HIT', sec.hits) +
      (sec.shields ? row('SHIELDS BURNED', sec.shields) : '') +
      row('BEST STREAK', sec.bestStreak + ' kills') +
      row('SECTOR TIME', mm + ':' + String(ss).padStart(2, '0')) +
      '<div class="tally-sep"></div>' +
      row('XP EARNED', '+' + sec.xp) +
      row('SALVAGE', '+' + sec.credits + ' CR') +
      row('SECTOR SCORE', sec.score.toLocaleString()) +
    '</div>' +
    '<div class="stat" style="margin-top:12px">TOTAL SCORE</div>' +
    '<div class="score-big">' + score.toLocaleString() + '</div>' +
    (isNewBest && score > 0 ? '<div class="newbest">★ NEW BEST ★</div>' : '') +
    '<div class="dock-hint">TAP TO DOCK AT NEAREST ALLIED STATION</div>';
  overlay.classList.remove('hidden');
}

function beginLaunch() {
  overlay.classList.add('hidden');
  state = 'launch';
  launchT = 0; launchV = 260; veil = 0;
  ship.invuln = 0;
  sfxSurge();
}
// `fade` is the ARRIVAL only. Coming back from the shipyard must not replay
// the crossfade -- that black half-second also swallows taps (see the veil
// guard in stationTap), so a returning player would find a dead screen.
function enterStation(fade) {
  state = 'station';
  if (fade) { stationT = 0; veil = 1; }
  overlay.classList.add('hidden');
  snapshotRun();   // the station is the only idle-and-safe point, so it is where a run banks
}

/* Resumes the RUN into the next sector -- deliberately not startGame(), which
   would zero the score and the hull. Score, XP, salvage, the weapon pip and
   any shields all carry through the station; only the sector counters reset. */
function resumeIntoSector() {
  stage = 1; wave = 1;
  bullets = []; ebullets = []; enemies = []; powerups = []; particles = []; floats = [];
  lightningBolts = []; empPulses = []; spawnQueue = [];
  boss = null; pendingStage = false; pendingSectorBoss = false;
  const nm = shipMaxHp(save.hpTier);
  if (nm > ship.maxHp) ship.hp += nm - ship.maxHp;   // plating bought here is hull you get now
  ship.maxHp = nm;
  ship.hp = Math.max(1, Math.min(ship.hp, nm));
  ship.x = W / 2; ship.y = H - safeBot - 130; ship.invuln = 1; ship.lastHitT = 999;
  fireT = 0; drag = null; veil = 0;
  sec = newSectorStats();
  state = 'play';
  overlay.classList.add('hidden');
  startWave();
}

function stationTap(x, y) {
  if (veil > 0.35) return;   // ignore taps landing during the crossfade
  for (const b of stationLayout().B) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      if (b.id === 'upgrades') showShipyard();
      else if (b.id === 'combat') resumeIntoSector();
      else if (b.id === 'rest') { snapshotRun(); showPilotSelect(); }
      else if (b.id === 'repair') {
        const q = repairQuote();
        if (q.hp <= 0) return;
        ship.hp = Math.min(ship.maxHp, ship.hp + q.hp);
        save.credits -= q.cost;
        snapshotRun(); sfxPower();
        const d = stationLayout().f.drydock;
        floats.push({ x: d.x, y: d.y - d.r, txt: '+' + q.hp + ' HP', color: '#39ff14', t: 0 });
      }
      return;
    }
  }
}

/* ---- station geometry -------------------------------------------------
   Every feature and every button is derived from W/H here, so the callout
   lines can never drift from the art they point at, in any viewport. */
function stationLayout() {
  // R is the hub radius and every module is a multiple of it. The widest
  // thing on screen is the solar array at cx +/- R*1.78, so R must stay under
  // W*0.21 or the hangar and drydock get clipped off the edges.
  const cx = W / 2, cy = H * 0.42, R = Math.min(W * 0.20, H * 0.105);
  const bob = Math.sin(stationT * 0.55) * 3;
  const y0 = cy + bob;
  const f = {
    hub:     { x: cx,             y: y0,            r: R },
    hangar:  { x: cx - R * 1.55,  y: y0 + R * 0.10, r: R * 0.50 },
    drydock: { x: cx + R * 1.45,  y: y0 + R * 0.34, r: R * 0.50 },
    barrack: { x: cx - R * 0.60,  y: y0 + R * 1.40, r: R * 0.40 },
    enemy:   { x: W * 0.78,       y: H * 0.135,     r: Math.min(W, H) * 0.075 },
  };
  const pad = 12, gap = 9, bh = 54;
  const bw = (W - pad * 2 - gap) / 2;
  const y2 = H - safeBot - 14 - bh, y1 = y2 - bh - gap;
  // Left-column buttons point at left-hand features and right at right-hand
  // ones, on two parallel lanes per side. That pairing is the whole reason no
  // callout ever crosses the station or another callout.
  const B = [
    { id: 'upgrades', label: 'UPGRADES', x: pad,            y: y1, w: bw, h: bh, at: f.hangar,  lane: 0, side: -1, col: '#4488ff' },
    { id: 'combat',   label: 'COMBAT',   x: pad + bw + gap, y: y1, w: bw, h: bh, at: f.enemy,   lane: 0, side:  1, col: '#ff2244' },
    { id: 'rest',     label: 'REST',     x: pad,            y: y2, w: bw, h: bh, at: f.barrack, lane: 1, side: -1, col: '#39ff14' },
    { id: 'repair',   label: 'REPAIR',   x: pad + bw + gap, y: y2, w: bw, h: bh, at: f.drydock, lane: 1, side:  1, col: '#ffc300' },
  ];
  const q = repairQuote();
  for (const b of B) {
    if (b.id === 'upgrades') b.sub = save.xp + ' XP';
    else if (b.id === 'combat') b.sub = 'SECTOR ' + sector + (campaignDone ? ' AGAIN' : '');
    else if (b.id === 'rest') b.sub = 'SAVE & SWITCH PILOT';
    else {
      b.sub = q.full ? 'HULL INTACT' : q.hp > 0 ? '+' + q.hp + ' HP · ' + q.cost + ' CR' : 'NEED ' + CREDITS_PER_HP + ' CR';
      b.off = q.hp <= 0;
    }
  }
  return { f, B, R };
}

/* ---- style primitives -------------------------------------------------
   One geometry, two treatments: toon lays a flat plate with an ink outline,
   neon strokes the same outline as a glowing wireframe over a dark fill.
   Keeping the silhouette single-source is why the station cannot drift
   between the two styles as it grows. */
const STN = '#8f9bb4', STN_LIT = '#dbe6f6', STN_DK = '#59637a', STN_NEON = '#4488ff';
function sPanel(pts, base, lit, neon, lw) {
  if (gfx === 'toon') { celPoly(pts, base, lit, lw || 2.2); return; }
  poly(pts); ctx.fillStyle = '#0a0a18e6'; ctx.fill();
  ctx.strokeStyle = neon; ctx.lineWidth = 1.8; glow(neon, 9); ctx.stroke(); noGlow();
}
function sDisc(x, y, r, base, lit, neon, lw) {
  if (gfx === 'toon') { celCircle(x, y, r, base, lit, lw || 2.2); return; }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#0a0a18e6'; ctx.fill();
  ctx.strokeStyle = neon; ctx.lineWidth = 1.8; glow(neon, 9); ctx.stroke(); noGlow();
}
function sRing(x, y, r, neon, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  ctx.strokeStyle = gfx === 'toon' ? INK : neon;
  ctx.lineWidth = lw || 2;
  if (gfx !== 'toon') glow(neon, 10);
  ctx.stroke(); noGlow();
}
function sStrut(x1, y1, x2, y2, w) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L * w, ny = dx / L * w;
  sPanel([x1 + nx, y1 + ny, x2 + nx, y2 + ny, x2 - nx, y2 - ny, x1 - nx, y1 - ny], STN_DK, STN, STN_NEON, 2);
}
function sWindow(x, y, w, h, col) {
  const c = col || '#ffb84d';
  ctx.beginPath(); ctx.rect(x, y, w, h);
  ctx.fillStyle = c;
  if (gfx !== 'toon') glow(c, 8);
  ctx.fill(); noGlow();
  if (gfx === 'toon') { ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.stroke(); }
}
function rrPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function octaPts(cx, cy, r) {
  const p = [];
  for (let i = 0; i < 8; i++) { const a = i / 8 * 6.2832 + 0.3927; p.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
  return p;
}

function drawHostileSector(a) {
  const pulse = 0.72 + Math.sin(stationT * 1.7) * 0.28;
  if (gfx === 'toon') {
    celCircle(a.x, a.y, a.r, '#5e1526', '#9d2440', 2);
    celCircle(a.x - a.r * 0.20, a.y - a.r * 0.14, a.r * 0.56, '#a32540', '#ff4a68', 1.8);
    celCircle(a.x + a.r * 0.24, a.y + a.r * 0.22, a.r * 0.28, '#ff4a68', '#ffd2da', 1.4);
  } else {
    for (let i = 3; i >= 1; i--) sRing(a.x, a.y, a.r * (i / 3) * pulse, '#ff2244', 2);
  }
  // hostiles wheeling in the distance -- the sector is alive and waiting
  for (let i = 0; i < 5; i++) {
    const t = stationT * 0.3 + i * 1.7;
    const px = a.x + Math.cos(t) * a.r * 1.2, py = a.y + Math.sin(t * 1.3) * a.r * 0.6;
    ctx.fillStyle = gfx === 'toon' ? '#ff5a74' : '#ff2244';
    if (gfx !== 'toon') glow('#ff2244', 6);
    ctx.beginPath(); ctx.moveTo(px, py - 2.8); ctx.lineTo(px + 2.8, py + 2.3); ctx.lineTo(px - 2.8, py + 2.3);
    ctx.closePath(); ctx.fill(); noGlow();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = "9px 'Share Tech Mono'"; ctx.fillStyle = '#ff6680';
  ctx.fillText('HOSTILE SECTOR ' + sector, a.x, a.y + a.r + 14);
}

function drawStation(L) {
  const f = L.f, R = L.R, cx = f.hub.x, cy = f.hub.y;
  // solar wings, three segments each so the panelling reads in both styles
  for (const s of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const a0 = 0.62 + i * 0.30, a1 = a0 + 0.28;
      sPanel([cx + s * R * (0.30 + a0 * 0.55), cy - R * (0.50 + a0 * 0.72),
              cx + s * R * (0.30 + a1 * 0.55), cy - R * (0.50 + a1 * 0.72),
              cx + s * R * (0.95 + a1 * 0.55), cy - R * (0.34 + a1 * 0.72),
              cx + s * R * (0.95 + a0 * 0.55), cy - R * (0.34 + a0 * 0.72)],
             '#2b3a63', '#4d67ad', '#b44fff', 1.8);
    }
    sStrut(cx + s * R * 0.22, cy - R * 0.38, cx + s * R * 0.62, cy - R * 0.92, R * 0.045);
  }
  // struts out to the three modules
  sStrut(cx, cy, f.hangar.x, f.hangar.y, R * 0.09);
  sStrut(cx, cy, f.drydock.x, f.drydock.y, R * 0.09);
  sStrut(cx, cy, f.barrack.x, f.barrack.y, R * 0.075);

  // ---- HANGAR (the garage the UPGRADES callout points at)
  const hg = f.hangar, hr = hg.r;
  sPanel([hg.x - hr, hg.y - hr * 0.85, hg.x + hr * 0.75, hg.y - hr * 1.0,
          hg.x + hr * 0.75, hg.y + hr * 1.0, hg.x - hr, hg.y + hr * 0.85], STN, STN_LIT, STN_NEON, 2.2);
  // open bay mouth with a lit interior and a ship being worked on
  ctx.beginPath(); ctx.rect(hg.x - hr * 0.86, hg.y - hr * 0.52, hr * 1.32, hr * 1.04);
  ctx.fillStyle = gfx === 'toon' ? '#20160c' : '#160e06'; ctx.fill();
  if (gfx === 'toon') { ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke(); }
  else { ctx.strokeStyle = '#ffc300'; ctx.lineWidth = 1.4; glow('#ffc300', 8); ctx.stroke(); noGlow(); }
  ctx.save();
  ctx.beginPath(); ctx.rect(hg.x - hr * 0.86, hg.y - hr * 0.52, hr * 1.32, hr * 1.04); ctx.clip();
  sWindow(hg.x - hr * 0.80, hg.y + hr * 0.18, hr * 1.2, hr * 0.32, '#ffb84d');
  // a hull in for work, plus the sparks of somebody working on it
  sPanel([hg.x - hr * 0.42, hg.y + hr * 0.12, hg.x, hg.y - hr * 0.34,
          hg.x + hr * 0.42, hg.y + hr * 0.12, hg.x, hg.y + hr * 0.02], '#6f7c94', '#aebbd2', '#39ff14', 1.6);
  for (let i = 0; i < 3; i++) {
    const sx = hg.x + Math.sin(stationT * 6 + i * 2.1) * hr * 0.3;
    ctx.fillStyle = '#fff3b0';
    ctx.fillRect(sx, hg.y - hr * 0.12 + Math.cos(stationT * 7 + i) * 2, 1.6, 1.6);
  }
  ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = "8px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText('GARAGE', hg.x, hg.y + hr * 1.28);

  // ---- DRYDOCK (the REPAIR callout) -- an open cradle holding your ship
  const dd = f.drydock, dr = dd.r;
  for (const s of [-1, 1]) {
    sPanel([dd.x - dr * 1.05, dd.y + s * dr * 0.78, dd.x + dr * 1.05, dd.y + s * dr * 0.78,
            dd.x + dr * 1.05, dd.y + s * dr * 1.10, dd.x - dr * 1.05, dd.y + s * dr * 1.10],
           STN_DK, STN, STN_NEON, 1.8);
  }
  sPanel([dd.x + dr * 0.86, dd.y - dr * 1.10, dd.x + dr * 1.18, dd.y - dr * 1.10,
          dd.x + dr * 1.18, dd.y + dr * 1.10, dd.x + dr * 0.86, dd.y + dr * 1.10], STN, STN_LIT, STN_NEON, 1.8);
  // repair arms reaching in
  for (const s of [-1, 1]) {
    sStrut(dd.x + dr * 0.92, dd.y + s * dr * 0.72, dd.x + dr * 0.30, dd.y + s * dr * 0.85, dr * 0.09);
    ctx.beginPath(); ctx.arc(dd.x + dr * 0.30, dd.y + s * dr * 0.85, dr * 0.12, 0, 7);
    ctx.fillStyle = '#ffc300'; if (gfx !== 'toon') glow('#ffc300', 7);
    ctx.fill(); noGlow();
    if (gfx === 'toon') { ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.stroke(); }
  }
  ctx.textAlign = 'center';
  ctx.font = "8px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText('DRYDOCK', dd.x, dd.y + dr * 1.78);   // clear of the parked ship's lower wing

  // ---- BARRACKS (the REST callout) -- a warm window with a bed in it
  const bk = f.barrack, br = bk.r;
  sDisc(bk.x, bk.y, br, STN, STN_LIT, STN_NEON, 2.2);
  sRing(bk.x, bk.y, br * 0.98, STN_NEON, 1.4);
  const wr = br * 0.56;
  ctx.beginPath(); ctx.arc(bk.x, bk.y, wr, 0, 7);
  ctx.fillStyle = '#ffb84d';
  if (gfx !== 'toon') { glow('#ffc300', 12); ctx.fill(); noGlow(); ctx.strokeStyle = '#ffc300'; ctx.lineWidth = 1.4; ctx.stroke(); }
  else { ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.stroke(); }
  ctx.save();
  ctx.beginPath(); ctx.arc(bk.x, bk.y, wr, 0, 7); ctx.clip();
  // the cozy bed: mattress, blanket, pillow
  ctx.fillStyle = gfx === 'toon' ? '#5a4326' : '#6b4a1e';
  ctx.fillRect(bk.x - wr * 0.72, bk.y + wr * 0.10, wr * 1.44, wr * 0.46);
  ctx.fillStyle = '#c8543f';
  ctx.fillRect(bk.x - wr * 0.30, bk.y + wr * 0.10, wr * 1.02, wr * 0.30);
  ctx.fillStyle = '#f4ecd8';
  ctx.fillRect(bk.x - wr * 0.68, bk.y + wr * 0.04, wr * 0.36, wr * 0.22);
  if (gfx === 'toon') {
    ctx.strokeStyle = INK; ctx.lineWidth = 1.1;
    ctx.strokeRect(bk.x - wr * 0.72, bk.y + wr * 0.10, wr * 1.44, wr * 0.46);
  }
  // a slow "asleep" wisp
  ctx.globalAlpha = 0.5 + Math.sin(stationT * 1.3) * 0.3;
  ctx.fillStyle = '#f4ecd8';
  ctx.fillRect(bk.x + wr * 0.30, bk.y - wr * 0.42 - (stationT * 6 % (wr * 0.6)), 2, 2);
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.font = "8px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText('BARRACKS', bk.x, bk.y + br * 1.5);

  // ---- HUB
  sPanel(octaPts(cx, cy, R), STN, STN_LIT, STN_NEON, 2.6);
  sRing(cx, cy, R * 0.66, STN_NEON, 1.6);
  sDisc(cx, cy, R * 0.30, STN_DK, STN, STN_NEON, 2);
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * 6.2832 + stationT * 0.10;
    sWindow(cx + Math.cos(a) * R * 0.48 - 2.6, cy + Math.sin(a) * R * 0.48 - 2.6, 5.2, 5.2);
  }
  // comms mast + a nav light that blinks
  sStrut(cx, cy - R * 0.94, cx, cy - R * 1.34, R * 0.03);
  const blink = (stationT % 1.6) < 0.5;
  ctx.beginPath(); ctx.arc(cx, cy - R * 1.38, 3, 0, 7);
  ctx.fillStyle = blink ? '#ff2244' : '#3a1520';
  if (gfx !== 'toon' && blink) glow('#ff2244', 10);
  ctx.fill(); noGlow();
  if (gfx === 'toon') { ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.stroke(); }
}

function drawDockedShip(L) {
  const d = L.f.drydock;
  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.rotate(-0.26);
  ctx.scale(1.5, 1.5);
  if (gfx === 'toon') drawShipToon(true); else drawShipNeon(true);   // engines cold: it is parked
  ctx.restore();
}

function drawCallout(b) {
  const laneX = b.side < 0 ? 14 + b.lane * 11 : W - 14 - b.lane * 11;
  const a = b.at;
  const ax = a.x + b.side * a.r * 0.85;   // stop at the feature's near edge, not its middle
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = b.col; ctx.lineWidth = 1.4;
  ctx.lineJoin = 'round';
  if (gfx !== 'toon') glow(b.col, 6);
  ctx.beginPath();
  ctx.moveTo(laneX, b.y);
  ctx.lineTo(laneX, a.y);
  ctx.lineTo(ax, a.y);
  ctx.stroke();
  noGlow();
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(ax, a.y, 3.4, 0, 7);
  ctx.fillStyle = b.col; ctx.fill();
  if (gfx === 'toon') { ctx.strokeStyle = INK; ctx.lineWidth = 1.3; ctx.stroke(); }
  ctx.restore();
}

function drawStationBtn(b) {
  const col = b.off ? '#4d5468' : b.col;
  rrPath(b.x, b.y, b.w, b.h, 9);
  if (gfx === 'toon') {
    ctx.fillStyle = '#151529'; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    rrPath(b.x + 3, b.y + 3, b.w - 6, b.h - 6, 7);
    ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.stroke();
  } else {
    ctx.fillStyle = '#0b0b16'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; glow(col, 12); ctx.stroke(); noGlow();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = "15px 'Black Ops One'"; ctx.fillStyle = col;
  ctx.fillText(b.label, b.x + b.w / 2, b.y + 25);
  ctx.font = "9px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText(b.sub, b.x + b.w / 2, b.y + 41);
}

function drawStationHeader() {
  // Sits BELOW the chrome row for the same reason the play HUD does -- the
  // back/mute/settings buttons own everything above safeTop+42.
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = "15px 'Black Ops One'"; ctx.fillStyle = '#dde3ff';
  glow(STN_NEON, 12);
  ctx.fillText('ALLIED STATION', W / 2, safeTop + 62);
  noGlow();
  ctx.font = "10px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText(save.name + ' · ' + save.xp + ' XP · ' + save.credits + ' CR', W / 2, safeTop + 78);
  const bw = 120, bx = W / 2 - bw / 2, by = safeTop + 86;
  ctx.fillStyle = '#1a1a30'; ctx.fillRect(bx, by, bw, 6);
  const fr = Math.max(0, Math.min(1, ship.hp / ship.maxHp));
  ctx.fillStyle = fr > 0.3 ? '#39ff14' : '#ff2244';
  ctx.fillRect(bx, by, bw * fr, 6);
  if (gfx === 'toon') { ctx.strokeStyle = INK; ctx.lineWidth = 1.3; ctx.strokeRect(bx, by, bw, 6); }
  ctx.font = "8px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText('HULL ' + Math.ceil(ship.hp) + '/' + ship.maxHp, W / 2, by + 18);
  ctx.font = "9px 'Share Tech Mono'"; ctx.fillStyle = '#5f6a85';
  ctx.fillText('RUN ' + score.toLocaleString() + '  ·  BEST ' + save.best.toLocaleString(), W / 2, by + 32);
}

// The band between the barracks and the buttons is otherwise dead screen.
// A planet limb fills it and gives the scene a floor to sit above.
function drawPlanetLimb() {
  const m = Math.min(W, H);
  const px = W * 0.12, py = H + m * 0.28, pr = m * 0.75;
  if (gfx === 'toon') {
    ctx.save();
    ctx.beginPath(); ctx.arc(px, py, pr, 0, 7);
    ctx.fillStyle = '#151a33'; ctx.fill();
    ctx.clip();
    ctx.beginPath(); ctx.arc(px - pr * 0.20, py - pr * 0.12, pr * 0.97, 0, 7);
    ctx.fillStyle = '#1f2749'; ctx.fill();
    ctx.fillStyle = '#28325e';
    ctx.beginPath(); ctx.ellipse(px + pr * 0.12, py - pr * 0.74, pr * 0.52, pr * 0.055, -0.14, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px - pr * 0.26, py - pr * 0.56, pr * 0.40, pr * 0.045, -0.09, 0, 7); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(px, py, pr, 0, 7);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(px, py, pr, 0, 7);
    ctx.fillStyle = '#0a0c1c'; ctx.fill();
    ctx.strokeStyle = '#4488ff'; ctx.lineWidth = 1.6; glow('#4488ff', 14); ctx.stroke(); noGlow();
    ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.arc(px, py, pr * 0.94, 0, 7);
    ctx.strokeStyle = '#2b4a8f'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.globalAlpha = 1;
  }
}
function drawStationScene() {
  const L = stationLayout();
  drawPlanetLimb();
  drawHostileSector(L.f.enemy);
  drawStation(L);
  drawDockedShip(L);
  for (const b of L.B) drawCallout(b);
  for (const b of L.B) drawStationBtn(b);
  drawStationHeader();
  drawFloats();
}

/* =============================== LAYOUT ================================= */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  safeTop = parseFloat(cs.getPropertyValue('--sat')) || 0;
  safeBot = parseFloat(cs.getPropertyValue('--sab')) || 0;
  if (stars.length === 0) {
    for (let i = 0; i < 60; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, v: 26 + Math.random() * 70, s: Math.random() < 0.3 ? 2 : 1 });
  }
}
window.addEventListener('resize', resize);
resize();

/* =============================== RENDER ================================= */
/* ---- cel / toon shading kit -------------------------------------------
   Recipe + rationale: .claude/notes/20260823-canvas-skins-and-cel-shading.md
   (neon-clash wrote it first; this game follows it). Cel shading here is
   exactly two things: flat colour steps, never a gradient, and one heavy
   ink outline per shape. `cel()` acts on the CURRENT path, so shapes can be
   composed from any path calls — the path survives the save/clip/restore
   because the current path is not part of the canvas drawing state. */
const INK = '#0a0a14';
// One no-op kills every bloom in the game at once, and an effect written
// later in the neon idiom is then automatically right in both styles —
// branching at each of the ~15 call sites would be 15 chances to leak a
// halo into a cel-shaded scene, forever.
function glow(col, blur) { if (gfx === 'toon') return; ctx.shadowColor = col; ctx.shadowBlur = blur; }
function noGlow() { ctx.shadowBlur = 0; }
// The sun is fixed in SCREEN space. Sprites draw inside their own rotated
// frames (spinner blades, the boss's gun-barrel rim), so the shade wedge
// counter-rotates out of whatever transform is live — a part that drags its
// shadow round as it spins is the one tell that reads as flat shapes rather
// than lit shapes. getTransform is iOS Safari 15.4+, hence the guard.
function frameRot() {
  if (!ctx.getTransform) return 0;
  const m = ctx.getTransform();
  return Math.atan2(m.b, m.a);   // uniform scale and dpr cancel out
}
function poly(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
}
// (cx, cy) is the PART's own centre, so a wing or a nacelle offset from the
// hull is lit about itself. Shade every part about the sprite origin instead
// and an offset part falls wholly inside or wholly outside the one wedge —
// flat, not sculpted.
function cel(base, lit, lw, cx, cy) {
  ctx.fillStyle = base; ctx.fill();
  if (lit) {
    ctx.save(); ctx.clip();
    ctx.translate(cx || 0, cy || 0);
    ctx.rotate(-frameRot() - 0.38);
    ctx.fillStyle = lit; ctx.fillRect(-400, -400, 400, 800);
    ctx.restore();
  }
  if (lw !== 0) { ctx.lineJoin = 'round'; ctx.lineWidth = lw || 2.2; ctx.strokeStyle = INK; ctx.stroke(); }
}
// centroid of the points is a good enough part centre, and deriving it here
// means no call site has to hand-thread one
function celPoly(pts, base, lit, lw) {
  let cx = 0, cy = 0;
  for (let i = 0; i < pts.length; i += 2) { cx += pts[i]; cy += pts[i + 1]; }
  const n = pts.length / 2;
  poly(pts); cel(base, lit, lw, cx / n, cy / n);
}
// round shapes translate first, so their part centre is the new origin
function celCircle(x, y, r, base, lit, lw) {
  ctx.save(); ctx.translate(x, y); ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); cel(base, lit, lw); ctx.restore();
}
function celEllipse(x, y, rx, ry, base, lit, lw) {
  ctx.save(); ctx.translate(x, y); ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, 7); cel(base, lit, lw); ctx.restore();
}
function panelLine(x1, y1, x2, y2, w) {
  ctx.globalAlpha *= 0.32; ctx.strokeStyle = INK; ctx.lineWidth = w || 1.6;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.globalAlpha /= 0.32;
}
// A stroked line has no interior to clip a shade into, so line-like art gets
// its outline the cheap way: the same path stroked fatter in ink underneath.
function inkStroke(w) {
  if (gfx !== 'toon') return;
  ctx.strokeStyle = INK; ctx.lineWidth = w; ctx.stroke();
}
// player palette: steel airframe, green accents, cyan canopy
const HULL = '#a9bbd2', HULL_LIT = '#e9f2ff', HULL_DK = '#68788f';
const ACC = '#2f9c28', ACC_LIT = '#5ce048';

// `cold` parks the ship: nacelles drawn, exhaust suppressed. A docked ship
// still burning its engines is the tell that a station is a menu, not a place.
function drawShipToon(cold) {
  // engine nacelles + exhaust (behind everything)
  for (const s of [-1, 1]) {
    if (!cold) {
      const flick = 6 + Math.random() * 6;
      celPoly([s * 6.5, 13.5, s * 10.5, 13.5, s * 9, 14 + flick, s * 8, 14 + flick], '#ffc300', '#fff3b0', 1.4);
    }
    celPoly([s * 5.5, -1, s * 11.5, 3, s * 11, 14, s * 5, 12.5], HULL_DK, HULL, 2);
  }
  // swept wings
  for (const s of [-1, 1]) celPoly([s * 3, -5, s * 16, 8, s * 13.5, 13, s * 3.5, 7], ACC, ACC_LIT, 2);
  // fuselage
  celPoly([0, -19, 4, -8, 5, 4, 3.5, 13, -3.5, 13, -5, 4, -4, -8], HULL, HULL_LIT, 2.2);
  panelLine(-3.6, 2, 3.6, 2);
  // accent chevron
  celPoly([0, -3, 3.6, 4, 0, 2, -3.6, 4], ACC, ACC_LIT, 1.4);
  // canopy + specular
  celEllipse(0, -8.5, 2.9, 5.4, '#1d6f9c', '#7fe0ff', 1.8);
  ctx.beginPath(); ctx.ellipse(-1, -10, 0.9, 2, 0.3, 0, 7); ctx.fillStyle = '#ffffff'; ctx.fill();
}
function drawShipNeon(cold) {
  ctx.strokeStyle = '#39ff14'; ctx.fillStyle = '#39ff1433'; ctx.lineWidth = 2;
  glow('#39ff14', 12);
  ctx.beginPath();
  ctx.moveTo(0, -16); ctx.lineTo(11, 12); ctx.lineTo(0, 6); ctx.lineTo(-11, 12);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  if (cold) return;
  // thruster
  ctx.fillStyle = '#ffc300';
  ctx.globalAlpha *= 0.5 + Math.random() * 0.5;
  ctx.beginPath(); ctx.moveTo(-4, 12); ctx.lineTo(0, 20 + Math.random() * 6); ctx.lineTo(4, 12); ctx.closePath(); ctx.fill();
}
function drawShip(x, y) {
  ctx.save();
  ctx.translate(x, y);
  if (ship.invuln > 0 && Math.floor(ship.invuln * 10) % 2 === 0) ctx.globalAlpha = 0.35;
  if (gfx === 'toon') drawShipToon(); else drawShipNeon();
  if (ship.shieldCharges > 0) {
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = gfx === 'toon' ? '#7fbcff' : '#4488ff';
    ctx.lineWidth = gfx === 'toon' ? 2.5 : 2;
    glow('#4488ff', 10);
    for (let i = 0; i < ship.shieldCharges; i++) { ctx.beginPath(); ctx.arc(0, 0, 22 + i * 4, 0, 7); ctx.stroke(); }
    noGlow();
  }
  ctx.restore();
}

/* Toon enemy hulls — each type gets a silhouette you can name at a glance:
   drone = bladed scout pod, shooter = arrowhead gunship with two barrels,
   spinner = four-blade rotorcraft, tanker = armoured freighter. */
function drawEnemyToon(e) {
  const r = e.r, base = hue(50, 44), lit = hue(44, 64), dk = hue(56, 27);
  if (e.type === 'drone') {
    for (const s of [-1, 1]) celPoly([s * r * 0.42, -r * 0.5, s * r * 1.25, -r * 0.78, s * r * 1.2, r * 0.58, s * r * 0.42, r * 0.5], dk, base, 1.8);
    celEllipse(0, 0, r * 0.62, r * 0.82, base, lit, 2.2);
    celCircle(0, r * 0.28, r * 0.24, '#ff2244', '#ff97a6', 1.5);
  } else if (e.type === 'shooter') {
    for (const s of [-1, 1]) celPoly([s * r * 0.46, r * 0.1, s * r * 0.82, r * 0.16, s * r * 0.76, r * 1.02, s * r * 0.48, r * 0.94], dk, base, 1.6);
    celPoly([0, r * 1.18, r * 0.86, r * 0.12, r * 0.62, -r * 0.88, -r * 0.62, -r * 0.88, -r * 0.86, r * 0.12], base, lit, 2.2);
    panelLine(-r * 0.5, -r * 0.2, r * 0.5, -r * 0.2);
    celEllipse(0, -r * 0.24, r * 0.3, r * 0.42, '#12313f', '#5fd6ff', 1.7);
  } else if (e.type === 'spinner') {
    ctx.rotate(e.ang);
    for (let i = 0; i < 4; i++) {
      ctx.save(); ctx.rotate(i * Math.PI / 2);
      celPoly([-r * 0.26, -r * 0.28, r * 0.26, -r * 0.28, r * 0.15, -r * 1.18, -r * 0.15, -r * 1.18], dk, base, 1.9);
      ctx.restore();
    }
    celCircle(0, 0, r * 0.45, base, lit, 2.2);
    celCircle(0, 0, r * 0.2, '#ffc300', '#fff0a8', 1.5);
  } else {
    // tanker: engine block first, then the armoured hull over it
    for (const s of [-1, 0, 1]) celPoly([s * r * 0.5 - r * 0.16, -r * 0.94, s * r * 0.5 + r * 0.16, -r * 0.94, s * r * 0.5 + r * 0.2, -r * 0.5, s * r * 0.5 - r * 0.2, -r * 0.5], dk, base, 1.7);
    celPoly([-r * 0.8, -r * 0.6, r * 0.8, -r * 0.6, r * 1.0, r * 0.22, r * 0.55, r * 0.86, -r * 0.55, r * 0.86, -r * 1.0, r * 0.22], base, lit, 2.6);
    panelLine(-r * 0.86, -r * 0.12, r * 0.86, -r * 0.12, 2);
    panelLine(-r * 0.72, r * 0.4, r * 0.72, r * 0.4, 2);
    celCircle(0, r * 0.12, r * 0.3, dk, base, 2);
  }
}
function drawEnemyNeon(e) {
  const col = hue(100, 62);
  ctx.strokeStyle = col; ctx.fillStyle = hue(100, 62, 0.2); ctx.lineWidth = 2;
  glow(col, 8);
  ctx.beginPath();
  if (e.type === 'drone') { ctx.arc(0, 0, e.r * 0.8, 0, 7); }
  else if (e.type === 'shooter') { ctx.moveTo(0, e.r); ctx.lineTo(e.r, -e.r * 0.7); ctx.lineTo(-e.r, -e.r * 0.7); ctx.closePath(); }
  else if (e.type === 'spinner') { ctx.rotate(e.ang); ctx.rect(-e.r * 0.75, -e.r * 0.75, e.r * 1.5, e.r * 1.5); }
  else { ctx.arc(0, 0, e.r, 0, 7); }
  ctx.fill(); ctx.stroke();
  if (e.type === 'tanker') { ctx.beginPath(); ctx.arc(0, 0, e.r * 0.55, 0, 7); ctx.stroke(); }
  ctx.shadowBlur = 0;
}
function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (gfx === 'toon') drawEnemyToon(e); else drawEnemyNeon(e);
  if (e.slowT > 0) {
    ctx.strokeStyle = WEAPON_DEFS.bolas.color; ctx.lineWidth = 1.5; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(0, 0, e.r * 1.35, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

/* Boss: a capital ship. The rotating rim of gun barrels keeps the neon
   version's spinning-spikes silhouette, over a solid inked hull with a
   bridge dome (gold + heavy pods for a sector boss, cyan for a mini). */
function drawBossToon() {
  const R = boss.r, n = boss.sector ? 10 : 7;
  const base = hue(50, 42), lit = hue(44, 62), dk = hue(56, 26);
  ctx.save(); ctx.rotate(boss.t * (boss.sector ? 0.55 : 0.4));
  for (let i = 0; i < n; i++) {
    ctx.save(); ctx.rotate(Math.PI * 2 / n * i);
    celPoly([-R * 0.15, -R * 0.72, R * 0.15, -R * 0.72, R * 0.09, -R * 1.16, -R * 0.09, -R * 1.16], dk, base, 2);
    celCircle(0, -R * 1.16, R * 0.09, '#ff2244', '#ff97a6', 1.4);
    ctx.restore();
  }
  ctx.restore();
  celCircle(0, 0, R * 0.8, base, lit, 3);
  ctx.globalAlpha *= 0.3; ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.6, 0, 7); ctx.stroke();
  ctx.globalAlpha /= 0.3;
  for (const s of [-1, 1]) celEllipse(s * R * 0.64, 0, R * 0.19, R * 0.36, dk, base, 2);
  celCircle(0, 0, R * 0.31, boss.sector ? '#b8820f' : '#1d6f9c', boss.sector ? '#ffd85e' : '#7fe0ff', 2.4);
  ctx.beginPath(); ctx.ellipse(-R * 0.1, -R * 0.11, R * 0.07, R * 0.12, 0.4, 0, 7);
  ctx.fillStyle = '#ffffff'; ctx.fill();
}
function drawBossNeon() {
  const col = hue(100, 65);
  const spikes = boss.sector ? 14 : 8;
  ctx.strokeStyle = col; ctx.fillStyle = hue(100, 62, 0.18); ctx.lineWidth = boss.sector ? 4 : 3;
  glow(col, boss.sector ? 26 : 18);
  ctx.beginPath();
  for (let i = 0; i < spikes; i++) {
    const a = Math.PI * 2 / spikes * i + boss.t * (boss.sector ? 0.55 : 0.4);
    const rr = boss.r * (i % 2 ? 0.72 : 1);
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  if (boss.sector) {
    ctx.beginPath(); ctx.arc(0, 0, boss.r * 0.45, 0, 7);
    ctx.strokeStyle = '#ffc300'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.shadowBlur = 0;
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#06060e'; ctx.fillRect(0, 0, W, H);
  let ox = 0, oy = 0;
  if (shake > 0) { ox = (Math.random() - 0.5) * 12 * shake; oy = (Math.random() - 0.5) * 12 * shake; }
  ctx.save(); ctx.translate(ox, oy);
  // stars
  for (const s of stars) {
    ctx.fillStyle = s.s === 2 ? '#8899bb' : '#353555';
    ctx.fillRect(s.x, s.y, s.s, s.s + 2);
  }
  if (state === 'station') { drawStationScene(); ctx.restore(); drawVeil(); return; }
  if (state === 'pilots' || state === 'shipyard') { ctx.restore(); return; }
  // powerups
  for (const p of powerups) {
    const col = p.kind === 'P' ? '#39ff14' : p.kind === 'S' ? '#4488ff' : '#ffc300';
    if (gfx === 'toon') {
      ctx.fillStyle = col; ctx.fillRect(p.x - 11, p.y - 11, 22, 22);
      ctx.strokeStyle = INK; ctx.lineWidth = 2.2; ctx.strokeRect(p.x - 11, p.y - 11, 22, 22);
      ctx.fillStyle = '#ffffff55'; ctx.fillRect(p.x - 10, p.y - 10, 20, 6);
      ctx.fillStyle = INK;
    } else {
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      glow(col, 10);
      ctx.strokeRect(p.x - 11, p.y - 11, 22, 22);
      noGlow();
      ctx.fillStyle = col;
    }
    ctx.font = "13px 'Black Ops One'";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.kind, p.x, p.y + 1);
  }
  // bullets
  ctx.save();
  for (const b of bullets) {
    const bc = WEAPON_DEFS[b.wtype] ? WEAPON_DEFS[b.wtype].color : '#dde3ff';
    if (gfx === 'toon') {
      ctx.save(); ctx.translate(b.x, b.y);
      if (b.wtype === 'bombs') { celCircle(0, 0, 5.5, bc, '#ffffffcc', 1.6); }
      else if (b.wtype === 'missiles') {
        celPoly([0, -9, 2.6, -3, 2.6, 6, -2.6, 6, -2.6, -3], bc, '#ffffffaa', 1.5);
        celPoly([-2.4, 2, -5, 7, -2.4, 7], INK, null, 0);
        celPoly([2.4, 2, 5, 7, 2.4, 7], INK, null, 0);
      } else { celPoly([-2.4, -7.5, 2.4, -7.5, 2.4, 4, 0, 6.5, -2.4, 4], bc, '#ffffffaa', 1.4); }
      ctx.restore();
    } else {
      ctx.fillStyle = bc;
      if (b.wtype === 'bombs') { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 7); ctx.fill(); }
      else if (b.wtype === 'missiles') { ctx.fillRect(b.x - 2, b.y - 8, 4, 13); }
      else { ctx.fillRect(b.x - 2, b.y - 7, 4, 11); }
    }
  }
  ctx.restore();
  for (const e of enemies) drawEnemy(e);
  if (boss) {
    ctx.save(); ctx.translate(boss.x, boss.y);
    if (gfx === 'toon') drawBossToon(); else drawBossNeon();
    ctx.restore();
    // boss hp bar
    const bw = W - 80, frac = boss.hp / boss.maxHp;
    ctx.fillStyle = '#1a1a30'; ctx.fillRect(40, safeTop + 84, bw, 7);
    ctx.fillStyle = frac > 0.3 ? hue(100, 60) : '#ff2244';
    ctx.fillRect(40, safeTop + 84, bw * Math.max(0, frac), 7);
  }
  // enemy bullets
  ctx.save();
  for (const b of ebullets) {
    if (gfx === 'toon') {
      celCircle(b.x, b.y, 4.5, '#ff2244', '#ff9aa8', 1.5);
    } else {
      ctx.fillStyle = '#ff2244';
      glow('#ff2244', 7);
      ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 7); ctx.fill();
      noGlow();
    }
  }
  ctx.restore();
  // continuous weapon visuals (beam / flamethrower) while held
  if (drag && save.equippedWeapon === 'beam') {
    const width = 10 + save.weapons.beam * 3;
    ctx.globalAlpha = 0.5 + Math.random() * 0.2;
    ctx.fillStyle = WEAPON_DEFS.beam.color;
    for (const off of beamOffsets()) ctx.fillRect(ship.x + off - width, 0, width * 2, ship.y - 10);
    ctx.globalAlpha = 1;
  }
  if (drag && save.equippedWeapon === 'flame') {
    const range = 100 + save.weapons.flame * 15, halfAngle = 0.32;
    ctx.save(); ctx.translate(ship.x, ship.y - 10);
    ctx.globalAlpha = 0.45 + Math.random() * 0.2;
    ctx.fillStyle = WEAPON_DEFS.flame.color;
    for (const off of FLAME_LOBES[weapon]) {
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, range, -Math.PI / 2 + off - halfAngle, -Math.PI / 2 + off + halfAngle);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.restore();
  }
  // chain-lightning bolts / EMP pulses
  for (const lb of lightningBolts) {
    ctx.globalAlpha = Math.max(0, 1 - lb.t / 0.25);
    glow(WEAPON_DEFS.chain.color, 10);
    ctx.beginPath();
    lb.points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    inkStroke(5.5);
    ctx.strokeStyle = WEAPON_DEFS.chain.color; ctx.lineWidth = 2; ctx.stroke();
    noGlow();
  }
  ctx.globalAlpha = 1;
  for (const ep of empPulses) {
    ctx.globalAlpha = Math.max(0, 1 - ep.t / 0.5);
    ctx.beginPath(); ctx.arc(ep.x, ep.y, ep.r, 0, 7);
    inkStroke(6.5);
    ctx.strokeStyle = WEAPON_DEFS.emp.color; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  drawShip(ship.x, ship.y);
  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.dur);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  // floats
  drawFloats();
  // HUD — the left block sits BELOW the chrome row (← / 🔊 / ⚙ run to x=140),
  // which is why it starts at safeTop+48 rather than tucking in beside them
  if (state === 'play') {
  ctx.textAlign = 'left';
  ctx.font = "11px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText('SECTOR ' + sector + ' · STAGE ' + stage + (boss ? (boss.sector ? ' · SECTOR BOSS' : ' · BOSS') : ' · W' + Math.min(wave, WAVES_PER_STAGE)), 12, safeTop + 48);
  const hpw = 90, hpFrac = ship.hp / ship.maxHp;
  ctx.fillStyle = '#1a1a30'; ctx.fillRect(12, safeTop + 61, hpw, 6);
  ctx.fillStyle = hpFrac > 0.3 ? '#39ff14' : '#ff2244';
  ctx.fillRect(12, safeTop + 61, hpw * Math.max(0, hpFrac), 6);
  ctx.font = "8px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText('HP ' + Math.ceil(ship.hp) + '/' + ship.maxHp, 12, safeTop + 70);
  ctx.textAlign = 'right';
  ctx.font = "20px 'Black Ops One'"; ctx.fillStyle = '#dde3ff';
  ctx.fillText(String(score), W - 12, safeTop + 24);
  ctx.font = "10px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText('SCORE', W - 12, safeTop + 12);
  // weapon pips (in-run P-powerup tier), tinted by the equipped weapon
  const pipCol = WEAPON_DEFS[save.equippedWeapon].color;
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i < weapon ? pipCol : '#1a1a30';
    ctx.fillRect(W - 12 - (3 - i) * 14, safeTop + 50, 10, 4);
  }
  }
  // banner (play only: it stops ticking down off-play, so it would otherwise
  // freeze on screen behind the report and the death overlay)
  if (stageBanner > 0 && state === 'play') {
    ctx.globalAlpha = Math.min(1, stageBanner * 2);
    ctx.textAlign = 'center';
    ctx.font = "26px 'Black Ops One'"; ctx.fillStyle = '#ffc300';
    glow('#ffc300', 18);
    ctx.fillText(bannerText, W / 2, H * 0.38);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawVeil();
}
function drawFloats() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / 0.9);
    ctx.fillStyle = f.color; ctx.font = "14px 'Black Ops One'";
    ctx.fillText(f.txt, f.x, f.y - f.t * 44);
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = 1;
}
// Drawn OUTSIDE the shake transform so the crossfade covers the whole screen.
function drawVeil() {
  if (veil <= 0) return;
  ctx.globalAlpha = Math.min(1, veil);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

/* =============================== LOOP =================================== */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
showPilotSelect();
requestAnimationFrame(loop);
</script>
</body>
</html>
