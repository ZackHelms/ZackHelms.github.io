:root {
  --bg:#06060e; --panel:#0b0b16; --border:#1a1a30;
  --green:#39ff14; --gold:#ffc300; --blue:#4488ff; --red:#ff2244;
  --white:#dde3ff; --dim:#8899bb; --purple:#b44fff;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--white);
  font-family:'Share Tech Mono', monospace;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  position:fixed; inset:0;
}
#cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
#mute {
  position:absolute; top:calc(var(--sat) + 8px); left:10px; z-index:30;
  background:var(--panel); border:1px solid var(--border); border-radius:6px;
  color:var(--white); font-size:16px; width:38px; height:34px; line-height:30px;
  text-align:center; padding:0; touch-action:manipulation;
}
#overlay {
  position:absolute; inset:0; z-index:20; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  background:rgba(6,6,14,0.90); padding:20px; text-align:center;
  padding-top:calc(var(--sat) + 20px); padding-bottom:calc(var(--sab) + 20px);
  overflow-y:auto;
}
#overlay.hidden { display:none; }
#overlay h1 {
  font-family:'Black Ops One', sans-serif; color:var(--green);
  font-size:clamp(1.7rem, 8vw, 2.6rem); letter-spacing:4px;
  text-shadow:0 0 24px #39ff1466; margin-bottom:4px;
}
#overlay h2 {
  font-family:'Black Ops One', sans-serif; color:var(--gold);
  font-size:1.3rem; letter-spacing:3px; margin-bottom:10px;
}
.sub { color:var(--dim); font-size:0.68rem; letter-spacing:3px; margin-bottom:18px; }
.btn {
  font-family:'Black Ops One', sans-serif; letter-spacing:2px;
  background:var(--panel); color:var(--green);
  border:1px solid var(--green); border-radius:8px;
  font-size:1.0rem; padding:13px 30px; margin:7px; min-width:230px;
  box-shadow:0 0 18px #39ff1422; touch-action:manipulation;
}
.btn.alt { color:var(--blue); border-color:var(--blue); box-shadow:0 0 18px #4488ff22; }
.btn.small { font-size:0.8rem; padding:10px 20px; min-width:180px; }
.btn:active { transform:scale(0.96); }
.rules { color:var(--dim); font-size:0.7rem; line-height:1.9; margin-top:14px; max-width:330px; }
.rules b { color:var(--white); }
.score-big {
  font-family:'Black Ops One', sans-serif; color:var(--white);
  font-size:3rem; text-shadow:0 0 24px #dde3ff44; margin:4px 0;
}
.stat { color:var(--dim); font-size:0.78rem; letter-spacing:1px; margin:3px 0; }
.stat b { color:var(--gold); }
.newbest { color:var(--gold); font-family:'Black Ops One',sans-serif; letter-spacing:2px; font-size:0.95rem; text-shadow:0 0 16px #ffc30066; margin:6px 0; }
.missed { margin-top:12px; color:var(--dim); font-size:0.72rem; max-width:330px; line-height:1.8; }
.missed b { color:var(--purple); letter-spacing:1px; }
</style>

  'EIIITT','EMOTTT','ENSSSU','FIPRSY','GORRVW','HIPRRY','NOOTUW','OOOTTU'];
const PTS = l => l <= 3 ? 100 : l === 4 ? 200 : l === 5 ? 400 : l === 6 ? 700 : l === 7 ? 1100 : 1600;
const DAILY_EPOCH = Date.UTC(2026, 0, 1);

/* ============================== STATE =================================== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const overlay = document.getElementById('overlay');
let W = 0, H = 0, dpr = 1, safeTop = 0;
let gridX = 0, gridY = 0, cellSize = 70, gridPix = 350;
let state = 'menu';              // menu | play | over
let mode = 'free';               // free | daily
let seed = 1;
let grid = [];                   // grid[r][c] = 'A' or 'QU'
let allWords = new Set();        // solver result for this board
let found = [];                  // words in found order
let foundSet = new Set();
let score = 0;
let timeLeft = ROUND_TIME;
let path = [];                   // [{r,c}]
let touchId = null;
let floats = [];                 // floating score texts
let flash = { t: 0, color: '#39ff14' };
let shake = 0;
let lastTick = -1;
let best = +(localStorage.getItem('wordCircuit.best') || 0);
let dailyBest = null;
try { dailyBest = JSON.parse(localStorage.getItem('wordCircuit.dailyBest') || 'null'); } catch (e) { dailyBest = null; }

/* ============================== PRNG ==================================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = (h * 33) ^ s.charCodeAt(i);
  return h >>> 0;
}
function utcDateStr() {
  const d = new Date();
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
function dailyNumber() { return Math.floor((Date.now() - DAILY_EPOCH) / 86400000) + 1; }

/* ============================== BOARD =================================== */
function makeGrid(rnd) {
  const dice = DICE.slice();
  for (let i = dice.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [dice[i], dice[j]] = [dice[j], dice[i]];
  }
  const g = [];
  for (let r = 0; r < N; r++) {
    g.push([]);
    for (let c = 0; c < N; c++) {
      const die = dice[r * N + c];
      const face = die[Math.floor(rnd() * die.length)];
      g[r].push(face === 'Q' ? 'QU' : face);
    }
  }
  return g;
}
function solveBoard(g) {
  const res = new Set();
  const seen = Array.from({ length: N }, () => Array(N).fill(false));
  function dfs(r, c, word) {
    word += g[r][c];
    if (word.length > 8 || !PREFIX.has(word)) return;
    if (word.length >= 3 && DICT.has(word)) res.add(word);
    seen[r][c] = true;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < N && nc >= 0 && nc < N && !seen[nr][nc]) dfs(nr, nc, word);
    }
    seen[r][c] = false;
  }
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) dfs(r, c, '');
  return res;
}
function genBoard(baseSeed) {
  let g = null, words = null;
  for (let attempt = 0; attempt < 60; attempt++) {
    const rnd = mulberry32((baseSeed + attempt * 7919) >>> 0);
    g = makeGrid(rnd);
    words = solveBoard(g);
    if (words.size >= MIN_BOARD_WORDS) break;
  }
  return { grid: g, words };
}

/* ============================== AUDIO =================================== */
let AC = null, sfxGain = null, musicGain = null, musicTimer = null, musicStep = 0, musicNext = 0;
let muted = localStorage.getItem('wordCircuit-mute') === '1';
const muteBtn = document.getElementById('mute');
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = AC.createGain(); sfxGain.gain.value = muted ? 0 : 0.5; sfxGain.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = muted ? 0 : 0.20; musicGain.connect(AC.destination);
    musicNext = AC.currentTime + 0.1;
    musicTimer = setInterval(scheduleMusic, 25);
  } catch (e) { AC = null; }
}
function applyMute() {
  muteBtn.textContent = muted ? '🔇' : '🔊';
  localStorage.setItem('wordCircuit-mute', muted ? '1' : '0');
  if (sfxGain) sfxGain.gain.value = muted ? 0 : 0.5;
  if (musicGain) musicGain.gain.value = muted ? 0 : 0.20;
}
function tone(freq, dur, type, vol, when, dest) {
  if (!AC) return;
  const t = when || AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest || sfxGain);
  o.start(t); o.stop(t + dur + 0.02);
}
const PENTA = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3, 784.0, 880.0];
function sfxPick(n) { tone(PENTA[Math.max(0, Math.min(n, PENTA.length - 1))], 0.09, 'triangle', 0.25); }
function sfxWord(len) {
  if (!AC) return;
  const notes = Math.min(2 + (len - 3), 6);
  for (let i = 0; i < notes; i++) tone(PENTA[i + 2] * 2, 0.14, 'square', 0.12, AC.currentTime + i * 0.055);
}
function sfxBad() { tone(110, 0.16, 'sawtooth', 0.2); }
function sfxDup() { tone(220, 0.07, 'sine', 0.18); }
function sfxTick() { tone(990, 0.05, 'square', 0.12); }
function sfxEnd() { if (!AC) return; tone(330, 0.5, 'sine', 0.3); tone(165, 0.7, 'sine', 0.25, AC.currentTime + 0.15); }
// calm 8-step pluck loop, 84 bpm
const MUSIC_BASS = [65.4, 0, 82.4, 0, 98.0, 0, 82.4, 73.4];
const MUSIC_PLUCK = [261.6, 329.6, 392.0, 523.3, 392.0, 329.6, 440.0, 349.2];
function scheduleMusic() {
  if (!AC || state !== 'play') return;
  const stepDur = 60 / 84 / 2;
  while (musicNext < AC.currentTime + 0.12) {
    const s = musicStep % 8;
    const b = MUSIC_BASS[s];
    if (b) tone(b, stepDur * 1.8, 'triangle', 0.5, musicNext, musicGain);
    if (musicStep % 2 === 0) tone(MUSIC_PLUCK[s], stepDur * 0.9, 'sine', 0.22, musicNext, musicGain);
    musicNext += stepDur;
    musicStep++;
  }
}
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});

/* ============================== TAP BINDING ============================= */
function bindTap(el, fn) {
  let last = 0;
  const h = e => {
    e.preventDefault();
    const now = Date.now();
    if (now - last < 400) return;
    last = now;
    initAudio();
    fn();
  };
  el.addEventListener('touchend', h, { passive: false });
  el.addEventListener('click', h);
}
bindTap(muteBtn, () => { muted = !muted; applyMute(); });
applyMute();

/* ============================== GAME FLOW =============================== */
function startGame(m, seedOverride) {
  mode = m;
  seed = seedOverride !== undefined ? seedOverride
    : (m === 'daily' ? hashStr('WC-' + utcDateStr()) : (Math.random() * 0xffffffff) >>> 0);
  const b = genBoard(seed);
  grid = b.grid; allWords = b.words;
  found = []; foundSet = new Set();
  score = 0; timeLeft = ROUND_TIME; path = []; floats = []; touchId = null;
  lastTick = -1; musicStep = 0;
  if (AC) musicNext = AC.currentTime + 0.1;
  state = 'play';
  overlay.classList.add('hidden');
}
function endGame() {
  state = 'over'; path = []; touchId = null;
  sfxEnd();
  let isNewBest = false;
  if (mode === 'free') {
    if (score > best) { best = score; localStorage.setItem('wordCircuit.best', String(best)); isNewBest = true; }
  } else {
    const today = utcDateStr();
    if (!dailyBest || dailyBest.date !== today || score > dailyBest.score) {
      isNewBest = !dailyBest || dailyBest.date !== today ? score > 0 : true;
      dailyBest = { date: today, score: Math.max(score, (dailyBest && dailyBest.date === today) ? dailyBest.score : 0) };
      localStorage.setItem('wordCircuit.dailyBest', JSON.stringify(dailyBest));
    }
  }
  showEndScreen(isNewBest);
}
function showMenu() {
  state = 'menu';
  const today = utcDateStr();
  const dScore = (dailyBest && dailyBest.date === today) ? dailyBest.score : null;
  overlay.innerHTML =
    '<h1>WORD CIRCUIT</h1>' +
    '<div class="sub">-- TRACE THE LETTERS --</div>' +
    '<button class="btn" id="b-daily">DAILY #' + dailyNumber() + (dScore !== null ? ' · ' + dScore : '') + '</button>' +
    '<button class="btn alt" id="b-free">FREE PLAY' + (best ? ' · BEST ' + best : '') + '</button>' +
    '<div class="rules">Drag through neighboring tiles to spell words<br>' +
    '<b>3+ letters</b> · release to submit · slide back to undo<br>' +
    'Longer words score big: <b>3=100 · 5=400 · 8=1600</b><br>' +
    '<b>90 seconds</b>. Daily board is the same for everyone.<br>' +
    '<span style="opacity:0.7">Compact built-in dictionary — common words only.</span></div>';
  overlay.classList.remove('hidden');
  bindTap(document.getElementById('b-daily'), () => startGame('daily'));
  bindTap(document.getElementById('b-free'), () => startGame('free'));
}
function showEndScreen(isNewBest) {
  const missed = [...allWords].filter(w => !foundSet.has(w))
    .sort((a, b) => b.length - a.length || a.localeCompare(b)).slice(0, 6);
  overlay.innerHTML =
    '<h2>' + (mode === 'daily' ? 'DAILY #' + dailyNumber() : 'TIME UP') + '</h2>' +
    '<div class="score-big">' + score + '</div>' +
    (isNewBest && score > 0 ? '<div class="newbest">★ NEW BEST ★</div>' : '') +
    '<div class="stat">WORDS FOUND <b>' + found.length + '</b> / ' + allWords.size + '</div>' +
    '<div class="stat">' + (mode === 'free' ? 'BEST <b>' + best + '</b>' : 'TODAY\'S BEST <b>' + (dailyBest ? dailyBest.score : score) + '</b>') + '</div>' +
    (missed.length ? '<div class="missed"><b>MISSED GEMS</b><br>' + missed.join(' · ') + '</div>' : '') +
    '<div style="margin-top:16px">' +
    '<button class="btn small" id="b-again">' + (mode === 'daily' ? 'RETRY DAILY' : 'PLAY AGAIN') + '</button><br>' +
    '<button class="btn small alt" id="b-menu">MENU</button></div>';
  overlay.classList.remove('hidden');
  bindTap(document.getElementById('b-again'), () => startGame(mode, mode === 'daily' ? seed : undefined));
  bindTap(document.getElementById('b-menu'), showMenu);
}

/* ============================== INPUT =================================== */
function cellAt(x, y) {
  const c = Math.floor((x - gridX) / cellSize), r = Math.floor((y - gridY) / cellSize);
  if (r < 0 || r >= N || c < 0 || c >= N) return null;
  const cx = gridX + (c + 0.5) * cellSize, cy = gridY + (r + 0.5) * cellSize;
  const d2 = (x - cx) * (x - cx) + (y - cy) * (y - cy);
  const core = cellSize * 0.42;
  return d2 <= core * core ? { r, c } : null;
}
function pathWord() { return path.map(p => grid[p.r][p.c]).join(''); }
function tryExtend(cell) {
  if (!cell) return;
  const idx = path.findIndex(p => p.r === cell.r && p.c === cell.c);
  if (path.length === 0) { path.push(cell); sfxPick(0); return; }
  const last = path[path.length - 1];
  if (idx === path.length - 1) return;
  if (idx !== -1 && idx === path.length - 2) { path.pop(); sfxPick(path.length - 1); return; }  // backtrack undo
  if (idx !== -1) return;
  if (Math.abs(cell.r - last.r) <= 1 && Math.abs(cell.c - last.c) <= 1) {
    path.push(cell); sfxPick(path.length - 1);
  }
}
function submitPath() {
  if (path.length === 0) return;
  const w = pathWord();
  const mid = path[Math.floor(path.length / 2)];
  const fx = gridX + (mid.c + 0.5) * cellSize, fy = gridY + (mid.r + 0.5) * cellSize;
  if (w.length >= 3 && DICT.has(w) && allWords.has(w)) {
    if (foundSet.has(w)) {
      sfxDup();
      floats.push({ x: fx, y: fy, txt: 'ALREADY FOUND', color: '#8899bb', t: 0 });
    } else {
      const pts = PTS(w.length);
      score += pts;
      found.push(w); foundSet.add(w);
      sfxWord(w.length);
      flash = { t: 0.25, color: w.length >= 6 ? '#ffc300' : '#39ff14' };
      floats.push({ x: fx, y: fy, txt: w + ' +' + pts, color: w.length >= 6 ? '#ffc300' : '#39ff14', t: 0 });
    }
  } else if (w.length >= 3) {
    sfxBad(); shake = 0.2;
    floats.push({ x: fx, y: fy, txt: 'NOT A WORD', color: '#ff2244', t: 0 });
  }
  path = [];
}
function ptFromEvent(e) {
  if (e.changedTouches) {
    for (const t of e.changedTouches) if (touchId === null || t.identifier === touchId) return { x: t.clientX, y: t.clientY, id: t.identifier };
    return null;
  }
  return { x: e.clientX, y: e.clientY, id: 'mouse' };
}
function onDown(e) {
  e.preventDefault(); initAudio();
  if (state !== 'play') return;
  const p = ptFromEvent(e); if (!p) return;
  if (touchId !== null) return;
  touchId = p.id;
  path = [];
  tryExtend(cellAt(p.x, p.y));
}
function onMove(e) {
  e.preventDefault();
  if (state !== 'play' || touchId === null) return;
  const p = ptFromEvent(e); if (!p || p.id !== touchId) return;
  tryExtend(cellAt(p.x, p.y));
}
function onUp(e) {
  e.preventDefault();
  if (touchId === null) return;
  const p = ptFromEvent(e); if (!p || p.id !== touchId) return;
  touchId = null;
  if (state === 'play') submitPath();
}
cv.addEventListener('touchstart', onDown, { passive: false });
cv.addEventListener('touchmove', onMove, { passive: false });
cv.addEventListener('touchend', onUp, { passive: false });
cv.addEventListener('touchcancel', onUp, { passive: false });
cv.addEventListener('mousedown', onDown);
cv.addEventListener('mousemove', e => { if (touchId === 'mouse') onMove(e); });
cv.addEventListener('mouseup', e => { if (touchId === 'mouse') onUp(e); });

/* ============================== LAYOUT ================================== */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  safeTop = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
  gridPix = Math.min(W - 20, 400, H * 0.52);
  cellSize = gridPix / N;
  gridX = (W - gridPix) / 2;
  gridY = Math.max(safeTop + 118, (H - gridPix) * 0.55);   // thumb-zone placement
}
window.addEventListener('resize', resize);
resize();

/* ============================== RENDER ================================== */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#06060e'; ctx.fillRect(0, 0, W, H);
  if (state === 'menu') return;
  let ox = 0, oy = 0;
  if (shake > 0) { ox = (Math.random() - 0.5) * 8 * shake; oy = (Math.random() - 0.5) * 8 * shake; }
  ctx.save(); ctx.translate(ox, oy);

  // HUD
  const hudY = safeTop + 14;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = "13px 'Black Ops One'"; ctx.fillStyle = '#8899bb';
  ctx.fillText(mode === 'daily' ? 'DAILY #' + dailyNumber() : 'FREE PLAY', 58, hudY + 2);
  ctx.textAlign = 'right';
  ctx.font = "22px 'Black Ops One'"; ctx.fillStyle = '#dde3ff';
  ctx.fillText(String(score), W - 12, hudY + 14);
  ctx.font = "10px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText('SCORE', W - 12, hudY + 2);

  // timer bar
  const tw = W - 24, th = 6, ty = safeTop + 52;
  const frac = Math.max(0, timeLeft / ROUND_TIME);
  ctx.fillStyle = '#1a1a30'; roundRect(12, ty, tw, th, 3); ctx.fill();
  ctx.fillStyle = timeLeft > 30 ? '#39ff14' : timeLeft > 10 ? '#ffc300' : '#ff2244';
  if (frac > 0) { roundRect(12, ty, tw * frac, th, 3); ctx.fill(); }
  ctx.textAlign = 'center';
  ctx.font = "12px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
  ctx.fillText(Math.ceil(timeLeft) + 's · ' + found.length + '/' + allWords.size + ' words', W / 2, ty + 12);

  // current word
  const cw = pathWord();
  if (cw) {
    let col = '#dde3ff';
    if (cw.length >= 3) col = foundSet.has(cw) ? '#ffc300' : (DICT.has(cw) && allWords.has(cw)) ? '#39ff14' : '#dde3ff';
    ctx.font = "26px 'Black Ops One'"; ctx.fillStyle = col;
    ctx.shadowColor = col; ctx.shadowBlur = 14;
    ctx.fillText(cw, W / 2, gridY - 42);
    ctx.shadowBlur = 0;
  }

  // grid tiles
  const inPath = Array.from({ length: N }, () => Array(N).fill(-1));
  path.forEach((p, i) => inPath[p.r][p.c] = i);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const x = gridX + c * cellSize + 3, y = gridY + r * cellSize + 3, s = cellSize - 6;
    const sel = inPath[r][c] >= 0;
    ctx.fillStyle = sel ? '#12241a' : '#0b0b16';
    ctx.strokeStyle = sel ? '#39ff14' : '#1a1a30';
    ctx.lineWidth = sel ? 2 : 1;
    if (sel) { ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 12; }
    roundRect(x, y, s, s, 8); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = sel ? '#39ff14' : '#dde3ff';
    const letter = grid[r][c] === 'QU' ? 'Qu' : grid[r][c];
    ctx.font = (letter.length > 1 ? cellSize * 0.36 : cellSize * 0.44) + "px 'Black Ops One'";
    ctx.textBaseline = 'middle';
    ctx.fillText(letter, x + s / 2, y + s / 2 + 2);
    ctx.textBaseline = 'top';
  }

  // path line
  if (path.length > 1) {
    ctx.strokeStyle = 'rgba(57,255,20,0.5)'; ctx.lineWidth = 5;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    path.forEach((p, i) => {
      const x = gridX + (p.c + 0.5) * cellSize, y = gridY + (p.r + 0.5) * cellSize;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  // found words ticker (below grid)
  const fy0 = gridY + gridPix + 16;
  ctx.font = "12px 'Share Tech Mono'"; ctx.textAlign = 'center';
  const recent = found.slice(-15);
  let line = '', lines = [];
  for (let i = recent.length - 1; i >= 0; i--) {
    const nxt = line ? line + ' · ' + recent[i] : recent[i];
    if (ctx.measureText(nxt).width > W - 30) { lines.push(line); line = recent[i]; if (lines.length >= 3) break; }
    else line = nxt;
  }
  if (line && lines.length < 3) lines.push(line);
  lines.forEach((ln, i) => {
    ctx.fillStyle = i === 0 ? '#8899bb' : 'rgba(136,153,187,' + (0.6 - i * 0.2) + ')';
    ctx.fillText(ln, W / 2, fy0 + i * 18);
  });

  // flash border
  if (flash.t > 0) {
    ctx.strokeStyle = flash.color; ctx.globalAlpha = flash.t * 3;
    ctx.lineWidth = 5; ctx.strokeRect(2, 2, W - 4, H - 4);
    ctx.globalAlpha = 1;
  }

  // floating texts
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / 1.1);
    ctx.fillStyle = f.color;
    ctx.font = "16px 'Black Ops One'";
    ctx.fillText(f.txt, Math.min(Math.max(f.x, 70), W - 70), f.y - f.t * 46);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ============================== LOOP ==================================== */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  if (state === 'play') {
    timeLeft -= dt;
    if (timeLeft <= 10 && timeLeft > 0) {
      const s = Math.ceil(timeLeft);
      if (s !== lastTick) { lastTick = s; sfxTick(); }
    }
    if (timeLeft <= 0) { timeLeft = 0; endGame(); }
  }
  flash.t = Math.max(0, flash.t - dt);
  shake = Math.max(0, shake - dt * 3);
  for (const f of floats) f.t += dt;
  floats = floats.filter(f => f.t < 1.1);
  draw();
  requestAnimationFrame(loop);
}
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
