let bubble = null, lastLine = '';
const BUBBLE_DUR = 5;
function pickLine(v) {
  const pools = [];
  const add = (arr, w) => { if (arr && arr.length) for (let i = 0; i < w; i++) pools.push(arr); };
  if (v.carry) add(SAY.carry[v.carry], 5);
  if (v.keeper) add(SAY.keeper, 4);
  add(SAY[phaseName(S.dayT).toLowerCase()], 2);
  if (!FIRE.burning) add(SAY.cold, 3);
  else if (v.state === 'huddle') add(SAY.warm, 2);
  add(SAY.generic, 4);
  let line = SAY.generic[0];
  for (let tries = 0; tries < 8; tries++) {
    const pool = pools[Math.floor(Math.random() * pools.length)];
    line = pool[Math.floor(Math.random() * pool.length)];
    if (line !== lastLine) break;
  }
  lastLine = line;
  return line;
}
function wrapLine(text, maxW) {
  cx.font = '11px "Share Tech Mono", monospace';
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (cx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function speak(v) {
  if (bubble) return;                       // only one bubble at a time
  bubble = { v, lines: wrapLine(pickLine(v), 150), t: 0 };
  sfxPuff();
}
function villagerAt(x, y) {
  let best = null, bd = 1e9;
  for (const v of villagers) {
    if (v.state === 'inside') continue;
    const dx = x - v.x, dy = y - (v.y - 12);
    const d = Math.hypot(dx, dy);
    if (d < 20 && d < bd) { best = v; bd = d; }
  }
  return best;
}
function drawBubble(dt) {
  if (!bubble) return;
  bubble.t += dt;
  if (bubble.t >= BUBBLE_DUR || bubble.v.state === 'inside') { bubble = null; return; }
  const a = Math.min(1, bubble.t / 0.15) * Math.min(1, (BUBBLE_DUR - bubble.t) / 0.35);
  const v = bubble.v, lines = bubble.lines;
  cx.font = '11px "Share Tech Mono", monospace';
  let tw = 0;
  for (const l of lines) tw = Math.max(tw, cx.measureText(l).width);
  const pad = 7, lh = 13;
  const bw = tw + pad * 2, bh = lines.length * lh + pad * 2 - 3;
  const bx = Math.max(6, Math.min(W - 6 - bw, v.x - bw / 2));
  const by = v.y - 30 - bh;
  cx.globalAlpha = a;
  cx.fillStyle = 'rgba(250,252,255,0.96)';
  cx.strokeStyle = 'rgba(40,52,84,0.65)'; cx.lineWidth = 1.5;
  cx.beginPath();
  if (cx.roundRect) cx.roundRect(bx, by, bw, bh, 7); else cx.rect(bx, by, bw, bh);
  cx.fill(); cx.stroke();
  const tailX = Math.max(bx + 8, Math.min(bx + bw - 8, v.x));
  cx.beginPath();
  cx.moveTo(tailX - 5, by + bh - 0.5);
  cx.lineTo(tailX + 5, by + bh - 0.5);
  cx.lineTo(v.x, v.y - 24);
  cx.closePath();
  cx.fillStyle = 'rgba(250,252,255,0.96)'; cx.fill();
  cx.strokeStyle = 'rgba(40,52,84,0.65)';
  cx.beginPath(); cx.moveTo(tailX - 5, by + bh); cx.lineTo(v.x, v.y - 24); cx.lineTo(tailX + 5, by + bh); cx.stroke();
  cx.fillStyle = '#1c2540'; cx.textAlign = 'left';
  lines.forEach((l, i) => cx.fillText(l, bx + pad, by + pad + 9 + i * lh));
  cx.globalAlpha = 1;
  cx.textAlign = 'center';
}

/* =============================== mishaps: runtime =============================== */
/* NOTHING here is saved. An in-flight incident is a moment, not progress:
   restoring a half-extinguished roof fire or a thief frozen mid-tiptoe out of
   a save would be fiddly to write and unfair to a player who closed the tab
   with one on screen. Only the RUN TOTALS (S.stolen, S.caught) persist, and
   they are scoreboard, not state. A damaged building is likewise a property of
   the live blaze — put the fire out and the building is whole — which is why
   there is no repair layer to migrate. */
const MISH = [];
let mishT = 40, THIEF = null;

let taughtMishap = false;
function mishapToast(k, tail) {
  toast(MISHAP_FAM[k.fam].icon + ' ' + k.n + (tail ? ' — ' + tail : ''));
  /* Taught once per session, not per save: the rule is short, and a player
     coming back after a week has forgotten it as surely as a new one. */
  if (!taughtMishap) {
    taughtMishap = true;
    hint('Things go wrong in a settlement. TAP an accident to help it along — and build the sawbones, the constable and the fire marshal, because they are who answers when you cannot.');
  }
}
function mishPos(m) {
  return m.fam === 'med' ? { x: m.v.x, y: m.v.y - 12 }
                         : { x: m.b.x, y: m.b.y - m.b.w * 0.55 };
}
function famActive(f) { return f === 'crime' ? !!THIEF : MISH.some(m => m.fam === f); }

/* One incident per family at a time. Two overlapping blazes would be a worse
   read, not a harder game: the player cannot tell which arc belongs to which
   roof, and the whole point of drawing these in the scene is that they are
   legible without a menu. */
function spawnMishap() {
  const opts = [];
  for (const f of ['med', 'crime', 'fire']) {
    if (famActive(f)) continue;
    const k = mishapFor(f);
    if (k) for (let i = 0; i < MISHAP_W[f]; i++) opts.push(k);
  }
  if (!opts.length) return;
  const k = opts[Math.floor(Math.random() * opts.length)];
  if (k.fam === 'med') spawnInjury(k);
  else if (k.fam === 'fire') spawnBlaze(k);
  else spawnThief(k);
}
function spawnInjury(k) {
  /* Never the firekeeper. It is the camp's recovery valve — the one villager
     that can restart a dead fire — and idling it is how an unlucky roll turns
     into an unrecoverable run. */
  const pool = villagers.filter(v => !v.keeper && !v.hurt && v.state !== 'inside');
  if (!pool.length) return;
  const v = pool[Math.floor(Math.random() * pool.length)];
  vRelease(v);
  v.carry = null; v.forage = false; v.job = null;
  v.state = 'hurt'; v.t = 0;
  const m = { k, fam: 'med', v, prog: 0, t: 0 };
  v.hurt = m; MISH.push(m);
  mishapToast(k, 'tap them to help');
}
function spawnBlaze(k) {
  /* A business first, because a business has an EFFECT to lose — a blaze that
     costs nothing but a pretty animation is not an incident. Houses are the
     fallback so a village that has not opened a shop yet still burns. */
  const biz = activeBiz().filter(b => !b.dmg);
  const pool = biz.length ? biz : activeHomes().filter(h => !h.dmg);
  if (!pool.length) return;
  const b = pool[Math.floor(Math.random() * pool.length)];
  b.dmg = true;
  MISH.push({ k, fam: 'fire', b, prog: 0, t: 0 });
  mishapToast(k, 'tap the building to fight it');
  sfxLog();
}
function dropMishap(m) {
  const i = MISH.indexOf(m);
  if (i >= 0) MISH.splice(i, 1);
  if (m.fam === 'med') { m.v.hurt = null; if (m.v.state === 'hurt') { m.v.state = 'idle'; m.v.wait = 0; } }
  else m.b.dmg = false;
}
function mishapStep(dt) {
  for (let i = MISH.length - 1; i >= 0; i--) {
    const m = MISH[i];
    m.t += dt;
    m.prog += dt * mishapRate(m.k, S.up[MISHAP_FAM[m.fam].svc] || 0);
    if (m.fam === 'fire' && Math.random() < dt * 6)
      smoke.push({ x: m.b.x + (Math.random()-0.5) * m.b.w * 0.5, y: m.b.y - m.b.w * 0.6,
                   vx: (Math.random()-0.5) * 12, vy: -26 - Math.random() * 14, r: 3, life: 0, max: 1.6 });
    if (m.prog >= m.k.work) {
      dropMishap(m);
      toast(m.fam === 'med' ? '\u{1FA79} BACK ON THEIR FEET' : '\u{1F4A7} THE FIRE IS OUT');
    }
  }
  if (THIEF) thiefStep(dt);
  /* The clock only runs on a WORKING camp. A cold camp has nobody out to hurt
     and nothing being hauled to steal, and kicking a player whose fire has
     just died is piling on. */
  if (stageIx() < 1 || !FIRE.burning) return;
  mishT -= dt;
  if (mishT <= 0) { mishT = mishapMTBF() * (0.55 + Math.random() * 0.9); spawnMishap(); }
}
/* A tap on an incident closes MISHAP_TAP of its bar. Hit-tested BEFORE
   villagerAt in the pointer handler, so helping the injured beats hearing them
   — a hurt villager is the one villager whose tap is not a chat bubble. */
function tapMishap(x, y) {
  for (const m of MISH) {
    const p = mishPos(m);
    const r = m.fam === 'med' ? 26 : Math.max(30, m.b.w * 0.55);
    if (Math.hypot(x - p.x, y - p.y) > r) continue;
    m.prog += m.k.work * MISHAP_TAP;
    sfxTap();
    for (let i = 0; i < 5; i++)
      sparks.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*70, vy: -30 - Math.random()*50, life: 0, max: 0.4 });
    return true;
  }
  return false;
}

/* ------------------------------- THE THIEF -------------------------------
   The one mishap that is an AGENT rather than a bar, because the CD asked for
   exactly that: a figure an attentive player spots sneaking between the huts
   with a bag that visibly grows, who gets clean away most of the time unless
   you notice him and have the law to back the catch up.
   Two rules give it its shape:
   - Announcing him is VAGUE on purpose ("something moved between the huts"),
     never a location. A precise callout would delete the game of spotting
     him; no callout at all would rob a player who happens to be in the
     upgrade panel. A hint that costs a glance is the fair middle.
   - Catching him RETURNS the whole bag. Theft has to be recoverable to be
     worth watching for, and it makes the constable read as insurance you
     can cash rather than a tax you already paid.
   Note what theft does NOT touch: S.gathered, the evolution reach. Reach is
   what the camp HAULED, and a thief cannot un-haul it. He costs you the
   purchase, not the run. */
function thiefCover() {
  const pts = [];
  for (const h of activeHomes()) pts.push({ x: h.x + h.w * 0.55, y: h.y + 4 });
  for (const b of activeBiz())   pts.push({ x: b.x - b.w * 0.55, y: b.y + 4 });
  for (const t of G.treeItems)   pts.push({ x: t.x + 12, y: t.y + 4 });
  for (const r of G.rockItems)   pts.push({ x: r.x - 12, y: r.y + 3 });
  return pts;
}
function thiefPickCover() {
  const pts = thiefCover();
  if (!pts.length) { THIEF.tx = W * (0.2 + Math.random() * 0.6); THIEF.ty = G.zone.buildBot + 14; return; }
  const p = pts[Math.floor(Math.random() * pts.length)];
  THIEF.tx = Math.max(14, Math.min(W - 14, p.x)); THIEF.ty = p.y;
}
function spawnThief(k) {
  if (THIEF) return;
  const left = Math.random() < 0.5;
  THIEF = {
    k, bag: { wood: 0, stone: 0, food: 0 }, loot: 0, grabs: 0,
    x: left ? -26 : W + 26, y: (G.zone.buildBot + G.zone.workTop) / 2,
    tx: 0, ty: 0, flip: left ? 1 : -1, state: 'cover', t: 0, wait: 0, spooked: 0, caughtT: 0,
  };
  thiefPickCover();
  mishapToast(k, 'something moved between the buildings…');
}
function thiefGrab() {
  const T = THIEF;
  let took = 0;
  const cap = thiefGrabCap(popCap(), tripYield());
  for (const r of ['wood', 'stone', 'food']) {
    const n = Math.min(Math.floor(S.res[r] * T.k.cut), Math.ceil(cap));
    if (n > 0) { S.res[r] -= n; T.bag[r] += n; took += n; }
  }
  T.loot += took; T.grabs++;
  if (took > 0) floats.push({ txt: '−' + took, x: G.stock.x, y: G.stock.y - 14, life: 0, bad: true });
  sfxPuff();
}
function catchThief() {
  const T = THIEF;
  if (!T || T.state === 'caught') return;
  for (const r of ['wood', 'stone', 'food']) S.res[r] += T.bag[r];
  S.caught = (S.caught || 0) + 1;
  T.state = 'caught'; T.caughtT = 0;
  toast('\u{1F694} ' + T.k.n + ' CAUGHT' + (T.loot > 0 ? ' — ' + T.loot + ' RECOVERED' : ''));
  sfxBuy();
}
function thiefEscape() {
  const T = THIEF;
  S.stolen = (S.stolen || 0) + T.loot;
  if (T.loot > 0) toast('\u{1F977} THE ' + T.k.n + ' GOT AWAY WITH ' + T.loot);
  THIEF = null;
}
/* The villagers say why the catch failed, in their own words, because the CD
   asked for a chat bubble and because "nothing happened" is the worst possible
   answer to a deliberate tap. This is the ONE place a bubble pre-empts
   another: the one-bubble rule is about flavour chatter not stacking up, and
   this is a reply to something the player just did. The toast goes out
   regardless, so the answer survives even with every villager indoors. */
function lawComplaint() {
  const lvl = S.up.constable || 0;
  const line = lvl === 0
    ? 'We have no constable! All we can do is watch him go.'
    : 'Our constable cannot chase that one — we need a proper station.';
  toast('\u{1F977} ' + line);
  const pool = villagers.filter(v => v.state !== 'inside');
  if (!pool.length) return;
  const near = pool.reduce((a, b) =>
    Math.hypot(b.x - THIEF.x, b.y - THIEF.y) < Math.hypot(a.x - THIEF.x, a.y - THIEF.y) ? b : a);
  bubble = { v: near, lines: wrapLine(line, 150), t: 0 };
}
function tapThief(x, y) {
  const T = THIEF;
  if (!T || T.state === 'caught') return false;
  if (Math.hypot(x - T.x, y - (T.y - 12)) > 30) return false;
  if ((S.up.constable || 0) >= T.k.need) { catchThief(); return true; }
  T.spooked = 1.8;
  if (T.state === 'lurk' || T.state === 'grab') T.state = 'cover';
  thiefPickCover();
  lawComplaint();
  sfxPuff();
  return true;
}
function thiefStep(dt) {
  const T = THIEF;
  T.t += dt;
  if (T.spooked > 0) T.spooked -= dt;
  const sp = (T.state === 'flee' ? 96 : T.spooked > 0 ? 64 : 34) * dt;
  const go = () => {
    const dx = T.tx - T.x, dy = T.ty - T.y, d = Math.hypot(dx, dy);
    if (d > 1) { T.x += dx / d * Math.min(sp, d); T.y += dy / d * Math.min(sp, d); T.flip = dx < 0 ? -1 : 1; }
    return d <= 2;
  };
  switch (T.state) {
    case 'cover':   if (go()) { T.state = 'lurk'; T.wait = 0.7 + Math.random() * 1.6; } break;
    case 'lurk':
      T.wait -= dt;
      if (T.wait <= 0) { T.state = 'toStock'; T.tx = G.stock.x + (Math.random()-0.5) * 16; T.ty = G.stock.y + 9; }
      break;
    case 'toStock': if (go()) { T.state = 'grab'; T.wait = 0.6; } break;
    case 'grab':
      T.wait -= dt;
      if (T.wait <= 0) {
        thiefGrab();
        if (T.grabs >= T.k.grabs) { T.state = 'flee'; T.tx = T.x < W / 2 ? -60 : W + 60; T.ty = T.y + 12; }
        else { thiefPickCover(); T.state = 'cover'; }
      }
      break;
    case 'flee':
      go();
      if (T.x < -50 || T.x > W + 50) { thiefEscape(); return; }
      break;
    case 'caught':
      T.caughtT += dt;
      if (T.caughtT > 1.1) { THIEF = null; return; }
      break;
  }
  /* The constable's own odds. Deliberately slim — the CD's brief is that the
     law "might eventually detect them on their own, but most of the time the
     thief will get away with it". At ~0.25%/s per rank a full heist is caught
     unaided about one time in seven with a hut, one in four with a station. */
  const lvl = S.up.constable || 0;
  if (T.state !== 'caught' && lvl >= T.k.need && Math.random() < dt * 0.0025 * lvl) catchThief();
}
function drawThief() {
  const T = THIEF;
  if (!T) return;
  const fade = T.state === 'caught' ? Math.max(0, 1 - T.caughtT / 1.1) : 1;
  const fleeing = T.state === 'flee';
  const walking = Math.hypot(T.tx - T.x, T.ty - T.y) > 3;
  const bob = walking ? Math.abs(Math.sin(T.t * (fleeing ? 17 : 8))) * (fleeing ? 2.6 : 1.2) : 0;
  const bh = fleeing ? 13 : 10;      // hunched low while sneaking, upright in flight
  const hunch = fleeing ? 0 : 2.2;   // the upper body leans out over the toes
  cx.save();
  cx.globalAlpha = fade;
  cx.translate(T.x, T.y - bob);
  cx.scale(T.flip, 1);
  cx.fillStyle = 'rgba(70,86,120,0.30)';
  cx.beginPath(); cx.ellipse(0, 1.5, 7, 2.6, 0, 0, TAU); cx.fill();
  cx.strokeStyle = '#232b40'; cx.lineWidth = 2.4; cx.lineCap = 'round';
  const sw = walking ? Math.sin(T.t * (fleeing ? 20 : 10)) * (fleeing ? 4.5 : 3) : 0;
  cx.beginPath(); cx.moveTo(-2, -bh + 7); cx.lineTo(-2 + sw, 0); cx.stroke();
  cx.beginPath(); cx.moveTo(2, -bh + 7); cx.lineTo(2 - sw, 0); cx.stroke();
  /* THE SACK — the whole read, and the reason this is not just another
     villager. Drawn BEHIND the body, because a bag that grows in FRONT of the
     figure swallows it: at a full heist the sack is wider than the thief, and
     the first draft turned him into an unidentifiable brown boulder. It is
     also the palest thing on him on purpose. He has to be findable at night
     without being obvious, and a straw-coloured sack over a navy coat is what
     the eye actually catches in the dark between two buildings. */
  const sr = 3.2 + Math.min(8.5, Math.sqrt(Math.max(0, T.loot)) * 0.5);
  const sx = -6 - sr * 0.8, sy = -bh + hunch * 0.4 - sr * 0.15;
  cx.beginPath();                                  // LUMPY, not a ball: three overlapping arcs
  cx.arc(sx, sy, sr, 0, TAU);
  cx.arc(sx + sr * 0.45, sy + sr * 0.3, sr * 0.72, 0, TAU);
  cx.arc(sx - sr * 0.3, sy + sr * 0.45, sr * 0.6, 0, TAU);
  cx.fillStyle = '#c9a463'; cx.fill();
  inkStroke(1.2); cx.stroke();
  cx.save(); cx.clip();                            // cel side-shade, same trick as every other solid
  cx.fillStyle = 'rgba(90,66,32,0.30)';
  cx.fillRect(sx - sr * 1.6, sy + sr * 0.15, sr * 3.2, sr * 2);
  cx.restore();
  cx.strokeStyle = '#6f5330'; cx.lineWidth = 2;    // the cinched neck, then the knot above it
  cx.beginPath(); cx.moveTo(sx + sr * 0.35, sy - sr * 0.78); cx.lineTo(sx + sr * 0.1, sy - sr * 1.28); cx.stroke();
  cx.beginPath(); cx.arc(sx + sr * 0.1, sy - sr * 1.35, 1.7, 0, TAU); cx.fillStyle = '#6f5330'; cx.fill();
  cx.strokeStyle = '#39445f'; cx.lineWidth = 2.2;  // the arm holding it over the shoulder
  cx.beginPath(); cx.moveTo(-3, -bh + 2); cx.lineTo(sx + sr * 0.45, sy - sr * 0.85); cx.stroke();
  cx.fillStyle = '#39445f';
  cx.beginPath();
  if (cx.roundRect) cx.roundRect(-5 + hunch * 0.4, -bh - 4, 10, bh + 5, 4); else cx.rect(-5, -bh - 4, 10, bh + 5);
  cx.fill(); inkStroke(1.1); cx.stroke();
  cx.fillStyle = '#e8b98f';
  cx.beginPath(); cx.arc(1.5 + hunch, -bh - 8, 4.2, 0, TAU); cx.fill();
  inkStroke(1); cx.stroke();
  cx.fillStyle = '#161c2c';                        // mask band, then a flat cap with a peak
  cx.fillRect(-2.4 + hunch, -bh - 9.6, 8, 2.6);
  cx.beginPath(); cx.arc(1.5 + hunch, -bh - 8.6, 4.5, Math.PI * 1.02, Math.PI * 1.98); cx.fill();
  cx.beginPath();
  cx.moveTo(5 + hunch, -bh - 10.6); cx.lineTo(10 + hunch, -bh - 9.5); cx.lineTo(5 + hunch, -bh - 8.7);
  cx.closePath(); cx.fill();
  cx.restore();
  if (T.spooked > 0) {                             // startled by a grab that missed
    cx.globalAlpha = fade * Math.min(1, T.spooked);
    cx.font = 'bold 14px "Share Tech Mono", monospace'; cx.textAlign = 'center';
    cx.fillStyle = '#ffd98a';
    cx.strokeStyle = 'rgba(10,12,24,0.6)'; cx.lineWidth = 3;
    cx.strokeText('!', T.x + T.flip * 9, T.y - bh - 18);
    cx.fillText('!', T.x + T.flip * 9, T.y - bh - 18);
    cx.globalAlpha = 1;
  }
}
/* Flames on a burning building, drawn INSIDE the y-sorted item list so a
   villager can pass in front of the blaze. The badge and the recovery arc are
   drawn after the lighting pass instead — they are read-outs, and a read-out
   that dims at night is a read-out you lose exactly when you need it. */
function drawBlazeFx(m) {
  const b = m.b, w = b.w;
  const n = 7;
  for (let i = 0; i < n; i++) {
    const p = (i / n) * TAU + m.t * 3.1;
    const fx = b.x + Math.sin(p) * w * 0.34;
    const h = (10 + Math.sin(m.t * 9 + i) * 5) * (1 - m.prog / m.k.work * 0.55);
    const fy = b.y - w * 0.62 + Math.cos(p * 1.7) * 4;
    cx.fillStyle = i % 3 === 0 ? 'rgba(255,226,120,0.95)' : 'rgba(255,132,44,0.92)';
    cx.beginPath();
    cx.moveTo(fx - 4, fy); cx.quadraticCurveTo(fx - 2, fy - h * 0.6, fx, fy - h);
    cx.quadraticCurveTo(fx + 2, fy - h * 0.6, fx + 4, fy);
    cx.closePath(); cx.fill();
  }
}
function drawMishapMarks() {
  for (const m of MISH) {
    const p = mishPos(m), frac = Math.min(1, m.prog / m.k.work);
    const r = 11, cy = p.y - 20;
    const short = (S.up[MISHAP_FAM[m.fam].svc] || 0) < m.k.need;
    const hue = m.fam === 'med' ? '#7ee0a8' : '#ff9a3c';
    cx.beginPath(); cx.arc(p.x, cy, r + 3, 0, TAU);
    cx.fillStyle = 'rgba(11,11,22,0.78)'; cx.fill();
    cx.strokeStyle = 'rgba(255,255,255,0.18)'; cx.lineWidth = 2.5;
    cx.beginPath(); cx.arc(p.x, cy, r, 0, TAU); cx.stroke();
    cx.strokeStyle = hue; cx.lineWidth = 2.5;
    cx.beginPath(); cx.arc(p.x, cy, r, -Math.PI / 2, -Math.PI / 2 + TAU * frac); cx.stroke();
    /* The glyph is DRAWN, not an emoji in a font. The badge is the read-out
       for the whole layer and it has to survive a device with no emoji for
       U+1FA79, a webfont that has not loaded yet, and a canvas that falls back
       to a tofu box — all three of which this game has already met. */
    cx.fillStyle = hue;
    if (m.fam === 'med') {                       // a cross
      cx.fillRect(p.x - 4.5, cy - 1.5, 9, 3);
      cx.fillRect(p.x - 1.5, cy - 4.5, 3, 9);
    } else {                                     // a flame
      cx.beginPath();
      cx.moveTo(p.x, cy - 6);
      cx.quadraticCurveTo(p.x + 5, cy - 1, p.x + 3.2, cy + 3);
      cx.quadraticCurveTo(p.x + 1.6, cy + 5.6, p.x - 1, cy + 5.6);
      cx.quadraticCurveTo(p.x - 4.6, cy + 4.4, p.x - 3.6, cy);
      cx.quadraticCurveTo(p.x - 2.6, cy - 3, p.x, cy - 6);
      cx.fill();
    }
    /* Under-equipped says so, every frame it is true. Being told the crew is
       out of its depth is the whole reason to buy the next rank of building. */
    if (short) {
      cx.font = '9px "Share Tech Mono", monospace'; cx.textAlign = 'center';
      cx.fillStyle = '#ff8f9c';
      cx.strokeStyle = 'rgba(10,12,24,0.65)'; cx.lineWidth = 3;
      const t = m.fam === 'med' ? 'NO DOCTOR' : 'NO CREW';
      cx.strokeText(t, p.x, cy - 17); cx.fillText(t, p.x, cy - 17);
    }
  }
}

/* =============================== weather & fx =============================== */
function weatherStep(dt) {
  if (snow.length < 90 && Math.random() < 0.5)
    snow.push({ x: Math.random() * W, y: -6, vx: 8 + Math.random() * 10, vy: 22 + Math.random() * 26, r: 1 + Math.random() * 1.6, ph: Math.random() * TAU });
  cx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = snow.length - 1; i >= 0; i--) {
    const s = snow[i];
    s.x += (s.vx + Math.sin(s.ph + s.y * 0.02) * 10) * dt;
    s.y += s.vy * dt;
    if (s.y > H + 4 || s.x > W + 8) { snow.splice(i, 1); continue; }
    cx.globalAlpha = 0.5 + 0.4 * Math.sin(s.ph);
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, TAU); cx.fill();
  }
  cx.globalAlpha = 1;
  for (let i = smoke.length - 1; i >= 0; i--) {
    const p = smoke[i];
    p.life += dt;
    if (p.life >= p.max) { smoke.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 4;
    const k = p.life / p.max;
    cx.fillStyle = 'rgba(210,215,228,' + (0.25 * (1 - k)) + ')';
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, TAU); cx.fill();
  }
  for (let i = chips.length - 1; i >= 0; i--) {
    const c = chips[i];
    c.life += dt;
    if (c.life >= c.max) { chips.splice(i, 1); continue; }
    c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 160 * dt;
    cx.fillStyle = c.c;
    cx.fillRect(c.x, c.y, 2.4, 2.4);
  }
  cx.font = '12px "Share Tech Mono", monospace'; cx.textAlign = 'center';
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life += dt / 1.1;
    if (f.life >= 1) { floats.splice(i, 1); continue; }
    cx.fillStyle = (f.bad ? 'rgba(255,138,150,' : 'rgba(255,214,140,') + (1 - f.life) + ')';
    cx.strokeStyle = 'rgba(10,12,24,' + 0.5 * (1 - f.life) + ')'; cx.lineWidth = 3;
    cx.strokeText(f.txt, f.x, f.y - f.life * 30);
    cx.fillText(f.txt, f.x, f.y - f.life * 30);
  }
}

/* =============================== lighting =============================== */
function drawLighting() {
  const amb = ambient();
  if (amb < 0.015) return;
  const lw = light.width, lh = light.height, k = LSCALE;
  lx.setTransform(1, 0, 0, 1, 0, 0);
  lx.globalCompositeOperation = 'source-over';
  lx.clearRect(0, 0, lw, lh);
  // darkness ramps in below the skyline (sky palette darkens itself)
  const g = lx.createLinearGradient(0, G.horizon * k * 0.5, 0, G.horizon * k * 1.15);
  g.addColorStop(0, 'rgba(10,14,40,0)');
  g.addColorStop(1, 'rgba(10,14,40,' + amb + ')');
  lx.fillStyle = g;
  lx.fillRect(0, 0, lw, G.horizon * k * 1.15);
  lx.fillStyle = 'rgba(10,14,40,' + amb + ')';
  lx.fillRect(0, G.horizon * k * 1.15, lw, lh);
  // punch light holes
  lx.globalCompositeOperation = 'destination-out';
  const punch = (x, y, r, a) => {
    const gg = lx.createRadialGradient(x * k, y * k, 0, x * k, y * k, r * k);
    gg.addColorStop(0, 'rgba(0,0,0,' + Math.min(1, a) + ')');
    gg.addColorStop(0.35, 'rgba(0,0,0,' + Math.min(1, a * 0.55) + ')');
    gg.addColorStop(0.7, 'rgba(0,0,0,' + Math.min(1, a * 0.18) + ')');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    lx.fillStyle = gg;
    lx.beginPath(); lx.arc(x * k, y * k, r * k, 0, TAU); lx.fill();
  };
  const I = FIRE.intensity, flick = 1 + Math.sin(FIRE.flick * 1.7) * 0.06 + Math.sin(FIRE.flick * 3.1) * 0.04;
  if (I > 0.02) punch(G.fire.x, G.fire.y - 6, (85 + 120 * I) * flick, Math.min(0.85, I));
  else if (FIRE.ember > 0.01) punch(G.fire.x, G.fire.y, 40 * FIRE.ember, FIRE.ember * 0.5);
  for (const m of motes) punch(m.x, m.y, 55 * (1 - m.life / m.max) + 18, 0.9 * (1 - m.life / m.max));
  for (const h of activeHomes()) if (h.lit) punch(h.winX, h.winY, 46, 0.75);
  for (const b of activeBiz()) if (b.lit) punch(b.winX, b.winY, 40, 0.7);
  for (const l of (G.lamps || [])) if (l.lit) punch(l.gx, l.gy, 62, 0.62);
  for (const m of MISH) if (m.fam === 'fire') punch(m.b.x, m.b.y - m.b.w * 0.6, 78, 0.7);
  cx.drawImage(light, 0, 0, W, H);
  // warm additive tint at the light sources
  cx.globalCompositeOperation = 'lighter';
  const tint = (x, y, r, a) => {
    const gg = cx.createRadialGradient(x, y, 0, x, y, r);
    gg.addColorStop(0, 'rgba(255,150,60,' + a + ')');
    gg.addColorStop(1, 'rgba(255,150,60,0)');
    cx.fillStyle = gg; cx.beginPath(); cx.arc(x, y, r, 0, TAU); cx.fill();
  };
  if (I > 0.02) tint(G.fire.x, G.fire.y - 6, (70 + 90 * I) * flick, 0.3 * I * (0.25 + amb));
  for (const m of motes) tint(m.x, m.y, 55, 0.14 * (1 - m.life / m.max) * (0.3 + amb));
  for (const h of activeHomes()) if (h.lit) tint(h.winX, h.winY, 30, 0.08);
  for (const b of activeBiz()) if (b.lit) tint(b.winX, b.winY, 26, 0.07);
  for (const l of (G.lamps || [])) if (l.lit) tint(l.gx, l.gy, 40, 0.10);
  for (const m of MISH) if (m.fam === 'fire') tint(m.b.x, m.b.y - m.b.w * 0.6, 62, 0.24 * (0.3 + amb));
  cx.globalCompositeOperation = 'source-over';
}

/* =============================== input =============================== */
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  audioInit();
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  /* Order matters, and it is the whole contract of a tap. The thief first — he
     is the smallest target and the one the player is hunting. Then incidents,
     BEFORE villagerAt: a hurt villager is the one villager whose tap is help
     rather than a chat bubble. Everything after this is unchanged. */
  if (tapThief(x, y)) return;
  if (tapMishap(x, y)) return;
  const vt = villagerAt(x, y);
  if (vt) { speak(vt); return; }           // villager taps never stoke; one bubble at a time
  const site = siteAt(x, y);               // MICROMANAGEMENT: direct the camp, or release it
  if (site) {
    S.focus = S.focus === site ? null : site;
    sfxPuff(); save();
    toast(S.focus ? 'EVERYONE ON ' + RES_ICON[site] + ' ' + S.focus.toUpperCase() : 'VILLAGERS CHOOSE FOR THEMSELVES');
    return;
  }
  const d = Math.hypot(x - G.fire.x, (y - G.fire.y) * 1.4);
  if (d <= G.hitR) { stoke(x, y, tapPower()); sfxTap(); }
  else { // a puff of kicked-up snow
    sfxPuff();
    for (let i = 0; i < 4; i++)
      smoke.push({ x, y, vx: (Math.random()-0.5)*26, vy: -12 - Math.random()*12, r: 2, life: 0, max: 0.7 });
  }
});

/* =============================== HUD & upgrades =============================== */
const $ = (id) => document.getElementById(id);
const muteBtn = $('mute-btn'), hintEl = $('hint'), clockEl = $('clock'), resEl = $('res-line');
const upgPanel = $('upg-panel'), upgList = $('upg-list'), upgBtn = $('upg-btn'), upgSub = $('upg-sub');
let hintTimer = 0;
function hint(msg) {
  hintEl.textContent = msg;
  hintEl.style.opacity = 1;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hintEl.style.opacity = 0; }, 5000);
}
let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function costStr(cost) {
  return Object.keys(cost).map(k =>
    '<span class="' + (S.res[k] >= cost[k] ? 'ok' : 'no') + '">' + RES_ICON[k] + ' ' + cost[k] + '</span>'
  ).join(' &nbsp;');
}
function canAfford(cost) { return Object.keys(cost).every(k => S.res[k] >= cost[k]); }
/* The ONE purchase path. The upgrade card calls it and so does the persona
   playtest harness (.claude/tests/eval-fire-clicker.cjs), so a headless run of
   the economy can never drift from what a real tap actually does. Returns
   whether the buy happened. Sound + panel rebuild stay with the card — they
   belong to the gesture, not to the transaction. */
function buyUpg(id) {
  const u = UPG.find(x => x.id === id);
  if (!u || !showU(u)) return false;
  const lvl = S.up[u.id] || 0, c = u.cost(lvl);
  if (lvl >= maxOf(u) || !canAfford(c)) return false;
  for (const k of Object.keys(c)) S.res[k] -= c[k];
  S.up[u.id] = lvl + 1;
  if (u.id === 'bunk' || u.id === 'keeper') syncVillagers();
  /* Which purchases move the scene is DERIVED, not listed. The old whitelist
     of five ids was already one stage behind the game by the time the second
     rung existed, and a missed id is invisible until someone notices a new
     building has no plot. A stage flip needs the full resize() rather than a
     relayout: houseW() changes, and the build district's top is measured off
     the tallest building standing in it. */
  const isStage = STAGES.some(st => st.id === u.id);
  if (isStage) { resize(); }
  else if (u.id === 'house' || bizDef(u.id)) { layoutBuildings(); bakeGround(); }
  if (u.id === 'keeper') toast('A FIREKEEPER TENDS THE FLAMES');
  if (u.id === 'micro') hint('Tap the trees, the rocks or the fishing hole to send everyone there. Tap it again to release them.');
  if (u.id === 'bellows') toast('THE BELLOWS BREATHE');
  if (isStage) { toast('THIS IS NOW A ' + stageName()); hint(HEARTH_HINT[stage().hearth]); }
  else if (bizDef(u.id)) toast(nameOf(u) + ' IS OPEN');
  save();
  return true;
}
function evolve() {
  if (!canEvolve()) return false;
  const best = Math.max(S.bestReach, S.gathered);
  /* Exactly four things cross the reset, and three of them are the mark.
     Anything else surviving would make the next run not a fresh camp — the
     whole cost the bonus is paid for. */
  const carry = { bestReach: best, embers: embersFor(best), evolutions: S.evolutions + 1, muted: S.muted };
  S = Object.assign(freshState(), carry);
  /* The scene is rebuilt from nothing rather than adjusted: villagers hold
     references to HOMES entries and to numbered seats, and a stale reference
     is how a villager ends up walking to a house that no longer exists. */
  villagers.length = 0;
  MISH.length = 0; THIEF = null; mishT = 40;   // incidents belong to the run that was
  HOMES.length = 0;
  for (const k of Object.keys(BIZ)) delete BIZ[k];
  seatTaken.fill(false);
  FIRE.burning = false; FIRE.intensity = 0; FIRE.ember = 0;
  resize();
  syncVillagers();
  save();
  toast('EVOLVED \u2014 ' + carry.embers + ' EMBER' + (carry.embers === 1 ? '' : 'S'));
  hint('The settlement is gone; the embers are not. Everything hauled from here on comes in '
       + Math.round(emberMul() * 100 - 100) + '% bigger armfuls than on your first night.');
  return true;
}
/* The evolve banner. Deliberately NOT a card in the list: it is the one
   irreversible action in the game, and a row that looks like every other row
   is a row someone taps by reflex on the way to RECRUIT VILLAGER. It states
   what the run would bank BEFORE asking, and the confirm is a second, separate
   tap on a button that only exists after the first. */
function buildEvolveBox() {
  const box = $('evolve-box');
  if (!canEvolve()) { box.hidden = true; evolveArmed = false; return; }
  box.hidden = false;
  const gain = evolveGain(), after = S.embers + gain;
  box.innerHTML =
    '<div class="ev-now">\u2726 ' + S.embers + ' ember' + (S.embers === 1 ? '' : 's') +
      ' \u00b7 +' + Math.round(emberMul() * 100 - 100) + '% haul' +
      (S.evolutions ? ' \u00b7 ' + S.evolutions + ' evolution' + (S.evolutions === 1 ? '' : 's') : '') + '</div>' +
    '<div class="ev-gain">' + (gain > 0
      ? 'This run is your deepest yet: evolving banks <b>+' + gain + '</b> \u2192 \u2726 ' + after +
        ' (+' + Math.round(after * 10) + '% haul).'
      : 'This run has not beaten your best reach yet, so evolving now would bank <b>nothing</b>. ' +
        'Push further than \u2726 ' + fmtBig(S.bestReach) + ' hauled to earn the next ember.') + '</div>' +
    (evolveArmed
      ? '<button id="ev-go" class="ev-btn ev-danger">START OVER \u2014 KEEP \u2726 ' + after + '</button>' +
        '<button id="ev-no" class="ev-btn">CANCEL</button>'
      : '<button id="ev-arm" class="ev-btn">EVOLVE\u2026</button>');
  const arm = $('ev-arm'), go = $('ev-go'), no = $('ev-no');
  if (arm) arm.addEventListener('click', () => { evolveArmed = true; buildEvolveBox(); });
  if (no)  no.addEventListener('click',  () => { evolveArmed = false; buildEvolveBox(); });
  if (go)  go.addEventListener('click',  () => { evolveArmed = false; if (evolve()) buildUpgPanel(); });
}
let evolveArmed = false;
/* Reach numbers run to the millions, and a raw integer that long is unreadable
   at 0.56rem on a phone. */
function fmtBig(v) {
  if (v >= 1e9) return (v / 1e9).toFixed(1) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'k';
  return Math.floor(v) + '';
}
function buildUpgPanel() {
  buildEvolveBox();
  upgList.innerHTML = '';
  upgSub.textContent = stageName() + ' · ' + villagers.filter(v => !v.keeper).length + '/' + (houses() * 5) +
    ' villagers in ' + houses() + ' house' + (houses() > 1 ? 's' : '') +
    ' \u00b7 ' + fmtBig(S.gathered) + ' hauled this run' +
    (S.up.keeper ? ' + ' + S.up.keeper + ' firekeeper' + (S.up.keeper > 1 ? 's' : '') : '') +
    ' · they only work while the fire burns';
  for (const u of UPG) {
    if (!showU(u)) continue;
    const lvl = S.up[u.id], maxed = lvl >= maxOf(u);
    const el = document.createElement('button');
    el.className = 'up-card' + (maxed ? ' maxed' : '');
    el.dataset.uid = u.id;
    const cost = maxed ? null : u.cost(lvl);
    el.innerHTML =
      '<div class="ui">' + u.i + '</div>' +
      '<div class="um"><div class="un">' + nameOf(u) + '</div>' +
      '<div class="ud">' + (maxed ? 'Fully upgraded.' : u.d(lvl)) + '</div>' +
      (maxed ? '' : '<div class="uc">' + costStr(cost) + '</div>') + '</div>' +
      '<div class="ul">' + (maxed ? 'MAX' : 'Lv ' + lvl) + '</div>';
    if (!maxed) {
      if (canAfford(cost)) el.classList.add('afford');
      el.addEventListener('click', () => {
        if (!buyUpg(u.id)) return;
        audioInit(); sfxBuy();
        buildUpgPanel();
      });
    }
    upgList.appendChild(el);
  }
}
function setPanelOpen(open) {
  upgPanel.classList.toggle('open', open);
  upgBtn.innerHTML = open ? '&#10005; CLOSE' : '&#128296; UPGRADES';
  if (open) buildUpgPanel();
}
upgBtn.addEventListener('click', () => { audioInit(); setPanelOpen(!upgPanel.classList.contains('open')); });
$('upg-close').addEventListener('click', () => setPanelOpen(false));
muteBtn.addEventListener('click', () => { audioInit(); setMuted(!S.muted); });
let hudAcc = 0;
function refreshHUD() {
  const mark = (k) => (S.focus === k ? '\u25B8' : '') + RES_ICON[k] + ' ' + Math.floor(S.res[k]);
  resEl.innerHTML = mark('wood') + ' &nbsp;' + mark('stone') + ' &nbsp;' + mark('food');
  clockEl.textContent = stageName() + ' · DAY ' + S.day + ' · ' + phaseName(S.dayT);
  const any = UPG.some(u => showU(u) && S.up[u.id] < maxOf(u) && canAfford(u.cost(S.up[u.id])));
  upgBtn.classList.toggle('pulse', any && !upgPanel.classList.contains('open'));
  if (upgPanel.classList.contains('open')) {
    // keep affordability states live without rebuilding buttons mid-press
    for (const el of upgList.children) {
      const u = UPG.find(x => x.id === el.dataset.uid); if (!u) continue;
      const lvl = S.up[u.id];
      if (lvl < maxOf(u)) {
        const cost = u.cost(lvl);
        el.classList.toggle('afford', canAfford(cost));
        const uc = el.querySelector('.uc');
        if (uc) uc.innerHTML = costStr(cost);
      }
    }
  }
}

/* =============================== main loop =============================== */
let last = performance.now(), saveAcc = 0, healAcc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  // self-heal: iOS can hand every rotation event a stale box and then never
  // fire again — re-measure a few times a second and relayout on any
  // disagreement (a strict no-op once settled)
  healAcc += dt;
  if (healAcc > 0.2) {
    healAcc = 0;
    const vb = viewBox();
    if (Math.abs(vb.w - W) > 1 || Math.abs(vb.h - H) > 1) resize();
  }
  dayStep(dt);
  fireStep(dt);
  syncVillagers();
  for (const v of villagers) villagerStep(v, dt);
  mishapStep(dt);

  drawSky();
  drawBackdrop();
  drawHole();
  // one y-sorted painter list so villagers pass in front of and behind buildings
  const items = [];
  for (const h of activeHomes()) items.push({ y: h.y, d: () => drawHouse(h) });
  for (const b of activeBiz()) items.push({ y: b.y, d: () => drawBiz(b) });
  for (const l of (G.lamps || [])) items.push({ y: l.y, d: () => drawLamp(l) });
  for (const t of G.treeItems) items.push({ y: t.y + 2, d: () => drawTree(t) });
  for (const r of G.rockItems) items.push({ y: r.y, d: () => drawRock(r) });
  items.push({ y: G.stock.y + 2, d: drawStock });
  items.push({ y: G.fire.y + 2, d: drawFirePit });
  for (const s of G.seats) items.push({ y: s.y + 4, d: () => drawSeat(s) });
  for (const v of villagers) if (v.state !== 'inside') items.push({ y: v.y, d: () => drawVillager(v) });
  for (const m of MISH) if (m.fam === 'fire') items.push({ y: m.b.y + 1, d: () => drawBlazeFx(m) });
  if (THIEF) items.push({ y: THIEF.y, d: drawThief });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.d();
  fireParticles(dt);
  weatherStep(dt);
  drawLighting();
  drawMishapMarks();
  drawFocus();
  drawBankRing();
  drawBubble(dt);

  hudAcc += dt;
  if (hudAcc > 0.25) { hudAcc = 0; refreshHUD(); }
  saveAcc += dt;
  if (saveAcc > 5) { saveAcc = 0; save(); }
  requestAnimationFrame(frame);
}

/* =============================== boot =============================== */
load();
resize();
setTimeout(resize, 120);
syncVillagers();
setMuted(S.muted);
refreshHUD();
if (S.lifeWarm > 10) hint('Welcome back. The fire is ' + (S.bank > 0 ? 'still burning.' : 'cold again — tap to relight it.'));
requestAnimationFrame(frame);
</script>
</body>
</html>
