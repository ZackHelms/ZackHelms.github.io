<script>
'use strict';
/* =============================== constants =============================== */
const DAY_LEN = 300;               // one full in-game day, seconds
const SAVE_KEY = 'fireClicker.v2';
const TAU = Math.PI * 2;

/* upgrades: cost = base * growth^lvl, per-resource. `max` may be a number or
   a function; `show()` gates stage-locked entries out of the panel. */
/* ---------------------------- LADDER-SPEC-BEGIN ----------------------------
   Everything between these markers is the SETTLEMENT SPEC: the civic ladder,
   the stage table, and the whole upgrade catalogue. `.claude/tests/eval-fire-clicker.cjs`
   slices it out by these markers and evaluates it in Node, so the pacing model
   prices the real cost curves rather than a copy that rots. Two rules follow:
   the span must resolve using only the handful of primitives the eval injects
   (fmtS, maxBank, tapPower, drainRate, roarBonus, S), and nothing outside it
   may be referenced by a card's `max`, `show` or `cost` — a `d:` blurb may
   reference anything, because the model never calls one.
   ------------------------------------------------------------------------- */
/* Civic buildings. `at` lists the stage index that opens each LEVEL, which is
   what turns a chain into ONE card that upgrades a building in place — same
   corner, smarter building, stronger effect — instead of a new card and a new
   plot per rung. Two front rows, because six of them do not fit in one. */
const BIZ_DEFS = [
  { id: 'tavern',    fx: 0.15, fd: 0.78, at: [1]       },
  { id: 'shop',      fx: 0.50, fd: 0.78, at: [1]       },
  { id: 'sawbones',  fx: 0.85, fd: 0.78, at: [1, 2]    },
  { id: 'school',    fx: 0.15, fd: 0.99, at: [2, 3, 4] },
  { id: 'constable', fx: 0.50, fd: 0.99, at: [2, 3]    },
  { id: 'marshal',   fx: 0.85, fd: 0.99, at: [2, 3]    },
];

/* ============================ THE STAGE LADDER ============================
   Everything that changes with civic scale reads off THIS table rather than
   testing S.up.village. A binary cannot express five rungs, and a scatter of
   `if (S.up.city)` tests is how a settlement ends up modern in three places
   and medieval in a fourth. A stage owns how many houses fit, what a house is
   made of, what the HEARTH is, how the ground is surfaced, how the streets
   are drawn, and how brightly they are lit at night. Adding a sixth rung
   should be one row here plus one case in each painter's switch. */
const STAGES = [
  { id:null,         n:'CAMP',       cap:5,  walls:'straw',  hearth:'campfire', ground:'snow',   paths:'none',    lamps:0 },
  { id:'village',    n:'VILLAGE',    cap:10, walls:'timber', hearth:'stove',    ground:'snow',   paths:'trodden', lamps:0 },
  { id:'town',       n:'TOWN',       cap:16, walls:'brick',  hearth:'furnace',  ground:'packed', paths:'road',    lamps:1 },
  { id:'city',       n:'CITY',       cap:24, walls:'block',  hearth:'steam',    ground:'paved',  paths:'grid',    lamps:2 },
  { id:'metropolis', n:'METROPOLIS', cap:32, walls:'tower',  hearth:'core',     ground:'plaza',  paths:'grid',    lamps:3 },
];
/* The highest stage actually founded. Walks the whole table instead of
   stopping at the first miss, so a save that somehow skipped a rung still
   reports what it really is rather than silently reverting to a camp. */
function stageIx()  { let i = 0; for (let k = 1; k < STAGES.length; k++) if (S.up[STAGES[k].id]) i = k; return i; }
function stage()    { return STAGES[stageIx()]; }
function stageName(){ return stage().n; }
function stageMaxHouses() { return stage().cap; }
function houses()   { return Math.min(2 + (S.up.house || 0), stageMaxHouses()); }

/* Each rung costs this much more than the one below it. One constant, because
   the whole point of the ladder is that it is geometric: a stage you can grind
   out in the same session as the last one is not a stage, it is a purchase. */
const STAGE_STEP = 11;
/* What the player is told when the hearth itself changes. The fire is the one
   thing they have touched every second of the run, so a stage that rebuilds it
   deserves a sentence rather than a silent re-skin. */
const HEARTH_HINT = {
  campfire: 'A ring of stones and a lick of flame.',
  stove:    'The fire is boxed into a cast-iron STOVE. Same flame, less of it lost to the snow.',
  furnace:  'The stove is bricked up into a FURNACE. It roars behind an iron door now.',
  steam:    'The furnace drives a STEAM PLANT — boiler, piping, and a stack over the rooftops.',
  core:     'A HIGH-TECH CORE. The same fire you struck with your thumb, behind glass.',
};
/* A civic building's cost climbs on the same step as the stage that unlocks
   its next level, so upgrading a hut in place stays priced against the rung
   you are standing on rather than the one where you first built it. */
function scaleBiz(base, l) {
  const m = Math.pow(STAGE_STEP, l);
  const out = {}; for (const k of Object.keys(base)) out[k] = Math.round(base[k] * m);
  return out;
}
/* How many levels of a civic building the CURRENT stage has unlocked, and
   whether its card should be on the panel at all. `at` on each BIZ_DEFS entry
   lists the stage index that opens each level, so the sawbones hut's second
   level (the doctor's office) appears at TOWN and not before. */
function bizDef(id)   { return BIZ_DEFS.find(b => b.id === id); }
function bizMax(id)   { const ix = stageIx(); return bizDef(id).at.filter(a => a <= ix).length; }
function bizShown(id) { return stageIx() >= bizDef(id).at[0]; }
/* Every civic building a given rung offers is built to the level that rung
   allows — the second half of a FOUND card's gate. */
function bizReady(k)  { return BIZ_DEFS.every(b => (S.up[b.id] || 0) >= b.at.filter(a => a <= k).length); }

/* ============================== MISHAPS ==============================
   Accidents, crimes and fires — the layer that turns every service building
   from a flat multiplier into INSURANCE. What can go wrong is decided by what
   you have BUILT, which is the CD's "dramatically appropriate" rule: a village
   with a sawbones hut gets gashes; a metropolis with a containment core gets
   plasma burns and drone heists.

   Three rules hold the system together, and all three are why this is a table
   rather than three hand-written events:

   1. ONE incident model, three skins. Every mishap is a work bar — `work`
      response-seconds, closed at mishapRate() per second by whichever civic
      building answers it, and a player tap closes MISHAP_TAP of it. That is
      "tapping the disaster expedites recovery, better buildings recover
      faster" stated once instead of three times, and it is why adding a
      fourth family later is a row here plus one painter.
   2. The LADDER escalates it. Each family lists one row per rung and the
      HIGHEST row the settlement has reached is the one that fires — the same
      shape as BIZ_DEFS[].at. A town gets a burglar where a village got a kid
      with a sack, and the rank of law it takes to catch him rises with him.
   3. Mishaps start at VILLAGE. A four-hut camp has nothing worth stealing, no
      business to burn, and no slack to absorb an idle villager. Gating on
      stageIx() >= 1 also leaves the measured pacing to FOUND VILLAGE — the
      first milestone the eval reports — untouched by this whole system.

   `need` is the LEVEL of the answering building the incident demands.
   Under-equipped is slow-but-possible for medicine and fire (villagers
   improvise with snow, a splint and a bucket line). For CRIME it is a hard
   gate, by CD spec: without a constable of the right rank the thief cannot be
   caught at all, and a tap on him produces a villager explaining why. */
const MISHAP_FAM = {
  med:   { svc:'sawbones',  icon:'\u{1FA79}', n:'INJURY' },
  crime: { svc:'constable', icon:'\u{1F977}', n:'THEFT'  },
  fire:  { svc:'marshal',   icon:'\u{1F525}', n:'BLAZE'  },
};
/* `at` is the stage index at which a row becomes its family's incident.
   `work` is response-seconds. Crime has none — a thief is a chase, not a bar —
   and carries `grabs`/`cut` instead: how many times he dips into the
   stockpile and what share of it he lifts each time. */
const MISHAPS = [
  { id:'gash',    fam:'med',   at:1, need:0, n:'DEEP GASH',        work:14 },
  { id:'fever',   fam:'med',   at:2, need:1, n:'WINTER FEVER',     work:22 },
  { id:'crush',   fam:'med',   at:3, need:1, n:'CRUSH INJURY',     work:30 },
  { id:'burns',   fam:'med',   at:4, need:2, n:'PLASMA BURNS',     work:40 },
  { id:'sneak',   fam:'crime', at:1, need:0, n:'SNOW SNEAK',       grabs:3, cut:0.035 },
  { id:'burglar', fam:'crime', at:2, need:1, n:'BURGLAR',          grabs:4, cut:0.040 },
  { id:'runner',  fam:'crime', at:3, need:1, n:'SYNDICATE RUNNER', grabs:5, cut:0.045 },
  { id:'heist',   fam:'crime', at:4, need:2, n:'DRONE HEIST',      grabs:6, cut:0.050 },
  { id:'cinder',  fam:'fire',  at:1, need:0, n:'ROOF CINDER',      work:16 },
  { id:'blaze',   fam:'fire',  at:2, need:1, n:'ROOF BLAZE',       work:26 },
  { id:'boiler',  fam:'fire',  at:3, need:1, n:'BOILER FLASH',     work:34 },
  { id:'flare',   fam:'fire',  at:4, need:2, n:'CORE FLARE',       work:44 },
];
const MISHAP_W   = { med:3, crime:2, fire:2 };  // relative frequency of each family
const MISHAP_TAP = 0.10;                        // a player tap closes this much of a work bar
/* THE GRAB CEILING, and the one number in this file that came out of a
   measurement rather than a guess. A thief takes `cut` of the STOCKPILE, which
   is the right feel — an early sack is a tenth of everything you own — but a
   share of a hoard is an UNBOUNDED tax on saving, and saving is exactly what
   an expensive FOUND card demands. Measured, uncapped: a hands-off player's
   TOWN slipped 16% and CITY went from eight hours to unreachable, because a
   thief every couple of minutes compounds against a pile that is being held
   rather than spent. So a grab is also capped at THIEF_GRAB armfuls per
   villager — a fraction of ONE gather cycle of the settlement's own output —
   which keeps the early thief dramatic (the cut binds while the pile is small)
   and the late one survivable (the cap binds once it is not). */
const THIEF_GRAB = 0.7;
function thiefGrabCap(pop, yld) { return Math.max(1, THIEF_GRAB * pop * yld / 3); }   // per resource
/* Three constants the analytic model needs and the running game cannot hand
   it: the measured gather cycle (the eval prints `cycle measured / model` on
   every browser run — keep this next to it), roughly how many seconds of
   production sit in the stockpile at any moment, and what share of throughput
   one burning business costs while its effect is off. All three are estimates,
   and all three are checked the only way estimates can be: MODEL vs SIM. */
const MISHAP_CYCLE = 12, MISHAP_HOLD = 200, MISHAP_BIZ_WORTH = 0.12;
function mishapFor(fam) { let m = null; for (const k of MISHAPS) if (k.fam === fam && k.at <= stageIx()) m = k; return m; }
/* Mean seconds between incidents. It tightens as the settlement grows — more
   going on, more to go wrong — but gently, because SEVERITY is what really
   escalates and a metropolis should feel busy, not besieged. */
function mishapMTBF() { return 105 / (1 + stageIx() * 0.45); }
/* Work-seconds closed per second by the responding building. A better
   building recovers faster (the CD's rule, and the reason the doctor's office
   is worth its price); under-equipped is a 2.5x penalty rather than a wall. */
function mishapRate(k, lvl) { return lvl >= k.need ? 1 + 0.6 * (lvl - k.need) : 0.4; }
/* The expected throughput multiplier under mishaps, for a player who taps them
   down (`tended`) and one who never does. This is the ONE function the pacing
   model in .claude/tests/eval-fire-clicker.cjs reads, which is exactly why it
   lives inside the spec span next to the cost curves: a mishap tax the model
   did not know about would silently rot every milestone it reports. */
function mishapDrag(tended, pop) {
  if (stageIx() < 1) return 1;
  const T = mishapMTBF(), wTot = MISHAP_W.med + MISHAP_W.crime + MISHAP_W.fire;
  const lvl = (id) => S.up[id] || 0;
  /* A player watching an incident lands roughly six taps into it before the
     crew would have finished on their own, which is most of a short bar and a
     useful dent in a long one. */
  const quick = 1 / Math.max(0.25, 1 - MISHAP_TAP * 6);
  let loss = 0;
  const med = mishapFor('med');
  if (med) {   // one villager idle for the length of the bar
    const dur = med.work / mishapRate(med, lvl('sawbones')) / (tended ? quick : 1);
    loss += (MISHAP_W.med / wTot) * (dur / Math.max(1, pop)) / T;
  }
  const cr = mishapFor('crime');
  if (cr) {
    /* A caught thief hands everything back, so the loss is the chance of NOT
       catching him: certain for a tending player who has the rank, and only
       the constable's own slim detection odds for anyone else. */
    const caught = (tended && lvl('constable') >= cr.need) ? 1 : Math.min(0.3, 0.12 * lvl('constable'));
    /* The same min() the grab itself takes, in seconds-of-production: the
       share of a typical hoard, or the ceiling, whichever is smaller. */
    const take = Math.min((1 - Math.pow(1 - cr.cut, cr.grabs)) * MISHAP_HOLD,
                          cr.grabs * THIEF_GRAB * MISHAP_CYCLE);
    loss += (MISHAP_W.crime / wTot) * (1 - caught) * take / T;
  }
  const fi = mishapFor('fire');
  if (fi) {   // one business's effect off for the length of the bar
    const dur = fi.work / mishapRate(fi, lvl('marshal')) / (tended ? quick : 1);
    loss += (MISHAP_W.fire / wTot) * MISHAP_BIZ_WORTH * dur / T;
  }
  return 1 - Math.min(0.45, loss);
}

const UPG = [
  { id:'pit',    i:'\u{1F525}', n:'FIRE PIT',     max:8,
    d:(l)=>'Deeper stone pit banks more burn time, and holds a ROARING fire nearer the top between taps. Max bank: ' + fmtS(maxBank()) + ' → ' + fmtS(5 + (l+1)*5) + '.',
    cost:(l)=>({ stone: Math.round(8 * Math.pow(1.8, l)) }) },
  { id:'tinder', i:'\u{1FAB5}', n:'DRY TINDER',   max:8,
    d:(l)=>'Seasoned wood catches better. Each tap banks ' + fmtS(tapPower()) + ' → ' + fmtS(1 + (l+1)*0.5) + '.',
    cost:(l)=>({ wood: Math.round(10 * Math.pow(1.8, l)) }) },
  { id:'wind',   i:'\u{1F6A7}', n:'WINDBREAK',    max:5,
    d:(l)=>'Snow fencing shelters the flames. Fire burns ' + Math.round((1-drainRate())*100) + '% → ' + Math.round((1-(1/(1+(l+1)*0.09)))*100) + '% slower.',
    cost:(l)=>({ wood: Math.round(14 * Math.pow(1.9, l)), stone: Math.round(8 * Math.pow(1.9, l)) }) },
  /* Gated on the first ROAR. The bonus exists at bellows Lv0 (roarBonus(0)
     is +10%), so any player who taps a fresh 5-second bank to the brim earns
     it inside the first few seconds and unlocks the card that deepens it. A
     player who has NOT felt the mechanic cannot buy the multiplier on it —
     BELLOWS was the game's one trap card, expensive and inert for someone
     letting the firekeeper smoulder. `S.up.bellows > 0` keeps the card
     visible for saves written before S.roared existed. */
  /* BELLOWS' ceiling GROWS with the settlement (6/9/12/15/18). The roaring
     fire is the game's skill lever — the one bonus the firekeeper structurally
     cannot earn — and a fixed +70% cap was worth 2.1x against naive play in a
     village and only 1.33x once schools, a doctor and the ember bonus were
     multiplying everything else. A skill lever has to scale with the economy
     it is a lever ON, or effort quietly stops mattering exactly as the numbers
     get big. Thematically it is also the right shape: a bigger hearth takes a
     bigger bellows. */

/* =============================== state =============================== */
function freshState() {
  return {
    res: { wood: 0, stone: 0, food: 0 },
    up: Object.fromEntries(UPG.map(u => [u.id, 0])),
    bank: 0,             // seconds of burn banked
    focus: null,         // MICROMANAGEMENT: 'wood'|'stone'|'food', or null for the villagers' own choice
    day: 1, dayT: 0.16,  // start mid-morning
    lifeWarm: 0,         // lifetime warm-seconds
    roared: false,       // has the fire ever ROARED? gates the BELLOWS card
    gathered: 0,         // THIS RUN's total resources hauled — the reach metric
    stolen: 0, caught: 0,// mishap scoreboard: what thieves took this run, and how many were caught
    /* These three survive an evolution; freshState() only supplies the floor
       for a save that predates them. evolve() carries them across by hand. */
    bestReach: 0, embers: 0, evolutions: 0,
    muted: false, lastSave: Date.now(),
  };
}
let S = freshState();
function save() { S.lastSave = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try { localStorage.removeItem('fireClicker.v1'); } catch (e) {}
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {}
  if (!raw) return;
  let d; try { d = JSON.parse(raw); } catch (e) { return; }
  if (!d || typeof d !== 'object') return;
  const f = freshState();
  S = f;
  if (d.res && typeof d.res === 'object') for (const k of ['wood','stone','food']) S.res[k] = Math.max(0, +d.res[k] || 0);
  if (d.up && typeof d.up === 'object') for (const u of UPG) S.up[u.id] = Math.max(0, Math.floor(+d.up[u.id] || 0));
  for (const u of UPG) S.up[u.id] = Math.min(maxOf(u), S.up[u.id] || 0); // clamp after ALL load (maxes depend on stage/houses)
  S.bank = Math.max(0, Math.min(200, +d.bank || 0));
  S.focus = (S.up.micro && ['wood','stone','food'].includes(d.focus)) ? d.focus : null;
  S.day = Math.max(1, Math.floor(+d.day || 1));
  S.dayT = (+d.dayT >= 0 && +d.dayT < 1) ? +d.dayT : 0.16;
  S.lifeWarm = Math.max(0, +d.lifeWarm || 0);
  S.roared = !!d.roared || S.up.bellows > 0;
  S.gathered = Math.max(0, +d.gathered || 0);
  S.stolen = Math.max(0, +d.stolen || 0);
  S.caught = Math.max(0, Math.floor(+d.caught || 0));
  S.bestReach = Math.max(0, +d.bestReach || 0);
  S.evolutions = Math.max(0, Math.floor(+d.evolutions || 0));
  /* Embers are RECOMPUTED from the stored high-water mark rather than loaded.
     A saved total could disagree with the reach that earned it — through a
     tuning change to the curve, a partial write, or an edited save — and the
     mark is the thing the design is actually about. */
  S.embers = embersFor(S.bestReach);
  S.muted = !!d.muted;
}
function maxBank()  { return 5 + S.up.pit * 5; }
function tapPower() { return 1 + S.up.tinder * 0.5; }
/* The fire marshal is a SECOND term in the same denominator as WINDBREAK
   rather than a multiplier on it, so the two stack the way a player reads
   them ("15% slower") instead of compounding into something neither card
   claims. */
/* THE ONE READ of a civic building's level. A building that is on fire is not
   doing its job, so a blaze costs the settlement the EFFECT and not just a
   pretty animation — and routing every rate through here is what keeps that
   true for a building added later. Everything below reads bizLvl(), never
   S.up[id], for anything BIZ_DEFS owns. */
function bizLvl(id)  { const b = BIZ[id]; return (b && b.dmg) ? 0 : (S.up[id] || 0); }
function drainRate(){ return 1 / (1 + S.up.wind * 0.09 + bizLvl('marshal') * 0.18); }
/* Embers multiply YIELD rather than speed. Speed was the obvious place — it
   is where the roaring bonus lives — but at +900% the villagers sprint, and a
   camp of blurring dots is a worse read than a camp hauling bigger armfuls.
   Yield is also the lever both halves of the pacing eval already understand. */
function tripYield(){ return (1 + S.up.tools + (bizLvl('shop') ? 1 : 0) + bizLvl('school')) * emberMul(); }
/* Walk and work speed, named once so the villager loop, the card copy and the
   pacing eval can never disagree about what a building is worth. */
function walkMul()  { return (bizLvl('tavern') ? 1.15 : 1) * (1 + bizLvl('constable') * 0.10); }
function workTime() { return [3.2, 2.4, 2.0][bizLvl('sawbones')]; }
/* ROARING FIRE — the reward for tending the fire yourself. Above ROAR_AT of a
   full bank the extra heat energises the camp: villagers dawdle less, walk
   faster and work faster, all through ONE multiplier so the effect stays a
   clean scale on the gather cycle (and so the analytic model in
   .claude/tests/eval-fire-clicker.cjs can express it as one term). The
   FIREKEEPER deliberately cannot produce it: it only stokes below 35% of the
   bank, so an auto-tended fire never reaches the threshold. Effort is what
   makes the fire roar. */
const ROAR_AT = 0.75;
function heat()      { return S.bank / Math.max(1e-6, maxBank()); }
function roaring()   { return FIRE.burning && heat() >= ROAR_AT; }
function roarBonus(l){ return 0.1 + 0.1 * (l === undefined ? S.up.bellows : l); }
/* The bonus RAMPS across the top quarter of the bank rather than snapping on:
   half of roarBonus() at the ROAR_AT line, all of it at a brimming bank. Two
   reasons. It kills a knife-edge — under a cliff, 74.9% and 75.1% of the bank
   were a whole multiplier apart, so the dial had one meaningful pixel. And it
   gives FIRE PIT a throughput price: a hand-tapped fire sawtooths between
   maxBank() - tapPower() and maxBank(), so a DEEPER pit is a SHALLOWER sawtooth
   in fractional terms, which lifts the mean scale toward 1. */
function roarScale() { return 0.5 + 0.5 * Math.min(1, Math.max(0, (heat() - ROAR_AT) / (1 - ROAR_AT))); }
function roarNow()   { return roaring() ? roarBonus() * roarScale() : 0; }
function heatBoost() { return 1 + roarNow(); }
/* One desperate wood run brings back this many logs — see the DESPERATE WOOD
   RUN note in villagerStep for why one log is not enough. */
const FORAGE_ARMFUL = 8;
function popCap()   { return Math.min(4 + S.up.bunk, houses() * 5); }
/* ============================== EVOLUTION ==============================
   The prestige loop, on the Egg Inc shape. Two rules make it what it is.

   REACH is total resources GATHERED in a run — continuous, so a run that got
   "a bit further" banks something even when it did not reach a new stage.
   (Stage-reached has only five possible values; missing a rung by ten minutes
   would bank exactly nothing, which is the worst feeling a prestige layer can
   produce.)

   The bonus is a HIGH-WATER MARK, not an accumulation. Embers are a pure
   FUNCTION of the best reach ever, so evolving twice at the same depth adds
   nothing and only going further pays — the CD's rule stated directly. Because
   there is no running total, the count and the mark cannot drift apart, and
   retuning the curve below silently re-prices every past run correctly instead
   of leaving players on a total nobody can reproduce.

   The exponent is sublinear, as Egg Inc's soul eggs are: every 10x of reach is
   about 3.5x the embers. The stages cost x11 each, so a rung is worth roughly
   a doubling of the bonus — enough that the next run visibly flies through
   ground the last one crawled over, never so much that it trivialises it. */
const EMBER_BASE = 1200;   // reach that earns the first ember
const EMBER_EXP  = 0.55;
function embersFor(reach) { return Math.floor(Math.pow(Math.max(0, reach) / EMBER_BASE, EMBER_EXP)); }
function emberMul()   { return 1 + 0.10 * S.embers; }
function evolveGain() { return embersFor(Math.max(S.bestReach, S.gathered)) - S.embers; }
function canEvolve()  { return stageIx() >= 1; }   // a camp has nothing to bank yet
function fmtS(v)    { return (Math.round(v * 10) / 10) + 's'; }

/* =============================== audio =============================== */
let AC=null, sfxGain=null, musicGain=null, noiseBuf=null, windGain=null, crackleGain=null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  sfxGain = AC.createGain(); sfxGain.gain.value = S.muted ? 0 : 0.5; sfxGain.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = S.muted ? 0 : 0.34; musicGain.connect(AC.destination);
  const len = AC.sampleRate * 2;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const ch = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  // wind bed (always on, colder-sounding at night)
  const wsrc = AC.createBufferSource(); wsrc.buffer = noiseBuf; wsrc.loop = true;
  const wlp = AC.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 420; wlp.Q.value = 0.4;
  windGain = AC.createGain(); windGain.gain.value = 0.05;
  wsrc.connect(wlp); wlp.connect(windGain); windGain.connect(musicGain); wsrc.start();
  const lfo = AC.createOscillator(), lg = AC.createGain();
  lfo.frequency.value = 0.13; lg.gain.value = 0.03;
  lfo.connect(lg); lg.connect(windGain.gain); lfo.start();
  // fire crackle bed, gain tied to fire intensity each frame
  const csrc = AC.createBufferSource(); csrc.buffer = noiseBuf; csrc.loop = true; csrc.playbackRate.value = 0.7;
  const cbp = AC.createBiquadFilter(); cbp.type = 'bandpass'; cbp.frequency.value = 1400; cbp.Q.value = 0.8;
  crackleGain = AC.createGain(); crackleGain.gain.value = 0;
  csrc.connect(cbp); cbp.connect(crackleGain); crackleGain.connect(musicGain); csrc.start();
  scheduleMusic();
}
const SCALE = [0, 2, 3, 7, 10, 12, 14]; // wintry minor-ish
function scheduleMusic() {
  let next = AC.currentTime + 1.5;
  setInterval(() => {
    if (!AC) return;
    while (next < AC.currentTime + 0.25) {
      if (Math.random() < 0.30) {
        const f = 196 * Math.pow(2, SCALE[Math.floor(Math.random() * SCALE.length)] / 12) * (Math.random() < 0.25 ? 2 : 1);
        const t = next;
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.07, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
        o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 1.9);
      }
      next += 0.9;
    }
  }, 120);
}
function sfxNoise(freq, q, dur, vol, rate) {
  if (!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = rate || 1;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(sfxGain);
  src.start(t); src.stop(t + dur + 0.02);
}
function sfxTap()   { sfxNoise(2400 + Math.random() * 1200, 2.5, 0.07, 0.3, 1.4); sfxNoise(700, 1, 0.12, 0.18, 0.8); }
function sfxPuff()  { sfxNoise(500, 0.8, 0.1, 0.1, 0.6); }
function sfxLog()   { sfxNoise(320, 1.5, 0.16, 0.28, 0.5); sfxNoise(1800, 2, 0.1, 0.14, 1.2); }
function sfxBuy()   {
  if (!AC) return;
  [392, 523].forEach((f, i) => {
    const t = AC.currentTime + i * 0.09;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + 0.2);
  });
}
function setMuted(m) {
  S.muted = m;
  muteBtn.textContent = m ? '\u{1F507}' : '\u{1F50A}';
  if (sfxGain) sfxGain.gain.value = m ? 0 : 0.5;
  if (musicGain) musicGain.gain.value = m ? 0 : 0.34;

}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (AC) AC.suspend(); save(); }
  else if (AC && !S.muted) AC.resume();
});

/* =============================== canvas & layout =============================== */
const cv = document.getElementById('scene');
const cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const light = document.createElement('canvas');   // low-res darkness layer
const lx = light.getContext('2d');
const LSCALE = 0.34;
let G = {}; // scene geometry anchors
/* Lay out in the canvas's OWN box, never window.inner*. Pointer coords are
   resolved against that box, and on iOS the two disagree after a rotation
   (Safari's chrome): sizing the scene from innerHeight while the box is
   shorter squashes the drawing upward while the hit tests stay put — that
   was the "fire tap area has moved down in landscape" bug. */
function viewBox() {
  const r = cv.getBoundingClientRect();
  return { w: r.width || window.innerWidth, h: r.height || window.innerHeight };
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const vb = viewBox();
  W = vb.w; H = vb.h;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  light.width = Math.max(1, Math.round(W * LSCALE));
  light.height = Math.max(1, Math.round(H * LSCALE));
  const land = W > H;
  G.horizon = H * (land ? 0.30 : 0.22);
  /* ================= THE TWO DISTRICTS =================
     The ground is banded, and EVERY placement derives from the bands rather
     than from its own fraction of H. One rule holds the whole layout together:
     nothing is ever BUILT in the work band, because that band is the corridor
     villagers walk between the stockpile and the three sites. Canvas has no
     collision, so a hut on a walking lane is not an obstacle — it is a
     building villagers stroll straight through, which reads worse than an
     obstacle would. The sawbones hut used to sit at (0.50W, 0.80H), squarely
     on the route from the stockpile to the fishing hole.
     The BUILD district is deliberately the bigger of the two (38% of the
     ground against the work band's 28%): it is where the game's progress is
     legible, and it has to hold a metropolis before this is done. Bands are
     fractions of the GROUND, not of H, so landscape gets the same proportions
     out of a much shorter strip rather than a squashed version of portrait. */

  const s = G.hitR * 0.95;

    { x: G.fire.x - s, y: G.fire.y + s * 0.45, rot: 0.25 },
    { x: G.fire.x + s, y: G.fire.y + s * 0.45, rot: -0.25 },
    { x: G.fire.x - s * 0.7, y: G.fire.y - s * 0.75, rot: -0.15 },

    G.rockItems.push({ x: G.rocks.x + (r()-0.7) * 50, y: G.rocks.y + (r()-0.5) * 46, s: 10 + r() * 12 });

/* Rotation lifecycle: iOS delivers the geometry change inconsistently across

   so the extra passes are strict no-ops once settled. */

}
window.addEventListener('resize', reflow);
window.addEventListener('orientationchange', reflow);

/* --- buildings: houses fill slots in order; businesses have fixed spots ---

   `inside` counts must survive resize/relayout). */
const HOMES = [], BIZ = {};
/* Slots are [x as a fraction of W, y as a fraction of the BUILD DISTRICT] —
   0 is the back of the district, 1 the front. Authoring in district space is
   what lets the band move (or a stage resize it) without every number here
   needing a second edit, and it makes the invariant checkable: a slot with
   y <= 1 is inside the district by construction, so nothing can drift onto a
   walking lane. Houses fill the back rows; the businesses take the front row,
   nearest the fire, where they are most legible. */
/* CAMP and VILLAGE keep hand-placed slots: ten buildings is few enough to
   art-direct, and the flanking pair a two-hut camp opens with is a
   composition, not a grid cell. TOWN and up are GENERATED — sixteen to
   thirty-two buildings is a street grid, which is exactly what those stages
   are supposed to look like, and a hand table that long is unmaintainable. */
const HAND_SLOTS = [
  [0.17, 0.06], [0.83, 0.06], [0.50, 0.00], [0.32, 0.17], [0.68, 0.17],
  [0.08, 0.30], [0.92, 0.30], [0.28, 0.42], [0.72, 0.42], [0.50, 0.44],
];
function slotCols(cap) { return Math.max(3, Math.min(7, Math.round(Math.sqrt(cap * 1.6)))); }
/* Generated rows fill FRONT to BACK, because a town grows outward from its
   hearth — filling back-first would show a settlement that grew away from the
   fire it exists for. Jitter is seeded (so a slot never slides out from under
   the villager who lives there) and damped as the stage climbs: a town still
   straggles, a metropolis lines up, which is the same statement the path
   style is making one layer down. */
function genSlots(cap, jit) {
  const cols = slotCols(cap), rows = Math.ceil(cap / cols), r = prng(7717), out = [];
  for (let i = 0; i < cap; i++) {

      0.09 + 0.82 * ((col + 0.5) / cols) + (r() - 0.5) * jit / cols,
      (rows > 1 ? row / (rows - 1) : 0) * 0.74 + (r() - 0.5) * jit * 0.5,
    ]);

}
function houseSlots() {
  const ix = stageIx();

}
function houseW() {

     The >1 factor is deliberate: neighbours overlap slightly, which is what
     turns a grid of separate boxes into a terrace. Capped against H too —
     landscape is a short wide box where a building sized only off width takes
     a third of the screen height. */
  const cols = slotCols(stageMaxHouses());

}
/* district y for a slot fraction: 0 = back row, 1 = the front row facing the fire */
function dy(f) { return G.zone.buildTop + (G.zone.buildBot - G.zone.buildTop) * f; }

  for (const b of BIZ_DEFS) {

}
function drawLamp(l) {
  const lit = ambient() > 0.14;
  cx.fillStyle = 'rgba(70,86,120,0.26)';
  cx.beginPath(); cx.ellipse(l.x, l.y + 1, 5, 2, 0, 0, TAU); cx.fill();
  cx.strokeStyle = '#3f4855'; cx.lineWidth = 2.6; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(l.x, l.y); cx.lineTo(l.x, l.y - l.h); cx.stroke();
  cx.fillStyle = lit ? '#ffd98a' : '#7d8798';

  cx.beginPath(); cx.moveTo(l.x - 5.4, l.y - l.h - 6); cx.lineTo(l.x + 5.4, l.y - l.h - 6);

/* STREET LAMPS. Laid out with the buildings because they belong to the

   hole in the darkness layer is a prop, not a light, and the difference is
   obvious the first night. Count climbs with the rung, so a metropolis night
   is genuinely brighter than a town's. */
function layoutLamps() {
  G.lamps = [];

  if (!n) return;
  const av = G.zone.buildBot + (stage().paths === 'grid' ? 4 : 16);
  for (let i = 0; i < n; i++)
    G.lamps.push({ x: W * (0.10 + 0.80 * (n === 1 ? 0.5 : i / (n - 1))), y: av, h: Math.min(34, H * 0.052) });

function activeHomes() { return HOMES.slice(0, houses()); }
function activeBiz()   { return BIZ_DEFS.filter(b => S.up[b.id]).map(b => BIZ[b.id]); }

/* seeded PRNG for stable scatter */
function prng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ground texture baked once per resize */
let groundCv = null;
function bakeGround() {
  groundCv = document.createElement('canvas');
  groundCv.width = Math.round(W); groundCv.height = Math.round(H);
  const g = groundCv.getContext('2d');
  const st = stage();
  /* GROUND AND STREETS, per rung. Both are baked once here rather than painted
     per frame — they never animate, and a street grid redrawn sixty times a
     second is the cheapest possible way to lose the frame budget. The surface
     desaturates and darkens as the settlement grows, which is what sells
     "modern" more than any single prop does: a metropolis on fresh snow reads
     as a diorama, the same towers over grey plaza read as a city. */
  const SURF = {
    snow:   ['#dfe9f6', '#eef4fb', '#e2ebf7'],
    packed: ['#d5deec', '#e4ecf6', '#d8e1ef'],
    paved:  ['#bfc9d8', '#ccd5e2', '#c3cddc'],
    plaza:  ['#aeb8c8', '#bcc5d4', '#b2bcca'],
  }[st.ground];
  const gr = g.createLinearGradient(0, G.horizon, 0, H);
  gr.addColorStop(0, SURF[0]); gr.addColorStop(0.5, SURF[1]); gr.addColorStop(1, SURF[2]);
  g.fillStyle = gr;
  g.fillRect(0, G.horizon, W, H - G.horizon);
  const r = prng(1234);
  for (let i = 0; i < 26; i++) { // drift shading
    const x = r() * W, y = G.horizon + r() * (H - G.horizon), rw = 40 + r() * 120, rh = rw * 0.24;
    const dg = g.createRadialGradient(x, y, 0, x, y, rw);
    dg.addColorStop(0, 'rgba(190,205,228,' + (0.10 + r() * 0.12) + ')');
    dg.addColorStop(1, 'rgba(190,205,228,0)');

     stop entirely at the plaza — leaving them on is what made an early draft
     of the city look like a car park in a blizzard. */
  const flecks = [140, 140, 80, 30, 0][stageIx()];
  for (let i = 0; i < flecks; i++) {
    g.fillStyle = 'rgba(255,255,255,' + (0.25 + r() * 0.5) + ')';
    g.fillRect(r() * W, G.horizon + 6 + r() * (H - G.horizon - 6), 1.4, 1.4);

  g.strokeStyle = ROAD && st.paths !== 'trodden' ? ROAD : 'rgba(196,206,224,0.55)';
  g.lineWidth = st.paths === 'grid' ? 16 : 10;
  g.beginPath(); g.arc(G.fire.x, G.fire.y, G.hitR * 0.72, 0, TAU); g.stroke();
  if (st.paths === 'trodden') {
    // a village wears trodden paths from every doorstep to the fire
    g.strokeStyle = ROAD; g.lineWidth = 7; g.lineCap = 'round';
    for (const b of activeHomes().concat(activeBiz())) {
      g.beginPath();
      g.moveTo(b.x, b.y + 6);
      g.quadraticCurveTo((b.x + G.fire.x) / 2, (b.y + G.fire.y) / 2 + 14, G.fire.x, G.fire.y - 2);
      g.stroke();
    }

    /* A TOWN surveys its lanes: one gravel avenue across the front of the
       district and a straight spur from each doorstep down to it. Straight is
       the whole point — the curve is what read as a footpath. */
    const av = G.zone.buildBot + 14, back = G.zone.buildTop + (av - G.zone.buildTop) * 0.52;
    g.strokeStyle = ROAD; g.lineCap = 'round';
    g.lineWidth = 13; g.beginPath(); g.moveTo(W * 0.06, av); g.lineTo(W * 0.94, av); g.stroke();
    /* A back street rather than a spur per doorstep. Spurs were the first
       draft and they read as a picket fence: sixteen verticals, most of them
       passing behind other houses, all of them fighting the buildings for
       attention. Two horizontals say "surveyed" just as well and stay quiet. */
    g.lineWidth = 9; g.beginPath(); g.moveTo(W * 0.10, back); g.lineTo(W * 0.90, back); g.stroke();
    g.lineWidth = 11;                                   // one avenue down to the hearth
    g.beginPath(); g.moveTo(G.fire.x, av); g.lineTo(G.fire.x, G.fire.y - G.hitR * 1.05); g.stroke();
  } else if (st.paths === 'grid') {
    /* A CITY has a street GRID, and it is orthogonal on purpose: every earlier
       stage's paths converge on the fire like spokes, and replacing that fan
       with right angles is the single strongest read of "this is planned now".
       Joints are struck ON the grid lines rather than by distance, so the
       paving reads as blocks rather than as a texture. */
    /* The grid STOPS above the hearth ring. Running the streets through the
       fire was the first draft and it read as a roundabout the whole game is

/* =============================== fire model =============================== */
const FIRE = { burning: false, intensity: 0, ember: 0, flick: 0 };
function stoke(px, py, power) {
  const wasCold = S.bank <= 0;
  S.bank = Math.min(maxBank(), S.bank + power);
  FIRE.burning = true;
  spawnMote(px, py);
  floats.push({ txt: '+' + fmtS(power), x: px, y: py - 12, life: 0 });
  if (wasCold) hint('The spark takes! Keep tapping to bank burn time.');
}
function fireStep(dt) {
  if (S.bank > 0) {
    S.bank = Math.max(0, S.bank - drainRate() * dt);
    FIRE.burning = true;
    S.lifeWarm += dt;
  } else if (FIRE.burning) {
    FIRE.burning = false;
    FIRE.ember = 1;
    hint('The fire went out. The cold creeps back in…');
  }
  if (!S.roared && roaring()) {
    S.roared = true;
    hint('The fire ROARS. The fuller the bank above 75%, the harder the camp works \u2014 up to +' + Math.round(roarBonus() * 100) + '% at a brimming fire. BELLOWS is now in the upgrades.');
    toast('BELLOWS UNLOCKED');
    if (upgPanel.classList.contains('open')) buildUpgPanel();   // the card appears without a reopen
  }
  FIRE.ember = Math.max(0, FIRE.ember - dt * 0.12);
  FIRE.flick += dt * (6 + Math.random() * 6);
  const target = FIRE.burning ? (0.45 + 0.55 * Math.min(1, S.bank / 12)) : 0;
  FIRE.intensity += (target - FIRE.intensity) * Math.min(1, dt * 3.5);
  if (crackleGain) crackleGain.gain.value = (S.muted ? 0 : 1) * FIRE.intensity * 0.16;
  if (windGain) windGain.gain.value = (S.muted ? 0 : 1) * (0.035 + ambient() * 0.05) * (FIRE.burning ? 0.7 : 1.15);
}

/* =============================== day cycle =============================== */
function lerpC(a, b, k) { return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k]; }

  let a = KF[0], b = KF[KF.length - 1];
  for (let i = 0; i < KF.length - 1; i++) if (t >= KF[i].t && t <= KF[i+1].t) { a = KF[i]; b = KF[i+1]; break; }
  const k = (t - a.t) / Math.max(1e-6, b.t - a.t);
  return { top: lerpC(a.top, b.top, k), bot: lerpC(a.bot, b.bot, k), amb: a.amb + (b.amb - a.amb) * k };

function ambient() { return skyNow.amb; }
function dayStep(dt) {
  S.dayT += dt / DAY_LEN;
  if (S.dayT >= 1) { S.dayT -= 1; S.day++; toast('DAY ' + S.day); }
  skyNow = skyAt(S.dayT);
}

/* =============================== scenery painters =============================== */
function drawSky() {
  const gr = cx.createLinearGradient(0, 0, 0, G.horizon * 1.25);
  gr.addColorStop(0, css(skyNow.top)); gr.addColorStop(1, css(skyNow.bot));
  cx.fillStyle = gr;
  cx.fillRect(0, 0, W, G.horizon + 4);
  // stars
  const starA = Math.max(0, (skyNow.amb - 0.35)) * 1.6;
  if (starA > 0.02) {
    const r = prng(77);
    cx.fillStyle = 'rgba(255,255,255,' + Math.min(0.9, starA) + ')';
    for (let i = 0; i < 46; i++) {
      const x = r() * W, y = r() * G.horizon * 0.9, s = r();
      if (s > 0.75) cx.fillRect(x, y, 1.6, 1.6); else cx.fillRect(x, y, 1, 1);

  if (sunT > 0 && sunT < 1) drawOrb(sunT, '#fff4d6', '#ffd98a', 16, 1);
  const moonT = (((S.dayT + 0.5) % 1) - 0.10) / 0.5;
  if (moonT > 0 && moonT < 1) drawOrb(moonT, '#e8eeff', '#b9c6e8', 11, 0.8);

    g2.addColorStop(0, 'rgba(80,255,180,0)');
    g2.addColorStop(1, 'rgba(80,255,180,' + ((skyNow.amb - 0.7) * 0.25) + ')');

    cx.lineTo((x + nx) / 2, base - (30 + r() * 60) * hf * (H / 700));

  { res:'food',  site:()=>({x:G.hole.x, y:G.hole.y - 10}) },

    tx: 0, ty: 0, speed: 46 + Math.random() * 14,

     changed has to be kicked back to idle. RECRUIT VILLAGER raises popCap, which
     demotes the villager at the old boundary from keeper to worker; if it is

  cx.save(); cx.translate(x, y); cx.scale(v.flip, 1);
  // shadow
  cx.fillStyle = 'rgba(70,86,120,0.30)';
  cx.beginPath(); cx.ellipse(0, 1.5, 6, 2.4, 0, 0, TAU); cx.fill();
  const bh = seated ? 9 : 12;
  // legs
  if (!seated) {
    cx.strokeStyle = '#33415c'; cx.lineWidth = 2.4; cx.lineCap = 'round';
    const sw = walking ? Math.sin(v.t * 10) * 3 : 0;
    cx.beginPath(); cx.moveTo(-2, -bh + 8); cx.lineTo(-2 + sw, 0); cx.stroke();
    cx.beginPath(); cx.moveTo(2, -bh + 8); cx.lineTo(2 - sw, 0); cx.stroke();
  }
  // coat body (cel: flat fill + ink outline)
  cx.fillStyle = v.coat;
  cx.beginPath();
  if (cx.roundRect) cx.roundRect(-5, -bh - 4, 10, bh + (seated ? 4 : 5), 4); else cx.rect(-5, -bh - 4, 10, bh + 5);
  cx.fill();
  inkStroke(1.1); cx.stroke();
  cx.fillStyle = 'rgba(255,255,255,0.85)'; // fur trim
  cx.fillRect(-5, -bh - 4, 10, 2);
  // arms
  cx.strokeStyle = v.coat; cx.lineWidth = 2.6; cx.lineCap = 'round';
  if (seated && cold) {
    const rub = Math.sin(v.shiver * 3) * 1.6;
    cx.beginPath(); cx.moveTo(-4, -bh + 1); cx.lineTo(rub, -bh + 4); cx.stroke();
    cx.beginPath(); cx.moveTo(4, -bh + 1); cx.lineTo(-rub, -bh + 4); cx.stroke();
  } else if (working) {
    const sw = Math.sin(v.t * 9);
    cx.beginPath(); cx.moveTo(2, -bh + 1); cx.lineTo(7, -bh - 2 + sw * 5); cx.stroke();
    cx.strokeStyle = '#5a4632'; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(7, -bh - 2 + sw * 5); cx.lineTo(10, -bh - 6 + sw * 7); cx.stroke();
  } else if (seated && warm) {
    cx.beginPath(); cx.moveTo(-4, -bh + 1); cx.lineTo(-7, -bh + 5); cx.stroke();
    cx.beginPath(); cx.moveTo(4, -bh + 1); cx.lineTo(7, -bh + 5); cx.stroke();
  }
  // head + hood
  cx.fillStyle = '#e8b98f';
  cx.beginPath(); cx.arc(0, -bh - 8, 4.4, 0, TAU); cx.fill();
  inkStroke(1); cx.stroke();
  cx.fillStyle = v.keeper ? '#d0342c' : v.coat;
  cx.beginPath(); cx.arc(0, -bh - 8.6, 4.6, Math.PI * 1.05, Math.PI * 1.95); cx.fill();
  if (v.keeper) { cx.fillRect(-4.6, -bh - 9.4, 9.2, 2); }
  // carried resource
  if (v.carry) {
    cx.font = '9px sans-serif'; cx.textAlign = 'center';
    cx.fillText(RES_ICON[v.carry], 0, -bh - 15);
  }
  cx.restore();
  // breath puff in the cold
  if (cold && Math.random() < 0.01)
    smoke.push({ x: x + v.flip * 4, y: y - bh - 8, vx: v.flip * 6, vy: -6, r: 1.5, life: 0, max: 1.1 });
}
