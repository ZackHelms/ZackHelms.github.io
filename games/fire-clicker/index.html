<!DOCTYPE html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap');
:root {
  --bg: #06060e;
  --panel: #0b0b16;
  --border: #1a1a30;
  --green: #39ff14;
  --gold: #ffc300;
  --white: #dde3ff;
  --dim: #8899bb;
  --purple: #b44fff;
  --ember: #ff9a3c;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body {
  background: var(--bg);
  font-family: 'Share Tech Mono', monospace;
  color: var(--white);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
#scene { position:fixed; inset:0; width:100%; height:100%; display:block; }

/* --- chrome --- */
#back-btn, #mute-btn {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 80;
  width: 38px; height: 30px; line-height: 28px; text-align: center;
  background: rgba(11,11,22,0.82); border: 1px solid var(--border); border-radius: 8px;
  color: var(--white); font-size: 15px; text-decoration: none; cursor: pointer;
  font-family: 'Share Tech Mono', monospace; padding: 0;
}
#back-btn { left: calc(env(safe-area-inset-left, 0px) + 8px); }
#mute-btn { left: calc(env(safe-area-inset-left, 0px) + 52px); }

/* --- HUD --- */
#hud {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); right: 8px; z-index: 60;
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;

}
.res-chip {
  background: rgba(11,11,22,0.72); border: 1px solid var(--border); border-radius: 7px;
  font-size: 0.62rem; letter-spacing: 1px; padding: 3px 8px; color: var(--white);
}
#clock {
  background: rgba(11,11,22,0.72); border: 1px solid var(--border); border-radius: 7px;
  font-size: 0.55rem; letter-spacing: 2px; padding: 3px 8px; color: var(--dim);
}
#hint {
  position: fixed; left: 50%; transform: translateX(-50%);

/* --- upgrades --- */

  position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 80;

}

}

.up-card {

.up-card .uc .no { color: #ff6a6a; }

#toast {

  top: calc(env(safe-area-inset-top, 0px) + 46px); z-index: 85;

<script>
'use strict';
/* =============================== constants =============================== */
const DAY_LEN = 300;               // one full in-game day, seconds
const SAVE_KEY = 'fireClicker.v2';
const TAU = Math.PI * 2;

/* upgrades: cost = base * growth^lvl, per-resource. `max` may be a number or
   a function; `show()` gates stage-locked entries out of the panel. */
const UPG = [
  { id:'pit',    i:'\u{1F525}', n:'FIRE PIT',     max:8,
    d:(l)=>'Deeper stone pit banks more burn time, and holds a ROARING fire nearer the top between taps. Max bank: ' + fmtS(maxBank()) + ' → ' + fmtS(5 + (l+1)*5) + '.',
    cost:(l)=>({ stone: Math.round(8 * Math.pow(1.8, l)) }) },
  { id:'tinder', i:'\u{1FAB5}', n:'DRY TINDER',   max:8,
    d:(l)=>'Seasoned wood catches better. Each tap banks ' + fmtS(tapPower()) + ' → ' + fmtS(1 + (l+1)*0.5) + '.',
    cost:(l)=>({ wood: Math.round(10 * Math.pow(1.8, l)) }) },
  { id:'wind',   i:'\u{1F6A7}', n:'WINDBREAK',    max:5,
    d:(l)=>'Snow fencing shelters the flames. Fire burns ' + Math.round((1-drainRate())*100) + '% → ' + Math.round((1-(1/(1+(l+1)*0.09)))*100) + '% slower.',
    cost:(l)=>({ wood: Math.round(14 * Math.pow(1.9, l)), stone: Math.round(8 * Math.pow(1.9, l)) }) },
  /* Gated on the first ROAR. The bonus exists at bellows Lv0 (roarBonus(0)
     is +10%), so any player who taps a fresh 5-second bank to the brim earns
     it inside the first few seconds and unlocks the card that deepens it. A
     player who has NOT felt the mechanic cannot buy the multiplier on it —
     BELLOWS was the game's one trap card, expensive and inert for someone
     letting the firekeeper smoulder. `S.up.bellows > 0` keeps the card
     visible for saves written before S.roared existed. */
  { id:'bellows', i:'\u{1F4A8}', n:'BELLOWS',      max:6, show:()=>S.roared || S.up.bellows > 0,
    d:(l)=>'Leather bellows feed the blaze. Above 75% the fire ROARS and villagers work up to +' + Math.round(roarBonus()*100) + '% \u2192 +' + Math.round(roarBonus(l+1)*100) + '% faster \u2014 half that at the 75% line, all of it at a full bank.',
    cost:(l)=>({ wood: Math.round(30 * Math.pow(1.9, l)), stone: Math.round(20 * Math.pow(1.9, l)) }) },
  { id:'tools',  i:'\u{26CF}',  n:'SHARP TOOLS',  max:6,
    d:(l)=>'Better axes, picks and hooks. Villagers haul +' + (l+1) + ' extra per trip.',
    cost:(l)=>({ stone: Math.round(16 * Math.pow(1.9, l)), wood: Math.round(8 * Math.pow(1.9, l)) }) },
  { id:'bunk',   i:'\u{1F9E3}', n:'RECRUIT VILLAGER', max:()=>houses()*5 - 4,
    d:(l)=>'Another pair of mittens moves in (' + (4+l) + ' → ' + (4+l+1) + '). Each house sleeps 5.',
    cost:(l)=>({ wood: Math.round(24 * Math.pow(1.75, l)), food: Math.round(14 * Math.pow(1.75, l)) }) },
  { id:'keeper', i:'\u{1F9E4}', n:'FIREKEEPER',   max:1,
    d:()=>'Hire a villager to feed the fire for you: throws a log (\u22121 wood) for +4s whenever the bank runs low. Keeps the camp alive while you are away \u2014 but a tended fire only ever smoulders, so the ROARING bonus stays yours to earn.',
    cost:()=>({ food: 30, wood: 15 }) },
  { id:'micro',  i:'\u{1F449}', n:'MICROMANAGEMENT', max:1, show:()=>houses() >= 3,
    d:()=>'Stand over the work. Tap the trees, the rocks or the fishing hole and every villager goes after that resource instead of picking for themselves; tap it again to let them choose.',
    cost:()=>({ wood: 100, stone: 80, food: 80 }) },
  { id:'house',  i:'\u{1F3E0}', n:'BUILD HOUSE',  max:()=>stageMaxHouses() - 2,
    d:(l)=>'Raise house #' + (3+l) + ' — beds for 5 more villagers (' + houses() + ' → ' + (houses()+1) + ' of ' + stageMaxHouses() + ').',
    cost:(l)=>({ wood: Math.round(45 * Math.pow(1.6, l)), stone: Math.round(25 * Math.pow(1.6, l)) }) },
  { id:'village', i:'\u{1F3D8}', n:'FOUND VILLAGE', max:1,
    show:()=>S.up.village >= 1 ? false : houses() >= 5,
    d:()=>'Five houses make a VILLAGE: sturdier timber homes (up to 10 of them), trodden paths, and room for businesses.',
    cost:()=>({ wood: 400, stone: 300, food: 300 }) },
  { id:'tavern', i:'\u{1F37A}', n:'TAVERN', max:1, show:()=>S.up.village >= 1,
    d:()=>'THE THIRSTY YETI opens its doors. A warm mug after every haul — villagers walk 15% faster.',
    cost:()=>({ wood: 150, stone: 60, food: 120 }) },
  { id:'shop', i:'\u{1F6D2}', n:'GENERAL STORE', max:1, show:()=>S.up.village >= 1,
    d:()=>'Sacks, sleds and sensible prices. Villagers haul +1 resource per trip.',
    cost:()=>({ wood: 180, stone: 100, food: 80 }) },
  { id:'sawbones', i:'\u{1FA79}', n:'SAWBONES HUT', max:1, show:()=>S.up.village >= 1,
    d:()=>'Splinters out while you wait. Healthier villagers work 25% faster.',
    cost:()=>({ wood: 120, stone: 140, food: 100 }) },
];
const maxOf = (u) => typeof u.max === 'function' ? u.max() : u.max;
const showU = (u) => !u.show || u.show();
const RES_ICON = { wood:'\u{1FAB5}', stone:'\u{1FAA8}', food:'\u{1F356}' };

/* day-cycle palette keyframes: t, skyTop, skyBot, ambient darkness 0..1, sun/star */
const KF = [
  { t:0.00, top:[10,14,38],  bot:[28,36,80],   amb:0.80 },   // deep night
  { t:0.07, top:[26,30,62],  bot:[90,74,112],  amb:0.62 },   // predawn
  { t:0.12, top:[70,86,150], bot:[236,160,106],amb:0.34 },   // dawn
  { t:0.20, top:[126,192,238],bot:[234,244,255],amb:0.04 },  // morning
  { t:0.40, top:[143,208,255],bot:[242,248,255],amb:0.00 },  // midday
  { t:0.55, top:[122,160,216],bot:[255,179,107],amb:0.12 },  // golden hour
  { t:0.63, top:[44,42,85],  bot:[201,106,74], amb:0.46 },   // dusk
  { t:0.72, top:[12,16,42],  bot:[35,42,82],   amb:0.78 },   // nightfall
  { t:1.00, top:[10,14,38],  bot:[28,36,80],   amb:0.80 },   // wrap
];
function phaseName(t) {
  if (t < 0.07) return 'NIGHT';
  if (t < 0.17) return 'DAWN';
  if (t < 0.52) return 'DAY';
  if (t < 0.70) return 'DUSK';
  return 'NIGHT';
}

/* =============================== state =============================== */
function freshState() {
  return {
    res: { wood: 0, stone: 0, food: 0 },
    up: Object.fromEntries(UPG.map(u => [u.id, 0])),
    bank: 0,             // seconds of burn banked
    focus: null,         // MICROMANAGEMENT: 'wood'|'stone'|'food', or null for the villagers' own choice
    day: 1, dayT: 0.16,  // start mid-morning
    lifeWarm: 0,         // lifetime warm-seconds (for later stages/ascension)
    roared: false,       // has the fire ever ROARED? gates the BELLOWS card
    muted: false, lastSave: Date.now(),
  };
}
let S = freshState();
function save() { S.lastSave = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try { localStorage.removeItem('fireClicker.v1'); } catch (e) {}
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {}
  if (!raw) return;
  let d; try { d = JSON.parse(raw); } catch (e) { return; }
  if (!d || typeof d !== 'object') return;
  const f = freshState();
  S = f;
  if (d.res && typeof d.res === 'object') for (const k of ['wood','stone','food']) S.res[k] = Math.max(0, +d.res[k] || 0);
  if (d.up && typeof d.up === 'object') for (const u of UPG) S.up[u.id] = Math.max(0, Math.floor(+d.up[u.id] || 0));
  for (const u of UPG) S.up[u.id] = Math.min(maxOf(u), S.up[u.id] || 0); // clamp after ALL load (maxes depend on stage/houses)
  S.bank = Math.max(0, Math.min(200, +d.bank || 0));
  S.focus = (S.up.micro && ['wood','stone','food'].includes(d.focus)) ? d.focus : null;
  S.day = Math.max(1, Math.floor(+d.day || 1));
  S.dayT = (+d.dayT >= 0 && +d.dayT < 1) ? +d.dayT : 0.16;
  S.lifeWarm = Math.max(0, +d.lifeWarm || 0);
  S.roared = !!d.roared || S.up.bellows > 0;
  S.muted = !!d.muted;
}
function maxBank()  { return 5 + S.up.pit * 5; }
function tapPower() { return 1 + S.up.tinder * 0.5; }
function drainRate(){ return 1 / (1 + S.up.wind * 0.09); }
function tripYield(){ return 1 + S.up.tools + (S.up.shop ? 1 : 0); }
/* ROARING FIRE — the reward for tending the fire yourself. Above ROAR_AT of a
   full bank the extra heat energises the camp: villagers dawdle less, walk
   faster and work faster, all through ONE multiplier so the effect stays a
   clean scale on the gather cycle (and so the analytic model in
   .claude/tests/eval-fire-clicker.cjs can express it as one term). The
   FIREKEEPER deliberately cannot produce it: it only stokes below 35% of the
   bank, so an auto-tended fire never reaches the threshold. Effort is what
   makes the fire roar. */
const ROAR_AT = 0.75;
function heat()      { return S.bank / Math.max(1e-6, maxBank()); }
function roaring()   { return FIRE.burning && heat() >= ROAR_AT; }
function roarBonus(l){ return 0.1 + 0.1 * (l === undefined ? S.up.bellows : l); }
/* The bonus RAMPS across the top quarter of the bank rather than snapping on:
   half of roarBonus() at the ROAR_AT line, all of it at a brimming bank. Two
   reasons. It kills a knife-edge — under a cliff, 74.9% and 75.1% of the bank
   were a whole multiplier apart, so the dial had one meaningful pixel. And it
   gives FIRE PIT a throughput price: a hand-tapped fire sawtooths between
   maxBank() - tapPower() and maxBank(), so a DEEPER pit is a SHALLOWER sawtooth
   in fractional terms, which lifts the mean scale toward 1. */
function roarScale() { return 0.5 + 0.5 * Math.min(1, Math.max(0, (heat() - ROAR_AT) / (1 - ROAR_AT))); }
function roarNow()   { return roaring() ? roarBonus() * roarScale() : 0; }
function heatBoost() { return 1 + roarNow(); }
/* One desperate wood run brings back this many logs — see the DESPERATE WOOD
   RUN note in villagerStep for why one log is not enough. */
const FORAGE_ARMFUL = 8;
function popCap()   { return Math.min(4 + S.up.bunk, houses() * 5); }
function houses()   { return Math.min(2 + (S.up.house || 0), stageMaxHouses()); }
function stageMaxHouses() { return S.up.village ? 10 : 5; }
function stageName(){ return S.up.village ? 'VILLAGE' : 'CAMP'; }
function fmtS(v)    { return (Math.round(v * 10) / 10) + 's'; }

/* =============================== audio =============================== */
let AC=null, sfxGain=null, musicGain=null, noiseBuf=null, windGain=null, crackleGain=null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  sfxGain = AC.createGain(); sfxGain.gain.value = S.muted ? 0 : 0.5; sfxGain.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = S.muted ? 0 : 0.34; musicGain.connect(AC.destination);
  const len = AC.sampleRate * 2;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const ch = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  // wind bed (always on, colder-sounding at night)
  const wsrc = AC.createBufferSource(); wsrc.buffer = noiseBuf; wsrc.loop = true;
  const wlp = AC.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 420; wlp.Q.value = 0.4;
  windGain = AC.createGain(); windGain.gain.value = 0.05;
  wsrc.connect(wlp); wlp.connect(windGain); windGain.connect(musicGain); wsrc.start();
  const lfo = AC.createOscillator(), lg = AC.createGain();
  lfo.frequency.value = 0.13; lg.gain.value = 0.03;
  lfo.connect(lg); lg.connect(windGain.gain); lfo.start();
  // fire crackle bed, gain tied to fire intensity each frame
  const csrc = AC.createBufferSource(); csrc.buffer = noiseBuf; csrc.loop = true; csrc.playbackRate.value = 0.7;
  const cbp = AC.createBiquadFilter(); cbp.type = 'bandpass'; cbp.frequency.value = 1400; cbp.Q.value = 0.8;
  crackleGain = AC.createGain(); crackleGain.gain.value = 0;
  csrc.connect(cbp); cbp.connect(crackleGain); crackleGain.connect(musicGain); csrc.start();
  scheduleMusic();
}
const SCALE = [0, 2, 3, 7, 10, 12, 14]; // wintry minor-ish
function scheduleMusic() {
  let next = AC.currentTime + 1.5;
  setInterval(() => {
    if (!AC) return;
    while (next < AC.currentTime + 0.25) {
      if (Math.random() < 0.30) {
        const f = 196 * Math.pow(2, SCALE[Math.floor(Math.random() * SCALE.length)] / 12) * (Math.random() < 0.25 ? 2 : 1);
        const t = next;
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.07, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
        o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 1.9);
      }
      next += 0.9;
    }
  }, 120);
}
function sfxNoise(freq, q, dur, vol, rate) {
  if (!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = rate || 1;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(sfxGain);
  src.start(t); src.stop(t + dur + 0.02);
}
function sfxTap()   { sfxNoise(2400 + Math.random() * 1200, 2.5, 0.07, 0.3, 1.4); sfxNoise(700, 1, 0.12, 0.18, 0.8); }
function sfxPuff()  { sfxNoise(500, 0.8, 0.1, 0.1, 0.6); }
function sfxLog()   { sfxNoise(320, 1.5, 0.16, 0.28, 0.5); sfxNoise(1800, 2, 0.1, 0.14, 1.2); }
function sfxBuy()   {
  if (!AC) return;
  [392, 523].forEach((f, i) => {
    const t = AC.currentTime + i * 0.09;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + 0.2);
  });
}
function setMuted(m) {
  S.muted = m;
  muteBtn.textContent = m ? '\u{1F507}' : '\u{1F50A}';
  if (sfxGain) sfxGain.gain.value = m ? 0 : 0.5;
  if (musicGain) musicGain.gain.value = m ? 0 : 0.34;
  save();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (AC) AC.suspend(); save(); }
  else if (AC && !S.muted) AC.resume();
});

/* =============================== canvas & layout =============================== */
const cv = document.getElementById('scene');
const cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const light = document.createElement('canvas');   // low-res darkness layer
const lx = light.getContext('2d');
const LSCALE = 0.34;
let G = {}; // scene geometry anchors
/* Lay out in the canvas's OWN box, never window.inner*. Pointer coords are
   resolved against that box, and on iOS the two disagree after a rotation
   (Safari's chrome): sizing the scene from innerHeight while the box is
   shorter squashes the drawing upward while the hit tests stay put — that
   was the "fire tap area has moved down in landscape" bug. */
function viewBox() {
  const r = cv.getBoundingClientRect();
  return { w: r.width || window.innerWidth, h: r.height || window.innerHeight };
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const vb = viewBox();
  W = vb.w; H = vb.h;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  light.width = Math.max(1, Math.round(W * LSCALE));
  light.height = Math.max(1, Math.round(H * LSCALE));
  const land = W > H;
  G.horizon = H * (land ? 0.30 : 0.22);
  G.fire = { x: W * 0.5, y: H * (land ? 0.62 : 0.58) };
  G.hitR = Math.max(56, Math.min(W, H) * 0.14);
  G.trees = { x: W * 0.09, y: H * 0.80 };
  G.rocks = { x: W * 0.91, y: H * 0.80 };
  G.hole  = { x: W * 0.38, y: H * 0.92 };
  G.stock = { x: G.fire.x + G.hitR * 1.5, y: G.fire.y + G.hitR * 0.9 };
  const s = G.hitR * 0.95;
  G.seats = [
    { x: G.fire.x - s, y: G.fire.y + s * 0.45, rot: 0.25 },
    { x: G.fire.x + s, y: G.fire.y + s * 0.45, rot: -0.25 },
    { x: G.fire.x - s * 0.7, y: G.fire.y - s * 0.75, rot: -0.15 },
    { x: G.fire.x + s * 0.7, y: G.fire.y - s * 0.75, rot: 0.15 },
  ];
  // scenery items precomputed for the y-sorted painter
  let r = prng(99);
  G.treeItems = [];
  for (let i = 0; i < 4; i++)
    G.treeItems.push({ x: G.trees.x + (r()-0.3) * 60, y: G.trees.y + (r()-0.5) * 60, s: 20 + r() * 14 });
  r = prng(41);
  G.rockItems = [];
  for (let i = 0; i < 3; i++)
    G.rockItems.push({ x: G.rocks.x + (r()-0.7) * 50, y: G.rocks.y + (r()-0.5) * 46, s: 10 + r() * 12 });
  layoutBuildings();
  bakeGround();
}
/* Rotation lifecycle: iOS delivers the geometry change inconsistently across
   these three events, and the box can settle a beat after the event fires —
   so each source runs three passes. resize() is idempotent for a given box,
   so the extra passes are strict no-ops once settled. */
let reflowT = 0;
function reflow() {
  resize();
  requestAnimationFrame(resize);
  clearTimeout(reflowT); reflowT = setTimeout(resize, 300);
}
window.addEventListener('resize', reflow);
window.addEventListener('orientationchange', reflow);
if (window.visualViewport) window.visualViewport.addEventListener('resize', reflow);

/* --- buildings: houses fill slots in order; businesses have fixed spots ---
   HOMES/BIZ entries are persistent objects (villagers hold `home` refs and
   `inside` counts must survive resize/relayout). */
const HOMES = [], BIZ = {};
const HOUSE_SLOTS = [
  [0.17, 0.115], [0.83, 0.115], [0.50, 0.090], [0.32, 0.135], [0.68, 0.135],
  [0.10, 0.225], [0.90, 0.225], [0.30, 0.245], [0.70, 0.245], [0.50, 0.255],
];
const BIZ_DEFS = [
  { id: 'tavern',   fx: 0.14, fy: 0.56 },
  { id: 'shop',     fx: 0.86, fy: 0.56 },
  { id: 'sawbones', fx: 0.50, fy: 0.80 },
];
function houseW() {
  if (S.up.village) return Math.min(88, W * 0.14);
  return houses() > 2 ? Math.min(112, W * 0.18) : Math.min(150, W * 0.24);
}
function layoutBuildings() {
  const w = houseW();
  for (let i = 0; i < houses(); i++) {
    if (!HOMES[i]) HOMES[i] = { inside: 0 };
    Object.assign(HOMES[i], { x: W * HOUSE_SLOTS[i][0], y: G.horizon + H * HOUSE_SLOTS[i][1], w });
  }
  for (const b of BIZ_DEFS) {
    if (!BIZ[b.id]) BIZ[b.id] = { inside: 0, type: b.id };
    Object.assign(BIZ[b.id], { x: W * b.fx, y: H * b.fy, w: Math.min(94, W * 0.155) });
  }
}
function activeHomes() { return HOMES.slice(0, houses()); }
function activeBiz()   { return BIZ_DEFS.filter(b => S.up[b.id]).map(b => BIZ[b.id]); }

/* seeded PRNG for stable scatter */
function prng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ground texture baked once per resize */
let groundCv = null;
function bakeGround() {
  groundCv = document.createElement('canvas');
  groundCv.width = Math.round(W); groundCv.height = Math.round(H);
  const g = groundCv.getContext('2d');
  // snowfield with soft drifts
  const gr = g.createLinearGradient(0, G.horizon, 0, H);
  gr.addColorStop(0, '#dfe9f6'); gr.addColorStop(0.5, '#eef4fb'); gr.addColorStop(1, '#e2ebf7');
  g.fillStyle = gr;
  g.fillRect(0, G.horizon, W, H - G.horizon);
  const r = prng(1234);
  for (let i = 0; i < 26; i++) { // drift shading
    const x = r() * W, y = G.horizon + r() * (H - G.horizon), rw = 40 + r() * 120, rh = rw * 0.24;
    const dg = g.createRadialGradient(x, y, 0, x, y, rw);
    dg.addColorStop(0, 'rgba(190,205,228,' + (0.10 + r() * 0.12) + ')');
    dg.addColorStop(1, 'rgba(190,205,228,0)');
    g.fillStyle = dg;
    g.save(); g.translate(x, y); g.scale(1, rh / rw); g.beginPath(); g.arc(0, 0, rw, 0, TAU); g.fill(); g.restore();
  }
  for (let i = 0; i < 140; i++) { // sparkle flecks
    g.fillStyle = 'rgba(255,255,255,' + (0.25 + r() * 0.5) + ')';
    g.fillRect(r() * W, G.horizon + 6 + r() * (H - G.horizon - 6), 1.4, 1.4);
  }
  // packed path ring around fire
  g.strokeStyle = 'rgba(196,206,224,0.55)'; g.lineWidth = 10;
  g.beginPath(); g.arc(G.fire.x, G.fire.y, G.hitR * 0.72, 0, TAU); g.stroke();
  // a village has trodden paths from every doorstep to the fire
  if (S.up.village) {
    g.strokeStyle = 'rgba(190,201,222,0.6)'; g.lineWidth = 7; g.lineCap = 'round';
    for (const b of activeHomes().concat(activeBiz())) {
      g.beginPath();
      g.moveTo(b.x, b.y + 6);
      g.quadraticCurveTo((b.x + G.fire.x) / 2, (b.y + G.fire.y) / 2 + 14, G.fire.x, G.fire.y - 2);
      g.stroke();
    }
  }
}

/* =============================== fire model =============================== */
const FIRE = { burning: false, intensity: 0, ember: 0, flick: 0 };
function stoke(px, py, power) {
  const wasCold = S.bank <= 0;
  S.bank = Math.min(maxBank(), S.bank + power);
  FIRE.burning = true;
  spawnMote(px, py);
  floats.push({ txt: '+' + fmtS(power), x: px, y: py - 12, life: 0 });
  if (wasCold) hint('The spark takes! Keep tapping to bank burn time.');
}
function fireStep(dt) {
  if (S.bank > 0) {
    S.bank = Math.max(0, S.bank - drainRate() * dt);
    FIRE.burning = true;
    S.lifeWarm += dt;
  } else if (FIRE.burning) {
    FIRE.burning = false;
    FIRE.ember = 1;
    hint('The fire went out. The cold creeps back in…');
  }
  if (!S.roared && roaring()) {
    S.roared = true;
    hint('The fire ROARS. The fuller the bank above 75%, the harder the camp works \u2014 up to +' + Math.round(roarBonus() * 100) + '% at a brimming fire. BELLOWS is now in the upgrades.');
    toast('BELLOWS UNLOCKED');
    if (upgPanel.classList.contains('open')) buildUpgPanel();   // the card appears without a reopen
  }
  FIRE.ember = Math.max(0, FIRE.ember - dt * 0.12);
  FIRE.flick += dt * (6 + Math.random() * 6);
  const target = FIRE.burning ? (0.45 + 0.55 * Math.min(1, S.bank / 12)) : 0;
  FIRE.intensity += (target - FIRE.intensity) * Math.min(1, dt * 3.5);
  if (crackleGain) crackleGain.gain.value = (S.muted ? 0 : 1) * FIRE.intensity * 0.16;
  if (windGain) windGain.gain.value = (S.muted ? 0 : 1) * (0.035 + ambient() * 0.05) * (FIRE.burning ? 0.7 : 1.15);
}

/* =============================== day cycle =============================== */
function lerpC(a, b, k) { return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k]; }
function css(c) { return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }
function skyAt(t) {
  let a = KF[0], b = KF[KF.length - 1];
  for (let i = 0; i < KF.length - 1; i++) if (t >= KF[i].t && t <= KF[i+1].t) { a = KF[i]; b = KF[i+1]; break; }
  const k = (t - a.t) / Math.max(1e-6, b.t - a.t);
  return { top: lerpC(a.top, b.top, k), bot: lerpC(a.bot, b.bot, k), amb: a.amb + (b.amb - a.amb) * k };
}
let skyNow = skyAt(0.2);
function ambient() { return skyNow.amb; }
function dayStep(dt) {
  S.dayT += dt / DAY_LEN;
  if (S.dayT >= 1) { S.dayT -= 1; S.day++; toast('DAY ' + S.day); }
  skyNow = skyAt(S.dayT);
}

/* =============================== scenery painters =============================== */
function drawSky() {
  const gr = cx.createLinearGradient(0, 0, 0, G.horizon * 1.25);
  gr.addColorStop(0, css(skyNow.top)); gr.addColorStop(1, css(skyNow.bot));
  cx.fillStyle = gr;
  cx.fillRect(0, 0, W, G.horizon + 4);
  // stars
  const starA = Math.max(0, (skyNow.amb - 0.35)) * 1.6;
  if (starA > 0.02) {
    const r = prng(77);
    cx.fillStyle = 'rgba(255,255,255,' + Math.min(0.9, starA) + ')';
    for (let i = 0; i < 46; i++) {
      const x = r() * W, y = r() * G.horizon * 0.9, s = r();
      if (s > 0.75) cx.fillRect(x, y, 1.6, 1.6); else cx.fillRect(x, y, 1, 1);
    }
  }
  // sun / moon travel the same arc half a day apart
  const sunT = (S.dayT - 0.10) / 0.5;            // rises 0.10, sets 0.60
  if (sunT > 0 && sunT < 1) drawOrb(sunT, '#fff4d6', '#ffd98a', 16, 1);
  const moonT = (((S.dayT + 0.5) % 1) - 0.10) / 0.5;
  if (moonT > 0 && moonT < 1) drawOrb(moonT, '#e8eeff', '#b9c6e8', 11, 0.8);
  // aurora-tinted haze near horizon at deep night
  if (skyNow.amb > 0.7) {
    const g2 = cx.createLinearGradient(0, G.horizon * 0.4, 0, G.horizon);
    g2.addColorStop(0, 'rgba(80,255,180,0)');
    g2.addColorStop(1, 'rgba(80,255,180,' + ((skyNow.amb - 0.7) * 0.25) + ')');
    cx.fillStyle = g2; cx.fillRect(0, G.horizon * 0.4, W, G.horizon * 0.6);
  }
}
function drawOrb(t, c1, c2, r, glow) {
  const x = W * (0.12 + 0.76 * t);
  const y = G.horizon * 1.05 - Math.sin(t * Math.PI) * G.horizon * 0.85;
  const gg = cx.createRadialGradient(x, y, 0, x, y, r * 3.4);
  gg.addColorStop(0, 'rgba(255,244,214,' + 0.5 * glow + ')'); gg.addColorStop(1, 'rgba(255,244,214,0)');
  cx.fillStyle = gg; cx.beginPath(); cx.arc(x, y, r * 3.4, 0, TAU); cx.fill();
  const og = cx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
  og.addColorStop(0, c1); og.addColorStop(1, c2);
  cx.fillStyle = og; cx.beginPath(); cx.arc(x, y, r, 0, TAU); cx.fill();
}
function drawBackdrop() {
  // far mountains
  cx.fillStyle = 'rgba(196,210,232,0.9)';
  mountainPath(31, G.horizon, 0.55); cx.fill();
  cx.fillStyle = 'rgba(224,233,246,0.95)';
  mountainPath(87, G.horizon, 0.32); cx.fill();
  // treeline
  const r = prng(55);
  cx.fillStyle = '#5b6f88';
  for (let x = -6; x < W + 10; x += 9) {
    const h = 10 + r() * 14;
    cx.beginPath();
    cx.moveTo(x, G.horizon + 2);
    cx.lineTo(x + 4.5, G.horizon + 2 - h);
    cx.lineTo(x + 9, G.horizon + 2);
    cx.fill();
  }
  cx.drawImage(groundCv, 0, 0, W, H);
}
function mountainPath(seed, base, hf) {
  const r = prng(seed);
  cx.beginPath(); cx.moveTo(0, base);
  let x = 0;
  while (x < W) {
    const nx = x + 40 + r() * 80;
    cx.lineTo((x + nx) / 2, base - (30 + r() * 60) * hf * (H / 700));
    x = nx;
    cx.lineTo(x, base - (6 + r() * 26) * hf * (H / 700));
  }
  cx.lineTo(W, base); cx.closePath();
}
const INK = '#151823';               // cel ink — every solid thing gets an outline
function inkStroke(w) { cx.strokeStyle = INK; cx.lineWidth = w; }
function drawHouse(h) {
  const w = h.w, x = h.x, y = h.y, flip = x > W * 0.5;
  const wh = S.up.village ? w * 0.44 : w * 0.34;
  cx.save(); cx.translate(x, y); if (flip) cx.scale(-1, 1);
  if (!S.up.village) {
    // CAMP: straw hut
    cx.fillStyle = '#8a6b4a';
    cx.fillRect(-w/2, -wh, w, wh);
    cx.fillStyle = 'rgba(0,0,0,0.16)';                 // flat side-shade band
    cx.fillRect(-w/2, -wh, w * 0.28, wh);
    cx.fillStyle = 'rgba(0,0,0,0.12)';
    for (let i = 1; i < 4; i++) cx.fillRect(-w/2, -wh + i*w*0.085, w, 1.5);
    inkStroke(2.2); cx.strokeRect(-w/2, -wh, w, wh);
    cx.fillStyle = '#c9a24f';                          // straw roof
    cx.beginPath();
    cx.moveTo(-w*0.60, -w*0.30);
    cx.quadraticCurveTo(0, -w*0.86, w*0.60, -w*0.30);
    cx.lineTo(w*0.48, -w*0.24); cx.quadraticCurveTo(0, -w*0.72, -w*0.48, -w*0.24);
    cx.closePath(); cx.fill();
    inkStroke(2.2); cx.stroke();
    cx.fillStyle = '#b08a3e';
    cx.beginPath();
    cx.moveTo(-w*0.52, -w*0.27);
    cx.quadraticCurveTo(0, -w*0.78, w*0.52, -w*0.27);
    cx.lineTo(w*0.44, -w*0.22); cx.quadraticCurveTo(0, -w*0.66, -w*0.44, -w*0.22);
    cx.closePath(); cx.fill();
    cx.fillStyle = '#f2f7fd';                          // snow blanket hugging the roof arc
    cx.beginPath();
    cx.moveTo(-w*0.52, -w*0.335);
    cx.quadraticCurveTo(0, -w*0.97, w*0.52, -w*0.335); // crown a touch above the straw
    cx.lineTo(w*0.46, -w*0.30);
    cx.quadraticCurveTo(0, -w*0.80, -w*0.46, -w*0.30); // underside tucked into the straw
    cx.closePath(); cx.fill();
  } else {
    // VILLAGE: timber cabin, smaller and sturdier
    cx.fillStyle = '#a8825a';
    cx.fillRect(-w/2, -wh, w, wh);
    cx.fillStyle = 'rgba(0,0,0,0.16)';
    cx.fillRect(-w/2, -wh, w * 0.28, wh);
    cx.fillStyle = 'rgba(0,0,0,0.14)';
    for (let i = 1; i < 4; i++) cx.fillRect(-w/2, -wh + i*wh*0.25, w, 1.4);
    inkStroke(2.2); cx.strokeRect(-w/2, -wh, w, wh);
    cx.fillStyle = '#6e4f33';                          // gable roof
    cx.beginPath();
    cx.moveTo(-w*0.60, -wh); cx.lineTo(0, -w*0.82); cx.lineTo(w*0.60, -wh);
    cx.closePath(); cx.fill();
    cx.strokeStyle = '#f2f7fd'; cx.lineWidth = w*0.07; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(-w*0.52, -wh - 2); cx.lineTo(0, -w*0.79); cx.lineTo(w*0.52, -wh - 2); cx.stroke();
    inkStroke(2.2);
    cx.beginPath();
    cx.moveTo(-w*0.60, -wh); cx.lineTo(0, -w*0.82); cx.lineTo(w*0.60, -wh);
    cx.closePath(); cx.stroke();
    cx.fillStyle = '#8b97ab';                          // stone chimney
    cx.fillRect(w*0.22, -w*0.72, w*0.11, w*0.22);
    inkStroke(1.6); cx.strokeRect(w*0.22, -w*0.72, w*0.11, w*0.22);
  }
  // door + window (shared)
  const doorH = wh * 0.62;
  cx.fillStyle = '#4c3722';
  cx.fillRect(w*0.09, -doorH, w*0.17, doorH);
  inkStroke(1.6); cx.strokeRect(w*0.09, -doorH, w*0.17, doorH);
  const occ = h.inside > 0;
  const winLit = occ && ambient() > 0.18;
  cx.fillStyle = winLit ? '#ffca66' : '#2c3a52';
  cx.fillRect(-w*0.31, -wh*0.72, w*0.15, wh*0.32);
  inkStroke(1.6); cx.strokeRect(-w*0.31, -wh*0.72, w*0.15, wh*0.32);
  cx.restore();
  h.winX = flip ? x + w*0.235 : x - w*0.235;
  h.winY = y - wh*0.56;
  h.lit = winLit;
  if (occ && Math.random() < 0.12) {
    const sx = (S.up.village ? w*0.27 : w*0.02) * (flip ? -1 : 1);
    smoke.push({ x: x + sx, y: y - w*0.76, vx: (Math.random()-0.5)*4 + 6, vy: -12 - Math.random()*8, r: 3, life: 0, max: 2.6 });
  }
}
function drawBiz(b) {
  const w = b.w, x = b.x, y = b.y, flip = x > W * 0.5;
  const wall = { tavern: '#8a5a3a', shop: '#5f7d96', sawbones: '#cfd6de' }[b.type];
  const wh = w * 0.46;
  cx.save(); cx.translate(x, y); if (flip) cx.scale(-1, 1);
  cx.fillStyle = wall;
  cx.fillRect(-w/2, -wh, w, wh);
  cx.fillStyle = 'rgba(0,0,0,0.16)';
  cx.fillRect(-w/2, -wh, w*0.28, wh);
  inkStroke(2.2); cx.strokeRect(-w/2, -wh, w, wh);
  cx.fillStyle = '#55402a';
  cx.beginPath(); cx.moveTo(-w*0.58, -wh); cx.lineTo(0, -w*0.78); cx.lineTo(w*0.58, -wh); cx.closePath(); cx.fill();
  cx.strokeStyle = '#f2f7fd'; cx.lineWidth = w*0.06; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(-w*0.50, -wh - 1); cx.lineTo(0, -w*0.76); cx.lineTo(w*0.50, -wh - 1); cx.stroke();
  inkStroke(2.2);
  cx.beginPath(); cx.moveTo(-w*0.58, -wh); cx.lineTo(0, -w*0.78); cx.lineTo(w*0.58, -wh); cx.closePath(); cx.stroke();
  const doorH = wh * 0.6;
  cx.fillStyle = '#3c2c1c';
  cx.fillRect(-w*0.09, -doorH, w*0.18, doorH);
  inkStroke(1.6); cx.strokeRect(-w*0.09, -doorH, w*0.18, doorH);
  const winLit = ambient() > 0.18;                     // businesses keep the lamps on
  cx.fillStyle = winLit ? '#ffca66' : '#2c3a52';
  cx.fillRect(w*0.18, -wh*0.72, w*0.16, wh*0.30);
  inkStroke(1.6); cx.strokeRect(w*0.18, -wh*0.72, w*0.16, wh*0.30);
  if (b.type === 'tavern') {                           // hanging mug sign + barrel
    inkStroke(2); cx.beginPath(); cx.moveTo(-w*0.5, -wh*0.95); cx.lineTo(-w*0.68, -wh*0.95); cx.stroke();
    cx.fillStyle = '#6b4e2f'; cx.fillRect(-w*0.74, -wh*0.92, w*0.20, wh*0.28);
    inkStroke(1.5); cx.strokeRect(-w*0.74, -wh*0.92, w*0.20, wh*0.28);
    cx.fillStyle = '#ffc300'; cx.beginPath(); cx.arc(-w*0.64, -wh*0.78, w*0.055, 0, TAU); cx.fill();
    cx.fillStyle = '#7a5836'; cx.fillRect(-w*0.42, -wh*0.30, w*0.14, wh*0.30);
    inkStroke(1.4); cx.strokeRect(-w*0.42, -wh*0.30, w*0.14, wh*0.30);
  } else if (b.type === 'shop') {                      // striped awning
    for (let i = 0; i < 5; i++) {
      cx.fillStyle = i % 2 ? '#e8ecf2' : '#c04438';
      cx.fillRect(-w*0.34 + i*w*0.15, -wh*0.86, w*0.15, wh*0.15);
    }
    inkStroke(1.6); cx.strokeRect(-w*0.34, -wh*0.86, w*0.75, wh*0.15);
  } else {                                             // sawbones: red-cross board
    cx.fillStyle = '#f2f6fb'; cx.fillRect(-w*0.34, -wh*0.92, w*0.22, wh*0.30);
    inkStroke(1.5); cx.strokeRect(-w*0.34, -wh*0.92, w*0.22, wh*0.30);
    cx.fillStyle = '#d0342c';
    cx.fillRect(-w*0.265, -wh*0.87, w*0.07, wh*0.20);
    cx.fillRect(-w*0.30, -wh*0.815, w*0.14, wh*0.07);
  }
  cx.restore();
  b.winX = flip ? x - w*0.26 : x + w*0.26;
  b.winY = y - wh*0.57;

function fireParticles(dt) {
  const f = G.fire, I = FIRE.intensity;
  if (I > 0.03) {
    const rate = 50 * I * dt;                       // flames per frame, fractional
    const want = Math.floor(rate) + (Math.random() < rate % 1 ? 1 : 0);
    for (let i = 0; i < want && flames.length < 90; i++) {
      flames.push({
        x: f.x + (Math.random()*2-1) * 10 * (0.6 + I),
        y: f.y - 2,
        vy: -(30 + Math.random()*40) * (0.5 + I),
        vx: (Math.random()*2-1) * 6,
        r: (4 + Math.random()*6) * (0.5 + I * 0.8),
        life: 0, max: 0.5 + Math.random()*0.55, ph: Math.random()*TAU,
      });
    }
    if (Math.random() < I * 0.3) smoke.push({ x: f.x + (Math.random()-0.5)*8, y: f.y - 26, vx: (Math.random()-0.5)*6 + 5, vy: -16, r: 4, life: 0, max: 3 });
  }
  cx.globalCompositeOperation = 'lighter';
  for (let i = flames.length - 1; i >= 0; i--) {
    const p = flames[i];
    p.life += dt;
    if (p.life >= p.max) { flames.splice(i, 1); continue; }
    const k = p.life / p.max;
    p.x += (p.vx + Math.sin(p.ph + p.life * 7) * 9) * dt;
    p.y += p.vy * dt;
    const hue = 48 - k * 34;
    cx.fillStyle = 'hsla(' + hue + ',100%,' + Math.round(62 - k * 22) + '%,' + (0.55 * (1 - k)) + ')';
    cx.beginPath(); cx.arc(p.x, p.y, Math.max(0.5, p.r * (1 - k * 0.7)), 0, TAU); cx.fill();
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life += dt;
    if (s.life >= s.max) { sparks.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 80 * dt;
    cx.fillStyle = 'hsla(38,100%,72%,' + (1 - s.life / s.max) + ')';
    cx.fillRect(s.x, s.y, 2, 2);
  }
  for (let i = motes.length - 1; i >= 0; i--) {
    const m = motes[i];
    m.life += dt;
    if (m.life >= m.max) { motes.splice(i, 1); continue; }
    m.y += m.vy * dt; m.vy *= (1 - dt * 0.6);
    const k = 1 - m.life / m.max;

    gg.addColorStop(0, 'rgba(255,230,150,' + (0.95 * k) + ')');
    gg.addColorStop(0.4, 'rgba(255,150,60,' + (0.6 * k) + ')');
    gg.addColorStop(1, 'rgba(255,150,60,0)');
    cx.fillStyle = gg; cx.beginPath(); cx.arc(m.x, m.y, 10, 0, TAU); cx.fill();
    if (Math.random() < 0.35) sparks.push({ x: m.x, y: m.y, vx: (Math.random()-0.5)*30, vy: 10, life: 0, max: 0.35 });
  }
  cx.globalCompositeOperation = 'source-over';
}

/* =============================== villagers =============================== */
const JOBS = [
  { res:'wood',  site:()=>({x:G.trees.x + 18, y:G.trees.y + 8}) },
  { res:'stone', site:()=>({x:G.rocks.x - 18, y:G.rocks.y + 8}) },
  { res:'food',  site:()=>({x:G.hole.x, y:G.hole.y - 10}) },
];
const COATS = ['#b4552f', '#3f6d8e', '#7a5f9c', '#4f7a4a', '#a8763e', '#8e3f55', '#54728c', '#6e5a3e', '#9c4f2f', '#3e6e64'];
const villagers = [];
function makeVillager(i, keeper) {
  const home = HOMES[i % houses()];
  return {
    id: i, keeper: !!keeper, forage: false,
    x: home.x + (Math.random()-0.5) * 30, y: home.y + 14 + Math.random() * 10,
    tx: 0, ty: 0, speed: 46 + Math.random() * 14,
    coat: COATS[i % COATS.length], home,
    state: 'idle', t: 0, wait: Math.random() * 2,
    job: null, carry: null, seat: -1, flip: 1, w: 0,
    shiver: Math.random() * TAU,
  };
}
function syncVillagers() {
  const want = popCap() + S.up.keeper;
  while (villagers.length < want) {
    const i = villagers.length;
    villagers.push(makeVillager(i, i >= popCap()));
  }
  /* Re-flag keepers (the last N are keepers) — and a villager whose ROLE just
     changed has to be kicked back to idle. RECRUIT VILLAGER raises popCap, which
     demotes the villager at the old boundary from keeper to worker; if it is
     left standing in `keeperGo`/`keeperWait` nothing in the state machine ever
     moves it again and it stops gathering for the rest of the run. Buying a
     firekeeper and then recruiting used to cost one worker per recruit. */
  villagers.forEach((v, i) => {
    const k = i >= popCap();
    if (k !== v.keeper) { v.keeper = k; vRelease(v); v.state = 'idle'; v.wait = 0; v.carry = null; v.forage = false; }
  });
}
const seatTaken = [false, false, false, false];
function vSetTarget(v, x, y) { v.tx = x; v.ty = y; }
function vArrived(v) { return Math.hypot(v.tx - v.x, v.ty - v.y) < 4; }
function vRelease(v) {
  if (v.seat >= 0) { seatTaken[v.seat] = false; v.seat = -1; }
  if (v.state === 'inside') v.home.inside = Math.max(0, (v.home.inside || 0) - 1);
}
function villagerStep(v, dt) {
  v.t += dt; v.shiver += dt * 10;
  const warm = FIRE.burning;
  const move = () => {
    const dx = v.tx - v.x, dy = v.ty - v.y, d = Math.hypot(dx, dy);
    if (d > 1) {
      const sp = v.speed * (S.up.tavern ? 1.15 : 1) * heatBoost() * dt;
      v.x += dx / d * Math.min(sp, d); v.y += dy / d * Math.min(sp, d);
      v.flip = dx < 0 ? -1 : 1;
    }
  };
  switch (v.state) {
    case 'idle': {
      v.wait -= dt * heatBoost();
      if (v.wait > 0) break;
      if (v.keeper) { v.state = 'keeperGo'; vSetTarget(v, G.fire.x + G.hitR * 0.55, G.fire.y + G.hitR * 0.5); break; }
      if (warm) {
        if (S.up.micro && S.focus) {
          // MICROMANAGEMENT: the player is directing the work, so no guessing
          v.job = JOBS.find(j => j.res === S.focus) || JOBS[0];
        } else {
          // pick the scarcest resource, slight randomness
          const order = JOBS.slice().sort((a, b) => S.res[a.res] - S.res[b.res]);
          v.job = Math.random() < 0.7 ? order[0] : order[Math.floor(Math.random() * 3)];
        }
        const s = v.job.site();
        v.state = 'toWork'; vSetTarget(v, s.x + (Math.random()-0.5)*14, s.y + (Math.random()-0.5)*8);
      } else {
        // cold: half go home, half huddle at the fire
        const free = seatTaken.indexOf(false);
        if (free >= 0 && Math.random() < 0.55) {
          seatTaken[free] = true; v.seat = free;
          const st = G.seats[free];
          v.state = 'toSeat'; vSetTarget(v, st.x, st.y - 6);
        } else {
          v.state = 'toHome'; vSetTarget(v, v.home.x + v.home.w * 0.15, v.home.y + 4);
        }
      }
      break;
    }
    case 'toWork':
      if (!warm && !v.forage) { vRelease(v); v.state = 'idle'; v.wait = 0; break; }
      move();
      if (vArrived(v)) { v.state = 'working'; v.t = 0; v.w = 0; }
      break;
    case 'working':
      if (!warm && !v.forage) { v.state = 'idle'; v.wait = 0; break; }
      v.w += dt * heatBoost();   // heat-scaled work clock: a roaring fire shortens the job itself
      if (v.w > (S.up.sawbones ? 2.4 : 3.2)) {
        v.carry = v.job.res;
        v.state = 'toStock'; vSetTarget(v, G.stock.x + (Math.random()-0.5)*10, G.stock.y + 6);
      } else if (v.job.res !== 'food' && Math.random() < dt * 2.2) {
        chips.push({ x: v.x + v.flip * 6, y: v.y - 6, vx: v.flip * 30 + (Math.random()-0.5)*30, vy: -40, life: 0, max: 0.5, c: v.job.res === 'wood' ? '#a97b43' : '#93a0b5' });
      }
      break;
    case 'toStock':
      move();
      if (vArrived(v)) {
        S.res[v.carry] += v.forage ? FORAGE_ARMFUL : tripYield();
        floats.push({ txt: '+' + (v.forage ? FORAGE_ARMFUL : tripYield()) + ' ' + RES_ICON[v.carry], x: v.x, y: v.y - 18, life: 0 });
        v.carry = null; v.forage = false;
        v.state = 'idle'; v.wait = 0.4 + Math.random() * 1.2;
      }
      break;
    case 'toSeat':
      move();
      if (vArrived(v)) { v.state = 'huddle'; v.t = 0; }
      break;
    case 'huddle':
      // seated: shiver when cold, relax when warm; stand up to work when warm
      if (warm && !v.keeper && v.t > 1 + Math.random() * 2) { vRelease(v); v.state = 'idle'; v.wait = 0; }
      break;
    case 'toHome':
      move();
      if (vArrived(v)) { v.state = 'inside'; v.home.inside = (v.home.inside || 0) + 1; v.t = 0; }
      break;
    case 'inside':
      if (warm && v.t > 0.8 + Math.random() * 1.5) { vRelease(v); v.state = 'leaveHome'; vSetTarget(v, v.home.x + (Math.random()-0.5)*40, v.home.y + 26); }
      break;
    case 'leaveHome':
      move();
      if (vArrived(v)) { v.state = 'idle'; v.wait = 0; }
      break;
    case 'keeperGo':
      move();
      if (vArrived(v)) { v.state = 'keeperWait'; v.t = 0; }
      break;
    case 'keeperWait': {
      // feed the fire when the bank runs low
      if (S.bank < maxBank() * 0.35 && S.res.wood >= 1 && v.t > 1.2) {
        S.res.wood -= 1;
        stoke(G.fire.x + (Math.random()-0.5)*10, G.fire.y - 6, 4);
        sfxLog();
        v.t = 0;
      }
      /* DESPERATE WOOD RUN — the camp's only recovery valve. A dead fire plus
         an empty woodpile is otherwise terminal: cold villagers huddle or go
         inside, so nothing is gathered, so the keeper has nothing to throw, so
         the fire stays dead forever. The keeper — whose whole job is feeding
         the fire — fetches an armful itself. This is deliberately the ONLY
         work that happens in the cold, it is one villager at cold (unboosted)
         pace, and it can only start from a state a tending player never
         reaches, so it buys a hands-off player SURVIVAL and never throughput.
         The keeper comes back with an ARMFUL (FORAGE_ARMFUL), not one log,
         and the size is load-bearing: a log is 4 s of fire, while a villager
         needs ~15 s to stand up, walk out, gather and deliver. Relighting on a
         single log therefore buys 4 s of warmth in which nobody can finish a
         trip — the camp flickers 4 s warm, 18 s cold, forever. An armful is
         ~32 s of continuous fire, which is one full round trip for everybody
         and is what actually restarts the economy. */
      if (!FIRE.burning && S.res.wood < 1) {
        v.forage = true;
        v.job = JOBS.find(j => j.res === 'wood') || JOBS[0];
        const s = v.job.site();
        v.state = 'toWork'; vSetTarget(v, s.x + (Math.random()-0.5)*14, s.y + (Math.random()-0.5)*8);
      }
      break;
    }
  }
}
function drawVillager(v) {
  if (v.state === 'inside') return;
  const warm = FIRE.burning;
  const seated = v.state === 'huddle';
  const working = v.state === 'working';
  const walking = !seated && !working && Math.hypot(v.tx - v.x, v.ty - v.y) > 3;
  const cold = !warm;
  const shk = cold ? Math.sin(v.shiver * 2.2) * 0.8 : 0;
  const bob = walking ? Math.abs(Math.sin(v.t * 8)) * 1.5 : 0;
  const x = v.x + shk, y = v.y - bob;
  cx.save(); cx.translate(x, y); cx.scale(v.flip, 1);
  // shadow
  cx.fillStyle = 'rgba(70,86,120,0.30)';
  cx.beginPath(); cx.ellipse(0, 1.5, 6, 2.4, 0, 0, TAU); cx.fill();
  const bh = seated ? 9 : 12;
  // legs
  if (!seated) {
    cx.strokeStyle = '#33415c'; cx.lineWidth = 2.4; cx.lineCap = 'round';
    const sw = walking ? Math.sin(v.t * 10) * 3 : 0;
    cx.beginPath(); cx.moveTo(-2, -bh + 8); cx.lineTo(-2 + sw, 0); cx.stroke();
    cx.beginPath(); cx.moveTo(2, -bh + 8); cx.lineTo(2 - sw, 0); cx.stroke();
  }
  // coat body (cel: flat fill + ink outline)
  cx.fillStyle = v.coat;
  cx.beginPath();
  if (cx.roundRect) cx.roundRect(-5, -bh - 4, 10, bh + (seated ? 4 : 5), 4); else cx.rect(-5, -bh - 4, 10, bh + 5);
  cx.fill();
  inkStroke(1.1); cx.stroke();
  cx.fillStyle = 'rgba(255,255,255,0.85)'; // fur trim
  cx.fillRect(-5, -bh - 4, 10, 2);
  // arms
  cx.strokeStyle = v.coat; cx.lineWidth = 2.6; cx.lineCap = 'round';
  if (seated && cold) {
    const rub = Math.sin(v.shiver * 3) * 1.6;
    cx.beginPath(); cx.moveTo(-4, -bh + 1); cx.lineTo(rub, -bh + 4); cx.stroke();
    cx.beginPath(); cx.moveTo(4, -bh + 1); cx.lineTo(-rub, -bh + 4); cx.stroke();
  } else if (working) {
    const sw = Math.sin(v.t * 9);
    cx.beginPath(); cx.moveTo(2, -bh + 1); cx.lineTo(7, -bh - 2 + sw * 5); cx.stroke();
    cx.strokeStyle = '#5a4632'; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(7, -bh - 2 + sw * 5); cx.lineTo(10, -bh - 6 + sw * 7); cx.stroke();
  } else if (seated && warm) {
    cx.beginPath(); cx.moveTo(-4, -bh + 1); cx.lineTo(-7, -bh + 5); cx.stroke();
    cx.beginPath(); cx.moveTo(4, -bh + 1); cx.lineTo(7, -bh + 5); cx.stroke();
  }
  // head + hood
  cx.fillStyle = '#e8b98f';
  cx.beginPath(); cx.arc(0, -bh - 8, 4.4, 0, TAU); cx.fill();
  inkStroke(1); cx.stroke();
  cx.fillStyle = v.keeper ? '#d0342c' : v.coat;
  cx.beginPath(); cx.arc(0, -bh - 8.6, 4.6, Math.PI * 1.05, Math.PI * 1.95); cx.fill();
  if (v.keeper) { cx.fillRect(-4.6, -bh - 9.4, 9.2, 2); }
  // carried resource
  if (v.carry) {
    cx.font = '9px sans-serif'; cx.textAlign = 'center';
    cx.fillText(RES_ICON[v.carry], 0, -bh - 15);
  }
  cx.restore();
  // breath puff in the cold
  if (cold && Math.random() < 0.01)
    smoke.push({ x: x + v.flip * 4, y: y - bh - 8, vx: v.flip * 6, vy: -6, r: 1.5, life: 0, max: 1.1 });
}

let bubble = null, lastLine = '';
const BUBBLE_DUR = 5;
function pickLine(v) {
  const pools = [];
  const add = (arr, w) => { if (arr && arr.length) for (let i = 0; i < w; i++) pools.push(arr); };
  if (v.carry) add(SAY.carry[v.carry], 5);
  if (v.keeper) add(SAY.keeper, 4);
  add(SAY[phaseName(S.dayT).toLowerCase()], 2);
  if (!FIRE.burning) add(SAY.cold, 3);
  else if (v.state === 'huddle') add(SAY.warm, 2);
  add(SAY.generic, 4);
  let line = SAY.generic[0];
  for (let tries = 0; tries < 8; tries++) {
    const pool = pools[Math.floor(Math.random() * pools.length)];
    line = pool[Math.floor(Math.random() * pool.length)];
    if (line !== lastLine) break;
  }
  lastLine = line;
  return line;
}
function wrapLine(text, maxW) {
  cx.font = '11px "Share Tech Mono", monospace';
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (cx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function speak(v) {
  if (bubble) return;                       // only one bubble at a time
  bubble = { v, lines: wrapLine(pickLine(v), 150), t: 0 };
  sfxPuff();
}
function villagerAt(x, y) {
  let best = null, bd = 1e9;
  for (const v of villagers) {
    if (v.state === 'inside') continue;
    const dx = x - v.x, dy = y - (v.y - 12);
    const d = Math.hypot(dx, dy);
    if (d < 20 && d < bd) { best = v; bd = d; }
  }
  return best;
}
function drawBubble(dt) {
  if (!bubble) return;
  bubble.t += dt;
  if (bubble.t >= BUBBLE_DUR || bubble.v.state === 'inside') { bubble = null; return; }
  const a = Math.min(1, bubble.t / 0.15) * Math.min(1, (BUBBLE_DUR - bubble.t) / 0.35);
  const v = bubble.v, lines = bubble.lines;
  cx.font = '11px "Share Tech Mono", monospace';
  let tw = 0;
  for (const l of lines) tw = Math.max(tw, cx.measureText(l).width);
  const pad = 7, lh = 13;
  const bw = tw + pad * 2, bh = lines.length * lh + pad * 2 - 3;
  const bx = Math.max(6, Math.min(W - 6 - bw, v.x - bw / 2));
  const by = v.y - 30 - bh;
  cx.globalAlpha = a;
  cx.fillStyle = 'rgba(250,252,255,0.96)';
  cx.strokeStyle = 'rgba(40,52,84,0.65)'; cx.lineWidth = 1.5;
  cx.beginPath();
  if (cx.roundRect) cx.roundRect(bx, by, bw, bh, 7); else cx.rect(bx, by, bw, bh);
  cx.fill(); cx.stroke();
  const tailX = Math.max(bx + 8, Math.min(bx + bw - 8, v.x));
  cx.beginPath();
  cx.moveTo(tailX - 5, by + bh - 0.5);
  cx.lineTo(tailX + 5, by + bh - 0.5);
  cx.lineTo(v.x, v.y - 24);
  cx.closePath();
  cx.fillStyle = 'rgba(250,252,255,0.96)'; cx.fill();
  cx.strokeStyle = 'rgba(40,52,84,0.65)';
  cx.beginPath(); cx.moveTo(tailX - 5, by + bh); cx.lineTo(v.x, v.y - 24); cx.lineTo(tailX + 5, by + bh); cx.stroke();
  cx.fillStyle = '#1c2540'; cx.textAlign = 'left';
  lines.forEach((l, i) => cx.fillText(l, bx + pad, by + pad + 9 + i * lh));
  cx.globalAlpha = 1;
  cx.textAlign = 'center';
}

/* =============================== weather & fx =============================== */
function weatherStep(dt) {
  if (snow.length < 90 && Math.random() < 0.5)
    snow.push({ x: Math.random() * W, y: -6, vx: 8 + Math.random() * 10, vy: 22 + Math.random() * 26, r: 1 + Math.random() * 1.6, ph: Math.random() * TAU });
  cx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = snow.length - 1; i >= 0; i--) {
    const s = snow[i];
    s.x += (s.vx + Math.sin(s.ph + s.y * 0.02) * 10) * dt;
    s.y += s.vy * dt;
    if (s.y > H + 4 || s.x > W + 8) { snow.splice(i, 1); continue; }
    cx.globalAlpha = 0.5 + 0.4 * Math.sin(s.ph);
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, TAU); cx.fill();
  }
  cx.globalAlpha = 1;
  for (let i = smoke.length - 1; i >= 0; i--) {
    const p = smoke[i];
    p.life += dt;
    if (p.life >= p.max) { smoke.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 4;
    const k = p.life / p.max;
    cx.fillStyle = 'rgba(210,215,228,' + (0.25 * (1 - k)) + ')';
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, TAU); cx.fill();
  }
  for (let i = chips.length - 1; i >= 0; i--) {
    const c = chips[i];
    c.life += dt;
    if (c.life >= c.max) { chips.splice(i, 1); continue; }
    c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 160 * dt;
    cx.fillStyle = c.c;
    cx.fillRect(c.x, c.y, 2.4, 2.4);
  }
  cx.font = '12px "Share Tech Mono", monospace'; cx.textAlign = 'center';
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life += dt / 1.1;
    if (f.life >= 1) { floats.splice(i, 1); continue; }
    cx.fillStyle = 'rgba(255,214,140,' + (1 - f.life) + ')';
    cx.strokeStyle = 'rgba(10,12,24,' + 0.5 * (1 - f.life) + ')'; cx.lineWidth = 3;
    cx.strokeText(f.txt, f.x, f.y - f.life * 30);
    cx.fillText(f.txt, f.x, f.y - f.life * 30);
  }
}

/* =============================== lighting =============================== */
function drawLighting() {
  const amb = ambient();
  if (amb < 0.015) return;
  const lw = light.width, lh = light.height, k = LSCALE;
  lx.setTransform(1, 0, 0, 1, 0, 0);
  lx.globalCompositeOperation = 'source-over';
  lx.clearRect(0, 0, lw, lh);
  // darkness ramps in below the skyline (sky palette darkens itself)
  const g = lx.createLinearGradient(0, G.horizon * k * 0.5, 0, G.horizon * k * 1.15);
  g.addColorStop(0, 'rgba(10,14,40,0)');
  g.addColorStop(1, 'rgba(10,14,40,' + amb + ')');
  lx.fillStyle = g;
  lx.fillRect(0, 0, lw, G.horizon * k * 1.15);
  lx.fillStyle = 'rgba(10,14,40,' + amb + ')';
  lx.fillRect(0, G.horizon * k * 1.15, lw, lh);
  // punch light holes
  lx.globalCompositeOperation = 'destination-out';
  const punch = (x, y, r, a) => {
    const gg = lx.createRadialGradient(x * k, y * k, 0, x * k, y * k, r * k);
    gg.addColorStop(0, 'rgba(0,0,0,' + Math.min(1, a) + ')');
    gg.addColorStop(0.35, 'rgba(0,0,0,' + Math.min(1, a * 0.55) + ')');
    gg.addColorStop(0.7, 'rgba(0,0,0,' + Math.min(1, a * 0.18) + ')');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    lx.fillStyle = gg;
    lx.beginPath(); lx.arc(x * k, y * k, r * k, 0, TAU); lx.fill();
  };
  const I = FIRE.intensity, flick = 1 + Math.sin(FIRE.flick * 1.7) * 0.06 + Math.sin(FIRE.flick * 3.1) * 0.04;
  if (I > 0.02) punch(G.fire.x, G.fire.y - 6, (85 + 120 * I) * flick, Math.min(0.85, I));
  else if (FIRE.ember > 0.01) punch(G.fire.x, G.fire.y, 40 * FIRE.ember, FIRE.ember * 0.5);
  for (const m of motes) punch(m.x, m.y, 55 * (1 - m.life / m.max) + 18, 0.9 * (1 - m.life / m.max));
  for (const h of activeHomes()) if (h.lit) punch(h.winX, h.winY, 46, 0.75);
  for (const b of activeBiz()) if (b.lit) punch(b.winX, b.winY, 40, 0.7);
  cx.drawImage(light, 0, 0, W, H);
  // warm additive tint at the light sources
  cx.globalCompositeOperation = 'lighter';
  const tint = (x, y, r, a) => {
    const gg = cx.createRadialGradient(x, y, 0, x, y, r);
    gg.addColorStop(0, 'rgba(255,150,60,' + a + ')');
    gg.addColorStop(1, 'rgba(255,150,60,0)');
    cx.fillStyle = gg; cx.beginPath(); cx.arc(x, y, r, 0, TAU); cx.fill();
  };
  if (I > 0.02) tint(G.fire.x, G.fire.y - 6, (70 + 90 * I) * flick, 0.3 * I * (0.25 + amb));
  for (const m of motes) tint(m.x, m.y, 55, 0.14 * (1 - m.life / m.max) * (0.3 + amb));
  for (const h of activeHomes()) if (h.lit) tint(h.winX, h.winY, 30, 0.08);
  for (const b of activeBiz()) if (b.lit) tint(b.winX, b.winY, 26, 0.07);
  cx.globalCompositeOperation = 'source-over';
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  audioInit();
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const vt = villagerAt(x, y);
  if (vt) { speak(vt); return; }           // villager taps never stoke; one bubble at a time
  const site = siteAt(x, y);               // MICROMANAGEMENT: direct the camp, or release it
  if (site) {
    S.focus = S.focus === site ? null : site;

    toast(S.focus ? 'EVERYONE ON ' + RES_ICON[site] + ' ' + S.focus.toUpperCase() : 'VILLAGERS CHOOSE FOR THEMSELVES');

  }
  const d = Math.hypot(x - G.fire.x, (y - G.fire.y) * 1.4);
  if (d <= G.hitR) { stoke(x, y, tapPower()); sfxTap(); }
  else { // a puff of kicked-up snow
    sfxPuff();
    for (let i = 0; i < 4; i++)
      smoke.push({ x, y, vx: (Math.random()-0.5)*26, vy: -12 - Math.random()*12, r: 2, life: 0, max: 0.7 });
  }
});

const $ = (id) => document.getElementById(id);

const upgPanel = $('upg-panel'), upgList = $('upg-list'), upgBtn = $('upg-btn'), upgSub = $('upg-sub');

function costStr(cost) {
  return Object.keys(cost).map(k =>
    '<span class="' + (S.res[k] >= cost[k] ? 'ok' : 'no') + '">' + RES_ICON[k] + ' ' + cost[k] + '</span>'
  ).join(' &nbsp;');
}
function canAfford(cost) { return Object.keys(cost).every(k => S.res[k] >= cost[k]); }
/* The ONE purchase path. The upgrade card calls it and so does the persona
   playtest harness (.claude/tests/eval-fire-clicker.cjs), so a headless run of
   the economy can never drift from what a real tap actually does. Returns
   whether the buy happened. Sound + panel rebuild stay with the card — they
   belong to the gesture, not to the transaction. */
function buyUpg(id) {
  const u = UPG.find(x => x.id === id);
  if (!u || !showU(u)) return false;
  const lvl = S.up[u.id] || 0, c = u.cost(lvl);
  if (lvl >= maxOf(u) || !canAfford(c)) return false;
  for (const k of Object.keys(c)) S.res[k] -= c[k];
  S.up[u.id] = lvl + 1;
  if (u.id === 'bunk' || u.id === 'keeper') syncVillagers();
  if (u.id === 'house' || u.id === 'village' || u.id === 'tavern' || u.id === 'shop' || u.id === 'sawbones') {
    layoutBuildings(); bakeGround();
  }
  if (u.id === 'keeper') toast('A FIREKEEPER TENDS THE FLAMES');
  if (u.id === 'micro') hint('Tap the trees, the rocks or the fishing hole to send everyone there. Tap it again to release them.');
  if (u.id === 'bellows') toast('THE BELLOWS BREATHE');
  if (u.id === 'village') toast('THE CAMP IS NOW A VILLAGE');
  if (u.id === 'tavern') toast('THE THIRSTY YETI IS OPEN');
  if (u.id === 'shop') toast('THE GENERAL STORE IS OPEN');
  if (u.id === 'sawbones') toast('THE SAWBONES WILL SEE YOU NOW');
  save();
  return true;
}
function buildUpgPanel() {
  upgList.innerHTML = '';
  upgSub.textContent = stageName() + ' · ' + villagers.filter(v => !v.keeper).length + '/' + (houses() * 5) +
    ' villagers in ' + houses() + ' house' + (houses() > 1 ? 's' : '') +
    (S.up.keeper ? ' + ' + S.up.keeper + ' firekeeper' + (S.up.keeper > 1 ? 's' : '') : '') +
    ' · they only work while the fire burns';
  for (const u of UPG) {
    if (!showU(u)) continue;
    const lvl = S.up[u.id], maxed = lvl >= maxOf(u);
    const el = document.createElement('button');
    el.className = 'up-card' + (maxed ? ' maxed' : '');
    el.dataset.uid = u.id;
    const cost = maxed ? null : u.cost(lvl);
    el.innerHTML =
      '<div class="ui">' + u.i + '</div>' +
      '<div class="um"><div class="un">' + u.n + '</div>' +
      '<div class="ud">' + (maxed ? 'Fully upgraded.' : u.d(lvl)) + '</div>' +
      (maxed ? '' : '<div class="uc">' + costStr(cost) + '</div>') + '</div>' +
      '<div class="ul">' + (maxed ? 'MAX' : 'Lv ' + lvl) + '</div>';
    if (!maxed) {
      if (canAfford(cost)) el.classList.add('afford');

function setPanelOpen(open) {

  if (open) buildUpgPanel();

$('upg-close').addEventListener('click', () => setPanelOpen(false));
muteBtn.addEventListener('click', () => { audioInit(); setMuted(!S.muted); });
let hudAcc = 0;
function refreshHUD() {
  const mark = (k) => (S.focus === k ? '\u25B8' : '') + RES_ICON[k] + ' ' + Math.floor(S.res[k]);
  resEl.innerHTML = mark('wood') + ' &nbsp;' + mark('stone') + ' &nbsp;' + mark('food');
  clockEl.textContent = stageName() + ' · DAY ' + S.day + ' · ' + phaseName(S.dayT);
  const any = UPG.some(u => showU(u) && S.up[u.id] < maxOf(u) && canAfford(u.cost(S.up[u.id])));
  upgBtn.classList.toggle('pulse', any && !upgPanel.classList.contains('open'));
  if (upgPanel.classList.contains('open')) {
    // keep affordability states live without rebuilding buttons mid-press
    for (const el of upgList.children) {
      const u = UPG.find(x => x.id === el.dataset.uid); if (!u) continue;
      const lvl = S.up[u.id];
      if (lvl < maxOf(u)) {
        const cost = u.cost(lvl);
        el.classList.toggle('afford', canAfford(cost));
        const uc = el.querySelector('.uc');
        if (uc) uc.innerHTML = costStr(cost);
      }
    }
  }
}

/* =============================== main loop =============================== */
let last = performance.now(), saveAcc = 0, healAcc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  // self-heal: iOS can hand every rotation event a stale box and then never
  // fire again — re-measure a few times a second and relayout on any
  // disagreement (a strict no-op once settled)
  healAcc += dt;
  if (healAcc > 0.2) {
    healAcc = 0;
    const vb = viewBox();
    if (Math.abs(vb.w - W) > 1 || Math.abs(vb.h - H) > 1) resize();
  }
  dayStep(dt);
  fireStep(dt);
  syncVillagers();
  for (const v of villagers) villagerStep(v, dt);

  drawSky();
  drawBackdrop();
  drawHole();
  // one y-sorted painter list so villagers pass in front of and behind buildings
  const items = [];
  for (const h of activeHomes()) items.push({ y: h.y, d: () => drawHouse(h) });
  for (const b of activeBiz()) items.push({ y: b.y, d: () => drawBiz(b) });
  for (const t of G.treeItems) items.push({ y: t.y + 2, d: () => drawTree(t) });
  for (const r of G.rockItems) items.push({ y: r.y, d: () => drawRock(r) });
  items.push({ y: G.stock.y + 2, d: drawStock });
  items.push({ y: G.fire.y + 2, d: drawFirePit });
  for (const s of G.seats) items.push({ y: s.y + 4, d: () => drawSeat(s) });
  for (const v of villagers) if (v.state !== 'inside') items.push({ y: v.y, d: () => drawVillager(v) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.d();
  fireParticles(dt);
  weatherStep(dt);
  drawLighting();
  drawFocus();
  drawBankRing();
  drawBubble(dt);

  hudAcc += dt;
  if (hudAcc > 0.25) { hudAcc = 0; refreshHUD(); }
  saveAcc += dt;
  if (saveAcc > 5) { saveAcc = 0; save(); }
  requestAnimationFrame(frame);
}

/* =============================== boot =============================== */
load();
resize();
setTimeout(resize, 120);
syncVillagers();
setMuted(S.muted);
refreshHUD();
if (S.lifeWarm > 10) hint('Welcome back. The fire is ' + (S.bank > 0 ? 'still burning.' : 'cold again — tap to relight it.'));
requestAnimationFrame(frame);
</script>
</body>
</html>
