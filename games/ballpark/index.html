/* ===================== RNG / RUN BUILD ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedFromString(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function buildRun(seed){
  const rng=mulberry32(seed), pool=BANK.map((q,i)=>i), out=[];
  for(let k=pool.length-1;k>0;k--){const j=Math.floor(rng()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]];}
  const seenCat={};
  // spread categories: walk the shuffled pool, prefer unseen categories first
  for(const idx of pool){
    if(out.length>=RUN_LEN) break;
    const c=BANK[idx].c;
    if((seenCat[c]||0)<2){ out.push(idx); seenCat[c]=(seenCat[c]||0)+1; }
  }
  for(const idx of pool){ if(out.length>=RUN_LEN) break; if(!out.includes(idx)) out.push(idx); }
  return out.slice(0,RUN_LEN);
}
/* ===================== DIAL MATH ===================== */
function posOf(q,v){
  if(q.s==='log'){
    const l0=Math.log10(q.lo), l1=Math.log10(q.hi);
    return (Math.log10(Math.max(v,1e-9))-l0)/(l1-l0);
  }
  return (v-q.lo)/(q.hi-q.lo);
}
function valOf(q,p){
  p=Math.max(0,Math.min(1,p));
  if(q.s==='log'){
    const l0=Math.log10(q.lo), l1=Math.log10(q.hi);
    return Math.pow(10,l0+p*(l1-l0));
  }
  return q.lo+p*(q.hi-q.lo);
}
function roundNice(q,v){
  if(q.s==='lin'){ return Math.round(v); }
  if(v>=1000) { const mag=Math.pow(10,Math.floor(Math.log10(v))-2); return Math.round(v/mag)*mag; }
  if(v>=100) return Math.round(v);
  if(v>=10) return Math.round(v*10)/10;
  return Math.round(v*100)/100;
}
function fmt(v){
  const av=Math.abs(v);
  if(av>=1e9) return (v/1e9).toFixed(av>=1e10?0:1).replace(/\.0$/,'')+' billion';
  if(av>=1e6) return (v/1e6).toFixed(av>=1e7?0:1).replace(/\.0$/,'')+' million';
  if(av>=1000) return Math.round(v).toLocaleString('en-US');
  if(av>=100) return String(Math.round(v));
  if(av>=10) return String(Math.round(v*10)/10);
  if(av>=1) return String(Math.round(v*100)/100);
  return String(Math.round(v*1000)/1000);
}

  applyMute();

function tone(freq,dur,vol,type,slide){
  if(!AC||muted) return;
  const o=AC.createOscillator(); o.type=type||'sine';
  o.frequency.setValueAtTime(freq,AC.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g); g.connect(sfxGain); o.start(); o.stop(AC.currentTime+dur+0.02);
}
function noise(dur,f0,f1,vol){
  if(!AC||muted) return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type='bandpass';
  f.frequency.setValueAtTime(f0,AC.currentTime);
  if(f1) f.frequency.exponentialRampToValueAtTime(f1,AC.currentTime+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  s.connect(f); f.connect(g); g.connect(sfxGain); s.start(); s.stop(AC.currentTime+dur+0.02);
}
let lastTick=0;
const S={
  tick:()=>{ const n=performance.now(); if(n-lastTick<32) return; lastTick=n; tone(1800,0.015,0.06,'square'); },
  lock:()=>{ tone(320,0.09,0.3,'square',180); noise(0.05,900,300,0.14); },
  sweep:()=>{ tone(500,0.5,0.12,'sine',1400); },
  good:(t)=>{ [0,80,160].forEach((d,i)=>setTimeout(()=>tone([523,659,784][i]*(t?1.5:1),0.22,0.2,'triangle'),d)); },
  bull:()=>{ [0,70,140,210].forEach((d,i)=>setTimeout(()=>tone([784,988,1175,1568][i],0.3,0.22,'triangle'),d)); noise(0.3,4000,900,0.12); },
  miss:()=>{ tone(200,0.3,0.22,'sawtooth',90); },
  end:()=>{ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.6,0.16,'triangle'),i*110)); },
};
// Light game-show shuffle: walking bass + soft off-beat stabs.
const BASS=[65.4,65.4,87.3,98.0,65.4,65.4,73.4,87.3];
function schedMusic(){
  if(!AC||muted||document.hidden) return;
  while(mNext<AC.currentTime+0.12){
    const st=mStep%8;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle'; o.frequency.value=BASS[st];
    g.gain.setValueAtTime(0.34,mNext); g.gain.exponentialRampToValueAtTime(0.001,mNext+0.34);
    o.connect(g); g.connect(musicGain); o.start(mNext); o.stop(mNext+0.36);
    if(st%2===1){ // hat
      const s=AC.createBufferSource(); s.buffer=noiseBuf;
      const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
      const hg=AC.createGain(); hg.gain.setValueAtTime(0.10,mNext); hg.gain.exponentialRampToValueAtTime(0.001,mNext+0.07);
      s.connect(f); f.connect(hg); hg.connect(musicGain); s.start(mNext); s.stop(mNext+0.09);
    }
    if(st===0||st===5){ // chord stab
      [261.6,311.1,392].forEach(fr=>{ const c=AC.createOscillator(),cg=AC.createGain();
        c.type='sine'; c.frequency.value=fr;
        cg.gain.setValueAtTime(0.07,mNext); cg.gain.exponentialRampToValueAtTime(0.001,mNext+0.5);
        c.connect(cg); cg.connect(musicGain); c.start(mNext); c.stop(mNext+0.52); });
    }
    mNext+=0.30; mStep++;
  }
}
document.addEventListener('visibilitychange',()=>{ if(AC){ if(document.hidden) AC.suspend(); else if(!muted) AC.resume(); }});

/* ===================== FLOW ===================== */
function startRun(m){
  mode=m;
  const seed = m==='daily' ? seedFromString('bp-'+todayKey()) : (Math.random()*4294967296)>>>0;
  run=buildRun(seed); qi=0; score=0; streak=0; bestStreak=0; results=[];
  guessPos=0.5; game='guess'; revealT=0;
  document.getElementById('menu').style.display='none';
  document.getElementById('end').style.display='none';
  setAct('LOCK IN',false);
}
function setAct(label,go){
  const b=document.getElementById('act-btn');
  b.textContent=label; b.style.display='block';
  b.classList.toggle('go',!!go);
}
function lockIn(){
  if(game!=='guess') return;
  const q=curQ();
  const truth=posOf(q,q.a);
  const d=Math.abs(guessPos-truth);
  revealAcc=Math.max(0,1-d/HIT_BAND);
  revealBull=d<=BULLSEYE;
  const mult=1+Math.min(4,streak)*0.5;              // x1 .. x3
  revealPts=Math.round(1000*revealAcc*mult)+(revealBull?500:0);
  lastGain=revealPts; score+=revealPts;
  if(revealAcc>0){ streak++; bestStreak=Math.max(bestStreak,streak); } else streak=0;
  results.push({i:run[qi],guess:valOf(q,guessPos),acc:revealAcc,pts:revealPts,bull:revealBull});
  game='reveal'; revealT=0; S.lock(); S.sweep();
  setTimeout(()=>{ if(revealBull) S.bull(); else if(revealAcc>0.5) S.good(false); else if(revealAcc<=0) S.miss(); },520);
  if(revealBull){ flash=1; }
  if(revealAcc<=0) shake=1;
  setAct(qi+1>=RUN_LEN?'SEE RESULTS':'NEXT',true);
}
function nextQ(){
  if(game!=='reveal') return;
  qi++;
  if(qi>=RUN_LEN){ endRun(); return; }
  guessPos=0.5; game='guess'; revealT=0; setAct('LOCK IN',false);
}
function endRun(){
  game='end';
  save.plays=(save.plays||0)+1;
  if(score>(save.best||0)) save.best=score;
  if(mode==='daily') save.daily[todayKey()]={score,best:bestStreak};
  persist(); S.end();
  document.getElementById('act-btn').style.display='none';
  const hits=results.filter(r=>r.acc>0).length, bulls=results.filter(r=>r.bull).length;
  document.getElementById('end-title').textContent = mode==='daily' ? 'DAILY TEN' : 'FREE PLAY';
  document.getElementById('end-score').textContent = score.toLocaleString('en-US');
  document.getElementById('end-stats').innerHTML =
    hits+' / '+RUN_LEN+' in the ballpark &middot; '+bulls+' bullseye'+(bulls===1?'':'s')+'<br>'+
    'best streak '+bestStreak+' &middot; personal best '+(save.best||0).toLocaleString('en-US')+
    (mode==='daily'?'<br><span style="color:#4488ff">daily saved for '+todayKey()+'</span>':'');
  document.getElementById('end').style.display='flex';
  syncMenu();
}
function syncMenu(){
  const d=save.daily&&save.daily[todayKey()];
  document.getElementById('menu-best').innerHTML=
    'personal best <b style="color:#39ff14">'+(save.best||0).toLocaleString('en-US')+'</b> &middot; '+
    (save.plays||0)+' run'+((save.plays||0)===1?'':'s')+
    (d?'<br>today’s daily: <b style="color:#ffc300">'+d.score.toLocaleString('en-US')+'</b> (play it again any time)':'');
}

/* ===================== INPUT ===================== */
let dialRect={x:0,y:0,w:0,h:0}, dragZone={x:0,y:0,w:0,h:0}, dragging=false;
function layout(){
  dialRect={x:26,y:Math.round(H*0.55),w:W-52,h:14};
  dragZone={x:0,y:dialRect.y-130,w:W,h:280};   // generous thumb band around the dial
}
function posFromX(x){ return Math.max(0,Math.min(1,(x-dialRect.x)/dialRect.w)); }
function pDown(x,y){
  audioInit();
  if(game!=='guess') return;
  if(y>=dragZone.y&&y<=dragZone.y+dragZone.h){ dragging=true; guessPos=posFromX(x); S.tick(); }
}
function pMove(x,y){ if(dragging&&game==='guess'){ const p=posFromX(x); if(Math.abs(p-guessPos)>0.0005){ guessPos=p; S.tick(); } } }
function pUp(){ dragging=false; }
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];pDown(t.clientX,t.clientY);},{passive:false});
cv.addEventListener('touchmove', e=>{e.preventDefault();const t=e.changedTouches[0];pMove(t.clientX,t.clientY);},{passive:false});
cv.addEventListener('touchend',  e=>{e.preventDefault();pUp();},{passive:false});
cv.addEventListener('touchcancel',()=>pUp());
cv.addEventListener('mousedown',e=>pDown(e.clientX,e.clientY));
window.addEventListener('mousemove',e=>pMove(e.clientX,e.clientY));
window.addEventListener('mouseup',()=>pUp());

function bindTap(el,fn){
  let last=0;
  const h=e=>{e.preventDefault();const n=performance.now();if(n-last<400)return;last=n;audioInit();fn();};
  el.addEventListener('touchend',h,{passive:false}); el.addEventListener('click',h);
}
bindTap(document.getElementById('mute-btn'),()=>{muted=!muted;localStorage.setItem('ballpark-mute',muted?'1':'0');applyMute();});
bindTap(document.getElementById('act-btn'),()=>{ if(game==='guess') lockIn(); else if(game==='reveal') nextQ(); });
bindTap(document.getElementById('daily-btn'),()=>startRun('daily'));
bindTap(document.getElementById('free-btn'),()=>startRun('free'));
bindTap(document.getElementById('again-btn'),()=>startRun(mode));
bindTap(document.getElementById('emenu-btn'),()=>{game='menu';
  document.getElementById('end').style.display='none';
  document.getElementById('menu').style.display='flex';
  document.getElementById('act-btn').style.display='none'; syncMenu();});

/* ===================== RENDER ===================== */
function wrapText(text,maxW,font){
  ctx.font=font;
  const words=text.split(' '),lines=[];let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;} else line=t;
  }
  if(line) lines.push(line);
  return lines;
}
function drawBG(){
  ctx.fillStyle='#06060e'; ctx.fillRect(0,0,W,H);
  // soft radial spotlight
  const g=ctx.createRadialGradient(W/2,H*0.30,20,W/2,H*0.30,H*0.75);
  g.addColorStop(0,'rgba(60,70,140,0.20)'); g.addColorStop(0.55,'rgba(30,34,70,0.08)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // faint grid
  ctx.strokeStyle='rgba(40,48,90,0.16)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x+0.5,0);ctx.lineTo(x+0.5,H);ctx.stroke();}
  for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y+0.5);ctx.lineTo(W,y+0.5);ctx.stroke();}
}
function draw(){
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake*9,(Math.random()-0.5)*shake*9); }
  drawBG();
  // 'end' also bails: qi has walked past the last question, so curQ() is undefined
  if(game==='menu'||game==='end'||!run.length){ ctx.restore(); return; }

  const q=curQ(), truth=posOf(q,q.a);

  // ---- HUD ----
  ctx.font='11px "Share Tech Mono"'; ctx.textAlign='left'; ctx.fillStyle='#8899bb';
  ctx.fillText((mode==='daily'?'DAILY':'FREE')+'  Q'+(qi+1)+'/'+RUN_LEN, 12, 58);
  ctx.textAlign='right'; ctx.fillStyle='#39ff14'; ctx.font='14px "Share Tech Mono"';
  ctx.fillText(score.toLocaleString('en-US'), W-12, 58);
  if(streak>0){
    ctx.textAlign='right'; ctx.fillStyle='#ffc300'; ctx.font='11px "Share Tech Mono"';
    ctx.fillText('STREAK x'+(1+Math.min(4,streak)*0.5).toFixed(1), W-12, 74);
  }
  // progress pips
  for(let i=0;i<RUN_LEN;i++){
    const px=12+i*((W-24)/RUN_LEN), pw=(W-24)/RUN_LEN-3;
    const r=results[i];
    ctx.fillStyle = r ? (r.bull?'#ffc300':(r.acc>0?'#39ff14':'#ff2244')) : (i===qi?'#4488ff':'rgba(136,153,187,0.22)');
    ctx.fillRect(px,84,pw,3);
  }

  // ---- category chip ----
  ctx.font='11px "Share Tech Mono"'; ctx.textAlign='center';
  const cw=ctx.measureText(q.c).width+22;
  ctx.fillStyle='rgba(68,136,255,0.12)'; ctx.strokeStyle='rgba(68,136,255,0.45)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(W/2-cw/2,104,cw,22,11); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#4488ff'; ctx.fillText(q.c,W/2,119);

  // ---- question ----
  const lines=wrapText(q.q,W-52,'19px "Share Tech Mono"');
  ctx.fillStyle='#dde3ff'; ctx.textAlign='center'; ctx.font='19px "Share Tech Mono"';
  lines.forEach((l,i)=>ctx.fillText(l,W/2,164+i*27));

  // ---- big readout ----
  const gv=roundNice(q,valOf(q,guessPos));   // the readout always shows YOUR guess
  ctx.textAlign='center';
  ctx.font='34px "Black Ops One"';
  ctx.fillStyle = game==='reveal' ? (revealAcc>0?'#39ff14':'#ff2244') : '#ffc300';
  ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=18;
  ctx.fillText(fmt(gv),W/2,H*0.40);
  ctx.shadowBlur=0;
  if(q.u){ ctx.font='13px "Share Tech Mono"'; ctx.fillStyle='#8899bb'; ctx.fillText(q.u,W/2,H*0.40+22); }

  // ---- dial ----
  const d=dialRect;
  ctx.fillStyle='rgba(20,24,48,0.9)';
  ctx.beginPath(); ctx.roundRect(d.x,d.y,d.w,d.h,7); ctx.fill();
  ctx.strokeStyle='rgba(90,105,170,0.5)'; ctx.lineWidth=1; ctx.stroke();
  // tick marks
  const ticks = q.s==='log' ? logTicks(q) : linTicks(q);
  ctx.font='9px "Share Tech Mono"'; ctx.textAlign='center';
  for(const t of ticks){
    const tx=d.x+t.p*d.w;
    ctx.strokeStyle='rgba(136,153,187,0.35)'; ctx.beginPath();
    ctx.moveTo(tx,d.y+d.h); ctx.lineTo(tx,d.y+d.h+5); ctx.stroke();
    ctx.fillStyle='rgba(136,153,187,0.55)'; ctx.fillText(t.l,tx,d.y+d.h+16);
  }
  // scoring band around the truth (revealed only)
  if(game==='reveal'){
    const bx0=d.x+Math.max(0,truth-HIT_BAND)*d.w, bx1=d.x+Math.min(1,truth+HIT_BAND)*d.w;
    const bg=ctx.createLinearGradient(bx0,0,bx1,0);
    bg.addColorStop(0,'rgba(57,255,20,0)'); bg.addColorStop(0.5,'rgba(57,255,20,0.30)'); bg.addColorStop(1,'rgba(57,255,20,0)');
    ctx.fillStyle=bg; ctx.fillRect(bx0,d.y,bx1-bx0,d.h);
  }
  // filled portion to needle
  const nx=d.x+guessPos*d.w;
  const fg=ctx.createLinearGradient(d.x,0,nx,0);
  fg.addColorStop(0,'rgba(255,195,0,0.10)'); fg.addColorStop(1,'rgba(255,195,0,0.45)');
  ctx.fillStyle=fg;
  ctx.beginPath(); ctx.roundRect(d.x,d.y,Math.max(2,nx-d.x),d.h,7); ctx.fill();
  // needle
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(255,195,0,0.85)'; ctx.fillRect(nx-2,d.y-16,4,d.h+32);
  ctx.fillStyle='rgba(255,195,0,0.25)'; ctx.fillRect(nx-7,d.y-16,14,d.h+32);
  ctx.restore();
  ctx.fillStyle='#ffc300';
  ctx.beginPath(); ctx.moveTo(nx,d.y-18); ctx.lineTo(nx-7,d.y-28); ctx.lineTo(nx+7,d.y-28); ctx.closePath(); ctx.fill();

  // truth marker sweeps in during reveal
  if(game==='reveal'){
    const e=Math.min(1,revealT/0.5), ease=1-Math.pow(1-e,3);
    const tx=d.x+(guessPos+(truth-guessPos)*ease)*d.w;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(57,255,20,0.9)'; ctx.fillRect(tx-1.5,d.y-16,3,d.h+32);
    ctx.fillStyle='rgba(57,255,20,0.22)'; ctx.fillRect(tx-6,d.y-16,12,d.h+32);
    ctx.restore();
    if(e>=1){
      ctx.fillStyle='#39ff14'; ctx.font='12px "Share Tech Mono"'; ctx.textAlign='center';
      ctx.fillText('ACTUAL',tx,d.y+d.h+34);
      ctx.font='16px "Share Tech Mono"';
      ctx.fillText(fmt(q.a)+(q.u?' '+q.u:''),W/2,d.y+d.h+58);
    }
  } else {
    ctx.fillStyle='rgba(136,153,187,0.5)'; ctx.font='11px "Share Tech Mono"'; ctx.textAlign='center';
    ctx.fillText('drag anywhere here to move the dial',W/2,d.y+d.h+46);
  }

  // ---- score popup ----
  if(game==='reveal'&&revealT>0.55){
    const a=Math.min(1,(revealT-0.55)*4);
    ctx.globalAlpha=a; ctx.textAlign='center';
    ctx.font='26px "Black Ops One"';
    ctx.fillStyle=revealBull?'#ffc300':(revealAcc>0?'#39ff14':'#ff2244');
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=16;
    const lift=Math.min(14,(revealT-0.55)*40);
    ctx.fillText(revealAcc>0?('+'+lastGain.toLocaleString('en-US')):'MISS',W/2,d.y+d.h+96-lift);
    ctx.shadowBlur=0;
    if(revealBull){ ctx.font='14px "Share Tech Mono"'; ctx.fillStyle='#ffc300';
      ctx.fillText('BULLSEYE  +500',W/2,d.y+d.h+118-lift); }
    else if(revealAcc>0){ ctx.font='12px "Share Tech Mono"'; ctx.fillStyle='#8899bb';
      ctx.fillText(Math.round(revealAcc*100)+'% of the band',W/2,d.y+d.h+116-lift); }
    ctx.globalAlpha=1;
  }
  ctx.restore();

  if(flash>0){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,195,0,'+(flash*0.16)+')'; ctx.fillRect(0,0,W,H); ctx.restore();
  }
}
function logTicks(q){
  const out=[],l0=Math.ceil(Math.log10(q.lo)),l1=Math.floor(Math.log10(q.hi));
  const step=Math.max(1,Math.round((l1-l0)/4));
  for(let e=l0;e<=l1;e+=step){
    const v=Math.pow(10,e);
    out.push({p:posOf(q,v),l:shortNum(v)});
  }
  return out;
}
function linTicks(q){
  const out=[];
  for(let i=0;i<=4;i++){ const v=q.lo+(q.hi-q.lo)*i/4; out.push({p:i/4,l:shortNum(v)}); }
  return out;
}
function shortNum(v){
  const av=Math.abs(v);
  if(av>=1e9) return (v/1e9)+'B';
  if(av>=1e6) return (v/1e6)+'M';
  if(av>=1000) return (v/1000)+'k';
  if(av>=1) return String(Math.round(v));
  return String(v);
}

/* ===================== LOOP ===================== */
let last=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  layout();
}
window.addEventListener('resize',resize);
resize();
function update(dt){
  if(game==='reveal') revealT+=dt;
  shake=Math.max(0,shake-dt*3);
  flash=Math.max(0,flash-dt*2);
}
function frame(ts){
  const dt=Math.min((ts-last)/1000||0.016,0.1); last=ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
syncMenu();
</script>
