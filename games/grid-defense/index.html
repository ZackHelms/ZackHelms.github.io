<style>

<script>
'use strict';
/* ============================== CONSTANTS ============================== */
const COLS = 9, ROWS = 13;
const FINAL_LEVEL = 100;
const BASE_LIVES = 20;
const SCORE_KEY = 'gridDefense.v2.scores';
const SET_KEY   = 'gridDefense.v2.settings';
const AUTO_KEY  = 'gridDefense.v2.auto';
const SLOT_KEY  = i => 'gridDefense.v2.slot' + i;
const SLOTS = 3;

/* ------------------------------- MAPS ---------------------------------
   One map per 10 levels (index = floor((level-1)/10), cycling in endless).
   `wp` waypoints are [row, col]; off-grid endpoints are the spawn/exit.
   `rocks` are unbuildable cells that are not road — they shape the build
   space so two maps with similar road length still play differently.     */
const MAPS = [
  { name: 'SERPENTINE',
    wp: [[-1,1],[3,1],[3,7],[6,7],[6,1],[9,1],[9,7],[12,7],[13.5,7]],
    rocks: [] },
  { name: 'SWITCHBACK',
    wp: [[-1,4],[1,4],[1,1],[4,1],[4,7],[7,7],[7,2],[10,2],[10,6],[12,6],[13.5,6]],
    rocks: [[0,0],[0,8],[12,0],[6,4]] },
  { name: 'THE COMB',
    wp: [[-1,0],[2,0],[2,8],[4,8],[4,1],[6,1],[6,8],[8,8],[8,1],[10,1],[10,8],[12,8],[13.5,8]],
    rocks: [[0,4],[12,3]] },
  { name: 'LONG MARCH',
    wp: [[-1,7],[2,7],[2,2],[5,2],[5,6],[8,6],[8,0],[11,0],[11,5],[13.5,5]],
    rocks: [[0,0],[0,1],[6,8],[7,8],[12,8]] },
  { name: 'THE FUNNEL',
    wp: [[-1,2],[4,2],[4,4],[1,4],[1,6],[6,6],[6,3],[9,3],[9,7],[12,7],[13.5,7]],
    rocks: [[2,0],[3,0],[8,0],[9,0],[11,2],[11,3]] },
  { name: 'CROSSROADS',
    wp: [[-1,4],[3,4],[3,0],[6,0],[6,8],[9,8],[9,3],[12,3],[13.5,3]],
    rocks: [[0,0],[0,8],[4,6],[5,6],[11,7],[12,7],[1,2]] },
  { name: 'THE SPIRAL',
    wp: [[-1,8],[1,8],[1,1],[10,1],[10,7],[4,7],[4,4],[7,4],[7,5],[13.5,5]],
    rocks: [[0,3],[0,4],[12,0],[12,8],[2,5]] },
  { name: 'HAIRPINS',
    wp: [[-1,1],[2,1],[2,6],[3,6],[3,2],[5,2],[5,7],[7,7],[7,2],[9,2],[9,7],[11,7],[11,3],[13.5,3]],
    rocks: [[0,7],[0,8],[12,0]] },
  { name: 'THE GAUNTLET',
    wp: [[-1,4],[3,4],[3,8],[7,8],[7,0],[10,0],[10,4],[13.5,4]],
    rocks: [[0,0],[0,1],[0,7],[0,8],[5,3],[5,4],[5,5],[12,1],[12,7]] },
  { name: 'LAST STAND',
    wp: [[-1,0],[1,0],[1,7],[3,7],[3,2],[5,2],[5,8],[8,8],[8,1],[11,1],[11,8],[13.5,8]],
    rocks: [[0,3],[0,4],[6,4],[7,4],[12,2],[12,3],[12,4]] },
];

/* ------------------------------ TOWERS -------------------------------- */
const TOWERS = {
  pulse: { name:'PULSE', shape:'tri',   col:'#39ff14', cost:40,  dmg:7,  rate:0.50, range:2.5,
           kind:'single', desc:'Fast single-target fire. Cheap, reliable, always available.' },
  nova:  { name:'NOVA',  shape:'circ',  col:'#ff2244', cost:70,  dmg:10, rate:1.05, range:2.2, aoe:1.3,
           kind:'splash', desc:'Splash rounds detonate on the lead target. Shreds packs.' },
  frost: { name:'FROST', shape:'flake', col:'#4488ff', cost:60,  dmg:3,  rate:0.80, range:2.3, slow:0.45, slowT:1.4,
           kind:'control', desc:'Chills targets to 55% speed. Multiplies every other tower.' },
  rail:  { name:'RAIL',  shape:'spike', col:'#b44fff', cost:110, dmg:36, rate:2.10, range:4.3,
           kind:'single', desc:'Long-range heavy slug. Built for armour and bosses.' },
};
const TOWER_ORDER = ['pulse','nova','frost','rail'];
const UNLOCK_COST = { pulse:0, nova:2, frost:2, rail:2 };
const MAX_TIER = 8;
const tierCost = t => 2 + 2 * t;              // cores to go from tier t to t+1
const TIER_DMG = 0.20, TIER_RANGE = 0.05, TIER_RATE = 0.06;

/* ------------------------------ CREEPS -------------------------------- */
const CREEPS = {
  runt:   { name:'RUNT',   hp:16,  spd:60,  bounty:6,  r:9,  col:'#ff8a1e', shape:'hex' },
  fast:   { name:'DART',   hp:12,  spd:104, bounty:7,  r:8,  col:'#ffd23f', shape:'chev' },
  swarm:  { name:'MITE',   hp:7,   spd:76,  bounty:3,  r:6,  col:'#dde3ff', shape:'sq' },
  brute:  { name:'BRUTE',  hp:58,  spd:42,  bounty:13, r:12, col:'#ffc300', shape:'oct' },
  armor:  { name:'PLATED', hp:70,  spd:48,  bounty:16, r:12, col:'#9fb3d9', shape:'oct', arm:6 },
  split:  { name:'SEEDER', hp:44,  spd:56,  bounty:14, r:11, col:'#ff5cf0', shape:'hex', splits:2 },
  healer: { name:'MENDER', hp:66,  spd:52,  bounty:20, r:11, col:'#2ee6a8', shape:'cross', heal:0.05 },
  boss:   { name:'WARDEN', hp:520, spd:33,  bounty:70, r:16, col:'#ff2244', shape:'star', arm:4, leak:3 },
};

/* --------------------------- DIFFICULTY CURVE -------------------------
   Tuned against the auto-player in .claude/tests/drive-grid-defense.cjs.  */
// Wave HP grows on an ACCELERATING exponent, not a flat one. A flat rate
// never bites: waves spread over ~60s, so a defence that holds at level 20
// still holds at 100 with the same headroom. The quadratic term is what
// turns the back half of the campaign into a real squeeze.
let HP_A = 0.040, HP_B = 0.00026;   // tunable from the drive suite's sweep
// Calibrated 2026-08-10 against .claude/tests/drive-grid-defense.cjs: the
// yardstick auto-player (coverage-optimal placement, fixed skill order, and
// notably NO use of the COMMAND abilities) first leaks at level 77 and falls
// at 86. A player who actually spends abilities and builds coherently has the
// headroom to reach 100 — which is the intended shape, not an accident.
const HP_ENDLESS = 1.075;    // steeper still past level 100
const SPD_GROWTH = 0.0032, SPD_CAP = 1.45;
const CASH_BASE = 95, CASH_GROWTH = 1.028;
function hpCurve(x) { return Math.exp(HP_A * x + HP_B * x * x); }
function hpMulFor(L) {
  if (L <= FINAL_LEVEL) return hpCurve(L - 1);
  return hpCurve(FINAL_LEVEL - 1) * Math.pow(HP_ENDLESS, L - FINAL_LEVEL);
}
function spdMulFor(L) { return Math.min(SPD_CAP, 1 + SPD_GROWTH * (L - 1)); }
function startCashFor(L) { return Math.round(CASH_BASE * Math.pow(CASH_GROWTH, L - 1)); }
function coresFor(L) { return 2 + Math.floor(L / 15) + (L % 10 === 0 ? 1 : 0); }
function skillPtsFor(L) { return L < 5 ? 0 : 1 + (L % 10 === 0 ? 2 : 0); }
function mapIndexFor(L) { return Math.floor((L - 1) / 10) % MAPS.length; }
const RESEARCH_COST = 5;     // cores -> 1 skill point

/* ------------------------------- RNG ---------------------------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================== STATE ================================= */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const ui = document.getElementById('ui');
let W = 0, H = 0, dpr = 1, safeTop = 0, safeBot = 0;
let boardX = 0, boardY = 0, cell = 42;
let state = 'menu';             // menu | play | dead
let phase = 'prep';             // prep | wave  (only meaningful while state==='play')
let run = null;                 // the campaign run (see newRun)
let S = null;                   // computed skill stat bag
let cash = 0;
let towers = [], creeps = [], spawnQueue = [], spawnList = [], beams = [], floats = [];
let waveT = 0, levelLeaks = 0, levelKills = 0;
let selTower = null, dragCard = null, dragPos = null;
let shake = 0, speed = 1, aimAbility = null;
let pathCells = new Set(), blockedCells = new Set(), segs = [], totalLen = 0, mapIdx = 0;
let abilities = [];

/* ---------------------------- PERSISTENCE ----------------------------- */
function readJSON(key, dflt) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : dflt; }
  catch (e) { return dflt; }
}
function writeJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { return false; }
}
const settings = Object.assign({ music: 45, sfx: 70, muted: false, speed: 1 }, readJSON(SET_KEY, {}));
function saveSettings() { writeJSON(SET_KEY, settings); }
function getScores() { const s = readJSON(SCORE_KEY, []); return Array.isArray(s) ? s : []; }
function addScore(entry) {
  const list = getScores();
  list.push(entry);
  list.sort((a, b) => b.score - a.score);
  writeJSON(SCORE_KEY, list.slice(0, 10));
}
function fmtWhen(ts) {
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '--';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtNum(n) { return Math.round(n).toLocaleString('en-US'); }

/* ============================== AUDIO ================================= */
let AC = null, sfxGain = null, musicGain = null, musicTimer = null, musicStep = 0, musicNext = 0;
const muteBtn = document.getElementById('mute');
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = AC.createGain(); sfxGain.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.connect(AC.destination);
    applyVolumes();
    musicNext = AC.currentTime + 0.1;
    musicTimer = setInterval(scheduleMusic, 25);
  } catch (e) { AC = null; }
}
function applyVolumes() {
  muteBtn.textContent = settings.muted ? '🔇' : '🔊';
  if (sfxGain) sfxGain.gain.value = settings.muted ? 0 : 0.5 * (settings.sfx / 100);
  if (musicGain) musicGain.gain.value = settings.muted ? 0 : 0.32 * (settings.music / 100);
}
function tone(freq, dur, type, vol, when, dest) {
  if (!AC || !isFinite(freq)) return;
  const t = when || AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest || sfxGain);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfxPulse() { tone(740, 0.05, 'square', 0.06); }
function sfxNova()  { tone(180, 0.18, 'sawtooth', 0.16); tone(120, 0.22, 'square', 0.09, AC && AC.currentTime + 0.05); }
function sfxFrost() { tone(1180, 0.1, 'sine', 0.09); tone(880, 0.09, 'sine', 0.07, AC && AC.currentTime + 0.06); }

function scheduleMusic() {

  const stepDur = 60 / 92 / 2;

    const s = musicStep % 8;
    if (BASSLINE[s]) tone(BASSLINE[s] * 2, stepDur * 1.6, 'triangle', 0.5, musicNext, musicGain);

function bindTap(el, fn) {
  if (!el) return;
  let last = 0;
  const h = e => {
    e.preventDefault();
    const now = Date.now();
    if (now - last < 350) return;
    last = now;

  };

}

function cellCx(c) { return boardX + c * cell + cell / 2; }
function cellCy(r) { return boardY + r * cell + cell / 2; }
function loadMap(idx) {
  mapIdx = idx;
  buildPath();
}
function buildPath() {
  const M = MAPS[mapIdx];
  pathCells = new Set(); blockedCells = new Set();
  segs = []; totalLen = 0;
  const wp = M.wp;
  for (let i = 0; i < wp.length - 1; i++) {
    const [r0, c0] = wp[i], [r1, c1] = wp[i + 1];
    const x0 = cellCx(c0), y0 = cellCy(r0), x1 = cellCx(c1), y1 = cellCy(r1);
    const len = Math.hypot(x1 - x0, y1 - y0);
    segs.push({ x0, y0, x1, y1, len, start: totalLen });
    totalLen += len;
    const steps = Math.ceil(Math.max(Math.abs(r1 - r0), Math.abs(c1 - c0))) * 2 + 1;
    for (let s = 0; s <= steps; s++) {
      const r = Math.round(r0 + (r1 - r0) * s / steps), c = Math.round(c0 + (c1 - c0) * s / steps);
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) pathCells.add(r + ',' + c);
    }
  }
  for (const [r, c] of (M.rocks || [])) {
    if (!pathCells.has(r + ',' + c)) blockedCells.add(r + ',' + c);
  }
}
function posAt(d) {
  d = Math.max(0, d);
  for (const s of segs) {
    if (d <= s.start + s.len) {
      const t = (d - s.start) / s.len;
      return { x: s.x0 + (s.x1 - s.x0) * t, y: s.y0 + (s.y1 - s.y0) * t };
    }
  }
  const s = segs[segs.length - 1];
  return { x: s.x1, y: s.y1 };
}
// The road's first/last waypoints sit off-grid so creeps walk on and off the
// board; anything drawn AT those points must be pulled back inside it.
function boardPoint(p) {
  return {
    x: Math.min(boardX + COLS * cell - cell * 0.5, Math.max(boardX + cell * 0.5, p.x)),
    y: Math.min(boardY + ROWS * cell - cell * 0.5, Math.max(boardY + cell * 0.5, p.y)),
  };
}
function towerAt(r, c) { return towers.find(t => t.r === r && t.c === c) || null; }
function canBuild(r, c) {
  return r >= 0 && r < ROWS && c >= 0 && c < COLS &&
    !pathCells.has(r + ',' + c) && !blockedCells.has(r + ',' + c) && !towerAt(r, c);
}

const NODE_BY_ID = {};
TREES.forEach(t => t.nodes.forEach(n => { NODE_BY_ID[n.id] = { node: n, tree: t }; }));
function nodeCost(n) { return TIER_PT[n.tier]; }
function treeSpent(treeId) {
  const tree = TREES.find(t => t.id === treeId);
  let s = 0;
  for (const n of tree.nodes) s += (run.skills[n.id] || 0) * nodeCost(n);
  return s;
}
function nodeUnlocked(n) {
  if (n.req.length && !n.req.some(id => (run.skills[id] || 0) > 0)) return false;
  if (n.gate && treeSpent(NODE_BY_ID[n.id].tree.id) < n.gate) return false;
  return true;
}
function nodeBlocker(n) {
  if (n.req.length && !n.req.some(id => (run.skills[id] || 0) > 0)) {
    return 'Needs a point in ' + n.req.map(id => NODE_BY_ID[id].node.name).join(' or ');
  }
  if (n.gate && treeSpent(NODE_BY_ID[n.id].tree.id) < n.gate) {
    return 'Needs ' + n.gate + ' points in this tree (' + treeSpent(NODE_BY_ID[n.id].tree.id) + ' spent)';
  }
  return null;
}

function baseStats() {
  return {
    dmgAll:1, dmgSingle:1, dmgSplash:1, dmgType:{ pulse:1, nova:1, frost:1, rail:1 },
    rate:1, range:1,
    crit:0, critMul:2.5, pierce:0, armorPen:0, burn:0, burnDur:0, execute:0,
    splashRadius:1, splashSlow:0,
    slowStr:0, slowDur:1, frozenDmg:0, chillAura:false,
    startCash:1, bounty:1, perKill:0, interest:0, buildCost:1, upCost:1, sellPct:0.7,
    maxLvl:3, foundry:0, gridBonus:0, targeting:false, reclaim:false,
    maxLives:0, leakGuard:0, lastStand:false,
    ab:{ airstrike:false, cryo:false, overdrive:false, repair:false },
    abPow:1, abCd:1, strikePow:1, repairPlus:0, orbital:false, absZero:false,
  };
}
function computeStats() {
  const s = baseStats();
  for (const tree of TREES) for (const n of tree.nodes) {
    const r = run.skills[n.id] || 0;
    if (r > 0) n.eff(s, r);
  }
  s.leakGuard = Math.min(0.6, s.leakGuard);
  s.crit = Math.min(0.75, s.crit);
  S = s;
  return s;
}

    ver: 2, level: 1, lives: BASE_LIVES, score: 0, cores: 0, sp: 0,
    armory, skills: {}, endless: false, started: Date.now(),
    levelsCleared: 0, leaksTotal: 0, killsTotal: 0, recorded: false,

  if (inRect(p, actionBtns.skills)) {
    if (phase === 'prep' && run.level >= 5) showSkills(true);
    else sfxDeny();
    return;
  }
  // selected-tower panel
  if (selTower !== null && towers[selTower]) {
    const t = towers[selTower];
    if (inRect(p, panelBtns.up)) { upgradeTower(t); return; }
    if (inRect(p, panelBtns.sell)) { sellTower(selTower); return; }
    if (inRect(p, panelBtns.mode)) {
      const modes = ['first', 'last', 'strong', 'close'];
      t.mode = modes[(modes.indexOf(t.mode) + 1) % modes.length];

const BAR_H = 60, ACTION_H = 42, ABILITY_H = 46;
function bottomStackHeight() {
  return BAR_H + ACTION_H + (abilities.length ? ABILITY_H : 0) + 10;
}
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  safeTop = parseFloat(cs.getPropertyValue('--sat')) || 0;
  safeBot = parseFloat(cs.getPropertyValue('--sab')) || 0;
  const topPad = safeTop + 68, botPad = safeBot + bottomStackHeight();
  cell = Math.max(6, Math.min((W - 8) / COLS, (H - topPad - botPad) / ROWS));
  boardX = (W - cell * COLS) / 2;
  boardY = topPad + Math.max(0, (H - topPad - botPad - cell * ROWS) / 2);
  buildPath();

/* =============================== RENDER =============================== */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function poly(g, x, y, r, n, rot) {
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * Math.PI * 2 / n;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
  }
  g.closePath();
}
/* Turret silhouettes — green triangle, red circle, blue snowflake outline,
   purple spike. Shared by the board and the armory icons.               */
function drawTurretShape(g, type, x, y, s) {
  const T = TOWERS[type];
  g.save();
  g.translate(x, y);
  g.strokeStyle = T.col; g.fillStyle = T.col + '2e'; g.lineWidth = Math.max(1.6, s * 0.13);
  g.shadowColor = T.col; g.shadowBlur = s * 0.5;
  if (T.shape === 'tri') {
    g.beginPath();
    g.moveTo(0, -s); g.lineTo(s * 0.92, s * 0.66); g.lineTo(-s * 0.92, s * 0.66); g.closePath();
    g.fill(); g.stroke();
  } else if (T.shape === 'circ') {
    g.beginPath(); g.arc(0, 0, s * 0.85, 0, 7); g.fill(); g.stroke();
  } else if (T.shape === 'flake') {
    g.lineWidth = Math.max(1.3, s * 0.1); g.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      const ex = Math.cos(a) * s, ey = Math.sin(a) * s;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(ex, ey); g.stroke();
      // two branches per spoke
      for (const f of [0.55, 0.82]) {
        const bx = Math.cos(a) * s * f, by = Math.sin(a) * s * f;
        for (const d of [-1, 1]) {
          const ba = a + d * Math.PI / 4;
          g.beginPath(); g.moveTo(bx, by);
          g.lineTo(bx + Math.cos(ba) * s * 0.3, by + Math.sin(ba) * s * 0.3);
          g.stroke();
        }
      }
    }
  } else {
    g.beginPath();
    g.moveTo(0, -s * 1.3); g.lineTo(s * 0.44, s * 0.72); g.lineTo(-s * 0.44, s * 0.72); g.closePath();
    g.fill(); g.stroke();
  }
  g.restore();
}
function drawTower(t, x, y, ghost) {
  const T = TOWERS[t.type];
  ctx.save();
  if (ghost) ctx.globalAlpha = 0.6;
  // base plate keeps turrets reading as structures next to the moving horde
  const bs = cell * 0.82;
  ctx.fillStyle = '#0d0d1c'; ctx.strokeStyle = T.col + '44'; ctx.lineWidth = 1;
  roundRect(x - bs / 2, y - bs / 2, bs, bs, bs * 0.24); ctx.fill(); ctx.stroke();
  drawTurretShape(ctx, t.type, x, y - cell * 0.03, cell * 0.27);
  ctx.shadowBlur = 0;
  const lvl = t.lvl || 1;
  for (let i = 0; i < lvl; i++) {
    ctx.fillStyle = T.col;
    ctx.fillRect(x - bs / 2 + 3 + i * 6, y + bs / 2 - 6, 4, 3);
  }
  if (run && run.armory[t.type] && run.armory[t.type].tier > 0 && !ghost) {
    ctx.fillStyle = '#ffc300';
    ctx.font = "8px 'Black Ops One'"; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('T' + run.armory[t.type].tier, x + bs / 2 - 3, y - bs / 2 + 2);

}
function angleAt(d) {
  for (const s of segs) if (d <= s.start + s.len) return Math.atan2(s.y1 - s.y0, s.x1 - s.x0);
  const s = segs[segs.length - 1];

}
function drawCreep(c) {

  const p = creepPos(c);
  const r = def.r * (cell / 42) * (c.elite ? 1.15 : 1);
  ctx.save();
  ctx.fillStyle = def.col + '3a'; ctx.strokeStyle = def.col; ctx.lineWidth = c.elite ? 2.6 : 2;
  ctx.shadowColor = def.col; ctx.shadowBlur = 7;
  if (def.shape === 'hex') poly(ctx, p.x, p.y, r, 6, 0);
  else if (def.shape === 'oct') poly(ctx, p.x, p.y, r, 8, Math.PI / 8);
  else if (def.shape === 'sq') poly(ctx, p.x, p.y, r * 1.05, 4, Math.PI / 4);
  else if (def.shape === 'chev') {
    const a = angleAt(c.d);
    ctx.beginPath();
    const px = (dx, dy) => [p.x + Math.cos(a) * dx - Math.sin(a) * dy, p.y + Math.sin(a) * dx + Math.cos(a) * dy];
    let q = px(r * 1.25, 0); ctx.moveTo(q[0], q[1]);
    q = px(-r * 0.7, r * 0.95); ctx.lineTo(q[0], q[1]);
    q = px(-r * 0.15, 0); ctx.lineTo(q[0], q[1]);
    q = px(-r * 0.7, -r * 0.95); ctx.lineTo(q[0], q[1]);
    ctx.closePath();

    const a = r * 0.42;
    ctx.beginPath();
    ctx.moveTo(p.x - a, p.y - r); ctx.lineTo(p.x + a, p.y - r); ctx.lineTo(p.x + a, p.y - a);
    ctx.lineTo(p.x + r, p.y - a); ctx.lineTo(p.x + r, p.y + a); ctx.lineTo(p.x + a, p.y + a);
    ctx.lineTo(p.x + a, p.y + r); ctx.lineTo(p.x - a, p.y + r); ctx.lineTo(p.x - a, p.y + a);
    ctx.lineTo(p.x - r, p.y + a); ctx.lineTo(p.x - r, p.y - a); ctx.lineTo(p.x - a, p.y - a);
    ctx.closePath();
  } else if (def.shape === 'star') {
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const a = Math.PI / 6 * i + c.d * 0.006;
      const rr = i % 2 === 0 ? r : r * 0.55;
      const x = p.x + Math.cos(a) * rr, y = p.y + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }

  if (c.slowT > 0 || freezeT > 0) {
    ctx.strokeStyle = '#4488ffcc'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(p.x, p.y, r + 3.5, 0, 7); ctx.stroke();
  }
  if (c.burnT > 0) {
    ctx.strokeStyle = '#ff7a1e99'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(p.x, p.y, r + 6, 0.4, 2.6); ctx.stroke();
  }
  ctx.restore();

  if (frac < 1) {
    const bw = Math.max(16, r * 2);
    ctx.fillStyle = '#1a1a30'; ctx.fillRect(p.x - bw / 2, p.y - r - 8, bw, 3);
    ctx.fillStyle = frac > 0.4 ? '#39ff14' : '#ff2244';

  }
}
function hudText(txt, x, y, col, font, align) {
  ctx.fillStyle = col; ctx.font = font; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';

function draw() {

  ctx.fillStyle = '#06060e'; ctx.fillRect(0, 0, W, H);

  if (state === 'menu' || !run) return;
  let ox = 0, oy = 0;
  if (shake > 0) { ox = (Math.random() - 0.5) * 9 * shake; oy = (Math.random() - 0.5) * 9 * shake; }
  ctx.save(); ctx.translate(ox, oy);

  /* ---- board ---- */
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (pathCells.has(r + ',' + c)) continue;      // the road is stroked below
    const x = boardX + c * cell, y = boardY + r * cell;
    if (blockedCells.has(r + ',' + c)) {

      ctx.strokeStyle = '#242438'; ctx.lineWidth = 1;

  // off-grid entry/exit read as it running off the edge instead of painting

  const wp = MAPS[mapIdx].wp;
  const roadPath = () => {
    ctx.beginPath();
    ctx.moveTo(cellCx(wp[0][1]), cellCy(wp[0][0]));
    for (let i = 1; i < wp.length; i++) ctx.lineTo(cellCx(wp[i][1]), cellCy(wp[i][0]));

  roadPath(); ctx.strokeStyle = '#2b2b58'; ctx.lineWidth = cell * 0.92; ctx.stroke();
  roadPath(); ctx.strokeStyle = '#16162e'; ctx.lineWidth = cell * 0.78; ctx.stroke();
  roadPath(); ctx.strokeStyle = '#33336a'; ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 12]); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  const exitP = boardPoint(posAt(totalLen)), spawnP = boardPoint(posAt(0));
  ctx.strokeStyle = '#ff2244'; ctx.fillStyle = '#ff224426'; ctx.lineWidth = 1.5;
  roundRect(exitP.x - cell * 0.4, exitP.y - cell * 0.4, cell * 0.8, cell * 0.8, 5); ctx.fill(); ctx.stroke();
  // stroke only — a filled box here reads as an empty build plate

    drawTower(t, cellCx(t.c), cellCy(t.r), false);
    if (i === selTower) {
      ctx.strokeStyle = TOWERS[t.type].col + '77'; ctx.lineWidth = 1.5;

      ctx.stroke();

  }

    ctx.fillStyle = f.color; ctx.font = "12px 'Black Ops One'";
    ctx.fillText(f.txt, f.x, f.y - f.t * 34);
    ctx.globalAlpha = 1;
  }

  hudText(lvlTxt, 10, hy, run.level > FINAL_LEVEL ? '#b44fff' : '#dde3ff', "12px 'Black Ops One'", 'left');
  hudText('♥' + run.lives, W * 0.40, hy, run.lives > 5 ? '#39ff14' : '#ff2244', "12px 'Black Ops One'", 'left');
  hudText('$' + fmtNum(cash), W * 0.56, hy, '#ffc300', "12px 'Black Ops One'", 'left');
  hudText(fmtNum(run.score), W - 10, hy, '#8899bb', "12px 'Black Ops One'", 'right');
  hudText(MAPS[mapIdx].name, 10, safeTop + 62, '#33385a', "9px 'Share Tech Mono'", 'left');

  let y = stackTop;
  if (abilities.length) {
    const n = abilities.length;
    const aw = Math.min(84, (W - 20 - (n - 1) * 8) / n), ah = ABILITY_H - 8;
    let ax = (W - (aw * n + 8 * (n - 1))) / 2;

      ctx.fillText(d.name, ax + aw / 2, y + ah / 2 - 5);
      ctx.font = "8px 'Share Tech Mono'";
      ctx.fillText(a.uses >= 0 ? (a.cd > 0 ? Math.ceil(a.cd) + 's' : a.uses + ' left')

    ctx.font = "12px 'Black Ops One'"; ctx.fillStyle = T.col;
    ctx.fillText(T.name + ' L' + t.lvl + (run.armory[t.type].tier ? ' · T' + run.armory[t.type].tier : ''), 12, barY + 4);
    ctx.font = "10px 'Share Tech Mono'"; ctx.fillStyle = '#8899bb';
    const dps = towerDamage(t) / towerPeriod(t);
    ctx.fillText('dmg ' + Math.round(towerDamage(t)) + ' · ' + dps.toFixed(0) + ' dps', 12, barY + 22);

      drawButton(panelBtns.mode, t.mode.toUpperCase(), '#8899bb', true);
    }

    const cw = Math.min(84, (W - 20 - (n - 1) * 8) / n), ch = BAR_H - 6;
    let x = (W - (cw * n + 8 * (n - 1))) / 2;
    for (const type of owned) {

      ctx.fillStyle = afford ? T.col + '12' : '#0b0b16';
      ctx.lineWidth = 1.5;
      roundRect(x, barY, cw, ch, 8); ctx.fill(); ctx.stroke();
      ctx.save();
      if (!afford) ctx.globalAlpha = 0.45;
      drawTurretShape(ctx, type, x + cw / 2, barY + 21, 12);
      ctx.restore();
      ctx.shadowBlur = 0;
      ctx.fillStyle = afford ? T.col : '#4b5470';
      ctx.font = "10px 'Black Ops One'"; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('$' + cost, x + cw / 2, barY + ch - 15);
      x += cw + 8;
    }
  }
  y += BAR_H;

  /* ---- action row ---- */
  const pad = 8, ah2 = ACTION_H - 8;
  const smallW = (W - pad * 5) * 0.20, readyW = (W - pad * 5) * 0.40;
  let ax2 = pad;
  actionBtns.armory = { x: ax2, y, w: smallW, h: ah2 }; ax2 += smallW + pad;
  actionBtns.skills = { x: ax2, y, w: smallW, h: ah2 }; ax2 += smallW + pad;
  actionBtns.speed  = { x: ax2, y, w: smallW, h: ah2 }; ax2 += smallW + pad;
  actionBtns.ready  = { x: ax2, y, w: readyW, h: ah2 };
  drawButton(actionBtns.armory, '◆ ' + run.cores, '#ffc300', phase === 'prep');
  drawButton(actionBtns.skills, '★ ' + run.sp, '#b44fff', phase === 'prep' && run.level >= 5);
  drawButton(actionBtns.speed, speed + 'x', '#4488ff', true);
  if (phase === 'prep') {
    drawButton(actionBtns.ready, 'START WAVE', '#39ff14', true);
  } else {
    const total = spawnList.length + creeps.length;

  }
}
/* =============================== SCREENS ============================== */
function bindClick(el, fn) { if (el) el.addEventListener('click', e => { initAudio(); fn(e); }); }
function openScreen(html) {
  paused = true;
  ui.innerHTML = html;
  ui.classList.remove('hidden');
}
function closeScreen() {
  curScreen = null;
  ui.classList.add('hidden');
  ui.innerHTML = '';
  paused = false;
}
function bind(id, fn) { bindTap(document.getElementById(id), fn); }
function paintIcons() {
  ui.querySelectorAll('canvas.ticon').forEach(cn => {
    const dp = Math.min(window.devicePixelRatio || 1, 3);
    cn.width = 44 * dp; cn.height = 44 * dp;
    const g = cn.getContext('2d');
    g.setTransform(dp, 0, 0, dp, 0, 0);
    drawTurretShape(g, cn.dataset.type, 22, 22, 13);
  });
}

/* ------------------------------- MENU --------------------------------- */
function showMenu() {
  state = 'menu';
  run = null; towers = []; creeps = []; abilities = [];
  const auto = hasSave(AUTO_KEY);
  const scores = getScores();
  const best = scores.length ? scores[0] : null;
  openScreen(`<div class="scr">
    <div class="scr-body" style="display:flex;flex-direction:column;justify-content:center;padding-top:calc(var(--sat) + 48px)">
      <div style="text-align:center">
        <h1 class="title">GRID DEFENSE</h1>
        <div class="sub">-- 100 LEVELS · HOLD THE LINE --</div>
      </div>
      <div style="margin-top:18px">
        ${auto ? `<button class="btn" id="m-cont">CONTINUE · LVL ${auto.run.level}</button>` : ''}
        <button class="btn ${auto ? 'alt' : ''}" id="m-new">NEW RUN</button>
        <button class="btn ghost" id="m-load">LOAD GAME</button>
        <button class="btn ghost" id="m-scores">SCOREBOARD</button>
        <button class="btn ghost" id="m-set">SETTINGS</button>
      </div>
      <div class="rules">
        Levels <b>1-100</b>, one wave each, a new map every ten. Cash resets every
        level — your <b style="color:var(--gold)">armory</b> and
        <b style="color:var(--purple)">skills</b> do not. Lives carry the whole run.<br>
        ${best ? `Best run: <b>${fmtNum(best.score)}</b> pts · level <b>${best.level}</b>` : 'No runs recorded yet.'}
      </div>
    </div>
  </div>`);
  bind('m-cont', () => { if (restoreFrom(AUTO_KEY)) { closeScreen(); resize(); } });
  bind('m-new', () => { auto ? confirmNewRun() : (closeScreen(), startRun()); });
  bind('m-load', () => showSlots('load', showMenu));
  bind('m-scores', () => showScoreboard(showMenu));
  bind('m-set', () => showSettings(showMenu));
}
function confirmNewRun() {
  openScreen(`<div class="scr">
    <div class="scr-body" style="display:flex;flex-direction:column;justify-content:center">
      <h2 class="head" style="text-align:center">START OVER?</h2>
      <div class="rules" style="text-align:center">A run is already in progress. Starting a new one
      replaces the auto-save — save it to a slot first if you want to keep it.</div>
      <button class="btn warn" id="c-yes" style="margin-top:16px">NEW RUN ANYWAY</button>
      <button class="btn ghost" id="c-slot">SAVE IT TO A SLOT FIRST</button>
      <button class="btn ghost" id="c-no">BACK</button>
    </div></div>`);
  bind('c-yes', () => { closeScreen(); startRun(); });
  bind('c-slot', () => { if (restoreFrom(AUTO_KEY)) showSlots('save', showMenu); });
  bind('c-no', showMenu);
}

/* ----------------------------- SCOREBOARD ------------------------------ */
function showScoreboard(back) {
  const scores = getScores();
  const rows = scores.length ? scores.map((s, i) => `<tr class="${i === 0 ? 'top' : ''}">
      <td class="num">${i + 1}</td>
      <td class="num">${fmtNum(s.score)}</td>
      <td class="num">${s.level}${s.won ? ' ★' : ''}</td>
      <td class="when">${fmtWhen(s.ts)}</td></tr>`).join('')
    : `<tr><td colspan="4" style="color:var(--dim);padding:18px 4px;text-align:center">No runs recorded yet.</td></tr>`;
  openScreen(`<div class="scr">
    <div class="scr-head"><h2 class="head">TOP 10 RUNS</h2><div class="sub">BY SCORE</div></div>
    <div class="scr-body">
      <table class="scores">
        <tr><th>#</th><th>SCORE</th><th>LEVEL</th><th>ENDED</th></tr>
        ${rows}
      </table>
      <div class="rules">★ marks a run that cleared level 100. Score comes from kills,
      level clears (bigger the deeper you get), flawless levels, and lives left standing.</div>
    </div>
    <div class="scr-foot"><button class="btn small ghost" id="s-back">BACK</button></div>
  </div>`);
  bind('s-back', back);
}

/* ------------------------------ SETTINGS ------------------------------- */
function showSettings(back) {
  openScreen(`<div class="scr">
    <div class="scr-head"><h2 class="head">SETTINGS</h2><div class="sub">AUDIO</div></div>
    <div class="scr-body">
      <div class="card">
        <div class="slider"><label>MUSIC</label><input type="range" id="v-music" min="0" max="100" value="${settings.music}"><div class="val" id="l-music">${settings.music}</div></div>
        <div class="slider"><label>SFX</label><input type="range" id="v-sfx" min="0" max="100" value="${settings.sfx}"><div class="val" id="l-sfx">${settings.sfx}</div></div>
        <div class="toggle"><span class="k">MUTE ALL</span><button id="t-mute" class="${settings.muted ? 'on' : ''}">${settings.muted ? 'MUTED' : 'AUDIO ON'}</button></div>
        <div class="toggle" style="border-bottom:none"><span class="k">DEFAULT SPEED</span><button id="t-speed" class="on">${settings.speed}x</button></div>
      </div>
      <div class="rules">More settings will land here as the game grows.</div>
    </div>
    <div class="scr-foot"><button class="btn small ghost" id="set-back">BACK</button></div>
  </div>`);
  const vm = document.getElementById('v-music'), vs = document.getElementById('v-sfx');
  vm.addEventListener('input', () => {
    settings.music = +vm.value; document.getElementById('l-music').textContent = vm.value;
    applyVolumes(); saveSettings();
  });
  vs.addEventListener('input', () => {
    settings.sfx = +vs.value; document.getElementById('l-sfx').textContent = vs.value;
    applyVolumes(); saveSettings();
  });
  bind('t-mute', () => {
    settings.muted = !settings.muted; applyVolumes(); saveSettings();
    const b = document.getElementById('t-mute');
    b.textContent = settings.muted ? 'MUTED' : 'AUDIO ON';
    b.className = settings.muted ? 'on' : '';
  });
  bind('t-speed', () => {
    settings.speed = settings.speed === 1 ? 2 : settings.speed === 2 ? 3 : 1;
    speed = settings.speed; saveSettings();
    document.getElementById('t-speed').textContent = settings.speed + 'x';
  });
  bind('set-back', back);
}

/* ---------------------------- SAVE / LOAD ------------------------------ */
function showSlots(mode, back) {
  const cards = [];
  for (let i = 1; i <= SLOTS; i++) {
    const d = hasSave(SLOT_KEY(i));
    cards.push(`<div class="card"><div class="kv">
      <div><div class="arm-name">SLOT ${i}</div>
      <div class="arm-desc">${d ? `Level ${d.run.level} · ${fmtNum(d.run.score)} pts · ♥${d.run.lives}<br>${fmtWhen(d.stamp)}` : 'empty'}</div></div>
      <button class="buybtn" id="slot-${i}" ${(!d && mode === 'load') ? 'disabled' : ''}>${mode === 'save' ? 'SAVE' : 'LOAD'}</button>
    </div></div>`);
  }
  openScreen(`<div class="scr">
    <div class="scr-head"><h2 class="head">${mode === 'save' ? 'SAVE GAME' : 'LOAD GAME'}</h2>
      <div class="sub">${mode === 'save' ? 'WRITES THE CURRENT RUN' : 'REPLACES THE CURRENT RUN'}</div></div>
    <div class="scr-body">${cards.join('')}
      <div class="rules">Your run also auto-saves at the start of every level — CONTINUE on
      the main menu picks that up. Slots are for keeping a run you want to come back to.</div>
    </div>
    <div class="scr-foot"><button class="btn small ghost" id="sl-back">BACK</button></div>
  </div>`);
  for (let i = 1; i <= SLOTS; i++) {
    bind('slot-' + i, () => {
      if (mode === 'save') {
        if (!run) return;
        saveTo(SLOT_KEY(i));
        showSlots('save', back);
      } else {
        if (restoreFrom(SLOT_KEY(i))) { closeScreen(); resize(); }
      }
    });
  }
  bind('sl-back', back);
}

/* ------------------------------ ARMORY --------------------------------- */
function armoryRow(type) {
  const T = TOWERS[type], a = run.armory[type];
  const locked = !a.owned;
  const cost = locked ? UNLOCK_COST[type] : (a.tier < MAX_TIER ? tierCost(a.tier) : null);
  const afford = cost !== null && run.cores >= cost;
  const pips = [];
  for (let i = 0; i < MAX_TIER; i++) pips.push(`<i class="${i < a.tier ? 'on' : ''}"></i>`);
  const eff = locked
    ? T.desc
    : `${T.desc}<br>TIER ${a.tier}: +${Math.round(TIER_DMG * a.tier * 100)}% dmg · +${Math.round(TIER_RATE * a.tier * 100)}% rate · +${Math.round(TIER_RANGE * a.tier * 100)}% range`;
  return `<div class="card ${locked ? '' : 'on'}"><div class="arm-row">
    <canvas class="ticon" data-type="${type}" style="${locked ? 'opacity:0.35' : ''}"></canvas>
    <div class="arm-mid">
      <div class="arm-name" style="color:${T.col}">${T.name}${locked ? ' · LOCKED' : ''}</div>
      <div class="arm-desc">${eff}</div>
      ${locked ? '' : `<div class="tierbar">${pips.join('')}</div>`}
    </div>
    <button class="buybtn ${locked ? 'locked' : ''}" id="buy-${type}" ${afford ? '' : 'disabled'}>
      ${cost === null ? 'MAX' : (locked ? 'UNLOCK<br>◆' + cost : 'TIER ' + (a.tier + 1) + '<br>◆' + cost)}
    </button>
  </div></div>`;
}
/* fromPrep=true means the player opened the armory mid-build-phase, so DEPLOY
   just returns to the board; otherwise this is the between-levels shop and
   DEPLOY starts the next level.                                            */
function showArmory(fromPrep) {
  const L = run.level;
  const canSkills = L >= 5;
  curScreen = 'armory'; armoryFromPrep = !!fromPrep;
  openScreen(`<div class="scr">
    <div class="scr-head" style="padding-bottom:2px">
      <h2 class="head">ARMORY</h2>
      <div class="sub">BEFORE LEVEL ${L}</div>
      <div style="margin-top:8px">
        <span class="pill cores">◆ <b id="a-cores">${run.cores}</b> CORES</span>
        <span class="pill sp">★ <b>${run.sp}</b> SKILL</span>
      </div>
    </div>
    <div class="scr-body" id="arm-list">
      ${TOWER_ORDER.map(armoryRow).join('')}
      <div class="card"><div class="arm-row">
        <div style="width:44px;text-align:center;font-size:1.3rem">🔬</div>
        <div class="arm-mid">
          <div class="arm-name" style="color:var(--purple)">RESEARCH</div>
          <div class="arm-desc">Melt ${RESEARCH_COST} cores down into 1 skill point. Cores you will never spend are worth more in a tree.</div>
        </div>
        <button class="buybtn" id="buy-research" style="border-color:var(--purple);color:var(--purple)" ${run.cores >= RESEARCH_COST ? '' : 'disabled'}>◆${RESEARCH_COST}<br>→ ★1</button>
      </div></div>
      <div class="rules">Armory upgrades are permanent for this run and apply to every tower of
      that type you place, on top of the level-by-level upgrades you buy with cash.</div>
    </div>
    <div class="scr-foot">
      <div class="row2">
        ${canSkills ? `<button class="btn small alt" id="a-skills" style="flex:1">★ SKILLS${run.sp ? ' (' + run.sp + ')' : ''}</button>` : ''}
        <button class="btn small" id="a-go" style="flex:1.4">DEPLOY · LVL ${L}</button>
      </div>
    </div>
  </div>`);
  paintIcons();
  for (const type of TOWER_ORDER) {
    bind('buy-' + type, () => {
      const a = run.armory[type];
      if (!a.owned) {
        if (run.cores < UNLOCK_COST[type]) return;
        run.cores -= UNLOCK_COST[type]; a.owned = true; sfxUnlock();
      } else if (a.tier < MAX_TIER) {
        const c = tierCost(a.tier);
        if (run.cores < c) return;
        run.cores -= c; a.tier++; sfxBuild();
      }
      autosave();
      showArmory(armoryFromPrep);
    });
  }
  bind('buy-research', () => {
    if (run.cores < RESEARCH_COST) return;
    run.cores -= RESEARCH_COST; run.sp += 1; sfxUnlock();
    autosave(); showArmory(armoryFromPrep);
  });
  bind('a-skills', () => showSkills(false));
  bind('a-go', () => {
    if (armoryFromPrep) { closeScreen(); resize(); return; }
    closeScreen();
    startLevel(L);
  });
}

/* ---------------------------- SKILL TREES ------------------------------ */
let curTree = 0, selNodeId = null, curScreen = null, armoryFromPrep = false, skillsFromBoard = false;
const NODE_W = 78, COL_GAP = 118, ROW_GAP = 92;
function nodeState(n) {
  const rank = run.skills[n.id] || 0;
  if (rank >= n.max) return 'max';
  if (!nodeUnlocked(n)) return 'locked';
  if (rank > 0) return 'taken';
  return 'avail';
}
/* fromBoard=true means BACK returns to the board; otherwise it returns to
   the between-levels armory the player came from.                         */
function showSkills(fromBoard) {
  curScreen = 'skills'; skillsFromBoard = !!fromBoard;
  openScreen(`<div class="scr">
    <div class="scr-head" style="padding-bottom:4px">
      <h2 class="head">SKILLS</h2>
      <div class="sub"><span class="pill sp">★ <b id="sk-pts">${run.sp}</b> UNSPENT</span></div>
    </div>
    <div id="tree-tabs"></div>
    <div id="tree-scroll"><div id="tree-inner"><svg id="tree-lines"></svg></div></div>
    <div id="tree-detail"></div>
    <div class="scr-foot"><button class="btn small ghost" id="sk-back">BACK</button></div>
  </div>`);
  renderTree();
  bind('sk-back', () => {
    if (skillsFromBoard) { closeScreen(); resize(); }
    else showArmory(false);
  });
}
function renderTree() {
  const tree = TREES[curTree];
  const tabs = document.getElementById('tree-tabs');
  tabs.innerHTML = TREES.map((t, i) =>
    `<button class="tab ${i === curTree ? 'sel' : ''}" data-i="${i}"
      style="${i === curTree ? 'border-color:' + t.col + ';color:' + t.col : ''}">${t.name}<br>
      <span style="font-size:0.55rem;opacity:0.7">${treeSpent(t.id)} PTS</span></button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b => bindClick(b, () => {
    curTree = +b.dataset.i; selNodeId = null; renderTree();
    document.getElementById('tree-scroll').scrollLeft = 0;
  }));

  const maxTier = Math.max(...tree.nodes.map(n => n.tier));
  const maxRow = Math.max(...tree.nodes.map(n => n.row));
  const wInner = 16 + (maxTier - 1) * COL_GAP + NODE_W + 20;
  const hInner = 12 + maxRow * ROW_GAP + NODE_W + 12;
  const px = n => 16 + (n.tier - 1) * COL_GAP;
  const py = n => 12 + n.row * ROW_GAP;

  const lines = [];
  for (const n of tree.nodes) {
    for (const rid of n.req) {
      const p = tree.nodes.find(x => x.id === rid);
      if (!p) continue;
      const x0 = px(p) + NODE_W, y0 = py(p) + NODE_W / 2;
      const x1 = px(n), y1 = py(n) + NODE_W / 2;
      const live = (run.skills[rid] || 0) > 0;
      lines.push(`<path d="M${x0} ${y0} C${x0 + 26} ${y0}, ${x1 - 26} ${y1}, ${x1} ${y1}"
        fill="none" stroke="${live ? tree.col : '#23233d'}" stroke-width="${live ? 2.2 : 1.4}"
        opacity="${live ? 0.85 : 0.6}"/>`);
    }
  }
  const nodes = tree.nodes.map(n => {
    const rank = run.skills[n.id] || 0;
    const st = nodeState(n);
    return `<button class="node ${st} ${n.tier === 5 ? 'cap' : ''} ${selNodeId === n.id ? 'sel' : ''}"
      data-id="${n.id}" style="left:${px(n)}px;top:${py(n)}px;color:${tree.col};
      ${st === 'avail' || st === 'taken' || st === 'max' ? 'border-color:' + tree.col : ''}">
      <span class="ic">${n.ic}</span>
      <span class="nm">${n.name}</span>
      <span class="rk" style="${rank ? 'color:' + tree.col : ''}">${rank}/${n.max}</span>
    </button>`;
  }).join('');

  const inner = document.getElementById('tree-inner');
  inner.style.width = wInner + 'px';
  inner.style.height = hInner + 'px';
  inner.innerHTML = `<svg id="tree-lines" width="${wInner}" height="${hInner}">${lines.join('')}</svg>` + nodes;
  inner.querySelectorAll('.node').forEach(b => bindClick(b, () => { selNodeId = b.dataset.id; renderTree(); }));
  document.getElementById('sk-pts').textContent = run.sp;
  renderDetail();
}
function renderDetail() {
  const det = document.getElementById('tree-detail');
  const tree = TREES[curTree];
  if (!selNodeId || !tree.nodes.some(n => n.id === selNodeId)) {
    det.innerHTML = `<div class="det-name" style="color:${tree.col}">${tree.name}</div>
      <div class="det-desc">${tree.blurb}<br>Scroll sideways to look down the branches. A node opens once
      you hold at least one point in a node feeding it; the round capstones also need 12 points in this tree.</div>`;
    return;
  }
  const n = tree.nodes.find(x => x.id === selNodeId);
  const rank = run.skills[n.id] || 0;
  const cost = nodeCost(n);
  const blocker = nodeBlocker(n);
  const maxed = rank >= n.max;
  const canBuy = !blocker && !maxed && run.sp >= cost;
  det.innerHTML = `<div class="det-name" style="color:${tree.col}">${n.ic} ${n.name}</div>
    <div class="det-desc">${n.info}</div>
    <div class="kv">
      <span class="k">RANK <b style="color:${tree.col}">${rank}</b> / ${n.max}${maxed ? '' : ' · COST ★' + cost}</span>
      ${maxed ? '<span class="k">MAXED</span>'
        : blocker ? `<span class="det-req">${blocker}</span>`
        : `<button class="buybtn" id="sk-buy" style="border-color:${tree.col};color:${tree.col}" ${canBuy ? '' : 'disabled'}>${canBuy ? 'SPEND ★' + cost : 'NEED ★' + cost}</button>`}
    </div>`;
  bind('sk-buy', () => {
    const c = nodeCost(n);
    if (run.sp < c || (run.skills[n.id] || 0) >= n.max || nodeBlocker(n)) return;
    const before = maxLives();
    run.skills[n.id] = (run.skills[n.id] || 0) + 1;
    run.sp -= c;
    computeStats();
    run.lives += Math.max(0, maxLives() - before);
    buildAbilities();
    sfxUnlock();
    autosave();
    renderTree();
  });
}

/* --------------------------- LEVEL / RUN END --------------------------- */
function showLevelClear(info) {
  const nextL = run.level;
  if (info.won) {
    openScreen(`<div class="scr"><div class="scr-body" style="display:flex;flex-direction:column;justify-content:center;text-align:center">
      <h1 class="title" style="color:var(--gold)">GRID SECURED</h1>
      <div class="sub">ALL 100 LEVELS HELD</div>
      <div class="big">${fmtNum(run.score)}</div>
      <div class="k">FINAL SCORE · ♥${run.lives} REMAINING</div>
      <div class="rules">The grid is yours. Endless mode keeps the waves coming with no ceiling —
      your score, armory and skills carry straight on. The run only ends when the last life goes.</div>
      <button class="btn gold" id="lc-endless" style="margin-top:14px">CONTINUE · ENDLESS</button>
      <button class="btn ghost" id="lc-retire">RETIRE · BANK THE SCORE</button>
    </div></div>`);
    sfxWin();
    bind('lc-endless', () => { closeScreen(); showArmory(false); });
    bind('lc-retire', () => {
      if (!run.recorded) {
        run.recorded = true;
        run.score += 200 * Math.max(0, run.lives);
        addScore({ ts: Date.now(), level: info.L, score: Math.round(run.score), won: true, endless: false });
        try { localStorage.removeItem(AUTO_KEY); } catch (e) {}
      }
      showScoreboard(showMenu);
    });
    return;
  }
  openScreen(`<div class="scr">
    <div class="scr-head"><h2 class="head">LEVEL ${info.L} CLEAR</h2>
      <div class="sub">${MAPS[mapIndexFor(info.L)].name}${info.noLeak ? ' · FLAWLESS' : ''}</div></div>
    <div class="scr-body" style="display:flex;flex-direction:column;justify-content:center">
      <div style="text-align:center"><div class="big">${fmtNum(run.score)}</div><div class="k">SCORE</div></div>
      <div class="card" style="margin-top:14px">
        <div class="kv"><span class="k">LEVEL BONUS</span><span class="v gold">+${fmtNum(info.clearScore)}</span></div>
        <div class="kv"><span class="k">FLAWLESS (NO LEAKS)</span><span class="v ${info.noLeak ? 'green' : 'red'}">${info.noLeak ? 'YES · +' + fmtNum(60 * info.L) : 'no'}</span></div>
        <div class="kv"><span class="k">KILLS</span><span class="v">${levelKills}</span></div>
        <div class="kv"><span class="k">LIVES</span><span class="v ${run.lives > 5 ? 'green' : 'red'}">♥ ${run.lives} / ${maxLives()}</span></div>
      </div>
      <div class="card">
        <div class="kv"><span class="k">CORES EARNED</span><span class="v gold">◆ +${info.gotCores}</span></div>
        <div class="kv"><span class="k">SKILL POINTS EARNED</span><span class="v" style="color:var(--purple)">★ +${info.gotSp}${info.L < 5 ? ' (unlocks at level 5)' : ''}</span></div>
      </div>
    </div>
    <div class="scr-foot"><button class="btn" id="lc-go">ARMORY · LVL ${nextL}</button></div>
  </div>`);
  bind('lc-go', () => showArmory(false));
}

      <div class="sub">FELL ON LEVEL ${run.level}</div></div>
    <div class="scr-body" style="display:flex;flex-direction:column;justify-content:center;text-align:center">
      <div class="big">${fmtNum(mine)}</div>
      <div class="k">FINAL SCORE</div>
      <div class="card" style="margin-top:12px;text-align:left">
        <div class="kv"><span class="k">LEVEL REACHED</span><span class="v">${run.level}</span></div>
        <div class="kv"><span class="k">LEVELS CLEARED</span><span class="v">${run.levelsCleared}</span></div>
        <div class="kv"><span class="k">TOTAL KILLS</span><span class="v">${fmtNum(run.killsTotal)}</span></div>
        <div class="kv"><span class="k">BEST RUN</span><span class="v gold">${best ? fmtNum(best.score) : '--'}</span></div>
      </div>

      A saved slot from earlier in the run can still be loaded.</div>
    </div>
    <div class="scr-foot">
      <button class="btn" id="go-new">NEW RUN</button>
      <div class="row2">
        <button class="btn small ghost" id="go-load" style="flex:1">LOAD</button>
        <button class="btn small ghost" id="go-menu" style="flex:1">MENU</button>
      </div>
    </div>
  </div>`);
  bind('go-new', () => { closeScreen(); startRun(); });
  bind('go-load', () => showSlots('load', showGameOver));
  bind('go-menu', showMenu);
}

/* ---------------------------- IN-GAME MENU ----------------------------- */
function showGameMenu() {
  if (state !== 'play' || !run) { showMenu(); return; }
  curScreen = 'pause';
  openScreen(`<div class="scr">
    <div class="scr-head"><h2 class="head">PAUSED</h2>
      <div class="sub">LEVEL ${run.level} · ${fmtNum(run.score)} PTS</div></div>
    <div class="scr-body" style="display:flex;flex-direction:column;justify-content:center">
      <button class="btn" id="g-resume">RESUME</button>
      <button class="btn ghost" id="g-save">SAVE GAME</button>
      <button class="btn ghost" id="g-load">LOAD GAME</button>
      <button class="btn ghost" id="g-set">SETTINGS</button>
      <button class="btn ghost" id="g-menu">MAIN MENU</button>
      <button class="btn warn" id="g-abandon">ABANDON RUN</button>
      <div class="rules">MAIN MENU leaves the run in the auto-save — CONTINUE picks it back up.
      ABANDON ends it now and writes the score to the board.</div>
    </div>
  </div>`);
  bind('g-resume', () => { closeScreen(); resize(); });
  bind('g-save', () => showSlots('save', showGameMenu));
  bind('g-load', () => showSlots('load', showGameMenu));
  bind('g-set', () => showSettings(showGameMenu));
  bind('g-menu', showMenu);
  bind('g-abandon', () => {
    if (!run.recorded) {
      run.recorded = true;
      run.score += 200 * Math.max(0, run.lives);
      addScore({ ts: Date.now(), level: run.level, score: Math.round(run.score),
        won: run.levelsCleared >= FINAL_LEVEL, endless: !!run.endless });
      try { localStorage.removeItem(AUTO_KEY); } catch (e) {}
    }
    showScoreboard(showMenu);
  });
}
bindTap(document.getElementById('menu-btn'), () => {
  if (!ui.classList.contains('hidden')) {
    if (curScreen === 'pause') { closeScreen(); resize(); }
    return;                       // every other screen owns its own exit
  }
  showGameMenu();
});

/* ================================ LOOP ================================= */
speed = settings.speed || 1;
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  const steps = (state === 'play' && !paused && phase === 'wave') ? speed : 1;
  for (let i = 0; i < steps; i++) update(dt);
  draw();
  requestAnimationFrame(loop);
}
resize();
showMenu();
requestAnimationFrame(loop);

/* ============================= TEST HOOKS ============================== */
window.__GD = {
  /* read */
  st: () => ({
    state, phase, level: run ? run.level : 0, lives: run ? run.lives : 0,
    score: run ? Math.round(run.score) : 0, cores: run ? run.cores : 0, sp: run ? run.sp : 0,
    cash, towers: towers.length, creeps: creeps.length, queued: spawnList.length,
    map: MAPS[mapIdx].name, mapIdx, paused, abilities: abilities.map(a => a.id),
    armory: run ? JSON.parse(JSON.stringify(run.armory)) : null,
    skills: run ? Object.assign({}, run.skills) : null,
    maxLives: S ? maxLives() : 0, buildable: buildableCells().length,
  }),
  S: () => S, run: () => run, towersRaw: () => towers, creepsRaw: () => creeps,
  MAPS, TOWERS, CREEPS, TREES, FINAL_LEVEL,
  /* drive */
  newRun: () => { closeScreen(); startRun(); },
  startLevel: L => { closeScreen(); startLevel(L); },
  ready: () => { closeScreen(); readyWave(); },
  step: (dt, n) => { const k = n || 1; for (let i = 0; i < k; i++) update(dt); },
  build: (type, r, c) => buildTower(type, r, c),
  upgrade: (r, c) => { const t = towerAt(r, c); return t ? upgradeTower(t) : false; },
  sell: (r, c) => { const i = towers.findIndex(t => t.r === r && t.c === c); return i >= 0 ? sellTower(i) : false; },
  buyArmory: type => {
    const a = run.armory[type];
    if (!a.owned) { if (run.cores < UNLOCK_COST[type]) return false; run.cores -= UNLOCK_COST[type]; a.owned = true; return true; }
    if (a.tier >= MAX_TIER) return false;
    const c = tierCost(a.tier);
    if (run.cores < c) return false;
    run.cores -= c; a.tier++; return true;
  },
  research: () => { if (run.cores < RESEARCH_COST) return false; run.cores -= RESEARCH_COST; run.sp++; return true; },
  spendSkill: id => {
    const e = NODE_BY_ID[id]; if (!e) return false;
    const n = e.node, c = nodeCost(n);
    if (run.sp < c || (run.skills[n.id] || 0) >= n.max || nodeBlocker(n)) return false;
    const before = maxLives();
    run.skills[n.id] = (run.skills[n.id] || 0) + 1;
    run.sp -= c; computeStats();
    run.lives += Math.max(0, maxLives() - before);
    buildAbilities();
    return true;
  },
  fireAbility: (id, x, y) => { const a = abilities.find(z => z.id === id); return a ? fireAbility(a, x, y) : false; },
  buildableCells, wave: L => buildWave(L), hpMulFor, startCashFor, coresFor, skillPtsFor,
  /* live hitbox tables, so a drive test can press the canvas-drawn UI the
     way a thumb does rather than calling the actions behind it */
  cardRects: () => cardRects.map(r => ({ type: r.type, x: r.x, y: r.y, w: r.w, h: r.h, afford: r.afford })),
  actionRects: () => actionBtns,
  panelRects: () => panelBtns,
  abilityRects: () => abilityRects.map(r => ({ id: r.ab.id, x: r.x, y: r.y, w: r.w, h: r.h })),
  setCurve: (a, b) => { HP_A = a; HP_B = b; },   // balance-sweep hook
  curve: () => ({ HP_A, HP_B }),
  pathSamples: n => {
    const out = [];
    for (let i = 0; i <= n; i++) out.push(posAt(totalLen * i / n));
    return out;
  },
  cellCx, cellCy, canBuild, totalLen: () => totalLen, cellSize: () => cell,
  addCash: n => { cash += n; }, setCash: n => { cash = n; },
  save: i => saveTo(SLOT_KEY(i)), load: i => restoreFrom(SLOT_KEY(i)),
  scores: getScores, clearStorage: () => { try { localStorage.clear(); } catch (e) {} },
  showMenu, showArmory, showSkills, showScoreboard: () => showScoreboard(showMenu),
  closeScreen,
};
function buildableCells() {
  const out = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (canBuild(r, c)) out.push({ r, c });
  return out;
}
</script>
