<style>:root{--bg:#0d1410;--panel:rgba(16,22,18,.86);--border:#33402f;--ink:#e8e4d4;--dim:#9aa58e;--gold:#e8c060;--green:#7fd36a;--red:#e8604c;--blue:#6aa8e8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Share Tech Mono',monospace;user-select:none;-webkit-user-select:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view.drag{cursor:grabbing}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;backdrop-filter:blur(3px)}
.hidden{display:none!important}
.chrome{position:fixed;top:calc(8px + env(safe-area-inset-top));z-index:80;width:38px;height:30px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--ink);font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;padding:0}
#back-btn{left:calc(8px + env(safe-area-inset-left))}
#mute-btn{left:calc(52px + env(safe-area-inset-left))}
#topbar{position:fixed;top:calc(8px + env(safe-area-inset-top));left:100px;right:110px;height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;z-index:60;font-size:14px;overflow:hidden;white-space:nowrap}
#clock{font-family:'Black Ops One',sans-serif;letter-spacing:.5px;min-width:120px;color:var(--gold)}
#speeds{display:flex;gap:3px}
.tb,.spd{background:transparent;border:1px solid var(--border);border-radius:5px;color:var(--ink);font:inherit;font-size:13px;padding:1px 7px;cursor:pointer}
.spd.on{background:var(--gold);color:#1a1508;border-color:var(--gold)}
.tb:hover,.spd:hover{border-color:var(--gold)}
select{background:#141c16;color:var(--ink);border:1px solid var(--border);border-radius:5px;font:inherit;font-size:13px;padding:2px 4px}
.side{position:fixed;top:calc(46px + env(safe-area-inset-top));bottom:10px;width:300px;z-index:50;overflow-y:auto;padding:10px 12px;font-size:13px}
.side.left{left:8px;width:250px}
.side.right{right:8px;width:330px}
h2{font-family:'Black Ops One',sans-serif;font-weight:normal;font-size:16px;margin:0 0 8px;color:var(--gold);letter-spacing:.5px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:12px 0 4px;font-weight:normal}
ol,ul{margin:0;padding:0;list-style:none}
#goal-list li{display:flex;align-items:center;gap:4px;padding:4px 0;border-bottom:1px solid #222b20}
#goal-list li .gl{flex:1;min-width:0}
#goal-list li .gs{display:block;color:var(--dim);font-size:11px}
#goal-list li.done .gl{color:var(--green)}
.mini{background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--ink);font:inherit;font-size:11px;padding:0 5px;cursor:pointer;line-height:18px}
.mini:hover{border-color:var(--gold)}
#goal-add{margin-top:8px;width:100%}
.x{position:absolute;top:6px;right:8px;background:transparent;border:0;color:var(--dim);font-size:15px;cursor:pointer}
.who{display:flex;gap:10px;align-items:center}
.swatch{width:26px;height:40px;border-radius:5px;flex:none;border:1px solid #000}
.role{color:var(--dim);font-size:12px}
.meter{display:grid;grid-template-columns:78px 1fr 34px;gap:6px;align-items:center;margin:2px 0}
.bar{position:relative;height:9px;background:#26301f;border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
.bar b{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35)}
.attrs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.attrs div{border:1px solid var(--border);border-radius:4px;padding:2px 0}
.attrs small{display:block;color:var(--dim);font-size:10px}
.tags{color:var(--ink);line-height:1.45}
.tags em{color:var(--dim);font-style:normal}
.task{padding:3px 0;border-bottom:1px solid #222b20;display:flex;gap:4px;align-items:flex-start}
.task .tl{flex:1}
.task .steps{color:var(--dim);font-size:11px;margin-top:2px}
.task .steps .cur{color:var(--gold)}
.now{border-left:3px solid var(--gold);padding-left:6px}
.log{color:var(--dim);font-size:11px;line-height:1.4}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:40}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:220px;background:#f4efdc;color:#1c1a12;border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.3;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.bubble:after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:#f4efdc;border-bottom:0}
.bubble.refuse{background:#ffe2d6}
.bubble.refuse:after{border-top-color:#ffe2d6}
.bubble .bn{font-weight:bold;display:block;font-size:10px;color:#6a5a2a}
#overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:20px}
#overlay>:first-child{margin-top:auto}#overlay>:last-child{margin-bottom:auto}
#overlay-card{max-width:560px;width:100%;padding:18px 20px;font-size:14px;line-height:1.5}
#overlay-card h1{font-family:'Black Ops One',sans-serif;font-weight:normal;color:var(--gold);margin:0 0 10px;font-size:24px}
#overlay-card button{margin:10px 8px 0 0}
.btn{background:var(--gold);color:#1a1508;border:0;border-radius:6px;font:inherit;font-size:14px;padding:6px 14px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--border)}
@media (max-width:820px){.side.left{display:none}.side.right{width:calc(100% - 16px);top:auto;height:45%}#topbar{right:8px;left:96px;top:calc(44px + env(safe-area-inset-top))}#speeds .spd:nth-child(n+5){display:none}}</style>

<script>
(function(){
"use strict";
/* ===== rng.js ===== */
// rng.js — seeded randomness. sfc32 core; named streams so one system's draws
// never shift another's (a test can then force one outcome without moving the rest).
// A stream's state is four uint32s, so a whole simulation can be saved and restored.
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function wrap(seed, name, st) {
  const r = {
    s: st,
    next() {
      const s = r.s;
      let a = s[0] >>> 0, b = s[1] >>> 0, c = s[2] >>> 0, d = s[3] >>> 0;
      let t = (a + b) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0;
      c = (c << 21) | (c >>> 11); d = (d + 1) | 0; t = (t + d) | 0; c = (c + t) | 0;
      s[0] = a >>> 0; s[1] = b >>> 0; s[2] = c >>> 0; s[3] = d >>> 0;
      return (t >>> 0) / 4294967296;
    },
    range: (a, b) => a + r.next() * (b - a),
    int: (a, b) => a + Math.floor(r.next() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(r.next() * arr.length)],
    chance: (p) => r.next() < p,
    stream: (n) => gen(seed, name + '/' + n),
    save: () => r.s.slice(),
    load: (arr) => { r.s = arr.slice(); return r; },
  };
  return r;
}
function gen(seed, name) {
  const h = fnv1a(String(seed) + '|' + name);
  const r = wrap(seed, name, [h, h ^ 0x9e3779b9, (Math.imul(h, 31) ^ 0x85ebca6b) >>> 0, fnv1a(name + '#' + seed)]);
  for (let i = 0; i < 12; i++) r.next();
  return r;
}
function makeRng(seed) { return gen(seed >>> 0, 'root'); }
function hashState(obj) { return fnv1a(JSON.stringify(obj)).toString(16).padStart(8, '0'); }

/* ===== island.js ===== */
// island.js — the island, generated from a seed. A heightfield + a land-cover grid
// baked once; everything (rendering, walking, jobs) samples these same arrays so
// they can never disagree (the Wayfinder rule).

const CELL = 2, IW = 500, IH = 350;           // 1000 m x 700 m
const COVER = { SEA: 0, SAND: 1, ROCKY: 2, GRASS: 3, FOREST: 4, CLIFF: 5, POND: 6, RIVER: 7 };
const CAMP_Y = 2.8;

const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const wrapA = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

function makeNoise(rng) {
  const P = new Uint16Array(512), V = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; V[i] = rng.next(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng.next() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  const v = (x, z) => V[P[(P[x & 255] + z) & 511] & 255];
  const n2 = (x, z) => {
    const xi = Math.floor(x), zi = Math.floor(z), fx = x - xi, fz = z - zi;
    const u = fx * fx * (3 - 2 * fx), w = fz * fz * (3 - 2 * fz);
    return lerp(lerp(v(xi, zi), v(xi + 1, zi), u), lerp(v(xi, zi + 1), v(xi + 1, zi + 1), u), w);
  };
  return (x, z, oct = 4) => {
    let s = 0, a = 1, f = 1, n = 0;
    for (let o = 0; o < oct; o++) { s += a * n2(x * f + o * 17.3, z * f - o * 9.1); n += a; a *= 0.5; f *= 2; }
    return s / n;
  };
}

function genIsland(seed) {
  const rng = makeRng(seed), R = rng.stream('island');
  const fbm = makeNoise(rng.stream('noise'));
  const W = IW, H = IH, N = W * H;
  const h = new Float32Array(N), cover = new Uint8Array(N);
  const cx0 = 500, cz0 = 350, rx = 440, rz = 300;
  const cellX = (i) => (i % W + 0.5) * CELL, cellZ = (i) => (Math.floor(i / W) + 0.5) * CELL;
  const mask = (x, z) => {
    const dx = (x - cx0) / rx, dz = (z - cz0) / rz;
    return 1 - Math.hypot(dx, dz) - 0.16 * (fbm(x / 170, z / 170) - 0.5) * 2;
  };

  // landing on the south shore (z+), camp 48 m inland
  const la = Math.PI / 2 + R.range(-0.3, 0.3);
  const dir = { x: Math.cos(la), z: Math.sin(la) };
  let sr = 0; while (mask(cx0 + dir.x * sr, cz0 + dir.z * sr) > 0 && sr < 600) sr += 1;
  const shore = { x: cx0 + dir.x * sr, z: cz0 + dir.z * sr };
  const landing = { x: shore.x - dir.x * 6, z: shore.z - dir.z * 6 };
  const camp = { x: shore.x - dir.x * 48, z: shore.z - dir.z * 48, r: 32 };
  const north = { x: -dir.x, z: -dir.z }, northA = Math.atan2(north.z, north.x);

  // the scarp: a cliff band ~430 m inland, on the far side of the island from camp, with two ramps
  const R0 = 418 + R.range(-8, 8), HS = 20 + R.range(0, 4);
  const ramp = [R.range(0.45, 0.6), -R.range(0.45, 0.6)];
  let pondA = R.range(-0.25, 0.25);
  const scarpAt = (x, z) => {
    const d = Math.hypot(x - camp.x, z - camp.z), a = wrapA(Math.atan2(z - camp.z, x - camp.x) - northA);
    const t = sstep(1.15, 0.85, Math.abs(a));
    let g = 1; for (const q of ramp) g *= sstep(0.04, 0.11, Math.abs(a - q));
    const r0 = R0 + 18 * (fbm(a * 2.2 + 40, 3.3, 2) - 0.5), w = lerp(80, 5, g);   // a ramp is the same rise over 80 m
    return HS * t * sstep(r0 - w / 2, r0 + w / 2, d);
  };

  for (let i = 0; i < N; i++) {
    const x = cellX(i), z = cellZ(i), m = mask(x, z);
    if (m < 0) { h[i] = -1.2 - 24 * Math.min(1, -m * 5); continue; }
    const back = Math.max(0, ((x - camp.x) * north.x + (z - camp.z) * north.z) / 600);
    const nf = 0.45 + 0.9 * Math.min(1, back);
    let y = 1.0 + 34 * Math.pow(sstep(0, 0.7, m), 1.3) * (0.5 + 0.7 * fbm(x / 260, z / 260)) * nf;
    y += 5 * (fbm(x / 55, z / 55, 3) - 0.5) * sstep(0, 0.15, m);
    y += scarpAt(x, z) * sstep(0, 0.04, m);
    h[i] = Math.max(y, 0.6);
  }
  // flatten the camp
  for (let i = 0; i < N; i++) {
    const d = Math.hypot(cellX(i) - camp.x, cellZ(i) - camp.z);
    const w = 1 - sstep(34, 62, d);
    if (w > 0) h[i] = lerp(h[i], CAMP_Y + 0.08 * (fbm(cellX(i) / 9, cellZ(i) / 9, 2) - 0.5), w);
  }
  const idx = (x, z) => Math.min(H - 1, Math.max(0, Math.floor(z / CELL))) * W + Math.min(W - 1, Math.max(0, Math.floor(x / CELL)));

  // pond at the foot of the scarp, the falls above it
  const pdir = { x: Math.cos(northA + pondA), z: Math.sin(northA + pondA) };
  let pd = R0 - 30; while (pd < R0 + 40 && scarpAt(camp.x + pdir.x * pd, camp.z + pdir.z * pd) < 0.5) pd += 0.5;
  const footD = pd - 16;
  const pond = { x: camp.x + pdir.x * footD, z: camp.z + pdir.z * footD, r: 13 };
  const ph = h[idx(pond.x, pond.z)] - 0.6;
  for (let i = 0; i < N; i++) {
    const d = Math.hypot(cellX(i) - pond.x, cellZ(i) - pond.z);
    if (d < pond.r) { h[i] = ph - 1.6; cover[i] = 255; }
    else if (d < pond.r + 8) h[i] = lerp(ph + 0.2, h[i], sstep(pond.r, pond.r + 8, d));
  }
  const topP = { x: camp.x + pdir.x * (pd + 9), z: camp.z + pdir.z * (pd + 9) };
  const falls = { top: { x: topP.x, z: topP.z, y: h[idx(topP.x, topP.z)] }, bottom: { x: camp.x + pdir.x * (footD + pond.r - 2), z: camp.z + pdir.z * (footD + pond.r - 2), y: ph } };
  // the stream that feeds the falls, cut into the plateau
  for (let s = 9; s < 60; s += 1) {
    const x = camp.x + pdir.x * (pd + s), z = camp.z + pdir.z * (pd + s), i = idx(x, z);
    if (h[i] > 0) cover[i] = 254;
  }

  // the river from the pond to the sea, bending away from camp
  const side = pondA >= 0 ? 1 : -1;
  const rA = Math.atan2(camp.z - pond.z, camp.x - pond.x) + side * 0.95;
  const river = [];
  let rx_ = pond.x + Math.cos(rA) * pond.r, rz_ = pond.z + Math.sin(rA) * pond.r;
  for (let s = 0; s < 900; s += 2) {
    const a = rA + 0.35 * Math.sin(s / 37) + 0.25 * (fbm(s / 60, 7.7, 2) - 0.5);
    rx_ += Math.cos(a) * 2; rz_ += Math.sin(a) * 2;
    if (rx_ < 2 || rz_ < 2 || rx_ > W * CELL - 2 || rz_ > H * CELL - 2) break;
    river.push({ x: rx_, z: rz_ });
    if (h[idx(rx_, rz_)] < -0.5) break;
  }
  let prevY = ph;
  for (const p of river) {
    const i0 = idx(p.x, p.z), y = Math.max(h[i0] - 0.6, -0.4); prevY = y;   // the bed follows the ground: no canyon walls
    for (let dz = -3; dz <= 3; dz += CELL) for (let dx = -3; dx <= 3; dx += CELL) {
      if (dx * dx + dz * dz > 9) continue;
      const i = idx(p.x + dx, p.z + dz);
      if (cover[i] === 255) continue;
      if (h[i] > -0.3) { h[i] = Math.min(h[i], y); cover[i] = 253; }
    }
  }

  // distance to the sea, in cells (8-neighbour BFS)
  const seaD = new Uint16Array(N).fill(65535), q = new Int32Array(N);
  let qh = 0, qt = 0;
  for (let i = 0; i < N; i++) if (h[i] < 0 && cover[i] === 0) { seaD[i] = 0; q[qt++] = i; }
  while (qh < qt) {
    const i = q[qh++], cx = i % W, cz = (i - cx) / W, nd = seaD[i] + 1;
    for (let oz = -1; oz <= 1; oz++) for (let ox = -1; ox <= 1; ox++) {
      const x = cx + ox, z = cz + oz; if (x < 0 || z < 0 || x >= W || z >= H) continue;
      const j = z * W + x; if (seaD[j] > nd) { seaD[j] = nd; q[qt++] = j; }
    }
  }

  // land cover
  const slopeCell = (i) => {
    const cx = i % W, cz = (i - cx) / W; let m = 0;
    for (const [ox, oz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const x = cx + ox, z = cz + oz; if (x < 0 || z < 0 || x >= W || z >= H) continue;
      m = Math.max(m, Math.abs(h[z * W + x] - h[i]) / CELL);
    }
    return m;
  };
  for (let i = 0; i < N; i++) {
    const x = cellX(i), z = cellZ(i), dc = Math.hypot(x - camp.x, z - camp.z), sd = seaD[i] * CELL;
    if (cover[i] === 255) { cover[i] = COVER.POND; continue; }
    if (cover[i] === 254 || cover[i] === 253) { cover[i] = COVER.RIVER; continue; }
    if (h[i] < 0) { cover[i] = COVER.SEA; continue; }
    if (dc < 36) { cover[i] = COVER.GRASS; continue; }
    if (slopeCell(i) > 1.1) { cover[i] = COVER.CLIFF; continue; }
    const dl = Math.hypot(x - landing.x, z - landing.z);
    if (sd < 16 && fbm(x / 40, z / 40, 3) > 0.6 && dl > 110) { cover[i] = COVER.ROCKY; continue; }
    if (sd < 22 && h[i] < 4.5) { cover[i] = COVER.SAND; continue; }
    if (scarpAt(x, z) > HS * 0.15 && scarpAt(x, z) < HS * 0.9 && fbm(x / 12, z / 12, 2) > 0.45) { cover[i] = COVER.ROCKY; continue; }
    if (fbm(x / 140 + 50, z / 140, 4) > 0.45 + 0.1 * sstep(160, 40, dc)) { cover[i] = COVER.FOREST; continue; }
    cover[i] = COVER.GRASS;
  }
  // scree: rocky ground at the scarp's foot
  for (let i = 0; i < N; i++) {
    if (cover[i] !== COVER.GRASS && cover[i] !== COVER.FOREST) continue;
    const x = cellX(i), z = cellZ(i);
    if (scarpAt(x, z) < 0.3 && scarpAt(x + north.x * 8, z + north.z * 8) > HS * 0.5 && fbm(x / 9, z / 9, 2) > 0.5) cover[i] = COVER.ROCKY;
  }

  const isl = { seed, CELL, W, H, h, cover, seaD, landing, camp, pond, falls, river, trees: [], rocks: [], bushes: [] };
  const O = rng.stream('objects');
  const free = (x, z, r) => Math.hypot(x - camp.x, z - camp.z) > r && Math.hypot(x - pond.x, z - pond.z) > pond.r + 6;
  const okLand = (x, z) => { const k = isl.cover[idx(x, z)]; return k === COVER.GRASS || k === COVER.FOREST || k === COVER.SAND; };
  const addTree = (x, z) => {
    const k = cover[idx(x, z)], y = h[idx(x, z)];
    const kind = k === COVER.SAND ? 'palm' : (y > 26 || fbm(x / 90, z / 90 + 9, 2) > 0.62) ? 'pine' : 'oak';
    isl.trees.push({ id: isl.trees.length, x, z, h: kind === 'palm' ? O.range(6, 9) : O.range(7, 13), kind, wood: 3 });
  };
  for (let z = 3; z < H * CELL; z += 5) for (let x = 3; x < W * CELL; x += 5) {
    const px = x + O.range(-2, 2), pz = z + O.range(-2, 2), k = cover[idx(px, pz)];

    for (let k = 0; k < 9; k++) {

function heightAt(isl, x, z) {
  const fx = x / isl.CELL - 0.5, fz = z / isl.CELL - 0.5;

  const a = h[z0 * W + x0], b = h[z0 * W + x0 + 1], c = h[(z0 + 1) * W + x0], d = h[(z0 + 1) * W + x0 + 1];
  return lerp(lerp(a, b, tx), lerp(c, d, tx), tz);
}
function coverAt(isl, x, z) {
  const cx = Math.floor(x / isl.CELL), cz = Math.floor(z / isl.CELL);
  if (cx < 0 || cz < 0 || cx >= isl.W || cz >= isl.H) return COVER.SEA;
  return isl.cover[cz * isl.W + cx];
}

  const e = 1;
  return Math.hypot(heightAt(isl, x + e, z) - heightAt(isl, x - e, z), heightAt(isl, x, z + e) - heightAt(isl, x, z - e)) / (2 * e);
}
// Seconds-per-metre multiplier for walking; Infinity where nobody can walk.
function walkCost(isl, x, z) {
  const k = coverAt(isl, x, z);
  if (k === COVER.SEA || k === COVER.CLIFF || k === COVER.POND) return Infinity;
  if (slopeAt(isl, x, z) > 0.9) return Infinity;
  if (k === COVER.ROCKY) return 1 / 0.35;
  if (k === COVER.RIVER) return 1 / 0.4;
  if (k === COVER.FOREST) return 1 / 0.8;
  return 1;
}

// nav.js — walking routes over the island: A* on a 4 m grid whose cost is the
// slowest ground in each cell, then string-pulled where the straight line is no slower.

const NAV_CELL = 4;
const WALK = 1 / 30;            // metres per game second (1.6 m/s real at 1x = 120 m per game hour)

function makeNav(isl) {
  const NW = Math.floor(isl.W * isl.CELL / NAV_CELL), NH = Math.floor(isl.H * isl.CELL / NAV_CELL), N = NW * NH;
  const cost = new Float32Array(N);
  for (let cz = 0; cz < NH; cz++) for (let cx = 0; cx < NW; cx++) {
    let m = 0;
    for (const [ox, oz] of [[1, 1], [3, 1], [1, 3], [3, 3], [2, 2]]) m = Math.max(m, walkCost(isl, cx * NAV_CELL + ox, cz * NAV_CELL + oz));
    cost[cz * NW + cx] = m;
  }
  // connected regions (4-connectivity, matching A*'s no-corner-cutting rule)
  const comp = new Int32Array(N).fill(-1), stack = new Int32Array(N);
  let nc = 0;
  for (let i = 0; i < N; i++) {
    if (comp[i] >= 0 || !Number.isFinite(cost[i])) continue;
    let sp = 0; stack[sp++] = i; comp[i] = nc;
    while (sp) {
      const c = stack[--sp], cx = c % NW, cz = (c - cx) / NW;
      if (cx > 0 && comp[c - 1] < 0 && Number.isFinite(cost[c - 1])) { comp[c - 1] = nc; stack[sp++] = c - 1; }
      if (cx < NW - 1 && comp[c + 1] < 0 && Number.isFinite(cost[c + 1])) { comp[c + 1] = nc; stack[sp++] = c + 1; }
      if (cz > 0 && comp[c - NW] < 0 && Number.isFinite(cost[c - NW])) { comp[c - NW] = nc; stack[sp++] = c - NW; }
      if (cz < NH - 1 && comp[c + NW] < 0 && Number.isFinite(cost[c + NW])) { comp[c + NW] = nc; stack[sp++] = c + NW; }
    }
    nc++;
  }
  const size = new Int32Array(nc); for (let i = 0; i < N; i++) if (comp[i] >= 0) size[comp[i]]++;
  let main = 0; for (let k = 1; k < nc; k++) if (size[k] > size[main]) main = k;
  const nav = { isl, NW, NH, cost, comp, main, g: new Float32Array(N), from: new Int32Array(N), seen: new Uint32Array(N), shut: new Uint32Array(N), gen: 0, heap: new Int32Array(N * 8), hf: new Float32Array(N * 8) };
  nav.cellOf = (x, z) => {
    const cx = Math.floor(x / NAV_CELL), cz = Math.floor(z / NAV_CELL);
    return cx < 0 || cz < 0 || cx >= NW || cz >= NH ? -1 : cz * NW + cx;
  };
  nav.costAt = (x, z) => { const c = nav.cellOf(x, z); return c < 0 ? Infinity : cost[c]; };
  return nav;
}

const centre = (nav, c) => ({ x: (c % nav.NW + 0.5) * NAV_CELL, z: (Math.floor(c / nav.NW) + 0.5) * NAV_CELL });

// The nearest walkable point in region `comp` (default: the island's main region).
function nearestPassable(nav, p, comp) {
  if (comp === undefined) comp = nav.main;
  const c0 = nav.cellOf(p.x, p.z);
  if (c0 >= 0 && nav.comp[c0] === comp) return { x: p.x, z: p.z };
  const cx = Math.floor(p.x / NAV_CELL), cz = Math.floor(p.z / NAV_CELL);
  for (let r = 1; r < 80; r++) {
    let best = null, bd = 1e9;
    for (let oz = -r; oz <= r; oz++) for (let ox = -r; ox <= r; ox++) {
      if (Math.max(Math.abs(ox), Math.abs(oz)) !== r) continue;
      const x = cx + ox, z = cz + oz; if (x < 0 || z < 0 || x >= nav.NW || z >= nav.NH) continue;
      const c = z * nav.NW + x; if (nav.comp[c] !== comp) continue;
      const q = centre(nav, c), d = Math.hypot(q.x - p.x, q.z - p.z);
      if (d < bd) { bd = d; best = q; }
    }
    if (best) return best;
  }
  return null;
}

// Max cost along a straight segment (1 m samples); Infinity if it leaves the walkable ground.
function lineCost(nav, a, b) {
  const L = Math.hypot(b.x - a.x, b.z - a.z), n = Math.max(1, Math.ceil(L));
  let m = 0;
  for (let i = 0; i <= n; i++) { const c = nav.costAt(a.x + (b.x - a.x) * i / n, a.z + (b.z - a.z) * i / n); if (c > m) m = c; if (m === Infinity) break; }
  return m;
}

function findPath(nav, from, to) {
  const fc = nav.cellOf(from.x, from.z), home = fc >= 0 && nav.comp[fc] >= 0 ? nav.comp[fc] : nav.main;
  const s0 = nearestPassable(nav, from, home), t0 = nearestPassable(nav, to, home);
  if (!s0 || !t0) return null;
  const S = nav.cellOf(s0.x, s0.z), T = nav.cellOf(t0.x, t0.z), NW = nav.NW, cost = nav.cost;
  if (S === T) return [t0];
  const gen = ++nav.gen, g = nav.g, fr = nav.from, seen = nav.seen, shut = nav.shut, heap = nav.heap, hf = nav.hf;
  let hn = 0;
  const tx = T % NW, tz = (T - tx) / NW;
  const hfun = (c) => { const dx = Math.abs(c % NW - tx), dz = Math.abs(Math.floor(c / NW) - tz); return (Math.max(dx, dz) + 0.4142 * Math.min(dx, dz)) * NAV_CELL; };
  const push = (c, f) => { let i = hn++; while (i > 0) { const p = (i - 1) >> 1; if (hf[p] <= f) break; heap[i] = heap[p]; hf[i] = hf[p]; i = p; } heap[i] = c; hf[i] = f; };
  const pop = () => {
    const top = heap[0], lc = heap[--hn], lf = hf[hn]; let i = 0;
    for (;;) { let l = 2 * i + 1; if (l >= hn) break; if (l + 1 < hn && hf[l + 1] < hf[l]) l++; if (hf[l] >= lf) break; heap[i] = heap[l]; hf[i] = hf[l]; i = l; }
    heap[i] = lc; hf[i] = lf; return top;
  };
  seen[S] = gen; g[S] = 0; fr[S] = -1; push(S, hfun(S));
  let found = false;
  while (hn > 0) {
    const c = pop();
    if (shut[c] === gen) continue;
    shut[c] = gen;
    if (c === T) { found = true; break; }
    const cx = c % NW, cz = (c - cx) / NW;
    for (let oz = -1; oz <= 1; oz++) for (let ox = -1; ox <= 1; ox++) {
      if (!ox && !oz) continue;
      const x = cx + ox, z = cz + oz; if (x < 0 || z < 0 || x >= NW || z >= nav.NH) continue;
      const n = z * NW + x, cn = cost[n]; if (!Number.isFinite(cn) || shut[n] === gen) continue;
      if (ox && oz && (!Number.isFinite(cost[cz * NW + x]) || !Number.isFinite(cost[z * NW + cx]))) continue;   // no corner cutting
      const ng = g[c] + (ox && oz ? 1.4142 : 1) * NAV_CELL * (cn + cost[c]) * 0.5;
      if (seen[n] !== gen || ng < g[n]) { seen[n] = gen; g[n] = ng; fr[n] = c; push(n, ng + hfun(n)); }
      if (hn >= heap.length - 8) return null;
    }
  }
  if (!found) return null;
  const cells = []; for (let c = T; c >= 0; c = fr[c]) cells.push(c);
  cells.reverse();
  const pts = cells.map((c) => centre(nav, c));
  pts[0] = s0; pts[pts.length - 1] = t0;
  // string-pull: skip ahead while the straight line is no slower than the slowest cell it replaces
  const out = []; let i = 0;
  while (i < pts.length - 1) {
    let j = pts.length - 1;
    for (; j > i + 1; j--) {
      let mx = 0; for (let k = i; k <= j; k++) mx = Math.max(mx, nav.costAt(pts[k].x, pts[k].z));
      if (lineCost(nav, pts[i], pts[j]) <= mx) break;
    }
    out.push(pts[j]); i = j;
  }
  return out;
}

// Game seconds to walk a polyline at walking pace over its ground.
function pathTime(nav, pts) {
  let t = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], L = Math.hypot(b.x - a.x, b.z - a.z), n = Math.max(1, Math.ceil(L / 2));
    for (let k = 0; k < n; k++) {
      const c = nav.costAt(a.x + (b.x - a.x) * (k + 0.5) / n, a.z + (b.z - a.z) * (k + 0.5) / n);
      t += (L / n) * (Number.isFinite(c) ? c : 3) / WALK;
    }
  }
  return t;
}

const HOUR = 3600, DAYS = 86400;
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

/* ------------------------------ lessons ------------------------------ */
function lessonParam(s, key) { return s.lessons[key] ? s.lessons[key].v : LESSONS[key].start; }
const learned = (s, key) => !!s.lessons[key];
function learnChance(s) { return clamp(0.15 + 0.04 * ((s.attrs.INT + s.attrs.WIS) / 2 - 10), 0.1, 0.6); }
function learnEvent(sim, s, key) {
  const L = LESSONS[key]; if (!L) return false;
  s.exp[key] = (s.exp[key] || 0) + 1;
  if (sim.R.learn.next() >= learnChance(s)) return false;
  const cur = lessonParam(s, key), v = cur + 0.6 * (L.target - cur);
  const first = !s.lessons[key];
  s.lessons[key] = { v, times: (s.lessons[key] ? s.lessons[key].times : 0) + 1, day: dayOf(sim) };
  s.stats.learned++;
  event(sim, s, 'learn', s.name + (first ? ' learned: ' : ' refined: ') + L.label + ' (' + L.fmt(v) + ').');
  if (first) say(sim, s, LEARNED[key], 'learn');
  return true;
}

/* ------------------------------ needs ------------------------------ */
// Returns the most pressing need: {kind, urgent, lesson}. Urgent needs interrupt work.
function needOf(sim, s, softToo = true) {
  const m = s.m, h = hourOf(sim), delayed = (k) => s.delay && s.delay[k] > sim.t;
  if (m.bladder < TUNE.peeAt) return { kind: 'pee', urgent: true };
  if (m.bowel < TUNE.pooAt) return { kind: 'poo', urgent: true };
  if (m.energy < lessonParam(s, 'overwork')) return { kind: 'sleep', urgent: true, lesson: 'overwork', why: 'energy' };
  if (m.hunger < lessonParam(s, 'skipMeal')) return { kind: 'eat', urgent: true, lesson: 'skipMeal' };
  if (!softToo) return null;
  const bed = lessonParam(s, 'lateNight');
  if ((h >= bed || h < 4.5) && !delayed('sleep')) return { kind: 'sleep', urgent: false, lesson: 'lateNight', why: 'bedtime' };
  const meal = (h >= 6.8 && h < 8.2) || (h >= 18.7 && h < 20.2) || (h >= 12.2 && h < 13 && m.hunger < 55);
  if (meal && m.hunger < 72 && mealUnits(sim) >= 1 && dist(s, sim.lay.fire) < 120 && !delayed('eat')) return { kind: 'eat', urgent: false, lesson: 'skipMeal' };
  if (m.clean < lessonParam(s, 'hygiene') && h > 7 && h < 18 && !delayed('bathe')) return { kind: 'bathe', urgent: false, lesson: 'hygiene' };
  if ((m.mood < 32 || m.health < 35) && !delayed('rest')) return { kind: 'rest', urgent: false };
  return null;
}
const NEED_KINDS = new Set(['pee', 'poo', 'sleep', 'eat', 'bathe', 'rest', 'collapse', 'persevere', 'home']);

function think(sim, s) {
  const n = needOf(sim, s);
  let T = null;
  if (n) T = makeTask(sim, s, n.kind, { need: n });
  if (!T) {
    while (s.plan.length && !T) {
      const it = s.plan[0];
      if (it.steps) { T = s.plan.shift(); break; }                       // a preempted task resumes
      if (it.owner === 'player' || it.pinned) { s.plan.shift(); T = makeTask(sim, s, it.kind, it.opts || {}); if (T) { T.pinned = !!it.pinned; T.owner = 'player'; } continue; }
      break;
    }
  }
  if (!T) { const k = nextWork(sim, s); if (k) T = makeTask(sim, s, k.kind, k.opts || {}); }
  if (!T) T = makeTask(sim, s, 'idle');
  T.started = sim.t; s.task = T;
  forecast(sim, s);
}

// Keep a short "what I plan to do next" list: the player's own items stay put, the leader's are refreshed.
function forecast(sim, s) {
  s.plan = s.plan.filter((it) => it.steps || it.owner === 'player' || it.pinned);
  const k1 = nextWork(sim, s, { dry: true, skip: s.task && s.task.kind });
  if (k1) s.plan.push({ id: sim.nextId++, kind: k1.kind, label: LABEL[k1.kind] || k1.kind, owner: 'leader', opts: k1.opts });
  const k2 = nextWork(sim, s, { dry: true, skip: k1 && k1.kind, skip2: s.task && s.task.kind });
  if (k2 && (!k1 || k2.kind !== k1.kind)) s.plan.push({ id: sim.nextId++, kind: k2.kind, label: LABEL[k2.kind] || k2.kind, owner: 'leader', opts: k2.opts });
  if (s.plan.length > 8) s.plan.length = 8;
}

// Called every 5 game minutes: urgent needs interrupt work, unless the player pinned it.
function checkInterrupts(sim, s) {
  const T = s.task; if (!T || NEED_KINDS.has(T.kind)) return;
  // out late, far from camp
  if (dist(s, sim.lay.fire) > 110 && hourOf(sim) >= lessonParam(s, 'farAtDusk') && hourOf(sim) < 23 && !T.pinned && T.kind !== 'explore') {
    if (T.kind === 'explore' && !learned(s, 'farAtDusk')) return;
    preempt(sim, s, makeTask(sim, s, 'home')); return;
  }
  const n = needOf(sim, s, false);
  if (!n) return;
  if (T.pinned) {
    if (n.lesson && learned(s, n.lesson)) { refuse(sim, s, n.lesson); T.pinned = false; preempt(sim, s, makeTask(sim, s, n.kind, { need: n })); }
    return;                                                    // obeying the player: pushing through
  }
  preempt(sim, s, makeTask(sim, s, n.kind, { need: n }));
}

function refuse(sim, s, key) {
  s.stats.refusals++;
  say(sim, s, REFUSALS[key], 'refuse');
  event(sim, s, 'refuse', s.name + ' refused: ' + REFUSALS[key]);
}

/* ------------------------------ the leader ------------------------------ */
// Sites for the first open build goals, in the order of the goals board.
function ensureSites(sim) {
  let opened = 0;
  for (const g of sim.goals) {
    const G = GOALS[g]; if (!G || G.food || goalDone(sim, g)) continue;
    if (!goalOpen(sim, g)) continue;
    const have = sim.sites.filter((x) => x.goal === g);
    const want = {}; for (const b of G.builds) want[b] = (want[b] || 0) + 1;
    for (const b in want) {
      let n = have.filter((x) => x.type === b).length;
      while (n < want[b]) {
        const B = BUILDINGS[b];
        let pos;
        if (b === 'bed') { const used = sim.sites.filter((x) => x.type === 'bed').length; pos = sim.lay.beds[used % sim.lay.beds.length]; }
        else pos = sim.lay.slots[b];
        sim.sites.push({ id: sim.nextId++, type: b, goal: g, x: pos.x, z: pos.z, yaw: pos.yaw, need: { ...B.cost }, have: { wood: 0, stone: 0 }, prog: 0, hours: B.hours, done: false });
        n++;
      }
    }
    if (++opened >= 2) break;
  }
}
const activeSites = (sim) => sim.sites.filter((x) => !x.done).sort((a, b) => sim.goals.indexOf(a.goal) - sim.goals.indexOf(b.goal));
function shortfall(sim) {
  const act = activeSites(sim);
  const need = { wood: 0, stone: 0 };
  for (const x of act) { need.wood += x.need.wood - x.have.wood; need.stone += x.need.stone - x.have.stone; }
  // look one goal ahead so the gatherer is never idle at a hand-over
  const next = sim.goals.find((g) => GOALS[g] && !GOALS[g].food && !goalDone(sim, g) && !sim.sites.some((x) => x.goal === g));
  if (next) for (const b of GOALS[next].builds) { need.wood += BUILDINGS[b].cost.wood; need.stone += BUILDINGS[b].cost.stone; }
  const piles = sim.piles.reduce((a, p) => { a[p.item] = (a[p.item] || 0) + p.n; return a; }, {});
  return { wood: need.wood - sim.stock.wood - (piles.wood || 0), stone: need.stone - sim.stock.stone - (piles.stone || 0) };
}
function leaderTick(sim) {
  ensureSites(sim);
  for (const s of sim.settlers) if (s.delay) for (const k in s.delay) if (s.delay[k] <= sim.t) delete s.delay[k];
}

const buildable = (sim) => activeSites(sim).filter((x) => {
  const frac = Math.min(x.have.wood / Math.max(1, x.need.wood), x.need.stone ? x.have.stone / x.need.stone : 1);
  return frac * x.hours > x.prog + 0.05;
});
const deliverable = (sim) => activeSites(sim).find((x) => (x.need.wood > x.have.wood && sim.stock.wood > 0) || (x.need.stone > x.have.stone && sim.stock.stone > 0));
const toolFree = (sim, k, s) => sim.tools[k].by == null || sim.tools[k].by === s.id;
const anyPile = (sim) => sim.piles.some((p) => !sim.world.reserved['p' + p.id]);
const trapsReady = (sim) => sim.traps.some((t) => t.catch || sim.t - (t.checked || t.set) > 20 * HOUR);
const rawFood = (sim) => foodCount(sim, 'meat') + foodCount(sim, 'fish');

function nextWork(sim, s, o = {}) {
  const skip = (k) => o.skip === k || o.skip2 === k;
  const sh = shortfall(sim), food = mealUnits(sim), target = foodTarget(sim), h = hourOf(sim), N = sim.settlers.length;
  const B = buildable(sim), D = deliverable(sim);
  const pick = (...opts) => { for (const [cond, kind] of opts) if (cond && !skip(kind)) return { kind }; return null; };
  const foodJob = () => {
    if (trapsReady(sim)) return 'checktraps';
    if (sim.traps.length < 4) return 'trap';
    if (toolFree(sim, 'spear', s) && h < 17.5) return 'fish';
    return 'forage';
  };
  const lowTool = TOOLS.some((k) => sim.tools[k].cond < Math.max(55, lessonParam(s, 'dullTools')));
  if (s.role === 'leader') {
    const sad = sim.settlers.find((o2) => o2 !== s && o2.m.mood < 50 && o2.act !== 'sleep');
    return pick(
      [((h >= 6 && h < 7.5) || (h >= 17.6 && h < 19.2) || (h >= 11.5 && h < 12.3)) && (rawFood(sim) > 0 || (foodCount(sim, 'meal') < N && foodCount(sim, 'berries') >= 3)), 'cook'],
      [built(sim, 'dryrack') && rawFood(sim) > 2 && foodCount(sim, 'meal') >= N * 2, 'dry'],
      [sad && s.m.mood > 55, 'cheer'],
      [s.m.mood < 70 && h > 14, 'rest'],
      [built(sim, 'toolbench') && lowTool, 'maintain'],
      [anyPile(sim), 'tidy'],
      [D, 'deliver'],
      [B.length && !sim.settlers.some((o2) => o2.role === 'architect' && o2.task && o2.task.kind === 'build' && o2.task.site === B[0].id) , 'build'],
      [food < target * 0.6, 'forage'],
      [sh.stone > 0, 'gather'],
      [true, 'rest'],
    );
  }
  if (s.role === 'hunter') {
    const explore = !sim.discovered.pond && food >= N * 4 && h >= 6 && h < 8.5 && dayOf(sim) >= 2;
    return pick(
      [explore, 'explore'],
      [food < target + 4, foodJob()],
      [sh.stone > 0, 'gather'],
      [D, 'deliver'],
      [sh.wood > 0 && toolFree(sim, 'axe', s), 'chop'],
      [B.length, 'build'],
      [true, foodJob()],
    );
  }
  if (s.role === 'gatherer') {
    return pick(
      [sh.wood > 0 && toolFree(sim, 'axe', s), 'chop'],
      [sh.stone > 0, 'gather'],
      [anyPile(sim), 'tidy'],
      [D, 'deliver'],
      [B.length, 'build'],
      [sim.stock.wood < 12 && toolFree(sim, 'axe', s), 'chop'],
      [food < target, foodJob()],
      [true, 'gather'],
    );
  }
  // architect
  return pick(
    [B.length, 'build'],
    [D, 'deliver'],
    [built(sim, 'toolbench') && lowTool, 'maintain'],
    [sh.stone > 0, 'gather'],
    [anyPile(sim), 'tidy'],
    [sh.wood > 0 && toolFree(sim, 'axe', s), 'chop'],
    [food < target * 0.7, 'forage'],
    [true, 'rest'],
  );
}

/* ------------------------------ tasks ------------------------------ */
const LABEL = {
  sleep: 'Sleep', collapse: 'Collapsed', persevere: 'Get back to camp', eat: 'Eat', pee: 'Pee', poo: 'Bathroom',
  bathe: 'Wash', rest: 'Rest by the fire', chop: 'Chop a tree', gather: 'Gather stone', forage: 'Forage berries',
  fish: 'Fish from the shore', trap: 'Set a snare', checktraps: 'Check the snares', cook: 'Cook', dry: 'Dry meat and fish',
  deliver: 'Bring materials to a build', build: 'Build', tidy: 'Tidy up loose materials', cheer: 'Talk with someone',
  maintain: 'Sharpen the tools', explore: 'Scout inland', home: 'Head back to camp', idle: 'Take a breather',
};
const go = (to, label, extra) => ({ do: 'go', to: { x: to.x, z: to.z }, label, ...extra });
const work = (act, mins, label, extra) => ({ do: 'work', act, mins, label, ...extra });
const nearest = (arr, p, ok) => { let best = null, bd = 1e9; for (const o of arr) { if (!ok(o)) continue; const d = dist(o, p); if (d < bd) { bd = d; best = o; } } return best; };

function sleepSpot(sim, s) {
  const lay = sim.lay;
  const beds = sim.sites.filter((x) => x.type === 'bed' && x.done);
  if (s.bed != null && !beds.some((b) => b.id === s.bed)) s.bed = null;
  if (s.bed == null) { const taken = new Set(sim.settlers.map((o) => o.bed)); const b = beds.find((x) => !taken.has(x.id)); if (b) s.bed = b.id; }
  if (s.bed != null) { const b = site(sim, s.bed); return { at: b, place: 'bed' }; }
  for (const hk of ['hut1', 'hut2']) {
    const hut = sim.sites.find((x) => x.type === hk && x.done);
    if (!hut) continue;
    const users = sim.settlers.filter((o) => o !== s && o.sleep && o.sleep.slot === hk && o.act === 'sleep').length;
    if (users < BUILDINGS[hk].sleeps) { const k = sim.settlers.indexOf(s); return { at: { x: hut.x + Math.cos(k * 1.7) * 1.2, z: hut.z + Math.sin(k * 1.7) * 1.2 }, place: 'hut', slot: hk }; }
  }
  const lean = sim.sites.find((x) => x.type === 'leanto' && x.done);
  if (lean) { const k = sim.settlers.indexOf(s); return { at: sim.lay.at(BUILDINGS.leanto.f + 0.3, BUILDINGS.leanto.r - 1.8 + k * 1.2), place: 'leanto', slot: 'leanto' }; }
  return { at: lay.ground[sim.settlers.indexOf(s) % lay.ground.length], place: 'ground', slot: 'ground' };
}
function bathroomSpot(sim, s) {
  const lat = sim.sites.find((x) => x.type === 'latrine' && x.done);
  if (dist(s, sim.lay.fire) < 70) {
    if (lat) return lat;
    return nearestPassable(sim.nav, sim.lay.at(26 + (s.id % 2) * 4, -24 + s.id * 14));
  }
  return nearestPassable(sim.nav, { x: s.x + 7 * Math.cos(s.id * 2.1), z: s.z + 7 * Math.sin(s.id * 2.1) });
}

function makeTask(sim, s, kind, opts = {}) {
  const lay = sim.lay, fire = lay.fire, seat = lay.seats[sim.settlers.indexOf(s) % lay.seats.length];
  const T = { id: sim.nextId++, kind, label: LABEL[kind] || kind, steps: [], i: 0, started: sim.t, owner: opts.owner || 'self' };
  const S = T.steps;
  switch (kind) {
    case 'sleep': {
      const sp = sleepSpot(sim, s);
      T.label = sp.place === 'bed' ? 'Sleep in bed' : sp.place === 'hut' ? 'Sleep in the hut' : sp.place === 'leanto' ? 'Sleep under the lean-to' : 'Sleep by the fire';
      S.push(go(sp.at, 'walk to bed'), work('sleep', 480, 'sleep', { place: sp.place, slot: sp.slot, start: 'sleepStart', until: 'rested', fx: 'wake', outdoor: false, meters: [] }));
      break;
    }
    case 'collapse':
      S.push(work('collapsed', 600, 'out cold', { start: 'collapseStart', until: 'recovered', outdoor: false, meters: [] }));
      break;
    case 'persevere':
      S.push(go(fire, 'drag themselves home'), work('sit', 60, 'recover at the fire', { each: 'restEach', fx: 'rest', outdoor: false, meters: [] }));
      if (s.m.hunger < 30) S.push(work('eat', 25, 'eat', { fx: 'eat', outdoor: false, meters: [] }));
      break;
    case 'home':
      S.push(go(fire, 'walk back to camp'));
      break;
    case 'eat': {
      if (mealUnits(sim) >= 0.34 && dist(s, fire) < 150) {
        S.push(go(seat, 'walk to the fire'), work('eat', 25, 'eat', { fx: 'eat', outdoor: false, meters: [] }));
      } else {
        const bush = nearest(sim.isl.bushes, s, (b) => (sim.world.bushes[b.id] ?? b.berries) >= 2 && !sim.world.reserved['b' + b.id]);
        if (!bush) return null;
        T.label = 'Eat berries off a bush';
        S.push(go(nearestPassable(sim.nav, bush), 'walk to a berry bush'), work('forage', 15, 'eat berries', { fx: 'eatBerries', bush: bush.id, face: bush, meters: [] }));
      }
      break;
    }
    case 'pee': case 'poo': {
      const sp = bathroomSpot(sim, s);
      S.push(go(sp, kind === 'pee' ? 'find a private spot' : 'head for the latrine'), work('squat', kind === 'pee' ? 3 : 8, kind, { fx: kind, outdoor: false, meters: [] }));
      break;
    }
    case 'bathe': {
      S.push(go(lay.bath, 'walk down to the sea'), work('bathe', 30, 'wash in the sea', { fx: 'bathe', outdoor: false, meters: [] }), go(fire, 'walk back up'));
      break;
    }
    case 'rest':
      S.push(go(seat, 'walk to the fire'), work('sit', 45, 'sit and rest', { each: 'restEach', fx: 'rest', outdoor: false, meters: [] }));
      break;
    case 'idle':
      S.push(go(seat, 'wander to the fire'), work('sit', 10, 'catch their breath', { fx: 'idle', outdoor: false, meters: [] }));
      break;
    case 'chop': {
      if (!toolFree(sim, 'axe', s)) return null;
      const tr = nearest(sim.isl.trees, lay.pile, (t) => !sim.world.felled[t.id] && !sim.world.reserved['t' + t.id] && dist(t, fire) < 160);
      if (!tr) return null;
      sim.world.reserved['t' + tr.id] = s.id;
      const stand = nearestPassable(sim.nav, { x: tr.x - 1.3, z: tr.z + 0.4 });
      S.push(go(stand, 'walk to a tree'), work('chop', 40, 'chop it down', { tool: 'axe', attr: 'STR', fx: 'fell', tree: tr.id, face: tr, heavy: true, role: 'gatherer' }),
        go(lay.pile, 'carry logs to storage'), work('drop', 1, 'stack them', { fx: 'dropStock', outdoor: false, meters: [] }));
      T.keepCarry = true;
      break;
    }
    case 'gather': {
      const big = toolFree(sim, 'pick', s);
      const rk = nearest(sim.isl.rocks, lay.pile, (r) => (sim.world.rocks[r.id] ?? r.n) > 0 && !sim.world.reserved['r' + r.id] && (big || r.s <= 0.5) && dist(r, fire) < 220);
      if (!rk) return null;
      sim.world.reserved['r' + rk.id] = s.id;
      const mine = rk.s > 0.5;
      S.push(go(nearestPassable(sim.nav, { x: rk.x - 0.9, z: rk.z }), 'walk to loose rock'),
        work(mine ? 'mine' : 'pick', mine ? 22 : 9, mine ? 'break stone off' : 'pick up stones', { tool: mine ? 'pick' : null, attr: 'STR', fx: 'takeRock', rock: rk.id, face: rk, heavy: true, role: 'gatherer' }),
        go(lay.pile, 'carry stone to storage'), work('drop', 1, 'stack it', { fx: 'dropStock', outdoor: false, meters: [] }));
      T.keepCarry = true;
      break;
    }
    case 'tidy': {
      const p = nearest(sim.piles, s, (q) => !sim.world.reserved['p' + q.id]);
      if (!p) return null;
      sim.world.reserved['p' + p.id] = s.id;
      S.push(go(p, 'walk to loose ' + p.item), work('pick', 1, 'pick it up', { fx: 'pickPile', pile: p.id, outdoor: false, meters: [] }),
        go(lay.pile, 'carry it to storage'), work('drop', 1, 'stack it', { fx: 'dropStock', outdoor: false, meters: [] }));
      T.keepCarry = true;
      break;
    }
    case 'forage': {
      const bush = nearest(sim.isl.bushes, fire, (b) => (sim.world.bushes[b.id] ?? b.berries) >= 2 && !sim.world.reserved['b' + b.id] && dist(b, fire) < 260);
      if (!bush) return null;
      sim.world.reserved['b' + bush.id] = s.id;
      S.push(go(nearestPassable(sim.nav, bush), 'walk to a berry bush'), work('forage', 20, 'pick berries', { tool: toolFree(sim, 'knife', s) ? 'knife' : null, optTool: true, attr: 'DEX', fx: 'pickBerries', bush: bush.id, face: bush, role: 'hunter' }),
        go(lay.food, 'carry them to the food store'), work('drop', 1, 'store them', { fx: 'dropFood', outdoor: false, meters: [] }));
      T.keepCarry = true;
      break;
    }
    case 'fish': {
      if (!toolFree(sim, 'spear', s)) return null;
      const spots = lay.fishing.slice().sort((a, b) => dist(a, fire) - dist(b, fire));
      const sp = spots[(sim.tick >> 6) % Math.min(3, spots.length)] || lay.bath;
      S.push(go(nearestPassable(sim.nav, sp), 'walk to the shore'), work('fish', 75, 'fish with the spear', { tool: 'spear', attr: 'DEX', each: 'fishEach', fx: 'fishDone', face: { x: sp.x + (sp.x - fire.x), z: sp.z + (sp.z - fire.z) }, role: 'hunter' }),
        go(lay.food, 'carry the catch home'), work('drop', 1, 'store it', { fx: 'dropFood', outdoor: false, meters: [] }));
      T.keepCarry = true;
      break;
    }
    case 'trap': {
      const near = (p) => sim.traps.some((t) => dist(t, p) < 45);
      const tr = nearest(sim.isl.trees, fire, (t) => dist(t, fire) > 70 && dist(t, fire) < 220 && !near(t) && coverAt(sim.isl, t.x, t.z) === COVER.FOREST);
      if (!tr) return null;
      const at = nearestPassable(sim.nav, { x: tr.x + 1.6, z: tr.z });
      S.push(go(at, 'walk into the woods'), work('trap', 30, 'set a snare', { tool: toolFree(sim, 'knife', s) ? 'knife' : null, optTool: true, attr: 'DEX', fx: 'setTrap', at, face: tr, role: 'hunter' }));
      break;
    }
    case 'checktraps': {
      const list = sim.traps.filter((t) => t.catch || sim.t - (t.checked || t.set) > 20 * HOUR).sort((a, b) => dist(a, fire) - dist(b, fire)).slice(0, 4);
      if (!list.length) return null;
      for (const t of list) S.push(go(t, 'walk to a snare'), work('trap', 6, 'check the snare', { fx: 'checkTrap', trap: t.id, attr: 'DEX', role: 'hunter' }));
      S.push(go(lay.food, 'carry any catch home'), work('drop', 1, 'store it', { fx: 'dropFood', outdoor: false, meters: [] }));
      T.keepCarry = true;
      break;
    }
    case 'cook':
      S.push(go(seat, 'walk to the fire'), work('cook', 35, 'cook a meal', { fx: 'cook', tool: toolFree(sim, 'knife', s) ? 'knife' : null, optTool: true, outdoor: false, meters: ['energy'] }));
      break;
    case 'dry': {
      const r = sim.sites.find((x) => x.type === 'dryrack' && x.done); if (!r) return null;

/* ===== sim.js ===== */
// sim.js — the colony simulation. DOM-free, render-free, seeded: the same seed and the

const TICK = 10;

/* ------------------------------ camp layout ------------------------------ */
function layoutOf(isl) {
  const c = isl.camp, L = isl.landing, dl = Math.hypot(c.x - L.x, c.z - L.z) || 1;
  const fwd = { x: (c.x - L.x) / dl, z: (c.z - L.z) / dl }, right = { x: -fwd.z, z: fwd.x };
  const at = (f, r) => ({ x: c.x + fwd.x * f + right.x * r, z: c.z + fwd.z * f + right.z * r });
  const yaw = Math.atan2(fwd.z, fwd.x);

  for (const k in BUILDINGS) if (BUILDINGS[k].f !== undefined) slots[k] = { ...at(BUILDINGS[k].f, BUILDINGS[k].r), yaw };
  // beds inside the huts: three in the first, two (room for three) in the second
  const beds = [];
  for (const [hk, n] of [['hut1', 3], ['hut2', 3]]) {
    const b = BUILDINGS[hk];
    for (let i = 0; i < n; i++) beds.push({ ...at(b.f + 0.9, b.r - 1.7 + i * 1.7), yaw: yaw + Math.PI / 2, hut: hk });

    settlers: [], stock: { wood: 0, stone: 0 }, food: [], piles: [], sites: [], traps: [],

/* ------------------------------ helpers ------------------------------ */
function event(sim, s, type, text) {

  if (s && text) { s.log.push({ t: sim.t, text }); if (s.log.length > 40) s.log.shift(); }

  for (const b in need) if (sim.sites.filter((x) => x.type === b && x.done && x.goal === g).length < need[b]) return false;

/* ------------------------------ needs ------------------------------ */

  if (!s.carry) return;
  if (s.carry.food) addFood(sim, s.carry.item, s.carry.n);
  else sim.piles.push({ id: sim.nextId++, x: s.x, z: s.z, item: s.carry.item, n: s.carry.n });
  s.carry = null;
}

function releaseTask(sim, s, T) {
  if (!T) return;
  for (const k in sim.tools) if (sim.tools[k].by === s.id) sim.tools[k].by = null;
  for (const k in sim.world.reserved) if (sim.world.reserved[k] === s.id) delete sim.world.reserved[k];
}

function runSettler(sim, s, dt) {
  if (!s.task) { think(sim, s); if (!s.task) return; }
  if (sim.tick % 30 === s.id % 30) checkInterrupts(sim, s);
  const r = execStep(sim, s, dt);
  if (r === 'next') { s.task.i++; if (s.task.i >= s.task.steps.length) { finishTask(sim, s, true); } }
  else if (r === 'fail') finishTask(sim, s, false);
  else if (r === 'done') finishTask(sim, s, true);
  else if (sim.t - s.task.started > 12 * HOUR && s.task.kind !== 'sleep' && s.task.kind !== 'collapse') {
    event(sim, s, 'abandon', s.name + ' gave up on "' + s.task.label + '" (too long).'); finishTask(sim, s, false);
  }
}
function finishTask(sim, s, ok) {
  const T = s.task;
  releaseTask(sim, s, T);
  if (!ok) { dropCarry(sim, s); if (T) event(sim, s, 'fail', null); }
  if (T && T.kind === 'sleep' || T && T.kind === 'collapse') { s.sleep = s.sleep ? { ...s.sleep, end: sim.t } : null; }
  if (T && T.kind === 'persevere') s.persevere = false;
  s.task = null; s.act = 'idle';
}
function replaceTask(sim, s, T2) {
  if (s.task) { releaseTask(sim, s, s.task); dropCarry(sim, s); }
  s.task = T2; T2.started = sim.t;
}
function preempt(sim, s, T2) {
  const T = s.task;
  if (T && T.kind !== 'collapse' && T.kind !== 'persevere') {
    releaseTask(sim, s, T);
    const st = T.steps[T.i]; if (st && st.do === 'go') st.path = null;
    if (!s.carry || T.keepCarry) s.plan.unshift(T); else { dropCarry(sim, s); }
  }
  s.task = T2; T2.started = sim.t;
}

/* ------------------------------ effects ------------------------------ */
const UNTIL = {
  rested(sim, s, st) {
    const h = hourOf(sim), cap = TUNE.sleep[s.sleep ? s.sleep.place : 'ground'][1];
    if (h >= TUNE.latestWake && h < 18) return true;
    if (h >= TUNE.wakeHour && h < 18 && s.m.energy >= Math.min(cap - 1, 60)) return true;
    const full = s.m.energy >= cap - 0.5, slept = s.sleep ? sim.t - s.sleep.start : 0;
    if (full && (slept >= 10 * HOUR || (h >= 4.5 && h < 18))) return true;
    return false;
  },
  recovered(sim, s) { return s.m.energy >= TUNE.sleep.wild[1] - 0.01; },
  napped(sim, s, st) { return st.done >= st.mins * 60 || s.m.energy >= 70; },
  siteDone(sim, s, st) { const x = site(sim, st.site); return !x || x.done || st.done >= st.mins * 60; },
  fixed(sim, s, st) { return TOOLS.every((k) => sim.tools[k].cond >= 98 || (sim.tools[k].by != null && sim.tools[k].by !== s.id)) || st.done >= st.mins * 60; },
};

const FX = {
  sleepStart(sim, s, st) {
    const h = hourOf(sim);
    s.sleep = { place: st.place, slot: st.slot, start: sim.t, lateStart: h >= 23.25 || h < 4, startEnergy: s.m.energy };
    if (s.sleep.lateStart) s.exp.lateStarts = (s.exp.lateStarts || 0) + 1;
  },
  wake(sim, s) {
    const sl = s.sleep;
    if (sl && sl.lateStart && s.m.energy < 72) { event(sim, s, 'badnight', s.name + ' slept badly after a late night.'); say(sim, s, 'Ugh. Too late to bed again.', 'say'); learnEvent(sim, s, 'lateNight'); }
  },
  collapseStart(sim, s, st) { s.sleep = { place: 'wild', start: sim.t, lateStart: false, startEnergy: s.m.energy }; say(sim, s, 'Can’t... keep... going...', 'refuse'); },
  eat(sim, s) {
    let got = 0, hot = false;
    if (takeFood(sim, 'meal', 1)) { got = TUNE.meal; hot = true; }
    else if (takeFood(sim, 'dried', 1)) got = TUNE.meal;
    else { const b = takeFood(sim, 'berries', 4); got = b * TUNE.berry; if (!b) { const f = takeFood(sim, 'fish', 1); got = f * TUNE.rawFish; } }
    if (!got) { say(sim, s, 'Nothing to eat at camp.', 'refuse'); return; }
    s.m.hunger = Math.min(100, s.m.hunger + got); s.stats.meals++;
    if (hot) s.ateHot = sim.t;
    for (const o of sim.settlers) if (o !== s && o.act === 'eat' && dist(o, s) < 8) { s.rel[o.id] = Math.min(100, s.rel[o.id] + 2); }
  },
  eatBerries(sim, s, st) {
    const b = sim.world.bushes[st.bush] ?? sim.isl.bushes[st.bush].berries;
    const k = Math.min(b, 4); sim.world.bushes[st.bush] = b - k;
    if (b - k <= 0) sim.world.bushes['r' + st.bush] = sim.t + TUNE.bushRegrowDays * DAYS;
    s.m.hunger = Math.min(100, s.m.hunger + k * TUNE.berry); if (k) s.stats.meals++;
  },
  pee(sim, s) { s.m.bladder = 100; s.stats.pee++; if (!built(sim, 'latrine')) s.m.mood = Math.max(0, s.m.mood - 1); },
  poo(sim, s) { s.m.bowel = 100; s.stats.poo++; if (!built(sim, 'latrine')) { s.m.mood = Math.max(0, s.m.mood - 2); s.m.clean = Math.max(0, s.m.clean - 3); } },
  bathe(sim, s, st) {
    const cap = st.pond ? 100 : 70;
    s.m.clean = Math.max(s.m.clean, Math.min(cap, s.m.clean + 70)); s.stats.baths++; s.bathT = sim.t;
    s.m.mood = Math.min(100, s.m.mood + (st.pond ? 8 : 3));
    if (st.pond) s.pondUntil = sim.t + 12 * HOUR;
  },
  fell(sim, s, st) {
    const tr = sim.isl.trees[st.tree];
    sim.world.felled[tr.id] = sim.t;
    delete sim.world.reserved['t' + tr.id];
    const n = 3, take = Math.min(n, carryCap(s, 'wood'));
    s.carry = { item: 'wood', n: take };
    if (n - take > 0) sim.piles.push({ id: sim.nextId++, x: tr.x + 1, z: tr.z, item: 'wood', n: n - take });
    event(sim, s, 'fell', null);
  },
  takeRock(sim, s, st) {
    const rk = sim.isl.rocks[st.rock], left = sim.world.rocks[rk.id] ?? rk.n;
    const take = Math.min(left, carryCap(s, 'stone'));
    sim.world.rocks[rk.id] = left - take; delete sim.world.reserved['r' + rk.id];
    s.carry = { item: 'stone', n: take };
  },
  pickPile(sim, s, st) {
    const p = sim.piles.find((x) => x.id === st.pile); if (!p) return false;
    const take = Math.min(p.n, carryCap(s, p.item)); p.n -= take; s.carry = { item: p.item, n: take };
    if (p.n <= 0) sim.piles = sim.piles.filter((x) => x !== p);
    delete sim.world.reserved['p' + p.id];
  },
  dropStock(sim, s) { if (s.carry && !s.carry.food) { sim.stock[s.carry.item] = (sim.stock[s.carry.item] || 0) + s.carry.n; s.carry = null; } },
  dropFood(sim, s) { if (s.carry && s.carry.food) { addFood(sim, s.carry.item, s.carry.n); s.carry = null; } },
  pickBerries(sim, s, st) {
    const b = sim.world.bushes[st.bush] ?? sim.isl.bushes[st.bush].berries;
    const k = Math.min(b, 4); sim.world.bushes[st.bush] = b - k;
    if (b - k <= 0) sim.world.bushes['r' + st.bush] = sim.t + TUNE.bushRegrowDays * DAYS;
    delete sim.world.reserved['b' + st.bush];
    if (s.carry && s.carry.item === 'berries') s.carry.n += k; else if (k) s.carry = { item: 'berries', n: k, food: true };
  },
  fishEach(sim, s, st, T, dt, rate) {
    if (sim.R.food.next() < TUNE.fishPerHour * dt / HOUR * rate) st.caught = (st.caught || 0) + 1;
  },
  fishDone(sim, s, st) {
    if (st.caught) { s.carry = { item: 'fish', n: st.caught, food: true }; event(sim, s, 'fish', s.name + ' caught ' + st.caught + ' fish.'); }
    else event(sim, s, 'fish', s.name + ' caught nothing.');
  },
  setTrap(sim, s, st) { sim.traps.push({ id: sim.nextId++, x: st.at.x, z: st.at.z, set: sim.t, catch: 0, owner: s.id }); },
  checkTrap(sim, s, st) {
    const tr = sim.traps.find((x) => x.id === st.trap); if (!tr) return;
    if (tr.catch) { if (s.carry && s.carry.item === 'meat') s.carry.n += tr.catch; else s.carry = { item: 'meat', n: tr.catch, food: true }; event(sim, s, 'trap', s.name + ' found a rabbit in a trap.'); tr.catch = 0; }
    tr.checked = sim.t;
  },
  cook(sim, s) {
    const meat = takeFood(sim, 'meat', 99), fish = takeFood(sim, 'fish', 99);
    const meals = meat * 2 + Math.floor(fish * 1.5);
    let ber = 0; if (meals < 4) { ber = takeFood(sim, 'berries', Math.floor(foodCount(sim, 'berries') / 3) * 3); }
    const total = meals + ber / 3;
    if (total) { addFood(sim, 'meal', total); event(sim, s, 'cook', s.name + ' cooked ' + total.toFixed(0) + ' meals.'); }
  },
  dryFood(sim, s) {
    const meat = takeFood(sim, 'meat', 4), fish = takeFood(sim, 'fish', 4);
    const n = meat * 2 + fish * 1.5; if (n) addFood(sim, 'dried', n);
  },
  takeStock(sim, s, st) {
    const x = site(sim, st.site); if (!x) return false;
    const item = st.item, want = Math.min(carryCap(s, item), x.need[item] - x.have[item], sim.stock[item]);
    if (want <= 0) return false;
    sim.stock[item] -= want; s.carry = { item, n: want };
  },
  toSite(sim, s, st) {
    const x = site(sim, st.site);
    if (!x || !s.carry) { dropCarry(sim, s); return; }
    const room = x.need[s.carry.item] - x.have[s.carry.item], put = Math.min(room, s.carry.n);
    x.have[s.carry.item] += put; s.carry.n -= put;
    if (s.carry.n > 0) sim.stock[s.carry.item] += s.carry.n;
    s.carry = null;
  },
  buildEach(sim, s, st, T, dt, rate) {
    const x = site(sim, st.site); if (!x || x.done) return;
    const frac = Math.min(x.have.wood / Math.max(1, x.need.wood), x.need.stone ? x.have.stone / x.need.stone : 1);
    const allowed = frac * x.hours + 1e-9;
    if (x.prog >= allowed) { st.done = st.mins * 60; return; }
    x.prog = Math.min(allowed, x.prog + dt * rate * (s.role === 'architect' ? 1 : 0.6) / HOUR);
    if (x.prog >= x.hours - 1e-9) completeSite(sim, x, s);
  },
  rest(sim, s) { s.m.mood = Math.min(100, s.m.mood + 4); },
  restEach(sim, s, st, T, dt) { s.m.energy = Math.min(85, s.m.energy + 3 * dt / HOUR); },
  cheer(sim, s, st) {
    const o = sim.settlers[st.toId]; if (!o) return;
    const lift = 6 + (s.attrs.CHA - 10) * 1.2;
    o.m.mood = Math.min(100, o.m.mood + lift); o.cheerUntil = sim.t + 8 * HOUR;
    o.rel[s.id] = Math.min(100, (o.rel[s.id] || 50) + 5); s.rel[o.id] = Math.min(100, (s.rel[o.id] || 50) + 3);
    event(sim, s, 'cheer', s.name + ' talked things through with ' + o.name + '.');
  },
  fixEach(sim, s, st, T, dt, rate) {
    const k = TOOLS.filter((t) => sim.tools[t].by == null || sim.tools[t].by === s.id).sort((a, b) => sim.tools[a].cond - sim.tools[b].cond)[0];
    if (k) sim.tools[k].cond = Math.min(100, sim.tools[k].cond + TUNE.toolFix * rate * dt / HOUR);
  },
  look(sim, s) { discover(sim, s); },
  idle() {},
};

function carryCap(s, item) { return (TUNE.carry[item] || 4) + (item === 'wood' && s.attrs.STR >= 15 ? 1 : 0) + (item === 'stone' && s.attrs.STR >= 15 ? 1 : 0); }

function completeSite(sim, x, s) {
  x.done = true; x.prog = x.hours; x.doneT = sim.t;
  event(sim, s, 'built', (BUILDINGS[x.type].label) + ' finished.');
  say(sim, s, BUILDINGS[x.type].label + ' is done!', 'say');
  if (x.type === 'foodstore') for (const b of sim.food) b.exp = Math.max(b.exp, b.exp + (TUNE.spoilStored[b.kind] - TUNE.spoil[b.kind]) * DAYS);
  for (const o of sim.settlers) o.m.mood = Math.min(100, o.m.mood + 2);
}

/* ------------------------------ the world ticking ------------------------------ */
function worldHourly(sim) {
  // spoilage
  const before = mealUnits(sim);
  sim.food = sim.food.filter((b) => b.exp > sim.t);
  const lost = before - mealUnits(sim);
  if (lost > 0.5) event(sim, null, 'spoil', lost.toFixed(1) + ' meals worth of food spoiled.');
  // bushes regrow
  for (const k in sim.world.bushes) if (k[0] === 'r' && sim.world.bushes[k] <= sim.t) { const id = +k.slice(1); delete sim.world.bushes[k]; sim.world.bushes[id] = sim.isl.bushes[id].berries; }
  // traps catch
  for (const tr of sim.traps) if (!tr.catch && sim.R.food.next() < TUNE.trapCatchPerDay / 24 * trapRichness(sim, tr)) tr.catch = 1;
}
function trapRichness(sim, tr) {
  const d = Math.hypot(tr.x - sim.isl.camp.x, tr.z - sim.isl.camp.z);
  const crowd = sim.traps.filter((o) => o !== tr && Math.hypot(o.x - tr.x, o.z - tr.z) < 40).length;
  return Math.min(1.4, 0.4 + d / 200) / (1 + crowd * 0.5);
}
function discover(sim, s) {
  const isl = sim.isl;
  if (!sim.discovered.pond && Math.hypot(s.x - isl.pond.x, s.z - isl.pond.z) < 48) {
    sim.discovered.pond = sim.t;
    event(sim, s, 'discover', s.name + ' found a waterfall falling into a clear pond. Fresh water, and safe to swim.');
    say(sim, s, 'A waterfall! And a pond you could swim in!', 'say');
    s.m.mood = Math.min(100, s.m.mood + 15);
  }
}
function markSeen(sim, s) {
  const k = Math.floor(s.x / 16) + ',' + Math.floor(s.z / 16);
  if (!sim.seen[k]) sim.seen[k] = 1;
}

function social(sim) {
  const S = sim.settlers;
  for (let i = 0; i < S.length; i++) for (let j = i + 1; j < S.length; j++) {
    const a = S[i], b = S[j];
    if (a.act === 'sleep' || b.act === 'sleep') continue;
    if (dist(a, b) < 15) { a.rel[b.id] = Math.min(100, a.rel[b.id] + 0.5 / 60); b.rel[a.id] = Math.min(100, b.rel[a.id] + 0.5 / 60); }
  }
}

function phase1Check(sim) {
  if (sim.phase1) return;
  const builtAll = PHASE1_BUILDS.every((b) => built(sim, b)) && sim.sites.filter((x) => x.type === 'bed' && x.done).length >= 5;
  const food = mealUnits(sim) >= foodTarget(sim);
  const ok = sim.settlers.every((s) => ['health', 'energy', 'hunger', 'mood', 'clean'].every((k) => s.m[k] >= 50));
  if (!ok) sim.okSince = null; else if (sim.okSince == null) sim.okSince = sim.t;
  sim.p1 = { builtAll, food, okHours: sim.okSince == null ? 0 : (sim.t - sim.okSince) / HOUR };
  if (builtAll && food && sim.okSince != null && sim.t - sim.okSince >= 48 * HOUR) {
    sim.phase1 = { done: true, t: sim.t, day: dayOf(sim) };
    event(sim, null, 'phase1', 'Phase 1 complete: the camp can take a fifth settler.');
  }
}

/* ------------------------------ the tick ------------------------------ */
function step(sim) {
  sim.tick++; sim.t += TICK;
  for (const s of sim.settlers) drain(sim, s, TICK);
  for (const s of sim.settlers) runSettler(sim, s, TICK);
  if (sim.tick % 6 === 0) { social(sim); for (const s of sim.settlers) { markSeen(sim, s); discover(sim, s); } }
  if (sim.tick % 60 === 0) leaderTick(sim);
  if (sim.tick % 360 === 0) { worldHourly(sim); phase1Check(sim); }
  // the hour as ticks: pin any player input to the tick it arrived on
}
function runFor(sim, secs) { const n = Math.round(secs / TICK); for (let i = 0; i < n; i++) step(sim); }

function applyInput(sim, input) {
  const rec = { ...input, tick: sim.tick };
  sim.inputs.push(rec);
  return applyPlayerInput(sim, rec);
}
function assignTask(sim, s, kind, opts = {}) {
  const T = makeTask(sim, s, kind, opts);
  if (!T) return null;
  if (opts.pinned) T.pinned = true;
  preempt(sim, s, T);
  return T;
}

/* ------------------------------ save / load ------------------------------ */
function snapshot(sim) {
  const o = {};
  for (const k in sim) if (k !== 'isl' && k !== 'nav' && k !== 'lay' && k !== 'R') o[k] = sim[k];
  o.R = {}; for (const k in sim.R) o.R[k] = sim.R[k].save();
  return JSON.parse(JSON.stringify(o));
}
function restore(snap) {
  const sim = createSim(snap.seed);
  for (const k in snap) if (k !== 'R') sim[k] = snap[k];
  for (const k in snap.R) sim.R[k].load(snap.R[k]);
  for (const s of sim.settlers) s.look = FOUNDERS[s.id] ? FOUNDERS[s.id].look : s.look;
  return sim;
}
function simHash(sim) { return hashState(snapshot(sim)); }

/* ===== rig.js ===== */
// rig.js — placeholder (filled in a later task)

/* ===== render.js ===== */

/* ===== main.js ===== */

const cv = document.getElementById('view');
const gl = cv.getContext('webgl2');
if (gl) { gl.clearColor(0.05, 0.08, 0.06, 1); gl.clear(gl.COLOR_BUFFER_BIT); }

})();
</script>
