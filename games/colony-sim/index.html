/* ===== rng.js ===== */
{
// rng.js — seeded randomness. sfc32 core; named streams so one system's draws

/* ===== island.js ===== */
{
// island.js — the island, generated from a seed. A heightfield + a land-cover grid
// baked once; everything (rendering, walking, jobs) samples these same arrays so
// they can never disagree (the Wayfinder rule).


CELL = 2;           // 1000 m x 700 m
IW = 500;
IH = 350;
COVER = { SEA: 0, SAND: 1, ROCKY: 2, GRASS: 3, FOREST: 4, CLIFF: 5, POND: 6, RIVER: 7 };
const CAMP_Y = 2.8;

const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const wrapA = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

function makeNoise(rng) {
  const P = new Uint16Array(512), V = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; V[i] = rng.next(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng.next() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }

  };

genIsland = function genIsland(seed) {
  const rng = makeRng(seed), R = rng.stream('island');
  const fbm = makeNoise(rng.stream('noise'));
  const W = IW, H = IH, N = W * H;
  const h = new Float32Array(N), cover = new Uint8Array(N);
  const cx0 = 500, cz0 = 350, rx = 440, rz = 300;
  const cellX = (i) => (i % W + 0.5) * CELL, cellZ = (i) => (Math.floor(i / W) + 0.5) * CELL;
  const mask = (x, z) => {

    return 1 - Math.hypot(dx, dz) - 0.16 * (fbm(x / 170, z / 170) - 0.5) * 2;
  };

  const dir = { x: Math.cos(la), z: Math.sin(la) };
  let sr = 0; while (mask(cx0 + dir.x * sr, cz0 + dir.z * sr) > 0 && sr < 600) sr += 1;
  const shore = { x: cx0 + dir.x * sr, z: cz0 + dir.z * sr };
  const landing = { x: shore.x - dir.x * 6, z: shore.z - dir.z * 6 };
  const camp = { x: shore.x - dir.x * 48, z: shore.z - dir.z * 48, r: 32 };
  const north = { x: -dir.x, z: -dir.z }, northA = Math.atan2(north.z, north.x);

  // the scarp: a cliff band ~430 m inland, on the far side of the island from camp, with two ramps
  const R0 = 418 + R.range(-8, 8), HS = 20 + R.range(0, 4);
  const ramp = [R.range(0.45, 0.6), -R.range(0.45, 0.6)];
  let pondA = R.range(-0.25, 0.25);
  const scarpAt = (x, z) => {
    const d = Math.hypot(x - camp.x, z - camp.z), a = wrapA(Math.atan2(z - camp.z, x - camp.x) - northA);
    const t = sstep(1.15, 0.85, Math.abs(a));

  }

  for (let i = 0; i < N; i++) {

    if (w > 0) h[i] = lerp(h[i], CAMP_Y + 0.08 * (fbm(cellX(i) / 9, cellZ(i) / 9, 2) - 0.5), w);

  const ph = h[idx(pond.x, pond.z)] - 0.6;
  for (let i = 0; i < N; i++) {

  }

    for (let dz = -3; dz <= 3; dz += CELL) for (let dx = -3; dx <= 3; dx += CELL) {
      if (dx * dx + dz * dz > 9) continue;
      const i = idx(p.x + dx, p.z + dz);
      if (cover[i] === 255) continue;
      if (h[i] > -0.3) { h[i] = Math.min(h[i], y); cover[i] = 253; }
    }

  let qh = 0, qt = 0;
  for (let i = 0; i < N; i++) if (h[i] < 0 && cover[i] === 0) { seaD[i] = 0; q[qt++] = i; }

    return m;

    if (cover[i] === 254 || cover[i] === 253) { cover[i] = COVER.RIVER; continue; }
    if (h[i] < 0) { cover[i] = COVER.SEA; continue; }
    if (dc < 36) { cover[i] = COVER.GRASS; continue; }
    if (slopeCell(i) > 1.1) { cover[i] = COVER.CLIFF; continue; }

  if (!step.path) {
    const to = step.toId != null ? sim.settlers[step.toId] : step.to;
    step.path = findPath(sim.nav, s, to) || null;
    step.pi = 0;
    if (!step.path) return 'fail';
  }
  const terrain = sim.nav.costAt(s.x, s.z);
  const mob = Math.max(0.45, Math.min(1, eff(s.m.energy) * 0.5 + 0.5) * Math.min(1, eff(s.m.health) * 0.6 + 0.4));
  let sp = (step.run ? 2.2 : 1) * WALK * mob / (Number.isFinite(terrain) ? terrain : 2.5) * (s.carry ? 0.85 : 1) * (s.persevere ? 0.5 : 1);
  if (isDark(sim)) sp *= 0.85;
  let left = sp * dt, moved = 0;
  while (left > 1e-6 && step.pi < step.path.length) {
    const q = step.path[step.pi], dx = q.x - s.x, dz = q.z - s.z, d = Math.hypot(dx, dz);
    if (d <= left) { s.x = q.x; s.z = q.z; left -= d; moved += d; step.pi++; }
    else { s.x += dx / d * left; s.z += dz / d * left; moved += left; left = 0; }
    if (d > 1e-4) s.yaw = Math.atan2(dz, dx);
  }
  s.speed = moved / dt;
  s.act = step.run ? 'run' : 'walk';
  if (step.pi >= step.path.length) { s.speed = 0; return 'done'; }
  return 'go';
}

/* ------------------------------ steps ------------------------------ */
function workRate(sim, s, st) {
  let r = 1;
  for (const k of st.meters || ['energy', 'health']) r *= eff(s.m[k]);
  r *= 0.85 + 0.15 * Math.min(1.2, eff(s.m.mood));
  if (st.attr) r *= 0.75 + 0.05 * (s.attrs[st.attr] - 10);
  if (st.tool) r *= toolEff(sim, st.tool);
  if (st.outdoor !== false && isDark(sim) && st.act !== 'sleep' && st.act !== 'collapsed') r *= 0.6;
  if (st.role && st.role !== s.role) r *= 0.75;
  if (st.slow) r *= st.slow;
  return Math.max(0.05, r);
}

function execStep(sim, s, dt) {
  const T = s.task, st = T.steps[T.i];
  if (!st) return 'done';
  if (st.do === 'go') {
    const r = moveAlong(sim, s, st, dt);
    if (r === 'fail') return 'fail';
    return r === 'done' ? 'next' : 'busy';
  }
  if (st.do === 'work') {
    s.speed = 0; s.act = st.act; if (st.face) s.yaw = Math.atan2(st.face.z - s.z, st.face.x - s.x);
    if (st.tool && sim.tools[st.tool].by !== s.id) {
      if (sim.tools[st.tool].by != null) { if (!st.optTool) return 'fail'; st.tool = null; st.slow = 0.6; }
      else sim.tools[st.tool].by = s.id;
    }
    if (!st.began) { st.began = sim.t; if (st.start && FX[st.start](sim, s, st, T) === false) return 'fail'; }
    const rate = workRate(sim, s, st);
    st.done = (st.done || 0) + dt * rate;
    if (st.each && FX[st.each](sim, s, st, T, dt, rate) === false) return 'fail';
    if (st.tool) sim.tools[st.tool].cond = Math.max(TUNE.toolFloor, sim.tools[st.tool].cond - TUNE.toolWear * dt / HOUR);
    if (st.heavy || HEAVY.has(st.act)) maybeInjure(sim, s, st, dt);
    const finished = st.until ? UNTIL[st.until](sim, s, st) : st.done >= st.mins * 60;
    if (finished) {
      if (st.tool && sim.tools[st.tool].by === s.id) sim.tools[st.tool].by = null;
      if (st.fx && FX[st.fx](sim, s, st, T) === false) return 'fail';
      return 'next';
    }
    return 'busy';
  }
  return 'next';
}

function maybeInjure(sim, s, st, dt) {
  const p = TUNE.injuryPerHour * dt / HOUR * (1 + 3 * (1 - Math.min(1, eff(s.m.energy))) + (isDark(sim) ? 2 : 0) + (s.attrs.DEX < 12 ? 0.3 : 0));
  if (sim.R.life.next() < p) {
    const dmg = 8 + sim.R.life.next() * 20;
    s.m.health = Math.max(0, s.m.health - dmg); s.stats.injuries++;
    event(sim, s, 'injury', s.name + ' was hurt while working (' + st.act + ', -' + dmg.toFixed(0) + ' health).');
    say(sim, s, s.m.energy < 30 ? 'Argh! My hands are shaking, I should have stopped.' : 'Ouch! That one hurt.', 'refuse');
    if (s.m.energy < 30) learnEvent(sim, s, 'overwork');
    if (isDark(sim)) learnEvent(sim, s, 'farAtDusk');
    if (st.tool && sim.tools[st.tool].cond < 65) learnEvent(sim, sim.settlers.find((x) => x.role === 'leader') || s, 'dullTools');
  }
}

dropCarry = function dropCarry(sim, s) {
  if (!s.carry) return;
  if (s.carry.food) addFood(sim, s.carry.item, s.carry.n);
  else sim.piles.push({ id: sim.nextId++, x: s.x, z: s.z, item: s.carry.item, n: s.carry.n });
  s.carry = null;
}

function releaseTask(sim, s, T) {
  if (!T) return;
  for (const k in sim.tools) if (sim.tools[k].by === s.id) sim.tools[k].by = null;
  for (const k in sim.world.reserved) if (sim.world.reserved[k] === s.id) delete sim.world.reserved[k];
}

function runSettler(sim, s, dt) {
  if (!s.task) { think(sim, s); if (!s.task) return; }
  if (sim.tick % 30 === s.id % 30) checkInterrupts(sim, s);
  const r = execStep(sim, s, dt);
  if (r === 'next') { s.task.i++; if (s.task.i >= s.task.steps.length) { finishTask(sim, s, true); } }
  else if (r === 'fail') finishTask(sim, s, false);
  else if (r === 'done') finishTask(sim, s, true);
  else if (sim.t - s.task.started > 12 * HOUR && s.task.kind !== 'sleep' && s.task.kind !== 'collapse') {
    event(sim, s, 'abandon', s.name + ' gave up on "' + s.task.label + '" (too long).'); finishTask(sim, s, false);
  }
}
function finishTask(sim, s, ok) {
  const T = s.task;
  releaseTask(sim, s, T);
  if (!ok) { dropCarry(sim, s); if (T) event(sim, s, 'fail', null); }
  if (T && T.kind === 'sleep' || T && T.kind === 'collapse') { s.sleep = s.sleep ? { ...s.sleep, end: sim.t } : null; }
  if (T && T.kind === 'persevere') s.persevere = false;

replaceTask = function replaceTask(sim, s, T2) {

  s.task = T2; T2.started = sim.t;
}

  const T = s.task;
  if (T && T.kind !== 'collapse' && T.kind !== 'persevere') {
    releaseTask(sim, s, T);
    const st = T.steps[T.i]; if (st && st.do === 'go') st.path = null;
    if (!s.carry || T.keepCarry) s.plan.unshift(T); else { dropCarry(sim, s); }
  }
  s.task = T2; T2.started = sim.t;
}

/* ------------------------------ effects ------------------------------ */
const UNTIL = {
  rested(sim, s, st) {
    const h = hourOf(sim), cap = TUNE.sleep[s.sleep ? s.sleep.place : 'ground'][1];
    if (h >= TUNE.latestWake && h < 18) return true;
    if (h >= TUNE.wakeHour && h < 18 && s.m.energy >= Math.min(cap - 1, 60)) return true;
    const full = s.m.energy >= cap - 0.5, slept = s.sleep ? sim.t - s.sleep.start : 0;
    if (full && (slept >= 10 * HOUR || (h >= 4.5 && h < 18))) return true;
    return false;
  },
  recovered(sim, s) { return s.m.energy >= TUNE.sleep.wild[1] - 0.01; },
  napped(sim, s, st) { return st.done >= st.mins * 60 || s.m.energy >= 70; },
  siteDone(sim, s, st) { const x = site(sim, st.site); return !x || x.done || st.done >= st.mins * 60; },
  fixed(sim, s, st) { return TOOLS.every((k) => sim.tools[k].cond >= 98 || (sim.tools[k].by != null && sim.tools[k].by !== s.id)) || st.done >= st.mins * 60; },
};

FX = {
  sleepStart(sim, s, st) {

    if (s.sleep.lateStart) s.exp.lateStarts = (s.exp.lateStarts || 0) + 1;
  },
  wake(sim, s) {
    const sl = s.sleep;
    if (sl && sl.lateStart && s.m.energy < 72) { event(sim, s, 'badnight', s.name + ' slept badly after a late night.'); say(sim, s, 'Ugh. Too late to bed again.', 'say'); learnEvent(sim, s, 'lateNight'); }
  },
  collapseStart(sim, s, st) { s.sleep = { place: 'wild', start: sim.t, lateStart: false, startEnergy: s.m.energy }; say(sim, s, 'Can’t... keep... going...', 'refuse'); },
  eat(sim, s) {
    let got = 0, hot = false;

    else if (takeFood(sim, 'dried', 1)) got = TUNE.meal;
    else { const b = takeFood(sim, 'berries', 4); got = b * TUNE.berry; if (!b) { const f = takeFood(sim, 'fish', 1); got = f * TUNE.rawFish; } }
    if (!got) { event(sim, s, 'nofood', s.name + ' found nothing to eat at camp.'); return false; }   // the task fails; the next thought is foraging

    }

    for (const o of sim.settlers) if (o !== s && o.act === 'eat' && dist(o, s) < 8) { s.rel[o.id] = Math.min(100, s.rel[o.id] + 2); }
  },
  eatCarry(sim, s) {

    const per = s.carry.item === 'fish' ? TUNE.rawFish : TUNE.berry, k = Math.min(s.carry.n, s.carry.item === 'fish' ? 1 : 4);

  eatPacked(sim, s) { if (s.packed > 0) { s.packed--; s.m.hunger = Math.min(100, s.m.hunger + TUNE.meal); s.stats.meals++; s.ateAt = sim.t; } },
  eatBerries(sim, s, st) {
    const b = sim.world.bushes[st.bush] ?? sim.isl.bushes[st.bush].berries;
    const k = Math.min(b, 4); sim.world.bushes[st.bush] = b - k;
    if (b - k <= 0) sim.world.bushes['r' + st.bush] = sim.t + TUNE.bushRegrowDays * DAYS;

  poo(sim, s) { s.m.bowel = 100; s.stats.poo++; if (!built(sim, 'latrine')) { s.m.mood = Math.max(0, s.m.mood - 2); s.m.clean = Math.max(0, s.m.clean - 3); } },
  bathe(sim, s, st) {
    const cap = st.pond ? 100 : 70;
    s.m.clean = Math.max(s.m.clean, Math.min(cap, s.m.clean + 70)); s.stats.baths++; s.bathT = sim.t;
    s.m.mood = Math.min(100, s.m.mood + (st.pond ? 8 : 3));
    if (st.pond) s.pondUntil = sim.t + 12 * HOUR;
  },
  // a resumed chop: the tree may have been felled, or claimed, while this settler was away
  treeStanding(sim, s, st) {
    if (sim.world.felled[st.tree]) return false;
    const k = 't' + st.tree, who = sim.world.reserved[k];

    event(sim, s, 'fell', null);
  },
  takeRock(sim, s, st) {

    const take = Math.min(left, carryCap(s, 'stone'));
    sim.world.rocks[rk.id] = left - take; delete sim.world.reserved['r' + rk.id];
    s.carry = { item: 'stone', n: take };
  },
  pickPile(sim, s, st) {
    const p = sim.piles.find((x) => x.id === st.pile); if (!p) return false;
    const take = Math.min(p.n, carryCap(s, p.item)); p.n -= take; s.carry = { item: p.item, n: take };
    if (p.n <= 0) sim.piles = sim.piles.filter((x) => x !== p);
    delete sim.world.reserved['p' + p.id];
  },
  dropStock(sim, s) { if (s.carry && !s.carry.food) { sim.stock[s.carry.item] = (sim.stock[s.carry.item] || 0) + s.carry.n; s.carry = null; } },
  dropFood(sim, s) { if (s.carry && s.carry.food) { addFood(sim, s.carry.item, s.carry.n); s.carry = null; } },
  pickBerries(sim, s, st) {
    const b = sim.world.bushes[st.bush] ?? sim.isl.bushes[st.bush].berries;
    const k = Math.min(b, 4); sim.world.bushes[st.bush] = b - k;
    if (b - k <= 0) sim.world.bushes['r' + st.bush] = sim.t + TUNE.bushRegrowDays * DAYS;
    delete sim.world.reserved['b' + st.bush];

  },
  fishEach(sim, s, st, T, dt, rate) {
    if (sim.R.food.next() < TUNE.fishPerHour * dt / HOUR * rate) st.caught = (st.caught || 0) + 1;
  },
  fishDone(sim, s, st) {
    if (st.caught) { s.carry = { item: 'fish', n: st.caught, food: true }; event(sim, s, 'fish', s.name + ' caught ' + st.caught + ' fish.'); }
    else event(sim, s, 'fish', s.name + ' caught nothing.');
  },
  setTrap(sim, s, st) { sim.traps.push({ id: sim.nextId++, x: st.at.x, z: st.at.z, set: sim.t, catch: 0, owner: s.id }); },
  checkTrap(sim, s, st) {
    const tr = sim.traps.find((x) => x.id === st.trap); if (!tr) return;
    if (tr.catch) { if (s.carry && s.carry.item === 'meat') s.carry.n += tr.catch; else s.carry = { item: 'meat', n: tr.catch, food: true }; event(sim, s, 'trap', s.name + ' found a rabbit in a trap.'); tr.catch = 0; }
    tr.checked = sim.t;
  },
  cook(sim, s) {
    const meat = takeFood(sim, 'meat', 99), fish = takeFood(sim, 'fish', 99);
    const meals = meat * 2 + Math.floor(fish * 1.5);

  buildEach(sim, s, st, T, dt, rate) {

  },
  rest(sim, s) { s.m.mood = Math.min(100, s.m.mood + 4); },
  restEach(sim, s, st, T, dt) { s.m.energy = Math.min(85, s.m.energy + 3 * dt / HOUR); },
  cheer(sim, s, st) {
    const o = sim.settlers[st.toId]; if (!o) return;
    const lift = 6 + (s.attrs.CHA - 10) * 1.2;
    o.m.mood = Math.min(100, o.m.mood + lift); o.cheerUntil = sim.t + 8 * HOUR;
    o.rel[s.id] = Math.min(100, (o.rel[s.id] || 50) + 5); s.rel[o.id] = Math.min(100, (s.rel[o.id] || 50) + 3);

  },
  fixEach(sim, s, st, T, dt, rate) {

  },
  look(sim, s) { discover(sim, s); },
  idle() {},
};

carryCap = function carryCap(s, item) { return (TUNE.carry[item] || 4) + (item === 'wood' && s.attrs.STR >= 15 ? 1 : 0) + (item === 'stone' && s.attrs.STR >= 15 ? 1 : 0); }

completeSite = function completeSite(sim, x, s) {
  x.done = true; x.prog = x.hours; x.doneT = sim.t;

  say(sim, s, BUILDINGS[x.type].label + ' is done!', 'say');
  if (x.type === 'foodstore') for (const b of sim.food) b.exp = Math.max(b.exp, b.exp + (TUNE.spoilStored[b.kind] - TUNE.spoil[b.kind]) * DAYS);

}

/* ------------------------------ the world ticking ------------------------------ */
// Each evening a settler looks back on the day: a meter that fell out of the normal
// range (below 50) is a chance to learn the habit that would have kept it there.
const REVIEW = { energy: 'lateNight', hunger: 'skipMeal', clean: 'hygiene', health: 'overwork' };
function nightlyReview(sim) {
  for (const s of sim.settlers) {
    for (const k in REVIEW) if (s.dayMin && s.dayMin[k] < 50) learnEvent(sim, s, REVIEW[k]);
    s.dayMin = {};

function worldHourly(sim) {
  if (Math.abs(hourOf(sim) - 21) < 1e-6) nightlyReview(sim);

  const lost = before - mealUnits(sim);
  if (lost > 0.5) event(sim, null, 'spoil', lost.toFixed(1) + ' meals worth of food spoiled.');

  for (const k in sim.world.bushes) if (k[0] === 'r' && sim.world.bushes[k] <= sim.t) { const id = +k.slice(1); delete sim.world.bushes[k]; sim.world.bushes[id] = sim.isl.bushes[id].berries; }

}
function trapRichness(sim, tr) {
  const d = Math.hypot(tr.x - sim.isl.camp.x, tr.z - sim.isl.camp.z);
  const crowd = sim.traps.filter((o) => o !== tr && Math.hypot(o.x - tr.x, o.z - tr.z) < 40).length;

discover = function discover(sim, s) {

    sim.discovered.pond = sim.t;

    say(sim, s, 'A waterfall! And a pond you could swim in!', 'say');

  }

function markSeen(sim, s) {
  const k = Math.floor(s.x / 16) + ',' + Math.floor(s.z / 16);
  if (!sim.seen[k]) sim.seen[k] = 1;
}

function social(sim) {
  const S = sim.settlers;
  for (let i = 0; i < S.length; i++) for (let j = i + 1; j < S.length; j++) {
    const a = S[i], b = S[j];
    if (a.act === 'sleep' || b.act === 'sleep') continue;
    if (dist(a, b) < 15) { a.rel[b.id] = Math.min(100, a.rel[b.id] + 0.5 / 60); b.rel[a.id] = Math.min(100, b.rel[a.id] + 0.5 / 60); }
  }
}

function phase1Check(sim) {
  if (sim.phase1) return;
  const builtAll = PHASE1_BUILDS.every((b) => built(sim, b)) && sim.sites.filter((x) => x.type === 'bed' && x.done).length >= 5;
  const food = mealUnits(sim) >= foodTarget(sim);

    const opts = Object.keys(GOALS).filter((g) => !sim.goals.includes(g));
    const sig = opts.join();
    part('goaladd', sig, $('#goal-add'), '<option value="">+ add a goal</option>' + opts.map((g) => `<option value="${g}">${esc(GOALS[g].label)}</option>`).join(''));
  }

  function settler() {
    const sim = api.sim(), sid = api.selected(), box = $('#settler');
    if (sid == null) { box.classList.add('hidden'); ui.parts.sHead = null; return; }
    box.classList.remove('hidden');
    const s = sim.settlers[sid], F = FOUNDERS[sid];
    const body = $('#settler-body');
    if (!body.querySelector('#s-head') || ui.parts.sId !== sid) {
      ui.parts.sId = sid; ui.parts.sMeters = ui.parts.sMind = ui.parts.sPlan = null;
      const L = s.look;
      body.innerHTML = `<div id="s-head"></div><h3>Now</h3><div id="s-now"></div><h3>Next</h3><div id="s-next"></div><h3>Needs</h3><div id="s-meters"></div><div id="s-mind"></div>`;
      $('#s-head').innerHTML = `<div class="who"><div class="swatch" style="background:linear-gradient(${L.hair} 0 18%,${L.skin} 18% 34%,${L.shirt} 34% 66%,${L.pants} 66% 92%,${L.boots} 92%)"></div><div><h2 style="margin:0">${esc(s.name)}</h2><div class="role">${esc(s.title)} · founder · perseverance</div></div></div>` +
        `<h3>Attributes</h3><div class="attrs">${Object.entries(s.attrs).map(([k, v]) => `<div>${v}<small>${k}</small></div>`).join('')}</div>` +
        `<h3>Character</h3><div class="tags"><em>Strengths:</em> ${esc(F.strengths.join(', '))}<br><em>Weaknesses:</em> ${esc(F.weaknesses.join(', '))}<br><em>Likes:</em> ${esc(F.prefs.join(', '))}<br><em>Goals:</em> ${esc(F.goals.join(', '))}<br><em>Fears:</em> ${esc(F.fears.join(', '))}</div>`;
    }
    // meters: values change every tick, so update in place
    const mEl = $('#s-meters');
    if (!mEl.children.length) mEl.innerHTML = METERS.map(([k, l]) => `<div class="meter" data-k="${k}"><span>${l}</span><div class="bar"><i></i><b style="left:50%"></b><b style="left:80%"></b></div><span class="v"></span></div>`).join('');
    for (const row of mEl.children) {
      const k = row.dataset.k, v = s.m[k], i = row.querySelector('i');
      i.style.width = v.toFixed(1) + '%';
      i.style.background = v < 25 ? 'var(--red)' : v < 50 ? 'var(--gold)' : v > 80 ? 'var(--blue)' : 'var(--green)';
      row.querySelector('.v').textContent = Math.round(v) + '%';
    }
    // what they are doing now, and the plan
    const T = s.task;
    const nowSig = T ? T.id + ':' + T.i + ':' + s.act : 'none';
    part('sNow', nowSig, $('#s-now'), T ? `<div class="task now"><div class="tl"><b>${esc(T.label)}</b>${T.pinned ? ' <span class="role">(your order)</span>' : ''} <span class="role">· ${esc(ACT_WORD[s.act] || s.act)}</span><div class="steps">${T.steps.map((st, j) => `<span class="${j === T.i ? 'cur' : ''}">${j < T.i ? '✓ ' : j === T.i ? '▸ ' : '· '}${esc(st.label || st.act || st.do)}</span>`).join('<br>')}</div></div></div>` : '<div class="log">thinking…</div>');
    const fc = forecastNeeds(sim, s);
    const planSig = s.plan.map((it) => it.id + it.kind + (it.owner || '')).join() + '|' + fc.map((f) => f.label).join() + '|' + (s.delay ? JSON.stringify(s.delay) : '');
    part('sPlan', planSig, $('#s-next'), s.plan.map((it, i) => `<div class="task"><span class="tl">${esc(it.label || it.kind)}${it.owner === 'player' ? ' <span class="role">(moved by you)</span>' : it.steps ? ' <span class="role">(paused)</span>' : ''}</span><button class="mini" data-a="up" data-i="${i}" data-id="${it.id}" ${i ? '' : 'disabled'} aria-label="Earlier">▲</button><button class="mini" data-a="now" data-i="${i}" data-id="${it.id}">Do now</button></div>`).join('') +
      fc.map((f) => `<div class="task"><span class="tl" style="color:var(--dim)">${esc(f.label)}</span><button class="mini" data-a="later" data-n="${f.kind}">Later</button></div>`).join(''));
    // the mind: lessons, friends, recent log
    const lessons = Object.entries(s.lessons).map(([k, l]) => `<li>✦ ${esc(LESSONS[k].label)} <span class="role">— ${esc(LESSONS[k].fmt(l.v))} (day ${l.day})</span></li>`).join('') || '<li class="role">none yet</li>';
    const friends = Object.entries(s.rel).sort((a, b) => b[1] - a[1]).map(([id, v]) => `${esc(sim.settlers[id].name)} ${Math.round(v)}`).join(' · ');
    const logs = s.log.slice(-6).reverse().map((l) => { const c = clockOf({ t: l.t }); return `<div>D${c.day} ${String(c.hour).padStart(2, '0')}:${String(c.minute).padStart(2, '0')} ${esc(l.text)}</div>`; }).join('');
    const mindSig = lessons + friends.replace(/\d+/g, (n) => Math.round(n / 5)) + logs;
    part('sMind', mindSig, $('#s-mind'), `<h3>Lessons learned</h3><ul>${lessons}</ul><h3>Friends</h3><div class="tags">${friends}</div><h3>Recently</h3><div class="log">${logs || '—'}</div>`);
  }

  function topbar() {
    const sim = api.sim(), c = clockOf(sim);
    $('#clock').textContent = `Day ${c.day} · ${String(c.hour).padStart(2, '0')}:${String(c.minute).padStart(2, '0')}${api.nightSkip() ? ' ⏩' : ''}`;
    for (const b of document.querySelectorAll('.spd')) b.classList.toggle('on', +b.dataset.i === api.speedIdx());
    const v = api.selected() == null ? '' : String(api.selected());
    if (fsel.value !== v) fsel.value = v;
  }

  // speech bubbles over heads, for 8 real seconds each
  function bubbles(project, nowReal) {
    const sim = api.sim(), root = $('#bubbles');
    // a line is shown once: `shown` remembers it for as long as the sim still holds it
    const held = new Set(sim.bubbles.map((b) => b.id));
    for (const id of ui.shown) if (!held.has(id)) ui.shown.delete(id);
    for (const b of sim.bubbles) if (!ui.shown.has(b.id) && b.t >= api.loadedAt()) {
      ui.shown.add(b.id);
      const el = document.createElement('div'); el.className = 'bubble ' + (b.kind === 'refuse' ? 'refuse' : '');
      el.innerHTML = `<span class="bn">${esc(sim.settlers[b.sid].name)}</span>${esc(b.text)}`;
      root.appendChild(el); ui.bubbleEls.set(b.id, { el, born: nowReal, sid: b.sid });
    }
    const live = [...ui.bubbleEls.entries()];
    const perSettler = {};
    for (let i = live.length - 1; i >= 0; i--) {
      const [id, o] = live[i];
      const old = nowReal - o.born > 8 || (perSettler[o.sid] = (perSettler[o.sid] || 0) + 1) > 1 || live.length - i > 4;
      if (old) { o.el.remove(); ui.bubbleEls.delete(id); continue; }
      const p = project(o.sid);
      if (!p) { o.el.style.display = 'none'; continue; }
      o.el.style.display = ''; o.el.style.left = p.sx + 'px'; o.el.style.top = (p.sy - 14) + 'px';
    }
  }

  function overlay(html) { $('#overlay-card').innerHTML = html; $('#overlay').classList.remove('hidden'); api.overlayOpen(true); }
  function hideOverlay() { $('#overlay').classList.add('hidden'); api.overlayOpen(false); }
  function showInfo() {
    overlay(`<h1>Colony Sim</h1>
<p>Four settlers, chosen by the people paying for their expedition, have landed on an island with one set of tools and a crate of rations. Watch them make a camp, learn from their mistakes and get ready for a fifth.</p>
<h3>Camera</h3><p>Drag to orbit · right-drag or shift-drag to pan · wheel to zoom · WASD / arrows to move · Q / E to turn · click a settler to follow them · pick one from <em>follow</em> to fly to them.</p>
<h3>Time</h3><p>A day is 30 minutes at 1×. Space pauses; 1–6 pick a speed. While everyone sleeps the night runs at 16× (⏩).</p>
<h3>Goals (left)</h3><p>The leader turns these into jobs and hands them out. Reorder them with ▲▼, remove with ✕, add from the list. A goal waits until the ones it needs are done.</p>
<h3>A settler (right)</h3><p>Needs: 50–80% is normal; below 50% they work worse; above 80% better, up to +20% at 100%. <b>Next</b> is their plan: ▲ moves a job earlier, <b>Do now</b> makes it their next order, <b>Later</b> puts off sleep or a meal. Until they have learned better they obey, even when it hurts them. Once a mistake has taught them a lesson, they refuse and say why.</p>
<h3>Phase 1</h3><p>Done when the camp has a fire, a lean-to, storage, a food store, a latrine, two huts, five beds and a tool bench, holds three days of food for five, and nobody has dropped below 50% on health, energy, food, mood or cleanliness for two days.</p>
<p class="role">First draft. Graphics are deliberately blocky for now.</p>
<button class="btn" id="ov-ok">Back to the island</button>`);
    $('#ov-ok').addEventListener('click', hideOverlay);
  }
  function showSettings() {
    overlay(`<h1>Settings</h1>
<p>Island seed: <b>${api.sim().seed}</b> · day ${clockOf(api.sim()).day}</p>
<p><label>New island with seed <input id="seed-in" type="number" value="${Math.floor(Math.random() * 99999)}" style="width:110px;background:#141c16;color:var(--ink);border:1px solid var(--border);border-radius:5px;font:inherit;padding:2px 5px"></label></p>
<button class="btn" id="ov-new">Start a new island</button><button class="btn alt" id="ov-ok">Back</button>`);
    $('#ov-ok').addEventListener('click', hideOverlay);
    $('#ov-new').addEventListener('click', () => { const v = Math.max(1, Math.floor(+$('#seed-in').value) || 1); hideOverlay(); api.newGame(v); });
  }
  function showPhase1(sim) {
    const S = sim.settlers;
    overlay(`<h1>Phase 1 complete</h1>
<p>Day ${sim.phase1.day}: the camp is self-sufficient. It has shelter and beds for five, three days of food, and a tool bench. Everyone has stayed in good shape for two days running.</p>
<p>${S.map((s) => `<b>${esc(s.name)}</b>: ${Object.keys(s.lessons).length} lessons, lowest ${Math.round(s.stats.lowest)}% (${s.stats.lowWhat})`).join('<br>')}</p>
<p class="role">Inviting a fifth settler comes in a later draft. The colony carries on in the meantime.</p>
<button class="btn" id="ov-ok">Keep watching</button>`);
    $('#ov-ok').addEventListener('click', hideOverlay);
  }
  function showLoad(day, onGo, onNew) {
    overlay(`<h1>Colony Sim</h1><p>Your island is waiting on day ${day}.</p><button class="btn" id="ov-go">Continue</button><button class="btn alt" id="ov-new">New island</button>`);
    $('#ov-go').addEventListener('click', () => { hideOverlay(); onGo(); });
    $('#ov-new').addEventListener('click', () => { hideOverlay(); onNew(); });
  }
  ui.update = (project, nowReal, full) => { topbar(); if (full) { goals(); } settler(); bubbles(project, nowReal); };
  ui.refreshAll = () => { ui.parts = {}; ui.shown.clear(); $('#settler-body').innerHTML = ''; for (const [, o] of ui.bubbleEls) o.el.remove(); ui.bubbleEls.clear(); };
  ui.showPhase1 = showPhase1; ui.showLoad = showLoad; ui.hideOverlay = hideOverlay; ui.showInfo = showInfo;
  return ui;
}

}
/* ===== main.js ===== */
{
// main.js — boot, the frame loop, camera input, follow, save/load.

const SAVE = 'colonySim.v1';
const canvas = document.getElementById('view');
const G = { sim: null, R: null, rigs: [], views: [], prev: [], colors: [], speedIdx: 1, selected: null, following: false, acc: 0, overlay: false, lastSave: 0, loadedAt: 0, shownP1: false, nightSkip: false };
const audio = makeAudio();

function viewOf(s, i, a, mult) {
  const p = G.prev[i] || s, x = p.x + (s.x - p.x) * a, z = p.z + (s.z - p.z) * a;
  return { x, z, yaw: s.yaw, speed: s.speed * 48 * mult, act: s.act, look: s.look, carry: s.carry, face: s.face };
}
function boot(sim) {
  G.sim = sim; G.loadedAt = sim.t; G.shownP1 = !!sim.phase1;
  if (!G.R) {
    try { G.R = makeRenderer(canvas, sim.isl); } catch (e) { console.error(e); G.R = null; }
    if (!G.R) { document.getElementById('overlay-card').innerHTML = '<h1>Colony Sim</h1><p>This page needs WebGL2, which this browser does not offer.</p>'; document.getElementById('overlay').classList.remove('hidden'); return false; }
  } else G.R = makeRenderer(canvas, sim.isl);
  G.prev = sim.settlers.map((s) => ({ x: s.x, z: s.z }));
  G.views = sim.settlers.map((s, i) => viewOf(s, i, 1, 1));
  G.rigs = sim.settlers.map((s, i) => makeRig(G.views[i], sim.isl));
  G.colors = sim.settlers.map((s) => G.R.colorsFor(s.look));
  G.R.cam.tx = sim.isl.camp.x; G.R.cam.tz = sim.isl.camp.z; G.R.cam.ty = heightAt(sim.isl, sim.isl.camp.x, sim.isl.camp.z);
  G.R.cam.dist = 70; G.R.cam.pitch = 0.6;
  G.acc = 0; G.selected = null; G.following = false; G.lastSave = sim.t;
  return true;
}
function save() {
  try { localStorage.setItem(SAVE, JSON.stringify({ v: 1, snap: snapshot(G.sim) })); } catch (e) { /* storage full: keep playing */ }
}
function load() {
  const raw = localStorage.getItem(SAVE); if (!raw) return null;
  try {
    const o = JSON.parse(raw);
    if (!o || o.v !== 1 || !o.snap || typeof o.snap.seed !== 'number') throw new Error('unknown save');
    const probe = restore(JSON.parse(JSON.stringify(o.snap)));   // one step on a copy: a save that cannot run is not loaded
    step(probe);
    return restore(o.snap);
  } catch (e) { localStorage.setItem('colonySim.bad', raw); localStorage.removeItem(SAVE); return null; }
}

const api = {
  sim: () => G.sim, selected: () => G.selected, speedIdx: () => G.speedIdx, nightSkip: () => G.nightSkip, loadedAt: () => G.loadedAt,
  setSpeed(i) { G.speedIdx = i; audio.init(); },
  follow(id) {
    G.selected = id; G.following = id != null;
    if (id != null) { const r = G.rigs[id], p = r.J[0]; G.R.flyTo(p.x, p.y, p.z, Math.min(G.R.cam.dist, 9)); }
  },
  input(rec) { const out = applyInput(G.sim, rec); ui.parts = {}; return out; },
  overlayOpen(v) { G.overlay = v; },
  newGame(seed) { localStorage.removeItem(SAVE); boot(createSim(seed)); ui.refreshAll(); save(); },
};
let ui = null;

/* ------------------------------ input ------------------------------ */
let drag = null;
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('mousedown', (e) => { audio.init(); drag = { x: e.clientX, y: e.clientY, b: e.button, shift: e.shiftKey, moved: 0 }; canvas.classList.add('drag'); });
window.addEventListener('mousemove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.b === 2 || drag.shift) { G.R.pan(dx, dy); G.following = false; } else G.R.orbit(dx, dy);
});
window.addEventListener('mouseup', (e) => {
  canvas.classList.remove('drag');
  if (drag && drag.moved < 5 && drag.b === 0) clickAt(e.clientX, e.clientY);
  drag = null;
});
canvas.addEventListener('wheel', (e) => { e.preventDefault(); G.R.zoom(Math.exp(e.deltaY * 0.0012)); }, { passive: false });
function clickAt(x, y) {
  const r = canvas.getBoundingClientRect(); x -= r.left; y -= r.top;
  let best = null, bd = 46;
  G.rigs.forEach((rig, i) => {
    for (const j of [0, 2, 4]) { const p = G.R.project(rig.J[j].x, rig.J[j].y, rig.J[j].z); if (!p) continue; const d = Math.hypot(p.sx - x, p.sy - y); if (d < bd) { bd = d; best = i; } }
  });
  if (best != null) api.follow(best); else { G.selected = null; G.following = false; }
}
// touch: one finger orbits, two pan and pinch (phones still work, PC is the target)
let touch = null;
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); audio.init(); touch = tsnap(e); touch.moved = 0; touch.t0 = performance.now(); }, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault(); if (!touch) return; const n = tsnap(e);
  if (n.n === 1 && touch.n === 1) { G.R.orbit(n.x - touch.x, n.y - touch.y); touch.moved += Math.abs(n.x - touch.x) + Math.abs(n.y - touch.y); }
  if (n.n === 2 && touch.n === 2) { G.R.pan(n.x - touch.x, n.y - touch.y); G.R.zoom(touch.d / n.d); touch.moved += 99; G.following = false; }
  Object.assign(touch, n);
}, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); if (touch && touch.moved < 8 && e.touches.length === 0 && performance.now() - touch.t0 < 400) clickAt(touch.x, touch.y); touch = e.touches.length ? Object.assign(tsnap(e), { moved: 99 }) : null; }, { passive: false });
function tsnap(e) { const t = e.touches, n = t.length; if (!n) return { n: 0, x: 0, y: 0, d: 1 }; let x = 0, y = 0; for (const p of t) { x += p.clientX; y += p.clientY; } return { n, x: x / n, y: y / n, d: n > 1 ? Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY) || 1 : 1 }; }
const keys = new Set();
window.addEventListener('keydown', (e) => {
  const a = document.activeElement; if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA')) return;
  if (e.code === 'Space') { e.preventDefault(); G.speedIdx = G.speedIdx ? 0 : (G.lastSpeed || 1); if (G.speedIdx) G.lastSpeed = G.speedIdx; }
  if (/^Digit[1-6]$/.test(e.code)) G.speedIdx = +e.code.slice(5) - 1;
  keys.add(e.code); audio.init();
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
document.getElementById('mute-btn').addEventListener('click', (e) => { audio.init(); audio.setMuted(!audio.muted); e.currentTarget.textContent = audio.muted ? '🔇' : '🔊'; });
document.getElementById('mute-btn').textContent = audio.muted ? '🔇' : '🔊';

/* ------------------------------ the loop ------------------------------ */
let last = null, uiT = 0, chopT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!G.sim || !G.R) return;
  const dt = last == null ? 0 : Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  const sim = G.sim;
  // keyboard camera
  const kp = 300 * dt;
  if (keys.has('KeyW') || keys.has('ArrowUp')) { G.R.pan(0, kp); G.following = false; }
  if (keys.has('KeyS') || keys.has('ArrowDown')) { G.R.pan(0, -kp); G.following = false; }
  if (keys.has('KeyA') || keys.has('ArrowLeft')) { G.R.pan(kp, 0); G.following = false; }
  if (keys.has('KeyD') || keys.has('ArrowRight')) { G.R.pan(-kp, 0); G.following = false; }
  if (keys.has('KeyQ')) G.R.orbit(-200 * dt, 0); if (keys.has('KeyE')) G.R.orbit(200 * dt, 0);
  // time
  let mult = SPEEDS[G.speedIdx];
  G.nightSkip = mult > 0 && mult < 16 && sim.settlers.every((s) => s.act === 'sleep' || s.act === 'collapsed');
  if (G.nightSkip) mult = 16;
  if (G.overlay && document.querySelector('#ov-go')) mult = 0;
  G.acc += dt * 48 * mult;
  let n = 0;
  while (G.acc >= TICK && n < 400) {
    if (G.acc < 2 * TICK) G.prev = sim.settlers.map((s) => ({ x: s.x, z: s.z }));
    step(sim); G.acc -= TICK; n++;
  }
  if (n >= 400) { G.acc = 0; G.prev = sim.settlers.map((s) => ({ x: s.x, z: s.z })); }
  const a = Math.min(1, G.acc / TICK);
  // bodies
  sim.settlers.forEach((s, i) => { G.views[i] = viewOf(s, i, a, Math.max(mult, 0.001)); updateRig(G.rigs[i], G.views[i], dt, sim.isl); });
  if (G.following && G.selected != null && !G.R.cam.fly) {
    const p = G.rigs[G.selected].J[0], k = 1 - Math.exp(-dt * 6);
    G.R.cam.tx += (p.x - G.R.cam.tx) * k; G.R.cam.ty += (p.y - G.R.cam.ty) * k; G.R.cam.tz += (p.z - G.R.cam.tz) * k;
  }
  const out = G.R.frame(sim, G.rigs, (i) => rigCapsules(G.rigs[i], G.views[i]), now / 1000, { colors: G.colors, selected: G.selected });
  // sound: the shore is loud when the camera is near the sea
  const c = G.R.cam, cx = Math.floor(c.tx / 2), cz = Math.floor(c.tz / 2);
  const sd = cx >= 0 && cz >= 0 && cx < sim.isl.W && cz < sim.isl.H ? sim.isl.seaD[cz * sim.isl.W + cx] : 0;   // off the map is open sea
  const shore = Math.max(0, 1 - (sd * 2) / 120) * Math.max(0, 1 - c.dist / 400);
  audio.tick(out.night > 0.5, shore, dt);
  chopT += dt;
  if (chopT > 0.7 && mult > 0) { chopT = 0; for (const s of sim.settlers) if ((s.act === 'chop' || s.act === 'mine' || s.act === 'build') && Math.hypot(s.x - c.tx, s.z - c.tz) < 40 && c.dist < 80) audio.thunk(0.25 * (1 - c.dist / 80)); }
  // the panels
  uiT += dt;
  const proj = (sid) => { const h = G.rigs[sid].J[4]; return G.R.project(h.x, h.y + 0.35, h.z); };
  ui.update(proj, now / 1000, uiT > 0.25);
  if (uiT > 0.25) uiT = 0;
  if (sim.phase1 && !G.shownP1) { G.shownP1 = true; ui.showPhase1(sim); }
  if (sim.t - G.lastSave > 3600) { G.lastSave = sim.t; save(); }
}
window.addEventListener('beforeunload', () => { if (G.sim) save(); });
window.addEventListener('pagehide', () => { if (G.sim) save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.sim) save(); });

const loaded = load();
let booted = false;
if (loaded) { try { booted = boot(loaded); } catch (e) { console.warn('saved island would not start; starting fresh', e); localStorage.setItem('colonySim.bad', localStorage.getItem(SAVE) || ''); localStorage.removeItem(SAVE); } }
if (loaded && booted) {
  ui = makeUI(api);
  ui.showLoad(clockOf(loaded).day, () => {}, () => api.newGame(Math.floor(Math.random() * 99999) + 1));
} else { boot(createSim(Math.floor(Math.random() * 99999) + 1)); ui = makeUI(api); }
window.__CS = { G, api, step, applyInput, audio };
requestAnimationFrame(frame);

}
})();
</script>
