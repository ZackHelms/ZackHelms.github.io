<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colony Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>:root{--bg:#0d1410;--panel:rgba(16,22,18,.86);--border:#33402f;--ink:#e8e4d4;--dim:#9aa58e;--gold:#e8c060;--green:#7fd36a;--red:#e8604c;--blue:#6aa8e8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Share Tech Mono',monospace;user-select:none;-webkit-user-select:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view.drag{cursor:grabbing}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;backdrop-filter:blur(3px)}
.hidden{display:none!important}
.chrome{position:fixed;top:calc(8px + env(safe-area-inset-top));z-index:80;width:38px;height:30px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--ink);font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;padding:0}
#back-btn{left:calc(8px + env(safe-area-inset-left))}
#mute-btn{left:calc(52px + env(safe-area-inset-left))}
#topbar{position:fixed;top:calc(8px + env(safe-area-inset-top));left:100px;right:110px;height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;z-index:60;font-size:14px;overflow:hidden;white-space:nowrap}
#clock{font-family:'Black Ops One',sans-serif;letter-spacing:.5px;min-width:120px;color:var(--gold)}
#speeds{display:flex;gap:3px}
.tb,.spd{background:transparent;border:1px solid var(--border);border-radius:5px;color:var(--ink);font:inherit;font-size:13px;padding:1px 7px;cursor:pointer}
.spd.on{background:var(--gold);color:#1a1508;border-color:var(--gold)}
.tb:hover,.spd:hover{border-color:var(--gold)}
select{background:#141c16;color:var(--ink);border:1px solid var(--border);border-radius:5px;font:inherit;font-size:13px;padding:2px 4px}
.side{position:fixed;top:calc(46px + env(safe-area-inset-top));bottom:10px;width:300px;z-index:50;overflow-y:auto;padding:10px 12px;font-size:13px}
.side.left{left:8px;width:250px}
.side.right{right:8px;width:330px}
h2{font-family:'Black Ops One',sans-serif;font-weight:normal;font-size:16px;margin:0 0 8px;color:var(--gold);letter-spacing:.5px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:12px 0 4px;font-weight:normal}
ol,ul{margin:0;padding:0;list-style:none}
#goal-list li{display:flex;align-items:center;gap:4px;padding:4px 0;border-bottom:1px solid #222b20}
#goal-list li .gl{flex:1;min-width:0}
#goal-list li .gs{display:block;color:var(--dim);font-size:11px}
#goal-list li.done .gl{color:var(--green)}
.mini{background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--ink);font:inherit;font-size:11px;padding:0 5px;cursor:pointer;line-height:18px}
.mini:hover{border-color:var(--gold)}
#goal-add{margin-top:8px;width:100%}
.x{position:absolute;top:6px;right:8px;background:transparent;border:0;color:var(--dim);font-size:15px;cursor:pointer}
.who{display:flex;gap:10px;align-items:center}
.swatch{width:26px;height:40px;border-radius:5px;flex:none;border:1px solid #000}
.role{color:var(--dim);font-size:12px}
.meter{display:grid;grid-template-columns:78px 1fr 34px;gap:6px;align-items:center;margin:2px 0}
.bar{position:relative;height:9px;background:#26301f;border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
.bar b{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35)}
.attrs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.attrs div{border:1px solid var(--border);border-radius:4px;padding:2px 0}
.attrs small{display:block;color:var(--dim);font-size:10px}
.tags{color:var(--ink);line-height:1.45}
.tags em{color:var(--dim);font-style:normal}
.task{padding:3px 0;border-bottom:1px solid #222b20;display:flex;gap:4px;align-items:flex-start}
.task .tl{flex:1}
.task .steps{color:var(--dim);font-size:11px;margin-top:2px}
.task .steps .cur{color:var(--gold)}
.now{border-left:3px solid var(--gold);padding-left:6px}
.log{color:var(--dim);font-size:11px;line-height:1.4}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:40}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:220px;background:#f4efdc;color:#1c1a12;border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.3;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.bubble:after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:#f4efdc;border-bottom:0}
.bubble.refuse{background:#ffe2d6}
.bubble.refuse:after{border-top-color:#ffe2d6}
.bubble .bn{font-weight:bold;display:block;font-size:10px;color:#6a5a2a}
#overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:20px}
#overlay>:first-child{margin-top:auto}#overlay>:last-child{margin-bottom:auto}
#overlay-card{max-width:560px;width:100%;padding:18px 20px;font-size:14px;line-height:1.5}
#overlay-card h1{font-family:'Black Ops One',sans-serif;font-weight:normal;color:var(--gold);margin:0 0 10px;font-size:24px}
#overlay-card button{margin:10px 8px 0 0}
.btn{background:var(--gold);color:#1a1508;border:0;border-radius:6px;font:inherit;font-size:14px;padding:6px 14px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--border)}
@media (max-width:820px){.side.left{display:none}.side.right{width:calc(100% - 16px);top:auto;height:45%}#topbar{right:8px;left:96px;top:calc(44px + env(safe-area-inset-top))}#speeds .spd:nth-child(n+5){display:none}}</style>
</head>

"use strict";
/* ===== rng.js ===== */
// rng.js — seeded randomness. sfc32 core; named streams so one system's draws
// never shift another's (a test can then force one outcome without moving the rest).
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function sfc32(a, b, c, d) {
  return function () {
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    let t = (a + b) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11); d = (d + 1) | 0; t = (t + d) | 0; c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}
function gen(seed, name) {
  const h = fnv1a(String(seed) + '|' + name);
  const f = sfc32(h, h ^ 0x9e3779b9, (h * 31) ^ 0x85ebca6b, fnv1a(name + '#' + seed));
  for (let i = 0; i < 12; i++) f();
  const r = {
    next: f,
    range: (a, b) => a + f() * (b - a),
    int: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    chance: (p) => f() < p,
    stream: (n) => gen(seed, name + '/' + n),
  };
  return r;
}
function makeRng(seed) { return gen(seed >>> 0, 'root'); }
function hashState(obj) { return fnv1a(JSON.stringify(obj)).toString(16).padStart(8, '0'); }
