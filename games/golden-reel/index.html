<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Golden Reel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap');
:root {
  --bg:#06060e; --panel:#0b0b16; --border:#1a1a30;
  --green:#39ff14; --gold:#ffc300; --blue:#4488ff; --red:#ff2244;
  --white:#dde3ff; --dim:#8899bb; --purple:#b44fff;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--white);
  font-family:'Share Tech Mono', monospace;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  position:fixed; inset:0;
}
#cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
#back-btn {
  position:absolute; top:calc(var(--sat) + 8px); left:10px; z-index:30;
  background:rgba(11,11,22,0.7); border:1px solid var(--border); border-radius:6px;
  color:var(--white); font-size:16px; width:38px; height:34px; line-height:32px;
  text-align:center; text-decoration:none; touch-action:manipulation;
}
#mute {
  position:absolute; top:calc(var(--sat) + 8px); left:56px; z-index:30;
  background:rgba(11,11,22,0.7); border:1px solid var(--border); border-radius:6px;
  color:var(--white); font-size:16px; width:38px; height:34px; line-height:30px;
  text-align:center; padding:0; touch-action:manipulation;
}
#overlay {
  position:absolute; inset:0; z-index:20; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  background:rgba(5,6,14,0.9); padding:20px; text-align:center;
  padding-top:calc(var(--sat) + 20px); padding-bottom:calc(var(--sab) + 20px);
  overflow-y:auto;
}
#overlay.hidden { display:none; }
#overlay h1 {
  font-family:'Black Ops One', sans-serif; color:var(--gold);
  font-size:clamp(1.7rem, 8vw, 2.5rem); letter-spacing:4px;
  text-shadow:0 0 30px #ffc30055; margin-bottom:4px;
}
#overlay h2 {
  font-family:'Black Ops One', sans-serif; color:var(--gold);
  font-size:1.3rem; letter-spacing:3px; margin-bottom:8px;
}
.sub { color:var(--dim); font-size:0.68rem; letter-spacing:3px; margin-bottom:16px; }
.btn {
  font-family:'Black Ops One', sans-serif; letter-spacing:2px;
  background:var(--panel); color:var(--gold);
  border:1px solid var(--gold); border-radius:8px;
  font-size:1.0rem; padding:13px 30px; margin:6px; min-width:260px;
  touch-action:manipulation; cursor:pointer;
}
.btn.blue { color:#9cc6e8; border-color:#4488ff; }
.btn.dim2 { color:#55607a; border-color:#252a40; }
.gear-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  padding:10px 14px; margin:5px; width:min(330px, 88vw);
}
.gear-row .gname { font-family:'Black Ops One', sans-serif; font-size:0.72rem; letter-spacing:1px; color:var(--white); text-align:left; }
.gear-row .gdesc { font-size:0.6rem; color:var(--dim); text-align:left; }
.gear-row button {
  font-family:'Share Tech Mono', monospace; background:#141020; color:var(--gold);
  border:1px solid var(--gold); border-radius:6px; padding:8px 12px; font-size:0.7rem;
  touch-action:manipulation; cursor:pointer; white-space:nowrap;
}
.gear-row button.max { color:#55607a; border-color:#252a40; }
.log-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  padding:8px 14px; margin:4px; width:min(330px, 88vw); font-size:0.72rem;
}
.log-row .ln { color:var(--white); letter-spacing:1px; text-align:left; }
.log-row .lv { color:var(--dim); font-size:0.64rem; }
.log-row.unseen .ln, .log-row.unseen .lv { color:#3a4258; }
.stat { color:var(--white); font-size:0.85rem; margin:3px 0; letter-spacing:1px; }
.stat b { color:var(--gold); }
.howto { color:var(--dim); font-size:0.7rem; max-width:320px; line-height:1.7; margin-top:14px; }
.howto em { color:var(--gold); font-style:normal; }
</style>
</head>
<body>
<div id="build-badge" style="position:fixed;top:2px;right:6px;z-index:2147483647;font-family:'Courier New',monospace;font-size:9px;color:#888;opacity:0.55;pointer-events:none;letter-spacing:0.5px;user-select:none;">build 2026-07-25 02:24 UTC</div>
<a id="back-btn" href="../index.html" aria-label="Back to games">←</a>
<button id="mute">🔊</button>
<canvas id="cv"></canvas>
<div id="overlay"></div>
<script>
'use strict';
/* =====================================================================
   GOLDEN REEL — dusk-lake fishing. Hold to charge the cast, tap to
   twitch the lure, tap the bite to set the hook, then hold to reel and
   release through the runs. Coins buy gear; the catch log fills forever.
   Realistic rendering: layered sunset, sun-glitter water, mirrored sky,
   ripple rings, silhouette fish, misted far shore.
   ===================================================================== */

/* ============ Species table ============ */
// zone: [minDist, maxDist]; rare species gate on lure level
const SPECIES = [
  { key: 'bluegill', name: 'BLUEGILL',   zone: [0, 45],   w: [0.2, 0.8],  val: 9,  fight: 0.25, hue: '#7a8a6a' },
  { key: 'perch',    name: 'PERCH',      zone: [0, 50],   w: [0.3, 1.2],  val: 12, fight: 0.32, hue: '#8a7a4a' },
  { key: 'bass',     name: 'BASS',       zone: [35, 75],  w: [1.0, 3.0],  val: 18, fight: 0.5,  hue: '#4a6a4a' },
  { key: 'catfish',  name: 'CATFISH',    zone: [35, 80],  w: [2.0, 6.0],  val: 22, fight: 0.55, hue: '#5a5a6a' },
  { key: 'trout',    name: 'RAINBOW TROUT', zone: [60, 100], w: [1.0, 2.5], val: 30, fight: 0.62, hue: '#7a5a6a' },
  { key: 'pike',     name: 'NORTHERN PIKE', zone: [65, 100], w: [3.0, 9.0], val: 38, fight: 0.78, hue: '#3a5a3a' },
  { key: 'koi',      name: 'GOLDEN KOI', zone: [40, 100], w: [2.0, 5.0],  val: 120, fight: 0.6, hue: '#c8922a', rare: 0.05, minLure: 1 },
  { key: 'goldscale', name: 'OLD GOLDSCALE', zone: [75, 100], w: [12, 25], val: 400, fight: 1.0, hue: '#d8a020', rare: 0.03, minLure: 3 },
];

/* ============ Gear ============ */
const GEAR_DEFS = {
  rod:  { name: 'ROD',  desc: l => 'max tension ' + rodMaxT(l), max: 4 },
  reel: { name: 'REEL', desc: l => 'reel speed ' + reelSpd(l).toFixed(1), max: 4 },
  line: { name: 'LINE', desc: l => 'cast range ' + maxCast(l) + 'm', max: 4 },
  lure: { name: 'LURE', desc: l => 'bite rate +' + l * 25 + '%, rare odds up', max: 4 },
};
function gearCost(l) { return [40, 120, 340, 900][l] || 0; } // cost of level l+1
function rodMaxT(l) { return 100 + l * 25; }
function reelSpd(l) { return 9 + l * 2.2; }
function maxCast(l) { return 55 + l * 11; } // lvl4 → 99
function biteDelay(l) { return 6.5 / (1 + l * 0.25); } // mean seconds to bite

/* ============ State (top-level: reachable from page.evaluate) ============ */
let state = 'menu';   // menu | idle | casting | flight | wait | bite | fight | caught | snap
let charge = 0, charging = false;
let castD = 0;        // current cast distance (world 0..100)
let flightT = 0;      // flight anim 0..1
let biteT = 0;        // countdown to next bite while waiting
let biteWin = 0;      // hook-set window countdown
let biteSp = null;    // species that is striking / hooked
let fight = null;     // {sp,w,stam,mode,modeT,tension,dist}
let reeling = false;
let coins = 0;
let gear = { rod: 0, reel: 0, line: 0, lure: 0 };
let log = {};         // key → {n, best}
let lastCatch = null; // {sp,w,val} for the card
let twitchCD = 0;
let ripples = [];     // {d, r, max, a}
let splashes = [];    // particles {x,y,vx,vy,t,max}
let ambient = [];     // visual fish {d, x, sp, dir, spd, wob}
let fireflies = [];
let toast = null;     // {txt,t}

/* ============ Persistence ============ */
function loadSave() {
  try {
    coins = parseInt(localStorage.getItem('goldenReel.coins') || '0', 10) || 0;
    gear = Object.assign({ rod: 0, reel: 0, line: 0, lure: 0 }, JSON.parse(localStorage.getItem('goldenReel.gear') || '{}'));
    log = JSON.parse(localStorage.getItem('goldenReel.log') || '{}');
  } catch (err) { coins = 0; gear = { rod: 0, reel: 0, line: 0, lure: 0 }; log = {}; }
}
function save() {
  try {
    localStorage.setItem('goldenReel.coins', String(coins));
    localStorage.setItem('goldenReel.gear', JSON.stringify(gear));
    localStorage.setItem('goldenReel.log', JSON.stringify(log));
  } catch (err) {}
}
loadSave();

/* ============ Fishing flow ============ */
function beginCast() {
  if (state !== 'idle') return false;
  state = 'casting'; charging = true; charge = 0;
  sfxChargeStart();
  return true;
}
function releaseCast() {
  if (state !== 'casting') return false;
  charging = false;
  const power = Math.max(0.18, charge);
  castD = Math.min(maxCast(gear.line), 8 + power * maxCast(gear.line));
  state = 'flight'; flightT = 0;
  sfxCast();
  return true;
}
function lureLanded() {
  state = 'wait';
  biteT = sampleBiteDelay();
  addRipple(castD, 1);
  splashAt(castD, 1.2);
  sfxSplash();
}
function sampleBiteDelay() {
  // exponential-ish around the lure-scaled mean, clamped for feel
  const mean = biteDelay(gear.lure);
  return Math.max(1.6, Math.min(16, -mean * Math.log(1 - Math.random())));
}
function twitchLure() {
  if (state !== 'wait' || twitchCD > 0) return false;
  twitchCD = 0.8;
  biteT = Math.max(0.8, biteT - 1.1); // twitching entices
  addRipple(castD, 0.5);
  sfxTwitch();
  return true;
}
function pickSpecies() {
  // rare rolls first (gated on lure), then weighted commons whose zone covers castD
  for (const sp of SPECIES) {
    if (!sp.rare) continue;
    if (gear.lure < (sp.minLure || 0)) continue;
    if (castD < sp.zone[0] || castD > sp.zone[1]) continue;
    if (Math.random() < sp.rare * (1 + gear.lure * 0.35)) return sp;
  }
  const pool = SPECIES.filter(sp => !sp.rare && castD >= sp.zone[0] && castD <= sp.zone[1]);
  return pool[Math.floor(Math.random() * pool.length)] || SPECIES[0];
}
function triggerBite() {
  if (state !== 'wait') return false;
  biteSp = pickSpecies();
  state = 'bite'; biteWin = 0.9;
  addRipple(castD, 0.8);
  sfxBite();
  return true;
}
function setHook() {
  if (state !== 'bite') return false;
  const sp = biteSp;
  const w = sp.w[0] + Math.random() * (sp.w[1] - sp.w[0]);
  fight = {
    sp, w: Math.round(w * 10) / 10,
    stam: 0.55 + sp.fight * 0.6 + (w - sp.w[0]) / (sp.w[1] - sp.w[0]) * 0.35,
    mode: 'calm', modeT: 1.2 + Math.random(), tension: 20, dist: castD,
  };
  state = 'fight'; reeling = false;
  sfxHook();
  return true;
}
function missBite() {
  state = 'wait'; biteSp = null;
  biteT = sampleBiteDelay();
  toast = { txt: 'IT GOT AWAY…', t: 1.6 };
  sfxFlee();
}
function fightTick(dt) {
  const f = fight;
  if (!f) return;
  f.modeT -= dt;
  if (f.modeT <= 0) {
    if (f.mode === 'calm' && f.stam > 0) {
      f.mode = 'run';
      f.modeT = (0.7 + Math.random() * 0.8) * Math.min(1.4, 0.5 + f.stam);
      sfxRunStart();
    } else {
      f.mode = 'calm';
      f.modeT = 1.0 + Math.random() * 1.6 + (f.stam <= 0 ? 999 : 0); // spent fish stays calm
    }
  }
  if (f.mode === 'run') {
    f.tension += (reeling ? 60 : 26) * f.sp.fight * dt * (0.8 + f.w * 0.02);
    f.dist = Math.min(100, f.dist + 6.5 * dt);
    f.stam -= dt * 0.28;
  } else {
    f.tension -= (reeling ? 14 : 34) * dt;
    if (reeling) {
      f.dist -= reelSpd(gear.reel) * dt;
      f.tension += 15 * dt;
      f.stam -= dt * 0.1;
    }
  }
  f.tension = Math.max(0, f.tension);
  if (f.tension >= rodMaxT(gear.rod)) { lineSnap(); return; }
  if (f.dist <= 0) { landCatch(); return; }
}
function lineSnap() {
  if (state !== 'fight') return;
  state = 'snap';
  toast = null;
  sfxSnap();
  setTimeout(() => { if (state === 'snap') backToIdle('THE LINE SNAPPED'); }, 1300);
}
function landCatch() {
  if (state !== 'fight') return;
  const f = fight;
  const val = Math.round(f.sp.val * (0.7 + 0.6 * (f.w - f.sp.w[0]) / Math.max(0.001, f.sp.w[1] - f.sp.w[0])));
  coins += val;
  const e = log[f.sp.key] || { n: 0, best: 0 };
  e.n++; e.best = Math.max(e.best, f.w);
  log[f.sp.key] = e;
  save();
  lastCatch = { sp: f.sp, w: f.w, val };
  state = 'caught';
  splashAt(0.5, 1.6);
  sfxCatch(f.sp.rare ? 1 : 0);
  setTimeout(showCatchCard, 700);
}
function backToIdle(msg) {
  state = 'idle'; fight = null; biteSp = null; reeling = false;
  if (msg) toast = { txt: msg, t: 2 };
}
function startFishing() {
  state = 'idle'; fight = null; biteSp = null; reeling = false; charge = 0; charging = false;
  overlayEl.classList.add('hidden');
}

/* ============ Shop ============ */
function buyGear(k) {
  const l = gear[k];
  if (l >= GEAR_DEFS[k].max) return false;
  const cost = gearCost(l);
  if (coins < cost) { sfxDeny(); return false; }
  coins -= cost; gear[k] = l + 1;
  save();
  sfxBuy();
  showShop(); // refresh
  return true;
}

/* ============ Effects helpers ============ */
function addRipple(d, s) { ripples.push({ d, r: 2, max: 26 * s * scl(d), a: 0.8 }); }
function splashAt(d, s) {
  const [px, py] = surfPt(d);
  for (let i = 0; i < 12 * s; i++) {
    splashes.push({
      x: px + (Math.random() - 0.5) * 8, y: py,
      vx: (Math.random() - 0.5) * 60 * s, vy: -(40 + Math.random() * 90) * s,
      t: 0, max: 0.5 + Math.random() * 0.35,
    });
  }
}

/* ============ Canvas / layout ============ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const overlayEl = document.getElementById('overlay');
let W = 390, H = 844, dpr = 1, HY = 320;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  HY = Math.round(H * 0.40);
}
window.addEventListener('resize', resize);
resize();
// world distance d (0..100) → screen point on the water surface + scale
function surfPt(d) {
  const t = d / 100;
  const x = 46 + t * (W - 92) * (0.92 + 0.08 * t);
  const y = HY + Math.pow(1 - t, 1.55) * (H * 0.335);
  return [x, y];
}
function scl(d) { return 0.42 + Math.pow(1 - d / 100, 1.3) * 0.75; }

/* ============ Ambient life ============ */
function seedAmbient() {
  ambient = [];
  for (let i = 0; i < 7; i++) {
    ambient.push({
      d: 12 + Math.random() * 80, x: Math.random() * W, dir: Math.random() < 0.5 ? -1 : 1,
      spd: 8 + Math.random() * 16, wob: Math.random() * 7, size: 0.7 + Math.random() * 0.9,
    });
  }
  fireflies = [];
  for (let i = 0; i < 9; i++) fireflies.push({ x: Math.random() * W * 0.5, y: H * 0.55 + Math.random() * H * 0.3, ph: Math.random() * 7 });
}
seedAmbient();

/* ============ Input ============ */
let usedTouch = false;
function pressStart() {
  audioInit();
  if (state === 'idle') { beginCast(); return; }
  if (state === 'bite') { setHook(); return; }
  if (state === 'fight') { reeling = true; return; }
  if (state === 'wait') { twitchLure(); return; }
}
function pressEnd() {
  if (state === 'casting') { releaseCast(); return; }
  if (state === 'fight') { reeling = false; return; }
}
cv.addEventListener('touchstart', (ev) => { usedTouch = true; pressStart(); ev.preventDefault(); }, { passive: false });
cv.addEventListener('touchend', (ev) => { pressEnd(); ev.preventDefault(); }, { passive: false });
cv.addEventListener('mousedown', () => { if (!usedTouch) pressStart(); });
cv.addEventListener('mouseup', () => { if (!usedTouch) pressEnd(); });

/* ============ Overlays ============ */
function bindTap(el, fn) {
  let last = 0;
  const h = (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    const now = Date.now();
    if (now - last < 400) return;
    last = now;
    audioInit();
    fn();
  };
  el.addEventListener('touchend', h, { passive: false });
  el.addEventListener('click', h);
}
function caughtCount() { return Object.values(log).reduce((a, e) => a + e.n, 0); }
function showMenu() {
  state = 'menu';
  overlayEl.classList.remove('hidden');
  overlayEl.innerHTML = `
    <h1>GOLDEN REEL</h1>
    <div class="sub">DUSK ON STILLWATER LAKE</div>
    <div class="stat">◈ <b>${coins}</b> · CAUGHT <b>${caughtCount()}</b> / SPECIES <b>${Object.keys(log).length}/${SPECIES.length}</b></div>
    <button class="btn" id="go">🎣 FISH</button>
    <button class="btn blue" id="shop">🧰 TACKLE SHOP</button>
    <button class="btn blue" id="logb">📖 CATCH LOG</button>
    <div class="howto">
      <em>Hold</em> to charge the cast, release to send it flying. <em>Tap</em>
      the water to twitch the lure. When the bobber plunges — <em>tap fast</em>
      to set the hook. Then <em>hold to reel</em>, and let go when the fish
      runs, or the line snaps. Far water holds the big ones.
    </div>`;
  bindTap(document.getElementById('go'), startFishing);
  bindTap(document.getElementById('shop'), showShop);
  bindTap(document.getElementById('logb'), showLog);
}
function showShop() {
  state = 'menu';
  overlayEl.classList.remove('hidden');
  let html = `<h2>TACKLE SHOP</h2><div class="sub">◈ ${coins}</div>`;
  for (const k of Object.keys(GEAR_DEFS)) {
    const def = GEAR_DEFS[k], l = gear[k];
    const maxed = l >= def.max;
    html += `<div class="gear-row">
      <div><div class="gname">${def.name} <span style="color:#ffc300">${'▮'.repeat(l)}${'▯'.repeat(def.max - l)}</span></div>
      <div class="gdesc">${def.desc(l)}${maxed ? '' : ' → ' + def.desc(l + 1)}</div></div>
      <button data-g="${k}" class="${maxed ? 'max' : ''}">${maxed ? 'MAX' : '◈ ' + gearCost(l)}</button>
    </div>`;
  }
  html += `<button class="btn" id="backm" style="margin-top:12px">← BACK</button>`;
  overlayEl.innerHTML = html;
  overlayEl.querySelectorAll('[data-g]').forEach(b => bindTap(b, () => buyGear(b.getAttribute('data-g'))));
  bindTap(document.getElementById('backm'), showMenu);
}
function showLog() {
  state = 'menu';
  overlayEl.classList.remove('hidden');
  let html = `<h2>CATCH LOG</h2><div class="sub">BEST WEIGHTS · ${Object.keys(log).length}/${SPECIES.length} SPECIES</div>`;
  for (const sp of SPECIES) {
    const e = log[sp.key];
    html += e
      ? `<div class="log-row"><span class="ln">${sp.name}</span><span class="lv">×${e.n} · BEST ${e.best.toFixed(1)}kg</span></div>`
      : `<div class="log-row unseen"><span class="ln">???</span><span class="lv">${sp.zone[0] >= 60 ? 'FAR WATER' : sp.zone[0] >= 35 ? 'OPEN WATER' : 'NEAR SHORE'}${sp.minLure ? ' · LURE ' + sp.minLure + '+' : ''}</span></div>`;
  }
  html += `<button class="btn" id="backm" style="margin-top:12px">← BACK</button>`;
  overlayEl.innerHTML = html;
  bindTap(document.getElementById('backm'), showMenu);
}
function showCatchCard() {
  if (state !== 'caught' || !lastCatch) return;
  overlayEl.classList.remove('hidden');
  const rare = lastCatch.sp.rare;
  overlayEl.innerHTML = `
    <h2 style="${rare ? 'color:#ffdf70;text-shadow:0 0 34px #ffc300aa' : ''}">${rare ? '✨ ' : ''}${lastCatch.sp.name}${rare ? ' ✨' : ''}</h2>
    <div class="sub">${lastCatch.w.toFixed(1)} KG${log[lastCatch.sp.key] && log[lastCatch.sp.key].best === lastCatch.w ? ' · NEW BEST' : ''}</div>
    <div class="stat">+<b>${lastCatch.val}</b> ◈ · TOTAL <b>${coins}</b></div>
    <button class="btn" id="again">🎣 CAST AGAIN</button>
    <button class="btn blue" id="menu2">⛺ LAKESIDE MENU</button>`;
  bindTap(document.getElementById('again'), startFishing);
  bindTap(document.getElementById('menu2'), showMenu);
}

/* ============ Audio ============ */
let AC = null, sfxGain = null, musicGain = null, musicTimer = null, musicStep = 0, musicNext = 0;
let noiseBuf = null, lapGain = null, reelTickT = 0, chargeOsc = null, chargeGain = null, creakOsc = null, creakGain = null;
let muted = localStorage.getItem('golden-reel-mute') === '1';
const muteBtn = document.getElementById('mute');
muteBtn.textContent = muted ? '🔇' : '🔊';
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {

    f.x += Math.sin(timeNow * 0.7 + f.ph) * 8 * dt;
    f.y += Math.cos(timeNow * 0.5 + f.ph * 2) * 6 * dt;
    const a = Math.max(0, Math.sin(timeNow * 1.3 + f.ph * 3));
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 6);
    g.addColorStop(0, `rgba(220,255,140,${(a * 0.7).toFixed(2)})`);
    g.addColorStop(1, 'rgba(220,255,140,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function drawHUD(dt) {
  const sat = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
  ctx.textAlign = 'left';
  ctx.font = `13px 'Black Ops One', sans-serif`;
  ctx.fillStyle = '#ffc300';
  ctx.shadowColor = 'rgba(0,0,10,0.9)'; ctx.shadowBlur = 5;
  ctx.fillText('◈ ' + coins, 104, sat + 22);
  ctx.font = `10px 'Share Tech Mono', monospace`;
  ctx.fillStyle = '#cdb9d8';
  if (state === 'wait' || state === 'bite' || state === 'fight') ctx.fillText(Math.round(fight ? fight.dist : castD) + 'm OUT', 104, sat + 38);
  ctx.shadowBlur = 0;
  // cast power meter
  if (state === 'casting') {
    const bw = Math.min(220, W * 0.6), bx = (W - bw) / 2, by = H - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab')) || 0) - 64;
    ctx.fillStyle = 'rgba(8,8,18,0.7)';
    ctx.beginPath(); ctx.roundRect(bx - 4, by - 4, bw + 8, 22, 8); ctx.fill();
    const cg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    cg.addColorStop(0, '#39ff14'); cg.addColorStop(0.6, '#ffc300'); cg.addColorStop(1, '#ff2244');
    ctx.fillStyle = cg;
    ctx.fillRect(bx, by, bw * charge, 14);
    ctx.font = `9px 'Share Tech Mono', monospace`;
    ctx.fillStyle = '#dde3ff';
    ctx.textAlign = 'center';
    ctx.fillText('CAST POWER', W / 2, by + 30);
    ctx.textAlign = 'left';
  }
  // fight UI: tension + fish stamina
  if (state === 'fight' && fight) {
    const bw = Math.min(250, W * 0.66), bx = (W - bw) / 2;
    const sab = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab')) || 0;
    const by = H - sab - 96;
    ctx.fillStyle = 'rgba(8,8,18,0.7)';
    ctx.beginPath(); ctx.roundRect(bx - 8, by - 22, bw + 16, 84, 10); ctx.fill();
    // tension
    const tFrac = Math.min(1, fight.tension / rodMaxT(gear.rod));
    ctx.font = `9px 'Share Tech Mono', monospace`;
    ctx.fillStyle = '#8899bb';
    ctx.fillText('LINE TENSION', bx, by - 8);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(bx, by - 2, bw, 12);
    const tg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    tg.addColorStop(0, '#39ff14'); tg.addColorStop(0.62, '#ffc300'); tg.addColorStop(0.85, '#ff2244');
    ctx.fillStyle = tg;
    ctx.fillRect(bx, by - 2, bw * tFrac, 12);
    if (tFrac > 0.85) {
      ctx.strokeStyle = `rgba(255,34,68,${(0.5 + Math.sin(timeNow * 16) * 0.5).toFixed(2)})`;
      ctx.lineWidth = 2;
      ctx.strokeRect(bx - 2, by - 4, bw + 4, 16);
    }
    // fish fight state
    ctx.fillStyle = '#8899bb';
    ctx.fillText(fight.mode === 'run' ? '⚡ IT RUNS — LET GO!' : (fight.stam <= 0 ? '✓ SPENT — REEL IN' : 'HOLD TO REEL'), bx, by + 26);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(bx, by + 32, bw, 8);
    ctx.fillStyle = '#4488ff';
    ctx.fillRect(bx, by + 32, bw * Math.min(1, fight.dist / 100), 8);
    ctx.fillStyle = '#8899bb';
    ctx.fillText('LINE OUT', bx, by + 52);
    // audio: reel ticks + creak follow
    if (reeling && fight.mode === 'calm') {
      reelTickT -= dt;
      if (reelTickT <= 0) { reelTickT = 0.07; sfxCoinTick(); }
    }
    if (creakGain && AC) creakGain.gain.setTargetAtTime(tFrac > 0.7 ? (tFrac - 0.7) * 0.5 : 0, AC.currentTime, 0.1);
    if (creakOsc && AC) creakOsc.frequency.setTargetAtTime(50 + tFrac * 90 + Math.sin(timeNow * 9) * 8, AC.currentTime, 0.05);
  } else if (creakGain && AC) creakGain.gain.setTargetAtTime(0, AC.currentTime, 0.1);
  if (chargeOsc && AC && state === 'casting') chargeOsc.frequency.setTargetAtTime(70 + charge * 260, AC.currentTime, 0.03);
  // idle hint
  if (state === 'idle') {
    ctx.font = `11px 'Share Tech Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(221,227,255,${(0.5 + Math.sin(timeNow * 2.2) * 0.3).toFixed(2)})`;
    ctx.fillText('HOLD TO CHARGE THE CAST', W / 2, H * 0.62);
    ctx.textAlign = 'left';
  }
  if (state === 'snap') {
    ctx.font = `26px 'Black Ops One', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff2244';
    ctx.shadowColor = '#ff2244'; ctx.shadowBlur = 16;
    ctx.fillText('SNAP!', W / 2, H * 0.42);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';
  }
  if (toast && toast.t > 0) {
    toast.t -= dt;
    ctx.globalAlpha = Math.min(1, toast.t / 0.4);
    ctx.font = `13px 'Share Tech Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#dde3ff';
    ctx.shadowColor = 'rgba(0,0,10,0.9)'; ctx.shadowBlur = 6;
    ctx.fillText(toast.txt, W / 2, H * 0.5);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

/* ============ Main loop ============ */
function update(dt) {
  if (twitchCD > 0) twitchCD -= dt;
  if (state === 'casting') charge = Math.min(1, charge + dt / 0.9);
  else if (state === 'flight') {
    flightT += dt / 0.7;
    if (flightT >= 1) lureLanded();
  } else if (state === 'wait') {
    biteT -= dt;
    if (biteT <= 0) triggerBite();
  } else if (state === 'bite') {
    biteWin -= dt;
    if (biteWin <= 0) missBite();
  } else if (state === 'fight') {
    fightTick(dt);
  }
}
function frame(ts) {
  const dt = Math.min(0.1, (ts - lastT) / 1000 || 0.016);
  lastT = ts; timeNow = ts / 1000;
  update(dt);
  draw(dt);
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
</script>
</body>
