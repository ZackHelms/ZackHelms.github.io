<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap');

  --bg:#06060e; --panel:#0b0b16; --border:#1a1a30;
  --green:#39ff14; --gold:#ffc300; --blue:#4488ff; --red:#ff2244;

}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--white);

  position:fixed; inset:0;
}
#cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
#back-btn {
  position:absolute; top:calc(var(--sat) + 8px); left:10px; z-index:30;
  background:rgba(11,11,22,0.75); border:1px solid var(--border); border-radius:6px;

#overlay {
  position:absolute; inset:0; z-index:20; display:flex;

  padding-top:calc(var(--sat) + 20px); padding-bottom:calc(var(--sab) + 20px);

#overlay.hidden { display:none; }
#overlay h1 {

}

<body>
<div id="build-badge" style="position:fixed;top:2px;right:6px;z-index:2147483647;font-family:'Courier New',monospace;font-size:9px;color:#888;opacity:0.55;pointer-events:none;letter-spacing:0.5px;user-select:none;">build 2026-07-25 02:36 UTC</div>
<a id="back-btn" href="../index.html" aria-label="Back to games">←</a>
<button id="mute">🔊</button>
<canvas id="cv"></canvas>
<div id="overlay"></div>
<script>
'use strict';
/* =====================================================================
   VAULT BREAKER — pinch-rotate safecracking. Twist two fingers (or drag
   one around the dial) to spin the mechanism through three lock phases:
   set the tumbler pins (direction + sweet spot + steady hold), align the
   ring gaps to the keyway, then spin the handle. Beat the alarm timer.
   Realistic rendering: brushed steel, machined dial, specular sweeps,
   riveted door, golden vault-interior payoff.
   ===================================================================== */

/* ============ Level generation (seeded per vault) ============ */
let rngS = 1;
function rnd() { rngS = (rngS * 1103515245 + 12345) & 0x7fffffff; return rngS / 0x7fffffff; }
function norm(a) { a %= 360; if (a > 180) a -= 360; if (a < -180) a += 360; return a; }
let level = 1;
let vault = null; // {pins:[{target,dir,set}], pinTol, rings:[{gap,drift,locked}], ringTol, time}
function genVault(n) {
  rngS = (n * 7919 + 13) & 0x7fffffff;
  const nPins = Math.min(5, 2 + Math.floor(n / 2));
  const pinTol = Math.max(3.5, 7 - n * 0.35);
  const pins = [];
  let prev = 0;
  for (let i = 0; i < nPins; i++) {
    let t = 30 + rnd() * 300;
    if (Math.abs(norm(t - prev)) < 40) t = (t + 80) % 360;
    pins.push({ target: t, dir: i % 2 === 0 ? 1 : -1, set: false });
    prev = t;
  }
  const nRings = Math.min(5, 2 + Math.floor((n - 1) / 3));
  const ringTol = Math.max(5, 9 - n * 0.4);
  const rings = [];
  for (let i = 0; i < nRings; i++) {
    rings.push({
      gap: 40 + rnd() * 280,
      drift: (n >= 5 && i % 2 === 1) ? (rnd() < 0.5 ? -1 : 1) * Math.min(12, 3 + n * 0.5) : 0,
      locked: false,
    });
  }
  const time = Math.round((40 + nPins * 9 + nRings * 7) * Math.max(0.6, 1 - n * 0.02));
  vault = { pins, pinTol, rings, ringTol, time };
}

/* ============ State (top-level: reachable from page.evaluate) ============ */
let state = 'menu';      // menu | play | open | alarm
let phase = 'pins';      // pins | rings | handle
let dialAngle = 0;       // current dial rotation (deg)
let rotVel = 0;          // recent rotation speed deg/s (decayed)
let lastDir = 0;         // sign of last rotation delta
let pinIdx = 0;
let ringIdx = 0;
let holdT = 0;
let handCW = 0, handCCW = 0;
let timeLeft = 60;
let openT = 0;           // door-open animation
let alarmT = 0;
let shakeT = 0;
let sparks = [];
let toast = null;

function maxLevel() { return parseInt(localStorage.getItem('vaultBreaker.level') || '1', 10) || 1; }
function starsFor(n) { try { return (JSON.parse(localStorage.getItem('vaultBreaker.stars') || '{}'))[n] || 0; } catch (err) { return 0; } }
function totalStars() { try { const s = JSON.parse(localStorage.getItem('vaultBreaker.stars') || '{}'); return Object.values(s).reduce((a, b) => a + b, 0); } catch (err) { return 0; } }
function persistWin(n, stars) {
  try {
    if (n + 1 > maxLevel()) localStorage.setItem('vaultBreaker.level', String(n + 1));
    const s = JSON.parse(localStorage.getItem('vaultBreaker.stars') || '{}');
    if (stars > (s[n] || 0)) { s[n] = stars; localStorage.setItem('vaultBreaker.stars', JSON.stringify(s)); }
  } catch (err) {}
}

/* ============ Core rotation logic ============ */
function rotate(delta) {
  if (state !== 'play') return;
  if (Math.abs(delta) > 45) delta = Math.sign(delta) * 45; // gesture glitch guard
  dialAngle = (dialAngle + delta) % 360;
  if (dialAngle < 0) dialAngle += 360;
  rotVel = rotVel * 0.6 + (delta * 60) * 0.4; // rough deg/s estimate
  if (delta !== 0) lastDir = Math.sign(delta);
  if (phase === 'rings' && vault.rings[ringIdx] && !vault.rings[ringIdx].locked) {
    vault.rings[ringIdx].gap = ((vault.rings[ringIdx].gap + delta) % 360 + 360) % 360;
  }
  if (phase === 'handle') {
    if (delta > 0) { handCW += delta; handCCW = 0; }
    else if (delta < 0) { handCCW -= delta; handCW = 0; }
    tickRatchet(Math.abs(delta));
    if (handCW >= 270 || handCCW >= 270) vaultOpen();
    return;
  }
  tickRatchet(Math.abs(delta));
}
function pinError() {
  const p = vault.pins[pinIdx];
  return p ? norm(dialAngle - p.target) : 999;
}
function ringError() {
  const r = vault.rings[ringIdx];
  return r ? norm(r.gap) : 999; // keyway at top = 0
}
function update(dt) {
  if (state === 'open') { openT += dt; return; }
  if (state === 'alarm') { alarmT += dt; return; }
  if (state !== 'play') return;
  timeLeft -= dt;
  if (timeLeft <= 0) { triggerAlarm(); return; }
  rotVel *= Math.exp(-dt * 7);
  // drifting rings
  if (phase === 'rings') {
    vault.rings.forEach((r, i) => {
      if (!r.locked && r.drift && i === ringIdx) r.gap = ((r.gap + r.drift * dt) % 360 + 360) % 360;
    });
  }
  const steady = Math.abs(rotVel) < 26;
  if (phase === 'pins') {
    const p = vault.pins[pinIdx];
    if (p && Math.abs(pinError()) <= vault.pinTol && steady && (lastDir === p.dir || lastDir === 0)) {
      holdT += dt;
      if (holdT >= 0.45) setPin();
    } else holdT = 0;
  } else if (phase === 'rings') {
    const r = vault.rings[ringIdx];
    if (r && Math.abs(ringError()) <= vault.ringTol && steady) {
      holdT += dt;
      if (holdT >= 0.4) lockRing();
    } else holdT = 0;
  }
}
function setPin() {
  const p = vault.pins[pinIdx];
  if (!p || p.set) return;
  p.set = true;
  pinIdx++;
  holdT = 0; lastDir = 0; shakeT = 0.2;
  sparkBurst(0, -R() * 1.02, '#ffd070');
  sfxPinSet();
  if (pinIdx >= vault.pins.length) {
    phase = 'rings'; ringIdx = 0;
    toast = { txt: 'TUMBLER OPEN — ALIGN THE RINGS', t: 2.2 };
    sfxPhase();
  }
}
function lockRing() {
  const r = vault.rings[ringIdx];
  if (!r || r.locked) return;
  r.locked = true; r.gap = 0;
  ringIdx++;
  holdT = 0; shakeT = 0.25;
  sparkBurst(0, -ringR(vault.rings.indexOf(r)), '#9cc6e8');
  sfxRingLock();
  if (ringIdx >= vault.rings.length) {
    phase = 'handle'; handCW = 0; handCCW = 0;
    toast = { txt: 'SPIN THE HANDLE!', t: 2.2 };
    sfxPhase();
  }
}
function vaultOpen() {
  if (state !== 'play') return;
  state = 'open'; openT = 0;
  const frac = timeLeft / vault.time;
  const stars = frac > 0.5 ? 3 : frac > 0.25 ? 2 : 1;
  persistWin(level, stars);
  sfxOpen();
  setTimeout(() => showWin(stars), 1700);
}
function triggerAlarm() {
  if (state !== 'play') return;
  state = 'alarm'; alarmT = 0; timeLeft = 0;
  sfxAlarm();
  setTimeout(showAlarm, 1600);
}
function startVault(n) {
  level = n;
  genVault(n);
  state = 'play'; phase = 'pins';
  dialAngle = 0; rotVel = 0; lastDir = 0;
  pinIdx = 0; ringIdx = 0; holdT = 0; handCW = 0; handCCW = 0;
  timeLeft = vault.time; openT = 0; alarmT = 0;
  toast = { txt: vault.pins.length + ' PINS · LISTEN FOR THE CLICKS', t: 2.4 };
  overlayEl.classList.add('hidden');
}

/* ============ Sparks ============ */
function sparkBurst(dx, dy, col) {
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 140;
    sparks.push({
      x: CX() + dx, y: CY() + dy,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      t: 0, max: 0.35 + Math.random() * 0.35, col,
    });
  }
}

/* ============ Canvas / layout ============ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const overlayEl = document.getElementById('overlay');
let W = 390, H = 844, dpr = 1;
let doorCv = null;
function CX() { return W / 2; }
function CY() { return H * 0.46; }
function R() { return Math.min(W * 0.42, H * 0.26); }
function ringR(i) { return R() * (0.34 + 0.16 * i); }
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildDoor();
}
window.addEventListener('resize', resize);

/* ============ Pre-rendered vault door (brushed steel + rivets) ============ */
function buildDoor() {
  doorCv = document.createElement('canvas');
  doorCv.width = Math.round(W * dpr); doorCv.height = Math.round(H * dpr);
  const g = doorCv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  // ambient room behind (revealed at door edges)
  g.fillStyle = '#05050c';
  g.fillRect(0, 0, W, H);
  // door plate
  const m = 10;
  const plate = g.createLinearGradient(0, 0, W, H);
  plate.addColorStop(0, '#3d4350');
  plate.addColorStop(0.35, '#2b303c');
  plate.addColorStop(0.6, '#3a404d');
  plate.addColorStop(1, '#20242e');
  g.fillStyle = plate;
  g.beginPath(); g.roundRect(m, m, W - m * 2, H - m * 2, 18); g.fill();
  // brushed radial texture around dial center
  g.save();
  g.beginPath(); g.roundRect(m, m, W - m * 2, H - m * 2, 18); g.clip();
  for (let i = 0; i < 900; i++) {
    const a = Math.random() * Math.PI * 2;
    const r0 = R() * 0.5 + Math.random() * Math.max(W, H) * 0.75;
    const len = 6 + Math.random() * 30;
    const x0 = CX() + Math.cos(a) * r0, y0 = CY() + Math.sin(a) * r0;
    g.strokeStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.03)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(x0, y0);
    g.lineTo(x0 + Math.cos(a + Math.PI / 2) * len, y0 + Math.sin(a + Math.PI / 2) * len);
    g.stroke();
  }
  // scratches
  for (let i = 0; i < 26; i++) {
    const x0 = Math.random() * W, y0 = Math.random() * H;
    const a = Math.random() * Math.PI * 2, len = 12 + Math.random() * 46;
    g.strokeStyle = `rgba(${Math.random() < 0.5 ? '220,228,240' : '8,10,16'},${(0.04 + Math.random() * 0.05).toFixed(2)})`;
    g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + Math.cos(a) * len, y0 + Math.sin(a) * len); g.stroke();
  }
  g.restore();
  // beveled edge
  g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 2;
  g.beginPath(); g.roundRect(m + 1, m + 1, W - m * 2 - 2, H - m * 2 - 2, 17); g.stroke();
  g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 3;
  g.beginPath(); g.roundRect(m + 4, m + 4, W - m * 2 - 8, H - m * 2 - 8, 15); g.stroke();
  // rivets around border
  const riv = (x, y, r) => {
    const rg = g.createRadialGradient(x - r * 0.35, y - r * 0.4, 0, x, y, r);
    rg.addColorStop(0, '#d8dfea'); rg.addColorStop(0.35, '#8a93a4'); rg.addColorStop(1, '#2a2f3a');
    g.fillStyle = rg;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.beginPath(); g.arc(x, y + r * 0.7, r * 0.7, 0, Math.PI); g.fill();
  };
  const step = 46;
  for (let x = m + 24; x < W - m - 18; x += step) { riv(x, m + 22, 5); riv(x, H - m - 22, 5); }
  for (let y = m + 22 + step; y < H - m - 40; y += step) { riv(m + 22, y, 5); riv(W - m - 22, y, 5); }
  // corner plates
  for (const [px, py] of [[m + 14, m + 14], [W - m - 74, m + 14], [m + 14, H - m - 74], [W - m - 74, H - m - 74]]) {
    g.fillStyle = 'rgba(255,255,255,0.045)';
    g.beginPath(); g.roundRect(px, py, 60, 60, 8); g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 1;
    g.beginPath(); g.roundRect(px, py, 60, 60, 8); g.stroke();
  }
  // hinge blocks on the right
  for (const hy of [H * 0.22, H * 0.72]) {
    const hg = g.createLinearGradient(W - m - 14, 0, W - m + 4, 0);
    hg.addColorStop(0, '#4a515f'); hg.addColorStop(1, '#161a22');
    g.fillStyle = hg;
    g.beginPath(); g.roundRect(W - m - 12, hy, 14, 64, 4); g.fill();
  }
  // engraved maker plate
  g.fillStyle = 'rgba(10,12,18,0.5)';
  g.beginPath(); g.roundRect(CX() - 74, H - m - 56, 148, 30, 6); g.fill();
  g.font = "11px 'Black Ops One', sans-serif";
  g.textAlign = 'center';
  g.fillStyle = 'rgba(180,192,210,0.5)';
  g.fillText('ZMH SAFE & TRUST CO.', CX(), H - m - 37);
}
resize();

/* ============ Input: two-finger twist + one-finger drag-around ============ */
let touchMode = null;   // 'pinch' | 'drag' | null
let lastPinchA = 0, lastDragA = 0;
let usedTouch = false;
function angBetween(t0, t1) { return Math.atan2(t1.clientY - t0.clientY, t1.clientX - t0.clientX) * 180 / Math.PI; }
function angFromCenter(t) { return Math.atan2(t.clientY - CY(), t.clientX - CX()) * 180 / Math.PI; }
cv.addEventListener('touchstart', (ev) => {
  usedTouch = true; audioInit();
  if (ev.touches.length >= 2) {
    touchMode = 'pinch';
    lastPinchA = angBetween(ev.touches[0], ev.touches[1]);
  } else if (ev.touches.length === 1) {
    touchMode = 'drag';
    lastDragA = angFromCenter(ev.touches[0]);
  }
  ev.preventDefault();
}, { passive: false });
cv.addEventListener('touchmove', (ev) => {
  if (touchMode === 'pinch' && ev.touches.length >= 2) {
    const a = angBetween(ev.touches[0], ev.touches[1]);
    rotate(norm(a - lastPinchA));
    lastPinchA = a;
  } else if (touchMode === 'drag' && ev.touches.length === 1) {
    const a = angFromCenter(ev.touches[0]);
    rotate(norm(a - lastDragA));
    lastDragA = a;
  }
  ev.preventDefault();
}, { passive: false });
cv.addEventListener('touchend', (ev) => {
  if (ev.touches.length >= 2) lastPinchA = angBetween(ev.touches[0], ev.touches[1]);
  else if (ev.touches.length === 1) { touchMode = 'drag'; lastDragA = angFromCenter(ev.touches[0]); }
  else touchMode = null;
  ev.preventDefault();
}, { passive: false });
let mouseDown = false;
cv.addEventListener('mousedown', (ev) => { if (!usedTouch) { audioInit(); mouseDown = true; lastDragA = angFromCenter(ev); } });
cv.addEventListener('mousemove', (ev) => { if (!usedTouch && mouseDown) { const a = angFromCenter(ev); rotate(norm(a - lastDragA)); lastDragA = a; } });
window.addEventListener('mouseup', () => { mouseDown = false; });

/* ============ Overlays ============ */
function bindTap(el, fn) {
  let last = 0;
  const h = (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    const now = Date.now();
    if (now - last < 400) return;
    last = now;
    audioInit();
    fn();
  };
  el.addEventListener('touchend', h, { passive: false });
  el.addEventListener('click', h);
}
function showMenu() {
  state = 'menu';
  overlayEl.classList.remove('hidden');
  const ml = maxLevel();
  let html = `
    <h1>VAULT BREAKER</h1>
    <div class="sub">TWIST · LISTEN · CRACK</div>
    <div class="stat">★ <b>${totalStars()}</b> · HIGHEST VAULT <b>${ml}</b></div>
    <button class="btn gold" id="go">🔐 CRACK VAULT ${ml}</button>
    <div class="vault-grid">`;
  const show = Math.min(12, ml + 1);
  for (let i = 1; i <= show; i++) {
    const locked = i > ml;
    const st = starsFor(i);
    html += `<button class="vcell ${locked ? 'locked' : ''}" data-v="${i}" ${locked ? 'disabled' : ''}>${i}<small>${locked ? '🔒' : (st ? '★'.repeat(st) : '·')}</small></button>`;
  }
  html += `</div>
    <div class="howto">
      <em>Twist two fingers</em> — or drag one around the dial — to turn the
      mechanism. Set each <em>pin</em>: follow the arrow's direction to the
      sweet spot (the ticks quicken) and <em>hold steady</em>. Then align
      every ring's gap to the top keyway. Then spin the handle. The alarm
      timer is always running.
    </div>`;
  overlayEl.innerHTML = html;
  bindTap(document.getElementById('go'), () => startVault(maxLevel()));
  overlayEl.querySelectorAll('[data-v]').forEach(b => {
    if (!b.disabled) bindTap(b, () => startVault(parseInt(b.getAttribute('data-v'), 10)));
  });
}
function showWin(stars) {
  overlayEl.classList.remove('hidden');
  overlayEl.innerHTML = `
    <h2>VAULT ${level} CRACKED</h2>
    <div class="sub">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)} · ${Math.ceil(timeLeft)}s TO SPARE</div>
    <div class="stat">TOTAL ★ <b>${totalStars()}</b></div>
    <button class="btn gold" id="next">🔐 VAULT ${level + 1}</button>
    <button class="btn" id="menu2">⌂ MENU</button>`;
  bindTap(document.getElementById('next'), () => startVault(level + 1));
  bindTap(document.getElementById('menu2'), showMenu);
}
function showAlarm() {
  overlayEl.classList.remove('hidden');
  overlayEl.innerHTML = `
    <h2 style="color:#ff2244;text-shadow:0 0 26px #ff224466">SILENT ALARM</h2>
    <div class="sub">THE GUARDS ARE COMING — VAULT ${level} HOLDS</div>
    <button class="btn gold" id="retry">🔐 TRY AGAIN</button>
    <button class="btn" id="menu2">⌂ MENU</button>`;
  bindTap(document.getElementById('retry'), () => startVault(level));

function frame(ts) {
  const dt = Math.min(0.1, (ts - lastT) / 1000 || 0.016);
  lastT = ts; timeNow = ts / 1000;
  update(dt);
  draw(dt);
  requestAnimationFrame(frame);
}
genVault(1);
showMenu();
requestAnimationFrame(frame);
</script>
